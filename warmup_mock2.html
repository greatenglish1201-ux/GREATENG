<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>대단한영어 수능 직전 워밍업 모의고사 2회</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
/* 실제 수능 문제지 배치: A3 세로 한 쪽에 2단, 단마다 위·아래 두 문항. 서체는 원본(신명조·Times New Roman·태고딕) 대체 서체 */
:root{
  --desk:#e4e6e9; --paper:#fff; --ink:#000; --muted:#555; --ui:#24557f;
  --f-en:"Times New Roman",Times,"Liberation Serif","Nimbus Roman",serif;
  --f-my:"HCR Batang","함초롬바탕","Batang","바탕","Nanum Myeongjo","Noto Serif KR",serif;
  --f-go:"HY견고딕","HYGothic-Extra","Malgun Gothic","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--f-my);padding:14px 16px 40px}
.bar{max-width:297mm;margin:0 auto 10px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-family:"Noto Sans KR",sans-serif}
.bar h1{font-size:18px;margin:0 auto 0 0}
.chip{font:inherit;font-size:13px;border:1px solid #999;background:#fff;color:#111;padding:6px 14px;border-radius:999px;cursor:pointer;text-decoration:none}
.chip[aria-pressed="true"]{background:var(--ui);border-color:var(--ui);color:#fff}
.chip.prt{border-color:var(--ui);color:var(--ui);font-weight:700}
.chip:focus-visible{outline:2px solid var(--ui);outline-offset:2px}
.hint{max-width:297mm;margin:0 auto 12px;color:var(--muted);font-size:12.5px;line-height:1.6;font-family:"Noto Sans KR",sans-serif}
.scroller{overflow-x:auto}
.sheetwrap{width:max-content;margin:0 auto}
.a4box{width:210mm;height:297mm;overflow:hidden;margin:0 auto 16px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.a4box .page{transform:scale(.70707);transform-origin:0 0;margin:0;box-shadow:none}
/* A4: 여백을 줄인 가상 쪽(256×362mm)에 배치한 뒤 0.82배로 축소 → 글씨가 A3 축소본보다 약 16% 큼 */
.page.v4{width:256mm;height:362.2mm;padding:7mm 7mm 4mm}
.page.v4 .cols{column-gap:10mm}
.a4box .page.v4{transform:scale(.8203)}

/* 쪽(A3) */
.page{width:297mm;height:420mm;margin:0 auto 16px;background:var(--paper);box-shadow:0 1px 4px rgba(0,0,0,.2);
  padding:16mm 30mm 10mm;display:flex;flex-direction:column}
.ph{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;padding-bottom:2.2mm;border-bottom:1.6px solid var(--ink)}
.ph .l{justify-self:start}.ph .r{justify-self:end}
.ph .area{font-family:var(--f-go);font-weight:900;font-size:30pt;letter-spacing:-.02em;line-height:1}
.ph .pn{font-family:var(--f-en);font-weight:700;font-size:32pt;line-height:.9}
.hol{font-family:var(--f-go);font-weight:900;font-size:15pt;border:1.4px solid var(--ink);border-radius:2.2mm;padding:.6mm 2mm;line-height:1.2}
.cover{border-bottom:1.6px solid var(--ink);padding-bottom:2mm}
.cover .t1{display:grid;grid-template-columns:1fr auto 1fr;align-items:end}
.cover .t1 .brand{font-weight:900;margin-right:2mm}
.cover .t1 .ttl{font-family:var(--f-go);font-weight:500;font-size:15pt;letter-spacing:-.01em}
.cover .t1 .pn{justify-self:end;font-family:var(--f-en);font-weight:700;font-size:32pt;line-height:.9}
.cover .t2{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-top:2mm}
.cover .gyo{justify-self:start;font-family:var(--f-my);font-size:13pt;border:1.2px solid var(--ink);border-radius:999px;padding:.6mm 4mm}
.cover .area{font-family:var(--f-go);font-weight:900;font-size:34pt;letter-spacing:-.02em;line-height:1}
.cover .hol{justify-self:end}
.cover .id{display:flex;gap:8mm;justify-content:center;margin-top:3mm;font-family:var(--f-my);font-size:11pt;align-items:center}
.cover .id span.box{display:inline-block;border:1px solid var(--ink);width:38mm;height:7mm;vertical-align:middle;margin-left:2mm}
.cover .id span.box.w{width:52mm}

.cols{flex:1;display:grid;grid-template-columns:1fr 1fr;column-gap:16mm;position:relative;min-height:0;margin-top:3.2mm}
.cols::before{content:"";position:absolute;left:50%;top:-3.2mm;bottom:0;border-left:1.2px solid var(--ink)}
.col{overflow:hidden;min-width:0;height:100%}
.pf{display:flex;justify-content:center;padding-top:3mm}
.pf svg{display:block}
.copy{font-family:var(--f-my);font-size:8.5pt;color:#333;text-align:center;margin-top:1.5mm}

/* 문항 */
.blk{margin:0}
.gap{height:7mm}
.qp{font-family:var(--f-my);font-size:11.2pt;line-height:1.55;margin-bottom:2.4mm;padding-left:7mm;text-indent:-7mm;word-break:keep-all}
.qp b.num{font-family:var(--f-en);font-size:13.5pt;font-weight:700;margin-right:1.6mm;letter-spacing:-.02em}
.qp u,.tx u,.bx u,.nb u{text-decoration-thickness:.6px;text-underline-offset:2px}
.qp .en{font-family:var(--f-en);font-size:11.8pt}
.qp.ghead{text-indent:0;padding-left:0}
.qp.ghead b.gr{font-family:var(--f-en);font-weight:700;font-size:12.5pt;margin-right:1.4mm}
.tx{font-family:var(--f-en);font-size:11.6pt;line-height:17.4pt;text-align:justify;text-indent:6mm;margin:0;hyphens:manual}
.tx.first{text-indent:0}
.p3{white-space:nowrap}
.tx.first b.num{font-size:13.5pt;margin-right:1.6mm}
.tx.order{text-indent:-6mm;padding-left:6mm;margin-top:1.6mm}
.tx.order b{font-weight:400}
.tx.lab{text-indent:0;text-align:center;margin:2mm 0 1mm}
.tx.lab u{text-decoration:none}
.bx{font-family:var(--f-en);font-size:11.6pt;line-height:17.4pt;text-align:justify;border:1px solid var(--ink);padding:2mm 3mm;margin:0 0 2.2mm}
.bx.plain{border:none;padding:0;text-indent:6mm;margin:0}
.ft{font-family:var(--f-my);font-size:9.6pt;text-align:right;margin:1.6mm 0 2.4mm;white-space:pre-wrap}
.bl{display:inline-block;min-width:36mm;border-bottom:1px solid var(--ink);margin:0 1mm}
.arrow{display:block;text-align:center;font-size:14pt;margin:1mm 0}
img.fig{display:block;width:100%;margin:0 0 2.4mm}
.nb{border:1px solid var(--ink);padding:2.6mm 4mm;font-family:var(--f-en);font-size:11.2pt;line-height:16.4pt;margin:0 0 2.4mm}
.nb .nt{text-align:center;font-weight:700;font-size:13pt;margin-bottom:1.6mm}
.nb p{margin:0 0 1.2mm}
.nb .nh{font-weight:700;margin-bottom:.4mm}
.nb .li{padding-left:4.6mm;text-indent:-3mm}
.nb .li2{padding-left:8.4mm;text-indent:-2.6mm}
.nb .li0{padding-left:4mm;text-indent:-4mm}
.nb .li:last-child,.nb .li2:last-child,.nb .li0:last-child{margin-bottom:1.2mm}
.nb table.nt2{border-collapse:collapse;width:100%;margin:.6mm 0 1.4mm;text-align:center}
.nb table.nt2 th,.nb table.nt2 td{border:1px solid var(--ink);padding:.3mm 1.5mm;font-weight:400}
.nb table.nt2 tr:first-child th:first-child{border-top-color:transparent;border-left-color:transparent}
ol.ch{list-style:none;margin:2.2mm 0 0;padding:0 0 0 1.6mm;font-size:11.2pt;line-height:16.2pt}
ol.ch li{display:flex;gap:1.6mm;font-family:var(--f-en)}
ol.ch li.ko{font-family:var(--f-my);letter-spacing:-.03em}
ol.ch li .m{flex:0 0 auto;width:5mm;font-family:var(--f-my)}
ol.ch.inl{display:flex;justify-content:space-around;padding:0 8mm;margin-top:3mm}
ol.ch.sum li span.a,ol.ch.sum li span.b{display:inline-block;width:36mm}
ol.ch.sum .hd{font-family:var(--f-en)}
.from{font-family:"Noto Sans KR",var(--f-go);font-size:8.6pt;color:#444;text-align:right;margin-top:1.4mm}
.guide{font-family:var(--f-go);font-weight:500;font-size:12.5pt;line-height:1.55;border:1px solid var(--ink);padding:2.4mm 4mm;margin-bottom:6mm;text-indent:3mm}
.endnote{font-family:var(--f-go);font-weight:500;font-size:11.5pt;line-height:1.5;border:1px solid var(--ink);padding:2mm 4mm;margin-top:6mm}

@media print{
  body{background:#fff;padding:0}
  .bar,.hint{display:none}
  .scroller{overflow:visible}
  .page{margin:0;box-shadow:none;break-after:page}
  .page:last-child{break-after:auto}
  .a4box{margin:0;box-shadow:none;break-after:page}
  .a4box:last-child{break-after:auto}
  .a4box .page{break-after:auto}
}
</style>
<style id="pagesize">@page{size:A3;margin:0}</style>

<script>
const ITEMS = [{"n": 18, "pts": 2, "kind": "글의 목적", "src": "2025학년도 수능 18번", "prompt": "다음 글의 목적으로 가장 적절한 것은?", "body": ["<div class=\"bx\"><p style=\"margin:0\">Dear Rosydale City Marathon Racers,<\/p><p style=\"margin:0;text-indent:6mm\">We are really grateful to all of you who have signed up for the 10th Rosydale City Marathon that was scheduled for this coming Saturday at 10 a.m. Unfortunately, as you may already know, the weather forecast says that there is going to be a downpour throughout the race day. We truly hoped that the race would go smoothly. However, it is likely that the heavy rain will make the roads too slippery and dangerous for the racers to run safely. As a result, we have decided to cancel the race. We hope you understand and we promise to hold another race in the near future.<\/p><p style=\"margin:0\">Sincerely,<br>Martha Kingsley<br>Race Manager<\/p><\/div>"], "choices": ["마라톤 경기 취소 사실을 공지하려고", "마라톤 경기 사전 행사 참여를 독려하려고", "마라톤 경기 참가비 환불 절차를 설명하려고", "마라톤 경기 참여 시 규칙 준수를 당부하려고", "마라톤 경기 진행에 따른 도로 통제를 안내하려고"], "inline": false, "ans": "①", "sol": "we have decided to cancel the race(경기를 취소하기로 했다)가 목적. 폭우 예보·미끄러운 도로는 취소 이유, 마지막 문장(다시 대회를 열겠다)은 덧붙인 말."}, {"n": 19, "pts": 2, "kind": "심경 변화", "src": "2024학년도 수능 19번", "prompt": "다음 글에 드러난 David의 심경 변화로 가장 적절한 것은?", "body": ["<div class=\"tx\">David was starting a new job in Vancouver, and he was waiting for his bus. He kept looking back and forth between his watch and the direction the bus would come from. He thought, “My bus isn’t here yet. I can’t be late on my first day.” David couldn’t feel at ease. When he looked up again, he saw a different bus coming that was going right to his work. The bus stopped in front of him and opened its door. He got on the bus thinking, “Phew! Luckily, this bus came just in time so I won’t be late.” He leaned back on an unoccupied seat in the bus and took a deep breath, finally able to relax.<\/div>"], "choices": ["nervous → relieved", "lonely → hopeful", "pleased → confused", "indifferent → delighted", "bored → thrilled"], "inline": false, "ans": "①", "sol": "앞: He kept looking back and forth between his watch …, I can’t be late, couldn’t feel at ease → 초조. 뒤: Phew! Luckily …, took a deep breath, finally able to relax → 안도. 전환은 다른 버스가 온 순간."}, {"n": 20, "pts": 2, "kind": "필자 주장", "src": "2022학년도 수능 20번", "prompt": "다음 글에서 필자가 주장하는 바로 가장 적절한 것은?", "body": ["<div class=\"tx\">One of the most common mistakes made by organizations when they first consider experimenting with social media is that they focus too much on social media tools and platforms and not enough on their business objectives. The reality of success in the social web for businesses is that creating a social media program begins not with insight into the latest social media tools and channels but with a thorough understanding of the organization’s own goals and objectives. A social media program is not merely the fulfillment of a vague need to manage a “presence” on popular social networks because “everyone else is doing it.” “Being in social media” serves no purpose in and of itself. In order to serve any purpose at all, a social media presence must either solve a problem for the organization and its customers or result in an improvement of some sort (preferably a measurable one). In all things, purpose drives success. The world of social media is no different.<\/div>"], "choices": ["기업 이미지에 부합하는 소셜 미디어를 직접 개발하여 운영해야 한다.", "기업은 사회적 가치와 요구를 반영하여 사업 목표를 수립해야 한다.", "기업은 소셜 미디어를 활용할 때 사업 목표를 토대로 해야 한다.", "소셜 미디어로 제품을 홍보할 때는 구체적인 정보를 제공해야 한다.", "소비자의 의견을 수렴하기 위해 소셜 미디어를 적극 활용해야 한다."], "inline": false, "ans": "③", "sol": "소셜 미디어를 시작할 때 도구·플랫폼이 아니라 조직의 목표(business objectives)에서 출발해야 한다. creating a social media program begins … with a thorough understanding of the organization’s own goals and objectives, purpose drives success → ③."}, {"n": 21, "pts": 2, "kind": "함축 의미", "src": "2026학년도 수능 21번", "prompt": "밑줄 친 <u>made a lot of work less sticky<\/u>가 다음 글에서 의미하는 바로 가장 적절한 것은?", "body": ["<div class=\"tx\">Digital platforms have <u>made a lot of work less sticky<\/u>. As work becomes ever more modularised, commoditised and standardised, and as markets for digital work are created, ties between service work and particular places can be disconnected. While the business process of outsourcing that emerged in the 1990s allowed large companies to take advantage of a ‘global reserve army’ by moving their call centres to cheap and distant labour markets, cloudwork changes the volume and granularity at which geographically non-proximate work can take place. A small business in New York can hire a freelance transcriber in Nairobi one day and New Delhi the next. No offices or factories need to be built, no local regulations are observed, and ― in most cases ― no local taxes are paid. The switch in the production network of work happens by simply sending some emails or clicking some buttons on a digital work platform. And, in this way, the employer leaves behind no material traces in the places where it was once an employer.<\/div>", "<div class=\"ft\">* commoditise: 상품화하다 ** granularity: 과립상(顆粒狀)<\/div>"], "choices": ["settled the locational dilemma of the global markets", "elevated the spatial flexibility in conducting business", "weakened the geographical expansion of local business", "relieved the strict legal processes of regional outsourcing", "allowed business to be less complicated in its hiring process"], "inline": false, "ans": "②", "sol": "sticky = 일이 특정 장소에 '붙어 있는' 성질. 디지털 플랫폼 덕분에 서비스 일과 특정 장소의 연결이 끊어졌다(ties between service work and particular places can be disconnected) — 뉴욕의 회사가 오늘은 나이로비, 내일은 뉴델리의 프리랜서를 고용한다 → ② 사업을 하는 데 공간적 유연성을 높였다."}, {"n": 22, "pts": 2, "kind": "글의 요지", "src": "2023학년도 수능 22번", "prompt": "다음 글의 요지로 가장 적절한 것은?", "body": ["<div class=\"tx\">Urban delivery vehicles can be adapted to better suit the density of urban distribution, which often involves smaller vehicles such as vans, including bicycles. The latter have the potential to become a preferred ‘last-mile’ vehicle, particularly in high-density and congested areas. In locations where bicycle use is high, such as the Netherlands, delivery bicycles are also used to carry personal cargo (e.g. groceries). Due to their low acquisition and maintenance costs, cargo bicycles convey much potential in developed and developing countries alike, such as the <i>becak<\/i> (a three-wheeled bicycle) in Indonesia. Services using electrically assisted delivery tricycles have been successfully implemented in France and are gradually being adopted across Europe for services as varied as parcel and catering deliveries. Using bicycles as cargo vehicles is particularly encouraged when combined with policies that restrict motor vehicle access to specific areas of a city, such as downtown or commercial districts, or with the extension of dedicated bike lanes.<\/div>"], "choices": ["도시에서 자전거는 효율적인 배송 수단으로 사용될 수 있다.", "자전거는 출퇴근 시간을 줄이기 위한 대안으로 선호되고 있다.", "자전거는 배송 수단으로의 경제적 장단점을 모두 가질 수 있다.", "수요자의 요구에 부합하는 다양한 용도의 자전거가 개발되고 있다.", "세계 각국에서는 전기 자전거 사용을 장려하는 정책을 추진하고 있다."], "inline": false, "ans": "①", "sol": "도시 배송 차량은 밀도에 맞게 작아지는데, 특히 자전거가 혼잡 지역의 ‘last-mile’ 수단으로 유망하다. 네덜란드·인도네시아·프랑스 사례, 차량 제한·자전거 도로 정책과 함께 장려된다 → ① 도시에서 자전거는 효율적인 배송 수단이 될 수 있다."}, {"n": 23, "pts": 2, "kind": "글의 주제", "src": "2025학년도 수능 23번", "prompt": "다음 글의 주제로 가장 적절한 것은?", "body": ["<div class=\"tx\">The arrival of the Industrial Age changed the relationship among time, labor, and capital. Factories could produce around the clock, and they could do so with greater speed and volume than ever before. A machine that runs twelve hours a day will produce more widgets than one that runs for only eight hours per day ― and a machine that runs twenty-four hours per day will produce the most widgets of all. As such, at many factories, the workday is divided into eight-hour shifts, so that there will always be people on hand to keep the widget machines humming. Industrialization raised the potential value of every single work hour ― the more hours you worked, the more widgets you produced, and the more money you made ― and thus wages became tied to effort and production. Labor, previously guided by harvest cycles, became clock-oriented, and society started to reorganize around new principles of productivity.<\/div>", "<div class=\"ft\">* widget: 제품<\/div>"], "choices": ["shift in the work-time paradigm brought about by industrialization", "effects of standardizing production procedures on labor markets", "influence of industrialization on the machine-human relationship", "efficient ways to increase the value of time in the Industrial Age", "problems that excessive work hours have caused for laborers"], "inline": false, "ans": "①", "sol": "산업 시대에 공장은 24시간 돌아가고, 노동 시간이 곧 생산량·임금이 되면서 노동이 수확 주기 중심에서 시계 중심(clock-oriented)으로 바뀌었다 → ① 산업화가 가져온 노동-시간 패러다임의 변화."}, {"n": 24, "pts": 2, "kind": "글의 제목", "src": "2023학년도 수능 24번", "prompt": "다음 글의 제목으로 가장 적절한 것은?", "body": ["<div class=\"tx\">Different parts of the brain’s visual system get information on a need-to-know basis. Cells that help your hand muscles reach out to an object need to know the size and location of the object, but they don’t need to know about color. They need to know a little about shape, but not in great detail. Cells that help you recognize people’s faces need to be extremely sensitive to details of shape, but they can pay less attention to location. It is natural to assume that anyone who sees an object sees everything about it ― the shape, color, location, and movement. However, one part of your brain sees its shape, another sees color, another detects location, and another perceives movement. Consequently, after localized brain damage, it is possible to see certain aspects of an object and not others. Centuries ago, people found it difficult to imagine how someone could see an object without seeing what color it is. Even today, you might find it surprising to learn about people who see an object without seeing where it is, or see it without seeing whether it is moving.<\/div>"], "choices": ["Visual Systems Never Betray Our Trust!", "Secret Missions of Color-Sensitive Brain Cells", "Blind Spots: What Is Still Unknown About the Brain", "Why Brain Cells Exemplify Nature’s Recovery Process", "Separate and Independent: Brain Cells’ Visual Perceptions"], "inline": false, "ans": "⑤", "sol": "뇌의 시각 체계는 필요한 정보만 받는다 — 모양·색·위치·움직임을 서로 다른 부분이 따로 본다(one part … sees its shape, another sees color …). 그래서 뇌 손상 후 일부만 보일 수 있다 → ⑤ 분리되고 독립적인 뇌세포의 시각 인식."}, {"n": 25, "pts": 2, "kind": "도표 불일치", "src": "2024학년도 수능 25번", "prompt": "다음 도표의 내용과 일치하지 <u>않는<\/u> 것은?", "body": ["<img class=\"fig\" alt=\"Percentages of Respondents Who Sometimes or Often Actively Avoided News in Five Countries in 2017, 2019, and 2022\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABQYAAANHCAAAAABBHN+CAAC2qklEQVR4nOz93a4kO5bnif3X3uYRkZmjmYu512W/gCBMNeKMSIuMqK7UlJ5FAtRA1SBONs10zh5MSTMXA+g9BAiFzpqMk2EkKnZPNbqfoN9AF7oQpjvPCXfbXLogaR/u5u5mHr63m7mv38mMTXe3j0UauYxcXIskhiAIwi1zd2kBBEEQLouoQUEQbhxRg4Ig3DrMzP+fSwshCIJwEZiZiQHQpSURBEG4CAwga5OCIAi3RegCim1QEIQbR9SgIAg3jqhBQRBuHFGDgiDcOKIGBUG4cUQNCoJw44gaFAThxhE1KAjCjSNqUBCEG0fUoCAIN46oQUEQbhxRg4Ig3DiiBgVBuHFEDQqCcOOIGhQE4cYRNSgIwo0jalAQhBtH1KAgCDeOqEFBEG4cUYOCINw4ogYFQbhxRA0KgnDjiBoUBOHGETUoCMKNI2pQEIQbR9SgIAg3jqhBQRBuHFGDgiDcOFenBpm3PgM8fOSVwLw3gzMoCwb4gITnucPY779RiqY4ebtgrxlmID5ADo+z/eliQp2bq1ODu1zPwxqEiGkz9uCXLwsG6HlvvOfStPsbnSwG82bDRLzZAGyJ6Jnyw+Cdl9eFIWrfngwwUfsbMxi8WX4Tuzo1SNjSCQwaPvIqYDCT/UC0srs/zqAsCAxbUvmst2j4pVUhoQPTVVcMtvlJ+WcGvny4I7r78AX8ruDnKkcm0MzqKzMTu/KOiOiudEy9rjDZfPXqlV6+HmTmMHC5Eky2lUFT+UvL9Kx4rwAA2e5PMygLXxkAMM94izZ7Gdh0c+t95+PaG4UTa3oq43ATrJmfpRw9a6B6nmufjq/azEP1a1AVS/oykp2DUCOurjeIeutzmecXkeOFYModgN18D31X5rl9boG273hyR3B6D6MGgCzo/gzdfmIGPNyV7lRR6J0DYIwKN3k4a+envRgVFsg38+kNMjPDhQoWcu9yF3tOANimppXGzYvtFbYa8TrwbDSA8IaKfRFUl5XpGfE+vpAz7HYi1j6+rg2z503oHL5sb8O8bh7GFDx7P05O79NDhqnYex8fvzI/b7znyrwJn1LHcHoWmFkBMH9mz6FjlJ2zBL1fN2kDYOA5XgrPzKF+ rom December 1 to December 14.<\/div><div class=\"li\">∙ Submissions should be uploaded to our school website.<\/div><div class=\"li2\">- Video length cannot exceed three minutes.<\/div><div class=\"li2\">- Entries are limited to one per student.<\/div><p class=\"nh\">Prizes<\/p><div class=\"li\">∙ 1st place: $100 gift card, 2nd place: $50 gift card<\/div><div class=\"li\">∙ Winning videos will be posted to our school’s app.<\/div><div class=\"li\">∙ The prize winners will be chosen by the school art teachers.<\/div><p>※ For more information, visit the school website.<\/p><\/div>"], "choices": ["출품작의 주제가 정해져 있지 않다.", "한 달 동안 동영상을 접수할 예정이다.", "출품할 동영상의 길이는 3분을 초과할 수 없다.", "출품작은 학생 1인당 두 개로 제한된다.", "학생회가 수상자를 선정할 것이다."], "inline": false, "ans": "③", "sol": "Video length cannot exceed three minutes → ③ 일치. ① 주제는 “Joyful Moments” in Our Growing Community로 정해져 있음, ② 12월 1일~14일(2주), ④ one per student(1인당 한 개), ⑤ school art teachers(미술 선생님들)가 선정 — 모두 불일치."}, {"n": 29, "pts": 2, "kind": "어법", "src": "2026학년도 수능 29번", "prompt": "다음 글의 밑줄 친 부분 중, 어법상 <u>틀린<\/u> 것은?", "body": ["<div class=\"tx\">We are exceptionally smart, and this helps us adapt to a wide range of environments. But we are not nearly smart enough as individuals ① <u>to solve<\/u> the adaptive problems that confronted modern humans as they spread across the globe. The package of tools, foraging techniques, ecological knowledge, and social arrangements used by any group of foragers ② <u>being<\/u> far too complex for any individual to create. We are able to learn all the things we need to know in each of the many different environments ③ <u>in which<\/u> we live only because we acquire information from others. We are much better at learning from others than other species are, and we are ④ <u>motivated<\/u> to learn from others even when we do not understand why our models are doing what they are doing. This psychology allows human populations to accumulate pools of adaptive information that ⑤ <u>greatly<\/u> exceed the inventive capacities of individuals.<\/div>", "<div class=\"ft\">* forage: 구하러 다니다<\/div>"], "choices": ["", "", "", "", ""], "inline": false, "ans": "②", "sol": "② being → is. 주어 The package of tools, … and social arrangements (used by any group of foragers)의 핵심은 단수 The package이고, 문장에 다른 본동사가 없으므로 본동사 is가 필요. ① enough to solve, ③ 전치사+관계대명사 in which(완전한 절 we live), ④ 수동 are motivated to, ⑤ 동사 exceed를 꾸미는 부사 greatly 모두 적절."}, {"n": 30, "pts": 3, "kind": "어휘", "src": "2025학년도 수능 30번", "prompt": "다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 <u>않은<\/u> 것은?", "body": ["<div class=\"tx\">Studies in psychology have reported cases in which competitive incentives resulted in lower task effort, and their focus was on the psychological underpinnings of the reduction in motivation. For example, competition presents an inevitable conflict between the motivation to achieve one’s personal goal and the ① <u>desire<\/u> to maintain good relationships with others. When the maintenance of interpersonal relationships is important, with their counterparts in particular or with others generally, competitors experience an ② <u>internal<\/u> conflict that can harm their desire to achieve their goal and taint the good feeling brought about by winning. Exline and Lobel found that the perception of oneself as a target for upward social comparison often makes people ③ <u>uncomfortable<\/u>. When they believe that others are making envious comparisons with them, people feel uneasiness, distress, or sorrow. Feelings of guilt, an emotion generally associated with high motivation for goal-achievement, lead to ④ <u>stronger<\/u> motivation and performance in the pursuit of competitive goals. Consequences of this emotional state include lower task motivation in a competition and preferences for more cooperative and altruistic outcomes, such as ⑤ <u>diminishing<\/u> the significance of the outcome or sharing the winner’s reward.<\/div>", "<div class=\"ft\">* taint: 더럽히다 ** altruistic: 이타주의의<\/div>"], "choices": ["", "", "", "", ""], "inline": false, "ans": "④", "sol": "④ stronger → weaker. 죄책감(guilt)은 위로 비교당하는 불편함에서 오는 감정이고, 바로 뒤 Consequences … include lower task motivation(과제 동기 저하)으로 이어지므로 '더 약한' 동기·수행으로 이어져야 한다. 'high motivation과 관련된 감정'이라는 말에 속지 말 것."}, {"n": null, "ghead": true, "prompt": "[31～34] 다음 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.", "src": "", "body": [], "choices": []}, {"n": 31, "pts": 2, "kind": "빈칸 추론", "src": "2024학년도 수능 31번", "prompt": "", "body": ["<div class=\"tx first\"><b class=\"num\">31.<\/b> Over the last decade the attention given to how children learn to read has foregrounded the nature of <i>textuality<\/i>, and of the different, interrelated ways in which readers of all ages make texts mean. ‘Reading’ now applies to a greater number of representational forms than at any time in the past: pictures, maps, screens, design graphics and photographs are all regarded as text. In addition to the innovations made possible in picture books by new printing processes, design features also predominate in other kinds, such as books of poetry and information texts. Thus, reading becomes a more complicated kind of interpretation than it was when children’s attention was focused on the printed text, with sketches or pictures as an adjunct. Children now learn from a picture book that words and illustrations complement and enhance each other. Reading is not simply <span class=\"bl\"><\/span>. Even in the easiest texts, what a sentence ‘says’ is often not what it means.<\/div>", "<div class=\"ft\">* adjunct: 부속물<\/div>"], "choices": ["knowledge acquisition", "word recognition", "imaginative play", "subjective interpretation", "image mapping"], "inline": false, "ans": "②", "sol": "이제 그림·지도·화면 등도 ‘텍스트’로 읽히고, 그림책에서 글과 그림이 서로 보완한다 → 읽기는 더 복잡한 해석이 되었다. 빈칸 뒤 what a sentence ‘says’ is often not what it means가 근거 → 읽기는 단순한 ② 단어 인식이 아니다.", "grouped": true}, {"n": 32, "pts": 3, "kind": "빈칸 추론", "src": "2026학년도 수능 32번", "prompt": "", "body": ["<div class=\"tx first\"><b class=\"num\">32.<\/b> The basic guidelines for good style are not mysterious; in fact, you use them every day in conversation. In conversation and in writing, we all rely heavily on cooperation to make sense of exchanges, and a polished practical style makes cooperation easier. Writers develop such a style by acknowledging that readers expect the same things that listeners expect in conversation: clarity, relevance, and proportion. If you listen to someone who is not clear, who cannot stay on the topic, or who offers too much or too little information, you will quickly lose interest in the conversation. Writers, too, need to be clear, stay on the topic, and give information appropriately. In fact, this attention to audience and appropriateness may be even more important in writing than in conversation because writing does not permit the nonverbal communication and immediate feedback that are part of conversation. As writers, we have to <span class=\"bl\"><\/span>; in effect, we have to imagine both halves of a virtual conversation.<span class=\"p3\"> [3점]<\/span><\/div>"], "choices": ["recognize the limitations of writing and conversation", "envision the reader’s preference for stylistic writing", "picture the reader’s desire for more knowledge", "develop collaborative writing with readers", "anticipate the absent reader’s response"], "inline": false, "ans": "⑤", "sol": "글은 대화와 달리 비언어적 소통과 즉각적 피드백이 없다. 그래서 작가는 대화의 두 쪽을 모두 상상해야 한다(imagine both halves of a virtual conversation) → ⑤ 그 자리에 없는 독자의 반응을 예상해야 한다.", "grouped": true}, {"n": 33, "pts": 3, "kind": "빈칸 추론", "src": "2023학년도 수능 33번", "prompt": "", "body": ["<div class=\"tx first\"><b class=\"num\">33.<\/b> The entrance to a honeybee colony, often referred to as the dancefloor, is a market place for information about the state of the colony and the environment outside the hive. Studying interactions on the dancefloor provides us with a number of illustrative examples of how individuals changing their own behavior in response to local information <span class=\"bl\"><\/span>. For example, upon returning to their hive honeybees that have collected water search out a receiver bee to unload their water to within the hive. If this search time is short then the returning bee is more likely to perform a waggle dance to recruit others to the water source. Conversely, if this search time is long then the bee is more likely to give up collecting water. Since receiver bees will only accept water if they require it, either for themselves or to pass on to other bees and brood, this unloading time is correlated with the colony’s overall need of water. Thus the individual water forager’s response to unloading time (up or down) regulates water collection in response to the colony’s need.<span class=\"p3\"> [3점]<\/span><\/div>", "<div class=\"ft\">* brood: 애벌레 ** forager: 조달자<\/div>"], "choices": ["allow the colony to regulate its workforce", "search for water sources by measuring distance", "decrease the colony’s workload when necessary", "divide tasks according to their respective talents", "train workers to acquire basic communication patterns"], "inline": false, "ans": "①", "sol": "물을 가져온 벌은 받는 벌을 찾는 시간이 짧으면 춤으로 동료를 더 모으고, 길면 물 모으기를 그만둔다 → 각자 국지적 정보에 반응해 행동을 바꾸는 것이 군집 전체의 물 수집(일손)을 조절한다(regulates water collection in response to the colony’s need) → ①.", "grouped": true}, {"n": 34, "pts": 3, "kind": "빈칸 추론", "src": "2022학년도 수능 34번", "prompt": "", "body": ["<div class=\"tx first\"><b class=\"num\">34.<\/b> Precision and determinacy are a necessary requirement for all meaningful scientific debate, and progress in the sciences is, to a large extent, the ongoing process of achieving ever greater precision. But historical representation puts a premium on a proliferation of representations, hence not on the refinement of one representation but on the production of an ever more varied set of representations. Historical insight is not a matter of a continuous “narrowing down” of previous options, not of an approximation of the truth, but, on the contrary, is an “explosion” of possible points of view. It therefore aims at the unmasking of previous illusions of determinacy and precision by the production of new and alternative representations, rather than at achieving truth by a careful analysis of what was right and wrong in those previous representations. And from this perspective, the development of historical insight may indeed be regarded by the outsider as a process of creating ever more confusion, a continuous questioning of <span class=\"bl\"><\/span>, rather than, as in the sciences, an ever greater approximation to the truth.<span class=\"p3\"> [3점]<\/span><\/div>", "<div class=\"ft\">* proliferation: 증식<\/div>"], "choices": ["criteria for evaluating historical representations", "certainty and precision seemingly achieved already", "possibilities of alternative interpretations of an event", "coexistence of multiple viewpoints in historical writing", "correctness and reliability of historical evidence collected"], "inline": false, "ans": "②", "sol": "과학은 정밀성·확정성을 높여 가지만, 역사적 통찰은 새로운 표현을 계속 만들어 이전의 '확정성과 정밀성의 환상'을 벗겨 낸다(unmasking of previous illusions of determinacy and precision). 그래서 외부인에게는 혼란을 만드는 과정, 곧 ② 이미 이뤄진 것처럼 보이는 확실성과 정밀성에 대한 끊임없는 의문 제기로 보인다.", "grouped": true}, {"n": 35, "pts": 2, "kind": "흐름 무관", "src": "2025학년도 수능 35번", "prompt": "다음 글에서 전체 흐름과 관계 <u>없는<\/u> 문장은?", "body": ["<div class=\"tx\">The expansion of sports tourism in the twentieth century has been influenced by further developments in transportation. Just as the railways revolutionized travel in the nineteenth century, so the automobile produced even more dramatic changes in the twentieth. ① The significance of the car in the development of sport and tourism generally has attracted considerable coverage and it has had no less an impact on sports tourism specifically. ② Although originally invented towards the end of the nineteenth century, it started to become a mass form of transport in the 1920s in the USA and rather later in Britain. ③ Apart from its convenience and flexibility, the car has the additional advantages of affording access to many areas not served by public transport, as well as allowing the easy transport of luggage and equipment. ④ The expansion of reasonably priced, good quality accommodation associated with tourism growth has also facilitated the growth of locally based restaurants. ⑤ As a result, it was invaluable for the development of many forms of sports tourism but especially those which require the transportation of people and equipment to relatively remote locations.<\/div>"], "choices": ["", "", "", "", ""], "inline": false, "ans": "④", "sol": "글은 20세기 자동차가 스포츠 관광 확대에 끼친 영향(편리성·유연성, 대중교통이 없는 곳 접근, 짐·장비 운반). ④ '관광 성장에 따른 저렴한 숙박 시설 확대가 지역 식당 성장을 도왔다'는 자동차와 무관. ⑤의 it은 the car를 받는다."}, {"n": null, "ghead": true, "prompt": "[36～37] 주어진 글 다음에 이어질 글의 순서로 가장 적절한 것을 고르시오.", "src": "", "body": [], "choices": []}, {"n": 36, "pts": 2, "kind": "글의 순서", "src": "2026학년도 수능 36번", "prompt": "", "body": ["<div class=\"bx\">We usually think of a clock as a physical thing, like an alarm clock or a wristwatch. But a clock is really a process embodied in a machine, and the nature of that process is repetitive.<\/div>", "<div class=\"tx order\"><b>(A)<\/b> Indeed, it is almost impossible to think of a clock that does not depend on a repetitive cycle of events. The only example that comes to mind readily is a candle marked in hours. But here too there is iteration ― the repeated burning of molecules of wax ― so this too is an iterative process, although at first masked.<\/div>", "<div class=\"tx order\"><b>(B)<\/b> The use of radiocarbon dating is another, much longer scale clock that also appears to be like this. It seems to yield a smooth time scale but in fact does not: the decay of atoms of carbon-14 is repetitive, although on a large scale it gives the appearance of being continuous.<\/div>", "<div class=\"tx order\"><b>(C)<\/b> A clock can be almost any process that repeats itself over and over again for an indefinite period. Water clocks drip at a steady pace; quartz crystals vibrate regularly.<\/div>", "<div class=\"ft\">* molecule: 분자 ** quartz: 석영(石英)<\/div>"], "choices": ["(A) － (C) － (B)", "(B) － (A) － (C)", "(B) － (C) － (A)", "(C) － (A) － (B)", "(C) － (B) － (A)"], "inline": false, "ans": "④", "sol": "주어진 글: 시계는 물건이 아니라 반복되는 과정이다. (C) 시계는 반복되는 거의 모든 과정(물시계, 석영) → (A) Indeed 반복 주기에 기대지 않는 시계는 생각하기 어렵다, 예외 같은 양초도 사실은 반복 → (B) 방사성 탄소 연대 측정도 another … clock that also appears to be like this(연속처럼 보이지만 반복). → (C)-(A)-(B).", "grouped": true}, {"n": 37, "pts": 3, "kind": "글의 순서", "src": "2024학년도 수능 37번", "prompt": "", "body": ["<div class=\"bx\">Norms emerge in groups as a result of people conforming to the behavior of others. Thus, the start of a norm occurs when one person acts in a particular manner in a particular situation because she thinks she ought to.<\/div>", "<div class=\"tx order\"><b>(A)<\/b> Thus, she may prescribe the behavior to them by uttering the norm statement in a prescriptive manner. Alternately, she may communicate that conformity is desired in other ways, such as by gesturing. In addition, she may threaten to sanction them for not behaving as she wishes. This will cause some to conform to her wishes and act as she acts.<\/div>", "<div class=\"tx order\"><b>(B)<\/b> But some others will not need to have the behavior prescribed to them. They will observe the regularity of behavior and decide on their own that they ought to conform. They may do so for either rational or moral reasons.<\/div>", "<div class=\"tx order\"><b>(C)<\/b> Others may then conform to this behavior for a number of reasons. The person who performed the initial action may think that others ought to behave as she behaves in situations of this sort.<span class=\"p3\"> [3점]<\/span><\/div>", "<div class=\"ft\">* sanction: 제재를 가하다<\/div>"], "choices": ["(A) － (C) － (B)", "(B) － (A) － (C)", "(B) － (C) － (A)", "(C) － (A) － (B)", "(C) － (B) － (A)"], "inline": false, "ans": "④", "sol": "주어진 글: 규범은 한 사람이 마땅히 그래야 한다고 생각해 행동할 때 시작된다. (C) Others may then conform … 처음 행동한 사람은 남들도 그래야 한다고 생각할 수 있다 → (A) Thus 그 행동을 말로 규정하거나 몸짓·제재로 따르게 한다 → (B) But some others는 규정이 없어도 스스로 따른다. → (C)-(A)-(B).", "grouped": true}, {"n": null, "ghead": true, "prompt": "[38～39] 글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳을 고르시오.", "src": "", "body": [], "choices": []}, {"n": 38, "pts": 2, "kind": "문장 삽입", "src": "2022학년도 수능 38번", "prompt": "", "body": ["<div class=\"bx\">Retraining current employees for new positions within the company will also greatly reduce their fear of being laid off.<\/div>", "<div class=\"tx\">Introduction of robots into factories, while employment of human workers is being reduced, creates worry and fear. <span style=\"white-space:nowrap\">(&nbsp;①&nbsp;)<\/span> It is the responsibility of management to prevent or, at least, to ease these fears. <span style=\"white-space:nowrap\">(&nbsp;②&nbsp;)<\/span> For example, robots could be introduced only in new plants rather than replacing humans in existing assembly lines. <span style=\"white-space:nowrap\">(&nbsp;③&nbsp;)<\/span> Workers should be included in the planning for new factories or the introduction of robots into existing plants, so they can participate in the process. <span style=\"white-space:nowrap\">(&nbsp;④&nbsp;)<\/span> It may be that robots are needed to reduce manufacturing costs so that the company remains competitive, but planning for such cost reductions should be done jointly by labor and management. <span style=\"white-space:nowrap\">(&nbsp;⑤&nbsp;)<\/span> Since robots are particularly good at highly repetitive simple motions, the replaced human workers should be moved to positions where judgment and decisions beyond the abilities of robots are required.<\/div>"], "choices": ["", "", "", "", ""], "inline": false, "ans": "⑤", "sol": "주어진 문장: 기존 직원을 새 자리로 재교육하는 것 '또한(also)' 해고 걱정을 크게 줄여 준다. ④ 뒤까지는 경영진이 두려움을 줄이는 방법(새 공장에만 로봇 도입, 계획에 노동자 참여, 노사 공동 계획)이 이어지고, ⑤ 뒤 Since robots … the replaced human workers should be moved to positions …는 재교육으로 옮겨 갈 자리를 구체화 → ⑤.", "grouped": true}, {"n": 39, "pts": 3, "kind": "문장 삽입", "src": "2023학년도 수능 39번", "prompt": "", "body": ["<div class=\"bx\">It may be easier to reach an agreement when settlement terms don’t have to be implemented until months in the future.<\/div>", "<div class=\"tx\">Negotiators should try to find ways to slice a large issue into smaller pieces, known as using <i>salami tactics<\/i>. <span style=\"white-space:nowrap\">(&nbsp;①&nbsp;)<\/span> Issues that can be expressed in quantitative, measurable units are easy to slice. <span style=\"white-space:nowrap\">(&nbsp;②&nbsp;)<\/span> For example, compensation demands can be divided into cents-per-hour increments or lease rates can be quoted as dollars per square foot. <span style=\"white-space:nowrap\">(&nbsp;③&nbsp;)<\/span> When working to fractionate issues of principle or precedent, parties may use the time horizon (when the principle goes into effect or how long it will last) as a way to fractionate the issue. <span style=\"white-space:nowrap\">(&nbsp;④&nbsp;)<\/span> Another approach is to vary the number of ways that the principle may be applied. <span style=\"white-space:nowrap\">(&nbsp;⑤&nbsp;)<\/span> For example, a company may devise a family emergency leave plan that allows employees the opportunity to be away from the company for a period of no longer than three hours, and no more than once a month, for illness in the employee’s immediate family.<span class=\"p3\"> [3점]<\/span><\/div>", "<div class=\"ft\">* increment: 증가 ** fractionate: 세분하다<\/div>"], "choices": ["", "", "", "", ""], "inline": false, "ans": "④", "sol": "주어진 문장: 합의 조건을 몇 달 뒤에 시행해도 된다면 합의가 더 쉬울 수 있다. ④ 앞 문장이 원칙 문제를 나눌 때 시간 범위(언제 시행할지, 얼마나 지속할지)를 쓴다는 내용이고, 주어진 문장은 그 예. ④ 뒤 Another approach는 다른 방법(적용 방식의 수)으로 넘어간다 → ④.", "grouped": true}, {"n": 40, "pts": 2, "kind": "요약문", "src": "2022학년도 수능 40번", "prompt": "다음 글의 내용을 한 문장으로 요약하고자 한다. 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것은?", "body": ["<div class=\"tx\">Philip Kitcher and Wesley Salmon have suggested that there are two possible alternatives among philosophical theories of explanation. One is the view that scientific explanation consists in the <i>unification<\/i> of broad bodies of phenomena under a minimal number of generalizations. According to this view, the (or perhaps, a) goal of science is to construct an economical framework of laws or generalizations that are capable of subsuming all observable phenomena. Scientific explanations organize and systematize our knowledge of the empirical world; the more economical the systematization, the deeper our understanding of what is explained. The other view is the <i>causal<\/i> / <i>mechanical<\/i> approach. According to it, a scientific explanation of a phenomenon consists of uncovering the mechanisms that produced the phenomenon of interest. This view sees the explanation of individual events as primary, with the explanation of generalizations flowing from them. That is, the explanation of scientific generalizations comes from the causal mechanisms that produce the regularities.<\/div>", "<div class=\"ft\">* subsume: 포섭(포함)하다 ** empirical: 경험적인<\/div>", "<div class=\"tx\"><span class=\"arrow\">↓<\/span><\/div>", "<div class=\"bx\">Scientific explanations can be made either by seeking the <u>&nbsp;&nbsp;(A)&nbsp;&nbsp;<\/u> number of principles covering all observations or by finding general <u>&nbsp;&nbsp;(B)&nbsp;&nbsp;<\/u> drawn from individual phenomena.<\/div>"], "choices": ["least … patterns", "fixed … features", "limited … functions", "fixed … rules", "least … assumptions"], "inline": false, "ans": "①", "sol": "과학적 설명의 두 관점: 하나는 통합(unification) — 최소한의 일반화로 넓은 현상을 포섭(the more economical …, the deeper our understanding), 다른 하나는 인과/기계적 관점 — 개별 사건의 메커니즘을 밝히고 거기서 일반화(regularities)가 나온다. 요약: (A) least(가장 적은) 원리 / 개별 현상에서 끌어낸 일반적 (B) patterns(규칙성) → ①."}, {"n": null, "prompt": "[41～42] 다음 글을 읽고, 물음에 답하시오.", "src": "2026학년도 수능 41~42번", "body": ["<div class=\"bx bx41\"><div class=\"tx\">There is an obvious problem with the history of dress in all of its displays and that is, although textiles survive from early periods and cultures of recorded history, actual garments do not provide an uninterrupted flow of evidence across the same long time-span. Therefore, to give the study of dress equal significance to other areas such as architecture, painting, prints, drawings and sculpture, it was (a) <u>inevitable<\/u> that these other areas would provide much of the source material. The history of surviving dress really only starts in the 17th century, and like all artefacts described as fine or decorative art, is a highly visual subject. However, unlike most of the categories of collection and study that make up those areas, it is fluid rather than static. Garments should be seen in (b) <u>movement<\/u> on a human body, not frozen on a display figure. This is one of the many difficulties when curating collections of costume and also why some modern writers find costume collections physically and intellectually (c) <u>lifeless<\/u>. Fortunately, in the period after 1660, when more items of dress survive to enrich our understanding of the history of the subject, there are also many painted, printed, photographed and filmed sources of evidence of people in clothing, caught in movement. Often a variety of different types of illustrative examples will (d) <u>provide<\/u> evidence about how a garment was worn within the period in which it was made. Without the information contained in art in all of its forms, from drawing to sculpture, it is (e) <u>unlikely<\/u> that displays of historic dress would be awkward imitations of the intentions of their original makers and owners.<\/div><div class=\"ft\">* garment: 의복<\/div><\/div>"], "choices": []}, {"n": 41, "pts": 3, "kind": "제목 (41~42 세트)", "src": "2026학년도 수능 41번", "prompt": "윗글의 제목으로 가장 적절한 것은?", "body": and green represents health. You deserve both.” Camila nodded, seeing how happy (b) <u>her<\/u> gift of the glasses had made their dad.<\/div>", "<div class=\"tx\"><u>(C)<\/u><\/div>", "<div class=\"bx\">“Happy birthday! You’re fifty today, Dad. We love you!” Camila said before (c) <u>her sister<\/u> handed him a small parcel. When he opened it, he discovered a pair of glasses inside. “Hailey, Dad doesn’t have eyesight problems,” Camila said, puzzled. “Actually Camila, I recently found out he has long been suffering from color blindness. He’s kept it a secret so as not to worry us,” Hailey explained.<\/div>", "<div class=\"tx\"><u>(D)<\/u><\/div>", "<div class=\"bx\">“I bet (d) <u>you<\/u> bought a wallet or a watch for him,” Camila said. In reply, Hailey answered, “No. I bought something much more personal. By the way, there’s something (e) <u>you<\/u> should know about Dad...” They were suddenly interrupted by the doorbell ringing. It was their dad and they were overjoyed to see him. “My lovely ladies, thank you for inviting me to your place for my birthday.” He walked in joyfully, hugging his daughters. They all walked into the dining room, where he was greeted with a rainbow-colored birthday cake and fifty red roses.<\/div>"], "choices": []}, {"n": 43, "pts": 2, "kind": "순서 (43~45 세트)", "src": "2023학년도 수능 43번", "prompt": "주어진 글 (A)에 이어질 내용을 순서에 맞게 배열한 것으로 가장 적절한 것은?", "body": [], "choices": ["(B) － (D) － (C)", "(C) － (B) － (D)", "(C) － (D) － (B)", "(D) － (B) － (C)", "(D) － (C) － (B)"], "inline": false, "ans": "⑤", "sol": "(A) 아버지 생일 파티 준비, Camila가 Hailey에게 무슨 선물을 샀는지 묻는다 → (D) 지갑이나 시계냐는 질문, 초인종 — 아버지 도착 → (C) 생일 축하, Hailey가 건넨 안경, 아버지의 색맹 사실 → (B) 안경을 쓰고 처음으로 빨강·초록을 보고 감격. → (D)-(C)-(B)."}, {"n": 44, "pts": 2, "kind": "지칭 (43~45 세트)", "src": "2023학년도 수능 44번", "prompt": "밑줄 친 (a)～(e) 중에서 가리키는 대상이 나머지 넷과 <u>다른<\/u> 것은?", "body": [], "choices": ["(a)", "(b)", "(c)", "(d)", "(e)"], "inline": false, "ans": "⑤", "sol": "(a) you(Camila가 묻는 상대), (b) her(안경 선물을 한 사람), (c) her sister(Camila의 자매로 선물을 건넨 사람), (d) you(Camila가 지갑을 샀겠다고 추측하는 상대)는 모두 Hailey. (e) you는 Hailey가 '아빠에 대해 알아야 할 게 있다'고 말하는 상대 Camila → ⑤."}, {"n": 45, "pts": 2, "kind": "내용 불일치 (43~45 세트)", "src": "2023학년도 수능 45번", "prompt": "윗글에 관한 내용으로 적절하지 <u>않은<\/u> 것은?", "body": [], "choices": ["Hailey는 생일 케이크를 테이블로 무사히 옮겨 놓았다.", "아버지는 생일 선물로 받은 안경을 직접 써 보았다.", "Hailey는 아버지가 색맹이라는 사실을 최근에 알게 되었다.", "Hailey와 Camila는 아버지의 집을 방문하였다.", "아버지는 자신의 나이와 똑같은 수의 장미를 받았다."], "inline": false, "ans": "④", "sol": "(D) “My lovely ladies, thank you for inviting me to your place for my birthday.” — 아버지가 딸들의 집에 왔다. ④ '딸들이 아버지의 집을 방문했다'는 불일치. ⑤ 쉰 살 생일에 fifty red roses로 일치."}];
const NUM = ['①','②','③','④','⑤'];

function spaceMarks(h){ return h.replace(/(<u>\s*)(\([a-e]\)|[①②③④⑤])(?=[A-Za-z])/g,'$1$2 ').replace(/([①②③④⑤]|\([a-e]\)) (?=\S)/g,'$1&nbsp;'); }
function isLabel(h){ return /class="tx"><u>\([A-D]\)<\/u><\/div>/.test(h); }
function bodyPieces(body, plainBox){
  const out=[]; let pend='';
  body.forEach(h=>{
    h=spaceMarks(h);
    if(isLabel(h)){ pend += h.replace('class="tx"','class="tx lab"'); return; }
    if(/class="ft"/.test(h) && out.length && !pend){ out[out.length-1]+=h; return; }
    if(plainBox) h = h.replace('class="bx"','class="bx plain"');
    out.push(pend+h); pend='';
  });
  if(pend) out.push(pend);
  return out;
}
function choicesHTML(it){
  if(!it.choices.length) return '';
  if(it.choices.every(c=>!c.trim()))
    return '<ol class="ch inl">'+it.choices.map((c,i)=>`<li><span class="m">${NUM[i]}</span></li>`).join('')+'</ol>';
  if(it.choices.every(c=>c.includes('…')))
    return '<ol class="ch sum"><li class="hd"><span class="m"></span><span class="a">&nbsp;&nbsp;(A)</span><span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span><span class="b">&nbsp;&nbsp;&nbsp;(B)</span></li>'+
      it.choices.map((c,i)=>{ const [a,b]=c.split('…').map(s=>s.trim());
        return `<li><span class="m">${NUM[i]}</span><span class="a">${a}</span><span>……</span><span class="b">&nbsp;&nbsp;${b}</span></li>`; }).join('')+'</ol>';
  return '<ol class="ch">'+it.choices.map((c,i)=>{
    const ko = /[가-힣]/.test(c.replace(/<[^>]+>/g,''));
    return `<li class="${ko?'ko':''}"><span class="m">${NUM[i]}</span><span>${c}</span></li>`; }).join('')+'</ol>';
}
function srcLine(s){ return `<div class="from">출처: ${s}</div>`; }
function promptHTML(p){ // 발문 속 영어 낱말은 Times로 (글자 노드에만 적용)
  const d=document.createElement('div'); d.innerHTML=p;
  const w=document.createTreeWalker(d,NodeFilter.SHOW_TEXT); const nodes=[]; while(w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(t=>{ if(!/[A-Za-z]{2,}/.test(t.nodeValue)) return;
    const frag=document.createElement('span');
    frag.innerHTML=t.nodeValue.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/([A-Za-z][A-Za-z’'\-]*(?:[ .,][A-Za-z][A-Za-z’'\-]*)*\.?)/g, m=>m.length<2?m:`<span class="en">${m}</span>`);
    t.replaceWith(...frag.childNodes); });
  return d.innerHTML;
}
function buildUnits(){
  const units=[]; let pend='', setSrc='';
  ITEMS.forEach(it=>{
    if(it.ghead){
      const m = it.prompt.match(/^(\[[^\]]+\])\s*(.*)$/);
      pend=`<div class="qp ghead"><b class="gr">${m[1]}</b>${m[2]}</div>`; return;
    }
    if(it.n===null){ // [41~42]·[43~45] 세트
      const m = it.prompt.replace(/~/,'～').match(/^(\[[^\]]+\])\s*(.*)$/);
      const head = `<div class="qp ghead"><b class="gr">${m[1]}</b>${m[2]}</div>`;
      const pieces = bodyPieces(it.body, /41/.test(it.prompt));
      setSrc = it.src.replace(/~/,'～');
      units.push({parts:[head+pieces[0], ...pieces.slice(1)], set:true});
      return;
    }
    const p3 = it.pts===3 ? ' [3점]' : '';
    let head;
    if(it.grouped) head = (it.n<=34) ? '' : `<div class="qp"><b class="num">${it.n}.</b></div>`;
    else head = `<div class="qp"><b class="num">${it.n}.</b>${promptHTML(it.prompt)}${p3}</div>`;
    head = pend + head; pend='';
    const pieces = bodyPieces(it.body, false);
    const parts = pieces.length ? [head+pieces[0], ...pieces.slice(1)] : [head];
    const tail = choicesHTML(it) + (it.n>=41 ? ((it.n===42||it.n===45) ? srcLine(setSrc) : '') : srcLine(it.src));
    if(it.choices.join('').length < 260 || !pieces.length) parts[parts.length-1]+=tail; else parts.push(tail);
    units.push({parts, inSet: it.n>=41});
  });
  return units;
}

      <div class="t2"><span class="gyo">제 3 교시</span><span class="area">영어 영역</span><span class="hol">홀수형</span></div>

  }

  out.appendChild(pg);

}
const fits = c => c.scrollHeight <= c.clientHeight + 1;
function render(){
  const out=document.getElementById('out'); out.innerHTML=''; pageNo=0;
  out.className = 'sheetwrap';
  let cols=newPage(out), ci=0, count=0;   // count = 이 단에 놓인 문항 수
  const nextCol=()=>{ ci++; count=0; if(ci>1){ cols=newPage(out); ci=0; } };
  // 1쪽 첫 단 안내
  cols[0].insertAdjacentHTML('beforeend','<div class="guide">18번부터 45번까지는 독해 문제입니다. 문항마다 끝에 원래 출제된 연도와 번호를 적었습니다. 답은 답안지에 표기하시기 바랍니다.</div>');
  const units = buildUnits();
  const MM=96/25.4, MINGAP=8*MM;
  const usedH=c=>{ const l=c.lastElementChild; if(!l) return 0; return l.getBoundingClientRect().bottom - c.getBoundingClientRect().top; };
  const mk=(html,cls)=>{ const d=document.createElement('div'); d.className=cls||'blk'; d.innerHTML=html; return d; };
  const gapEl=h=>{ const g=document.createElement('div'); g.className='gap'; g.style.height=h+'px'; return g; };
  units.forEach(u=>{
    const col=()=>cols[ci];
    // 세트 지문([41～42]·[43～45])은 새 단 맨 위에서 시작, 덩어리별로 이어 싣는다
    if(u.set){
      if(count>0) nextCol();
      u.parts.forEach((p,k)=>{
        const b=mk(p); col().appendChild(b);
        if(!fits(col())){ col().removeChild(b); nextCol(); col().appendChild(b); }
      });
      count=2; return;
    }
    // 세트 안 문항(41·42·43·44·45)은 지문 바로 뒤에 이어서
    if(u.inSet){
      const g=gapEl(5*MM), b=mk(u.parts.join(''));
      col().appendChild(g); col().appendChild(b);
      if(!fits(col())){ col().removeChild(g); col().removeChild(b); nextCol(); col().appendChild(b); }
      count=2; return;
    }
    const whole=mk(u.parts.join(''));
    // 아래 문항: 위 문항과 붙이지 않고, 남는 공간의 절반을 사이에 둔다(실제 시험지처럼 아래쪽 문항이 단 중간 아래에서 시작)
    if(count===1){
      const c=col(), top=usedH(c), H=c.clientHeight;
      const g=gapEl(0); c.appendChild(g); c.appendChild(whole);
      const h2=whole.getBoundingClientRect().height;
      const free=H-top-h2;
      if(free>=MINGAP){ g.style.height=Math.max(MINGAP, free*0.5)+'px'; count=2; return; }
      c.removeChild(g); c.removeChild(whole); nextCol();
    } else if(count>=2){ nextCol(); }
    // 위 문항: 단 맨 위
    const c=col(); c.appendChild(whole);
    if(fits(c)){ count = (usedH(c) > c.clientHeight - 60*MM) ? 2 : 1; return; }
    // 한 단에 다 안 들어가는 경우(드묾): 덩어리별로 나눠 싣기
    c.removeChild(whole);
    u.parts.forEach(p=>{ const b=mk(p); col().appendChild(b); if(!fits(col())){ col().removeChild(b); nextCol(); col().appendChild(b); } });
    count=2;
  });
  // 끝 안내
  const end='<div class="endnote">※ 확인 사항<br>&nbsp;○ 답안지의 해당란에 필요한 내용을 정확히 기입(표기)했는지 확인하시오.</div>';
  cols[ci].insertAdjacentHTML('beforeend',end);
  if(!fits(cols[ci])){ cols[ci].lastElementChild.remove(); nextCol(); cols[ci].insertAdjacentHTML('beforeend',end); }
  total=pageNo; out.querySelectorAll('.pf .tot').forEach(t=>t.textContent=total);
  if(paper==='A4'){ // 여백 줄인 가상 쪽(.v4)에 배치한 뒤 A4 크기로 축소
    out.querySelectorAll('.page').forEach(pg=>{ const box=document.createElement('div'); box.className='a4box'; pg.replaceWith(box); box.appendChild(pg); });
  }
  document.getElementById('pA3').setAttribute('aria-pressed', paper==='A3');
  document.getElementById('pA4').setAttribute('aria-pressed', paper==='A4');
  document.getElementById('pagesize').textContent='@page{size:'+paper+';margin:0}';
  try{ localStorage.setItem('warmup-paper', paper); }catch(e){}
}
document.getElementById('pA3').onclick=()=>{ paper='A3'; render(); };
document.getElementById('pA4').onclick=()=>{ paper='A4'; render(); };
(function(){ let framed=true; try{ framed = window.self !== window.top; }catch(e){}
  const pb=document.getElementById('btnPrint'); if(!framed){ pb.hidden=false; pb.onclick=()=>window.print(); } })();
render();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(render);
</script>
</body>
</html>
