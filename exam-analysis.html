<!--
  시험대비 자료실 (2026-11-15, 34차)
  - 이전 '출제 허브'는 exam-analysis-old.html로 그대로 보관
  - 데이터: ① 교과서 지문 = index 로그인 GAS '중등지문' 시트 (getMiddlePassages / saveMiddlePassage / deleteMiddlePassage)
            ② 기출 = 드라이브 '★★기출문제 스캔/기출DB' 폴더 JSON (GAS v15 getKichulList / getKichul, 비공개) — 35차
            ③ 예상문제 = GitHub 저장소 exams 폴더의 JSON 파일 (읽기 전용)
  - GAS v15 필요(기출DB 읽기). v14 이하면 기출은 GitHub exams의 기출 파일로 대신 표시
-->
<style>
:root{
  --cream:#faf7f2; --paper:#f4f0e8; --white:#fff;
  --navy:#0f2340; --navy2:#1a3a5c; --navy3:#234e7a;
  --gold:#b8860b; --gold2:#d4a017; --gold3:#f0c040; --gold-lt:#fdf3d0;
  --ink:#1a1a2a; --ink2:#3a3a4a; --ink3:#6a6a7a; --ink4:#9a9aaa;
  --green:#1a6b3a; --green2:#27a85a; --red:#c0392b; --red2:#e74c3c;
  --blue:#1a4a8c; --wine:#7a1020; --teal:#1f6f6b;
  --border:#e0d8cc; --border2:#d0c8bc;
  --shadow-sm:0 2px 8px rgba(15,35,64,.08); --shadow:0 4px 20px rgba(15,35,64,.12); --shadow-lg:0 8px 40px rgba(15,35,64,.16);
  --radius:12px; --radius-sm:8px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;
  background-image:radial-gradient(circle at 20% 20%,rgba(184,134,11,.06) 0%,transparent 50%),radial-gradient(circle at 80% 80%,rgba(15,35,64,.05) 0%,transparent 50%);}
button,input,select,textarea{font-family:inherit;}

/* 헤더 */
header{background:var(--navy);padding:0 28px;display:flex;align-items:center;gap:16px;height:64px;position:sticky;top:0;z-index:200;box-shadow:0 2px 16px rgba(15,35,64,.22);}
header h1{font-size:1rem;font-weight:700;color:#fff;white-space:nowrap;}
header h1 span{color:var(--gold3);}
.hd-right{margin-left:auto;display:flex;gap:10px;align-items:center;}
.hd-link{color:rgba(255,255,255,.75);font-size:.8rem;text-decoration:none;border:1px solid rgba(255,255,255,.25);padding:5px 10px;border-radius:6px;}
.hd-link:hover{color:#fff;border-color:var(--gold3);}

/* 탭 */
.tabs{display:flex;background:var(--white);border-bottom:1px solid var(--border);position:sticky;top:64px;z-index:100;padding:0 24px;gap:4px;align-items:center;}
.tab{padding:14px 20px;cursor:pointer;color:var(--ink4);font-size:.92rem;font-weight:500;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px;}
.tab:hover{color:var(--navy2);background:var(--paper);border-radius:6px 6px 0 0;}
.tab.active{color:var(--navy);border-bottom-color:var(--gold);font-weight:800;background:var(--paper);border-radius:6px 6px 0 0;}
.tabs .tools{margin-left:auto;display:flex;gap:8px;align-items:center;padding:6px 0;}
.search{border:1.5px solid var(--border);border-radius:8px;padding:7px 10px;font-size:.85rem;width:220px;background:var(--paper);}

/* 버튼 */
.btn{padding:8px 14px;border:none;border-radius:var(--radius-sm);cursor:pointer;font-size:.85rem;font-weight:700;display:inline-flex;align-items:center;gap:6px;transition:all .15s;}
.btn:active{transform:translateY(1px);}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff;}
.btn-navy{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;}
.btn-green{background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;}
.btn-red{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;}
.btn-gray{background:var(--paper);color:var(--ink2);border:1.5px solid var(--border2);}
.btn-gray:hover{background:var(--border);color:var(--navy);}
.btn-sm{padding:4px 10px;font-size:.76rem;}
.btn:disabled{opacity:.5;cursor:default;}

/* 레이아웃 */
.wrap{max-width:1180px;margin:0 auto;padding:22px 24px 60px;}
.status{font-size:.82rem;color:var(--ink3);margin-bottom:12px;min-height:1.2em;}
.status .err{color:var(--red);}
.layout{display:grid;grid-template-columns:230px 1fr;gap:20px;align-items:start;}
.side{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:12px;position:sticky;top:130px;max-height:calc(100vh - 150px);overflow:auto;}
.side h3{font-size:.74rem;color:var(--ink4);font-weight:700;margin:10px 6px 6px;letter-spacing:.5px;}
.side h3:first-child{margin-top:2px;}
.side-item{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:.88rem;color:var(--ink2);}
.side-item:hover{background:var(--paper);}
.side-item.active{background:var(--navy);color:#fff;font-weight:700;}
.side-item .cnt{font-size:.72rem;color:var(--ink4);}
.side-item.active .cnt{color:var(--gold3);}
.main{min-width:0;}
.empty{color:var(--ink4);font-size:.88rem;padding:30px 10px;text-align:center;}

.title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.title-row h2{font-size:1.25rem;color:var(--navy);}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{padding:5px 12px;border-radius:999px;border:1.5px solid var(--border2);background:var(--white);font-size:.8rem;cursor:pointer;color:var(--ink2);}
.chip.active{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:700;}

.sec{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow-sm);}
.sec-h{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.sec-h h3{font-size:1rem;color:var(--navy);}
.sec-h .n{font-size:.76rem;color:var(--ink4);}
.sec-h .sp{margin-left:auto;}
.group-label{font-size:.8rem;font-weight:700;color:var(--gold);margin:12px 0 6px;}
.group-label:first-child{margin-top:0;}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;}
.card{border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--cream);transition:all .12s;}
.card:hover{border-color:var(--gold2);box-shadow:var(--shadow-sm);background:#fff;}
.card .t{font-weight:700;font-size:.9rem;color:var(--navy);}
.card .s{font-size:.75rem;color:var(--ink3);margin-top:3px;line-height:1.45;}
.badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;}
.bdg{font-size:.68rem;padding:1px 7px;border-radius:999px;background:var(--paper);color:var(--ink3);border:1px solid var(--border);}
.bdg.b{background:#fdf3d0;color:#8a6508;border-color:#f0dfa0;}
.bdg.d{background:#e6f4ec;color:var(--green);border-color:#bfe3cd;}
.bdg.g{background:#e8eef8;color:var(--blue);border-color:#c9d6ee;}
.bdg.k{background:#f8e8ea;color:var(--wine);border-color:#ecc8cd;}
.bdg.c{background:#eee;color:#888;}

.ltable{width:100%;border-collapse:collapse;font-size:.86rem;}
.ltable th{text-align:left;font-size:.74rem;color:var(--ink4);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--border);}
.ltable td{padding:8px;border-bottom:1px solid var(--paper);vertical-align:top;}
.ltable td.lsn{font-weight:700;color:var(--navy);white-space:nowrap;width:110px;}

/* 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(15,35,64,.45);z-index:500;display:none;align-items:center;justify-content:center;padding:24px 16px;}
.modal-bg.on{display:flex;}
.modal{background:#fff;border-radius:14px;max-width:880px;width:100%;box-shadow:var(--shadow-lg);max-height:calc(100vh - 48px);display:flex;flex-direction:column;}
.modal-h{display:flex;align-items:flex-start;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border);flex-shrink:0;}
.modal-h h3{font-size:1.05rem;color:var(--navy);}
.modal-h .sub{font-size:.78rem;color:var(--ink3);margin-top:3px;}
.modal-h .x{margin-left:auto;background:none;border:none;font-size:1.4rem;cursor:pointer;color:var(--ink4);line-height:1;}
.modal-b{padding:16px 20px 22px;overflow:auto;flex:1;min-height:0;}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--border);flex-wrap:wrap;flex-shrink:0;}
.blk{margin-bottom:16px;}
.blk-h{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.blk-h b{font-size:.88rem;color:var(--navy);}
.blk-h .cnt{font-size:.74rem;color:var(--ink4);}
.blk-h .btn{margin-left:auto;}
.txt{white-space:pre-wrap;background:var(--cream);border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-size:.88rem;line-height:1.7;max-height:420px;overflow:auto;}
.txt.none{color:var(--ink4);}

/* 편집 폼 */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-bottom:12px;}
.f{display:flex;flex-direction:column;gap:4px;}
.f label{font-size:.75rem;color:var(--ink3);font-weight:700;}
.f input,.f select,.f textarea{border:1.5px solid var(--border);border-radius:7px;padding:7px 9px;font-size:.86rem;background:var(--paper);color:var(--ink);}
.f textarea{resize:vertical;line-height:1.6;}
.f.full{grid-column:1/-1;}
.hint{font-size:.74rem;color:var(--ink4);}

/* 시험지 미리보기 */
.qmeta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--ink3);margin-bottom:12px;}
.qmeta b{color:var(--ink2);}
.q{border-bottom:1px dashed var(--border);padding:12px 0;}
.q:last-child{border-bottom:none;}
.q .sh{font-size:.82rem;color:var(--teal);font-weight:700;margin-bottom:6px;}
.q .qh{display:flex;gap:8px;align-items:baseline;margin-bottom:4px;}
.q .no{font-weight:900;color:var(--navy);}
.q .qt{font-size:.7rem;padding:1px 7px;border-radius:999px;background:var(--paper);color:var(--ink3);}
.q .sc{font-size:.72rem;color:var(--ink4);}
.q .body{font-size:.88rem;line-height:1.7;white-space:pre-wrap;}
.q .ch{list-style:none;margin-top:6px;font-size:.86rem;line-height:1.7;}
.q .qbox{border:1.5px solid var(--ink3);border-radius:6px;padding:8px 12px;margin-top:6px;font-size:.86rem;line-height:1.6;white-space:pre-wrap;}
.q .ans{display:none;margin-top:6px;font-size:.82rem;background:var(--gold-lt);border-radius:6px;padding:6px 10px;color:var(--ink2);white-space:pre-wrap;}
.show-ans .q .ans{display:block;}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--border2);border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:4px;}
@keyframes sp{to{transform:rotate(360deg);}}

@media(max-width:820px){
  .layout{grid-template-columns:1fr;}
  .side{position:static;max-height:none;}
  .tabs{flex-wrap:wrap;}
  .search{width:150px;}
  .form-grid{grid-template-columns:1fr;}
}
</style>
</head>

<header>

  <div class="hd-right">
    <a class="hd-link" href="exam-analysis-old.html" target="_blank" rel="noopener" title="이전 출제·검토·출력·적중률 기능">옛 출제 허브</a>
  </div>

<div class="tabs">
  <div class="tab active" data-tab="school" onclick="setTab('school')">🏫 학교별</div>

</div>

<!-- 모달 -->

  <div class="modal" id="modal"></div>
</div>

<script>
// ━━━ 설정 ━━━
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyzDwEtCDj2wS_bPeujjVY52pvrmAMG7KtcupXDD05lb8EXfanJCsfYB44iKsCuOGVV/exec';
const REPO = 'greatenglish1201-ux/GREATENG';
const EXAMS_DIR = 'exams';

// 교과서 선택지 (옛 출제 허브와 같은 목록 — 직접 입력도 가능)
const TEXTBOOKS = {
  '중': ['NE능률(김기택)','YBM(김은영)','YBM(박준언)','동아(윤정미)','동아(이병민)','미래엔(문영인)','비상(황종배)','지학사(송미정)','천재(소영순)','천재(이상기)'],
  '고': ['NE능률(민병천)','NE능률(오선영)','YBM(김은형)','YBM(박준언)','동아(박용예)','동아(이병민)','미래엔(김성연)','비상(홍민표)','지학사(신상근)','천재(강상구)','천재(조수경)']
};
const SCHOOLS = { '중':['제철중','이동중','유강중','포항여중','효자중'], '고':['제철고','이동고','동지고','두호고','대동고'] };
const GRADE_ORDER = ['중1','중2','중3','고1','고2','고3'];
const SCHOOL_ALIAS = { '포항제철중':'제철중', '포항제철고':'제철고' };

// ━━━ 상태 ━━━
const S = {
  tab: 'school',
  passages: [],      // 중등지문 시트 행
  files: [],         // exams 폴더 JSON {name, url, html, meta, questions, kind, copy, school, grade}
  kichul: [],        // 드라이브 기출DB {drive:true, id, name, meta, total, questions(열 때 받음), kind:'기출', school, grade}
  sel: { school:'', grade:'', book:'' },
  loadingP: false, loadingF: false, loadingK: false, errP: '', errF: '', errK: ''
};
try{ const saved = JSON.parse(localStorage.getItem('ge_library_view')||'{}'); if(saved.tab) S.tab=saved.tab; if(saved.sel) Object.assign(S.sel, saved.sel); }catch(e){}
function saveView(){ try{ localStorage.setItem('ge_library_view', JSON.stringify({tab:S.tab, sel:S.sel})); }catch(e){} }

// ━━━ 공통 유틸 ━━━
const t = v => String(v==null?'':v).trim();
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
// 문항 본문용: 이스케이프 후 <u> <b> <i> <br>만 되살림
function richText(s){
  return esc(s).replace(/&lt;(\/?)(u|b|i|strong|em)&gt;/gi,'<$1$2>').replace(/&lt;br\s*\/?&gt;/gi,'<br>');
}
function normSchool(s){ s=t(s); return SCHOOL_ALIAS[s]||s; }
function levelOf(school, grade){
  const g=t(grade); if(/^중/.test(g)) return '중'; if(/^고/.test(g)) return '고';
  const s=t(school); if(/중(학교)?$/.test(s)) return '중'; if(/고(등학교)?$/.test(s)) return '고';
  return '';
}
function normGrade(g, school){
  g=t(g); if(/^[중고][1-3]$/.test(g)) return g;
  const m=g.match(/([1-3])\s*학년/) || g.match(/^([1-3])$/);
  const lv=levelOf(school,'');
  return (m && lv) ? lv+m[1] : g;
}
function bookName(p){ return t(p.publisher)+(t(p.author)?'('+t(p.author)+')':''); }
function gradeSort(a,b){ const ia=GRADE_ORDER.indexOf(a), ib=GRADE_ORDER.indexOf(b); return (ia<0?99:ia)-(ib<0?99:ib) || a.localeCompare(b,'ko'); }
function lessonNum(l){ const m=t(l).match(/(\d+)/); return m?Number(m[1]):999; }
function lessonSort(a,b){ return lessonNum(a)-lessonNum(b) || t(a).localeCompare(t(b),'ko'); }
function examRank(f){ // 최신 순 정렬용
  const sem = /2/.test(f.meta.semester||'') ? 2 : 1;
  const ex = /기말|2차/.test(f.meta.exam||'') ? 2 : 1;
  return Number(f.meta.year||0)*100 + sem*10 + ex;
}
function words(s){ return (t(s).match(/[A-Za-z']+/g)||[]).length; }
function setStatus(){
  const el=document.getElementById('status'); const parts=[];
  if(S.loadingP) parts.push('<span class="spinner"></span>교과서 지문 불러오는 중');
  else if(S.errP) parts.push(`<span class="err">교과서 지문 불러오기 실패: ${esc(S.errP)}</span>`);
  else parts.push(`교과서 지문 ${S.passages.length}건`);
  if(S.loadingF) parts.push('<span class="spinner"></span>기출·예상문제 파일 불러오는 중');
  else if(S.errF) parts.push(`<span class="err">파일 목록 실패: ${esc(S.errF)}</span>`);
  else parts.push(`예상문제 파일 ${S.files.filter(f=>f.school && f.kind==='예상').length}개`);
  if(S.loadingK) parts.push('<span class="spinner"></span>기출DB 불러오는 중');
  else if(S.errK) parts.push(`<span class="err">기출DB: ${esc(S.errK)}</span>`);
  else parts.push(`기출 ${S.kichul.length}건(드라이브)`);
  el.innerHTML = parts.join(' · ');
}

// ━━━ GAS 통신 (옛 출제 허브와 같은 방식) ━━━
function getFromGAS(params){
  return new Promise((resolve, reject)=>{
    const cbName='cb_get_'+Date.now()+'_'+Math.floor(Math.random()*1000);
    const qs=Object.entries(params).map(([k,v])=>k+'='+encodeURIComponent(v==null?'':v)).join('&');
    const script=document.createElement('script');
    const timer=setTimeout(()=>{ delete window[cbName]; script.remove(); reject(new Error('GET 타임아웃')); },15000);
    window[cbName]=function(res){ clearTimeout(timer); delete window[cbName]; script.remove(); resolve(res||{}); };
    script.onerror=()=>{ clearTimeout(timer); delete window[cbName]; script.remove(); reject(new Error('GET 요청 실패')); };
    script.src=APPS_SCRIPT_URL+'?'+qs+'&callback='+cbName;
    document.head.appendChild(script);
  });
}
function postToGAS(params){
  return new Promise((resolve, reject)=>{
    const id='gas_'+Date.now()+'_'+Math.floor(Math.random()*1000);
    const iframe=document.createElement('iframe'); iframe.name=id; iframe.style.display='none'; document.body.appendChild(iframe);
    const form=document.createElement('form'); form.method='POST'; form.action=APPS_SCRIPT_URL; form.target=id;
    const input=document.createElement('input'); input.type='hidden'; input.name='payload'; input.value=JSON.stringify(params);
    form.appendChild(input); document.body.appendChild(form);
    const timer=setTimeout(()=>{ cleanup(); reject(new Error('POST 타임아웃')); },15000);
    function cleanup(){ clearTimeout(timer); try{iframe.remove();}catch(e){} try{form.remove();}catch(e){} }
    iframe.onload=()=>{
      try{
        const text=iframe.contentDocument?.querySelector('#__greateng_response__')?.textContent;
        if(!text){ cleanup(); resolve({ok:true}); return; }
        const res=JSON.parse(text.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>'));
        cleanup(); if(res.ok) resolve(res); else reject(new Error(res.error||'GAS 오류'));
      }catch(e){ cleanup(); resolve({ok:true}); } // 크로스도메인이라 응답을 못 읽는 경우 — 호출부에서 목록 재조회로 확인
    };
    form.submit();
  });
}

// ━━━ 데이터 불러오기 ━━━
async function loadPassages(){
  S.loadingP=true; S.errP=''; setStatus();
  try{
    const r=await getFromGAS({action:'getMiddlePassages'});
    if(r.ok===false) throw new Error(r.error||'GAS 오류');
    S.passages=(r.list||[]).map(p=>({...p,
      school:normSchool(p.school), grade:normGrade(p.grade,p.school),
      publisher:t(p.publisher), author:t(p.author), lesson:t(p.lesson),
      _school:t(p.school), _grade:t(p.grade) // 시트 원래 값(삭제·덮어쓰기 열쇠용)
    }));
  }catch(e){ S.errP=e.message; }
  S.loadingP=false; setStatus(); render();
}
async function loadFiles(){
  S.loadingF=true; S.errF=''; setStatus();
  try{
    const res=await fetch(`https://api.github.com/repos/${REPO}/contents/${EXAMS_DIR}`,{cache:'no-store'});
    if(!res.ok) throw new Error('GitHub '+res.status+(res.status===403?' (요청 한도 초과 — 잠시 후 다시)':''));
    const list=(await res.json()).filter(f=>f.type==='file' && /\.json$/i.test(f.name));
    const out=[]; let i=0;
    async function worker(){
      while(i<list.length){
        const f=list[i++];
        try{
          const r=await fetch(f.download_url,{cache:'no-store'});
          const d=await r.json();
          out.push(makeFile(f,d));
        }catch(e){ out.push({name:f.name, url:f.download_url, html:f.html_url, meta:{}, questions:[], err:e.message}); }
      }
    }
    await Promise.all(Array.from({length:6},worker));
    S.files=out;
  }catch(e){ S.errF=e.message; }
  S.loadingF=false; setStatus(); render();
}
function makeFile(f,d){
  const meta=(d && !Array.isArray(d) && d.meta) || {};
  const questions=(d && !Array.isArray(d) && Array.isArray(d.questions)) ? d.questions : [];
  const school=normSchool(meta.school);
  const grade=school ? normGrade(meta.grade, school) : '';
  const kichul=/^kichul/i.test(t(meta.build)) || /kichul|기출/i.test(f.name);
  const copy=/_v\d+_\d{8}_\d{4}|\(\d+\)/.test(f.name);
  return { name:f.name, url:f.download_url, html:f.html_url, meta, questions, school, grade, kind:kichul?'기출':'예상', copy };
}
async function loadKichul(){
  S.loadingK=true; S.errK=''; setStatus();
  try{
    const r=await getFromGAS({action:'getKichulList'});
    if(r.ok===false) throw new Error(/Unknown action/.test(r.error||'') ? 'GAS v15 배포 전이라 GitHub 기출로 대신 표시 중' : (r.error||'GAS 오류'));
    S.kichul=(r.list||[]).filter(x=>!x.error).map(x=>{
      const school=normSchool(x.meta.school);
      return { drive:true, id:x.id, name:x.name, url:x.url, meta:x.meta||{}, total:x.total, questions:null,
               school, grade:school?normGrade(x.meta.grade,school):'', kind:'기출', copy:false };
    });
  }catch(e){ S.errK=e.message; S.kichul=[]; }
  S.loadingK=false; setStatus(); render();
}
function loadAll(){ loadPassages(); loadFiles(); loadKichul(); }
// 화면에 쓸 파일 목록: 기출은 드라이브 우선, 같은 시험의 GitHub 기출은 숨김
function examKey(f){ return [f.school,f.grade,t(f.meta.year),t(f.meta.semester),t(f.meta.exam)].join('|'); }
function allFiles(){
  const dk=new Set(S.kichul.map(examKey));
  return [...S.kichul, ...S.files.filter(f=>!(f.kind==='기출' && dk.has(examKey(f))))];
}

function setTab(tab){ S.tab=tab; saveView(); render(); }
function query(){ return t(document.getElementById('q').value).toLowerCase(); }
function matchP(p,q){ return !q || [p.school,p.grade,bookName(p),p.lesson,p.body_text,p.dialog_text,p.grammar_points].join(' ').toLowerCase().includes(q); }
function matchF(f,q){ return !q || [f.name,f.school,f.grade,f.meta.year,f.meta.semester,f.meta.exam,f.meta.publisher,f.meta.scope].join(' ').toLowerCase().includes(q); }

// 학교 목록 (교과서 지문 + 파일에서 모음)
function schoolIndex(){
  const map={};
  const add=(school,grade,key)=>{ if(!school) return; const m=map[school]||(map[school]={lv:levelOf(school,grade),p:0,f:0,grades:new Set()}); m[key]++; if(grade) m.grades.add(grade); if(!m.lv) m.lv=levelOf(school,grade); };
  S.passages.forEach(p=>add(p.school,p.grade,'p'));
  allFiles().forEach(f=>add(f.school,f.grade,'f'));
  return map;
}

function renderSchool(){
  const side=document.getElementById('side'), main=document.getElementById('main');
  const idx=schoolIndex();
  const names=Object.keys(idx).sort((a,b)=>a.localeCompare(b,'ko'));
  if(!S.sel.school || !idx[S.sel.school]) S.sel.school = names.find(n=>idx[n].lv==='중') || names[0] || '';
  let h='';
  [['중','중학교'],['고','고등학교'],['','기타']].forEach(([lv,label])=>{
    const ns=names.filter(n=>idx[n].lv===lv); if(!ns.length) return;
    h+=`<h3>${label}</h3>`;
    ns.forEach(n=>{ h+=`<div class="side-item${n===S.sel.school?' active':''}" onclick="pickSchool(${esc(JSON.stringify(n))})"><span>${esc(n)}</span><span class="cnt">지문 ${idx[n].p} · 시험 ${idx[n].f}</span></div>`; });
  });
  side.innerHTML = h || '<div class="empty">자료 없음</div>';
  if(!S.sel.school){ main.innerHTML='<div class="empty">불러온 자료가 없습니다.</div>'; return; }

  const sc=S.sel.school, info=idx[sc];
  const grades=[...info.grades].sort(gradeSort);
  if(S.sel.grade && !grades.includes(S.sel.grade)) S.sel.grade='';
  const g=S.sel.grade, q=query();
  const ps=S.passages.filter(p=>p.school===sc && (!g||p.grade===g) && matchP(p,q));
  const fs=allFiles().filter(f=>f.school===sc && (!g||f.grade===g) && matchF(f,q));

  let m=`<div class="title-row"><h2>${esc(sc)}</h2><div class="chips">
    <span class="chip${!g?' active':''}" onclick="pickGrade('')">전체</span>
    ${grades.map(x=>`<span class="chip${x===g?' active':''}" onclick="pickGrade(${esc(JSON.stringify(x))})">${esc(x)}</span>`).join('')}
  </div></div>`;

  // 교과서
  m+=`<div class="sec"><div class="sec-h"><h3>📘 교과서</h3><span class="n">${ps.length}개 레슨</span>
      <button class="btn btn-gray btn-sm sp" onclick="openEditor(${esc(JSON.stringify({school:sc,grade:g}))})">＋ 이 학교 지문 추가</button></div>`;
  if(!ps.length) m+='<div class="empty">저장된 교과서 지문이 없습니다.</div>';
  else{
    const byKey={};
    ps.forEach(p=>{ const k=p.grade+' · '+bookName(p); (byKey[k]=byKey[k]||[]).push(p); });
    Object.keys(byKey).sort((a,b)=>gradeSort(a.split(' · ')[0],b.split(' · ')[0])||a.localeCompare(b,'ko')).forEach(k=>{
      m+=`<div class="group-label">${esc(k)}</div><div class="cards">`;
      byKey[k].sort((a,b)=>lessonSort(a.lesson,b.lesson)).forEach(p=>{ m+=passageCard(p,false); });
      m+='</div>';
    });
  }
  m+='</div>';

  m+=fileSection('📝 기출', fs.filter(f=>f.kind==='기출'), '저장된 기출 파일이 없습니다.');
  m+=fileSection('🎯 예상문제', fs.filter(f=>f.kind==='예상'), '저장된 예상문제 파일이 없습니다.');
  main.innerHTML=m;
}

function passageCard(p, showSchool){
  const i=S.passages.indexOf(p);
  const b=[];
  if(t(p.body_text)) b.push(`<span class="bdg b">본문 ${words(p.body_text)}단어</span>`);
  if(t(p.dialog_text)) b.push(`<span class="bdg d">대화문</span>`);
  if(t(p.grammar_points)) b.push(`<span class="bdg g">문법포인트</span>`);
  const sub = showSchool ? `${esc(p.school)} ${esc(p.grade)}` : [p.year,p.semester].filter(x=>t(x)).map(esc).join(' ');
  return `<div class="card" onclick="openPassage(${i})"><div class="t">${esc(p.lesson||'(레슨 미지정)')}</div>
    <div class="s">${sub||'&nbsp;'}</div><div class="badges">${b.join('')||'<span class="bdg c">내용 없음</span>'}</div></div>`;
}

function fileSection(title, list, emptyMsg){
  let m=`<div class="sec"><div class="sec-h"><h3>${title}</h3><span class="n">${list.filter(f=>!f.copy).length}개${list.some(f=>f.copy)?` (+버전 사본 ${list.filter(f=>f.copy).length})`:''}</span></div>`;
  if(!list.length){ m+=`<div class="empty">${(S.loadingF||S.loadingK)?'불러오는 중…':emptyMsg}</div></div>`; return m; }
  const groups={};
  list.forEach(f=>{ const k=[f.meta.year,f.meta.semester].filter(x=>t(x)).join(' ')||'연도 미상'; (groups[k]=groups[k]||[]).push(f); });
  Object.keys(groups).sort((a,b)=>b.localeCompare(a,'ko')).forEach(k=>{
    m+=`<div class="group-label">${esc(k)}</div><div class="cards">`;
    groups[k].sort((a,b)=>examRank(b)-examRank(a) || gradeSort(a.grade,b.grade) || (a.copy-b.copy) || a.name.localeCompare(b.name)).forEach(f=>{ m+=fileCard(f); });
    m+='</div>';
  });
  return m+'</div>';
}
function fileCard(f){
  const n=f.drive ? f.total : countQ(f.questions);
  const b=[`<span class="bdg ${f.kind==='기출'?'k':'b'}">${f.kind==='기출'?'기출':'예상'}</span>`];
  if(f.meta.publisher) b.push(`<span class="bdg">${esc(f.meta.publisher)}</span>`);
  if(f.copy) b.push('<span class="bdg c">버전 사본</span>');
  if(f.drive) b.push('<span class="bdg d">드라이브</span>');
  if(f.drive && (f.meta.drive||{}).scans && f.meta.drive.scans.length) b.push('<span class="bdg">원본 스캔</span>');
  const ref = f.drive ? `openFile('d',${S.kichul.indexOf(f)})` : `openFile('g',${S.files.indexOf(f)})`;
  return `<div class="card" onclick="${ref}" title="${esc(f.name)}">
    <div class="t">${esc(f.grade)} ${esc(f.meta.exam||'')}</div>
    <div class="s">${n}문항${f.meta.scope?' · '+esc(f.meta.scope):''}${f.meta.date?' · '+esc(f.meta.date):''}</div>
    <div class="badges">${b.join('')}</div></div>`;
}
function flatQ(qs){ const out=[]; (qs||[]).forEach(q=>{ if(q && Array.isArray(q.questions) && q.questions.length) q.questions.forEach(s=>out.push(s)); else if(q) out.push(q); }); return out; }
function countQ(qs){ return flatQ(qs).length; }

function bookIndex(){

}
function normBook(s){ return t(s).replace(/\s+/g,''); }

        <div class="f full"><label>📖 본문</label><textarea id="e_body" rows="9" placeholder="교과서 본문을 붙여넣으세요">${esc(v.body)}</textarea></div>
        <div class="f full"><label>💬 대화문</label><textarea id="e_dialog" rows="6" placeholder="예) Ted: Shall we go?&#10;Lily: Sure!">${esc(v.dialog)}</textarea></div>
        <div class="f full"><label>📐 문법포인트</label><textarea id="e_gp" rows="4" placeholder="예) 1. 관계대명사 what">${esc(v.gp)}</textarea></div>
      </div>
      <datalist id="dl_school">${allSchools.map(s=>`<option value="${esc(s)}">`).join('')}</datalist>
      <datalist id="dl_book">${allBooks.map(s=>`<option value="${esc(s)}">`).join('')}</datalist>
      <datalist id="dl_lesson">${[1,2,3,4,5,6,7,8].map(n=>`<option value="Lesson ${n}">`).join('')}</datalist>
      <div class="hint" id="e_msg"></div>
    </div>
    <div class="modal-f"><button class="btn btn-gray" onclick="${p?`openPassage(${editIdx})`:'closeModal()'}">취소</button>
      <button class="btn btn-green" id="e_save" onclick="savePassage(${p?editIdx:'null'})">💾 저장</button></div>`);
}
async function savePassage(editIdx){
  const msg=document.getElementById('e_msg');
  const p=(editIdx!=null)?S.passages[editIdx]:null;
  const school = p ? (p._school||p.school) : t(document.getElementById('e_school').value);
  const grade  = p ? (p._grade||p.grade)   : t(document.getElementById('e_grade').value);
  const bookRaw= p ? null : t(document.getElementById('e_book').value);
  const lesson = p ? p.lesson : t(document.getElementById('e_lesson').value);
  let publisher, author;
  if(p){ publisher=p.publisher; author=p.author; }
  else { const m=bookRaw.match(/^(.+?)\((.+?)\)$/); publisher=m?m[1].trim():bookRaw; author=m?m[2].trim():''; }
  const year=t(document.getElementById('e_year').value), semester=t(document.getElementById('e_sem').value);
  const body=t(document.getElementById('e_body').value), dialog=t(document.getElementById('e_dialog').value), gp=t(document.getElementById('e_gp').value);
  if(!school){ msg.innerHTML='<span style="color:var(--red)">학교를 입력하세요.</span>'; return; }
  if(!grade){ msg.innerHTML='<span style="color:var(--red)">학년을 선택하세요.</span>'; return; }
  if(!publisher){ msg.innerHTML='<span style="color:var(--red)">교과서를 입력하세요.</span>'; return; }
  if(!lesson){ msg.innerHTML='<span style="color:var(--red)">레슨을 입력하세요.</span>'; return; }
  if(!body && !dialog){ msg.innerHTML='<span style="color:var(--red)">본문이나 대화문 중 하나는 있어야 합니다.</span>'; return; }
  const exists = S.passages.some(x=>t(x._school)===school && t(x._grade)===grade && x.publisher===publisher && x.author===author && x.lesson===lesson);
  const target=`${school} ${grade} ${publisher}${author?'('+author+')':''} ${lesson}`;
  if(!confirm(`다음 행에 저장합니다.\n\n▶ ${target}  ${exists?'(기존 행 덮어쓰기)':'(새 행 추가)'}\n\n본문 ${body?body.length+'자':'없음'} · 대화문 ${dialog?dialog.length+'자':'없음'} · 문법포인트 ${gp?'있음':'없음'}`)) return;
  const btn=document.getElementById('e_save'); btn.disabled=true; msg.innerHTML='<span class="spinner"></span>저장 중...';
  try{
    await postToGAS({action:'saveMiddlePassage', school, grade, publisher, author, year, semester, lesson, body_text:body, dialog_text:dialog, grammar_points:gp});
    await loadPassages();
    const ni=S.passages.findIndex(x=>t(x._school)===school && t(x._grade)===grade && x.publisher===publisher && x.author===author && x.lesson===lesson);
    if(ni>=0 && t(S.passages[ni].body_text)===body && t(S.passages[ni].dialog_text)===dialog){ openPassage(ni); }
    else { msg.innerHTML='<span style="color:var(--red)">⚠ 저장 후 목록에서 확인되지 않습니다. 새로고침 후 다시 확인하세요.</span>'; btn.disabled=false; }
  }catch(e){ msg.innerHTML='<span style="color:var(--red)">저장 실패: '+esc(e.message)+'</span>'; btn.disabled=false; }
}
async function deletePassage(i){
  const p=S.passages[i]; if(!p) return;
  const key={school:t(p._school), grade:t(p._grade), publisher:p.publisher, author:p.author, lesson:p.lesson};
  const target=`${p.school} ${p.grade} ${bookName(p)} ${p.lesson||'(레슨 미지정)'}`;
  if(!confirm(`다음 지문을 시트에서 삭제합니다. 되돌릴 수 없습니다.\n\n▶ ${target}\n\n삭제할까요?`)) return;
  try{
    await postToGAS({action:'deleteMiddlePassage', ...key});
    await loadPassages();
    const still=S.passages.some(x=>t(x._school)===key.school && t(x._grade)===key.grade && x.publisher===key.publisher && x.author===key.author && x.lesson===key.lesson);
    closeModal();
    if(still) alert('⚠ 목록에 아직 남아 있습니다.\nGAS에 삭제 기능(deleteMiddlePassage, v14)이 새 버전으로 배포됐는지 확인하세요.');
  }catch(e){ alert('삭제 실패: '+e.message); }
}

// ━━━ [37차] 교과서 지문 일괄 가져오기 — Claude가 만든 JSON(행 배열)을 saveMiddlePassage로 차례로 저장 ━━━
// 형식: [ {school, grade, publisher, author, lesson, year, semester, body_text, dialog_text, grammar_points}, ... ]  또는 {rows:[...]}
async function importPassages(input){
  const file=input.files && input.files[0]; input.value='';
  if(!file) return;
  let rows;
  try{ const d=JSON.parse(await file.text()); rows=Array.isArray(d)?d:(d.rows||d.passages||[]); }
  catch(e){ alert('JSON을 읽지 못했습니다: '+e.message); return; }
  const req=['school','grade','publisher','lesson'];
  const bad=rows.filter(r=>!r || req.some(k=>!t(r[k])) || (!t(r.body_text)&&!t(r.dialog_text)));
  if(!rows.length || bad.length){ alert(`가져올 수 없는 행이 있습니다 (${bad.length}/${rows.length}).\n학교·학년·출판사·레슨, 본문 또는 대화문이 있어야 합니다.`); return; }
  const same=r=>S.passages.some(x=>t(x._school)===t(r.school)&&t(x._grade)===t(r.grade)&&x.publisher===t(r.publisher)&&x.author===t(r.author)&&x.lesson===t(r.lesson));
  const list=rows.map(r=>`· ${t(r.school)} ${t(r.grade)} ${t(r.publisher)}${t(r.author)?'('+t(r.author)+')':''} ${t(r.lesson)} — 본문 ${t(r.body_text).length}자 · 대화 ${t(r.dialog_text).length}자 · 문법포인트 ${t(r.grammar_points)?'있음':'없음'}${same(r)?'  (기존 행 덮어쓰기)':''}`).join('\n');
  if(!confirm(`다음 ${rows.length}개 행을 시트에 저장합니다.\n\n${list}`)) return;
  const st=document.getElementById('status');
  for(let i=0;i<rows.length;i++){
    const r=rows[i];
    st.innerHTML=`<span class="spinner"></span>가져오는 중 ${i+1}/${rows.length} — ${esc(t(r.school))} ${esc(t(r.grade))} ${esc(t(r.lesson))}`;
    try{
      await postToGAS({action:'saveMiddlePassage', school:t(r.school), grade:t(r.grade), publisher:t(r.publisher), author:t(r.author),
        year:t(r.year), semester:t(r.semester), lesson:t(r.lesson), body_text:t(r.body_text), dialog_text:t(r.dialog_text), grammar_points:t(r.grammar_points)});
    }catch(e){ alert(`${i+1}번째 행 저장 실패: ${e.message}\n여기서 멈춥니다.`); break; }
  }
  await loadPassages();
  const miss=rows.filter(r=>!same(r));
  alert(miss.length ? `⚠ 목록에서 확인되지 않은 행 ${miss.length}개:\n`+miss.map(r=>`${t(r.school)} ${t(r.grade)} ${t(r.lesson)}`).join('\n') : `✅ ${rows.length}개 행 저장 완료`);
}

// 기출·예상문제 보기
async function openFile(src,i){
  const f = src==='d' ? S.kichul[i] : S.files[i]; if(!f) return;
  if(f.drive && !f.questions){
    openModal(`<div class="modal-h"><div><h3>📝 ${esc(f.school)} ${esc(f.grade)} ${esc(f.meta.exam||'')}</h3></div><button class="x" onclick="closeModal()">×</button></div>
      <div class="modal-b"><span class="spinner"></span>드라이브에서 불러오는 중...</div>`);
    try{
      const r=await getFromGAS({action:'getKichul', id:f.id});
      if(r.ok===false) throw new Error(r.error||'GAS 오류');
      f.questions=(r.data&&r.data.questions)||[]; f.meta=(r.data&&r.data.meta)||f.meta;
    }catch(e){
      openModal(`<div class="modal-h"><div><h3>불러오기 실패</h3></div><button class="x" onclick="closeModal()">×</button></div><div class="modal-b"><span style="color:var(--red)">${esc(e.message)}</span></div>`);
      return;
    }
    if(!document.getElementById('modalBg').classList.contains('on')) return; // 그 사이 닫았으면 그대로
  }
  const m=f.meta;
  const metaItems=[['학교',f.school+' '+f.grade],['시험',[m.year,m.semester,m.exam].filter(x=>t(x)).join(' ')],['날짜',m.date],['교재',m.publisher],['범위',m.scope],['문항',countQ(f.questions)+'문항'],['만든 방식',m.build],['정답 근거',m.answer_basis],['판독 메모',Array.isArray(m.transcription_notes)?m.transcription_notes.join(' / '):m.transcription_notes]]
    .filter(([,v])=>t(v)).map(([k,v])=>`<span><b>${k}</b> ${esc(v)}</span>`).join('');
  let qs='';
  (f.questions||[]).forEach(q=>{ qs+=renderQ(q); });
  const dv=m.drive||{};
  const links=[
    ...(dv.scans||[]).map(x=>`<a class="btn btn-gold" href="${esc(x.url)}" target="_blank" rel="noopener">🖼 원본 스캔${(dv.scans.length>1)?': '+esc(x.title):''}</a>`),
    dv.restore_docx?`<a class="btn btn-gray" href="${esc(dv.restore_docx)}" target="_blank" rel="noopener">복원 docx</a>`:'',
    dv.folder?`<a class="btn btn-gray" href="${esc(dv.folder)}" target="_blank" rel="noopener">스캔 폴더</a>`:'',
    f.html?`<a class="btn btn-gray" href="${esc(f.html)}" target="_blank" rel="noopener">GitHub에서 열기</a>`:''
  ].filter(Boolean).join('');
  openModal(`<div class="modal-h"><div><h3>${f.kind==='기출'?'📝':'🎯'} ${esc(f.school)} ${esc(f.grade)} ${esc(m.exam||'')}</h3>
      <div class="sub">${esc(f.name)}${f.copy?' · 버전 사본':''}${f.drive?' · 드라이브 기출DB':''}</div></div>
      <button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-b" id="fileBody"><div class="qmeta">${metaItems}</div>${qs||'<div class="empty">문항이 없습니다.</div>'}</div>
    <div class="modal-f"><label style="display:flex;gap:6px;align-items:center;font-size:.85rem;margin-right:auto;"><input type="checkbox" onchange="document.getElementById('fileBody').classList.toggle('show-ans',this.checked)"> 정답·해설 보기</label>
      ${links}
      <button class="btn btn-navy" onclick="closeModal()">닫기</button></div>`);
}
function renderQ(q){
  if(!q) return '';
  if(Array.isArray(q.questions) && q.questions.length){ // 묶음 문항
    let h=`<div class="q">${t(q.set_header)?`<div class="sh">${richText(q.set_header)}</div>`:''}${t(q.passage||q.question)?`<div class="body">${richText(q.passage||q.question)}</div>`:''}</div>`;
    q.questions.forEach(s=>{ h+=renderQ(s); });
    return h;
  }
  const ch=Array.isArray(q.choices)&&q.choices.length ? `<ul class="ch">${q.choices.map(c=>`<li>${richText(c)}</li>`).join('')}</ul>` : '';
  const ans=[t(q.answer)?'정답 '+q.answer:'', t(q.explanation)?q.explanation:''].filter(Boolean).join('\n');
  return `<div class="q">${t(q.set_header)?`<div class="sh">${richText(q.set_header)}</div>`:''}
    <div class="qh"><span class="no">${esc(q.num!=null?q.num:'')}.</span>${q.qtype?`<span class="qt">${esc(q.qtype)}</span>`:''}${q.score?`<span class="sc">${esc(q.score)}점</span>`:''}</div>
    <div class="body">${richText(q.question||'')}</div>${t(q.box)?`<div class="qbox">${richText(q.box)}</div>`:''}${ch}
    ${ans?`<div class="ans">${richText(ans)}</div>`:''}</div>`;
}

// ━━━ 시작 ━━━
render(); setStatus(); loadAll();
