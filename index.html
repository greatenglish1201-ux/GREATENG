경적 경험에 의한 선호도 변화", "abstract": "Although humans have an evolutionarily programmed preference for savanna-like environments, this instinct is gradually modified by their actual environmental experiences as they grow older.", "keyIndex": 7, "sentences": ["People like pictures of the savanna, even if they have never been there.", "In one study, people of different ages (8, 11, 15, 18, 35, and over 70 years) looked at images of tropical forests, deciduous forests, coniferous forests, deserts, and the East African savanna.", "Eight-year-old children said that they would like to live in or visit the savanna more than any other environment.", "After the age of 15, people also liked deciduous and coniferous forests.", "Since none of these people had visited savannas, the implication is that this preference was programmed into their brains.", "This programmed preference is called the savanna hypothesis.", "As people get older, this preference gets modified by where they have lived.", "Synek and Grammer, researchers in evolutionary psychology, confirmed these findings in a different study.", "They showed that young children in Austria prefer landscapes thinly dotted with trees and with low mountains, scenes that resemble the savanna.", "After puberty, their preferences shifted to areas with denser trees and higher mountains, again, presumably, because of more experience with these terrains."], "aGroup": ["preference was programmed", "savanna hypothesis", "prefer landscapes thinly dotted with trees"], "bGroup": ["preference gets modified", "preferences shifted", "because of more experience"], "answers": ["programmed preference modification", "unconditional biological instinct", "permanent evolutionary traits", "continuous habitat destruction", "complete cognitive restructuring"]}, {"id": "27ST_E_28_02", "difficulty": "높음", "title": "인지적 작동의 투명성으로 인한 꿈의 출처 모니터링 한계", "abstract": "Because the generation process of dreams lacks observable cognitive operations and is transparent, it is much more difficult to source monitor dreams compared to imaginations.", "keyIndex": 7, "sentences": ["Dreamers find it difficult to determine whether a memory is from a dream or some other source after time has passed, known as source monitoring.", "It is difficult to distinguish between memories of real dreams and made-up ones, imagination or stories someone else told us.", "Dream source monitoring was found to be less accurate than other memory source monitoring.", "A cognitive psychologist, Marcia K. Johnson and her colleagues' explanation is that real dreams are deficient in information about cognitive operations that help identify the self-generations we create when we are awake.", "Although dreams are usually more vivid than imagination, the cognitive operations that generate imagining are also remembered.", "Remembering that you intentionally thought of an image helps distinguish it from a perception that you did not intentionally generate.", "Dream generation, in contrast, is transparent in that we don't experience the generation process, making it more difficult to source monitor."], "aGroup": ["real dreams are deficient in information", "don't experience the generation process", "transparent", "more difficult to source monitor"], "bGroup": ["imagination", "intentional imagination", "intentionally thought of an image"], "answers": ["difficult source monitoring", "vivid imagination generation", "accurate cognitive operation", "intentional dream creation", "physical memory distortion"]}, {"id": "27ST_E_28_03", "difficulty": "보통", "title": "긍정적 자아상을 지키기 위한 사건의 중요도 조절 전략", "abstract": "People defend their positive self-image by strategically titrating the importance of events, trivializing failures while amplifying the significance of successes.", "keyIndex": 9, "sentences": ["Much research in social psychology has documented some of the key strategies that people rely upon in defending the belief I am good.", "For example, when people perform poorly at something, they tend to trivialize their failures.", "This trivialization disarms those failures and prevents them from overwriting their life stories.", "Imagine, say, that someone fails a calculus test.", "A common defensive response is to conclude that this test was just not that important to them.", "They may say to themselves, Who cares about calculus anyway. I'm not going to become a mathematician.", "In contrast, people will typically show the precise opposite pattern for their successes and will interpret those events as being of outsize importance.", "So if someone aces a calculus test, they may think to themselves about how crucial calculus is for their future career success and how it's key to getting into graduate school or getting a highly desired job as an engineer or a financial analyst.", "By titrating how importantly people view their successes and failures, they can shape their emotional reactions to these events in a way that enables them to tell a more convincing story that I am good."], "aGroup": ["trivialize their failures", "disarms those failures", "test was just not that important"], "bGroup": ["outsize importance", "crucial calculus is", "key to getting into graduate school"], "answers": ["titrating event importance", "accepting objective reality", "ignoring future career", "repeating previous failures", "maximizing academic pressure"]}, {"id": "27ST_E_29_GATE", "difficulty": "높음", "title": "공정한 집단 선택을 위한 무작위화의 필요성", "abstract": "To ensure impartial collective choices that satisfy both anonymity and neutrality, the use of randomization such as lotteries is essential.", "keyIndex": 4, "sentences": ["When gathering the preferences of multiple agents into one collective choice, it is easily seen that certain cases call for randomization or other means of tiebreaking.", "For example, if there are two alternatives, a and b, and two agents such that one prefers a and the other one b, there is no deterministic way of selecting a single alternative without violating one of two basic fairness conditions known as anonymity and neutrality.", "Anonymity requires that the collective choice ought to be independent of the agents' identities whereas neutrality requires impartiality towards the alternatives.", "Allowing lotteries as social outcomes hence seems like a necessity for impartial collective choice.", "Indeed, most common deterministic social choice functions such as plurality rule are only deterministic as long as there is no tie, which is usually resolved by drawing a lot.", "The use of lotteries for the selection of officials interestingly goes back to the world's first democracy in Athens, where it was widely regarded as a principal characteristic of democracy, and has recently gained increasing attention in political science."], "aGroup": ["deterministic way", "violating one of two basic fairness conditions", "deterministic as long as there is no tie"], "bGroup": ["randomization", "means of tiebreaking", "lotteries", "drawing a lot"], "answers": ["impartial collective choice", "absolute deterministic rule", "biased social outcome", "direct political intervention", "unequal preference gathering"]}, {"id": "27ST_E_29_01", "difficulty": "낮음", "title": "일상적 삶과 약속의 원칙을 반영하는 법의 본질", "abstract": "Contrary to the misconception that law is exclusive to experts, its core substance simply reflects our everyday experiences and the ways we manage promises.", "keyIndex": 3, "sentences": ["Along with the mistaken notion that the law resides in the books goes the equally mistaken idea that law is secret, or at least inaccessible to the ordinary person.", "To understand and apply the law at the advanced, technical level that lawyers do requires professional knowledge, but to understand the basic substance of the law does not.", "Law reflects life.", "The principles and issues embodied in the law are not different from those that we experience in other aspects of our lives.", "Contract law, for example, is a commentary on the way people make, interpret, keep, and break their promises in commercial and noncommercial settings.", "Few nonlawyers can describe the objective theory of contract formation or the Statute of Frauds, but they have thought a lot about contracts and promises.", "If you cross your fingers when you make a promise, does it mean that the promise doesn't count?", "If your newly purchased television doesn't work, can you return it to the store?", "And so on."], "aGroup": ["resides in the books", "secret", "inaccessible to the ordinary person", "requires professional knowledge"], "bGroup": ["basic substance", "law reflects life", "experience in other aspects of our lives", "thought a lot about contracts and promises"], "answers": ["reflecting everyday life", "demanding professional knowledge", "concealing legal secrets", "applying advanced technology", "enforcing strict punishment"]}, {"id": "27ST_E_29_02", "difficulty": "보통", "title": "인터넷 환경으로 인한 패션 수요 예측의 어려움", "abstract": "The internet and social media have empowered consumers with instant information and a desire for unique styles, making it extremely difficult for fashion retailers to predict market demand.", "keyIndex": 1, "sentences": ["The internet has transformed the fashion marketplace, making it increasingly difficult to predict the demand for the selling season.", "Consumers can browse for product information and prices and gain comparative information almost instantaneously, making them more informed than ever before, transferring the balance of power from the retailer to the customer.", "This is exacerbated by open and real-time access to fashion shows, facilitated through livestreaming, coupled with social media access to celebrity looks and lifestyles and the sharing of all aspects of life on social media.", "Consumers use fashion choices to express their individual style and personality, especially those promoting brand me on social media.", "The traditional two-season offer is no longer seen as enough, with consumers demanding new products throughout the whole year.", "This creates a problem for fashion retailers as many consumers are looking for more exclusive pieces to differentiate themselves, forcing up the desire for trend-led ever more rapidly changing styles, while still demanding affordable prices."], "aGroup": ["increasingly difficult to predict the demand", "traditional two-season offer is no longer seen as enough", "creates a problem for fashion retailers"], "bGroup": ["consumer empowerment", "unpredictable demand", "access to fashion shows", "brand me", "demanding new products"], "answers": ["unpredictable market demand", "stable traditional offer", "decreasing fashion interest", "expanding physical stores", "limited consumer power"]}, {"id": "27ST_E_29_03", "difficulty": "보통", "title": "유해 시설의 흑인 거주지 밀집을 초래하는 환경적 인종차별", "abstract": "Redlining, the deliberate placement of hazardous infrastructure near Black communities, constitutes a fatal form of environmental racism that drastically increases their mortality rates.", "keyIndex": 4, "sentences": ["What deeply affected so many Black communities globally was not only that they could not metaphorically breathe because of the oppressive forms and limits of white supremacy, but also that so many Black communities literally cannot breathe because of environmental racism.", "Similarly to Black communities in the UK, Black Americans are also more likely to live near landfills, industrial plants and fossil-fuel infrastructure.", "The process by which this hazardous infrastructure is deliberately situated close to African American communities is called redlining.", "This process means that fossil-fuelled power plants and hazardous-waste facilities are disproportionately and deliberately situated in Black or ethnic-minority neighbourhoods.", "As a result of this, Black Americans are three times more likely to die from exposure to air pollutants than their white counterparts."], "aGroup": ["environmental racism", "deliberately situated", "redlining", "disproportionately and deliberately situated"], "bGroup": ["literally cannot breathe", "hazardous infrastructure", "exposure to air pollutants", "three times more likely to die"], "answers": ["environmental racism impact", "improving urban infrastructure", "ensuring racial equality", "reducing fossil fuels", "historical cultural preservation"]}, {"id": "27ST_E_30_GATE", "difficulty": "낮음", "title": "맛의 기호성과 균일화를 위한 블렌디드 허니", "abstract": "Processors blend different types of natural honey to create a more palatable and uniform flavor that meets consumers' demand for mild and reliable tastes.", "keyIndex": 6, "sentences": ["Honey can be eaten by itself or mixed with other ingredients.", "Natural or pure honey has had no additives, preservatives or synthetic ingredients added.", "Also referred to as undiluted, it is usually more expensive than diluted honeys.", "Natural honey can also be called blended honey, in which honeys from various sources are blended together — not by the bees, but by human processors and distributors in stages after the honey has been collected.", "Blending is frequently done for taste as well as marketing reasons, especially since some consumers find the darker honeys too strong.", "Mixing different types of honey together can make it more palatable, and also gives a more uniform flavour — this is an important consideration for producers and retailers, who feel the need to guarantee reliable, unsurprising (typically mild) flavours to their customers.", "Clover is one of the most popular honeys in the U.S., and its mild flavour and taste have become familiar to many Americans."], "aGroup": ["human processors", "blending", "marketing reasons", "mixing different types of honey"], "bGroup": ["darker honeys too strong", "make it more palatable", "uniform flavour", "reliable unsurprising mild flavours"], "answers": ["uniform flavor blending", "adding artificial preservatives", "preserving strong taste", "limiting commercial distribution", "protecting natural habitats"]}, {"id": "27ST_E_30_01", "difficulty": "보통", "title": "양극단을 피하는 균형 잡힌 식단으로서의 절제", "abstract": "True moderation in a diet means avoiding the extremes of entirely eliminating bad foods or overconsuming good nutrients, and instead accommodating all types of food in balance.", "keyIndex": 8, "sentences": ["Not too much or too little — that's what moderation means.", "Moderation does not mean that you have to eliminate low-nutrient-density foods from your diet, such as soft drinks and candy, but rather that you can include them occasionally.", "Moderation entails not taking anything to extremes.", "You probably have heard that vitamin C has positive effects, but that doesn't mean huge doses of this essential nutrient are appropriate for you.", "It's also important to remember that substances that are healthful in small amounts can sometimes be dangerous in large quantities.", "For example, the body needs zinc for hundreds of chemical reactions, including those that support normal growth, development, and immune function.", "Too much zinc, however, can cause deficiency of copper, another essential mineral, which can lead to damaged immune function.", "Being moderate in your diet means that you do not restrict or completely eliminate any one type of food, but rather that all types of food can fit into a healthful diet."], "aGroup": ["not taking anything to extremes", "eliminate low-nutrient-density foods", "huge doses", "dangerous in large quantities"], "bGroup": ["moderation", "include them occasionally", "all types of food can fit into a healthful diet"], "answers": ["balanced dietary moderation", "complete nutritional elimination", "excessive vitamin consumption", "restricting specific foods", "maximizing daily intake"]}, {"id": "27ST_E_30_02", "difficulty": "보통", "title": "인지적 한계와 환경적 단서에 지배받는 식습관", "abstract": "Our dietary behaviors are often determined not by hunger but by automatic responses to contextual cues in our social and physical environments.", "keyIndex": 1, "sentences": ["Dietary behaviors are, in large part, the consequence of automatic responses to a particular situation with food, many of which lead to increased caloric consumption and poor dietary choices.", "Individuals are subject to inherent cognitive limitations and mostly lack the capacity to consistently recognize, ignore, or resist contextual cues that encourage eating.", "Take, for example, going to the movies.", "For many, a night at the movies also means sharing popcorn, candy, and soda.", "People often cannot resist this learned indulgence and are encouraged by the environment to eat a particular food.", "Another example is eating potato chips or peanuts that have been set out during a friendly card game or conversation with others.", "Individuals often consume snacks not because they are hungry, but because they are prompted by the social environment, which encourages them to eat.", "Similarly, grocery stores and restaurants have discovered the profits in suggestive selling, a sales technique where the customer is encouraged to make an additional purchase by taking advantage of a two-for-one sale or special discount.", "Grocery stores often use placement of items to encourage impulse buying."], "aGroup": ["cognitive limitations", "lack the capacity to resist", "automatic responses", "learned indulgence"], "bGroup": ["particular situation", "contextual cues", "encouraged by the environment", "prompted by the social environment", "suggestive selling"], "answers": ["environmental dietary cues", "conscious nutritional choices", "overcoming cognitive limits", "reducing caloric consumption", "resisting social pressure"]}, {"id": "27ST_E_30_03", "difficulty": "보통", "title": "생애 초기 미각 경험이 평생 식습관에 미치는 영향", "abstract": "Positive sensory experiences with healthy flavors early in life, such as through amniotic fluid and mother's milk, are crucial for promoting healthy eating habits throughout a person's life.", "keyIndex": 6, "sentences": ["Science shows that, when compared to adults, children naturally prefer higher levels of sweet and salty tastes and reject bitter tastes.", "This might help explain why children are drawn to more unhealthy food choices within our current food environment — an environment composed of high-salt, high-refined-sugar foods.", "In support of this idea, studies have found that sensory experiences, beginning early in life, can shape preferences in both a positive and a negative way.", "For example, expecting mothers who consume diets rich in healthy foods can help develop their child's taste preferences in a positive way because flavors from foods that the mother eats are transmitted to amniotic fluid and to mother's milk, creating an environment in which breastfed infants are more accepting of these flavors.", "In contrast, infants fed formula learn to prefer its unique flavor profile and may have more difficulty initially accepting flavors not found in formula, such as those of fruit and vegetables.", "Having healthy food experiences early in life may go a long way toward promoting healthy eating throughout a person's life span."], "aGroup": ["prefer higher levels of sweet and salty tastes", "drawn to more unhealthy food", "prefer unique flavor profile of formula"], "bGroup": ["sensory experiences", "early flavor exposure", "more accepting of these flavors", "shape preferences in a positive way"], "answers": ["early sensory experiences", "restricting unhealthy food", "ignoring natural instincts", "preferring refined sugar", "feeding synthetic formula"]}, {"id": "MOGO_GO3_03_20", "difficulty": "높음", "title": "과학의 객관성을 지탱하는 문화적 배태성", "abstract": "The fact that science is an activity embedded in cultural contexts does not undermine its truthfulness but rather serves as a necessary foundation and driving force for acquiring secure knowledge.", "keyIndex": 4, "sentences": ["Some argue that if science is embedded in culture and bound up with art and philosophy, if it is a human activity, then this undermines science's claims to be genuine knowledge.", "At best, science is no better than religion, just another practice with its own subjective methodology.", "But why say this?", "Just the opposite is true.", "In order to hit the target with my bow and arrow, I need to do something, to take aim and concentrate.", "The fact that I am a being with a body, embedded in a culturally rich situation, is no obstacle to my sometimes succeeding.", "In fact, it is that embedding that supplies me not only with the physical means — the bow and the arrow, and the training — but also with the motivation to hit the target in the first place.", "Science and perception too are similarly human activities that aim at secure knowledge of the world."], "aGroup": ["embedded in culture", "undermines science's claims", "subjective methodology"], "bGroup": ["cultural embedding", "secure knowledge", "aim at secure knowledge"], "answers": ["cultural embedding as the foundation of science", "subjective methodology undermining scientific truth", "religious belief as an alternative to science", "cultural obstacles preventing scientific inquiry", "physical limitations in scientific observation"]}, {"id": "MOGO_GO3_03_21", "difficulty": "높음", "title": "기술적 진보에 얽매인 현대 음악 비판", "abstract": "As modern music becomes obsessively tied to the scientific standards of novelty and technical progress, its true essence is degraded into mere technique or a meaningless object.", "keyIndex": 3, "sentences": ["A brilliant musician can in fact be an innovator without strictly speaking being an inventor.", "In such cases, those who expect \"great discoveries\" will be disappointed.", "Let there be no doubt: the eager need for novelty, so characteristic of the escalating modernist auction, involves the idea that a musical act is a thing, in which case, music is no more than technique, technique alone.", "And just as technique is the consequence of an indefinite process of perfection — with each automobile or kitchen appliance show introducing what is new and improved in comparison to last year's — so never-ending progress shall be the law of music.", "Farther, faster, more powerful!", "In this arms race, each new music, breaking its predecessor's records, offers itself as the last thing in modernity; and each musician, forcing predecessors into the category of the unfashionable and outmoded, claims the patent on the invention.", "In an era where pastiches of \"scientific investigation\" have become quasi-universal, musicians owe it to themselves to become \"researchers\" just like everyone else."], "aGroup": ["musical act is a thing", "music is no more than technique", "researchers"], "bGroup": ["eager need for novelty", "indefinite process of perfection", "arms race"], "answers": ["obsession with novelty reducing music to mere technique", "great discoveries as the goal of modern music", "brilliant innovators revolutionizing musical tradition", "musical essence preserved through technical progress", "emotional expression as the core of music"]}, {"id": "MOGO_GO3_03_22", "difficulty": "보통", "title": "질문의 이면을 해결하는 진정한 대답", "abstract": "A truly good reply to a question is not just a factual response to the surface inquiry, but one that effectively solves the underlying problem hidden behind the question.", "keyIndex": 9, "sentences": ["We often express problems interrogatively.", "Instead of commanding you to find my keys, I might ask you where they are.", "But \"Where are my keys?\" is a problem hiding in question clothing.", "To see this, consider some possible answers.", "\"Not on the surface of the sun\" truthfully gives the location of my keys, as does, \"Wherever your keys are.\"", "Nonetheless, these are bad answers, and they are bad precisely because they do not help me achieve the goal — leaving the house, opening a locked door — to which keylessness constituted an obstacle.", "Consider the reply \"They are in your room.\"", "This is a good reply if you have a small, tidy room, but if your room is large and messy, you might need the location more clearly specified.", "Whether or not it is a good reply is a function of whether or not it solves the problem.", "Indeed, \"Here, take mine\" could be a good reply to \"Where are my keys?\" if what is needed is to leave the house quickly.", "A good reply doesn't need to offer an answer to the question, \"Where are my keys?\" as long as it resolves the problem of not being able to leave the house."], "aGroup": ["express problems interrogatively", "question clothing", "truthfully gives the location"], "bGroup": ["problem-solving", "resolves problem", "resolves the problem"], "answers": ["solves the problem", "truthfully gives location", "expresses problems interrogatively", "hides in clothing", "specifies the location"]}, {"id": "MOGO_GO3_03_23", "difficulty": "높음", "title": "AI 시대의 필수 생존 전략: 지속적 학습", "abstract": "In order to adapt to the ever-evolving work environment driven by AI, continuous learning and reskilling are essential for individuals, and organizations must foster a culture of ongoing learning.", "keyIndex": 5, "sentences": ["Young employees agree that AI has more positive impact with the dynamics of the workforce, though there are major concerns on job loss and being left behind.", "While AI has the potential to automate certain jobs, it is also giving rise to new career opportunities and demands.", "The increasing application of AI technology has led to a sudden increase in the need for professionals who can effectively manage and get the most out of AI systems.", "Moreover, soft skills such as innovative thinking, problem-solving abilities, and the capability for interdisciplinary collaboration are gaining greater recognition.", "In the age of AI, continuous learning has become an essential quality for professionals in the workplace.", "The ever-evolving technological landscape necessitates employees to consistently update their skills, acquire new knowledge, and adapt to the dynamic changes in the work environment.", "Only reskilling and adaptability can help resolve the workforce of the future.", "Implanting a culture of ongoing learning by fostering a workplace culture that encourages continuous learning and skill development should be a main priority for each organization."], "aGroup": ["automate certain jobs", "ever-evolving technological landscape", "dynamic changes"], "bGroup": ["soft skills", "continuous learning", "reskilling and adaptability", "culture of ongoing learning"], "answers": ["continuous learning as essential in the AI era", "automating certain jobs through AI technology", "technological landscape requiring workforce adaptation", "dynamic changes threatening traditional employment", "future job loss due to AI automation"]}, {"id": "MOGO_GO3_03_24", "difficulty": "높음", "title": "번역의 예술적 가치: 낯섦의 회복", "abstract": "Translation is a crucial creative act that restores the inherent strangeness of an overly familiar original work, thereby enhancing its artistic visibility.", "keyIndex": 2, "sentences": ["Something too domesticated isn't actually more accessible or approachable, it evaporates altogether — we just take it for granted until art restores its visibility.", "And perhaps translation is an art especially well suited for this task: while a great work of literature accumulates imitations and cliches and a body of scholarship and analysis and study guides that may well bury it, translations of that work free it from its stodgy fame and make the stone stony again, precisely by putting it in another language.", "A bad text is one that, in Berman's terms, lacks \"native strangeness\" — and when you translate it, nothing happens.", "The translation of a true work of art is significant because it reinforces and enhances qualities already inherent in it: \"translation is not a makeshift, but the mode of existence by which a work reaches us as etrange\".", "As Wilson put it, translation makes the work \"seem more strange, and newly strange.\""], "aGroup": ["too domesticated", "evaporates", "stodgy fame", "lacks native strangeness"], "bGroup": ["restores its visibility", "restored strangeness", "reaches us as etrange", "newly strange"], "answers": ["translation restoring native strangeness to works", "domesticated texts losing artistic visibility", "stodgy fame burying original literary works", "makeshift translation as an artistic shortcut", "familiar accessibility as the translation goal"]}, {"id": "MOGO_GO3_03_29", "difficulty": "보통", "title": "환경에 무관심한 유전적 특성과 생존의 한계", "abstract": "Because genetic inheritance is conservative and indifferent to environmental changes, organisms face inherent limitations in adaptability, meaning not all living things can survive everywhere.", "keyIndex": 5, "sentences": ["Darwin understood that since inheritance is conservative, it is in the nature of the organism to impose itself on the surroundings, producing many highly similar but variable offspring regardless of the nature of the conditions.", "He further recognized that these fundamental aspects of the nature of the organism imply reproductive overrun, with organisms routinely producing more offspring than there are resources to support them.", "The need to survive implies that the capacity for using necessary resources must complement the opportunity to use them.", "But needs and opportunity do not perfectly match.", "Inheritance produces the capacities for exploiting the surroundings, but in a way that is indifferent to the surroundings.", "Offspring cannot anticipate the nature of the conditions in which they find themselves, much less alter themselves in ways that are suitable to any changes in those conditions.", "While it is true that organisms can express some amount of flexibility in their form and function in response to their immediate surroundings, these adjustments are minor compared to the constraints of inheritance.", "As a result, not every living thing can live everywhere."], "aGroup": ["inheritance is conservative", "regardless of the nature of the conditions", "indifferent to the surroundings", "constraints of inheritance"], "bGroup": ["do not perfectly match", "cannot anticipate", "much less alter themselves", "not every living thing can live everywhere"], "answers": ["constraints of inheritance", "environmental flexibility", "perfectly match", "necessary resources", "reproductive overrun"]}, {"id": "MOGO_GO3_03_30", "difficulty": "보통", "title": "개념화의 추상성과 개체의 고유성", "abstract": "While categorizing objects with common nouns ignores their specific differences for practical purposes, looking closer reveals that every entity possesses its own unique individuality and distinct life history.", "keyIndex": 1, "sentences": ["Every time you conceptualize, categorize, and put a name on something that is not a proper name, you abstract away from its particularities.", "Picture daisies and clover flowers in a lawn.", "Those four ordinary nouns leave out their differences.", "\"Flower\" co-categorizes the white and yellow types with the beige ones, and all the many other sorts to be found elsewhere.", "\"Lawn\" acknowledges the varieties of grass and all the nongrassy plants that are there.", "Zoom in, and you will find individuality and uniqueness everywhere.", "No two daisies, no two clovers, are exactly alike, and yet they present to a quick glance a carpet patterned uniformly enough.", "For most practical purposes, the differences can be neglected — making a daisy chain, sunbathing, and the like.", "Not so, however, for the groundskeeper of a sports stadium, where the constituent grasses and their stages of growth really do matter.", "And to an infinite mind, with infinite memory, each blade of grass, with its own distinct life history, need not be co-categorized with all its fellows.", "Each could have its own name, as you yourself do."], "aGroup": ["conceptualize", "categorize", "abstract away from its particularities", "leave out their differences", "co-categorizes"], "bGroup": ["individuality and uniqueness", "exactly alike", "distinct life history", "its own name"], "answers": ["categorization abstracting away individual uniqueness", "individuality and uniqueness in everyday objects", "practical purposes of categorizing natural objects", "distinct life history of each individual entity", "exact differences between similar-looking objects"]}, {"id": "MOGO_GO3_03_31", "difficulty": "높음", "title": "자본주의적 가치로 수량화되는 현대 예술 비판", "abstract": "In Western culture, the essence of art is often overshadowed by commercialism, turning professional art into an inherently capitalist endeavor where success is quantified by financial gain.", "keyIndex": 8, "sentences": ["\"Art without commerce is a hobby.\"", "These words, spoken with much authority to senior fine arts majors, are the kind that those who create art are unable to ignore.", "We worry about this idea that if we are not engaged in commerce, then we are not professional; and if we are not professional, can we even call ourselves artists?", "Art of any form, by its very nature, cannot or should not be quantified, and yet writers measure pages and words; visual artists measure canvases completed all in an effort to appear \"productive,\" to perhaps justify this urge to create.", "The notion of creating for art's sake is then seen as hopelessly romantic and nearly indefensible.", "Of course one can engage in art, but it better be for money, for that is the only marker of success.", "But was that professor's declaration merely an old talker with a title mindlessly repeating the cultural norms and expectations that had, in fact, labeled him as \"successful\"?", "In Western culture, it is almost impossible to separate professional from commercial, and so the artist is legitimized by their ability to earn money.", "Professional art, then, is inherently capitalist."], "aGroup": ["commerce", "quantified", "productive", "for money", "capitalist"], "bGroup": ["art's sake", "romantic", "urge to create"], "answers": ["professional art as an inherently capitalist endeavor", "hopelessly romantic view of art for its own sake", "urge to create as the essence of artistry", "purely aesthetic goals in Western art tradition", "noncommercial hobby as true artistic expression"]}, {"id": "MOGO_GO3_03_32", "difficulty": "보통", "title": "주관적 이야기를 넘어선 학문적 역사의 필요성", "abstract": "Because stories about the past are inevitably subjective and distorted, learning history as a disciplined academic pursuit is essential for critically analyzing and understanding those accounts.", "keyIndex": 5, "sentences": ["We cannot make sense of the facts of the past unless they are embedded in stories, and stories, of necessity, are not neutral collections of facts.", "Stories are necessarily selective, subjective and attractive.", "The shortest of stories is the result of choices, conscious and unconscious.", "Stories influence subtly, invest power, make hidden moral judgement and always distort by omission, whether intentionally or not.", "This is why all educated citizens need not just facts about the past but history as a discipline.", "For we need to understand why history takes the form that it does in scholarly accounts.", "Disciplined historical argument is not the same as informal hearing and telling of stories; it requires familiarity with abstract generalizations, familiarity with prior scholarly discourse and an ability to make use of evidence, styles of argument and analytic structures in order to substantiate claims.", "Such disciplinary knowledge is not the same as 'everyday' knowledge and it is not likely to be picked up informally."], "aGroup": ["not neutral", "selective", "subjective", "distort by omission", "informal hearing"], "bGroup": ["history as a discipline", "scholarly accounts", "disciplined historical argument", "disciplinary knowledge"], "answers": ["disciplined historical argument", "everyday knowledge", "informal stories", "subjective omissions", "neutral facts"]}, {"id": "MOGO_GO3_03_33", "difficulty": "높음", "title": "인간의 본능과 공명하는 성공적인 건축", "abstract": "Successful architecture functions as a spatial choreography that intuitively resonates with human instincts and needs, guiding behavior naturally without the need for manuals.", "keyIndex": 7, "sentences": ["All architectural structures are forms of spatial choreography that guides action; space facilitates or prohibits, encourages or prevents, invites or inhibits.", "This choreography predetermines patterns of movement and behavior, but it also guides experiential characteristics, perceptions, imageries, emotions and feelings.", "A sensitive and empathic designer intuits human behavior and desire, and this intuitive architectural scripting resonates with the actual user/occupant's natural and instinctual needs and intentions.", "While designing a house, the designer lives, uses and feels the non-existent house in his imagination on behalf of the future dweller.", "A correctly placed window is located exactly where the occupant wishes to look out into the garden, or where daylight is needed.", "The stairway is located where the dweller wishes to enter the floor above or below.", "Successful architecture does not need manuals or signage for its use, as it reveals its very structure and use in a wordless manner.", "A profound building is an extension of human bodily and mental actions and capabilities."], "aGroup": ["spatial choreography", "architectural scripting", "wordless manner"], "bGroup": ["intuitions", "natural and instinctual needs", "extension of human bodily and mental actions"], "answers": ["successful architecture resonating with human instincts", "explicit manuals guiding architectural design", "structural limits determining architectural success", "decorative purpose of architectural aesthetics", "disjointed space causing user disorientation"]}, {"id": "MOGO_GO3_03_34", "difficulty": "높음", "title": "상호작용 데이터가 규정하는 개인의 사회적 위치", "abstract": "The vast accumulation of our daily interactional data serves as a comprehensive resource that ultimately characterizes and defines our multidimensional social location.", "keyIndex": 8, "sentences": ["Think of the totality of your interactions where behavioral and interactional data is recorded and collected.", "All of those traces represent a kind of resource.", "It is accumulated over the long history of your recorded actions and choices, built up from traces left on everything from social media to credit reporting agencies, shopping websites and loyalty programs, courthouses, social welfare agencies, pharmacies, and the content of emails and chats.", "It incorporates whatever value is in your social network, along with synthetic measures of your trustworthiness or accountability in the world.", "It is diverse and multidimensional and, of course, it is not all gathered into a single place or condensed down to a single quantity.", "But in principle it might be.", "It might take the form of some vector of information that summarizes your situation and value across many features — something that compactly represents your position in the multidimensional space of classification situations.", "It would, in short, characterize your social location."], "aGroup": ["interactional data", "traces", "recorded actions and choices"], "bGroup": ["synthetic measures", "vector of information", "characterize your social location"], "answers": ["interactional data defining individual social location", "isolated data points in digital surveillance", "meaningless traces in digital footprints", "single quantity representing personal value", "unpredictable behavior in digital environments"]}, {"id": "MOGO_GO3_03_35", "difficulty": "보통", "title": "이성적 사고와 자유 의지: 인간 도덕성의 근원", "abstract": "Morality is deeply rooted in the human capacity for rational reasoning and free will, which allows individuals to make free choices and distinguishes them from animals.", "keyIndex": 1, "sentences": ["Morality has been associated with the rational human beings for more than one reason.", "First of all, it is human beings who are gifted with the faculty of reasoning; secondly, human beings have free will to choose what is the best for them among many alternatives.", "To think and reason about things is the primary function of the human mind as has been noted by all philosophers since Descartes.", "It is because of this capacity to think and weigh the pros and cons of actions that human beings can plan for their future and make sufficient effort to achieve their chosen goals in life.", "Besides, human beings make free choices in all given situations, except where they are constrained to act.", "Thus freedom is a basic feature of human life which distinguishes humans from other animals."], "aGroup": ["rational", "faculty of reasoning", "think and weigh the pros and cons"], "bGroup": ["free will", "free choices", "free choices", "freedom"], "answers": ["free will and reason as roots of morality", "physical instincts as sources of moral behavior", "pre-determined fate limiting free choices", "emotional reactions overriding rational judgment", "societal constraints on individual freedom"]}, {"id": "MOGO_GO3_03_36", "difficulty": "높음", "title": "끝없는 숙고를 멈추게 하는 도덕적 판단의 효용성", "abstract": "Moral considerations function as useful conversation-stoppers that terminate the endless and paralyzing cycle of rational justification, allowing us to make firm decisions.", "keyIndex": 1, "sentences": ["Daniel Dennett argues that one benefit of having moral considerations in our conceptual repertoire is that they can serve as conversation-stoppers: their value is to bring deliberations to a close.", "We are rational creatures, always able to ask for justification, and this is a trait that has served us well in many contexts.", "The problem is that upon receiving a perfectly good answer we can always sensibly respond \"Okay, but what justifies that?\" — and we can potentially do so endlessly, never coming to a decision, forever hesitant and doubting, undone by our own rational capacity.", "This is potentially as much a problem for our own private deliberations as for our public interpersonal ones.", "Dennett suggests that it is useful to have \"consideration-generator-squelchers\": items that, once introduced, stop any further deliberation in its tracks.", "\"That would be morally wrong!\" would appear to work in this manner.", "Once the claim is accepted then there is no need or room for seeking further justification: the action mustn't be done, even if it is tempting, and that's all there is to it."], "aGroup": ["ask for justification", "endlessly", "never coming to a decision", "hesitant and doubting"], "bGroup": ["conversation-stoppers", "firm decisions", "squelchers", "no need or room"], "answers": ["moral judgments ending endless deliberation", "endless justifications paralyzing decisions", "rational hesitation as a virtue in choices", "eternal doubting as a sign of intelligence", "logical debates reaching all moral conclusions"]}, {"id": "MOGO_GO3_03_37", "difficulty": "높음", "title": "우주 팽창의 진실: 시공간 자체의 늘어남", "abstract": "The expansion of the Universe is not a matter of spilling into an external void, but rather the elastic stretching of the fabric of space and time itself.", "keyIndex": 4, "sentences": ["When the concept of expansion gets mentioned, it is difficult to resist the urge to picture the Universe with a finite and growing boundary.", "Our natural instinct is to wonder what the Universe could possibly be expanding into.", "Unfortunately, the only answer I can give you is the one that I am sure will satisfy you the least, but let me say it anyway: the Universe expands into nothingness.", "To be more accurate, the Universe does not expand into anything.", "It simply expands by itself within itself.", "In contrast to our inflating balloon or, say, a pipe leak that causes gas to spread into a room that exists in its own right, our expanding Universe is not spilling into another separate entity, nor even another dimension.", "It is the structure of space and time that stretches, a structure that has always existed, at least since the Big Bang.", "This structure or fabric of space and time is elastic and malleable.", "Just as it can pull us apart as we fall inside a black hole, it can also expand and cause anything and anyone embedded in it to move farther apart."], "aGroup": ["expanding into", "finite and growing boundary", "spilling into another separate entity"], "bGroup": ["expands into nothingness", "self-expansion", "structure of space and time that stretches"], "answers": ["universe expanding by stretching space-time fabric", "finite boundary containing the expanding universe", "separate entity existing beyond the universe", "external dimension receiving the universe", "gas leak as a model for cosmic expansion"]}, {"id": "MOGO_GO3_03_38", "difficulty": "높음", "title": "언어와 제스처의 융합: 사고 표현의 최소 단위", "abstract": "Gestures are not merely redundant translations of speech, but act as a co-expressive glue that integrates with the categorical choices of language to fully express human thought.", "keyIndex": 1, "sentences": ["Scholars have demonstrated that the gestures hearing people produce while they are speaking are systematically made at the same time with speech such that language and gesture must be considered \"co-expressive\".", "This tightly integrated pairing of language and gesture enables speakers to conceptualize and formulate their thoughts in terms of both the \"categorical\" requirements of language, and the \"imagistic\" possibilities of gesture.", "For example, in describing an event, one must decide if the event has been completed or is ongoing if the language being spoken at that moment has a verbal affix for each meaning and one or the other must be chosen.", "This kind of choice is characteristic of language as a semiotic system.", "According to McNeil and Duncan, gesture is different from language in that it does not present the speaker with such choices.", "Instead, it offers a kind of glue, which helps unite linguistic elements in a larger semiotic expression, which, as a whole, shares important characteristics with the represented objects.", "In this view, speech and gesture are not redundant nor is one a \"translation\" of the other.", "Rather, the minimal processing unit for the expression of thought is a combination of the two: it is \"imagistic-categorial\" in nature."], "aGroup": ["language", "categorical requirements", "semiotic system", "choices"], "bGroup": ["gesture", "imagistic possibilities", "glue", "combination of the two", "imagistic-categorial"], "answers": ["gesture and language as co-expressive thought units", "mere translation of speech into body movements", "redundant gesture accompanying spoken language", "linguistic choice determining all communication", "semiotic separation of gesture and language"]}, {"id": "MOGO_GO3_03_39", "difficulty": "보통", "title": "지식 공동체의 개방성과 실질적 접근성의 한계", "abstract": "Although epistemic communities have shifted towards openness, surface transparency is insufficient for true understanding, necessitating more active strategies and intensive training to make specialized knowledge genuinely accessible.", "keyIndex": 7, "sentences": ["To acquire expert knowledge, one needs to become a member of the relevant group of knowledge bearers, for which I will use the term \"epistemic communities.\"", "A newcomer learns from experts and is socialized into the common practices of the relevant epistemic community.", "Often there are admittance processes, combined with tests of a candidate's abilities.", "In the premodern era, epistemic communities were often kept secret, with strict tests of loyalty for new members, not least because of fears that specialized knowledge would fall into the \"wrong hands.\"", "Some traces of these older practices may still be present today, but on the whole, the ideal has shifted to openness among the members of epistemic communities, and also, to some extent, toward outsiders.", "Nonetheless, for most outsiders even completely transparent practices do not lift the veil behind which such forms of knowledge are hidden — without the relevant training and acquisition of skills, which often take many years, one simply cannot make sense of the information that is being shared.", "Other, more active strategies are needed to make certain forms of knowledge as \"accessible\" as is realistically possible."], "aGroup": ["admittance processes", "kept secret", "transparent practices do not lift the veil"], "bGroup": ["socialized", "active strategies", "make sense", "more active strategies"], "answers": ["more active strategies", "completely transparent practices", "superficial openness", "historical secrets", "mere admittance"]}, {"id": "MOGO_GO3_03_40", "difficulty": "높음", "title": "노년기의 안녕을 이끄는 목표 선택성과 긍정적 자아", "abstract": "In later life, an enhanced capacity for goal selectivity and a positive self-perception lead to higher motivation, a stronger sense of purpose, and personalized self-fulfillment.", "keyIndex": 4, "sentences": ["Carstensen's (1995) socioemotional selectivity theory looks at individuals' goals as a lifelong process that strengthens and matures with ageing.", "In relation to his motivational conceptual framework, Higgins (2014) proposes that motivation may even attain its highest levels in the later stages of life, subject to the balance and organisation of one's goals in relation to life priorities.", "Building on this foundation, more recent research looks deeply into additional factors influencing well-being in later adulthood, particularly emphasising the role of self-worthiness, and the overall positive impact of developing a well-rounded self-view in life course transitions.", "Together, these studies suggest that both goal alignment and a positive self-perception are crucial for enhancing motivation and overall well-being in later life.", "In fact, third-age learners exhibit a higher degree of selectivity when it comes to determining which goals to pursue and how to allocate their resources towards those specific priorities.", "Older adults demonstrate a stronger sense of life purpose and self-fulfilment.", "They do it their way, and their way is an accumulation of winning and personalized combinations in effectively relating motives all together at different degrees according to their life contexts."], "aGroup": ["strengthens and matures", "highest levels", "higher degree of selectivity", "their way"], "bGroup": ["well-being", "self-worthiness", "positive self-perception", "self-fulfilment", "personalized combinations"], "answers": ["goal selectivity fostering well-being in later life", "declining motivation as a natural aging process", "loss of purpose leading to unhappiness in old age", "negative self-perception reducing elderly well-being", "rigid conformity to social norms in later life"]}, {"id": "MOGO_GO3_03_41", "difficulty": "보통", "title": "문학이라는 불완전한 거울이 보여주는 부재의 진실", "abstract": "Literary works act as flawed mirrors of reality, but it is precisely through their exclusions and distortions that they allow us to perceive the hidden absences and underlying contradictions of the world.", "keyIndex": 4, "sentences": ["Writing of a commentary by Lenin on Leo Tolstoy, the critic Pierre Macherey agrees with Lenin's claim that Tolstoy's work holds up a mirror to the Russian revolution of 1905.", "Yet this mirroring, Macherey argues, is a complex affair, by no means a direct reflection of the world as it stands.", "If literary works are in some sense mirrors, they are mirrors marked by flaws and blind spots.", "In fact, they are as significant for what they don't reflect — for their exclusions and distortions — as for what they do.", "There are things which do not and cannot figure in the mirror — in the case of Tolstoy, certain contradictions in society of which he could not be conscious.", "Even so, the mirror makes us aware of these absences, which thus become faintly present.", "It is as though it allows us to see more clearly what isn't there.", "There is also no reason to assume that what we see in the mirror must form a coherent whole.", "On the contrary, it may be in pieces and discordant.", "'The mirror is doubtless defective; the outlines will sometimes be disturbed; the reflection faint or confused', remarks George Eliot in Adam Bede, blaming the kind of naive realism which holds that art (or mirrors) always tell it like it is.", "A mirror offers us a version of reality, but it does so from a viewpoint which cannot be captured in the mirror itself.", "And because this viewpoint is invisible to us, we might be tempted to take it as beyond question."], "aGroup": ["not a direct reflection", "flaws and blind spots", "exclusions and distortions", "absences"], "bGroup": ["aware of these absences", "faintly present", "see more clearly what isn't there"], "answers": ["literary works as flawed mirrors revealing hidden absences", "direct reflection of reality in literary works", "coherent whole presented by all literary texts", "naive realism as the standard for literary judgment", "beyond question viewpoints embedded in literature"]}, {"id": "ABSO_TYPE_17_20", "difficulty": "보통", "title": "말의 질과 합리적 의사소통의 중요성", "abstract": "We should always strive to use fair and reasonable words, prioritizing quality over quantity in our daily communication.", "keyIndex": 9, "sentences": ["We have an unlimited selection of words we use daily.", "In fact, it's not the quantity, but the quality of the words that you speak that will give you a good return.", "Whether in correcting, instructing, or even in casual conversation, words should be fair, rational, and governed by reason.", "Once in a store, I heard a mother ordering her child not to dare touch whatever the child was reaching for.", "The child asked why she couldn't touch it.", "The mom's response was, 'Because I said so, that's why!'", "The reason behind her answer had nothing to do with why the child could not touch whatever she wasn't allowed to touch in the first place.", "Good communication is not always the easiest route to take when you're in a hurry or the kids are acting up, but it is by far the best.", "No matter how many whys we hear in a day from our children, we should always try to give reasonable answers."], "aGroup": ["quantity of words", "unreasonable control"], "bGroup": ["quality of words", "reasonable answers"], "answers": ["quality of words over quantity in communication", "unconditional control without explaining reasons", "quantity of words reflecting communication depth", "fast communication prioritizing efficiency", "emotional reaction replacing rational explanation"]}, {"id": "ABSO_TYPE_17_21", "difficulty": "보통", "title": "타인을 기쁘게 하려는 강박의 위험성", "abstract": "The obsessive need to please others ultimately compromises one's self-worth and leads to a life filled with anxiety and disappointment.", "keyIndex": 8, "sentences": ["The burden to please or impress others can be overwhelming.", "It can cause us to mortgage our lives to the limit and compromise our self-worth in the process.", "People pleasing is the opposite of the self-sabotaging behavior coming from the thought that others should make you happy.", "If you believe that your job in life is to make others happy or at least to impress them, you will suffer from the attitudes and behaviors of always trying to please others.", "If at first you do not accomplish this, you will try longer and harder.", "Then if you get unsatisfactory responses, you will become frustrated and even depressed.", "The inability to flip the inner switch of someone else is enough to drive a people-pleaser insane.", "The need to make people happy appears selfless, but it will destine a person to a life filled with anxiety and disappointment."], "aGroup": ["please others", "compromise self-worth"], "bGroup": ["self-worth", "stop pleasing"], "answers": ["danger of obsessive people-pleasing behavior", "mutual understanding as key to relationships", "selfless behavior benefiting all relationships", "positive impression creating social success", "social success through pleasing others"]}, {"id": "ABSO_TYPE_17_22", "difficulty": "높음", "title": "과학 발전 과정에서의 불확실성 수용", "abstract": "Uncertainty and skepticism regarding new scientific tools are natural parts of scientific progress that will be resolved over time.", "keyIndex": 7, "sentences": ["Uncertainty about what tool or procedure to use is a problem common to all the scientific disciplines.", "The development of new tools allows scientists to answer questions they could not answer in the past, and the answers to those questions will lead to new questions, and so on.", "Therefore, new technologies and procedures are crucial to the progress of science.", "At the same time, other scientists unfamiliar with a new tool may express skepticism and call for others to replicate the experiments.", "People find this skepticism annoying because they are not familiar with the fact that uncertainty about experimental tools is an aspect of science.", "From their perspectives, the skepticism may seem like waffling, especially when they are trying to make decisions on the basis of scientific information.", "However, if a new technique is the source of the uncertainty, time and future experiments will confirm or disconfirm its usefulness and clear it up."], "aGroup": ["uncertainty", "skepticism", "waffling"], "bGroup": ["progress of science", "clear it up"], "answers": ["uncertainty as a natural part of scientific progress", "immediate perfection as the goal of science", "complete failure of new scientific techniques", "annoying skepticism blocking scientific progress", "unscientific waffling on experimental methods"]}, {"id": "ABSO_TYPE_17_23", "difficulty": "보통", "title": "기후에 따른 식물 종자 확산 방식의 차이", "abstract": "Depending on their physical environments, plants in temperate zones and tropical rainforests have evolved different methods for dispersing their seeds.", "keyIndex": 7, "sentences": ["Plants firmly rooted in place in temperate zones must disperse their offspring by various means including wind and gravity.", "Some plants are often inferior to others, so they must disperse as widely as possible to find new places to grow that give better chances of survival.", "Other plants may persist in old habitats; but young plants must be able to move far enough away from their parents not to have to compete with them, and to avoid enemies like predators and disease that may accompany their parents.", "Tropical plants face the same dispersal problems that temperate zone plants do, and plants in both regions do show some of the same solutions to the problem.", "But in a tropical rainforest the favored solutions are ones seldom used in a temperate woodland.", "This is because many of the dispersal methods, including dispersal by wind and gravity, are not particularly well suited for most plants in a mature rainforest.", "Instead, plants in rainforests must rely on other methods, such as dispersal by animals."], "aGroup": ["wind and gravity", "temperate woodland"], "bGroup": ["dispersal by animals", "tropical rainforest"], "answers": ["animal dispersal preferred over wind in rainforests", "wind dispersal as the dominant method in all climates", "gravity as the primary seed dispersal method", "root competition determining plant dispersal strategy", "permanent settlement replacing seed dispersal"]}, {"id": "ABSO_TYPE_17_24", "difficulty": "높음", "title": "잘못된 믿음과 진정한 감상의 유효성", "abstract": "A certain amount of false belief does not disqualify the appreciative experience of nature or art.", "keyIndex": 8, "sentences": ["A good way to approach the question of whether we need some knowledge to appreciate nature is to ask whether appreciation based on false belief should be regarded as essentially flawed.", "If such appreciation is flawed, then some knowledge is required for proper appreciation.", "Certain sorts of false belief should be regarded as permitting genuine appreciation of nature if one is faultless in holding them.", "There may have been a time, for example, when people were faultless in believing whales and dolphins were fish.", "Should we say they were unable to see the beauty of these creatures?", "We shouldn't say that they were unable to see the beauty of these creatures just as we shouldn't think that people of an earlier age could not see the beauty of the human body because they radically misunderstood the nature of the body.", "The art of the past shows us that people could appreciate human beauty, even though their understanding of the human body was deeply flawed.", "It indicates that some amount of false belief does not disqualify the appreciative experience."], "aGroup": ["false belief", "essentially flawed"], "bGroup": ["genuine appreciation", "does not disqualify"], "answers": ["false belief not disqualifying genuine appreciation", "essentially flawed appreciation based on ignorance", "absolute knowledge required for true appreciation", "impossible understanding of beauty without facts", "disqualified experience due to false beliefs"]}, {"id": "ABSO_TYPE_18_20", "difficulty": "보통", "title": "심리적 노화 방지를 위한 습관 타파", "abstract": "To prevent psychological aging, one must consciously break established habits and pursue novelty and unconventional strategies.", "keyIndex": 5, "sentences": ["The unconventional is for the young who are not comfortable with conventions and take great pleasure in going against them.", "The danger is that as we age, we want more comfort and predictability and lose our taste for the unusual.", "This is how one of the greatest strategists in the history of our world, Napoleon, declined as a strategist: he came to rely more on the size of his army and on its superior weapons than on novel strategies.", "He lost his taste for the spirit of strategy and gave in to the growing weight of his accumulating years.", "You must fight the psychological aging process even more than the physical one, for a mind full of strategies and tricks will keep you young.", "Make a point of breaking habits you have developed and act in a way that is contrary to how you have operated in the past."], "aGroup": ["conventions", "comfort and predictability", "psychological aging process", "accumulating years"], "bGroup": ["unconventional", "novel strategies", "breaking habits", "fight psychological aging process"], "answers": ["breaking old habits", "seeking predictable comfort", "physical aging process", "relying on army size", "following social conventions"]}, {"id": "ABSO_TYPE_18_21", "difficulty": "높음", "title": "익명성의 적정량과 미량 원소 비유", "abstract": "Anonymity should be maintained like a trace element, as it is beneficial for systems in small doses but toxic in large quantities.", "keyIndex": 6, "sentences": ["Cool technology makes the anonymity in mediated environments like online message boards more possible today than ever before.", "At the same time this techno-combo makes true anonymity in physical life much harder.", "For example, you don't need to submit your personal information when using a mobile application.", "Instead, your gender, age, and geographical location are identified based on your behavior in the network.", "A world where everything about a person can be found and archived is a world with no privacy, and therefore many technologists are eager to maintain anonymity.", "However, anonymity is like a trace element.", "These elements are necessary in keeping a cell alive, but the amount needed is too small to measure.", "As a trace element in vanishingly small doses, it's good for the system by enabling the occasional whistleblower.", "But if anonymity is present in any significant quantity, it will poison the system.", "Are you willing to pump up the levels of metallic elements in your body to make it stronger?", "You shouldn't be."], "aGroup": ["poison the system", "significant quantity", "no privacy", "found and archived"], "bGroup": ["trace element", "vanishingly small doses", "maintain anonymity", "enabling the occasional whistleblower"], "answers": ["anonymity as trace element", "absolute digital privacy", "excessive metallic elements", "technological surveillance system", "archived personal data"]}, {"id": "ABSO_TYPE_18_22", "difficulty": "높음", "title": "앵커링 효과와 인지적 한계", "abstract": "Human estimates are often biased toward an initial anchor due to limited cognitive attention channels, leading to inaccurate adjustments.", "keyIndex": 2, "sentences": ["Often, our estimates of frequencies, probabilities, and even the desirability of consequences are vague.", "In ambiguous situations, people form an 'anchor' that serves as a starting point, and adjust their estimate from this anchor, which nevertheless remains too close to it.", "If we recalled that a house sold for approximately $200,000 and wanted to pinpoint the precise amount, we would start our efforts to infer a more exact estimate with that value.", "As a result, we would end up with estimates that are similar to the original number, ignoring the possibilities that our memories were faulty or the number was inaccurate.", "A similar situation occurs when we toss a coin: we expect 2 heads in 4 tosses (even though the probability of that particular occurrence is only 3/8).", "Research indicates that this cognitive limit is a natural result of our limited attention 'channels' by focusing on the anchor values at the start of the judgement and the relevant information that the judge has available in memory or at hand."], "aGroup": ["vague", "an anchor", "starting point"], "bGroup": ["anchoring bias", "cognitive limit", "cognitive limit"], "answers": ["anchoring and cognitive limit", "statistical probability calculation", "accurate memory recall", "infinite attention span", "housing market fluctuation"]}, {"id": "ABSO_TYPE_18_23", "difficulty": "보통", "title": "자연 법칙으로의 세계관 전환", "abstract": "The ancient perspective of attributing natural phenomena to gods shifted toward a worldview governed by discoverable and consistent natural laws.", "keyIndex": 7, "sentences": ["Ignorance of nature's ways led people in ancient times to invent gods for every aspect of human life.", "There were gods of love and war; of the sun, earth, and sky; of the oceans and rivers; of rain and thunderstorms; even of earthquakes and volcanoes.", "When the gods were pleased, mankind was treated to good weather, peace, and freedom from natural disaster and disease.", "When they were displeased, there came drought, war, and epidemics.", "Since the connection between cause and effect in nature was invisible to their eyes, these gods appeared mysterious, and people were at their mercy.", "But with Thales of Miletus, a Greek philosopher and astronomer, about 2,600 years ago, that began to change.", "The idea arose that nature follows consistent principles that could be discovered.", "And so began the long process of replacing the notion of the reign of gods with the concept of a universe that is governed by laws of nature we could someday learn to read."], "aGroup": ["invent gods", "invisible to their eyes", "mysterious", "reign of gods"], "bGroup": ["consistent principles", "laws of nature", "learn to read", "governed by laws"], "answers": ["consistent natural principles", "mysterious divine intervention", "ancient religious rituals", "unpredictable weather patterns", "mythological cause and effect"]}, {"id": "ABSO_TYPE_18_24", "difficulty": "보통", "title": "알렉산더 대왕 신화의 재해석", "abstract": "The heroic myth of Alexander the Great is being revised by historians who highlight his father's original goals and the deliberate fabrication of his image.", "keyIndex": 6, "sentences": ["Alexander the Great, an ancient Macedonian ruler and one of history's greatest military minds, established the largest empire the ancient world had ever seen.", "His genius as a military strategist was honored in ancient times, and has hardly been questioned since.", "For centuries, the story of Alexander's achievement was the romance of a dashing, heroic soldier who led from the front.", "This is the story that still suits Hollywood.", "However, historians have begun to revise the script.", "The daring young general is still there, but in two respects the Alexander myth is now subject to modification.", "First, it has become clear that the aim of seizing the Asian empire created by the Achaemenid was not originally Alexander's but his father's, so Alexander just implemented an existing foreign policy.", "Second, we have become more aware of the extent to which Alexander's success depended upon the fabrication and diffusion of his image.", "The phenomenon of Alexander 'the Great' then translates into a study not of the art of power but the power of art."], "aGroup": ["genius", "heroic soldier", "the Alexander myth", "art of power"], "bGroup": ["revise the script", "subject to modification", "fabrication and diffusion of his image", "power of art"], "answers": ["revising historical myths", "unquestioned military genius", "inherited empire expansion", "authentic heroic achievements", "traditional Hollywood storytelling"]}, {"id": "ABSO_TYPE_19_20", "difficulty": "보통", "title": "시대 변화에 따른 주기적인 자기 재창조의 필요성", "abstract": "To avoid becoming a relic of the past, we must periodically reinvent ourselves and embrace changes in the times.", "keyIndex": 7, "sentences": ["In the 1940s, the saxophone player Charlie Parker single-handedly revolutionized the world of jazz with his invention 'bebop.'", "But he watched it become the convention in jazz, and he was no longer worshipped by hipsters as younger artists taking his inventions to other levels emerged.", "We exist in a particular cultural moment, with its own flow and style.", "When we are young we are more sensitive to these fluctuations in taste, so we keep up with the times.", "But as we get older the tendency is for us to become locked in a dead style, one that we associate with our youth and its excitement.", "Our momentum will halt as people come to categorize us in the past.", "Thus, we must find a way to periodically reinvent ourselves.", "We can rediscover that youthful sensitivity to what happens around us and incorporate what we like into a newer spirit.", "The only thing we have to fear then is becoming a social and cultural relic."], "aGroup": ["convention", "dead style", "the past", "relic"], "bGroup": ["other levels", "reinvent ourselves", "youthful sensitivity", "newer spirit"], "answers": ["periodically reinvent ourselves", "locked in convention", "associate with youth", "halt our momentum", "become a relic"]}, {"id": "ABSO_TYPE_19_21", "difficulty": "보통", "title": "기존 신념보다 직접 눈으로 확인한 현실에 맞춰라", "abstract": "When our learned maps do not match the actual landscape, we must trust what we see and adjust our maps to reality.", "keyIndex": 5, "sentences": ["When I was a very young soldier stationed in Alaska, my squad leader told me a profound truth that I have never forgotten.", "I was standing in the field during a training exercise, trying to orient myself by studying my map, when he approached and asked me what I was doing.", "'Sir,' I said, 'the map says there should be a mountain over there, but I can't see it.'", "'Soldier,' he replied, 'if the map doesn't agree with the landscape, then the map is wrong.'", "And so it is with our journey through life; sometimes we must make the maps in our heads conform to the ground we're on.", "The process of drawing the map starts early, with our parents teaching us the directions that they've learned are right.", "However, there will come times when our map seems incorrect, and that's when we have to trust what we can see when we use our own eyes and look around."], "aGroup": ["map", "the maps in our heads", "learned directions"], "bGroup": ["the landscape", "the ground we're on", "what we can see"], "answers": ["trust visual reality", "follow learned maps", "ignore the landscape", "maintain old directions", "conform to maps"]}, {"id": "ABSO_TYPE_19_22", "difficulty": "보통", "title": "불확실한 모험 도전을 통한 삶의 활력 회복", "abstract": "By embarking on an uncertain new venture when life feels dull, we can overcome powerlessness and feel reborn with a heightened appreciation for life.", "keyIndex": 7, "sentences": ["In 1917, Ernest Hemingway volunteered as an ambulance driver in Italy, at one of the war fronts, to escape from his monotonous life.", "In one incident he was nearly killed by a bomb, and the experience forever altered his way of thinking.", "'I died then...", "I felt my soul coming right out of my body, like you'd pull a handkerchief out of a pocket.'", "Surviving death made him feel like he was reborn inside.", "Now he could write of his experiences and make his work vibrate with emotion.", "Similarly, whenever life feels particularly dull or confining, we can force ourselves to leave familiar ground by embarking on a new venture in which success is uncertain.", "In this case we experience a moment of powerlessness in the face of something large and overwhelming.", "We can overcome this feeling of control slipping out of our hands by raising our level of effort, and we will feel as if we are reborn upon its completion.", "We now have a heightened appreciation for life and a desire to live it more fully."], "aGroup": ["monotonous life", "dull or confining", "powerlessness", "slipping out of hands"], "bGroup": ["reborn inside", "vibrate with emotion", "new venture", "heightened appreciation"], "answers": ["embark on venture", "remain in monotony", "avoid uncertain success", "feel completely powerless", "slip out of hands"]}, {"id": "ABSO_TYPE_19_23", "difficulty": "보통", "title": "다양한 변수에 의해 장기적으로 결정되는 기후", "abstract": "Unlike weather, which is the immediate state of the atmosphere, climate is determined by a combination of many variables recorded over a long period.", "keyIndex": 3, "sentences": ["There is a saying that 'Climate is what you expect, weather is what you get.'", "Basically, the weather is what is happening to the atmosphere at any time.", "Climate, however, is determined by many variables such as temperature, altitude, latitude, proximity to water, wind, rainfall, and other conditions that are examined and recorded over a period of at least 30 years.", "For example, South Florida is listed as a subtropical climate, even though other places around the world at the same latitude are deserts.", "What makes its climate different from the Sonora, Gobi, or Sahara deserts is that South Florida is surrounded by water and warm currents that combine to provide it with a wet season and a dry season.", "It is classified as subtropical because the usual definition of tropical entails that the latitude is within 23.5 degrees north or south of the equator.", "South Florida is about 25 degrees north of the equator, so, along with its unusual tropical weather, it can get frost and even extended freezes."], "aGroup": ["weather", "what you get", "happening at any time"], "bGroup": ["climate", "what you expect", "determined by many variables"], "answers": ["combined long-term variables", "immediate atmospheric changes", "expected daily weather", "unusual short freezes", "single geographic location"]}, {"id": "ABSO_TYPE_19_24", "difficulty": "보통", "title": "불확실성을 감수해야 이루어지는 진정한 성취", "abstract": "Our intolerance for ambiguity and the need for absolute certainty prevent us from taking action and achieving greatness.", "keyIndex": 2, "sentences": ["Some people often say, 'I must make sure I know all about this before I start.'", "Here our intolerance for ambiguity stops us from taking action.", "We feel as though we will be exposed or that people may discover that we are an impostor and we decide that it is safer to do nothing.", "Sometimes we try to get more information but with this belief it is unlikely that it will ever be enough.", "One traveler recalled that for years he had been toying with the idea of motorcycling across Europe.", "Every time the dream got close to becoming a reality, he decided that he didn't know enough about the bike, the journey, first aid, the places he'd visit, the local languages or any of a host of imponderables.", "He told himself that more research was needed.", "His belief that 'I must be certain' prevented him from making a start.", "If everyone thought like this, there'd be no Edisons or Picassos; and not many books, films or new medicines either.", "If you need to play it safe, don't expect to leave your name in the history books."], "aGroup": ["know all", "intolerance for ambiguity", "more information", "must be certain", "play it safe"], "bGroup": ["taking action", "making a start", "leave your name"], "answers": ["tolerate uncertain ambiguity", "demand absolute certainty", "gather more information", "play it safe", "fear potential exposure"]}, {"id": "ABSO_TYPE_20_20", "difficulty": "보통", "title": "의도적 행동을 통한 심리적 특성 내면화", "abstract": "You can develop a desired psychological trait by intentionally acting as if you already possess it.", "keyIndex": 6, "sentences": ["Something actors master is the ability to create characters.", "They must be able to establish sets of emotions, postures, and reactions to express a role.", "Some things, such as thoughts expressed in lines from the script, are within conscious control.", "Others, like emotions or attitudes, aren't.", "When actors want to develop a feeling or characteristic in themselves, they are taught to act as though they already have it.", "If you are to develop a certain trait, you need to do much the same thing.", "Say you find yourself lacking in creativity.", "What can you do?", "Start facing the world as you would if you were more creative.", "When faced with a problem, for example, instead of taking the first solution that comes to mind, think of two or three others first.", "You can do this for virtually any characteristic outside of the physiological.", "You might even find that you gain confidence by approaching life in the way you would if you possessed it."], "aGroup": ["physiological", "lacking in creativity", "taking the first solution"], "bGroup": ["a certain trait", "acting as if", "facing the world as you would"], "answers": ["intentional behavioral emulation", "physiological trait inheritance", "unconscious emotional control", "absolute creative suppression", "random emotional reaction"]}, {"id": "ABSO_TYPE_20_21", "difficulty": "높음", "title": "도덕과 입법의 최고 원칙으로서의 공리주의", "abstract": "Utilitarianism asserts that maximizing utility based on the human pursuit of pleasure and avoidance of pain is the highest moral and political principle.", "keyIndex": 2, "sentences": ["Jeremy Bentham, an English moral philosopher and legal reformer, founded the doctrine of utilitarianism.", "Its main idea is simply stated and intuitively appealing: The highest principle of morality is to maximize happiness, the overall balance of pleasure over pain.", "According to Bentham, the right thing to do is whatever will maximize utility.", "By \"utility,\" he means whatever produces happiness, and whatever prevents suffering.", "Bentham arrives at his principle by the following line of reasoning: We are all governed by the feelings of pain and pleasure.", "They are our \"sovereign masters.\"", "The standard of right and wrong is \"fastened to their throne.\"", "We all like pleasure and dislike pain.", "The utilitarian philosophy recognizes this fact, and makes it the basis of moral and political life.", "Maximizing utility is a principle not only for individuals but also for legislators.", "In deciding what laws to enact, a government should do whatever will maximize the happiness of the community as a whole.", "Attaining pleasure (happiness) and avoiding pain (unhappiness) are the
