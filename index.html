        return(
          <div onClick={()=>setOutputModal(null)}
            style={{position:'fixed',inset:0,zIndex:300,background:'rgba(0,0,0,0.5)',
              display:'flex',alignItems:'center',justifyContent:'center',padding:18}}>
            <div onClick={e=>e.stopPropagation()}
              style={{background:'#fff',borderRadius:14,padding:'22px 24px',maxWidth:460,width:'100%',
                maxHeight:'90vh',overflow:'auto',boxShadow:'0 10px 44px rgba(0,0,0,0.3)'}}>
              <div style={{fontSize:16,fontWeight:800,marginBottom:4,color:'#7a1020'}}>⎙ 출력 옵션 — 영역 선택</div>
              <div style={{fontSize:12,color:'#a89878',marginBottom:14}}>
                {selectedItems.length}개 지문 · {mode==='teacher'?'교사용':'학생용'} — 출력할 영역을 고른 뒤 인쇄 또는 DOCX
              </div>
              {/* 프리셋 */}
              <div style={{display:'flex',gap:8,marginBottom:14}}>
                <button onClick={()=>setOutputModal({mode:'teacher',opts:{...TEACHER_PRESET}})}
                  style={{flex:1,padding:'7px 0',fontSize:12.5,fontWeight:700,borderRadius:8,cursor:'pointer',
                    background:mode==='teacher'?'#FBF3DE':'#fff',color:'#7a1020',border:'1px solid #7a1020'}}>👨‍🏫 교사용 (전체+정답)</button>
                <button onClick={()=>setOutputModal({mode:'student',opts:{...STUDENT_PRESET}})}
                  style={{flex:1,padding:'7px 0',fontSize:12.5,fontWeight:700,borderRadius:8,cursor:'pointer',
                    background:mode==='student'?'#FDF8EC':'#fff',color:'#8a6010',border:'1px solid #C9A84C'}}>🎓 학생용 (복습용)</button>
              </div>
              {/* 영역 체크박스 */}
              <div style={{display:'flex',flexDirection:'column',gap:8,marginBottom:16}}>
                {items.map(it=>(
                  <label key={it.key} style={{display:'flex',alignItems:'center',gap:9,padding:'9px 12px',
                    border:'1px solid '+(O[it.key]?'#7a1020':'#e2d6bb'),
                    background:O[it.key]?'#FBF3DE':'#fff',borderRadius:8,cursor:'pointer',fontSize:13}}>
                    <input type="checkbox" checked={!!O[it.key]} onChange={e=>setO({[it.key]:e.target.checked})}
                      style={{width:16,height:16,accentColor:'#7a1020',cursor:'pointer'}}/>
                    <span style={{fontWeight:O[it.key]?700:400,color:O[it.key]?'#3a2a20':'#888'}}>{it.label}</span>
                  </label>
                ))}
              </div>
              {/* 문장별 분석 세부 옵션 */}
              {O.sentences&&(
                <div style={{padding:'11px 13px',background:'#faf8f3',borderRadius:8,marginBottom:11,border:'1px solid #eee4cf'}}>
                  <div style={{fontSize:12,fontWeight:700,marginBottom:7,color:'#7a1020'}}>문장별 분석 범위</div>
                  <label style={{display:'flex',alignItems:'center',gap:7,marginBottom:5,cursor:'pointer',fontSize:12.5}}>
                    <input type="radio" name="hardOnly" checked={!O.hardOnly} onChange={()=>setO({hardOnly:false})} style={{accentColor:'#7a1020'}}/>
                    <span>전체 문장 (모든 문장 포함)</span>
                  </label>
                  <label style={{display:'flex',alignItems:'center',gap:7,cursor:'pointer',fontSize:12.5}}>
                    <input type="radio" name="hardOnly" checked={O.hardOnly} onChange={()=>setO({hardOnly:true})} style={{accentColor:'#7a1020'}}/>
                    <span>어려운 문장만 (구문 분석 있는 문장만)</span>
                  </label>
                </div>
              )}
              {O.sentences&&(
                <div style={{padding:'11px 13px',background:'#faf8f3',borderRadius:8,marginBottom:16,border:'1px solid #eee4cf'}}>
                  <div style={{fontSize:12,fontWeight:700,marginBottom:7,color:'#7a1020'}}>해석 표시 방식</div>
                  <label style={{display:'flex',alignItems:'center',gap:7,marginBottom:5,cursor:'pointer',fontSize:12.5}}>
                    <input type="radio" name="showAns" checked={!O.showAnswers} onChange={()=>setO({showAnswers:false})} style={{accentColor:'#7a1020'}}/>
                    <span>빈칸 (학생이 직접 작성)</span>
                  </label>
                  <label style={{display:'flex',alignItems:'center',gap:7,cursor:'pointer',fontSize:12.5}}>
                    <input type="radio" name="showAns" checked={O.showAnswers} onChange={()=>setO({showAnswers:true})} style={{accentColor:'#7a1020'}}/>
                    <span>정답 포함 (끊어읽기·해석 표시)</span>
                  </label>
                </div>
              )}
              {!anyArea&&<div style={{fontSize:12,color:'#c0392b',marginBottom:12,textAlign:'center'}}>출력할 영역을 1개 이상 선택하세요.</div>}
              {/* 액션 */}
              <div style={{display:'flex',gap:8,justifyContent:'flex-end',flexWrap:'wrap'}}>
                <button onClick={()=>setOutputModal(null)}
                  style={{padding:'9px 14px',fontSize:13,background:'#F5F0E6',color:'#8a6010',
                    border:'1px solid #e2d6bb',borderRadius:8,cursor:'pointer'}}>← 뒤로</button>
                <button disabled={!anyArea} onClick={doPrint}
                  style={{padding:'9px 20px',fontSize:13,fontWeight:700,borderRadius:8,cursor:anyArea?'pointer':'not-allowed',
                    background:anyArea?'#7a1020':'#f0e7d4',color:anyArea?'#fff':'#b8a988',border:'none'}}>🖨 인쇄 / PDF</button>
                <button disabled={!anyArea} onClick={doDOCX}
                  style={{padding:'9px 20px',fontSize:13,fontWeight:700,borderRadius:8,cursor:anyArea?'pointer':'not-allowed',
                    background:anyArea?'#C9A84C':'#f0e7d4',color:anyArea?'#fff':'#b8a988',border:'none'}}>📄 DOCX</button>
              </div>
            </div>
          </div>
        );
      })()}
      {/* 인쇄용 off-screen 렌더 */}
      {printJob&&<div ref={printRef} style={{position:'fixed',left:-99999,top:0,width:800}}>
        {printJob.items.map(p=>(
          <div key={p.id} className="prn-item">
            <div className="prn-hd"><b>{p.title||p.id}</b><span>대단한영어 · 자료</span></div>
            <SlotViewer slot={toStudySlot(p)} viewMode={printJob.mode}/>
          </div>
        ))}
      </div>}
    </div>
  );
}

function SlotViewer({slot,viewMode}){
  // 학생 자료보기용 - 모든 편집 콜백은 no-op
  const iB={border:"none",outline:"none",background:"transparent",padding:"2px 4px",width:"100%"};
  const sB={border:"none",outline:"none",background:"transparent",cursor:"pointer"};
  const onText=()=>{},onClear=()=>{},onMeta=()=>{},onToggle=()=>{},onConfirm=()=>{},onSave=()=>{};
  const onSheetSave=null,sheetSaving=false,onStuOutput=()=>{},onReanalyze=()=>{},onAnalysis=()=>{};
  const onAuthor=()=>{},onGenSum=()=>{},onTogglePublic=null;
  const IS=viewMode==='student';
  const st=STATUS[slot.status]||STATUS.idle;
  const {sentences=[],flow={},grammar={}}=slot.analysis||{};
  const {blocks=[],interBlockConnectors=[],keyword='',topicSummary='',structureType=''}=flow;
  const {difficultSentences=[]}=grammar;
  const sm=Object.fromEntries(sentences.map(s=>[s.num,s]));
  const conn=i=>interBlockConnectors[i]||'→';
  const editable=false; // 학생용: 항상 읽기전용
  const df=DIFF_STYLE[slot.meta.difficulty]||DIFF_STYLE['중'];

  return(
    <div style={{background:'#fff',borderRadius:12,border:'0.5px solid #e5e5e5',
      marginBottom:12,overflow:'hidden',
      boxShadow:slot.status==='saved'?'0 0 0 2px #185FA5':'none'}}>
      <div style={{padding:'11px 16px',display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',
        borderBottom:slot.open&&(slot.text||slot.analysis)?'0.5px solid #f0f0f0':'none',
        background:slot.status==='saved'?'#EDF4FF':'#fff'}}>
        <div style={{width:24,height:24,borderRadius:'50%',background:st.bg,color:st.color,
          display:'flex',alignItems:'center',justifyContent:'center',
          fontSize:11,fontWeight:700,flexShrink:0}}>{slot.id+1}</div>
        <span style={{fontSize:10,fontWeight:700,padding:'2px 8px',borderRadius:4,
          background:st.bg,color:st.color}}>{st.label}</span>
        <select value={slot.meta.source} onChange={e=>onMeta(slot.id,'source',e.target.value)}
          style={{...sB,fontSize:12.5,color:'#333',border:'0.5px solid #ddd',borderRadius:5,padding:'4px 8px'}}>
          {SOURCES.map(s=><option key={s} value={s}>{s}</option>)}
        </select>
        {['chapter','number'].map(f=>(
          <div key={f} style={{display:'flex',alignItems:'center',background:'#f5f5f5',
            borderRadius:6,border:'0.5px solid #ddd',overflow:'hidden'}}>
            <button onClick={()=>{const cur=parseInt(slot.meta[f])||1;const max=f==='chapter'?30:99;
              onMeta(slot.id,f,String(Math.max(1,cur-1)).padStart(f==='chapter'?2:3,'0'));}}
              style={{...sB,padding:'4px 8px',fontSize:14,color:'#555',borderRight:'0.5px solid #ddd'}}>▼</button>
            <span style={{fontSize:13,fontWeight:500,color:'#333',minWidth:f==='chapter'?26:30,
              textAlign:'center',padding:'0 2px'}}>{parseInt(slot.meta[f]||1)}{f==='chapter'?'강':'번'}</span>
            <button onClick={()=>{const cur=parseInt(slot.meta[f])||1;const max=f==='chapter'?30:99;
              onMeta(slot.id,f,String(Math.min(max,cur+1)).padStart(f==='chapter'?2:3,'0'));}}
              style={{...sB,padding:'4px 8px',fontSize:14,color:'#555',borderLeft:'0.5px solid #ddd'}}>▲</button>
          </div>
        ))}
        <select value={slot.meta.difficulty} onChange={e=>onMeta(slot.id,'difficulty',e.target.value)}
          style={{...sB,fontSize:12.5,fontWeight:600,color:df.color,border:'0.5px solid #ddd',
            borderRadius:5,padding:'4px 6px',background:df.bg}}>
          {DIFFS.map(d=><option key={d} value={d}>{d}</option>)}
        </select>
        {slot.status==='analyzed'&&<span style={{fontSize:10,color:'#bbb'}}>AI추정</span>}
        {slot.id===0&&slot.status==='idle'&&<span style={{fontSize:10,color:'#bbb'}}>↑ 이후 자동 연번</span>}
        <div style={{flex:1}}/>
        {slot.error&&<span style={{fontSize:11,color:'#c0392b',maxWidth:200,overflow:'hidden',
          textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={slot.error}>{slot.error}</span>}
        {slot.analysis&&(
          <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
            <button onClick={()=>dlHTML(slot,'teacher')} style={{padding:'4px 9px',fontSize:11,background:'#185FA5',color:'#fff',border:'none',borderRadius:5,cursor:'pointer'}}>HTML↓교사</button>
            <button onClick={()=>onStuOutput?onStuOutput('html',slot):dlHTML(slot,'student')} style={{padding:'4px 9px',fontSize:11,background:'#2d8a60',color:'#fff',border:'none',borderRadius:5,cursor:'pointer'}}>HTML↓학생</button>
            <button onClick={()=>buildDOCX(slot,'teacher')} style={{padding:'4px 9px',fontSize:11,background:'#1F3864',color:'#fff',border:'none',borderRadius:5,cursor:'pointer'}}>DOCX↓교사</button>
            <button onClick={()=>onStuOutput?onStuOutput('docx',slot):buildDOCX(slot,'student')} style={{padding:'4px 9px',fontSize:11,background:'#1a5c3a',color:'#fff',border:'none',borderRadius:5,cursor:'pointer'}}>DOCX↓학생</button>
            <button onClick={onAuthor} style={{padding:'4px 9px',fontSize:11,background:'#6A0DAD',color:'#fff',border:'none',borderRadius:5,cursor:'pointer'}}>✏ 출제 저작</button>
          </div>
        )}
        {(slot.text||slot.passageData||slot.analysis)&&(
          <button onClick={onClear} title="이 슬롯 비우기 (GitHub 데이터는 유지)" style={{...sB,fontSize:13,color:'#bbb',padding:'3px 7px',border:'1px solid #eee',borderRadius:5,marginLeft:4}}>🗑</button>
        )}
        <button onClick={onToggle} style={{...sB,fontSize:13,color:'#ccc',padding:'3px 6px'}}>{slot.open?'▲':'▼'}</button>
      </div>

      {slot.open&&slot.status==='idle'&&(
        <div style={{padding:16}}>
          <textarea value={slot.text} onChange={e=>onText(e.target.value)}
            placeholder={'지문 '+(slot.id+1)+' 붙여넣기...'}
            style={{width:'100%',minHeight:100,padding:'10px 13px',fontSize:14,lineHeight:1.9,
              border:'0.5px solid #e0e0e0',borderRadius:8,resize:'vertical',fontFamily:'inherit',
              color:'#1a1a1a',background:'#fafafa'}}/>
        </div>
      )}

      {slot.open&&slot.analysis&&(
        <div style={{padding:16}}>
          {/* 지문 */}
          <div style={{borderLeft:'4px solid #185FA5',background:'#fafafa',borderRadius:'0 8px 8px 0',
            padding:'12px 16px',fontSize:15,lineHeight:2.2,marginBottom:12,
            wordBreak:'keep-all',overflowWrap:'break-word'}}>
            {sentences.map(s=>{
              const sc=SM[s.symbol]||{};
              return<span key={s.num}>
                <span style={{fontSize:12,fontWeight:700,color:sc.tx,marginRight:4}}>{nStr(s.num)}</span>
                {s.text}
                {' '}
              </span>;
            })}
          </div>

          {/* 범례 */}
          <div style={{display:'flex',flexWrap:'wrap',gap:4,marginBottom:12}}>
            {SYMS.map(sym=>{const sc=SM[sym]||{};return(
              <span key={sym} style={{display:'flex',alignItems:'center',gap:4,fontSize:11,
                color:'#666',padding:'3px 8px',border:'0.5px solid #e5e5e5',borderRadius:4}}>
                <span style={{width:7,height:7,borderRadius:2,background:sc.bd,display:'inline-block'}}/>
                ({sym}) {sc.lbl}
              </span>);
            })}
          </div>

          {/* Block Diagram */}
          <div style={{fontSize:11,fontWeight:700,color:'#888',letterSpacing:'.1em',
            textTransform:'uppercase',marginBottom:8}}>Block Diagram</div>
          <div style={{display:'flex',alignItems:'flex-start',gap:5,marginBottom:12,flexWrap:'wrap'}}>
            {blocks.map((blk,bi)=>{
              const c=BC[blk.color]||BC.blue;
              const bsents=(blk.sentenceNums||[]).map(n=>sm[n]).filter(Boolean);
              return(
                <React.Fragment key={blk.id}>
                  <div style={{flex:'1 1 130px',minWidth:0,borderRadius:10,border:'2px solid '+c.bd}}>
                    <div style={{padding:'8px 11px',background:c.hd,borderBottom:'1.5px solid '+c.bd,borderRadius:'8px 8px 0 0'}}>
                      {IS
                        ?<div style={{borderBottom:'2px solid '+c.bd,height:22,width:'85%',marginBottom:5}}/>
                        :editable
                        ?<><input value={blk.name} onChange={e=>onAnalysis(slot.id,'flow.blocks.'+bi+'.name',e.target.value)}
                            style={{...iB,fontSize:13.5,fontWeight:600,color:c.tx,borderBottomColor:c.bd,marginBottom:2}}/>
                           <input value={blk.nameEn} onChange={e=>onAnalysis(slot.id,'flow.blocks.'+bi+'.nameEn',e.target.value)}
                            style={{...iB,fontSize:11,fontStyle:'italic',fontWeight:600,color:c.tx,borderBottomColor:c.bd,opacity:.85}}/></>
                        :<><div style={{fontSize:13.5,fontWeight:600,color:c.tx,marginBottom:2,wordBreak:'keep-all'}}>{blk.name}</div>
                           <div style={{fontSize:11,color:c.tx,fontStyle:'italic',fontWeight:600,opacity:.85}}>{blk.nameEn}</div></>
                      }
                    </div>
                    <div style={{padding:'7px',background:'#fff'}}>
                      {bsents.map((sent,si)=>{
                        const sc=SM[sent.symbol]||{};
                        const si2=sentences.indexOf(sent);
                        return<div key={sent.num}>
                          {si>0&&<div style={{fontSize:9,color:'#ccc',paddingLeft:22,margin:'1px 0'}}>↓</div>}
                          <div style={{display:'flex',alignItems:'flex-start',gap:6,padding:'5px 6px',
                            borderRadius:6,background:sc.bg,marginBottom:3}}>
                            <span style={{fontSize:15,fontWeight:600,color:sc.tx,flexShrink:0,marginTop:1}}>{nStr(sent.num)}</span>
                            <div style={{flex:1,minWidth:0}}>
                              {editable&&!IS
                                ?<><select value={sent.symbol}
                                    onChange={e=>onAnalysis(slot.id,'sentences.'+si2+'.symbol',e.target.value)}
                                    style={{...sB,fontSize:10,fontWeight:700,padding:'1px 4px',borderRadius:3,
                                      background:sc.bg,color:sc.tx,border:'1px solid '+sc.bd,marginBottom:3,display:'block'}}>
                                    {SYMS.map(s=><option key={s} value={s}>{s}</option>)}
                                  </select>
                                  <textarea value={sent.role}
                                    onChange={e=>onAnalysis(slot.id,'sentences.'+si2+'.role',e.target.value)}
                                    rows={3} style={{...iB,fontSize:10.5,color:'#444',borderBottomColor:'#ddd',
                                      resize:'vertical',lineHeight:1.4,overflow:'auto',minHeight:'3em'}}/></>
                                :<>
                                  <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:3}}>
                                    <span style={{fontSize:10,fontWeight:700,padding:'1px 5px',borderRadius:3,
                                      background:sc.bg,color:sc.tx,border:'1px solid '+sc.bd,letterSpacing:'.03em'}}>{sent.symbol}</span>
                                  </div>
                                  <div style={{fontSize:10.5,color:'#333',lineHeight:1.45,wordBreak:'keep-all'}}>{sent.role}</div>
                                </>
                              }
                            </div>
                          </div>
                        </div>;
                      })}
                    </div>
                  </div>
                  {bi<blocks.length-1&&(
                    <div style={{display:'flex',flexDirection:'column',alignItems:'center',
                      justifyContent:'center',gap:2,flexShrink:0,paddingTop:52,minWidth:32}}>
                      {editable&&!IS
                        ?<select value={conn(bi)}
                            onChange={e=>{const cc=[...interBlockConnectors];cc[bi]=e.target.value;
                              onAnalysis(slot.id,'flow.interBlockConnectors',cc);}}
                            style={{...sB,fontSize:16,fontWeight:600,color:'#555',textAlign:'center',width:'100%'}}>
                            {SYMS.map(s=><option key={s} value={s}>{s}</option>)}
                          </select>
                        :<div style={{fontSize:16,fontWeight:600,color:'#555'}}>{conn(bi)}</div>
                      }
                      <div style={{fontSize:9,color:'#bbb',textAlign:'center',lineHeight:1.3}}>
                        {SM[conn(bi)]&&SM[conn(bi)].lbl||''}
                      </div>
                    </div>
                  )}
                </React.Fragment>
              );
            })}
          </div>

          {/* 메타 */}
          <div style={{display:'flex',gap:8,marginBottom:12,flexWrap:'wrap'}}>
            {[{lbl:'핵심 소재',f:'keyword',val:keyword,flex:1},
              {lbl:'주제 요약',f:'topicSummary',val:topicSummary,flex:2}].map(({lbl,f,val,flex})=>(
              <div key={f} style={{flex,minWidth:120,background:'#f8f8f8',
                border:'0.5px solid #e5e5e5',borderRadius:8,padding:'8px 12px'}}>
                <div style={{fontSize:10,fontWeight:700,color:'#888',letterSpacing:'.08em',
                  textTransform:'uppercase',marginBottom:5}}>{lbl}</div>
                {IS?<div style={{borderBottom:'1.5px solid #bbb',height:22}}/>
                  :<textarea value={val}
                    onChange={e=>onAnalysis(slot.id,'flow.'+f,e.target.value)}
                    rows={2} style={{...iB,fontSize:13,color:'#1a1a1a',resize:'none',
                      lineHeight:1.5,overflow:'hidden',wordBreak:'keep-all'}}/>}
              </div>
            ))}
            <div style={{flex:1.3,minWidth:100,background:'#f8f8f8',
              border:'0.5px solid #e5e5e5',borderRadius:8,padding:'8px 12px'}}>
              <div style={{fontSize:10,fontWeight:700,color:'#888',letterSpacing:'.08em',
                textTransform:'uppercase',marginBottom:5}}>구조 유형</div>
              {IS?<div style={{display:'flex',flexWrap:'wrap',gap:3}}>
                {['통념→반박→결론','문제→해결책','질문→답변'].map(s=>(
                  <span key={s} style={{fontSize:10,padding:'2px 6px',
                    border:'0.5px solid #ddd',borderRadius:3,color:'#bbb'}}>□ {s}</span>))}
              </div>
              :<select value={structureType}
                  onChange={e=>onAnalysis(slot.id,'flow.structureType',e.target.value)}
                  style={{...sB,width:'100%',fontSize:13,color:'#1a1a1a'}}>
                  {STRUCTS.map(s=><option key={s} value={s}>{s}</option>)}
                </select>}
            </div>
          </div>

          {/* 블록 요약 빈칸 섹션 */}
          {(()=>{
            const bs=slot.blockSummaries;
            const hasAnalysis=blocks.length>0;
            if(!hasAnalysis)return null;
            const BC2={blue:{bd:'#185FA5',bg:'#E6F1FB',tx:'#0C447C'},coral:{bd:'#D85A30',bg:'#FAECE7',tx:'#712B13'},
              teal:{bd:'#1D9E75',bg:'#E1F5EE',tx:'#085041'},purple:{bd:'#534AB7',bg:'#EEEDFE',tx:'#3C3489'},
              green:{bd:'#639922',bg:'#EAF3DE',tx:'#173404'},amber:{bd:'#BA7517',bg:'#FAEEDA',tx:'#633806'},gray:{bd:'#5F5E5A',bg:'#F1EFE8',tx:'#2C2C2A'}};

            const renderSummary=(sumText,keywords,bc)=>{
              if(!sumText)return null;
              const parts=sumText.split(/\{([^}]+)\}/g);
              return parts.map((part,i)=>{
                if(i%2===1){
                  if(IS){
                    return<span key={i} style={{display:'inline-block',borderBottom:'1.5px solid '+bc.bd,
                      minWidth:60,marginRight:2}}>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>;
                  }
                  return<span key={i} style={{display:'inline-block',background:bc.bg,color:bc.tx,
                    border:'1px solid '+bc.bd,borderRadius:4,padding:'0 5px',fontSize:11.5,fontWeight:500}}>{part}</span>;
                }
                return<span key={i}>{part}</span>;
              });
            };

            return(
              <div style={{marginBottom:12}}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
                  <div style={{fontSize:11,fontWeight:700,color:'#888',letterSpacing:'.08em',textTransform:'uppercase'}}>
                    블록 요약 빈칸
                  </div>
                  {!IS&&<button onClick={onGenSum} disabled={bs==='loading'}
                    style={{padding:'3px 10px',fontSize:11,background:bs==='loading'?'#ccc':'#185FA5',
                      color:'#fff',border:'none',borderRadius:5,cursor:'pointer'}}>
                    {bs==='loading'?'생성중...':bs?'재생성 ↻':'요약 생성 ↗'}
                  </button>}
                </div>
                {bs&&bs!=='loading'&&Array.isArray(bs)?
                  bs.map((item,bi)=>{
                    const blk=blocks.find(b=>b.id===item.blockId)||blocks[bi]||{};
                    const bc=BC2[blk.color]||BC2.gray;
                    return(
                      <div key={bi} style={{border:'0.5px solid '+bc.bd,borderRadius:8,
                        overflow:'hidden',marginBottom:8}}>
                        <div style={{background:bc.bg,padding:'5px 10px',display:'flex',gap:8,alignItems:'center'}}>
                          <span style={{fontSize:11,fontWeight:600,color:bc.tx}}>{blk.name||item.blockId}</span>
                          <span style={{fontSize:10,color:bc.tx,opacity:.7}}>{blk.nameEn||''}</span>
                        </div>
                        <div style={{padding:'8px 12px',fontSize:12.5,fontStyle:'italic',
                          color:'#333',lineHeight:1.8,wordBreak:'keep-all'}}>
                          {renderSummary(item.summary,item.keywords,bc)}
                        </div>
                      </div>
                    );
                  })
                  :<div style={{fontSize:12,color:'#bbb',padding:'10px 0',textAlign:'center'}}>
                    {IS?'(요약 미생성)':bs==='loading'?'생성 중...':'요약 생성 버튼을 눌러주세요'}
                  </div>
                }
              </div>
            );
          })()}

          {/* 문장별 분석 */}
          {(()=>{
            const dsToShow=IS
              ?sentences.filter(s=>difficultSentences.find(d=>d.num===s.num))
              :sentences;
            if(!dsToShow.length)return null;
            return(
              <div style={{marginBottom:10}}>
                <div style={{fontSize:11,fontWeight:700,color:'#888',letterSpacing:'.08em',
                  textTransform:'uppercase',marginBottom:8}}>
                  {IS?'구문 분석':'문장별 분석 — 끊어읽기 & 구문'}
                </div>
                {dsToShow.map(s=>{
                  const sc=SM[s.symbol]||{};
                  const ds=difficultSentences.find(d=>d.num===s.num);
                  const di=difficultSentences.findIndex(d=>d.num===s.num);
                  const chunks=s.chunks||[];
                  return(
                    <div key={s.num} style={{marginBottom:6,border:'0.5px solid '+sc.bd,
                      borderRadius:8,overflow:'hidden'}}>
                      <div style={{padding:'6px 12px',background:sc.bg,
                        display:'flex',alignItems:'center',gap:7}}>
                        <span style={{fontSize:15,fontWeight:700,color:sc.tx,flexShrink:0}}>{nStr(s.num)}</span>
                        <span style={{fontSize:10,fontWeight:700,padding:'1px 5px',borderRadius:3,
                          background:'rgba(255,255,255,.5)',color:sc.tx,border:'1px solid '+sc.bd,
                          flexShrink:0}}>({s.symbol})</span>
                        <span style={{fontSize:13,color:sc.tx,fontStyle:'italic',
                          wordBreak:'keep-all',overflowWrap:'break-word',lineHeight:1.5}}>
                          {chunks.length>0?chunks.map(c=>c.en||'').join(' / '):s.text}
                        </span>
                      </div>
                      {!IS&&chunks.length>0&&(
                        <div style={{padding:'7px 12px',background:'#fff',borderTop:'0.5px solid #eee'}}>
                          <div style={{fontSize:13,color:'#555',lineHeight:1.9,
                            wordBreak:'keep-all',overflowWrap:'break-word'}}>
                            {chunks.map(c=>c.ko||'').join(' / ')}
                          </div>
                        </div>
                      )}
                      {ds&&(
                        <div style={{padding:'7px 12px',background:'#fafafa',borderTop:'0.5px solid #eee'}}>
                          <div style={{fontSize:10,fontWeight:700,color:'#aaa',marginBottom:4}}>구문 분석</div>
                          {[{lbl:'구조',f:'structure'},{lbl:'해석',f:'translation'},{lbl:'포인트',f:'point'}].map(row=>(
                            <div key={row.f} style={{display:'flex',gap:8,padding:'3px 0',
                              borderBottom:'0.5px dashed #eee',alignItems:'flex-start'}}>
                              <span style={{fontSize:10,fontWeight:700,color:'#888',
                                flexShrink:0,width:34,paddingTop:2}}>{row.lbl}</span>
                              <textarea value={ds[row.f]||''}
                                onChange={e=>{const nd=[...difficultSentences];
                                  nd[di]={...nd[di],[row.f]:e.target.value};
                                  onAnalysis(slot.id,'grammar.difficultSentences',nd);}}
                                rows={1} style={{...iB,fontSize:12.5,color:'#333',resize:'none',
                                  lineHeight:1.5,flex:1,overflow:'hidden',wordBreak:'break-all'}}/>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            );
          })()}
        </div>
      )}
    </div>
  );
}

/* ── 자료 상세 보기: 시트 데이터를 slot 형태로 변환 후 SlotViewer로 렌더 ── */
function toStudySlot(passage){
  let sentences=[],flow={},blockSummaries=null;
  try{sentences=JSON.parse(passage.sentences_json||'[]');}catch{}
  try{flow=JSON.parse(passage.flow_json||'{}');}catch{}
  try{blockSummaries=JSON.parse(passage.blockSummaries_json||'null');}catch{}
  return {
    id:0,
    text:'',
    meta:{
      source:passage.source||'',
      chapter:passage.chapter||'',
      number:passage.number||'',
      difficulty:passage.difficulty||'중',
    },
    status:'saved',
    analysis:{sentences,flow,grammar:{difficultSentences:(flow&&flow.difficultSentences)||[]}},
    passageData:{
      id:passage.id,
      title:passage.title||'',
      abstract:passage.abstract||'',
      sentences,
      flow,
    },
    blockSummaries:blockSummaries,
    open:true,
    isPublic:true,
  };
}
function StudyDetail({passage,viewMode,setViewMode,goBack}){
  // 시트 row -> teacher.html slot 형태로 변환
  const slot=React.useMemo(()=>toStudySlot(passage),[passage]);

  const bodyRef=React.useRef(null);
  const printStudy=()=>{
    if(!bodyRef.current)return;
    const w=window.open('','_blank');
    if(!w){alert('팝업이 차단되었습니다. 팝업을 허용해주세요.');return;}
    const title=(passage.title||passage.id||'자료').replace(/</g,'&lt;');
    w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${title}</title>
<style>
body{font-family:'Pretendard','Malgun Gothic',sans-serif;color:#222;margin:0;padding:18px;font-size:13px;line-height:1.7}
.hd{border-bottom:2.5px solid #7a1020;padding-bottom:8px;margin-bottom:14px}
.hd b{font-size:16px;color:#7a1020}
.hd span{font-size:11px;color:#888;margin-left:8px}
button{display:none!important}
*{box-shadow:none!important}
@media print{@page{margin:14mm} body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body>
<div class="hd"><b>${title}</b><span>대단한영어 · 자료</span></div>
${bodyRef.current.innerHTML}
</body></html>`);
    w.document.close();
    setTimeout(()=>{w.focus();w.print();},400);
  };

  return(
    <div style={{maxWidth:900,margin:'0 auto',padding:'0 0 80px',background:'#fafafa',minHeight:'100vh'}}>
      <div style={{position:'sticky',top:0,zIndex:10,background:'#fff',borderBottom:'1px solid #f0f0f0',padding:'12px 16px'}}>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
          <button onClick={goBack} style={{background:'none',border:'none',fontSize:20,cursor:'pointer',padding:0,color:'#4f7df7'}}>←</button>
          <span style={{fontWeight:800,fontSize:14,color:'#1e293b',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{passage.title||passage.id}</span>
          <button onClick={printStudy} style={{fontSize:11,fontWeight:700,padding:'5px 11px',borderRadius:7,border:'1px solid #e6dcc6',background:'#fff',color:'#3a2a20',cursor:'pointer'}}>🖨 인쇄</button>
          <div style={{display:'flex',background:'#f1f5f9',borderRadius:7,padding:2,gap:0}}>
            {['teacher','student'].map(m=>(
              <button key={m} onClick={()=>setViewMode(m)}
                style={{padding:'5px 12px',fontSize:11,fontWeight:700,borderRadius:5,border:'none',cursor:'pointer',
                  background:viewMode===m?'#185FA5':'transparent',
                  color:viewMode===m?'#fff':'#64748b'}}>
                {m==='teacher'?'교사용':'학생용'}
              </button>
            ))}
          </div>
        </div>
      </div>
      <div style={{padding:'12px'}} ref={bodyRef}>
        <SlotViewer slot={slot} viewMode={viewMode}/>
      </div>
    </div>
  );
}

    const t=setTimeout(()=>{
      jsonpFetch(scriptUrl,{action:'getRank',student:studentName})
        .then(r=>{if(r&&r.ok&&r.show)setRankInfo({rank:r.rank,total:r.total});})
        .catch(()=>{});
    },1200);
    return ()=>clearTimeout(t);
  },[]);

  // 결과 저장 (마운트 시 자동 전송)
  React.useEffect(()=>{
    if(!scriptUrl||!studentName)return;
    setSaveStatus('saving');
    const now=new Date();
    const dateStr=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    const details=questions.map((q,i)=>{
      const ans=userAns[i];
      return `${q.passage.id}|${TYPES.find(t=>t.id===q.type)?.name||q.type}|${ans?.correct?'O':'X'}`;
    }).join('||');
    const payload={
      action: 'saveResult',
      name: studentName,
      date: dateStr,
      score: `${score.correct}/${score.total}`,
      rate: pct,
      detail: details
    };
      if(scriptUrl){
        // 저장 요청 후 성공으로 처리 (JSONP는 응답 확인 불필요)
        jsonpFetch(scriptUrl, payload).catch(()=>{});
        setSaveStatus('done');
      } else {
        setSaveStatus('done');
      }
  },[]);

  if(viewP) return <StudyDetail passage={viewP} viewMode={studyMode} setViewMode={setStudyMode} goBack={()=>setViewP(null)}/>;

  return(
    <div style={S.page}>
      <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet"/>

        <div style={{textAlign:'center',marginBottom:20}}>
          <div style={{fontSize:42,marginBottom:4}}>{emoji}</div>
          <h2 style={{fontSize:20,fontWeight:800,color:S.c.wine,margin:0}}>이번 회차 결과</h2>
          {studentName&&<p style={{fontSize:14,color:S.c.wineSoft,fontWeight:700,margin:'4px 0 0'}}>{studentName}</p>}
          <p style={{fontSize:32,fontWeight:800,color:pct>=80?S.c.ok:pct>=50?S.c.goldDk:S.c.ng,margin:'8px 0'}}>{score.correct} / {score.total}</p>
          <p style={{fontSize:13,color:S.c.sub}}>정답률 {pct}%</p>
          {/* 저장 상태 표시 */}
          {scriptUrl&&studentName&&(
            <p style={{fontSize:11.5,marginTop:4,color:saveStatus==='done'?S.c.ok:saveStatus==='error'?S.c.ng:S.c.sub}}>
              {saveStatus==='saving'?'📤 결과 저장 중...':saveStatus==='done'?'✅ 결과 저장 완료':saveStatus==='error'?'❌ 저장 실패 (URL 확인)':''}
            </p>
          )}
        </div>

        {/* 🏆 탑3 랭킹 축하 (서버가 탑3일 때만 내려줌 — 그 외 학생에겐 표시 안 됨) */}
        {rankInfo&&(()=>{
          const medal={
            1:{bg:'linear-gradient(135deg,#7a5c0e 0%,#9a7818 45%,#c9a84c 100%)',bd:'#F2D88F',glow:'rgba(201,168,76,0.5)',num:'#FFF1C4',sub:'#f0e2bf',ico:'🥇',deco:'👑'},
            2:{bg:'linear-gradient(135deg,#5a5e66 0%,#7c828c 45%,#aab0ba 100%)',bd:'#E8ECF2',glow:'rgba(180,188,200,0.5)',num:'#ffffff',sub:'#eef1f5',ico:'🥈',deco:'✨'},
            3:{bg:'linear-gradient(135deg,#6e3d1f 0%,#8a5430 45%,#b5783c 100%)',bd:'#E8B98F',glow:'rgba(181,120,60,0.5)',num:'#FFE2C4',sub:'#f0d8c2',ico:'🥉',deco:'✨'},
          }[rankInfo.rank]||{};
          return <div style={{position:'relative',overflow:'hidden',background:medal.bg,
            border:'2px solid '+medal.bd,borderRadius:16,padding:'16px 20px',marginBottom:16,

            <div style={{flex:1}}>
              <div style={{fontSize:17,fontWeight:800,color:'#fff',letterSpacing:0.3,textShadow:'0 1px 2px rgba(0,0,0,0.3)'}}>

              </div>
              <div style={{fontSize:11.5,color:medal.sub,marginTop:3}}>대단한영어 누적 랭킹 · 탁월함이 습관이 되도록</div>
            </div>
            <span style={{fontSize:11,fontWeight:800,background:'rgba(255,255,255,0.92)',color:'#3a2a20',padding:'5px 12px',borderRadius:12,letterSpacing:0.6,boxShadow:'0 2px 6px rgba(0,0,0,0.25)',whiteSpace:'nowrap'}}>TOP 3</span>

        {/* 이번 회차 유형별 요약 (누적 아님) */}
        {(()=>{

          </div>;
        })}

        <button onClick={goHome} style={{width:'100%',padding:13,borderRadius:14,border:'none',background:S.c.wine,color:'#fff',fontSize:14.5,fontWeight:700,cursor:'pointer',marginTop:14}}>새로운 세션 시작</button>
      </div>
    </div>
  );
}

/* ── 인쇄 HTML ── */
function printHTML(questions,userAns,mode){
  const TN={topic:'주제 찾기',order:'순서 배열',blank:'빈칸 추론',insert:'문장 삽입',summary:'요약문',implication:'함축적 의미',irrelevant:'무관한 문장'};
  const M=['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩','⑪','⑫'];
  let h=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${mode==='q'?'문제지':'정답지'}</title><style>
    body{font-family:'Batang','Times New Roman',serif;font-size:11pt;line-height:1.9;max-width:680px;margin:0 auto;padding:30px;color:#111}
    h1{text-align:center;font-size:16pt;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:20px}
    .q{margin-bottom:26px;page-break-inside:avoid}
    .qn{font-weight:bold;font-size:12pt;margin-bottom:6px}
    .src{font-size:9pt;color:#666;margin-bottom:4px}
    .p{background:#f7f7f7;padding:12px;border:1px solid #ddd;margin:8px 0;font-size:10.5pt;line-height:1.9}
    .gv{background:#eee;padding:10px;border:1px solid #ccc;margin:6px 0;font-size:10.5pt}
    .op{margin:8px 0} .op div{margin:3px 0;font-size:10.5pt}
    table{border-collapse:collapse;width:100%;margin:8px 0} th,td{border:1px solid #000;padding:5px 7px;font-size:10.5pt}
    @media print{body{padding:15px}.q{page-break-inside:avoid}}
  </style></head><body>`;

  if(mode==='q'){
    h+='<h1>대단한영어 내신시험 출제예상문제</h1>';
    questions.forEach((q,i)=>{
      h+=`<div class="q"><div class="src">출처: ${q.passage.id}</div>`;
      h+=`<div class="qn">${i+1}. [${TN[q.type]}] ${q.instruction}</div>`;

      if(q.type==='order'){
        h+=`<div class="gv"><b>주어진 글:</b> ${q.given}</div>`;
        q.blocks.forEach(b=>h+=`<div class="p"><b>(${b.label})</b> ${b.text}</div>`);
        h+='<div class="op">';q.options.forEach((o,j)=>h+=`<div>${M[j]} ${o.text}</div>`);h+='</div>';
      } else if(q.type==='insert'){
        h+=`<div class="gv"><b>주어진 문장:</b> ${q.removed}</div><div class="p">`;
        const mIdxs2=q.markerIdxs||[];
        q.remaining.forEach((s,j)=>{
          const mNum=mIdxs2.indexOf(j);if(mNum>=0)h+=`<b> ( ${M[mNum]} ) </b>`;
          h+=s+' ';
        });
        h+='</div>';
      } else if(q.type==='blank'){
        h+='<div class="p">';
        q.passage.sentences.forEach((s,j)=>h+=(j===q.blankIdx?`<u>${q.blanked}</u>`:s)+' ');
        h+='</div><div class="op">';q.options.forEach((o,j)=>h+=`<div>${M[j]} ${o.text}</div>`);h+='</div>';
      } else if(q.type==='irrelevant'){
        h+='<div class="p">';const nm2={};q.numberedIdxs.forEach((fi,ci)=>{nm2[fi]=ci+1;});q.full.forEach((s,i)=>{if(nm2[i]&&i>0)h+=`<b> ( ${M[nm2[i]-1]} ) </b>${s} `;else h+=s+' ';});h+='</div>';
      } else if(q.type==='summary'){
        h+='<div class="p">';q.passage.sentences.forEach(s=>h+=s+' ');h+='</div>';
        const sumTpl2=q.passage.summary_template||q.abstract;
        const sumDisp2=sumTpl2.replace('________(A)________','<span style="display:inline-block;width:70px;border-bottom:1.5px solid #000;vertical-align:bottom;"></span>').replace('________(B)________','<span style="display:inline-block;width:70px;border-bottom:1.5px solid #000;vertical-align:bottom;"></span>');
        h+=`<div class="gv"><b>요약문:</b> ${sumDisp2}</div>`;
        h+='<table><tr><th></th><th>(A)</th><th>(B)</th></tr>';
        q.aOpts.forEach((a,j)=>{const b=q.bOpts[j];if(b)h+=`<tr><td style="text-align:center">${M[j]}</td><td>${a.text}</td><td>${b.text}</td></tr>`;});
        h+='</table>';
      } else if(q.type==='implication'){
        h+='<div class="p">';
        q.passage.sentences.forEach((s,j)=>{h+=(j===q.targetIdx?`<u>${s}</u>`:s)+' ';});
        h+='</div><div class="op">';q.options.forEach((o,j)=>h+=`<div>${M[j]} ${o.text}</div>`);h+='</div>';
      } else {
        h+='<div class="p">';q.passage.sentences.forEach(s=>h+=s+' ');
        h+='</div><div class="op">';if(q.options)q.options.forEach((o,j)=>h+=`<div>${M[j]} ${o.text}</div>`);h+='</div>';
      }
      h+='</div>';
    });
  } else {
    h+='<h1>정답지</h1><table><tr><th>번호</th><th>유형</th><th>출처</th><th>정답</th><th>해설</th></tr>';
    questions.forEach((q,i)=>{
      let ans='';
      if(q.type==='insert'){const mIdxsB=q.markerIdxs||[];const mNumB=mIdxsB.indexOf(q.correctPos);ans=mNumB>=0?M[mNumB]:M[q.correctPos];}
      else if(q.type==='irrelevant')ans=M[q.correctNum-1];
      else if(q.type==='summary'){const ai=q.aOpts.findIndex(o=>o.correct);ans=M[ai];}
      else if(q.options)ans=M[q.options.findIndex(o=>o.correct)];
      h+=`<tr><td style="text-align:center">${i+1}</td><td>${TN[q.type]}</td><td style="font-size:8pt">${q.passage.id}</td><td style="font-weight:bold;text-align:center">${ans}</td><td style="font-size:9pt">${q.passage.title}</td></tr>`;
    });
    h+='</table>';
  }
  h+='</body></html>';
  return h;
}



/* ── 전역 오류 경계: 앱 어디서 터져도 백지 대신 안내 + 새로고침 ── */
class AppErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={err:null};}
  static getDerivedStateFromError(err){return {err};}
  componentDidCatch(err,info){console.error('[앱 오류]',err,info);}
  render(){
    if(this.state.err){
      const msg=(this.state.err&&(this.state.err.message||String(this.state.err)))||'알 수 없는 오류';
      return (
        <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:'24px',fontFamily:"'Pretendard',sans-serif",background:'#f5f7fa'}}>
          <div style={{maxWidth:420,width:'100%',background:'#fff',borderRadius:16,padding:'28px 24px',boxShadow:'0 2px 12px rgba(0,0,0,0.08)',textAlign:'center'}}>
            <div style={{fontSize:40,marginBottom:8}}>⚠️</div>
            <div style={{fontSize:16,fontWeight:800,color:'#e53935',marginBottom:8}}>화면을 불러오지 못했습니다</div>
            <div style={{fontSize:13,color:'#64748b',lineHeight:1.7,marginBottom:18}}>
              일시적인 오류일 수 있습니다. 아래 버튼으로 새로고침해 주세요.<br/>
              계속 같은 화면이 나오면 선생님께 알려 주세요.
            </div>
            <button onClick={()=>{try{location.reload();}catch(e){}}}
              style={{padding:'11px 24px',borderRadius:12,border:'none',background:'#1e293b',color:'#fff',fontSize:14,fontWeight:700,cursor:'pointer'}}>
              🔄 새로고침
            </button>
            <details style={{marginTop:18,textAlign:'left'}}>
              <summary style={{fontSize:11,color:'#94a3b8',cursor:'pointer'}}>오류 내용 (선생님 확인용)</summary>
              <pre style={{fontSize:10.5,color:'#94a3b8',whiteSpace:'pre-wrap',wordBreak:'break-all',marginTop:6,maxHeight:140,overflow:'auto'}}>{msg}</pre>
            </details>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <AppErrorBoundary><App /></AppErrorBoundary>
);
</script></script>
</body>
</html>
