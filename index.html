/* ── 타이머 컴포넌트 ── */
function Timer({timerKey,onExpire,stopped}){
  const [left,setLeft]=useState(120);
  const [paused,setPaused]=useState(false);
  const [frozen,setFrozen]=useState(false);
  useEffect(()=>{setLeft(120);setPaused(false);setFrozen(false);},[timerKey]);
  useEffect(()=>{if(stopped)setFrozen(true);},[stopped]);
  useEffect(()=>{
    if(paused||frozen)return;
    if(left<=0){onExpire?.();return;}
    const t=setTimeout(()=>setLeft(l=>l-1),1000);
    return()=>clearTimeout(t);
  },[left,paused,stopped]);

  const m=Math.floor(left/60), sec=left%60;
  const pct=left/120*100;
  const color=left<=30?'#C0392B':left<=60?'#C9A84C':S.c.wine;
  return(
    <div style={{display:'flex',alignItems:'center',gap:10}}>
      <div style={{flex:1,background:S.c.track,borderRadius:5,height:6,overflow:'hidden'}}>
        <div style={{background:color,height:'100%',width:`${pct}%`,transition:'width 1s linear',borderRadius:5}}/>
      </div>
      <span style={{fontSize:14,fontWeight:800,color,minWidth:46,textAlign:'right',fontVariantNumeric:'tabular-nums'}}>
        {m}:{sec.toString().padStart(2,'0')}
      </span>
    </div>
  );
}

/* ── 오류 경계: 한 문항 렌더가 실패해도 백지화면 대신 안내+다음 ── */
class QuizErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={err:null};}
  static getDerivedStateFromError(err){return {err};}
  componentDidCatch(err,info){console.error('[Quiz 렌더 오류]',err,info);}
  componentDidUpdate(prev){
    // 문항이 바뀌면 오류 상태 초기화 (다음 문제는 정상 표시 시도)
    if(prev.resetKey!==this.props.resetKey && this.state.err) this.setState({err:null});
  }
  render(){
    if(this.state.err){
      const qi=this.props.qInfo;
      const tName=qi?(TYPES.find(t=>t.id===qi.type)?.name||qi.type):'';
      return (
        <div style={{maxWidth:560,margin:'0 auto',padding:'40px 20px',textAlign:'center'}}>
          <div style={{fontSize:15,fontWeight:700,color:'#e53935',marginBottom:8}}>이 문제를 표시할 수 없습니다</div>
          {qi&&<div style={{fontSize:12,fontWeight:700,color:'#7a1020',marginBottom:6}}>{qi.passage?.id} · {tName}</div>}
          <div style={{fontSize:12.5,color:'#64748b',marginBottom:8,lineHeight:1.6}}>
            문항 데이터가 비어 있거나 형식이 올바르지 않습니다.<br/>다음 문제로 넘어가 주세요.
          </div>
          <div style={{fontSize:10.5,color:'#9a8570',marginBottom:20,wordBreak:'break-all'}}>{String(this.state.err?.message||this.state.err).slice(0,160)}</div>
          <button onClick={this.props.onSkip} style={{padding:'10px 22px',borderRadius:12,border:'none',background:'#1e293b',color:'#fff',fontSize:14,fontWeight:600,cursor:'pointer'}}>
            다음 문제 →
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

/* ── 퀴즈 ── */
function Quiz({q,idx,total,userAnswer,showAnswer,onSubmit,onNext,score,ansMode,goHome,questions,userAns,timerKey,doPrint}){
  const [selected,setSelected]=useState(null);
  const [sA,setSA]=useState(null);
  const [sB,setSB]=useState(null);
  const [insertSel,setInsertSel]=useState(null);
  const [irrelSel,setIrrelSel]=useState(null);

  useEffect(()=>{setSelected(null);setSA(null);setSB(null);setInsertSel(null);setIrrelSel(null);},[idx]);

  const submit=()=>{
    let c=false;
    if(q.type==='summary'){c=q.aOpts[sA]?.correct&&q.bOpts[sB]?.correct;onSubmit({correct:c,selectedA:sA,selectedB:sB});}
    else if(q.type==='insert'){c=insertSel===q.correctPos;onSubmit({correct:c,selected:insertSel});}
    else if(q.type==='irrelevant'){c=irrelSel===q.correctNum;onSubmit({correct:c,selected:irrelSel});}
    else{c=q.options?.[selected]?.correct||false;onSubmit({correct:c,selected});}
  };

  const canSubmit=()=>{
    if(q.type==='summary')return sA!==null&&sB!==null;
    if(q.type==='insert')return insertSel!==null;
    if(q.type==='irrelevant')return irrelSel!==null;
    return selected!==null;
  };

  const handleExpire=()=>{if(!userAnswer)onSubmit({correct:false,expired:true});};

  const tInfo=TYPES.find(t=>t.id===q.type);
  const pct=((idx+1)/total)*100;

  return(
    <div style={S.page}>
      <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet"/>
      <div style={{maxWidth:760,margin:'0 auto',padding:'clamp(12px,3vw,28px) clamp(10px,3vw,16px)',paddingBottom:96}}>

        {/* 상단 브랜드 */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'center',flexWrap:'wrap',gap:'2px 8px',marginBottom:'clamp(8px,2vw,12px)'}}>
          <span style={{fontSize:'clamp(15px,2.4vw,18px)',fontWeight:900,color:S.c.wine,letterSpacing:1.5}}>대단한영어</span>
          <span style={{color:S.c.gold,fontSize:14}}>·</span>
          <span style={{fontSize:'clamp(12px,2vw,15px)',fontWeight:600,color:S.c.wineSoft,letterSpacing:0.5,fontStyle:'italic'}}>탁월함이 습관이 될 때</span>
        </div>

        {/* 컨트롤 바 */}
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,marginBottom:12}}>
          <button onClick={goHome} style={{background:'#fff',border:`1px solid ${S.c.line}`,color:S.c.goldDk,fontSize:12.5,cursor:'pointer',fontWeight:700,borderRadius:9,padding:'6px 12px',flexShrink:0}}>← 홈</button>
          <div style={{display:'flex',gap:6,alignItems:'center'}}>
            <span style={{fontSize:12,color:S.c.goldDk,fontWeight:700,whiteSpace:'nowrap'}}>정답률 {score.total>0?Math.round(score.correct/score.total*100):0}%</span>
            <button onClick={()=>doPrint('q')} style={{...S.chip(false),fontSize:11,padding:'5px 11px'}}>🖨️ 문제</button>
            <button onClick={()=>doPrint('a')} style={{...S.chip(false),fontSize:11,padding:'5px 11px'}}>🖨️ 정답</button>
          </div>
        </div>

        {/* 진행바 + 메타 */}
        <div style={{background:S.c.track,borderRadius:6,height:7,marginBottom:7,overflow:'hidden'}}>
          <div style={{background:`linear-gradient(90deg,${S.c.wine},${S.c.gold})`,height:'100%',width:`${pct}%`,transition:'width .4s',borderRadius:6}}/>
        </div>
        <div style={{display:'flex',justifyContent:'space-between',marginBottom:10,fontSize:11.5,color:S.c.sub,fontWeight:600}}>
          <span>{idx+1} / {total}</span><span>맞힌 문제 {score.correct}</span>
        </div>

        {/* 타이머 */}
        <div style={{marginBottom:14}}>
          <Timer timerKey={timerKey} onExpire={handleExpire} stopped={!!userAnswer}/>
        </div>

        {/* 문제 카드 */}
        <div style={{...S.card,padding:'clamp(16px,3.5vw,22px)'}}>
          <div style={{display:'flex',alignItems:'center',gap:7,marginBottom:10}}>
            <span style={{fontSize:18}}>{tInfo?.icon}</span>
            <span style={{fontSize:'clamp(12px,1.8vw,13.5px)',fontWeight:800,color:S.c.wine}}>{tInfo?.name}</span>
            <span style={{fontSize:10.5,color:q.passage.difficulty==='높음'?S.c.ng:S.c.goldDk,fontWeight:700,marginLeft:'auto',padding:'3px 10px',borderRadius:11,background:q.passage.difficulty==='높음'?S.c.ngBg:'#f6efe0'}}>{q.passage.difficulty}</span>
          </div>
          <p style={{fontSize:10.5,color:S.c.sub,margin:'0 0 12px'}}>출처: {q.passage.id}</p>
          <p style={{fontSize:'clamp(14px,2.2vw,15.5px)',fontWeight:700,color:S.c.ink,marginBottom:16,lineHeight:1.55}}>{q.instruction}</p>

          <PassageView q={q} insertSel={insertSel} setInsertSel={userAnswer?null:setInsertSel} irrelSel={irrelSel} setIrrelSel={userAnswer?null:setIrrelSel} showAnswer={showAnswer}/>
        </div>

        {/* 선택지 */}
        <div style={{...S.card,padding:'clamp(16px,3.5vw,22px)'}}>
          <OptsView q={q} selected={selected} setSelected={userAnswer?null:setSelected} sA={sA} setSA={userAnswer?null:setSA} sB={sB} setSB={userAnswer?null:setSB} showAnswer={showAnswer}/>

          {!userAnswer?(
            <button onClick={submit} disabled={!canSubmit()} style={{width:'100%',padding:'clamp(13px,2.5vw,15px)',borderRadius:13,border:'none',background:canSubmit()?S.c.wine:'#d8cdb8',color:'#fff',fontSize:'clamp(14px,2.2vw,15.5px)',fontWeight:800,letterSpacing:1,cursor:canSubmit()?'pointer':'default',marginTop:14,transition:'background .2s'}}>제출</button>
          ):(
            <div style={{marginTop:14}}>
              {showAnswer&&<div style={{padding:'clamp(13px,3vw,16px)',borderRadius:13,marginBottom:11,background:userAnswer.correct?S.c.okBg:S.c.ngBg,border:`1.5px solid ${userAnswer.correct?'#9ED3AC':'#E9B4AE'}`}}>
                <p style={{fontWeight:800,fontSize:'clamp(14px,2.2vw,15.5px)',color:userAnswer.correct?S.c.ok:S.c.ng,margin:0,display:'flex',alignItems:'center',gap:7}}>
                  {userAnswer.expired?'⏱ 시간 초과':userAnswer.correct?'✓ 정답입니다':'✕ 오답'}
                </p>
                <p style={{fontSize:'clamp(12px,1.9vw,13px)',color:S.c.ink,marginTop:8,marginBottom:0,lineHeight:1.65}}>
                  <strong style={{color:S.c.wine}}>{q.passage.title}</strong>
                  {q.explanation
                    ? <><br/><span style={{fontWeight:700,color:S.c.goldDk}}>해설 </span>{q.explanation}</>
                    : (q.passage.abstract ? <><br/>{q.passage.abstract}</> : null)}
                </p>
              </div>}
              <button onClick={onNext} style={{width:'100%',padding:'clamp(13px,2.5vw,15px)',borderRadius:13,border:'none',background:S.c.wine,color:'#fff',fontSize:'clamp(14px,2.2vw,15.5px)',fontWeight:800,letterSpacing:1,cursor:'pointer'}}>
                {idx+1>=total?'결과 보기':'다음 문제 →'}
              </button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ── 지문 표시 ── */
function PassageView({q,insertSel,setInsertSel,irrelSel,setIrrelSel,showAnswer}){
  const M=['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩','⑪','⑫'];

  if(q.type==='order'){
    return(<div>
      <div style={{padding:11,background:'#f8fafc',borderRadius:10,border:'1px solid #e2e8f0',marginBottom:12}}>
        <p style={{fontSize:10.5,fontWeight:600,color:'#64748b',margin:'0 0 3px'}}>주어진 글</p>
        <p style={{fontSize:15,color:'#1e293b',margin:0,lineHeight:1.8}}>{q.given}</p>
      </div>
      {q.blocks.map(b=><div key={b.label} style={{padding:11,background:'#fff',borderRadius:10,border:'1px solid #e2e8f0',marginBottom:7}}>
        <span style={{fontWeight:700,color:'#4f7df7',fontSize:13.5,marginRight:7}}>({b.label})</span>
        <span style={{fontSize:15,color:'#334155',lineHeight:1.8}}>{b.text}</span>
      </div>)}
    </div>);
  }

  if(q.type==='insert'){
    const markerIdxs = q.markerIdxs || (() => {
      // fallback: 구 데이터 호환
      const idxs = [];
      for(let k=q.markerStart||1; k<q.remaining.length && idxs.length<(q.maxMarkers||5); k++) idxs.push(k);
      return idxs;
    })();
    return(<div>
      <div style={{padding:11,background:'#eef3ff',borderRadius:10,border:'1px solid #bfdbfe',marginBottom:12}}>
        <p style={{fontSize:10.5,fontWeight:600,color:'#4f7df7',margin:'0 0 3px'}}>주어진 문장</p>
        <p style={{fontSize:15,color:'#1e293b',margin:0,lineHeight:1.8}}>{q.removed}</p>
      </div>
      <div style={{fontSize:15,lineHeight:2,color:'#334155'}}>
        {q.remaining.map((sent,i)=>{
          const mNum = (i===0) ? -1 : markerIdxs.indexOf(i); // 맨 앞 번호 금지
          if(mNum === -1) return <span key={i}>{sent}{' '}</span>;
          const isCorrect=showAnswer&&i===q.correctPos;
          const isSel=insertSel===i;
          const isWrong=showAnswer&&isSel&&i!==q.correctPos;
          return(<span key={i}>
            <span onClick={()=>setInsertSel&&setInsertSel(i)} style={{
              cursor:setInsertSel?'pointer':'default',display:'inline-block',margin:'0 3px',
              padding:'1px 5px',borderRadius:4,fontWeight:700,fontSize:14.5,
              color:isCorrect?'#16a34a':isWrong?'#dc2626':isSel?'#4f7df7':'#f59e0b',
              background:isCorrect?'#dcfce7':isWrong?'#fee2e2':isSel?'#dbeafe':'transparent',
            }}>{M[mNum]}</span>
            {sent}{' '}
          </span>);
        })}
        {(()=>{
          // 맨 끝 마커(realPos=remaining.length인 경우) 별도 렌더링
          const lastPos=q.remaining.length;
          const mNum=markerIdxs.indexOf(lastPos);
          if(mNum===-1)return null;
          const isCorrect=showAnswer&&lastPos===q.correctPos;
          const isSel=insertSel===lastPos;
          const isWrong=showAnswer&&isSel&&lastPos!==q.correctPos;
          return<span key='last'>
            <span onClick={()=>setInsertSel&&setInsertSel(lastPos)} style={{
              cursor:setInsertSel?'pointer':'default',display:'inline-block',margin:'0 3px',
              padding:'1px 5px',borderRadius:4,fontWeight:700,fontSize:14.5,
              color:isCorrect?'#16a34a':isWrong?'#dc2626':isSel?'#4f7df7':'#f59e0b',
              background:isCorrect?'#dcfce7':isWrong?'#fee2e2':isSel?'#dbeafe':'transparent',
            }}>{M[mNum]}</span>
          </span>;
        })()}
      </div>
    </div>);
  }

  if(q.type==='blank'){
    // 정답 길이에 비례한 밑줄 생성
    const blankLen = q.passage.blank_target ? q.passage.blank_target.length : 10;
    const blankWidth = Math.max(60, Math.min(220, blankLen * 7));
    return(<div style={{fontSize:15,lineHeight:2,color:'#334155'}}>
      {q.passage.sentences.map((sent,i)=>{
        if(i===q.blankIdx){
          const parts = q.blanked.split('_____');
          return <span key={i}>
            {parts[0]}<span style={{display:'inline-block',width:blankWidth,borderBottom:'2px solid #334155',verticalAlign:'bottom',marginBottom:2,background:'#fef9c3',borderRadius:'2px 2px 0 0'}}>&nbsp;</span>{parts[1]}{' '}
          </span>;
        }
        return <span key={i}>{sent}{' '}</span>;
      })}
    </div>);
  }

  if(q.type==='implication'){
    return(<div style={{fontSize:15,lineHeight:2,color:'#334155'}}>
      {q.passage.sentences.map((sent,i)=>{
        if(i===q.targetIdx){
          const ph=q.underline;
          const re=new RegExp(`(${ph.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,'i');
          const parts=sent.split(re);
          return <span key={i}>{parts.map((p,j)=>
            p.toLowerCase()===ph.toLowerCase()?<span key={j} style={{borderBottom:'3px solid #f59e0b',fontWeight:600,color:'#92400e',padding:'0 1px'}}>{p}</span>
            :<span key={j}>{p}</span>
          )}{' '}</span>;
        }
        return <span key={i}>{sent} </span>;
      })}
    </div>);
  }

  if(q.type==='irrelevant'){
    const numMap={};
    q.numberedIdxs.forEach((fi,ci)=>{numMap[fi]=ci+1;});
    return(<div style={{fontSize:15,lineHeight:2,color:'#334155'}}>
      {q.full.map((sent,i)=>{
        const num=numMap[i];
        if(i===0||num===undefined) return <span key={i}>{sent} </span>;
        const isC=showAnswer&&num===q.correctNum;
        const isS=irrelSel===num;
        const isW=showAnswer&&isS&&num!==q.correctNum;
        return <span key={i} onClick={()=>setIrrelSel&&setIrrelSel(num)} style={{
          cursor:setIrrelSel?'pointer':'default',
          background:isC?'#dcfce7':isW?'#fee2e2':isS?'#dbeafe':'transparent',
          borderRadius:4,padding:'1px 2px',transition:'all .12s'
        }}>
          <strong style={{color:isC?'#16a34a':isW?'#dc2626':'#4f7df7',marginRight:2,fontSize:13.5}}>{M[num-1]}</strong>
          {sent}{' '}
        </span>;
      })}
    </div>);
  }

  if(q.type==='summary'){
    // summary_template 우선 사용, 없으면 abstract에서 치환
    let sumText = q.passage.summary_template || '';
    if(!sumText){
      // fallback: abstract에서 ansA/ansB 치환
      let t = q.abstract||'';
      if(q.ansA) t = t.replace(q.ansA,'________(A)________');
      if(q.ansB) t = t.replace(q.ansB,'________(B)________');
      sumText = t;
    }
    return(<div>
      <div style={{fontSize:15,lineHeight:2,color:'#334155',marginBottom:14}}>
        {q.passage.sentences.map((s,i)=><span key={i}>{s} </span>)}
      </div>
      <div style={{padding:13,background:'#f1f5f9',borderRadius:10,border:'1px dashed #94a3b8'}}>
        <p style={{fontSize:11.5,fontWeight:700,color:'#475569',margin:'0 0 5px'}}>▼ 요약문</p>
        <p style={{fontSize:15,color:'#1e293b',margin:0,lineHeight:1.8}}>{sumText}</p>
      </div>
    </div>);
  }

  if(q.type==='grammar'||q.type==='vocab'){
    const CIRC=['①','②','③','④','⑤'];
    const opts=q.options||[];
    const rawSrc=q.type==='grammar'?q.passage.grammar_items:q.passage.vocab_items;
    const allS=q.passage.sentences;
    const wIdx=(str,w)=>{
      if(!w)return -1;
      let st=0;
      while(st<=str.length-w.length){
        const i=str.indexOf(w,st);
        if(i<0)break;
        const b=i>0?str[i-1]:' ',a2=i+w.length<str.length?str[i+w.length]:' ';
        if(/[^a-zA-Z0-9']/.test(b)&&/[^a-zA-Z0-9']/.test(a2))return i;
        st=i+1;
      }
      return -1;
    };
    const ranked=(rawSrc||[]).map((si2,i)=>{
      const w=(si2.word||'').trim();
      const orig=(si2.original||'').trim();
      const searchW=orig||w; // original 우선으로 본문에서 위치 탐색
      const cl=Number(si2.sent);
      const ct=typeof allS[cl]==='string'?allS[cl]:(allS[cl]?.text||'');
      let fs=cl;
      if(searchW&&!ct.includes(searchW)){
        const ri=allS.findIndex(r=>{const t=typeof r==='string'?r:(r?.text||'');return t.includes(searchW);});
        if(ri>=0)fs=ri;
      }
      return{src:{...si2,sent:fs},opt:opts[i]};
    }).sort((a,b)=>a.src.sent-b.src.sent);
    const sMap={};
    ranked.forEach((r,rank)=>{
      const k=r.src.sent;
      if(!sMap[k])sMap[k]=[];
      sMap[k].push({...r,rank});
    });
    return(<div style={{fontSize:15,lineHeight:2,color:'#334155'}}>
      {allS.map((raw,si)=>{
        const s=typeof raw==='string'?raw:(raw?.text||'');
        const list=sMap[si];
        if(!list||!list.length)return <span key={si}>{s} </span>;
        const positioned=list.map(r=>{
          const word=r.opt?r.opt.text||'':'';
          const original=r.src.original||'';
          const sw=original||word;
          const i2=r.src.pos!=null?r.src.pos:wIdx(s,sw);
          const len=r.src.pos!=null?(original||word).length:sw.length;
          return{...r,word,sw,i2,len};
        });
        const found=positioned.filter(r=>r.i2>=0).sort((a,b)=>a.i2-b.i2);
        const notFound=positioned.filter(r=>r.i2<0);
        const parts=[];
        let cur=0;
        found.forEach(r=>{
          if(r.i2>cur)parts.push(<span key={'t'+r.i2}>{s.slice(cur,r.i2)}</span>);
          const isAns=showAnswer&&r.opt&&r.opt.correct===false;
          const ul='2px solid '+(isAns?'#ef4444':'#334155');
          const uc=isAns?'#ef4444':'#1e293b';
          parts.push(<span key={'u'+r.i2} style={{borderBottom:ul,fontWeight:700,color:uc,padding:'0 1px'}}>{CIRC[r.rank]||r.rank+1} {r.word}</span>);
          cur=r.i2+r.len;
        });
        if(cur<s.length)parts.push(<span key='tail'>{s.slice(cur)}</span>);
        // notFound: 위치 못 찾은 경우 문장 끝에 붙임 (앞에 중복 표시 방지)
        const suffix=notFound.map(r=>{
          const isAns=showAnswer&&r.opt&&r.opt.correct===false;
          const ul='2px solid '+(isAns?'#ef4444':'#334155');
          const uc=isAns?'#ef4444':'#1e293b';
          return <span key={'nf'+r.rank} style={{borderBottom:ul,fontWeight:700,color:uc,padding:'0 2px',marginLeft:4}}>{CIRC[r.rank]||r.rank+1} {r.word}</span>;
        });
        return <span key={si}>{parts}{suffix}{' '}</span>;
      })}
    </div>);
  }

  return(<div style={{fontSize:15,lineHeight:2,color:'#334155'}}>
    {q.passage.sentences.map((s,i)=><span key={i}>{s} </span>)}
  </div>);
}

/* ── 선택지 ── */
function OptsView({q,selected,setSelected,sA,setSA,sB,setSB,showAnswer}){
  const L=['①','②','③','④','⑤'];

  if(q.type==='insert')return <p style={{fontSize:'clamp(12px,2vw,13px)',color:S.c.goldDk,fontWeight:600,lineHeight:1.6}}>위 지문에서 ①~⑤ 중 주어진 문장이 들어갈 위치를 클릭하세요.</p>;
  if(q.type==='irrelevant')return <p style={{fontSize:'clamp(12px,2vw,13px)',color:S.c.goldDk,fontWeight:600,lineHeight:1.6}}>위 지문에서 전체 흐름과 관계 없는 문장의 번호를 클릭하세요.</p>;

  if(q.type==='summary'){
    return(<table style={{width:'100%',borderCollapse:'collapse',fontSize:'clamp(13px,2.1vw,15px)'}}>
      <thead><tr>
        <th style={{padding:'7px 3px',textAlign:'center',color:S.c.sub,borderBottom:`2px solid ${S.c.track}`,width:'8%'}}></th>
        <th style={{padding:'7px',textAlign:'left',color:S.c.wine,fontWeight:800,borderBottom:`2px solid ${S.c.track}`}}>(A)</th>
        <th style={{padding:'7px',textAlign:'left',color:S.c.gold,fontWeight:800,borderBottom:`2px solid ${S.c.track}`}}>(B)</th>
      </tr></thead>
      <tbody>{q.aOpts.map((aO,i)=>{
        const bO=q.bOpts[i];if(!bO)return null;
        const aC=showAnswer&&aO.correct, bC=showAnswer&&bO.correct;
        const aW=showAnswer&&sA===i&&!aO.correct, bW=showAnswer&&sB===i&&!bO.correct;
        return <tr key={i} onClick={()=>{if(setSA){setSA(i);setSB(i);}}} style={{cursor:setSA?'pointer':'default'}}>
          <td style={{padding:'10px 3px',textAlign:'center',fontWeight:800,color:S.c.sub,borderBottom:'1px solid #f1ece0'}}>{L[i]}</td>
          <td style={{padding:'10px 7px',borderBottom:'1px solid #f1ece0',background:aC?S.c.okBg:aW?S.c.ngBg:(sA===i?'#FBF3DE':''),fontWeight:aC||sA===i?700:400,color:aC?S.c.ok:aW?S.c.ng:S.c.ink}}>{aO.text}</td>
          <td style={{padding:'10px 7px',borderBottom:'1px solid #f1ece0',background:bC?S.c.okBg:bW?S.c.ngBg:(sB===i?'#FBF3DE':''),fontWeight:bC||sB===i?700:400,color:bC?S.c.ok:bW?S.c.ng:S.c.ink}}>{bO.text}</td>
        </tr>;
      })}</tbody>
    </table>);
  }

  if(!q.options)return null;
  return(<div style={{display:'flex',flexDirection:'column',gap:8}}>
    {q.options.map((o,i)=>{
      let bg=S.c.creamCard,bd=`1.5px solid ${S.c.line}`,cl=S.c.ink;
      if(showAnswer&&o.correct){bg=S.c.okBg;bd='2px solid #4FA968';cl=S.c.ok;}
      else if(showAnswer&&selected===i&&!o.correct){bg=S.c.ngBg;bd='2px solid #D77068';cl=S.c.ng;}
      else if(selected===i){bg='#FBF3DE';bd=`2px solid ${S.c.gold}`;cl=S.c.wine;}
      const badge=showAnswer&&o.correct?'#4FA968':showAnswer&&selected===i&&!o.correct?'#D77068':selected===i?S.c.gold:'#f0e6cf';
      const badgeTx=(showAnswer&&o.correct)||(showAnswer&&selected===i&&!o.correct)||selected===i?'#fff':S.c.goldDk;
      return <button key={i} onClick={()=>setSelected&&setSelected(i)} style={{
        display:'flex',alignItems:'center',gap:11,padding:'clamp(11px,2.4vw,14px) clamp(12px,2.5vw,15px)',
        borderRadius:12,border:bd,background:bg,color:cl,fontSize:'clamp(14px,2.2vw,15.5px)',
        cursor:setSelected?'pointer':'default',textAlign:'left',lineHeight:1.55,transition:'all .12s',width:'100%'
      }}>
        <span style={{flexShrink:0,width:24,height:24,borderRadius:'50%',background:badge,color:badgeTx,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:800,fontSize:13}}>{L[i]}</span>
        <span style={{flex:1}}>{o.text}</span>
      </button>;
    })}
  </div>);
}

/* ── 인쇄 화면 ── */
function PrintView({questions,mode,goBack}){
  const TN={topic:'주제 찾기',order:'순서 배열',blank:'빈칸 추론',insert:'문장 삽입',summary:'요약문',implication:'함축적 의미',irrelevant:'무관한 문장'};
  const M=['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩','⑪','⑫'];

  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

  const buildHTML=()=>{
    let h=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>대단한영어 내신시험 출제예상문제</title><style>@page{size:A4;margin:12mm 10mm}*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Batang',serif;font-size:9pt;line-height:1.65;color:#111}h1{text-align:center;font-size:14pt;border-bottom:2pt solid #000;padding-bottom:6px;margin-bottom:14px}.wrap{column-count:2;column-gap:16px;column-rule:1px solid #bbb}.q{break-inside:avoid;margin-bottom:14px;padding-bottom:10px;border-bottom:1px dashed #ccc}.qn{font-weight:bold;font-size:9.5pt;margin:2px 0 4px}.src{font-size:7pt;color:#999}.p{background:#f5f5f5;padding:5px 7px;border:1px solid #ddd;margin:3px 0;font-size:8.5pt;line-height:1.65}.gv{background:#eee;padding:5px 7px;border:1px solid #ccc;margin:3px 0;font-size:8.5pt}.op{margin:3px 0;font-size:8.5pt;line-height:1.5}.op div{margin:1px 0}table{border-collapse:collapse;width:100%;margin:3px 0;font-size:8.5pt}th,td{border:1px solid #000;padding:2px 5px}</style></head><body><h1>대단한영어 ${mode==='q'?'내신시험 출제예상문제':'정답지'}</h1>`;
    if(mode==='q'){
      h+='<div class="wrap">';
      questions.forEach((q,i)=>{
        h+=`<div class="q"><div class="src">${q.passage.id}</div><div class="qn">${i+1}. [${TN[q.type]}] ${esc(q.instruction)}</div>`;
        if(q.type==='order'){
          h+=`<div class="gv"><b>주어진 글:</b> ${esc(q.given)}</div>`;
          q.blocks.forEach(b=>h+=`<div class="p"><b>(${b.label})</b> ${esc(b.text)}</div>`);
          h+='<div class="op">';q.options.forEach((o,j)=>h+=`<div>${M[j]} ${esc(o.text)}</div>`);h+='</div>';
        }else if(q.type==='insert'){
          h+=`<div class="gv"><b>주어진 문장:</b> ${esc(q.removed)}</div><div class="p">`;
          const mIdxs1=q.markerIdxs||[];
          q.remaining.forEach((s,j)=>{const mNum=mIdxs1.indexOf(j);if(mNum>=0)h+=`<b> ( ${M[mNum]} ) </b>`;h+=esc(s)+' ';});
          h+='</div>';
        }else if(q.type==='blank'){
          h+='<div class="p">';q.passage.sentences.forEach((s,j)=>h+=(j===q.blankIdx?esc(q.blanked).replace('_____','<span style="display:inline-block;width:80px;border-bottom:1.5px solid #000;vertical-align:bottom;"></span>'):esc(s))+' ');
          h+='</div><div class="op">';q.options.forEach((o,j)=>h+=`<div>${M[j]} ${esc(o.text)}</div>`);h+='</div>';
        }else if(q.type==='irrelevant'){
          h+='<div class="p">';const nm1={};q.numberedIdxs.forEach((fi,ci)=>{nm1[fi]=ci+1;});q.full.forEach((s,i)=>{if(nm1[i]&&i>0)h+=`<b> ( ${M[nm1[i]-1]} ) </b>${esc(s)} `;else h+=esc(s)+' ';});h+='</div>';
        }else if(q.type==='summary'){
          h+='<div class="p">';q.passage.sentences.forEach(s=>h+=esc(s)+' ');h+='</div>';
          const sumTpl=q.passage.summary_template||q.abstract;
          const sumDisp=sumTpl.replace('________(A)________','<span style="display:inline-block;width:70px;border-bottom:1.5px solid #000;vertical-align:bottom;"></span>').replace('________(B)________','<span style="display:inline-block;width:70px;border-bottom:1.5px solid #000;vertical-align:bottom;"></span>');
          h+=`<div class="gv"><b>요약문:</b> ${sumDisp}</div>`;
          h+='<table><tr><th></th><th>(A)</th><th>(B)</th></tr>';
          q.aOpts.forEach((a,j)=>{const b=q.bOpts[j];if(b)h+=`<tr><td style="text-align:center">${M[j]}</td><td>${esc(a.text)}</td><td>${esc(b.text)}</td></tr>`;});h+='</table>';
        }else if(q.type==='implication'){
          h+='<div class="p">';q.passage.sentences.forEach((s,j)=>{h+=(j===q.targetIdx?`<u>${esc(s)}</u>`:esc(s))+' ';});
          h+='</div><div class="op">';q.options.forEach((o,j)=>h+=`<div>${M[j]} ${esc(o.text)}</div>`);h+='</div>';
        }else{
          h+='<div class="p">';q.passage.sentences.forEach(s=>h+=esc(s)+' ');
          h+='</div><div class="op">';if(q.options)q.options.forEach((o,j)=>h+=`<div>${M[j]} ${esc(o.text)}</div>`);h+='</div>';
        }
        h+='</div>';
      });
      h+='</div>';
    }else{
      h+='<table><tr><th>번호</th><th>유형</th><th>출처</th><th>정답</th><th>해설</th></tr>';
      questions.forEach((q,i)=>{
        let ans='';
        if(q.type==='insert'){const mIdxsA=q.markerIdxs||[];const mNumA=mIdxsA.indexOf(q.correctPos);ans=mNumA>=0?M[mNumA]:M[q.correctPos];}
        else if(q.type==='irrelevant')ans=M[q.correctNum-1];
        else if(q.type==='summary'){const ai=q.aOpts.findIndex(o=>o.correct);ans=M[ai];}
        else if(q.options)ans=M[q.options.findIndex(o=>o.correct)];
        h+=`<tr><td style="text-align:center">${i+1}</td><td>${TN[q.type]}</td><td style="font-size:7.5pt">${q.passage.id}</td><td style="font-weight:bold;text-align:center">${ans}</td><td style="font-size:8pt">${esc(q.passage.title)}</td></tr>`;
      });
      h+='</table>';
    }
    h+='</body></html>';
    return h;
  };

  const openPrint=()=>{
    const html=buildHTML();
    const w=window.open('','_blank');
    if(w){w.document.write(html);w.document.close();setTimeout(()=>w.print(),400);}
  };

  return(
    <div style={{minHeight:'100vh',background:'#f5f7fa',fontFamily:"'Pretendard',sans-serif"}}>
      <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet"/>
      <div style={{maxWidth:600,margin:'0 auto',padding:'40px 16px',textAlign:'center'}}>
        <div style={{fontSize:48,marginBottom:12}}>{mode==='q'?'📄':'📋'}</div>
        <h2 style={{fontSize:20,fontWeight:700,color:'#1e293b',marginBottom:6}}>
          {APP_NAME} {mode==='q'?'문제지':'정답지'} 인쇄
        </h2>
        <p style={{fontSize:13,color:'#64748b',marginBottom:24}}>A4 2단 레이아웃 · {questions.length}문제</p>

        <button onClick={openPrint} style={{padding:'14px 32px',borderRadius:14,border:'none',background:'linear-gradient(135deg,#4f7df7,#3b5fe0)',color:'#fff',fontSize:15,fontWeight:700,cursor:'pointer',boxShadow:'0 4px 14px rgba(79,125,247,0.3)',marginBottom:16}}>
          🖨️ 인쇄하기
        </button>
        <br/>
        <button onClick={goBack} style={{padding:'10px 20px',borderRadius:10,border:'1px solid #e2e8f0',background:'#fff',fontSize:13,cursor:'pointer',color:'#64748b',marginTop:8}}>← 돌아가기</button>

        <div style={{marginTop:24,background:'#fff',borderRadius:14,padding:16,boxShadow:'0 1px 5px rgba(0,0,0,0.06)',textAlign:'left'}}>
          <h3 style={{fontSize:13,fontWeight:700,color:'#1e293b',marginBottom:10}}>미리보기</h3>
          <div style={{columns:2,columnGap:12,columnRule:'1px solid #e2e8f0'}}>
            {questions.map((q,i)=>(
              <div key={i} style={{breakInside:'avoid',marginBottom:8,padding:7,background:'#f8fafc',borderRadius:6,border:'1px solid #e2e8f0',fontSize:10.5}}>
                <div style={{fontWeight:700,color:'#1e293b'}}>{i+1}. [{TN[q.type]}]</div>
                <div style={{color:'#94a3b8',fontSize:9}}>{q.passage.id}</div>
                <div style={{color:'#475569',marginTop:2}}>{q.passage.title}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

const OUTPUT_FOOTER_TEXT='탁월함이 습관이 되도록';
const OUTPUT_BRAND='대단한영어';
function SV_chapterLabel(ch){
  if(ch==null||ch==='')return'';
  const t=String(ch).trim();
  const n=parseInt(t);
  return (Number.isInteger(n)&&String(n)===t)?n+'강':t;
}
function outputTitle(meta){
  const b=getAllBooks().find(x=>x.id===meta.source);
  const label=(b&&b.label)||meta.source||'';
  const n=parseInt(meta.number)||meta.number||'';
  if((meta.source||'').startsWith('MOGO_'))return label+' '+n+'번';
  const cl=SV_chapterLabel(meta.chapter);
  return label+(cl?' '+cl:'')+' '+n+'번';
}

function buildDOCXChildren(slot,mode,opts){
const {Document,Packer,Paragraph,TextRun,Table,TableRow,TableCell,
    AlignmentType,BorderStyle,WidthType,ShadingType,VerticalAlign,TabStopType}=docx;
  const IS=mode==='student';
  // 학생용 옵션 (교사용은 항상 전체 표시)
  const O=IS?(opts||getStuOpts()):{passage:true,structure:true,keyTopics:true,sentences:true,hardOnly:false,showAnswers:true};
  // 학생용 + showAnswers=true → 교사용처럼 chunks/해석 다 표시. 빈칸 모드면 끊어읽기 숨김
  const SHOW_ANSWERS=!IS||O.showAnswers;
  const {analysis,meta}=slot;
  if(!analysis)return;
  const {sentences=[],flow={},grammar={}}=analysis;
  const {blocks=[],interBlockConnectors=[],keyword='',topicSummary='',structureType=''}=flow;
  const {difficultSentences=[]}=grammar;
  const sm=Object.fromEntries(sentences.map(s=>[s.num,s]));
  const conn=i=>interBlockConnectors[i]||'→';
  const id=makePassageId(meta.source,meta.chapter,meta.number);
  const F='Malgun Gothic',P9=18,P8=16,P10=20;
  const nb={style:BorderStyle.NONE,size:0,color:'FFFFFF'};
  const bd=(c='888888',sz=3)=>({style:BorderStyle.SINGLE,size:sz,color:c});
  const nobs={top:nb,bottom:nb,left:nb,right:nb};
  // 블록 컬러맵 (hex # 제거)
  const BDC={
    blue:{hd:'B5D4F4',bd:'185FA5',tx:'0C447C',row:'E6F1FB'},
    coral:{hd:'F5C4B3',bd:'D85A30',tx:'712B13',row:'FAECE7'},
    teal:{hd:'9FE1CB',bd:'1D9E75',tx:'085041',row:'E1F5EE'},
    purple:{hd:'CECBF6',bd:'534AB7',tx:'3C3489',row:'EEEDFE'},
    green:{hd:'C0DD97',bd:'639922',tx:'173404',row:'EAF3DE'},
    amber:{hd:'FAC775',bd:'BA7517',tx:'633806',row:'FAEEDA'},
    gray:{hd:'E4E3DF',bd:'5F5E5A',tx:'2C2C2A',row:'F1EFE8'},
  };
  const bdc=c=>BDC[c]||BDC.gray;
  const CM={top:60,bottom:60,left:100,right:100};
  const cell=(children,opts={})=>new TableCell({
    borders:opts.borders||{top:bd(opts.bc||'AAAAAA'),bottom:bd(opts.bc||'AAAAAA'),
      left:bd(opts.bc||'AAAAAA'),right:bd(opts.bc||'AAAAAA')},
    shading:opts.bg?{fill:opts.bg,type:ShadingType.CLEAR}:undefined,
    width:opts.w?{size:opts.w,type:WidthType.DXA}:undefined,
    verticalAlign:VerticalAlign.CENTER,margins:opts.m||CM,children,
  });
  const para=(text,opts={})=>new Paragraph({
    alignment:opts.a||AlignmentType.LEFT,
    spacing:{before:opts.sb||0,after:opts.sa||40},
    border:opts.border,indent:opts.indent,
    children:Array.isArray(text)?text:[new TextRun({
      text:String(text||''),bold:opts.bold||false,size:opts.size||P9,
      color:opts.color||'1a1a1a',font:F,italics:opts.italic||false})],
  });
  const run=(text,opts={})=>new TextRun({
    text:String(text||''),bold:opts.bold||false,size:opts.size||P9,
    color:opts.color||'1a1a1a',font:F,italics:opts.italic||false});
  const blank=()=>new Paragraph({spacing:{after:80,before:0},
    border:{bottom:{style:BorderStyle.SINGLE,size:3,color:'888888',space:1}},
    children:[run(' ',{size:P9})]});
const ch=[];

  /* 헤더: 좌측 교재명·강·번호 / 우측 브랜드 */
  const now=new Date();
  const ts=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  ch.push(new Paragraph({spacing:{before:0,after:80},
    tabStops:[{type:TabStopType.RIGHT,position:10500}],
    border:{bottom:{style:BorderStyle.SINGLE,size:10,color:'1a1a1a',space:3}},
    children:[
      run(outputTitle(meta),{bold:true,size:P10}),
      run('  '+(SHOW_ANSWERS?'[교사용]':'[학생용]')+'  '+ts,{size:P8,color:'999999'}),
      run('\t'+OUTPUT_BRAND,{bold:true,size:P9,color:'185FA5'}),
    ]}));

  /* 지문 */
  if(O.passage){
  ch.push(para('■ 지문',{bold:true,size:P8,color:'185FA5',sa:20}));
  const pRuns=[];
  sentences.forEach(s=>{
    pRuns.push(run(nStr(s.num)+' ',{bold:true,size:P9}));
    pRuns.push(run(s.text+' ',{size:P9}));
  });
  ch.push(new Paragraph({spacing:{before:0,after:120},
    border:{left:{style:BorderStyle.SINGLE,size:14,color:'185FA5',space:6}},
    indent:{left:160},children:pRuns}));
  }

  /* Block Diagram */
  if(O.structure){
  ch.push(para('■ 글의 구조',{bold:true,size:P8,color:'185FA5',sb:20,sa:20}));
  const nc=blocks.length-1;
  const bw=Math.floor((9200-nc*440)/blocks.length);
  const colW=[];blocks.forEach((_,bi)=>{colW.push(bw);if(bi<blocks.length-1)colW.push(440);});
  const hCells=blocks.map((blk,bi)=>{
    const _bc=bdc(blk.color);
    const hd=IS?[blank()]:[para(blk.name,{bold:true,size:P9,color:_bc.tx,sa:20}),para(blk.nameEn,{size:P8,italic:true,color:_bc.tx,sa:0})];
    const c=cell(hd,{bg:_bc.hd,bc:_bc.bd,w:bw});
    if(bi<blocks.length-1)return[c,cell([para(conn(bi),{bold:true,size:P10,color:'444444',a:AlignmentType.CENTER,sa:0})],{borders:nobs,w:440})];
    return[c];
  }).flat();
  const maxS=Math.max(...blocks.map(b=>(b.sentenceNums||[]).length));
  const bRows=Array.from({length:maxS},(_,ri)=>{
    const rCells=blocks.map((blk,bi)=>{
      const sn=(blk.sentenceNums||[])[ri];
      const sent=sn?sm[sn]:null;
      const _bdc=bdc(blk.color);
      const c=cell(sent?[para([run(nStr(sent.num)+' ',{bold:true,size:P9,color:_bdc.tx}),
        run('('+sent.symbol+')  ',{size:P8,color:_bdc.bd}),run(sent.role,{size:P8,color:_bdc.tx})],{sa:0})]:[para('',{sa:0})],
        {bc:_bdc.bd,bg:_bdc.row,w:bw});
      if(bi<blocks.length-1)return[c,cell([para('',{sa:0})],{borders:nobs,w:440})];
      return[c];
    }).flat();
    return new TableRow({children:rCells});
  });
  ch.push(new Table({width:{size:9200,type:WidthType.DXA},columnWidths:colW,
    rows:[new TableRow({children:hCells}),...bRows]}));
  }

  /* 핵심소재/주제요약/구조 — 가로 1행 표 (지면 절약) */
  if(O.keyTopics){
    const ktItems=[
      {lbl:'핵심 소재',val:keyword,w:2400},
      {lbl:'주제 요약',val:topicSummary,w:4400},
      {lbl:'구조 유형',val:structureType,w:2400},
    ];
    const ktCells=ktItems.map(it=>cell([new Paragraph({spacing:{before:0,after:0},children:[
      run(it.lbl,{bold:true,size:P8,color:'185FA5'})
    ]}),new Paragraph({spacing:{before:20,after:0},children:[
      IS?run('________________',{size:P8}):run(it.val,{size:P8})
    ]})],{bc:'CCCCCC',w:it.w,m:{top:60,bottom:60,left:120,right:120}}));
    ch.push(new Table({width:{size:9200,type:WidthType.DXA},
      columnWidths:ktItems.map(i=>i.w),
      rows:[new TableRow({children:ktCells})]}));
  }

  /* 문장별 분석 */
  if(O.sentences){
  // hardOnly: 어려운 문장만 / hardOnly=false: 전체 문장
  const dsToShow=O.hardOnly?sentences.filter(s=>difficultSentences.find(d=>d.num===s.num)):sentences;
  if(dsToShow.length){
    ch.push(para(IS?'■ 구문 분석':'■ 문장별 분석 (끊어읽기 + 구문)',{bold:true,size:P8,color:'185FA5',sb:20,sa:20}));
    dsToShow.forEach(s=>{
      const ds=difficultSentences.find(d=>d.num===s.num);
      const chunks=s.chunks||[];
      const hasChunks=SHOW_ANSWERS&&chunks.length;
      // 방안2: 번호·하단 테두리=소속 블록 색, (기호)=기호 색
      const _blk=blocks.find(b=>Array.isArray(b.sentenceNums)&&b.sentenceNums.includes(s.num));
      const _bc=bdc(_blk&&_blk.color);
      const _symc=((SM[s.symbol]&&SM[s.symbol].bd)||'#888888').replace('#','');
      // chunks 있으면: 번호+심볼+끊어읽기 영문을 한 줄에 / chunks 없으면: 원본 문장 표시
      if(hasChunks){
        ch.push(new Paragraph({spacing:{before:0,after:0},
          border:{bottom:{style:BorderStyle.SINGLE,size:3,color:_bc.bd,space:1}},
          children:[run(nStr(s.num),{bold:true,size:P9,color:_bc.tx}),
            run(' ('+s.symbol+')  ',{bold:true,size:P9,color:_symc}),
            run(chunks.map(c=>c.en||'').join(' / '),{size:P8,italic:true})]}));
        ch.push(new Paragraph({spacing:{before:0,after:0},indent:{left:200},
          children:[run(chunks.map(c=>c.ko||'').join(' / '),{size:P8,color:'444444'})]}));
      }else{
        ch.push(new Paragraph({spacing:{before:0,after:0},
          border:{bottom:{style:BorderStyle.SINGLE,size:3,color:_bc.bd,space:1}},
          children:[run(nStr(s.num),{bold:true,size:P9,color:_bc.tx}),
            run(' ('+s.symbol+')  ',{bold:true,size:P9,color:_symc}),
            run(s.text,{size:P8,italic:true,color:'333333'})]}));
      }
      if(ds){
        [{l:'구조',f:'structure'},{l:'해석',f:'translation'},{l:'포인트',f:'point'}].forEach(r=>{
          ch.push(new Paragraph({spacing:{before:0,after:0},indent:{left:200},children:[
            run('['+r.l+'] ',{bold:true,size:P8,color:'555555'}),
            (IS&&!SHOW_ANSWERS&&r.f==='translation')?run('______________________________',{size:P8}):run(ds[r.f]||'',{size:P8}),
          ]}));
        });
      }else if(IS&&!SHOW_ANSWERS){
        // 학생용 빈칸 모드: 해설 없는 문장도 해석 빈칸은 표시
        ch.push(new Paragraph({spacing:{before:0,after:0},indent:{left:200},children:[
          run('[해석] ',{bold:true,size:P8,color:'555555'}),
          run('______________________________',{size:P8}),
        ]}));
      }
    });
  }
  }
  return ch;
}

/* ── 자료 보기 전용: 선택 지문들을 한 DOCX로 묶어 다운로드 ──
   ⚠ 검증결과 반영: analysis 없는 슬롯은 사전 필터링(없으면 Document 깨짐) */
function buildStudyDOCX(passages,mode,optsIn){
  if(typeof docx==='undefined'||typeof saveAs==='undefined'){
    alert('DOCX 라이브러리를 불러오지 못했습니다. 네트워크 확인 후 다시 시도해주세요.');return;
  }
  const {Document,Packer}=docx;
  const IS=mode==='student';
  // 영역 옵션: 호출 시 전달받으면 그대로, 없으면 모드별 기본값
  const opts=optsIn||(IS
    ?{passage:true,structure:true,keyTopics:true,sentences:true,hardOnly:false,showAnswers:false}
    :{passage:true,structure:true,keyTopics:true,sentences:true,hardOnly:false,showAnswers:true});
  // 슬롯 변환 + analysis 유효성 필터 (sentences 없는 지문 제외)
  const slots=passages.map(toStudySlot).filter(s=>{
    const a=s&&s.analysis;
    return a&&Array.isArray(a.sentences)&&a.sentences.length>0;
  });
  if(!slots.length){alert('분석 데이터가 있는 지문이 없습니다.\n(DOCX는 문장 분석이 완료된 지문만 출력됩니다.)');return;}
  const ftr=new docx.Footer({children:[new docx.Paragraph({alignment:docx.AlignmentType.CENTER,
    children:[new docx.TextRun({text:OUTPUT_FOOTER_TEXT,font:'Malgun Gothic',size:14,color:'999999',italics:true})]})]});
  const sections=slots.map(slot=>{
    const ch=buildDOCXChildren(slot,mode,opts);
    return{properties:{page:{size:{width:11906,height:16838},margin:{top:700,right:700,bottom:700,left:700}}},
      footers:{default:ftr},children:ch};
  }).filter(s=>Array.isArray(s.children)&&s.children.length>0);
  if(!sections.length){alert('출력할 내용이 없습니다.');return;}
  const doc=new Document({styles:{default:{document:{run:{font:'Malgun Gothic',size:18}}}},sections});
  const label=opts.showAnswers?'교사용':'학생용';
  const fname=(slots.length===1
    ? makePassageId(slots[0].meta.source,slots[0].meta.chapter,slots[0].meta.number)
    : '자료_'+slots.length+'개')+'_'+label+'.docx';
  Packer.toBlob(doc).then(blob=>saveAs(blob,fname))
    .catch(e=>alert('DOCX 생성 실패: '+e.message));
}

/* ══════════════════════════════════════════════════════════════
   🖨 자료 보기 인쇄(HTML) — teacher.html buildHTML 로직 이식
   - 영역 옵션(passage/structure/keyTopics/sentences/hardOnly/showAnswers) 반영
   - DOCX와 동일한 옵션 체계를 공유
   - sentBlockColor는 자체 BCF 내장(전역 BC와 무관하게 안전)
   ══════════════════════════════════════════════════════════════ */
const SV_BCF={
  blue:{bd:'#185FA5',bg:'#E6F1FB',tx:'#0C447C'},coral:{bd:'#D85A30',bg:'#FAECE7',tx:'#712B13'},
  teal:{bd:'#1D9E75',bg:'#E1F5EE',tx:'#085041'},purple:{bd:'#534AB7',bg:'#EEEDFE',tx:'#3C3489'},
  green:{bd:'#639922',bg:'#EAF3DE',tx:'#173404'},amber:{bd:'#BA7517',bg:'#FAEEDA',tx:'#633806'},
  gray:{bd:'#5F5E5A',bg:'#F1EFE8',tx:'#2C2C2A'}};
const sentBlockColor=(blocks,num)=>{
  const blk=(blocks||[]).find(b=>Array.isArray(b.sentenceNums)&&b.sentenceNums.includes(num));
  return SV_BCF[blk&&blk.color]||SV_BCF.gray;
};
function openPrintWindow(html){
  const win=window.open('','_blank');
  if(!win){alert('팝업이 차단되었습니다. 팝업을 허용해주세요.');return;}
  win.document.write(html);win.document.close();
}
function buildHTML(slot,mode,opts){
  const IS=mode==='student';
  const O=IS?(opts||getStuOpts()):{passage:true,structure:true,keyTopics:true,sentences:true,hardOnly:false,showAnswers:true};
  const SHOW_ANSWERS=!IS||O.showAnswers;
  const {analysis,meta}=slot;
  if(!analysis)return'';
  const {sentences=[],flow={},grammar={}}=analysis;
  const {blocks=[],interBlockConnectors=[],keyword='',topicSummary='',structureType=''}=flow;
  const {difficultSentences=[]}=grammar;
  const sm=Object.fromEntries(sentences.map(s=>[s.num,s]));
  const conn=i=>interBlockConnectors[i]||'→';
  const id=makePassageId(meta.source,meta.chapter,meta.number);
  const esc=w=>w.replace(/[-.*+?^${}()|[\]\\]/g,'\\$&');
  const hlHTML=(text,words)=>{
    if(!words||!words.length)return text;
    const sorted=[...words].sort((a,b)=>b.length-a.length);
    const pat=new RegExp('('+sorted.map(esc).join('|')+')','gi');
    return text.replace(pat,m=>'<mark style="background:#FFD700;color:inherit;border-radius:2px;padding:0 2px;font-weight:700">'+m+'</mark>');
  };
  const passHTML=sentences.map(s=>{
    const sc=SM[s.symbol]||{};
    return'<span><span style="font-size:12px;font-weight:700;color:'+sc.tx+';margin-right:4px">'+nStr(s.num)+'</span>'+s.text+' </span>';
  }).join('');
  const blockCards=blocks.map((blk,bi)=>{
    const c=BC[blk.color]||BC.blue;
    const ss=(blk.sentenceNums||[]).map(n=>sm[n]).filter(Boolean);
    const hd=IS
      ?'<div style="border-bottom:2px solid '+c.bd+';height:22px;width:85%;margin-bottom:5px"></div>'
      :'<div style="font-size:1em;font-weight:700;color:'+c.tx+'">'+blk.name+'</div><div style="font-size:.72em;color:'+c.tx+';font-style:italic;font-weight:600;opacity:.85">'+blk.nameEn+'</div>';
    const rows=ss.map((sent,si)=>{
      const sc=SM[sent.symbol]||{};
      const arr=si>0?'<div style="font-size:9px;color:#ccc;margin:1px 0 1px 20px">↓</div>':'';
      return arr+'<div style="display:flex;align-items:flex-start;gap:6px;padding:5px 7px;border-radius:6px;background:'+sc.bg+';margin-bottom:3px"><span style="font-size:1em;font-weight:700;color:'+sc.tx+';flex-shrink:0;margin-top:1px">'+nStr(sent.num)+'</span><div style="flex:1;min-width:0"><span style="font-size:.7em;font-weight:700;padding:1px 4px;border-radius:3px;background:rgba(255,255,255,.6);color:'+sc.tx+';border:1px solid '+sc.bd+'">'+sent.symbol+'</span><div style="font-size:.75em;color:#444;word-break:keep-all;line-height:1.4;margin-top:2px">'+sent.role+'</div></div></div>';
    }).join('');
    const connDiv=bi<blocks.length-1?'<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex-shrink:0;padding-top:50px;min-width:32px"><div style="font-size:1.2em;font-weight:700;color:#666">'+conn(bi)+'</div><div style="font-size:.6em;color:#bbb;text-align:center">'+(SM[conn(bi)]&&SM[conn(bi)].lbl||'')+'</div></div>':'';
    return'<div style="flex:1 1 130px;min-width:0;border-radius:10px;border:2px solid '+c.bd+'"><div style="padding:8px 11px;background:'+c.hd+';border-bottom:1.5px solid '+c.bd+';border-radius:8px 8px 0 0">'+hd+'</div><div style="padding:7px;background:#fff">'+rows+'</div></div>'+connDiv;
  }).join('');
  // hardOnly: 어려운 문장만 / hardOnly=false: 전체 문장
  const dsToShow=O.hardOnly?sentences.filter(s=>difficultSentences.find(d=>d.num===s.num)):sentences;
  const analysisHTML=dsToShow.map(s=>{
    const sc=SM[s.symbol]||{};
    const bc=sentBlockColor(blocks,s.num);
    const ds=difficultSentences.find(d=>d.num===s.num);
    const chunks=s.chunks||[];
    const symBadge='<span style="font-size:.7em;font-weight:700;padding:1px 5px;border-radius:3px;background:rgba(255,255,255,.6);color:'+(sc.tx||'#555')+';border:1px solid '+(sc.bd||'#999')+'">'+s.symbol+'</span>';
    const chunksDiv=SHOW_ANSWERS&&chunks.length?'<div style="padding:7px 12px;background:#fff;border-top:1px dashed #eee"><div style="font-size:.85em;font-style:italic;color:#222;line-height:1.9;word-break:keep-all">'+chunks.map(c=>c.en||'').join(' / ')+'</div><div style="font-size:.85em;color:#555;line-height:1.9;word-break:keep-all;border-top:1px dashed #e8e8e8;margin-top:3px;padding-top:3px">'+chunks.map(c=>c.ko||'').join(' / ')+'</div></div>':'';
    const diffDiv=ds?'<div style="padding:7px 12px;background:#FBFBFD;border-top:1px dashed #eee">'+[{l:'구조',f:'structure'},{l:'해석',f:'translation'},{l:'포인트',f:'point'}].map(r=>'<div style="display:flex;gap:8px;padding:3px 0;border-bottom:1px dashed #E8E8ED;align-items:flex-start"><span style="font-size:.7em;font-weight:700;color:#888;flex-shrink:0;width:32px;padding-top:1px">'+r.l+'</span>'+((IS&&!SHOW_ANSWERS&&r.f==='translation')?'<div style="flex:1;border-bottom:1px solid #bbb;height:20px"></div>':'<div style="font-size:.88em;color:#333;word-break:keep-all;flex:1">'+(ds[r.f]||'')+'</div>')+'</div>').join('')+'</div>':(IS&&!SHOW_ANSWERS?'<div style="padding:7px 12px;background:#FBFBFD;border-top:1px dashed #eee"><div style="display:flex;gap:8px;padding:3px 0;align-items:flex-start"><span style="font-size:.7em;font-weight:700;color:#888;flex-shrink:0;width:32px;padding-top:1px">해석</span><div style="flex:1;border-bottom:1px solid #bbb;height:20px"></div></div></div>':'');
    if(!chunksDiv&&!diffDiv)return IS&&!SHOW_ANSWERS?'<div style="margin-bottom:6px;border:0.5px solid '+bc.bd+';border-radius:8px;overflow:hidden"><div style="padding:6px 12px;background:'+bc.bg+';display:flex;align-items:center;gap:7px"><span style="font-size:1em;font-weight:700;color:'+bc.tx+'">'+nStr(s.num)+'</span>'+symBadge+'<span style="font-size:.85em;color:'+bc.tx+';font-style:italic;word-break:keep-all">'+s.text+'</span></div></div>':'';
    return'<div style="margin-bottom:6px;border:0.5px solid '+bc.bd+';border-radius:8px;overflow:hidden"><div style="padding:6px 12px;background:'+bc.bg+';display:flex;align-items:center;gap:7px"><span style="font-size:1em;font-weight:700;color:'+bc.tx+'">'+nStr(s.num)+'</span>'+symBadge+'<span style="font-size:.85em;color:'+bc.tx+';font-style:italic;word-break:keep-all">'+s.text+'</span></div>'+chunksDiv+diffDiv+'</div>';
  }).filter(Boolean).join('');

  return'<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">'
    +'<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">'
    +'<title>'+id+' '+(IS?'학생용':'교사용')+'</title>'
    +'<style>*{box-sizing:border-box;margin:0;padding:0}'
    +'body{font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#1a1a1a;background:#fff;'
    +'font-size:14px;line-height:1.65;padding:13mm 13mm 11mm;word-break:keep-all}'
    +'@page{size:A4;margin:9mm 11mm}'
    +'@media print{.np{display:none!important}body{padding:0 0 10mm}.pfoot{position:fixed;bottom:0;left:0;right:0;border-top:none}}'
    +'@media screen and (min-width:1024px){body{font-size:16px;padding:24px 28px}}'
    +'@media screen and (min-width:1194px){body{font-size:17px;padding:28px 32px}}'
    +'</style></head><body>'
    +'<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;border-bottom:2.5px solid #1a1a1a;padding-bottom:6px">'
    +'<div style="font-size:1.1em;font-weight:700">'+outputTitle(meta)+' <span style="font-size:.62em;color:#888;font-weight:400;margin-left:6px">'+(IS?'학생용':'교사용')+'</span></div>'
    +'<div style="font-size:.95em;font-weight:800;color:#185FA5;letter-spacing:.02em">'+OUTPUT_BRAND+'</div>'
    +'</div>'
    +'<div style="display:flex;justify-content:flex-end;gap:16px;font-size:.8em;color:#666;margin-bottom:12px"><span>이름: <span style="display:inline-block;width:80px;border-bottom:1px solid #999">&nbsp;</span></span><span>날짜: <span style="display:inline-block;width:70px;border-bottom:1px solid #999">&nbsp;</span></span></div>'
    +(O.passage?'<div style="border-left:4px solid #185FA5;background:#FBFBFD;border-radius:0 8px 8px 0;padding:12px 16px;font-size:1em;line-height:2.2;margin-bottom:14px;word-break:keep-all;overflow-wrap:break-word">'+passHTML+'</div>':'')
    +'<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:14px">'+SYMS.map(s=>{const sc=SM[s]||{};return'<span style="display:flex;align-items:center;gap:4px;font-size:.72em;color:#666;padding:3px 9px;border:0.5px solid #e0e0e0;border-radius:4px"><span style="width:8px;height:8px;border-radius:2px;background:'+sc.bd+';display:inline-block"></span>('+s+') '+sc.lbl+'</span>';}).join('')+'</div>'
    +(O.structure?'<div style="font-size:.72em;font-weight:700;color:#666;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px">글의 구조 — Block Diagram</div><div style="display:flex;align-items:flex-start;gap:5px;margin-bottom:16px;flex-wrap:wrap">'+blockCards+'</div>':'')
    +(O.keyTopics?'<div style="display:grid;grid-template-columns:1fr 2fr 1.5fr;gap:8px;margin-bottom:16px">'
    +[{lbl:'핵심 소재',val:keyword},{lbl:'주제 한 줄 요약',val:topicSummary},{lbl:'구조 유형',val:structureType}].map(({lbl,val})=>
      '<div style="padding:9px 12px;background:#F0F0F2;border-radius:8px;border:0.5px solid #D2D2D7"><div style="font-size:.68em;font-weight:700;color:#888;letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px">'+lbl+'</div>'+(IS?'<div style="border-bottom:1.5px solid #aaa;height:22px"></div>':'<div style="font-size:.88em;word-break:keep-all">'+val+'</div>')+'</div>'
    ).join('')+'</div>':'')
    +(O.sentences&&analysisHTML?'<div style="border-top:1.5px solid #D2D2D7;padding-top:14px"><div style="font-size:.72em;font-weight:700;color:#666;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px">'+(IS?'구문 분석':'문장별 분석 — 끊어읽기 & 구문')+'</div>'+analysisHTML+'</div>':'')
    +'<div class="pfoot" style="text-align:center;color:#999;font-size:.72em;font-style:italic;margin-top:18px;padding:8px 0 2px;border-top:0.5px solid #eee">'+OUTPUT_FOOTER_TEXT+'</div>'
    +'<div class="np" style="margin-top:20px;text-align:center;padding-top:14px;border-top:1px solid #eee"><button onclick="window.print()" style="padding:10px 28px;font-size:14px;font-weight:500;background:#0071E3;color:#fff;border:none;border-radius:8px;cursor:pointer">🖨 인쇄 / PDF 저장</button></div>'
    +'</body></html>';
}

function buildAllHTML(slots,mode,opts){
  const IS=mode==='student';
  const activeSlots=slots.filter(s=>s.analysis&&s.status==='saved');
  if(!activeSlots.length){alert('저장완료된 슬롯이 없습니다.');return;}
  const htmlParts=activeSlots.map(slot=>buildHTML(slot,mode,opts));
  const combined='<!DOCTYPE html><html><head><meta charset="utf-8"><title>전체_'+(IS?'학생용':'교사용')+'</title>'
    +'<style>body{font-family:"Malgun Gothic",sans-serif;margin:0;padding:0;}'
    +'@media print{.no-print{display:none!important;}.np{display:none!important;}}'
    +'</style></head><body>'
    +htmlParts.map((h,i)=>{
      const body=h.replace(/<!DOCTYPE[^>]*>/i,'').replace(/<html[^>]*>/i,'').replace(/<\/html>/i,'')
        .replace(/<head[\s\S]*?<\/head>/i,'').replace(/<\/?body[^>]*>/gi,'');
      return'<div style="page-break-after:'+(i<htmlParts.length-1?'always':'auto')+';padding:20px 28px">'+body+'</div>';
    }).join('')
    +'<div class="no-print" style="position:fixed;bottom:20px;right:20px;">'
    +'<button onclick="window.print()" style="padding:12px 28px;font-size:14px;font-weight:600;background:#0071E3;color:#fff;border:none;border-radius:8px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3)">🖨️ 인쇄 / PDF 저장</button></div>'
    +'</body></html>';
  const win=window.open('','_blank');
  if(win){win.document.write(combined);win.document.close();}
}

/* ── 자료 보기 전용: 선택 지문들을 옵션대로 인쇄 ── */
function printStudySelected(passages,mode,optsIn){
  const IS=mode==='student';
  const opts=optsIn||(IS
    ?{passage:true,structure:true,keyTopics:true,sentences:true,hardOnly:false,showAnswers:false}
    :{passage:true,structure:true,keyTopics:true,sentences:true,hardOnly:false,showAnswers:true});
  const slots=passages.map(toStudySlot).filter(s=>{
    const a=s&&s.analysis;return a&&Array.isArray(a.sentences)&&a.sentences.length>0;
  });
  if(!slots.length){alert('분석 데이터가 있는 지문이 없습니다.\n(인쇄는 문장 분석이 완료된 지문만 출력됩니다.)');return;}
  const html=buildAllHTML(slots,mode,opts);
  if(html)openPrintWindow(html);
}

/* ── 자료 보기 (StudyView) ── */
function StudyView({scriptUrl,studentName,goBack}){
  const [passages,setPassages]=useState([]);

  const [err,setErr]=useState('');
  const [selected,setSelected]=useState(null);
  const [viewMode,setViewMode]=useState('teacher'); // 'teacher' | 'student'
  const [searchText,setSearchText]=useState('');
  const [activeSource,setActiveSource]=useState('ALL');

  // ★ 선택 인쇄 모드
  const [selIds,setSelIds]=useState(new Set());
  const [printJob,setPrintJob]=useState(null); // {items:[passage], mode:'teacher'|'student'}
  const printRef=React.useRef(null);
  // ★ teacher.html식 별도 선택 화면(모달)

  // ★ 출력 옵션(영역 선택) 모달 — {mode:'teacher'|'student', opts:{...}}
  const [outputModal,setOutputModal]=useState(null);
  const toggleSel=(id)=>setSelIds(prev=>{const n=new Set(prev);n.has(id)?n.delete(id):n.add(id);return n;});

  const toggleBulk=(ids)=>setSelIds(prev=>{
    const n=new Set(prev);
    const allOn=ids.length>0&&ids.every(id=>n.has(id));
    ids.forEach(id=>allOn?n.delete(id):n.add(id));
    return n;
  });
  React.useEffect(()=>{
    if(!printJob||!printRef.current)return;
    const t=setTimeout(()=>{
      const w=window.open('','_blank');
      if(!w){alert('팝업이 차단되었습니다. 팝업을 허용해주세요.');setPrintJob(null);return;}
      w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>자료 인쇄</title>
<style>
body{font-family:'Pretendard','Malgun Gothic',sans-serif;color:#222;margin:0;padding:18px;font-size:13px;line-height:1.7}
.prn-item{page-break-after:always}
.prn-item:last-child{page-break-after:auto}
.prn-hd{border-bottom:2.5px solid #7a1020;padding-bottom:8px;margin-bottom:14px}
.prn-hd b{font-size:16px;color:#7a1020}
.prn-hd span{font-size:11px;color:#888;margin-left:8px}
button{display:none!important}
*{box-shadow:none!important}
@media print{@page{margin:14mm} body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body>${printRef.current.innerHTML}</body></html>`);
      w.document.close();
      setTimeout(()=>{w.focus();w.print();setPrintJob(null);},400);
    },350);
    return ()=>clearTimeout(t);
  },[printJob]);

  // 펼침/접힘 상태 (교재, 강 각각 별도 관리)
  const [expandedBooks,setExpandedBooks]=useState({});
  const [expandedChapters,setExpandedChapters]=useState({});
  // ★ 홈 화면 추가 안내 배너 (영구 닫기)
  const [showInstallBanner,setShowInstallBanner]=useState(()=>{
    try{return !localStorage.getItem('greateng_install_dismissed');}catch{return true;}
  });
  // 기기 자동 감지 (iPad iOS13+ Macintosh 위장 대응)
  const deviceType=useMemo(()=>{
    const ua=navigator.userAgent;
    const hasTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
    // iPad iOS13+ : userAgent는 Macintosh로 나오지만 터치 지원 → iPad로 판정
    if(/iPad|iPhone|iPod/i.test(ua))return 'ios';
    if(/Macintosh/.test(ua)&&hasTouch)return 'ios'; // 위장된 iPad
    if(/Android/i.test(ua))return 'android';
    return 'pc';
  },[]);

  useEffect(()=>{
    if(!scriptUrl){setErr('서버 URL이 설정되지 않았습니다.');setLoading(false);return;}
    
    // ★ 오프라인 캐싱: localStorage에서 즉시 로드 (있으면)
    const CACHE_KEY='greateng_study_cache';
    try{
      const cached=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');
      if(cached&&Array.isArray(cached.passages)){
        setPassages(cached.passages);
        setLoading(false); // 캐시 표시 후 백그라운드 갱신
      }
    }catch(e){}
    
    // 백그라운드에서 최신 데이터 받기
    jsonpFetch(scriptUrl,{action:'getPassages',public_only:'true'})
      .then(r=>{
        if(r.ok){
          setPassages(r.passages||[]);
          // 캐시 업데이트 (오프라인 사용 위해)
          try{
            localStorage.setItem(CACHE_KEY,JSON.stringify({
              passages:r.passages||[],
              updated:Date.now()
            }));
          }catch(e){}
        }else if(!passages.length){
          setErr(r.error||'불러오기 실패');
        }
      })
      .catch(e=>{
        // 캐시가 있으면 에러 무시 (오프라인 모드)
        if(!passages.length)setErr('오프라인 - 저장된 자료 없음: '+e.message);
      })
      .finally(()=>setLoading(false));
  },[scriptUrl]);

  const sources=['ALL',...Array.from(new Set(passages.map(p=>p.source))).filter(Boolean)];

  const filtered=passages.filter(p=>{
    if(activeSource!=='ALL'&&p.source!==activeSource)return false;
    if(searchText){
      const q=searchText.toLowerCase();
      return (p.title||'').toLowerCase().includes(q)||(p.abstract||'').toLowerCase().includes(q)||(p.id||'').toLowerCase().includes(q);
    }
    return true;
  });

  // ★ 2단계 그룹화: 교재 → 강 → 지문
  const bookGroups=React.useMemo(()=>{
    const byBook={};
    filtered.forEach(p=>{
      const book=p.source||'기타';
      if(!byBook[book])byBook[book]={book,chapters:{},totalCount:0};
      const ch=String(p.chapter||0).padStart(2,'0');
      if(!byBook[book].chapters[ch])byBook[book].chapters[ch]={chapter:p.chapter,items:[]};
      byBook[book].chapters[ch].items.push(p);
      byBook[book].totalCount++;
    });
    // 정렬: 교재명 → 강 번호
    return Object.values(byBook)
      .sort((a,b)=>(a.book||'').localeCompare(b.book||''))
      .map(b=>({
        ...b,
        chapterList:Object.values(b.chapters)
          .sort((a,b)=>Number(a.chapter||0)-Number(b.chapter||0))
          .map(c=>({
            ...c,
            items:c.items.sort((a,b)=>Number(a.number||0)-Number(b.number||0))
          }))
      }));
  },[filtered]);

  // 검색 시 자동 펼침 (검색어 있으면 모두 펼치기)
  useEffect(()=>{
    if(searchText){
      const allBooks={},allChapters={};
      bookGroups.forEach(b=>{
        allBooks[b.book]=true;
        b.chapterList.forEach(c=>{
          allChapters[b.book+'_'+c.chapter]=true;
        });
      });
      setExpandedBooks(allBooks);
      setExpandedChapters(allChapters);
    }
  },[searchText,bookGroups.length]);

  if(selected)return <StudyDetail passage={selected} viewMode={viewMode} setViewMode={setViewMode} goBack={()=>setSelected(null)}/>;

  return(
    <div style={{maxWidth:540,margin:'0 auto',padding:'0 0 80px'}}>
      <div style={{position:'sticky',top:0,zIndex:10,background:'#fff',borderBottom:'1px solid #f0f0f0',padding:'12px 16px'}}>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
          <button onClick={goBack} style={{background:'none',border:'none',fontSize:20,cursor:'pointer',padding:0,color:'#4f7df7'}}>←</button>
          <span style={{fontWeight:800,fontSize:16,color:'#1e293b'}}>📚 자료 보기</span>
          <button onClick={()=>{setShowSelModal(true);setModalSearch('');setModalSrc('');setModalExpanded('');}}
            style={{marginLeft:'auto',fontSize:11,fontWeight:700,padding:'5px 11px',borderRadius:7,cursor:'pointer',
              border:selIds.size?'1px solid #C9A84C':'1px solid #e6dcc6',
              background:selIds.size?'#FBF3DE':'#fff',color:selIds.size?'#8a6010':'#3a2a20'}}>
            🖨 선택 인쇄·DOCX{selIds.size?` (${selIds.size})`:''}</button>
          <span style={{fontSize:11,color:'#94a3b8'}}>{studentName}</span>
        </div>
        <input value={searchText} onChange={e=>setSearchText(e.target.value)}
          placeholder="제목·요약 검색..."
          style={{width:'100%',padding:'9px 13px',borderRadius:10,border:'1.5px solid #e2e8f0',fontSize:13,outline:'none',boxSizing:'border-box',marginBottom:8}}/>
        <div style={{display:'flex',gap:6,overflowX:'auto',paddingBottom:2}}>
          {sources.map(s=>(
            <button key={s} onClick={()=>setActiveSource(s)}
              style={{flexShrink:0,padding:'5px 12px',borderRadius:20,fontSize:11,fontWeight:600,
                background:activeSource===s?'#4f7df7':'#f1f5f9',
                color:activeSource===s?'#fff':'#555',border:'none',cursor:'pointer'}}>
              {s==='ALL'?'전체':bookLabel(s)}
            </button>
          ))}
        </div>
      </div>
      <div style={{padding:'12px 16px'}}>
        {/* ★ 홈 화면 추가 안내 배너 (영구 닫기 가능) */}
        {showInstallBanner&&(
          <div style={{background:'linear-gradient(135deg,#fef3c7 0%,#fde68a 100%)',border:'1px solid #f59e0b',borderRadius:12,
            padding:'10px 12px',marginBottom:12,display:'flex',alignItems:'flex-start',gap:8,position:'relative'}}>
            <span style={{fontSize:18,flexShrink:0,marginTop:1}}>📌</span>
            <div style={{flex:1,fontSize:12,lineHeight:1.55,color:'#78350f'}}>
              <div style={{fontWeight:700,marginBottom:3,fontSize:12.5}}>홈 화면에 추가하면 빠르게 접속할 수 있어요</div>
              {deviceType==='ios'&&(
                <div>Safari 하단 <b>공유 버튼</b> (□↑) → <b>"홈 화면에 추가"</b></div>
              )}
              {deviceType==='android'&&(
                <div>Chrome 우측 상단 <b>⋮ 메뉴</b> → <b>"홈 화면에 추가"</b></div>
              )}
              {deviceType==='pc'&&(
                <div><b>Ctrl+D</b>로 즐겨찾기 추가 / 주소창 ⭐ 클릭</div>
              )}
            </div>
            <button onClick={()=>{
              try{localStorage.setItem('greateng_install_dismissed','1');}catch{}
              setShowInstallBanner(false);
            }} style={{background:'transparent',border:'none',color:'#78350f',cursor:'pointer',
              fontSize:18,padding:'0 4px',lineHeight:1,opacity:.6,flexShrink:0}}
              title="다시 보지 않기">×</button>
          </div>
        )}
        {loading&&<div style={{textAlign:'center',padding:40,color:'#94a3b8'}}>불러오는 중...</div>}
        {err&&<div style={{textAlign:'center',padding:40,color:'#dc2626'}}>{err}</div>}
        {!loading&&!err&&filtered.length===0&&(
          <div style={{textAlign:'center',padding:40,color:'#94a3b8'}}>공개된 자료가 없습니다.</div>

        {bookGroups.map(b=>{

            <div key={b.book} style={{marginBottom:8,borderRadius:12,overflow:'hidden',border:'1px solid #e2e8f0'}}>
              {/* 교재 헤더 */}

                style={{display:'flex',alignItems:'center',gap:8,padding:'12px 14px',
                  background:bookOpen?'#1e293b':'#f8fafc',
                  color:bookOpen?'#fff':'#1e293b',
                  cursor:'pointer',userSelect:'none'}}>
                <span style={{fontSize:13,transition:'transform .15s',transform:bookOpen?'rotate(90deg)':'rotate(0deg)',display:'inline-block'}}>▶</span>
                <span style={{fontWeight:800,fontSize:14,flex:1}}>{bookLabel(b.book)}</span>
                <span style={{fontSize:11,fontWeight:600,opacity:0.7,
                  background:bookOpen?'rgba(255,255,255,0.15)':'#e2e8f0',

                  {b.chapterList.length}개 강 · {b.totalCount}개 지문

              </div>
              {/* 교재 내부 - 강 목록 */}

                  {b.chapterList.map(c=>{
                    const chKey=b.book+'_'+c.chapter;
                    const chOpen=!!expandedChapters[chKey];
                    return(
                      <div key={chKey} style={{borderTop:'1px solid #f1f5f9'}}>
                        {/* 강 헤더 */}

                          <span style={{fontSize:11,color:'#64748b',transition:'transform .15s',transform:chOpen?'rotate(90deg)':'rotate(0deg)',display:'inline-block'}}>▶</span>
                          <span style={{fontWeight:700,fontSize:13,color:'#334155',flex:1}}>
                            {String(b.book||'').startsWith('MOGO_')?'전체 문항':`${c.chapter}강`}
                          </span>
                          <span style={{fontSize:10,fontWeight:600,color:'#64748b',
                            background:'#f1f5f9',padding:'2px 7px',borderRadius:9}}>
                            {c.items.length}개
                          </span>
                        </div>
                        {/* 강 내부 - 지문 카드들 */}
                        {chOpen&&(
                          <div style={{padding:'8px 14px 12px 28px',background:'#fafbfc'}}>
                            {c.items.map(p=>(
                              <div key={p.id} onClick={()=>setSelected(p)}
                                style={{background:selIds.has(p.id)?'#FBF3DE':'#fff',
                                  border:selIds.has(p.id)?'1.5px solid #C9A84C':'1px solid #e8eef8',
                                  borderRadius:10,padding:'10px 12px',
                                  marginBottom:6,cursor:'pointer',transition:'all .15s',position:'relative'}}
                                onMouseEnter={e=>{if(!selIds.has(p.id)){e.currentTarget.style.borderColor='#4f7df7';e.currentTarget.style.boxShadow='0 2px 8px rgba(79,125,247,0.1)';}}}
                                onMouseLeave={e=>{if(!selIds.has(p.id)){e.currentTarget.style.borderColor='#e8eef8';e.currentTarget.style.boxShadow='none';}}}>
                                {selIds.has(p.id)&&<span style={{position:'absolute',top:8,right:10,fontSize:12,color:'#C9A84C',fontWeight:700}}>✓ 선택됨</span>}
                                <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:p.abstract?4:0}}>
                                  <span style={{fontSize:10,fontWeight:700,padding:'2px 7px',borderRadius:8,
                                    background:p.difficulty==='상'?'#fee2e2':p.difficulty==='하'?'#dcfce7':'#fef9c3',
                                    color:p.difficulty==='상'?'#991b1b':p.difficulty==='하'?'#166534':'#854d0e'}}>
                                    {p.difficulty||'중'}
                                  </span>
                                  <span style={{fontSize:12,fontWeight:700,color:'#1e293b',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                                    {p.title||p.id}
                                  </span>
                                  <span style={{fontSize:11,color:'#94a3b8',flexShrink:0}}>
                                    {String(p.number||'').padStart(3,'0')}번
                                  </span>
                                </div>
                                {p.abstract&&<div style={{fontSize:11,color:'#64748b',lineHeight:1.5,overflow:'hidden',display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical'}}>{p.abstract}</div>}
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })}
      </div>
      {/* ★ teacher.html식 선택 화면 (모달) — 교재/강 체크박스 + 칩 선택 */}
      {showSelModal&&(()=>{
        // 모달 전용 그룹화 (검색·교재필터 반영)
        const mq=modalSearch.trim().toLowerCase();
        const mPassages=passages.filter(p=>{
          if(modalSrc&&p.source!==modalSrc)return false;
          if(mq){
            return (p.title||'').toLowerCase().includes(mq)
              ||(p.abstract||'').toLowerCase().includes(mq)
              ||(p.id||'').toLowerCase().includes(mq);
          }
          return true;
        });
        const srcGroups={};
        mPassages.forEach(p=>{
          const src=p.source||'기타';
          const isMogoSrc=String(src).startsWith('MOGO_');
          const chKey=isMogoSrc?src+'__ALL':src+'__'+String(p.chapter||'?');
          if(!srcGroups[src])srcGroups[src]={source:src,isMogo:isMogoSrc,chapters:{},passages:[]};
          srcGroups[src].passages.push(p);
          if(!srcGroups[src].chapters[chKey])srcGroups[src].chapters[chKey]={key:chKey,chapter:isMogoSrc?'ALL':p.chapter,passages:[],isMogo:isMogoSrc};
          srcGroups[src].chapters[chKey].passages.push(p);
        });
        const order=getAllBooks().map(b=>b.id);
        const srcList=Object.values(srcGroups).sort((a,b)=>{
          const ia=order.indexOf(a.source),ib=order.indexOf(b.source);
          if(ia>=0&&ib>=0)return ia-ib;if(ia>=0)return -1;if(ib>=0)return 1;
          return String(a.source).localeCompare(String(b.source));
        });
        const isGroupAll=(arr)=>arr.length>0&&arr.every(p=>selIds.has(p.id));
        const isGroupSome=(arr)=>arr.some(p=>selIds.has(p.id));
        const srcOptions=Array.from(new Set(passages.map(p=>p.source))).filter(Boolean);
        const cnt=selIds.size;
        const selectedItems=passages.filter(p=>selIds.has(p.id));
        const Pill=({p})=>{
          const sel=selIds.has(p.id);
          return(<label onClick={e=>{e.preventDefault();toggleSel(p.id);}}
            style={{display:'inline-flex',alignItems:'center',gap:4,padding:'3px 9px',
              border:'1px solid '+(sel?'#7a1020':'#ddd'),background:sel?'#7a1020':'#fff',
              color:sel?'#fff':'#333',borderRadius:13,cursor:'pointer',fontSize:11,fontWeight:600}}>

        return(

            <div onClick={e=>e.stopPropagation()}
              style={{background:'#fff',width:'100%',maxWidth:560,maxHeight:'88vh',
                borderTopLeftRadius:18,borderTopRightRadius:18,display:'flex',flexDirection:'column',overflow:'hidden'}}>
              {/* 헤더 */}
              <div style={{background:'#7a1020',padding:'13px 16px',display:'flex',alignItems:'center',gap:8}}>

              {/* 검색·필터 바 */}

                  {srcOptions.map(s=><option key={s} value={s}>{bookLabel(s)}</option>)}

              </div>
              {/* 본문: 교재 → 강 → 칩 */}

                  const srcAll=isGroupAll(sg.passages),srcSome=isGroupSome(sg.passages);
                  const srcSelN=sg.passages.filter(p=>selIds.has(p.id)).length;
                  const isSrcOpen=modalExpanded===sg.source||String(modalExpanded).startsWith(sg.source+'__');
                  const chList=Object.values(sg.chapters).sort((a,b)=>{
                    const na=parseInt(a.chapter),nb=parseInt(b.chapter);
                    if(!isNaN(na)&&!isNaN(nb))return na-nb;
                    return String(a.chapter).localeCompare(String(b.chapter));

                    <div key={sg.source} style={{border:'1px solid '+(srcSome?'#C9A84C':'#e6dcc6'),borderRadius:9,overflow:'hidden',marginBottom:8}}>
                      {/* 교재 헤더 */}
                      <div onClick={()=>setModalExpanded(isSrcOpen?'':sg.source)}

                        <input type="checkbox" checked={srcAll}
                          ref={el=>{if(el)el.indeterminate=!srcAll&&srcSome;}}

                      </div>
                      {/* 강 목록 */}
                      {isSrcOpen&&<div style={{padding:8,display:'flex',flexDirection:'column',gap:5,background:'#fff'}}>
                        {sg.isMogo?(
                          <div style={{display:'flex',flexWrap:'wrap',gap:5,padding:'3px 2px'}}>
                            {sg.passages.sort((a,b)=>Number(a.number||0)-Number(b.number||0)).map(p=><Pill key={p.id} p={p}/>)}
                          </div>
                        ):chList.map(g=>{
                          const all=isGroupAll(g.passages),some=isGroupSome(g.passages);
                          const selN=g.passages.filter(p=>selIds.has(p.id)).length;
                          const chExpKey=sg.source+'__'+g.chapter;
                          const isChOpen=modalExpanded===chExpKey;
                          const chLabel=isNaN(parseInt(g.chapter))?g.chapter+'강':String(g.chapter).padStart(2,'0')+'강';

                                <button onClick={()=>setModalExpanded(isChOpen?sg.source:chExpKey)}
