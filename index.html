const PASSAGES = [{"id": "27ST_E_03_01", "difficulty": "보통", "title": "인간의 미시적 기후 조절 가능성", "abstract": "Localized temperature control on a microclimate scale is possible through human intervention, as demonstrated by early harvesting in Vancouver.", "keyIndex": 1, "sentences": ["Even outdoors, although climate (including temperature) is usually regarded as beyond the control of man, localized temperature control is sometimes effective on a microclimate scale.", "Vancouver, Canada, is a few miles north of the 49th parallel, about 60 miles farther north than Minot, North Dakota, with its legendary harsh winter temperatures.", "But constant foehn winds off the Pacific Ocean make Vancouver winters mild and wet, although sunshine is scant.", "When I had a garden there in the late 1940s, a neighbor used to say that I \\\"cheated God\\\" to bring in my lettuce and tomatoes earlier than anyone else.", "The bed in which the vegetables grew was banked toward the south at approximately 50 degrees, and the area between the plants was covered with flat stones, gathered from the nearby beach, to maximize soil heating from the weak late winter-early spring sun."], "aGroup": ["beyond the control of man", "weak late winter-early spring sun"], "bGroup": ["localized temperature control", "microclimate scale", "banked toward the south", "covered with flat stones"], "answers": ["localized temperature control", "inevitable climate change", "global temperature fluctuation", "passive weather adaptation", "natural disaster prevention"]}, {"id": "27ST_E_03_02", "difficulty": "보통", "title": "진정한 충성심의 원천", "abstract": "True loyalty from employees stems not from short-term external rewards but from the underlying cause and purpose of the organization.", "keyIndex": 9, "sentences": ["Energy can always be injected into an organization to motivate people to do things.", "Bonuses, promotions, other carrots, and even a few sticks can get people to work harder, for sure, but the gains are, like all manipulations, short-term.", "Over time, such tactics cost more money and increase stress for employee and employer alike, and eventually will become the main reason people show up for work every day.", "That's not loyalty.", "That's the employee version of repeat business.", "Loyalty among employees is when they turn down more money or benefits to continue working at the same company.", "Loyalty to a company trumps pay and benefits.", "And unless you're an astronaut, it's not the work we do that inspires us either.", "It's the cause we come to work for.", "We don't want to come to work to build a wall; we want to come to work to build a cathedral."], "aGroup": ["manipulations", "repeat business", "pay and benefits", "build a wall"], "bGroup": ["loyalty", "turn down more money", "the cause", "build a cathedral"], "answers": ["importance of organizational purpose over rewards", "short-term manipulation of employees", "financial incentives for workplace loyalty", "competitive promotion strategies", "repetitive daily work motivation"]}, {"id": "27ST_E_03_03", "difficulty": "높음", "title": "생물학적 역사의 축적인 DNA", "abstract": "DNA is a physical manifestation of biological history accumulated through natural selection, acting as a blueprint for our bodies.", "keyIndex": 4, "sentences": ["In the early 1960s the great American writer James Baldwin wrote: \\\"People are trapped in history, and history is trapped in them.\\\"", "He was speaking to race when he penned those words.", "But the statement is equally true if the word \\\"people\\\" is replaced with \\\"all of life on Earth, present and past,\\\" for each strand of DNA, in each of our cells, is an ancient record of biological history, written in simple code and passed down from generation to generation.", "One could say that DNA is nothing but history, one with a physical manifestation that was slowly blended and accumulated over countless eons by the most pitiless of all phenomena ― natural selection.", "DNA is a history that is inside us ― and yet one that is our master as well, the blueprint for our bodies, and dictator of what we will pass on to our children, gifts that can be blessings ― or deadly time bombs.", "We are indeed trapped in this particular vehicle of history as much as it is trapped in us."], "aGroup": ["trapped in us", "trapped in this particular vehicle"], "bGroup": ["biological history", "blueprint", "blueprint", "dictator"], "answers": ["biological history record", "racial classification system", "modern medical breakthrough", "artificial genetic modification", "individual psychological trait"]}, {"id": "27ST_E_03_04", "difficulty": "보통", "title": "비판적 사고의 두려움과 그 중요성", "abstract": "Although people fear critical thinking because it challenges their long-held beliefs, it remains fundamentally important to the world.", "keyIndex": 11, "sentences": ["People may not think critically for a variety of reasons, such as laziness and inability, but fear is a big one.", "Why is that?", "People don't want to think not just because it's hard, but also because they're afraid it will make them question their long-held beliefs.", "Your students most likely do want to think about things that can be very controversial, like politics, ethics, and philosophy.", "But probe even deeper.", "Once we start thinking deeply, long-held assumptions are challenged.", "Thought makes us worry that we'll lose our balance and have to look at the world in a different way.", "We worry about thinking because we care about what we and other people think.", "Even the most far-fetched ideas have an effect on the world.", "Non-Euclidean geometry and symbolic logic are about as abstract as thinking can get, but you can't understand Einsteinian gravity without the first and run computers without the second.", "Thinking is important to us, to others, and to the world we live in.", "This is one reason why we are so afraid of it: it shakes us to the core."], "aGroup": ["fear", "question long-held beliefs", "lose our balance", "shakes us to the core"], "bGroup": ["critical thinking", "effect on the world", "important to us"], "answers": ["fear as a barrier to critical thinking", "blind obedience to authority", "superficial observation in education", "irrational emotional response to problems", "maintaining absolute stability in beliefs"]}, {"id": "27ST_E_04_01", "difficulty": "보통", "title": "지식의 진보를 통한 에너지 포착", "abstract": "Human prosperity is driven by the advancement of agricultural knowledge, allowing us to capture solar energy efficiently as food.", "keyIndex": 6, "sentences": ["There's a saying that \\\"you can't eat information.\\\"", "That may be so, but the food we eat today is the fruit of thousands of years of increasingly high-quality information ― the knowledge of how to farm ― what seeds, what tools and how to use them, what times of year, what irrigation, what sequence of one crop after another on the same land.", "What we eat is solar energy, filtered, concentrated, and distilled through the lens of human knowledge.", "The energy the Earth receives from the sun each year has remained more or less constant through all of human civilization.", "What's allowed us to flourish is our increasingly sophisticated knowledge of how to capture an ever-growing but still tiny fraction of that energy in a form that can fuel our bodies.", "Every step in the advancement of our knowledge has brought with it an increase in the amount of energy we can tap into."], "aGroup": ["constant solar energy", "you can't eat information"], "bGroup": ["agricultural knowledge", "energy capture", "sophisticated knowledge", "tap into energy"], "answers": ["role of knowledge in capturing energy", "constant solar energy limits growth", "pure physical labor in food production", "chemical fertilizers replacing knowledge", "industrial mass production of crops"]}, {"id": "27ST_E_04_02", "difficulty": "높음", "title": "시민 주도의 새로운 저널리즘", "abstract": "The democratization of information has empowered citizens to become the new creators and gatekeepers of local news.", "keyIndex": 3, "sentences": ["Increased community engagement by professional journalists, on their own, will not solve the problem of making the news more relevant to everyone because traditional news organizations already have abandoned many communities, leaving behind news deserts.", "In those places, citizens must take up the responsibility for discovering information, holding the powerful accountable, and telling the news for themselves and their neighbors.", "The democratization of information ― through the disruptions caused by computers and the internet ― allows citizens to retake control of local news in ways that never have existed before, and it calls them to take greater care in the gathering and dissemination of what they discover or think they know.", "Journalism, perhaps like never before, belongs to the people rather than to professional journalists, wealthy publishers, or even corporate shareholders.", "The same technology that has shifted the balance of power toward the people gives them the tools to act as broadcasters and publishers of information essential to their immediate community ― and, more critically, to serve as gatekeepers to information for other people around them."], "aGroup": ["abandoned many communities", "news deserts", "professional journalists"], "bGroup": ["democratization of information", "citizens retake control", "broadcasters and publishers", "gatekeepers"], "answers": ["citizens as new creators of local journalism", "traditional news deserts in communities", "corporate media monopoly over local news", "strict government censorship of information", "professional journalistic ethics in reporting"]}, {"id": "27ST_E_04_03", "difficulty": "보통", "title": "객관적 증거와 비판적 사고의 중요성", "abstract": "Intuition and plausible theories must be validated by objective evidence and critical thinking to establish scientific truth.", "keyIndex": 8, "sentences": ["It is a myth that all ideas are equally valid, even those with little or no objective proof.", "The existence of science is the commitment to objective truth.", "After all, science is true: fire is hot, the wheel is efficient, birds and planes can fly, we've landed on a comet and traveled to the Moon, antibiotics treat illness, and immunizations keep us from getting sick.", "These accomplishments are made possible by objective truths.", "A plausible theory can, and frequently does, push science forward.", "However, an intuition must be followed with testing that confirms or disproves its veracity.", "If a theory is disproved, one should consider it as a reason to reject or alter the hypothesis, not a justification to just keep firmly holding to the hypothesis because you are instinctively wedded to it.", "Critical thinking is an absolute must, and we must respect evidence.", "It's the only reason for anyone to trust anything about reality.", "Without testing and evidence, intuition is useful, but it is never the ultimate word."], "aGroup": ["ideas with no proof", "plausible theory", "intuition", "instinctively wedded"], "bGroup": ["objective truth", "testing", "evidence", "critical thinking"], "answers": ["necessity of objective evidence in science", "plausible subjective intuition in research", "creative artistic expression in inquiry", "emotional decision making in science", "traditional philosophical belief systems"]}, {"id": "27ST_E_04_04", "difficulty": "보통", "title": "사회적 불안의 긍정적 전환", "abstract": "Social anxiety can be transformed into a tool for empathy and compassion, ultimately boosting social connections.", "keyIndex": 5, "sentences": ["If you suffer from social angst, awkwardness, or dread, know that this is a perfectly normal response.", "No matter what it looks like, a lot of people are dealing with internal anxiety in social situations.", "But it is actually possible to build your social muscle and use it to boost your connections ― and your anxiety is giving you clues to what icebreakers and lifelines other people might be grateful for you to extend.", "Truly listen to what your anxiety is signaling to you about where you feel uncertain or insecure, and practice empathy by offering a hand to others who might be in the same boat.", "Remember that flipping anxiety into compassion is something inherent in you ― it is, in fact, what your anxiety was designed to do for you.", "Together, compassion and empathy can buffer against bad anxiety.", "You can use your anxiety to be more outward-facing.", "The outcome?", "The spread of compassion for your fellow human beings, other species, and the planet!"], "aGroup": ["social angst", "internal anxiety", "uncertain or insecure"], "bGroup": ["boost connections", "empathy", "flipping anxiety into compassion", "outward-facing"], "answers": ["transforming social anxiety into outward compassion", "internal social angst in daily life", "total emotional isolation from others", "competitive psychological defense mechanisms", "artificial networking strategy for connections"]}, {"id": "27ST_E_05_01", "difficulty": "보통", "title": "거대 위기 상황 대처법", "abstract": "When facing overwhelming crises, focus on breaking them down into smaller, manageable problems within your control.", "keyIndex": 4, "sentences": ["Many crises today, such as the Great Recession, are simply too big and too overwhelming for you to completely comprehend, much less control.", "Crises of this ilk are precisely the kind that can easily engulf you with destructive reactions that interfere with your ability to overcome them.", "Focusing on these oversized crises will exacerbate the natural psychological, emotional, and physical reactions you are going to experience.", "With these sorts of crises, your best chance is to identify those aspects that are within your control.", "Then, you can break down the bigger crisis into smaller, more manageable problems toward which you can direct your energy and find solutions.", "For example, think back to the Great Recession.", "Although you probably didn't have the ability to influence economic policy, you were able to revisit the distribution of your investments and choose to create a more diverse portfolio."], "aGroup": ["too big and too overwhelming", "oversized crises", "destructive reactions"], "bGroup": ["within your control", "break down", "smaller, more manageable problems"], "answers": ["breaking down overwhelming crises into manageable parts", "macro crises beyond individual control", "complete economic collapse and recovery", "uncontrollable emotional reactions to crisis", "blind optimism during difficult times"]}, {"id": "27ST_E_05_02", "difficulty": "보통", "title": "증거 기반 건강 정보의 활용", "abstract": "Instead of relying on misleading commercial internet sites, people should seek evidence-based nutrition information from reputable organizations.", "keyIndex": 6, "sentences": ["Consumer surveys indicate that the majority of Americans (91%) believe they have some control over their health, and 72% believe that food and nutrition play the greatest role.", "However, 75% of consumers rely on media outlets including the Internet as their major sources of health and nutrition information, and only half use medical sources.", "A Google search for \\\"nutrition listservs\\\" yielded over 100,000 sites, but it is likely that many of these writings are not reviewed by nutrition experts.", "Internet sites marketing herbs, drugs, and health devices are not monitored by government regulatory agencies and often contain misleading information.", "Reputable food companies provide helpful facts about the nutrient content of their products, but commercial sites devoted to sales often post misleading health claims.", "Internet sites maintained by government agencies, universities, state extension services, and medical facilities provide evidence-based information and should be the first source for public information on foods, nutrition, and health."], "aGroup": ["not reviewed by nutrition experts", "commercial sites", "misleading health claims"], "bGroup": ["medical sources", "government agencies", "evidence-based information"], "answers": ["seeking evidence-based nutrition information online", "misleading health claims on commercial sites", "unverified internet rumors about nutrition", "alternative medical therapy as information source", "strict dietary restriction based on media"]}, {"id": "27ST_E_05_03", "difficulty": "높음", "title": "서번트 리더십의 솔선수범", "abstract": "True leadership involves modeling important values and pitching in to help the team, regardless of one's position.", "keyIndex": 7, "sentences": ["My business partner Charles and I embraced the servant leader's way of doing things.", "In other words, nothing was beneath us.", "We led by example and did the work.", "When any new salesman came into the store, he would look around, notice Charles polishing some corner of the floor and me covered in flour, and assume the decision-maker was not present.", "He'd then hand off whatever he was selling to me and say, \\\"Can you give this to the owner?\\\"", "Now, if Charles and I had remained in the bakery for too long, we wouldn't have been able to grow and scale, so I'm not saying you should be sweeping the floors forever.", "It's more about modeling what's important.", "If cleanliness and details are important, be sure you aren't above doing the work and pitching in.", "Come into your workspace and ask how you can help.", "If it's clear your team is in the weeds, jump in without asking."], "aGroup": ["decision-maker was not present", "above doing the work"], "bGroup": ["servant leader's way", "led by example", "modeling what's important", "pitching in"], "answers": ["modeling core values", "authoritative hierarchical instruction", "strict role delegation", "detached management style", "theoretical business strategy"]}, {"id": "27ST_E_05_04", "difficulty": "보통", "title": "선수들의 호흡 조절과 회복", "abstract": "Athletes must learn to use slow breathing outside of performance to reduce sympathetic arousal and enhance recovery.", "keyIndex": 3, "sentences": ["Training and competition naturally speed the breath, which activates the sympathetic nervous system.", "In performance, this is acceptable because an athlete wants to produce adrenaline and compete and train in an aroused state.", "However, it is equally important for an athlete to learn how to mentally and physically downshift from the acute sympathetic activity experienced in sport, and outside of performance focus their attention on slow breathing to reduce the sympathetic activity and resolve the fight-or-flight state.", "In the Feinstein Institutes study, participants were able to use the pace of their breathing to activate specific regions of the brain.", "In a performance realm, this means athletes can use breathing pace to manage their state of arousal.", "During training and competition, the breathing rate increases with the introduction of adrenaline, and athletes must be able to control this to be able to adapt and recover.", "One way is to practice slower breathing protocols outside of training and competition."], "aGroup": ["activates the sympathetic nervous system", "aroused state", "fight-or-flight state"], "bGroup": ["downshift", "slow breathing", "reduce the sympathetic activity", "manage their state of arousal"], "answers": ["sympathetic activity reduction", "intense physical training", "continuous mental arousal", "rapid competitive breathing", "artificial adrenaline injection"]}, {"id": "27ST_E_06_01", "difficulty": "높음", "title": "능동적 민주주의와 투표권의 기준", "abstract": "In an active democracy, residence, not citizenship, should be the defining criterion for granting voting rights.", "keyIndex": 4, "sentences": ["In the United States, the practice of permitting aliens to vote could be seen as compatible with the idea of an exclusionary citizenship, but that is a hard balance to maintain.", "If the vote, of all rights, is in the hands of noncitizens, why should they not count as citizens, and the entire distinction between resident alien and citizen be abandoned?", "Indeed, something like this thought probably lay behind the disappearance of alien voting: with universal adult citizen suffrage after 1920, the only way to maintain an exclusionary kind of citizenship was to restrict the vote to citizens and not residents.", "But no theory of \\\"active\\\" democracy can countenance this distinction: the laws concerning our common life must be made by all those who are taking part in it, and residence is the only convincing test of whether someone is taking part — as is understood almost universally when it comes to questions of which citizens should have a voice in local government."], "aGroup": ["exclusionary citizenship", "distinction between resident alien and citizen", "restrict the vote"], "bGroup": ["active democracy", "residence", "residence"], "answers": ["residence as criterion for voting rights", "exclusionary citizenship in modern democracy", "strict border control restricting voting", "universal tax exemption for all residents", "mandatory military service for citizens"]}, {"id": "27ST_E_06_02", "difficulty": "보통", "title": "맥락이 결정하는 사물의 의미", "abstract": "The physical location and context of an object dictate how its meaning is interpreted, as seen in the contrast between a street and a gallery.", "keyIndex": 6, "sentences": ["When people are asked what any painting hanging on a gallery wall means, no matter how strange it might appear, as is the case with most abstract-expressionist paintings, they tend to find meaning in it because it is located in a gallery.", "Consider a soda can found thrown away on a city street.", "If we were to come across this item on the street, we would no doubt view it as a piece of garbage or rubbish.", "But if we saw the very same object on a pedestal, displayed in an art gallery, signed by some artist, and given a title such as \\\"Waste,\\\" then we would interpret its meaning in a vastly different way.", "We would, in fact, be inclined to interpret it as an artistic form, describing a throw-away or materialistic society.", "Clearly, the can's location on a sidewalk versus its display on a pedestal in an art gallery will influence how we will interpret it."], "aGroup": ["city street", "sidewalk", "garbage or rubbish"], "bGroup": ["gallery wall", "pedestal", "artistic form"], "answers": ["how context determines meaning of objects", "absolute objective value of all objects", "universal aesthetic standard in art", "functional physical property of objects", "strict artistic technique in galleries"]}, {"id": "27ST_E_06_03", "difficulty": "보통", "title": "컴퓨터 비유의 한계와 의미 구성", "abstract": "Relying on the computer metaphor for the human mind neglects the cultural context and the fundamental human process of constructing meaning.", "keyIndex": 5, "sentences": ["The reliance on the computer as a model for the operations of the human mind may well prove to be as limited as an earlier fascination with behaviorism.", "Psychologists have already begun to recognize the flaws of the mind-as-computer metaphor.", "Some have turned to cultural anthropology as a way of understanding the factors outside any particular individual's brain that help the individual make sense out of the world.", "Others, such as Jerome Bruner, one of the founders of cognitive psychology, find that the computer analogy carries with it an unfortunate shift \\\"from the construction of meaning to the processing of information.\\\"", "Bruner's reflections on the limits of the machine model lead him back to a humanistic emphasis on narrative and story-telling as essential ingredients in understanding human cognition, a fascinating intellectual journey that reveals both the power and the limits of computers as guides to the way we think."], "aGroup": ["mind-as-computer metaphor", "processing of information", "machine model"], "bGroup": ["cultural anthropology", "construction of meaning", "narrative and story-telling"], "answers": ["limits of computer metaphor for human mind", "rapid information processing in the brain", "mechanical behavioral response to stimuli", "absolute computational logic of the mind", "biological neural network as mental model"]}, {"id": "27ST_E_06_04", "difficulty": "보통", "title": "독서를 통한 상상력의 활성화", "abstract": "Unlike perception, reading literature activates imagination by reversing the process, allowing readers to construct their inner world from memory.", "keyIndex": 2, "sentences": ["In the escape that reading literature provides through vicarious identification and comparison with other lives, places, and times, we activate our imagination, that uniquely human ability to explore an alternative set of ideas and experiences that are outside our present environment and that may not even be real.", "As opposed to perception that receives and processes information from the outside world — light, sound, shape — and finds meaning in it — a sunset, a symphony, a house — in imagination, the process is reversed.", "Translating the words we read into what they signify, we populate an inner world in which imagery is created from the memory.", "For example, we read \\\"house\\\" and picture a representation of a house from memory.", "It is our imagination, the complex interweaving of perception and memory that literature activates, releasing a latent creativity that pleases.", "The writer may provide the blueprint, but the reader builds literature's many rooms, and like any satisfying occupation, literature gratifies our imaginative and creative abilities."], "aGroup": ["receives and processes information from the outside world", "perception"], "bGroup": ["activate our imagination", "process is reversed", "populate an inner world", "reader builds"], "answers": ["reading literature as activating imagination", "passive sensory perception in everyday life", "objective reality replication through fiction", "external physical stimulus in perception", "logical language analysis in reading"]}, {"id": "27ST_E_07_01", "difficulty": "보통", "title": "숙달을 결정하는 복합적 요인들", "abstract": "Achieving mastery is not solely dependent on ten thousand hours of practice but is influenced by a complex mix of innate, experiential, and environmental factors.", "keyIndex": 4, "sentences": ["You've probably heard that it takes about ten thousand hours of practice to become an expert in anything — a musical instrument, a sport, chess, cooking, or a foreign language.", "The research by K. Anders Ericsson on this topic has been written about many times, and it was made even more famous when Malcolm Gladwell described it in his bestselling book Outliers.", "However, recently, a cohort of researchers reexamined the studies and research behind the 10K figure and said, quite dramatically, that the ten-thousand-hour rule was utter nonsense.", "Specifically, there is nothing particularly special about ten thousand hours, and while practice is clearly important to boost performance, other factors may play an even more important role.", "What are those other factors that get us to expert levels of performance? Pure innate talent? Intelligence? Luck of the draw? Perseverance? Hard work?", "Yes, it's all of that… and more. Age, experience, and environment all play a role.", "In other words, there's no one certain factor that can predict or ensure mastery or optimal performance of anything."], "aGroup": ["ten thousand hours of practice", "10K figure", "ten-thousand-hour rule"], "bGroup": ["other factors", "innate talent", "age, experience, and environment"], "answers": ["multifaceted mastery factors", "absolute practice time", "singular innate talent", "purely environmental influence", "predictable scientific formula"]}, {"id": "27ST_E_07_02", "difficulty": "보통", "title": "가치 충돌 극복을 위한 프레임 전환", "abstract": "A US beverage company successfully entered the Soviet market by reframing its product from a consumer good to a tool for industrial development.", "keyIndex": 6, "sentences": ["In the old Soviet Union, a famous U.S. beverage company wanted to set up a bottling plant and distribution network.", "The prevailing ideology in the old Soviet Union at the time stressed the importance of the group over the individual and the need to develop industrial capacity at the expense of consumer goods.", "Soft drinks hardly seemed to fit the country's ideological priorities.", "Indeed, one government official dismissed the product as a \\\"useless drink.\\\"", "Eventually, the two sides struck a deal, but not on the basis that the drink would quench the local population's thirst.", "Instead, the U.S. negotiators justified the project on the grounds that it would contribute to the country's industrial development.", "They restructured the project to include a heavy training component for local workers and managers, as well as a farm that would grow certain of the drink's ingredients.", "In addition, the company promised to make efforts to persuade other American companies to consider investments in the country."], "aGroup": ["consumer goods", "soft drinks", "useless drink", "quench thirst"], "bGroup": ["industrial capacity", "industrial development", "training component"], "answers": ["strategic reframing to overcome ideological conflict", "rigid ideological conflict in negotiations", "direct consumer marketing in foreign markets", "absolute political resistance to trade", "unconditional economic boycott of products"]}, {"id": "27ST_E_07_03", "difficulty": "보통", "title": "컴퓨터 설계의 정밀함이 낳은 부작용", "abstract": "The precision of CAD software often leads to premature fixation, depriving architects of the emotional and exploratory creativity found in freehand sketching.", "keyIndex": 8, "sentences": ["In 2012, the Yale School of Architecture held a symposium called \\\"Is Drawing Dead?\\\"", "The bold title reflects a growing sense that the architect's freehand sketch is being displaced by the computer.", "The transition from sketchpad to screen entails, many architects believe, a loss of creativity, of adventurousness.", "Thanks to the precision and apparent completeness of screen renderings, a designer working at a computer has a tendency to lock in, visually and cognitively, on a design at an early stage.", "He bypasses much of the reflective and exploratory playfulness that springs from the uncertainty and ambiguity of sketching.", "Researchers term this phenomenon \\\"premature fixation\\\" and trace its cause to \\\"the disincentive for design changes once a large amount of detail and interconnectedness is built too quickly into a CAD (Computer-Aided Design) model.\\\"", "The designer at the computer also tends to emphasize formal experimentation at the expense of expressiveness.", "By weakening an architect's \\\"personal, emotional connection with the work,\\\" a renowned American architect and designer Michael Graves argues, CAD software produces designs that, \\\"while complex and interesting in their own way,\\\" often \\\"lack the emotional content of a design derived from hand.\\\""], "aGroup": ["computer", "precision and apparent completeness", "premature fixation", "lack the emotional content"], "bGroup": ["freehand sketch", "uncertainty and ambiguity", "exploratory playfulness", "emotional connection"], "answers": ["premature design fixation", "endless creative exploration", "perfect functional efficiency", "traditional structural stability", "emotional artistic connection"]}, {"id": "27ST_E_07_04", "difficulty": "보통", "title": "리미티드 애니메이션의 예술적 가치", "abstract": "Limited animation, originally a cost-saving measure, evolved into a unique artistic style that relies on abstraction and the viewer's imagination.", "keyIndex": 7, "sentences": ["Limited animation is a process of making animated cartoons that does not follow a \\\"realistic\\\" approach.", "The short cartoons and feature films of Walt Disney from the 1930s and 1940s are widely acclaimed for depicting animated simulations of reality, with exquisite detail in every frame.", "However, this style of animation is very time-consuming and expensive.", "\\\"Limited\\\" animation creates an image that uses abstract art, symbolism, and limited movement to create the same effect, but at a much lower production cost.", "This style of animation depends more upon suspension of disbelief to tell a story; the story exists more in the viewer's imagination.", "It also encourages the animators to indulge in artistic styles that are not necessarily bound to the limits of the real world.", "The result is a new artistic style that could not have developed if animation was solely devoted to producing simulations of reality.", "Without limited animation, such ground-breaking films as Yellow Submarine, Chuck Jones' The Dot and the Line, and many others could never have been produced."], "aGroup": ["realistic approach", "simulations of reality", "bound to the limits"], "bGroup": ["abstract art and symbolism", "suspension of disbelief", "viewer's imagination", "not bound to the limits"], "answers": ["limited animation as a unique artistic style", "realistic physical simulation in animation", "strict frame continuity in animation", "high budget production in Disney films", "objective documentary style in animation"]}, {"id": "27ST_E_11_01", "difficulty": "보통", "title": "비유를 통한 효율적인 정보 선별 교육", "abstract": "Using a supermarket shopping list metaphor helps students understand the importance of selectively gathering information rather than copying everything verbatim.", "keyIndex": 6, "sentences": ["Below-grade-level readers in my urban middle school have a great deal of difficulty doing research.", "Their answer when assigned to do \\\"a report\\\" is to come to the media center and copy verbatim everything in the encyclopedia article or whatever source they have located, be it Internet, print, or whatever.", "To try to get the students to understand why it isn't necessary to copy everything in the articles, I use a comparison to a supermarket.", "I ask them if everything in the supermarket is useful, and we discuss this, with the usual conclusion being that it is, but we don't buy everything all the time.", "Then I ask them why they don't buy everything each time they go and how they determine what to buy when they go with their parents. Someone usually mentions that they have a list.", "From that point on, I lead a discussion about how whatever their teachers have asked for is their \\\"shopping list\\\" for their research, and they should just read for that information and write it down in note format.", "It sometimes helps them to understand that copying everything is a wasteful endeavor."], "aGroup": ["copy verbatim everything", "buy everything each time", "wasteful endeavor"], "bGroup": ["comparison to a supermarket", "shopping list", "read for that information"], "answers": ["selective information gathering", "verbatim source copying", "comprehensive reading strategy", "rapid content memorization", "abstract conceptual mapping"]}, {"id": "27ST_E_11_02", "difficulty": "보통", "title": "시장 효율성의 폐해와 가치의 소외", "abstract": "The logic of market efficiency marginalizes real social and environmental values, highlighting the inevitable inequities of market-oriented activities.", "keyIndex": 7, "sentences": ["Reformist approaches assume that markets could operate in more equitable and environmentally reasonable ways, and that a market is the most efficient option available.", "Yet the logic of market efficiencies generally rotates on purely monetary calculations, effectively reasoning in a hall of mirrors and marginalising real social and environmental values.", "Familiar examples are conventional food retailers, such as supermarkets, which purchase fruit and vegetables as cheaply as possible.", "Inexpensive produce might be grown using soil- and water-damaging fertilisers, by poorly paid illegal migrant workers, and transported long distances using more cheap labour and environmentally damaging practices.", "However, organic farmers can only follow ecologically sound practices and make sure they pay their workers fair wages if the food costs more, meaning supply for an elite demand.", "By its very nature, one never manages to escape the conundrums that production for trade entails.", "Real social and environmental values involved in caring for people and Earth highlight the inequities and damage of market-oriented activities."], "aGroup": ["purely monetary calculations", "as cheaply as possible", "market-oriented activities"], "bGroup": ["equitable", "social values", "ecologically sound practices"], "answers": ["marginalized social value", "pure market efficiency", "rapid economic growth", "technological agricultural innovation", "perfect equitable trade"]}, {"id": "27ST_E_11_03", "difficulty": "보통", "title": "사회적 구성물로서의 인종", "abstract": "Race has no scientific basis and is merely a social construction, as evidenced by ancient Rome where civilization, not skin color, was the metric.", "keyIndex": 3, "sentences": ["There is no scientific basis for the term \\\"race\\\".", "Most humans are genetically very similar and there is so little variation amongst us that it is not possible to draw neat boundaries around people and label them as a distinct racial group.", "Race is an example of social construction, where social processes create something that essentially does not exist but takes on real force in people's lives.", "Sociologists prefer to call these processes \\\"racialization\\\".", "Historical evidence that race has always been an issue is hard to find.", "For example, in ancient Rome there were various leading figures, such as Emperor Septimius Severus (ruled C.E. 193–211), who were black.", "Little is said of their skin colour in accounts written at the time, because the ancient Romans did not think it made any difference.", "They thought more in terms of judging people as being civilized or a barbarian."], "aGroup": ["scientific basis", "distinct racial group", "skin colour"], "bGroup": ["social construction", "racialization", "civilized or a barbarian"], "answers": ["race as a social construction without scientific basis", "biological genetic destiny of racial groups", "absolute physical boundary between races", "universal historical conflict over race", "natural hierarchical order of racial groups"]}, {"id": "27ST_E_11_04", "difficulty": "보통", "title": "분량 왜곡과 비만의 관계", "abstract": "The increasing normalization of larger portion sizes has created a portion distortion environment that leads to excessive calorie intake and obesity.", "keyIndex": 1, "sentences": ["Many factors contribute to Americans' growing waistlines, but one observation in particular cannot be overlooked: The incidence of obesity has increased in parallel with increasing portion sizes.", "Consider this: Adults today consume an average of 300 more calories per day than they did in the year 1985.", "Is this just a coincidence, or do larger portion sizes have something to do with it?", "In almost every eating situation, we are now confronted by huge portions, which are perceived as \\\"normal\\\" or \\\"a great value.\\\"", "Americans have created the perception that large portion sizes are appropriate, creating an environment of portion distortion.", "We find portion distortions in restaurants, where the jumbo-sized portions are consistently 250 percent larger than the regular portions.", "We even find portion distortions in our homes, where the sizes of our bowls and glasses have steadily increased and where the surface area of the average dinner plate has increased 36 percent since 1960.", "Research shows that people unintentionally consume more calories when offered larger portions.", "Consuming larger portion sizes can contribute to positive energy balance, which, over time, leads to weight gain and ultimately can result in obesity."], "aGroup": ["perceived as \"normal\"", "appropriate"], "bGroup": ["increasing portion sizes", "portion distortion", "positive energy balance"], "answers": ["portion distortion leading to obesity", "strict dietary regulation to prevent obesity", "mindful eating habit as a health solution", "genetic obesity factor in Americans", "active metabolic rate in weight management"]}, {"id": "27ST_E_12_01", "difficulty": "높음", "title": "도덕적 분노의 사회적 기능과 메커니즘", "abstract": "Moral outrage serves as a commitment device that motivates individuals to punish wrongdoers, essential for maintaining a cooperative society.", "keyIndex": 1, "sentences": ["Moral outrage is the psychological tool that motivates people to punish wrongdoers, even at cost or risk to themselves.", "It is a commitment device, something that commits people to punishment, even though trying to punish someone can be dangerous.", "When we witness unjust harm, whether someone committing interpersonal violence or obvious cheating, we have an embodied physical reaction.", "We get angry, our blood pressure spikes, our heart beats faster; we thirst for retribution.", "Outrage leads us to overlook the irrationality of risking our own safety to punish someone.", "In any single situation, there is rarely an immediate personal benefit for meting out punishment, and often there is real risk, because the person you are serving justice against could lash out at you or get revenge in the future.", "But the powerful feeling of outrage leads us to momentarily forget this unfavorable evaluation and get involved in a situation we would be better off avoiding, and science reveals how this feeling and forgetting is essential for maintaining a cooperative society."], "aGroup": ["dangerous, irrationality, real risk, unfavorable evaluation, better off avoiding"], "bGroup": ["moral outrage, commitment device, embodied physical reaction, thirst for retribution, essential for cooperative society"], "answers": ["moral outrage"]}, {"id": "27ST_E_12_02", "difficulty": "보통", "title": "천연 제품 선호와 진화적 본능의 관계", "abstract": "The human preference for natural products stems from an evolutionary instinct to treat unknown substances with caution to ensure survival.", "keyIndex": 4, "sentences": ["Why do humans have the counterproductive instinct to favor natural products in the absence of knowledge of their benefits or their potential for harm?", "The answer likely lies in our genes.", "Our species, through most of its evolutionary history, relied heavily upon experience to judge whether ingestion of something was beneficial versus whether it was dangerous.", "We evolved the instinct to avoid plants that made us sick and favored those that made us well.", "Treating unknowns with great caution provided a terrific survival advantage.", "Today, we trust that products of nature are safe to consume.", "But those pills coming off a pharmaceutical production line look nothing like what our instincts tell us is safe to eat.", "The ingredients remind us of a high school chemistry lab.", "Yet we are expected to consume them.", "Thus, we treat them with suspicion just as our distant ancestors regarded a new plant.", "When in need of a remedy, we are drawn to derivatives of our food, plant products, which we perceive to be safe, and not artificial products of science."], "aGroup": ["unknowns, pharmaceutical production line, high school chemistry lab, artificial products of science"], "bGroup": ["natural products, experience, made us well, safe to consume, derivatives of our food, plant products"], "answers": ["natural products"]}, {"id": "27ST_E_12_03", "difficulty": "보통", "title": "의약품과 대조되는 건강기능식품 규제의 허점", "abstract": "Unlike strictly regulated drugs, dietary supplements lack rigorous premarket evaluation, necessitating legislative changes for consumer safety.", "keyIndex": 6, "sentences": ["Dietary supplements are not drugs.", "A drug is intended to diagnose, cure, mitigate, treat, or prevent disease.", "Before marketing, drugs must undergo extensive studies of effectiveness, safety, interactions with other substances, and dosing.", "The FDA gives formal premarket approval to a drug and monitors its safety after the drug is on the market.", "If a drug is subsequently shown to be dangerous, the FDA can act quickly to have it removed from the market.", "None of this is true for dietary supplements.", "The current law gives the FDA only limited authority over supplements.", "This makes it difficult for the government to remove unsafe supplements from the marketplace.", "The FDA does not evaluate the safety and effectiveness of supplements before they hit the marketplace.", "There are some legislators in Congress who want to improve the law by requiring supplement makers to put safer products on the shelves and label products more clearly.", "The objective is to ensure that consumers can tell the difference between dietary supplements that are safe and those that have potentially serious side effects or drug interactions."], "aGroup": ["limited authority, not evaluate before marketplace, difficult to remove"], "bGroup": ["extensive studies, premarket approval, monitors safety, act quickly to remove"], "answers": ["supplement regulation"]}, {"id": "27ST_E_12_04", "difficulty": "높음", "title": "독자의 참여에 따른 문학 의미의 역동성", "abstract": "Literature is a dynamic medium that requires reader participation to re-experience and shift meanings based on changing life perspectives.", "keyIndex": 7, "sentences": ["Literature is not a disposable carrier of nuggets of information.", "Literature invites us back again and again to re-experience what it offers and to reassess its meanings.", "Literature continues to communicate meaning and significance over time, and, most remarkably, to shift its meaning based on our perspective.", "We have all had the experience of taking up a classic work of literature after several years and finding in it details and significance we missed the first time through.", "What has changed is not the work of literature exactly but our experiences that are now reflected in the text.", "One’s perception of Shakespeare’s grand drama on aging under existential threat, King Lear, is a different experience read in one’s twenties than it is in one’s seventies.", "This is true because reading literature, as opposed to everyday reading, requires full reader participation, activating not just our informational processing skills but our analysis, imagination, and emotions.", "These change over time in every person, and those changes explain how works of literature are more dynamic than everyday reading."], "aGroup": ["disposable carrier, everyday reading, informational processing skills, invariable"], "bGroup": ["re-experience, reassess, shift its meaning, full reader participation, dynamic"], "answers": ["dynamic participation"]}, {"id": "27ST_E_13_01", "difficulty": "높음", "title": "아리스토텔레스의 목적론적 자연관과 최종 원인", "abstract": "Aristotle argues that regularity in nature is linked to purposefulness, suggesting that all natural things occur for a specific final cause.", "keyIndex": 5, "sentences": ["In the Physics, Aristotle asks whether nature acts for the sake of something.", "He offers an account of rain as water that rises when heated by the Sun, then cools, condenses, and falls to Earth, but is not particularly concerned with explaining rain as such.", "Rather, he addresses a more general question: how to account for natural objects, events, and processes that appear with regularity.", "He queries whether the sharpness of front teeth and the bluntness of molars is coincidental and rejects that possibility, because this arrangement occurs with regularity and that regularity is linked to purposefulness.", "The sharpness of front teeth allows them to tear while the bluntness of those in the back enables them to crush food; both are useful for eating.", "In Aristotle’s view, all natural things happen in a given way and occur for the sake of something; that is the final cause."], "aGroup": ["coincidental, explaining rain as such"], "bGroup": ["acts for the sake of something, appear with regularity, linked to purposefulness, useful for eating, the final cause"], "answers": ["purposeful regularity"]}, {"id": "27ST_E_13_02", "difficulty": "보통", "title": "비판단적 아이디어 생성을 통한 창의적 성공 도출", "abstract": "Creative quality stems from the quantity of ideas, emphasizing processes of creating possibilities without immediate judgment.", "keyIndex": 1, "sentences": ["AI is a prolific idea generator. Human brainstorming groups tend to focus on the quality of creative ideas and almost immediately lean into variations of first suggestions, but good ideas are more likely when groups focus first on quantity.", "As Linus Pauling put it, The best way to have a good idea is to have lots of ideas.", "Psychologist Dean Keith Simonton called this the equal odds rule arguing that creative success is correlated to the total number of works created.", "Many studies have confirmed that creative quality comes from quantity of ideas, and one Stanford study pegged the number of ideas that distinguish a successful product from a failure at more than two thousand.", "This is why design thinking and innovation are so focused on the processes of creating possibilities without judgment."], "aGroup": ["quality of creative ideas, lean into variations of first suggestions, judgment"], "bGroup": ["prolific, focus first on quantity, lots of ideas, total number of works created, quantity of ideas, more than two thousand, creating possibilities without judgment"], "answers": ["quantity breeds quality"]}, {"id": "27ST_E_13_03", "difficulty": "높음", "title": "타인 공감에 있어서 신체적 내부 감각의 핵심적 역할", "abstract": "Empathy is achieved through interoception, where the body acts as a bridge by mimicking others' expressions and sensing their feelings within ourselves.", "keyIndex": 2, "sentences": ["Becoming aware of our internal sensations can help us handle our own emotions.", "Perhaps more surprisingly, the body’s interoceptive faculty can also bring us into closer contact with other people’s emotions.", "That’s because the brain, on its own, has no direct access to the contents of other people’s minds.", "Interpreting others’ spoken words and facial expressions may yield only a coolly abstract sense of the emotions that stir within.", "The body acts as a critical conduit, supplying the brain with the visceral information it lacks.", "When interacting with other people, we subtly and unconsciously mimic their facial expressions, gestures, posture, and vocal pitch.", "Then, via the interoception of our own bodies’ signals, we perceive what the other person is feeling because we feel it in ourselves.", "We bring other people’s feelings onboard, and the body is the bridge.", "In an act similar to taking a bite off our partner’s plate, we are sampling their emotions."], "aGroup": ["the brain on its own, no direct access, interpreting words and expressions, coolly abstract sense"], "bGroup": ["interoceptive faculty, contact with other people's emotions, critical conduit, visceral information, mimic, feel it in ourselves, sample their emotions"], "answers": ["interoceptive bridge"]}, {"id": "27ST_E_13_04", "difficulty": "높음", "title": "기술의 과도한 확장과 인간 능력의 상실", "abstract": "Every technological extension of man functions as an amputation, potentially arresting the natural evolution of higher human faculties.", "keyIndex": 6, "sentences": ["The strongest criticisms of the overextension of technology involve claims of dehumanization, and these arguments are not new.", "Marshall McLuhan was primarily a techno-utopian, but he was also a critical thinker, who cautioned decades ago against too much human extension into technology.", "McLuhan famously claimed that every media extension of man is an amputation.", "For example, once we have a car, we don’t walk; once we have a computer hard-drive, we don’t have to remember; no one can find their way about without GPS.", "Based on McLuhan’s philosophy, we are becoming post-literate because we rely on screens full of pictures, rather than print media.", "It is thus possible that extensions of human faculties will bring about arrested development in the natural evolution of higher human faculties."], "aGroup": ["overextension of technology, human extension into technology, media extension, car, hard-drive, GPS, screens"], "bGroup": ["dehumanization, amputation, don't walk, don't remember, post-literate, arrested development in the natural evolution"], "answers": ["technological amputation"]}, {"id": "27ST_E_14_01", "difficulty": "보통", "title": "관점과 배경지식 차이에 따른 경험 공유의 복잡성", "abstract": "Sharing an experience does not mean sharing a meaning, as individuals interpret events based on their unique perspectives and background knowledge.", "keyIndex": 1, "sentences": ["Sharing meanings and experiences is not a simple, automatic process: whenever two or more people observe or participate in the same ongoing event they experience it from different perspectives, with different histories, with different background knowledge.", "These differences are most glaring when the individuals involved include an infant or very young child and an adult, although an adult arranging an event for an infant may find it difficult to keep these differences in mind.", "When giving a bath, for example, a parent whose experience with water play has been fun, whose knowledge about the source of the water and its disposition provides confidence, and whose body control ensures that the baby is safely held and not in danger, expects the infant to enjoy splashing water.", "Yet the baby may make it clear that her perspective is quite different from that of the adult.", "The two share an experience, but not a meaning."], "aGroup": ["terrified crying, quite different from that of the adult, not a meaning"], "bGroup": ["fun, confidence, safely held, enjoy splashing water"], "answers": ["shared experience perspectives"]}, {"id": "27ST_E_14_02", "difficulty": "높음", "title": "과학적 발견에서 공로와 날짜 할당의 현실적 어려움", "abstract": "Daily scientific practice is a disordered array of observations, making it difficult to clearly assign credit and dates to discoveries.", "keyIndex": 1, "sentences": ["A detailed anthropological study of daily scientific practice in the Salk Institute laboratory in La Jolla, California shows how difficult it is to assign credit and dates.", "Bruno Latour describes how scientists arrived at the elucidation of TRF, a hormone that is secreted by the brain.", "He says that his observations led him to the conviction that a body of practices widely regarded by outsiders as well organized, logical, and coherent, in fact consists of a disordered array of observations with which scientists struggle to produce order.", "The final consensus formulation of TRF emerged some time between January 1968 and January 1970.", "Half of the Nobel Prize in Medicine for 1977 for this discovery was shared between the Salk group and another competing group in New Orleans, but each of these two competing groups strongly felt that they deserved sole credit and that the other did not deserve even a share of the award."], "aGroup": ["well organized, logical, and coherent, scientific fact"], "bGroup": ["difficult to assign credit and dates, disordered array of observations, struggle to produce order, strongly felt that they deserved sole credit"], "answers": ["assigning credit difficulty"]}, {"id": "27ST_E_14_03", "difficulty": "보통", "title": "음악 감독의 존재와 무대 작품 몰입의 미학적 관계", "abstract": "Audiences fulfill their aesthetic experience by taking in the whole stage work rather than being aware of the conductor's techniques.", "keyIndex": 3, "sentences": ["The idea of music direction, in the sense of someone shaping and leading a musical performance, goes back to the beginnings of music.", "Even the gamelans of ancient Indonesia had leaders who would signal to the group changes of meter and tempo, beginnings and endings, and transitions from piece to piece.", "Yet listening audiences are rarely aware of any musical leadership, and for good aesthetic reason.", "They need not be aware to fulfill their experience; indeed, the unnecessarily conspicuous presence of a musical leader will detract from it.", "An audience is better off, for the most part, taking in the whole of a stage work rather than being party to the techniques that go into realizing it.", "This is not to say that when an orchestra plays alone the audience members’ eyes are not fixed on the conductor for the majority of the time; they probably are.", "When music is accompanying something happening on stage, however, all eyes turn to the stage, and so do everyone’s ears, too."], "aGroup": ["shaping and leading, conspicuous presence, techniques that go into realizing it, fixed on the conductor"], "bGroup": ["rarely aware of any musical leadership, fulfill their experience, taking in the whole of a stage work, all eyes turn to the stage"], "answers": ["unaware aesthetic immersion"]}, {"id": "27ST_E_14_04", "difficulty": "보통", "title": "독해 과정에서 사전 지식의 결정적 역할", "abstract": "A reader's prior knowledge about a topic is the x-factor that determines comprehension more than general reading skills.", "keyIndex": 8, "sentences": ["The importance of what a reader brings to the page is highlighted in a study discussed by Hirsch in The Knowledge Deficit.", "This study consisted of two groups of students who were asked to read a passage about baseball.", "The first group was made up of strong readers who knew little about baseball.", "The second group was composed of struggling readers who were knowledgeable about baseball.", "After reading the passage, students in each group had their comprehension tested.", "Guess which group scored higher? The struggling readers.", "Having strong reading skills was not enough for the students who came to the page with a knowledge deficit about the topic.", "Though the second group of readers were not strong readers, their prior knowledge enabled them to outscore readers with far better abilities.", "Prior knowledge, or, in the case of the good readers, the lack of prior knowledge, was the x-factor."], "aGroup": ["strong readers, having strong reading skills, far better abilities"], "bGroup": ["what a reader brings to the page, knowledgeable about baseball, prior knowledge, the x-factor"], "answers": ["prior knowledge x-factor"]}, {"id": "27ST_E_15_01", "difficulty": "보통", "title": "운동 수행 향상 및 지속성을 위한 감정의 전략적 활용", "abstract": "Exercise instructors can strategically use emotions, from enjoyment to anger, to elicit greater effort and enhance sports performance.", "keyIndex": 1, "sentences": ["The use of emotion may be important in exercise, particularly among exercise instructors.", "It has been established that exercise enjoyment is associated with increased exercise adherence.", "An instructor might aim to foster enjoyment in his participants as a means of increasing their program adherence.", "An instructor also might use emotion to elicit greater effort from her students.", "Cuing participants to feelings of anger and frustration during a cardio kickboxing class might lead to more effortful punches and stronger kicks.", "Conversely, a yoga instructor could use positive emotions or emotion-related states such as compassion to get her students in the proper mindset for their practice.", "Evidently, there are a number of ways emotions could be used to enhance performance in sport and exercise."], "aGroup": ["negative feelings without purpose, lack of emotion"], "bGroup": ["use of emotion, foster enjoyment, increasing adherence, elicit greater effort, proper mindset, enhance performance"], "answers": ["strategic emotion use"]}, {"id": "27ST_E_15_02", "difficulty": "보통", "title": "정밀도 확보를 위한 측정 기기 사용의 기본 규칙", "abstract": "Precision in measurement is reflected in recording the maximum possible number of digits to reach a device's optimum capability.", "keyIndex": 1, "sentences": ["The most fundamental rule regarding the use of any measuring device is that the device should always be read to its optimum capability with regard to precision.", "Precision is reflected in the number of digits in a measurement; the more digits this measurement has, the more precise it is.", "For example, the measurement 345.2 inches is more precise than the measurement 345 inches.", "If it is possible to obtain the first digit to the right of the decimal point from a device, then that digit should be recorded; if it is possible to obtain the second digit to the right of a decimal point, then that digit should be recorded, and so on.", "Thus, a laboratory worker should endeavor to obtain the most digits possible from whatever device is being used whether it is digital or nondigital."], "aGroup": ["fewer digits, rounding off, 345 inches, less precise"], "bGroup": ["optimum capability with regard to precision, more digits, 345.2 inches, maximum possible number of digits"], "answers": ["optimum precision digits"]}, {"id": "27ST_E_15_03", "difficulty": "높음", "title": "객체의 군집화 증명을 통한 수학적 추상화의 효율성", "abstract": "Mathematics saves time and effort through abstraction, clustering objects into classes to prove properties for the whole group at once.", "keyIndex": 1, "sentences": ["The standard school mathematics curriculum doesn’t stress enough that mathematics is all about abstraction.", "Mathematicians study specific objects but, usually, they aim to cluster them together and study them all at the same time.", "This saves huge amounts of time and effort because they must prove properties only once, for the whole class of objects, instead of studying each object individually.", "Even more importantly, this guarantees that every object within a class has a particular property, even the objects that haven’t been defined yet.", "Often, when mathematicians want to prove that an important object behaves in a particular way, they prove instead that it belongs to a class already known to have this property.", "We reason similarly in everyday life: since all fruits have seeds, and an apple is a fruit, then an apple must have seeds."], "aGroup": ["studying each object individually, specific objects"], "bGroup": ["abstraction, cluster them together, the whole class of objects, saves huge amounts of time, guarantees property"], "answers": ["mathematical abstraction"]}, {"id": "27ST_E_15_04", "difficulty": "높음", "title": "속임수 없이도 치료 효과를 유발하는 개방형 플라세보", "abstract": "Open placebo treatments demonstrate that deception is not necessary to trigger significant medical improvements, as long as patients are informed.", "keyIndex": 2, "sentences": ["Because belief is so crucial in the placebo effect, it would seem that deception is necessary in order to trigger a patient’s trust in the actual drug he might be taking.", "But Ted Kaptchuk, a leading placebo researcher at Harvard, is investigating the possibility of doing away with the element of deception.", "He tells patients up front that they will be taking a placebo, but he also informs them about how powerful and effective placebos can be.", "In one trial with irritable bowel syndrome, it was found that roughly 59 percent of those on an open placebo treatment reported improvements, as compared with 35 percent of the control group that received no treatment.", "The results may seem modest, but they make the point that giving a placebo isn’t the same as doing nothing."], "aGroup": ["belief is so crucial, deception is necessary"], "bGroup": ["doing away with the element of deception, tells patients up front, open placebo treatment, isn't the same as doing nothing"], "answers": ["open placebo treatment"]}, {"id": "27ST_E_16_01", "difficulty": "높음", "title": "온라인 독자를 사로잡는 두괄식 글쓰기의 필요성", "abstract": "Online writing requires an upfront conclusion and an attention-grabbing hook to satisfy impatient readers, unlike the traditional academic style.", "keyIndex": 4, "sentences": ["In academia, you are taught to write up your results thus: I came up with a hypothesis, then I did this experiment, and then I did another experiment, then I tested my ideas some more, and so on until ta-da! I proved this.", "If you wrote this way online, very few of your readers would make it to your dramatic conclusion, no matter how exciting or groundbreaking it was.", "Online, we don’t have the patience to wait for your big reveal at the end.", "Instead, you need to tell us up front: I proved this! And here’s how I know it...", "Your readership may still dwindle and trail off over the course of your writing, but at least the vast majority know what it is you’ve achieved from the very beginning.", "A few more of them may stay along for the ride if the opening line — the hook, in journalistic terms — is particularly interesting.", "If you grab their attention early, you can more likely convince more readers to stay for the whole story."], "aGroup": ["academia, hypothesis first, wait for big reveal, dramatic conclusion, long experiment process"], "bGroup": ["online writing, up front, from the very beginning, opening line, hook, grab attention early"], "answers": ["upfront conclusion"]}, {"id": "27ST_E_16_02", "difficulty": "보통", "title": "뇌의 유연한 다중 경로 인식: 대리 기능", "abstract": "The brain utilizes multiple routes to recognize objects in uncertain environments, a biological flexibility known as vicarious functioning.", "keyIndex": 5, "sentences": ["The human perceptual system is designed to recognize objects under changing illuminations, situations, and contexts.", "It is extraordinarily adapted to a constantly changing world.", "To deal with this uncertainty, the brain uses not one, but multiple routes.", "If one is blocked, it takes another route.", "This immense flexibility of the brain to rely on changing cues, according to whatever is available, is known as vicarious functioning.", "It can be found in most biological systems.", "For instance, migrating birds fly thousands of miles and may rely on the stars to navigate.", "But if it’s a cloudy day, they may instead rely on landmarks or their magnetic sense.", "Similarly, the brain can recognize a face by the shape of the eyes, nose, and mouth.", "In extreme cases, only a few lines are sufficient, as when we recognize the face of a celebrity in caricatures made with just a few pencil strokes.", "Face recognition also functions even when parts of a face are covered and internal features such as eyes are hardly visible.", "In this case, the brain relies on external features such as hair and head shape."], "aGroup": ["uncertainty, blocked route, cloudy day, covered internal features, changing illuminations"], "bGroup": ["multiple routes, immense flexibility, vicarious functioning, landmarks, magnetic sense, external features"], "answers": ["vicarious functioning"]}, {"id": "27ST_E_16_03", "difficulty": "보통", "title": "비르 타윌: 국경 갈등이 만든 어느 나라도 원치 않는 땅", "abstract": "Due to overlapping colonial borders, Egypt and Sudan both reject Bir Tawil to claim the more valuable Hala’ib Triangle.", "keyIndex": 7, "sentences": ["Bir Tawil is a strange place.", "In January 1899, administrators of the British Empire decided to finalize a border between the countries of Egypt and Sudan.", "In colonial fashion, they decided to use the conveniently straight line of the twenty-second parallel of latitude.", "Unsurprisingly, this new international border arbitrarily tore through local tribes and communities, and in 1902, the British drew a new line to reflect tribal territories.", "The combination of these two intersecting lines brought about the creation of two new areas: the large, inhabitable coastal area called the Hala’ib Triangle and an empty, landlocked patch of desert, which is Bir Tawil.", "To keep the desirable Hala’ib, Egypt understandably claimed the original, straight border of 1899, whereas Sudan — with the same goal in mind — claimed the new 1902 line.", "The strange result of this long-standing conflict is that, to this day, both countries refuse to claim Bir Tawil, an area of land roughly the size of London, as it would mean giving up a greater prize.", "This makes Bir Tawil the largest — perhaps the only — piece of land that no country wants."], "aGroup": ["Hala’ib Triangle, desirable area, inhabitable coastal area, greater prize"], "bGroup": ["Bir Tawil, empty desert, landlocked patch, no country wants, refuse to claim"], "answers": ["refuse to claim"]}, {"id": "27ST_E_16_04", "difficulty": "높음", "title": "준거 집단이 자아 평가에 미치는 세 가지 효과", "abstract": "Reference groups influence self-evaluation through normative imitation, negative comparison, or pride through association.", "keyIndex": 6, "sentences": ["An in-group can become a reference group, a group that is used as the frame of reference for evaluating one’s own behavior.", "Members of a volunteer organization, for example, may evaluate themselves by the standards of the group and feel proud about their contribution to a community service project.", "This positive self-evaluation reflects the normative effect of a reference group whose members share the same view of themselves.", "If other members of your reference group (say, your parents) have high self-esteem, you, too, are likely to share that norm and have high self-esteem.", "The normative effect basically involves imitating the reference group.", "However, reference groups can also have comparison effects and associative effects on self-appraisals.", "If most of your classmates shine in academic achievement, you are likely to compare yourself with them.", "As a result, you may have a negative self-evaluation, feeling that your academic performance is not up to par.", "Being associated with the brilliant group, though, makes you feel proud of yourself, basking in reflected glory."], "aGroup": ["comparison effects, negative self-evaluation, not up to par, feel inferior"], "bGroup": ["normative effect, imitating, associative effects, reflected glory, proud of yourself"], "answers": ["reference group effects"]}, {"id": "27ST_E_16_05", "difficulty": "보통", "title": "음악적 지각에서의 음고 근접성과 그룹화 원리", "abstract": "In music, notes similar in pitch are perceived as a single group or melody due to the principle of proximity.", "keyIndex": 1, "sentences": ["In music, proximity may refer to elements’ being close together in pitch, time, or space.", "For example, notes that are similar in pitch may be grouped together.", "Notes are also grouped together if they are played together in time or if they come from the same instrument or section of a larger musical group.", "To get a sense of the idea of proximity, imagine a person playing a piano.", "Typically, the right hand plays notes that are higher in pitch than the left hand.", "Also, most often, it is the right hand that plays the melody, whereas the left hand plays the bass line or accompaniment.", "Even though all of the notes are played in close spatial proximity and at approximately the same time, we hear the notes from the right hand emerging as melody because they are grouped together with respect to pitch.", "Similarly, in some of Bach’s famous solo music for violin, the violinist essentially creates two streams of music by simultaneously playing both high and lower notes.", "Perceptually, we group the high notes together and group the low notes together, so we hear it as polyphonic or as two lines of music."], "aGroup": ["spatial proximity, same time, accompaniment, bass line"], "bGroup": ["pitch proximity, grouped together, emerging as melody, two streams, polyphonic"], "answers": ["pitch proximity"]}, {"id": "27ST_E_16_06", "difficulty": "높음", "title": "시장 경제에서 공공재의 저평가와 실제 가치 사이의 격차", "abstract": "Public goods like wetlands are often undervalued in markets due to their zero price, despite their immense actual value to society.", "keyIndex": 8, "sentences": ["Public goods are undervalued in markets, which exist for private goods but rarely for public goods.", "For example, aquatic habitats such as wetlands provide diverse benefits that are often public goods, including breeding or refuge for unique species, recreation, hunting and tourism, or purification of water supplies.", "These benefits are enjoyed simultaneously by many people and are provided to them for free by the natural functioning of the wetlands.", "As a result, there is no market and thus no price for these public good uses of wetlands.", "But the actual value of these services is not zero.", "Because many people benefit from these services, their value is the total additional benefits of all individuals who enjoy provision of these services by wetlands.", "This value could be huge, even though there is no apparent market price for these wetland services.", "This gap between the (zero) price for wetland services and their actual value to all beneficiaries indicates how much these public goods are undervalued in markets."], "aGroup": ["market price, zero price, no market, undervalued"], "bGroup": ["actual value, diverse benefits, total additional benefits, huge value, gap"], "answers": ["undervalued public goods"]}, {"id": "27ST_E_17_01", "difficulty": "보통", "title": "가치를 창출하는 딥 워크와 착각을 주는 섈로 워크의 대조", "abstract": "Deep work pushes cognitive capabilities to create new value, whereas excessive shallow work only gives the illusion of being busy without real output.", "keyIndex": 7, "sentences": ["Deep work is when you perform an activity with deep concentration that pushes your cognitive capabilities, and by doing so create new value and improve your skills.", "These efforts are hard to replicate; and to be able to do deep work, we need a distraction-free environment.", "For many people though, we spend far too much time on the other end of the scale, doing what is referred to as shallow work.", "This style of working is not cognitively demanding but is rather an execution of logical-type tasks that rarely create new value.", "We often perform these tasks while we are distracted.", "Shallow work has its place, both because routine-type tasks need to be done and because we cannot spend our entire time doing deep work.", "The problem with too much shallow work is that we feel busy, maybe even stressed, but we rarely see any output reflecting our experienced effort."], "aGroup": ["shallow work, execution of logical-type tasks, routine-type tasks, distracted, feel busy, rarely see any output"], "bGroup": ["Deep work, deep concentration, pushes your cognitive capabilities, create new value, improve your skills, efforts hard to replicate, distraction-free environment"], "answers": ["create new value"]}, {"id": "27ST_E_17_02", "difficulty": "보통", "title": "합의된 상징을 통한 주관적 현실의 형성 및 공유 메커니즘", "abstract": "People's subjective realities are formed and shared through agreed-upon symbols like language, without which social confusion arises.", "keyIndex": 4, "sentences": ["Symbols are instrumental in helping people derive meanings from social situations.", "In social encounters, each person’s interpretation or definition of a given situation becomes a subjective reality from that person’s viewpoint.", "We often assume that what we consider to be reality is shared by others; however, this assumption is often incorrect.", "Subjective reality is acquired and shared through agreed-upon symbols, especially language.", "If a person shouts Fire! in a crowded movie theater, for example, that language produces the same response in all of those who hear and understand it.", "When people in a group do not share the same meaning for a given symbol, however, confusion results; for example, people who did not know the meaning of the word fire would not know what the commotion was about.", "How people interpret the messages they receive and the situations they encounter becomes their subjective reality and may strongly influence their behavior."], "aGroup": ["interpretation or definition, subjective reality, how people interpret the messages, confusion"], "bGroup": ["symbols, agreed-upon symbols, language, shared by others"], "answers": ["agreed-upon symbols"]}, {"id": "27ST_E_17_03", "difficulty": "높음", "title": "다양한 원인과 증상의 복합체로서의 우울증", "abstract": "Depression is not a single disease but a complex collection of symptoms with diverse causes and no single universal treatment.", "keyIndex": 4, "sentences": ["Depression is terrible, and it is common.", "Roughly one in seven people will experience at least one full-blown depressive episode in their lifetime.", "It is a tragedy on an individual and a societal level, yet we — and by we, I mean all of us, including doctors — struggle to grasp it.", "This is because depression is not one disease; it is a collection of symptoms that appears similar across sufferers, despite resulting from a melting pot of diverse causes and mechanisms.", "There is no single reason for depression: one person’s depressive episode seems to clearly stem from recent life events, another from historic trauma and loss, yet another out of the blue, with no clear psychological or social cause whatsoever.", "There is also no one presentation of depression: in fact, there are 227 possible symptom combinations that meet the diagnostic criteria for major depressive disorder.", "Perhaps understandably, there is no one treatment for this condition, either.", "Antidepressants lead to improvement in roughly a third of patients, offer some kind of improvement in another third, while a final third remain completely unaffected."], "aGroup": ["struggle to grasp it, no one treatment, remain completely unaffected"], "bGroup": ["not one disease, melting pot of diverse causes, no single reason, no one presentation"], "answers": ["not one disease"]}, {"id": "27ST_E_17_04", "difficulty": "보통", "title": "철학 논증의 핵심 근거로서 작용하는 유추의 기능", "abstract": "In philosophy, analogies function not only as simple illustrations but also as integral parts of arguments to derive specific conclusions.", "keyIndex": 4, "sentences": ["Analogies can serve two different functions in philosophy.", "Sometimes, as seems often the case in Plato, for example, they serve simply to illustrate.", "When Socrates compares the Good with the sun, he may simply be using the image of the sun to help bring to life his arguments about the Good.", "On other occasions, however, the analogy can be an integral part of an argument.", "Consider one of the most popular arguments for the existence of God, the argument from design, which has been advanced by many thinkers, from the ancient Stoics to British theologian William Paley.", "The argument holds that just as an artefact such as a watch implies the existence of an artisan, so the universe implies the existence of a divine creator.", "Here the analogy with the watch is not meant simply to illustrate a point.", "Rather, the analogy is supposed to show why we should conclude that the universe has a creator."], "aGroup": ["simply to illustrate, help bring to life, not meant simply to illustrate"], "bGroup": ["integral part of an argument, implies the existence, show why we should conclude"], "answers": ["integral part"]}, {"id": "27ST_E_17_05", "difficulty": "보통", "title": "상태 변화의 과정이자 축적된 결과로서의 회복", "abstract": "Recovery is understood both as an outcome representing restored physiological and psychological resources and as the process determining that outcome.", "keyIndex": 1, "sentences": ["Recovery can be considered a process as well as an outcome.", "Recovery as an outcome refers to one’s physiological and psychological state after a certain recovery period, which can be, for instance, at the end of the day, after engaging in a certain activity, or after waking up.", "Physiological recovery outcomes involve the restoration of physiological resources such as muscle strength, heart rate, and the absence of physical fatigue.", "Psychological recovery outcomes relate to the restoration of mental resources such as attention, motivation, mental energy, and mood.", "As such, one’s physiological and psychological states
