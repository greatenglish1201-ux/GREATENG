 act as a resource that functions as a stress-buffer for upcoming activities as well.", "Recovery as a process refers to those activities and experiences that result in a change in one’s physiological and psychological state.", "Accordingly, recovery processes precede recovery outcomes and, consequently, determine whether adequate recovery is obtained.", "Regarding recovery processes, physical inactivity is generally considered the most effective way to restore physiological resources."], "aGroup": ["process, activities and experiences that result in a change, precede recovery outcomes"], "bGroup": ["outcome, state after a certain period, restoration of resources, stress-buffer"], "answers": ["process and outcome"]}, {"id": "27ST_E_17_06", "difficulty": "높음", "title": "고난과 시련이 삶의 깊은 의미 형성에 미치는 긍정적 역설", "abstract": "Difficult and stressful past experiences may lower general happiness but ultimately help people feel their lives are more meaningful.", "keyIndex": 9, "sentences": ["The difficult times that we endure play a key role in helping us to lead more meaningful lives.", "As Jean-Paul Sartre put it, Human life begins on the far side of despair.", "That is, many of the ways people feel their lives are meaningful are grounded in the sufferings they have experienced.", "One research project investigated the differences between people who found their lives to be happy and those who found them to be meaningful.", "While, on average, happy lives and meaningful lives overlap a great deal, the researchers focused on those aspects of a meaningful life that were distinct from happiness.", "And, remarkably, they found that people who had more meaningful lives reported that they had more experience suffering through past negative events.", "They also reported worrying more and enduring more things that caused them stress.", "On the other hand, these past experiences with suffering tended to reduce people’s overall levels of happiness.", "Our sufferings, then, seem to help to provide people with the sense that their lives are more meaningful, even if these events are associated with lower feelings of happiness."], "aGroup": ["difficult times, despair, sufferings, negative events, things that caused them stress, reduce overall levels of happiness"], "bGroup": ["more meaningful lives, distinct from happiness, sense that their lives are more meaningful"], "answers": ["meaningful through sufferings"]}, {"id": "27ST_E_18_01", "difficulty": "보통", "title": "오래된 트랙터의 생존 비결: 기계적 품질이 아닌 사람들의 각별한 애정", "abstract": "The survival of classic tractors in Ireland is attributed not to their build quality but to the deep fondness people have for them.", "keyIndex": 7, "sentences": ["There are estimated to be more than 160,000 farms spread across Northern Ireland and the Republic of Ireland combined.", "On all of those farms, you will find barns, and in some of those barns, you might be fortunate enough to stumble across a classic tractor like the Massey Ferguson 35.", "Production of the Massey Ferguson 35 in the UK and the USA stopped in 1964.", "If you were to strike up a conversation with a farmer who still owns one, she might well give the chassis of her Massey Ferguson 35 an affectionate tap and nostalgically remark, They don’t make ’em like that anymore.", "The fact that the tractor has survived at least fifty-eight years seems to provide evidence of its superior build quality.", "But wait — how long did the other 388,381 Massey Ferguson 35 tractors produced between 1956 and 1964 last before they went for scrap?", "Rather than build quality, it might well be the fondness that people in Ireland have for the little red tractor that has led farmers there to hold on to their Massey Fergusons and take care of them as well as they have."], "aGroup": ["superior build quality, They don't make 'em like that anymore"], "bGroup": ["affectionate tap, nostalgically remark, fondness, hold on to their Massey Fergusons"], "answers": ["people's fondness"]}, {"id": "27ST_E_18_02", "difficulty": "높음", "title": "위기 유형 및 연령대에 따른 매체 선호도의 차이와 상호보완적 역할", "abstract": "Traditional and social media play complementary roles during crises, as people's preferences vary based on the crisis type and their age group.", "keyIndex": 5, "sentences": ["During crises that present immediate danger, people seek trusted and verified sources to ease their immediate concerns, thus turning to traditional sources such as television and radio.", "For other crisis types, such as public health and political crises, however, people are more likely to turn to social media where they can seek multiple voices and a variety of expert opinions, as, unlike the first set of crises, public health and political crises may be more subjective and less straightforward, and thus necessitate a deeper dive into supplementary information and evidence.", "In addition to the type of crisis at hand, Liu, a communication scholar, and colleagues argued that traditional and social media have different effects on different audiences regarding the motivation to follow instructions and recommended behaviors during crises.", "For example, although younger audiences seem to favor social media to traditional media sources during times of crisis, older audiences indicate a preference for traditional media.", "Thus, both traditional and social media play a prominent role in delivering important scientific information to the public during crises."], "aGroup": ["immediate danger, trusted and verified sources, older audiences, traditional sources"], "bGroup": ["subjective and less straightforward, multiple voices and a variety of expert opinions, younger audiences, social media"], "answers": ["complementary media"]}, {"id": "27ST_E_18_03", "difficulty": "높음", "title": "변덕스러운 결과를 낳는 초점점의 합리적 행동 조정 메커니즘", "abstract": "Focal points, though seemingly small, prompt rational coordination among people, leading to unpredictable but self-sustaining social equilibria.", "keyIndex": 7, "sentences": ["Focal points are the little things that make a big difference — the difference between reaching one equilibrium and reaching another.", "If a local soccer team comes to practice near the playground of the park every Saturday morning or a group of stay-at-home parents arranges a regular trip at 3 P.M. on a Wednesday afternoon, that can create a focal point around which others coordinate.", "With the team at practice, the park will feel safe from muggers and there will be something to look at, so families will come along to use the park.", "Other families will come because the first families will be there; after the soccer season is over and the team no longer comes to practice, Saturday mornings can still be lively at the playground simply because everybody expects that they will be.", "A lively park playground can be created by a soccer practice that doesn’t even take place any longer.", "That is an indication of how whimsically unpredictable these multiple equilibria can be.", "Yet while the outcome is whimsical, the causes are rational."], "aGroup": ["lively playground without practice, whimsically unpredictable, outcome is whimsical"], "bGroup": ["little things, coordinate, feel safe, everybody expects, causes are rational"], "answers": ["focal points"]}, {"id": "27ST_E_18_04", "difficulty": "높음", "title": "낡은 역사 영화 매체를 통해 비로소 드러나는 현재의 비가시성", "abstract": "The invisible cultural background of the present becomes visible through culturally dated films or modern historical dramas that anachronistically project present norms.", "keyIndex": 3, "sentences": ["As the set of cultural norms and categories taken for granted at any particular time, the present is normally more or less invisible to those who participate in it.", "It is the unthought background of their thought and action, like water to a fish, or air to a dove.", "In films, this background can sometimes become visible as a bygone present in a film that is not just historically but culturally dated.", "In the culturally dated film, attitudes and ways of behaving that have altered over time and which now appear as quaint, strange, incorrect or problematic, are taken for granted by the characters in the film, and go unquestioned or are even happily endorsed in the film’s narrative.", "The present is also visible in contemporary historical dramas that read the past in terms of the present, anachronistically importing modern attitudes into the past they portray.", "This is something that is doubly evident in dated historical films that read the past in terms of their present, where the anachronisms are themselves reflective of a bygone present."], "aGroup": ["invisible, unthought background, taken for granted"], "bGroup": ["become visible, bygone present, anachronistically importing, anachronisms"], "answers": ["invisible present"]}, {"id": "27ST_E_19_01", "difficulty": "보통", "title": "18세기 의복의 수선 관행: 값비싼 직물 비용으로 인한 경제적 생존 방식", "abstract": "In the eighteenth century, expensive textiles compared to cheap labor made altering and repurposing existing clothes a widespread economic practice.", "keyIndex": 5, "sentences": ["Women’s dresses from the eighteenth century offered a great opportunity for repurposing, as they were frequently fashioned from long, uncut lengths of fabric.", "Textiles were significantly more expensive than the labor it took to alter them, and as a result, most garments were modified numerous times to keep up with changes in fashion.", "Even the wealthy saved fabrics, remodeled clothes, and sold unwanted items in the secondhand market, observes fashion scholar Linda Welters.", "Sustainability was a way of life.", "Indeed, although change is inherent to fashion, remodeling existing clothing, rather than buying new, was a widespread practice.", "It is actually rare to find an eighteenth-century dress that does not show some sign of alteration.", "The cost of having a gown made, or remade, was only about half the cost of the textile itself and could be significantly less, depending on the type of fabric.", "In addition to updated dress silhouettes, accessories and trimmings played an important role in refreshing old clothing styles.", "For example, the addition of a row of lace to the upper part of a gown was an economical alternative to a full replacement of the gown.", "Many eighteenth-century dresses, particularly those from the first half of the century, were constructed with relatively crude stitches, indicating that the easy alteration of the original gown was a consideration.", "Because fabrics retained value even when they were not in fashion, hand-woven silks, cherished for their quality and beauty, were sometimes passed down through generations."], "aGroup": ["textiles were expensive, replacement of the gown"], "bGroup": ["repurposing, modified numerous times, remodeled clothes, alteration, economical alternative, retained value"], "answers": ["economical repurposing"]}, {"id": "27ST_E_19_02", "difficulty": "높음", "title": "뉴미디어 시대의 정보 접근성 증가와 신뢰성 검증의 위기", "abstract": "While new media technologies have democratized news access globally, the lack of regulation makes it difficult to discern the reliability of information.", "keyIndex": 12, "sentences": ["The rise of internet-based technologies means that news is produced, distributed, and consumed faster than ever before.", "However, the reliability of this news is questionable.", "Not all organizations or individuals putting out information spend time verifying the details or placing the facts in a wider context.", "People are confronted with overwhelming amounts of information not just on a daily basis, but via minute-by-minute updates transmitted to audiences around the globe.", "More than ever before, people are involved in organizing and managing the amount and type of news they receive.", "The internet means that, regardless of where we are in the world or what time of day it is, news can be accessed from broadcasters located anywhere on the planet.", "As new media such as mobile phones, computers, and other portable devices have become more affordable, compact, and embedded in everyday life, they have come to replace television and newspapers.", "For younger people, advances in technology form part of the world they were born into.", "But the ease of use and affordability of new media mean that they are an integral feature of the lives of people of all ages.", "For US sociologist Matthew Hindman, technological advances have made news more democratic, meaning that now people of all ages and from all social backgrounds can access it.", "Others fear that new media poses a threat.", "Information on the internet is often unregulated, so while it is more accessible than ever before, its reliability is difficult to discern."], "aGroup": ["reliability is questionable, not verifying the details, unregulated, reliability is difficult to discern"], "bGroup": ["accessed anywhere, replace television, democratic, more accessible, affordability"], "answers": ["questionable reliability"]}, {"id": "27ST_E_19_03", "difficulty": "높음", "title": "생산성 향상에도 심화되는 전 세계적 노동 과로와 계층 양극화 현상", "abstract": "Despite productivity gains, structural economic forces since the 1970s have led to worldwide overwork for professionals and chronic underemployment for the less skilled.", "keyIndex": 10, "sentences": ["Since the 1970s, a combination of forces has made the problem of overwork more widespread.", "The service sectors in Western economies have grown dramatically while employment in manufacturing has declined.", "The shrinking of labor unions and workplace protections has let employers push for longer hours while global competition, decreased job security, and flat wages have forced workers to work harder to stay in place.", "Corporations now shed staff in the course of restructuring and process reengineering, forcing surviving workers to carry heavier workloads.", "The 2008 recession and recovery has reinforced a pattern in which companies seek to grow by increasing demands on existing workers rather than hiring new ones.", "A few industries have turned into fast-moving, winner-take-all contests: small numbers of people stand to make huge fortunes when their tech company goes public, their hedge fund investment pays off, or their song goes viral.", "As a result, many of us are actually working longer hours.", "Working hours generally decline with increased productivity, but in the 1970s, increased productivity ceased to yield shorter working hours, despite the expectations of generations of economists.", "Working hours started to rise in the United States in the 1980s, especially among salaried workers and professionals like doctors, lawyers, bankers, and academics; in contrast, working hours in less skilled, hourly professions began to fall.", "Since then, this divide has spread to other parts of the world: today, well-off, well-educated people in Western Europe, Australia, and South Korea are also more likely to be overworked, while poorer people struggle to find stable jobs and face chronic underemployment."], "aGroup": ["shrinking of labor unions, longer hours, carry heavier workloads, increasing demands"], "bGroup": ["salaried workers and professionals rise vs less skilled fall, divide, overworked vs chronic underemployment"], "answers": ["overwork and divide"]}, {"id": "27ST_E_19_04", "difficulty": "보통", "title": "국제 분쟁에서 단순화된 인지 틀(억지 대 갈등 나선)의 의존성과 한계", "abstract": "National leaders often rely on overly simplified cognitive frames like deterrence or conflict spiral views, whose effectiveness varies depending on the specific circumstances.", "keyIndex": 8, "sentences": ["Political psychologist Philip Tetlock examined the speeches made by policymakers involved in international conflicts.", "He noted that, in making important decisions, national leaders often fall back on overly simplified images of the world.", "During the Cold War between the United States and the Soviet Union, for example, two very simple images of the conflict were dominant.", "One of these was the deterrence view — that any sign of weakness would be taken advantage of by the opponent and that leaders needed to show their willingness to use military force.", "From a deterrence perspective, some demonstration of aggressiveness is often necessary as a preventive measure to stop the other side from aggressing against one’s group.", "People who hold a deterrence view — that demonstrations of weakness would be taken advantage of — are less likely to support nuclear disarmament.", "The other prominent view was a conflict spiral view, which presumed that every escalation of international threat leads the opponent to feel more threatened and that leaders need to demonstrate peaceful intentions in order to reduce the opponent’s own defensive hostilities.", "Tetlock noted that each of these cognitive frames was correct in some circumstances and incorrect in others.", "Against an opponent such as Hitler, a deterrence viewpoint might have been more effective than a view that led to conciliation.", "On the other hand, international policy experts estimate that the U.S. invasion of Iraq, argued by President G. W. Bush to be the centerpiece of the war on terror, seems to have curbed increases in the membership of Al-Qaeda."], "aGroup": ["deterrence view, demonstration of aggressiveness, US invasion of Iraq, curbed increases"], "bGroup": ["conflict spiral view, demonstrate peaceful intentions, conciliation"], "answers": ["overly simplified images"]}, {"id": "ABSO_TYPE_01_20", "difficulty": "보통", "title": "첫인상을 넘어선 다각적인 성격 분석의 필요성", "abstract": "It is necessary to analyze a person's personality from multiple aspects to avoid stereotyping beyond flashy first impressions.", "keyIndex": 7, "sentences": ["In the fast-paced world in which we live, it is tempting to notice someone’s flashy car or wild hairdo and conclude right away, Aha, I understand him!", "Almost everyone has the ability to read the cues that form first impressions, and most of us tend to stop there, or at least pay significantly less attention once we’ve made up our mind about someone.", "But why?", "Would we rush to the salesman’s office to sign a contract to buy a new sports car just because it looked fast?", "Not the prudent buyer.", "He would want to know more details about its engine, transmission, suspension, and more.", "Likewise, it is important to examine as many of the important aspects of a person’s personality as possible in order to gather enough information to form a complete and accurate impression without stereotyping or shortcut thinking."], "aGroup": ["flashy car, wild hairdo, looked fast, first impressions, stereotyping, shortcut thinking"], "bGroup": ["engine, transmission, suspension, important aspects of personality, complete and accurate impression"], "answers": ["avoiding stereotyping"]}, {"id": "ABSO_TYPE_01_21", "difficulty": "보통", "title": "잊혀진 그림 그리기 능력의 회복과 심미안 획득", "abstract": "Drawing can be rekindled with basic principles, leading to renewed pleasure and aesthetic appreciation of the world.", "keyIndex": 4, "sentences": ["Drawing, for many people, is a phantom skill.", "Crayon and colored pencil drawings of fancy princesses poured out onto the sketchbooks of the girls, while planes and ships, usually aflame, battled it out in the boys’ drawings.", "Occasionally boys drew princesses and girls drew gunboats, but whatever the subject matter, this robust period of drawing tended to phase out in most students’ lives and, by high school, drawing became the specialized province of those who provided the cartoons for the yearbook and made the posters for the prom.", "With just a primer on the basic elements of line-making, perspective, structure, and proportion, you can rekindle the love of drawing you left behind in the 4th grade.", "Achieving some confidence in drawing objects will get you started in the pleasure of this activity, and give you the basis for moving on to drawing figures.", "Also, your next visit to the museum will be both more gratifying and a chance to amaze your companions with your new-found aestheticism."], "aGroup": ["phantom skill, phase out, left behind in the 4th grade"], "bGroup": ["rekindle the love, achieving confidence, new-found aestheticism"], "answers": ["rekindling drawing"]}, {"id": "ABSO_TYPE_01_22", "difficulty": "보통", "title": "효과적인 변화를 이끄는 전문성과 정확한 지점 파악", "abstract": "Effective problem-solving relies not on the amount of time spent but on the expertise to know exactly where to apply effort.", "keyIndex": 7, "sentences": ["There is a very old story, often told to fill time during training courses, involving a man trying to fix his broken boiler.", "Despite putting in a lot of effort over many months, he simply can’t mend it.", "Eventually, he gives up and decides to seek the assistance of an expert.", "The engineer arrives, gives one gentle tap on the side of the boiler, and stands back as it springs to life.", "The engineer presents the man with a bill for the service rendered, and the man argues that he should be charged only a small fee as the job took the engineer only a few moments.", "The engineer quietly explains that the man is not paying for the time he took to tap the boiler but rather the years of experience involved in knowing exactly where to tap.", "Just like the expert engineer tapping the boiler, effective change does not have to be time-consuming.", "In fact, it can take less than a minute and is often simply a question of knowing exactly where to tap."], "aGroup": ["a lot of effort, many months, time-consuming, time he took to tap"], "bGroup": ["one gentle tap, years of experience, knowing exactly where to tap, effective change"], "answers": ["expertise to tap"]}, {"id": "ABSO_TYPE_01_23", "difficulty": "높음", "title": "대량 생산 체제의 진화와 개인 맞춤화의 실현", "abstract": "The mass production process has evolved from rigid standardization to a flexible system that allows for extensive customization.", "keyIndex": 3, "sentences": ["In 1913, when Henry Ford created the assembly line and dramatically improved the efficiency with which his company could manufacture cars, he proudly announced that customers could have his automobiles in any color they wanted as long as that color was black.", "In other words, in exchange for allowing customers to purchase a quality product at a low price, the assembly line model traded off the ability to build a large variety of cars for the ability to build standardized cars more efficiently.", "In the century since Ford revolutionized manufacturing, the mass production process has become increasingly flexible and efficient.", "Today, automobile manufacturers from Ford to BMW offer consumers the option of buying a car that has been customized using a variety of components.", "On a smaller scale, retailers such as Build-A-Bear charge customers a premium price for the opportunity to custom build their own products.", "Even Starbucks sells thousands of unique drinks that can be customized to the tastes of individual consumers through different combinations of milk, espresso, and other ingredients."], "aGroup": ["standardized, black color only, low variety, traded off variety for efficiency"], "bGroup": ["flexible, customized, variety of components, unique drinks, combinations"], "answers": ["flexible customization"]}, {"id": "ABSO_TYPE_01_24", "difficulty": "높음", "title": "외적 보상의 역효과와 내재적 흥미 상실", "abstract": "External rewards for sensible behavior can diminish intrinsic interest and hinder long-term habit formation in children.", "keyIndex": 5, "sentences": ["Do children do better at school if reinforced by gold stars, prizes or even monetary rewards?", "Do incentive plans increase productivity at work?", "Reinforcement theory says that giving rewards leads to repetition of the behavior rewarded and punishment reduces repetition.", "Given that most children love candy, reinforcement theory says that if you give candy to a child who has sat quietly in his or her chair for five minutes, that child will quickly learn to sit quietly all the time.", "Against the major principles of reinforcement, some behavioral scientists argue that the more you reinforce a person for doing a certain thing, the faster that person will lose interest in the very thing that they are being rewarded for.", "Some studies have shown that if you reward children for sensible behavior, they tend to see the behavior as a special-occasion thing rather than something to make a habit of, and therefore they are less likely to change in the long term than those not rewarded."], "aGroup": ["reinforcement theory, gold stars, prizes, monetary rewards, repetition of behavior"], "bGroup": ["behavioral scientists, lose interest, special-occasion thing, less likely to change in the long term"], "answers": ["diminishing interest"]}, {"id": "ABSO_TYPE_02_20", "difficulty": "높음", "title": "혐오 본능 극복을 통한 유전 공학(GMO)의 수용", "abstract": "Accepting genetic modification is critical for global food sustainability, despite our evolved disgust instinct toward alien technologies.", "keyIndex": 12, "sentences": ["Humans have evolved a high disgust instinct.", "That instinct may have evolved to protect us from disease.", "We’re instinctively disgusted by blood, bodily waste and rotting food.", "All of those, for our ancestors, were potential threats to survival.", "The disgust instinct also drove early opposition to medical technologies that seemed gross.", "The smallpox vaccine, blood transfusions, organ treatments, and fertility treatments all suffered from this early on.", "All are now accepted in society.", "Similarly, genetic modification of plants and animals seems alien and is likely to provoke our opposition by stimulating our instinct.", "However, as agriculture production and land resources stay the same or shrink, genetically modified organisms can be a critical tool in feeding the world, while improving environmental sustainability.", "They can contribute to a reduction in the amount of land, water and chemicals needed to produce more food.", "As we look at these facts, using genetic technology to improve our farming seems more and more attractive.", "It’s reasonable to be cautious but we’d better go against our hardwired emotional responses and accept the change."], "aGroup": ["disgust instinct, gross, alien, hardwired emotional responses, provoke opposition"], "bGroup": ["critical tool, feeding the world, sustainability, attractive, accept the change"], "answers": ["disgust and survival"]}, {"id": "ABSO_TYPE_02_21", "difficulty": "높음", "title": "역사적 객관성의 한계와 해석으로서의 역사", "abstract": "History is not a purely objective science but a figurative blend of fact and interpretation shaped by the historian's context.", "keyIndex": 5, "sentences": ["A century ago, historians had little difficulty with the notion that an objective account of history was possible.", "The historian Fustel de Coulanges lectured his colleagues in 1862, History is not pursued merely to entertain our curiosity.", "It is and should be a science.", "The library and the archive were laboratories, and historical evidence strictly tested and objectively presented could be used to prove, or disprove, hypotheses about the past.", "However, a historian is a person living in a time and place, not an objective observer.", "Some think that historians want to show the past as it happened.", "What stops them?", "The fact that the historian is a historical actor.", "As historian Carl Becker said, the history written by historians is a convenient blend of truth and fancy, of what we commonly distinguish as fact and interpretation.", "Cultural historian Hayden White put the matter even more bluntly.", "For White, the entire enterprise of doing history is akin to the tricks that men of letters play on their audiences all the time.", "History is always propaganda or flight of fancy.", "All history was figurative."], "aGroup": ["objective account, science, laboratories, strictly tested, disprove, fact"], "bGroup": ["historical actor, blend of truth and fancy, interpretation, tricks, propaganda, figurative"], "answers": ["fact and interpretation"]}, {"id": "ABSO_TYPE_02_22", "difficulty": "보통", "title": "내면의 가부장적 목소리 자각과 해방", "abstract": "Despite cultural flexibility, many people suffer from an inner patriarch echoing past values, requiring conscious awareness to overcome.", "keyIndex": 6, "sentences": ["You might argue that our culture has changed over many decades and that many people are allowing themselves more flexibility in their choices than a patriarchal system of the past would allow.", "Most women now are able to find fulfillment in work and creative pursuits as well as motherhood and relationships, and most men have more choice about the kinds of activities they are able to participate in too.", "But consider this: although we have so many more choices now, many of us live with feelings of internal guilt, confusion and self-criticism, and judgment of others as we go about our lives.", "Much of this negativity comes from our inner patriarch.", "So even though we have changed much on the outside, this inner voice still echoes the values of the past.", "Just as with any inner self, it is valuable to make the effort to become aware of this part of your psyche so you can deal with it consciously and are no longer the victim of its judgments about you and others."], "aGroup": ["patriarchal system of the past, internal guilt, self-criticism, inner patriarch, echoes the values of the past"], "bGroup": ["changed over many decades, flexibility, more choice, fulfillment in work and motherhood"], "answers": ["inner patriarch awareness"]}, {"id": "ABSO_TYPE_02_23", "difficulty": "보통", "title": "영아의 능동적 시각 인지와 촉각 우위론의 반박", "abstract": "Infants actively apprehend the world through vision long before they use their hands, challenging the belief that touch is primary.", "keyIndex": 5, "sentences": ["Psychological speculation focuses on the importance of the sense of touch in perception.", "On the assumption that visual perception is based on optical projection, the sense of sight was deemed incapable of conveying a truthful image of what three-dimensional things really look like.", "One psychologist reasoned: Touch is not dependent on projections by light across empty space; touch relies on direct contact with the object; it applies from all sides.", "Touch can be trusted to provide objective information.", "But recent research shows that infants come to know physical objects as solid and tangible through visual experience instead of a reliance on touch.", "This is not surprising once we realize that perceiving the shape of an object by touch is not simpler or more direct than perceiving by vision.", "The infant takes hold of the world with his eyes long before he does so with his hands.", "During the first eight weeks of life the hands remain predominantly fisted, while the eyes and brain are busy with looking, staring, seeking and apprehending."], "aGroup": ["optical projection, incapable of truthful image, direct contact, objective information, reliance on touch"], "bGroup": ["visual experience, know physical objects, not simpler, busy with looking and apprehending"], "answers": ["visual active perception"]}, {"id": "ABSO_TYPE_02_24", "difficulty": "보통", "title": "선택적 목표 설정과 자아 만족감의 관계", "abstract": "Self-satisfaction depends not on universal success but on achieving specific goals in which an individual has chosen to invest their pride.", "keyIndex": 1, "sentences": ["William James, an American psychologist, argued that one’s ability to feel satisfied with oneself does not rely on experiencing success in every area of endeavor.", "He said that our goals dictate what we will interpret as a triumph and what must count as a catastrophe.", "We are humiliated only if we invest our pride and sense of worth in a given goal and then we fail to reach that goal.", "James himself was very proud of being a Harvard professor and prominent psychologist, and he admitted that he would feel envious and ashamed if he found that someone else was more of an expert psychologist than he was.", "On the other hand, because he had never set out to learn Latin, he knew that he would not feel bad at all to hear that someone could appreciate and translate the entire works of Cicero, Virgil, and Ovid."], "aGroup": ["experiencing success in every area, never set out to learn, would not feel bad"], "bGroup": ["goals dictate, invest our pride, triumph, catastrophe, humiliated"], "answers": ["selective self-satisfaction"]}, {"id": "ABSO_TYPE_03_20", "difficulty": "보통", "title": "변화하는 세상에 적응하기 위한 지식과 경험의 공유", "abstract": "Adapting to a changing world requires learning and sharing new knowledge, much like Aborigines share songs to navigate new territories.", "keyIndex": 6, "sentences": ["When an Aboriginal mother in Australia is pregnant and feels the baby kick for the first time, she calls the shaman to identify that child’s spirit guide.", "As the child grows, he or she learns the song of this spirit guide.", "Coded into the song are the features of the local landscape — where to find food, water, shelter, and safe travel routes.", "An Aborigine who goes on a journey of self-discovery calls on this song to guide him or her, and when Aborigines meet, they swap songs.", "This sharing relationship extends the territory of each and binds one to another through song.", "To find new territory and new routes in life, we all need to learn new songs.", "This earth and its working are beyond what we were once taught.", "At the limits of our songs, we need one another so that we can be adaptive in a world made of bundles of energy in motion."], "aGroup": ["limits of our songs, beyond what we were once taught"], "bGroup": ["swap songs, extends the territory, learn new songs, adaptive"], "answers": ["adaptive song sharing"]}, {"id": "ABSO_TYPE_03_21", "difficulty": "높음", "title": "다중 작업의 폐해와 원숭이 마음의 극복", "abstract": "Multitasking reduces performance and creates mental clutter known as monkey-mind, hindering our ability to focus effectively.", "keyIndex": 2, "sentences": ["Buddhist meditation instructor Kathleen Thurston says that our lives are filled with too much stress caused by our addiction to activities.", "She says we shouldn’t pride ourselves on our multitasking abilities because they are just other means of creating distractions for ourselves.", "She quotes recent studies that show our performance is actually reduced, not boosted, when we do more than one complex task at a time.", "Thurston also says we are allowing ourselves to be overwhelmed by the distracting thoughts that fill our heads like so much mental clutter.", "Buddhists aptly call this phenomenon monkey-mind.", "If you are stressed and overwhelmed by so many activities, it’s time to stop swinging from tree to tree."], "aGroup": ["addiction to activities, multitasking abilities, distractions, mental clutter, monkey-mind"], "bGroup": ["performance is actually reduced, overwhelmed, stop swinging from tree to tree"], "answers": ["overwhelming multitasking"]}, {"id": "ABSO_TYPE_03_22", "difficulty": "보통", "title": "타인의 인정과 칭찬이 아이의 스포츠 발달에 미치는 영향", "abstract": "Approval and praise from significant figures are crucial in motivating children to develop positive attributes through sports.", "keyIndex": 6, "sentences": ["As children develop, they learn to satisfy their needs for praise in a variety of ways.", "For one thing, they find out what is praiseworthy to people who matter to them, such as parents, teachers, and peers.", "It doesn’t take most children very long to realize that sports provide many opportunities for approval and praise.", "Many parents communicate very positive attitudes about sports and exhibit a great deal of interest in such activities, for example, leading children to pursue sports.", "When they score a goal or win a match for the first time, the unmistakable pleasure on their parents’ faces as well as the words of congratulations motivates them to continue playing their sport.", "It is almost impossible to overestimate the importance of approval and praise to the developing child.", "Indeed, almost all of the positive attributes that can be developed through sport participation — achievement motivation, sportsmanship, teamwork, unselfishness — are ultimately strengthened through the approval of people such as parents and teammates."], "aGroup": ["needs for praise, lack of interest"], "bGroup": ["approval and praise, positive attitudes, pleasure on their parents' faces, words of congratulations, positive attributes strengthened"], "answers": ["approval and praise"]}, {"id": "ABSO_TYPE_03_23", "difficulty": "높음", "title": "불완전한 도덕적 안내자로서의 양심의 한계", "abstract": "Conscience is not always a reliable guide as it can malfunction due to poorly internalized moral principles or confusion in dilemmas.", "keyIndex": 6, "sentences": ["How reliable a guide is conscience?", "People often say, Follow your conscience, but is such advice really helpful?", "We may notice that there are times when our conscience doesn’t know what to do.", "When it is not possible to do both, should we keep our promise to a colleague or come to the aid of an old friend?", "To be told that we should follow our conscience is no help at all.", "In addition to this, it may not always be good for us to listen to our conscience.", "It all depends on what our conscience says.", "Sometimes people’s consciences do not bother them when they should — perhaps because they didn’t think through the implications of a decision or perhaps because they failed to internalize strongly enough the appropriate moral principles.", "On the other hand, a person’s conscience might disturb the person about something that is perfectly all right."], "aGroup": ["doesn't know what to do, no help at all, failed to internalize moral principles, disturb about perfectly all right things"], "bGroup": ["reliable guide, think through the implications, appropriate moral principles"], "answers": ["unreliable conscience"]}, {"id": "ABSO_TYPE_03_24", "difficulty": "높음", "title": "집단 지성의 정확성을 위한 관찰자 간 독립성", "abstract": "A pool of individual judgments achieves accuracy only when observers remain independent without influencing each other's testimony.", "keyIndex": 4, "sentences": ["Imagine that a large number of observers are shown a glass jar containing coins and are challenged to estimate the number of coins in the jar.", "This is the kind of task in which individuals do very poorly, but pools of individual judgments hit the mark.", "The mechanism is straightforward: the average of many individual errors tends toward zero.", "However, this works well only when the observers are completely independent from one another.", "If the observers lean in the same direction, the collection of judgments will not help.", "For this reason, when there are multiple witnesses to an event, they are not allowed to discuss their testimony beforehand.", "The goal is not only to prevent the cheating of hostile witnesses, but it is also to prevent unbiased witnesses from affecting each other.", "When this practice is not enforced, witnesses will tend to make similar errors in their testimony, which reduces the total value of the information they provide."], "aGroup": ["lean in the same direction, discuss their testimony, affecting each other, similar errors"], "bGroup": ["pools of individual judgments, completely independent, unbiased witnesses, total value of the information"], "answers": ["observer independence"]}, {"id": "ABSO_TYPE_04_20", "difficulty": "보통", "title": "상호 유리한 합의를 이끄는 권력 본질에 대한 고찰", "abstract": "Negotiators should explicitly consider the nature of power to reach more advantageous agreements for both sides.", "keyIndex": 6, "sentences": ["Power is an intensely practical subject for all international negotiators, who by their very natures are intensely practical persons.", "Diplomats, business executives, and other practitioners of negotiation apply power in all phases of the negotiating process.", "For them, power means the negotiating ability to move the decisions of the other side in a desired way.", "They devise their strategies and tactics with this end in mind, but they hardly ever spend time speculating on the nature of power.", "This neglect of such an important element in any negotiation may limit their potential.", "Negotiators, in their training and in their preparation for specific negotiations, should spend more time explicitly considering the nature, sources, and implications of power.", "Perhaps this could enable them not only to obtain what they want in a negotiation, but also to reach the kinds of agreements that are the most advantageous for both sides of the negotiating table."], "aGroup": ["intensely practical subject, apply power, neglect, limit their potential"], "bGroup": ["speculating on the nature of power, explicitly considering, most advantageous"], "answers": ["speculating on power"]}, {"id": "ABSO_TYPE_04_21", "difficulty": "높음", "title": "기후 변화에 대응하는 정치인들의 모순적 위험 계산법", "abstract": "Politicians often delay climate action on massive risks while strictly protecting themselves against minor personal risks.", "keyIndex": 5, "sentences": ["As the evidence of the growing risks of climate change mounted over the last three decades, the political response nonetheless was a combination of denial and delay.", "Confronted with evidence, many in positions of influence in U.S. politics ignored and then later denied the facts.", "When the facts could no longer be denied, they quibbled about the details of the scientific evidence and the costs of action necessary to head off the worst possibilities.", "In the meantime, months, years, and decades slipped away.", "Some chose to dismiss the evidence as doom and gloom, but as individuals they lived by an entirely different calculus.", "They have household, auto, and health insurance for protection against vastly smaller risks at an insignificantly smaller scale, and most did not dismiss health warnings from their doctors.", "When it is merely the future of the Earth, however, they have been willing to risk irreversible changes."], "aGroup": ["denial and delay, ignored and denied, quibbled, dismiss the evidence, risk irreversible changes"], "bGroup": ["entirely different calculus, insurance for protection, did not dismiss health warnings"], "answers": ["hypocritical risk calculus"]}, {"id": "ABSO_TYPE_04_22", "difficulty": "보통", "title": "남겨진 기록과 상상력을 통해 재창조되는 과거", "abstract": "The past exists only as it is recreated in the historian's mind through surviving records and signs.", "keyIndex": 2, "sentences": ["The nature of the past is of primary concern to the historian since the past is his sole subject matter.", "From his standpoint, the past exists only as it is recreated in the historian’s mind.", "The concrete events of the past are forever gone, and they can be re-created again in the historian’s imagination only to the extent that records of some kind have survived from those who witnessed the events.", "The telltale signs left by events are many: words of eyewitnesses who selected what aspects of any event were significant to them, plus their interpretation and valuation; fossil tracks, leaves, bones; geological records in rocks, volcanic layers, seamounts, oceanic trenches; and so on.", "If an event leaves no record, then it is forever irretrievable; no historian can reconstruct it, nor, for that matter, would he have reason to guess that it had ever occurred."], "aGroup": ["forever gone, leaves no record, forever irretrievable"], "bGroup": ["recreated in the historian’s mind, records of some kind, telltale signs, reconstruct it"], "answers": ["historical recreation"]}, {"id": "ABSO_TYPE_04_23", "difficulty": "높음", "title": "생태 관광의 딜레마와 외부 투자 자본의 한계", "abstract": "Ecotourism supports local conservation but often requires external capital that diverts revenue away from local income.", "keyIndex": 5, "sentences": ["Ecotourism, or tourism in exotic, threatened environments to support local conservation efforts and observe wildlife, has a potentially less adverse effect on local culture than conventional mass tourism, and even a positive effect on some communities.", "Overall, ecotourism represents a significant opportunity for economic growth in rural communities because of its preference for remote destinations with little prior industrial activity.", "The small-scale nature of ecotourism makes local start-up businesses a viable option.", "Locally owned ecotourism operations can contribute to the income opportunities of the local population more effectively and make the community socioeconomically stronger, thus contributing to sustainability and poverty reduction.", "However, environmentally competitive tourism businesses may in some cases require investment capital that is locally unavailable, thus causing the need to attract investors to the area and diverting the tourism revenue into anything but local income.", "Suggested solutions range from community-based management to benefit sharing, but the economic needs and pressures of external investments remain problematic."], "aGroup": ["require investment capital, attract investors, diverting the tourism revenue, pressures of external investment"], "bGroup": ["positive effect on some communities, opportunity for economic growth, local start-up businesses, contributing to sustainability"], "answers": ["external investment dilemma"]}, {"id": "ABSO_TYPE_04_24", "difficulty": "보통", "title": "타인과의 연결과 인정을 갈망하는 예술 창작의 본질", "abstract": "Art making fundamentally stems from the human longing for connection and acknowledgment by others.", "keyIndex": 6, "sentences": ["Few conditions are more distressing to people than loneliness.", "In fact, the foundation of nearly every major approach to psychotherapy is anchored in theories that involve interpersonal relationships.", "Psychologist Irvin D. Yalom stated: People need people — for initial and continued survival, for socialization, for the pursuit of satisfaction.", "No one — not the dying, the outcast, or the mighty — transcends the need for human contact.", "Perhaps the longing for human connection and response, at least partially, explains why prehistoric humans stained the walls of the caves at Lascaux, and why the Rapa Nui inhabitants of Easter Island sculpted their monumental statues.", "Acts of creation are invitations to relate.", "By making things artists take images from within and give them visible form in the world.", "In profound ways, art making is an act of acknowledgment of the others beyond the boundaries of the self — the beholders, members of the audience, the community and the group."], "aGroup": ["loneliness, distressing, boundaries of the self"], "bGroup": ["interpersonal relationships, need for human contact, invitations to relate, act of acknowledgment"], "answers": ["longing for connection"]}, {"id": "ABSO_TYPE_05_20", "difficulty": "높음", "title": "환경 통제를 통한 끊임없는 도전 제공의 부작용과 자연스러운 발달", "abstract": "Providing wall-to-wall challenges for a child requires caution, as naturally diverse surroundings are sufficient for brain development.", "keyIndex": 6, "sentences": ["In theory, the more challenges we face, the more strong neural connections we should have, and the smarter we should become.", "Because of this, some experts emphasize the importance of environment.", "They suggest we control children’s in a very specific way, introducing them to specific activities at different points of their development, to stimulate the growth of the neural connections in the brain.", "It’s true that the experiences we give our children shape the way they think and learn.", "But every individual brain is different.", "So while the experts’ suggestion can sound reassuring to parents who want to make a difference, the idea of providing wall-to-wall challenges for your child should be treated with some caution.", "In the right surroundings a child’s brain just can’t help but learn.", "Playing with a selection of toys, engaging in a healthy variety of activities, spending time with a range of adults and other children; all of these will stimulate a child’s mind and help with the development of his brain."], "aGroup": ["control children's in a very specific way, wall-to-wall challenges"], "bGroup": ["individual brain is different, treated with some caution, right surroundings, healthy variety of activities"], "answers": ["brain development caution"]}, {"id": "ABSO_TYPE_05_21", "difficulty": "보통", "title": "생존과 안정을 보장하는 경제적 여권으로서의 인적 자본", "abstract": "Human capital, such as professional degrees, acts as an economic passport ensuring security in precarious situations.", "keyIndex": 1, "sentences": ["Human capital is an economic passport — literally, in some cases.", "When I was an undergraduate in the late 1980s, I met a young Palestinian man named Gamal Abouali studying engineering.", "Gamal’s family, who lived in Kuwait, were insistent that their son finish his degree in three years instead of four as they believed the sooner he had his degree, the more secure he would be.", "This required taking extra classes each quarter and attending school every summer, all of which seemed rather extreme to me at the time.", "What about internships and foreign study, or even a winter in Colorado as a ski lover?", "I had lunch with Gamal’s father once, and he explained that the Palestinian existence was itinerant and precarious.", "Mr. Abouali was an accountant, a profession that greatly opened up his options wherever he might go.", "The family had lived in Canada before moving to Kuwait; they could easily be somewhere else in five years, he said."], "aGroup": ["itinerant and precarious, easily be somewhere else"], "bGroup": ["economic passport, finish his degree, more secure, opened up his options"], "answers": ["economic passport security"]}, {"id": "ABSO_TYPE_05_22", "difficulty": "높음", "title": "인간의 공동체적 합의에 의해 본질이 결정되는 돈의 사회적 특성", "abstract": "Money derives its nature from human social agreements and community recognition rather than material properties.", "keyIndex": 5, "sentences": ["William Shakespeare once wrote, a rose by any other name would smell as sweet.", "The idea, of course, is that a thing is what it is, independently of the label placed on the thing.", "The process of labeling or naming is a secondary process, and one that does not change the nature of the thing being named.", "In other words, changing the name does not change the thing itself.", "However, some things are what they are not because of their material properties but because of human social agreements.", "Let’s consider things like money.", "Something is money only on the condition that a community recognizes it as money.", "If we cease to recognize a thing as money, it ceases to be money.", "Francs, which used to be money in France, are no longer recognized as money as the French have moved on to use Euros.", "Money by any other name — without social agreement — will not be the same thing.", "Thus, Shakespeare’s idea fits with common sense, but it is completely wrong most of the time."], "aGroup": ["independently of the label, secondary process, material properties"], "bGroup": ["human social agreements, community recognizes it, cease to recognize"], "answers": ["human social agreement"]}, {"id": "ABSO_TYPE_05_23", "difficulty": "높음", "title": "거시적 기초 연구를 저해하는 단기적 프로젝트 위주의 투자 추세", "abstract": "The trend toward small, short-term projects hinders basic scientists from concentrating on long-term major research problems.", "keyIndex": 5, "sentences": ["There seems to be a noticeable trend in the present-day investment strategy in basic science.", "It is rare to see any sponsors, including government entities, spending funds on basic studies lasting more than a few years.", "The trend has been to find small and short-term projects.", "In this climate researchers are not allowed enough resources and time to concentrate on long-term and large scientific problems, although all the faculty at the nation’s major research universities have become very adept at breaking up a career-long major research problem into tasks that can be accomplished by small teams in shorter time periods and funded piecemeal.", "Following the survival-of-the-fittest trend, then, today’s scientists behave more like technologists in the society’s eye.", "They make devices, bring new technologies to the newest applications, and try to solve many of our present-day problems."], "aGroup": ["small and short-term projects, breaking up a career-long major research problem, technologists"], "bGroup": ["basic studies lasting more than a few years, long-term and large scientific problems"], "answers": ["short-term project trend"]}, {"id": "ABSO_TYPE_05_24", "difficulty": "보통", "title": "잠재적 시장의 크기가 혁신에 미치는 촉진 효과", "abstract": "A larger market increases rewards for innovation, drawing more resources and fueling further technological advancements.", "keyIndex": 4, "sentences": ["If there are only five potential buyers for a new idea or a product based on it, the potential rewards are smaller than if there are 500 or 5 million potential buyers.", "Perhaps that, in part, explains the increase in innovation in developed countries.", "Economist Charles Jones has calculated that in the combined economies of the United States, the United Kingdom, France, Germany, and Japan, the total number of people working in research and development has risen four to five times faster than the population has increased since 1950.", "A larger market has increased the rewards for innovation, drawing more people and resources to it.", "And growing wealth for the world means a larger market for any new innovation.", "That larger market for new goods of all sorts would draw more people and more resources, and produce more innovations.", "As the poor world gets richer, the rewards for innovation there will grow, continuing that trend, and further fueling innovation."], "aGroup": ["five potential buyers, smaller rewards, poor world"], "bGroup": ["larger market, increase in innovation, drawing more people and resources, gets richer"], "answers": ["market size innovation"]}, {"id": "OLLE_TYPE_03_00", "difficulty": "높음", "title": "멘토링에서 공감적 경청의 중요성", "abstract": "A mentor should practice active and empathic listening to facilitate the mentee's self-directed thinking.", "keyIndex": 6, "sentences": ["It has been said that most people listen with the intention to reply rather than to understand.", "Your job as a mentor is to facilitate your mentee’s thinking and not to try and do it for them, no matter how tempting that may be.", "If, during a mentoring session, you realize you’re doing most of the talking, then I’d respectfully suggest that you just stop, sit back and listen.", "A good part of the mentee’s learning process happens when he/she thinks out loud.", "The rest of it happens by reflection and practice outside mentoring sessions.", "Therefore, your mentee should be doing most of the talking.", "Listening actively and empathically helps mentees to gain insight and to express themselves more effectively.", "For your mentee to have a sense of being heard and of feeling acknowledged, it is essential that you listen well."], "aGroup": ["listen with the intention to reply, do it for them, doing most of the talking"], "bGroup": ["active listening"], "answers": ["empathic active listening", "providing direct answers", "continuous mentor talking", "ignoring mentee's thoughts", "strict rule enforcement"]}, {"id": "OLLE_TYPE_03_01", "difficulty": "높음", "title": "전문가 신화의 오류와 창의성의 본질", "abstract": "Contrary to the expert myth, excessive expertise in a specific domain can actually hinder an individual's creativity by making them overlook obvious things.", "keyIndex": 6, "sentences": ["The expert myth is the belief that the more you know, the more creative you become.", "At the face of it, this seems quite logical.", "The rationale is that in order to be truly creative, one must master a field or a domain.", "Creativity often requires some level of expertise, but expertise and creativity are nonetheless very different things.", "Someone can know a great deal about something and yet show little creativity in that domain.", "However, research into the lives of creative people shows that in some cases expertise can actually hinder creative ability of individuals.", "As expertise grows, creativity sometimes diminishes. Sometimes the best insights come from those outside a particular field.", "There is good reason for this.", "When we are too heavily invested in a task, we may tend to overlook the obvious."], "aGroup": ["the more you know, master a field, heavily invested in a task"], "bGroup": ["hinders creativity"], "answers": ["hindering creative ability", "boosting imaginative power", "requiring absolute mastery", "ignoring external insights", "accumulating endless knowledge"]}, {"id": "OLLE_TYPE_03_02", "difficulty": "보통", "title": "직소 퍼즐과 같은 삶과 경력의 전개", "abstract": "Unfolding your life and career is like doing a jigsaw puzzle where the full picture emerges gradually through patience and persistent effort.", "keyIndex": 3, "sentences": ["Just as you don’t know everything in advance about a trip you are going to take, neither can you know everything about how your new life or career might unfold.", "But that’s fine.", "You just have to treat it like doing a jigsaw: accept that the full picture is going to emerge gradually rather than instantly.", "While sometimes it will be straightforward to fit pieces together, at other times it will take more effort and patience.", "Sometimes you will find interesting pieces that open up a whole new section, and at other times you may find pieces that don’t seem to belong anywhere right now.", "You just need to keep at it until the picture emerges and you can see clearly what you have achieved."], "aGroup": ["know everything in advance, emerge instantly"], "bGroup": ["gradual emergence"], "answers": ["gradual emergence of life goals like a jigsaw", "knowing everything instantly about career paths", "abandoning challenging pieces of life puzzle", "demanding immediate success in career", "ignoring confusing experiences in life"]}, {"id": "OLLE_TYPE_03_03", "difficulty": "높음", "title": "사회적 규범 모방을 통한 초기 습관의 형성", "abstract": "Our earliest habits are not actively chosen but passively imitated from the invisible social norms handed down by our surrounding culture.", "keyIndex": 1, "sentences": ["We don’t choose our earliest habits, we imitate them.", "We follow the script handed down by our friends and family, our church or school, our local community and society at large.", "Each of these cultures and groups comes with its own set of expectations and standards — when and whether to get married, how many children to have, which holidays to celebrate, how much money to spend on your child’s birthday party.", "In many ways, these invisible social norms are the invisible rules that guide your behavior each day.", "You’re always keeping them in mind, even if they are not at the top of your mind.", "Often, you follow the habits of your culture without thinking, without questioning, and sometimes without remembering.", "As the French philosopher Michel de Montaigne wrote, The customs and practices of life in society sweep us along."], "aGroup": ["choose our earliest habits, top of your mind"], "bGroup": ["social imitation"], "answers": ["unconscious social imitation", "autonomous individual choice", "deliberate habit formation", "rejecting traditional norms", "rational behavioral planning"]}, {"id": "OLLE_TYPE_04_00", "difficulty": "높음", "title": "조직 변화의 과정에서 원칙과 가치 유지의 중요성", "abstract": "While organizational strategies may change, preserving core principles and values as an anchor is essential for successful adaptation.", "keyIndex": 7, "sentences": ["Nothing about an organization’s strategy or business model is sacrosanct.", "But there must be a cutting point between principles and values and everything else.", "They represent precious, freestanding assets that must be independent of strategy.", "They provide continuity and identity when everything else is expendable.", "They represent the core element of the culture and the unchanging soul of the organization.", "Cases in which leaders have successfully remodeled an entire enterprise represent organizational change in its comprehensive and supreme category.", "We learn from these cases that retaining principles and values during the process of change is not only possible but necessary to provide an anchor.", "Ironically, perhaps, organizations with the strongest principles and values often have the highest adaptive capacity because people attach themselves to them and understand that everything else is on the table.", "If you want to keep your promises, burn the house when it’s time to reinvent the company. But save the nails."], "aGroup": ["strategy or business model, everything else is expendable, burn the house"], "bGroup": ["core principles"], "answers": ["retaining core principles", "altering fundamental values", "ignoring organizational culture", "sticking to old strategies", "discarding every asset"]}, {"id": "OLLE_TYPE_04_01", "difficulty": "보통", "title": "사회적 규칙의 산물인 인간의 행동과 감정", "abstract": "Most of our actions and feelings, though seemingly uniquely ours, are actually performances executed in conformity to widely accepted social rules.", "keyIndex": 4, "sentences": ["There is something in human nature that prompts us to think of our actions, as well as our feelings, as though they were the distinctive issue of something inside us, something uniquely ours.", "Some are.", "But most of the actions and feelings that help us enter into working relations with fellow members of the world are not all that private.", "They are, in fact, performances we execute in acceptably close conformity to widely accepted social rules.", "These rules are learned and held by us in such an easy way that we indulge the conceit that they are our own brilliant accomplishments.", "We think of them as though they were the inventions of our own utterly original psychic lives, when most of them are as familiar to others as they are to us.", "Social things are quite simply social."], "aGroup": ["distinctive issue, uniquely ours, private, own brilliant accomplishments, original psychic lives"], "bGroup": ["social conformity"], "answers": ["social rule conformity", "utterly original inventions", "purely private emotions", "biological instinct expression", "completely independent actions"]}, {"id": "OLLE_TYPE_04_02", "difficulty": "보통", "title": "인간 진화의 원동력이 된 요리된 음식", "abstract": "Cooking provided our ancestors with crucial extra energy, leading to biological advantages and driving human anatomical and social evolution.", "keyIndex": 4, "sentences": ["Cooked food does many familiar things.", "It makes our food safer, creates delicious tastes, and reduces the risk of going bad.", "Heating can allow us to open, cut, or mash tough foods.", "But none of these advantages is as important as a little-appreciated aspect: cooking increases the amount of energy our bodies obtain from our food.", "The extra energy gave the first cooks biological advantages.", "They survived and reproduced better than before. Their genes spread.", "Their bodies responded by biologically adapting to cooked food, shaped by natural selection to take maximum advantage of the new diet.", "There were changes in anatomy, physiology, ecology, life history, psychology, and society.", "Fossil evidence indicates that this dependence arose not just some tens of thousands of years ago, but right back at the beginning of our time on Earth, at the start of human evolution.", "We should indeed pin our humanity on cooks."], "aGroup": ["safer, delicious tastes, reduces the risk, open cut mash"], "bGroup": ["biological advantage"], "answers": ["increased energy acquisition", "enhanced food preservation", "simple taste improvement", "raw diet necessity", "modern culinary art"]}, {"id": "OLLE_TYPE_04_03", "difficulty": "높음", "title": "스포츠 마케팅 발전에 기여한 텔레비전의 매체적 힘", "abstract": "The television became a highly significant communication medium by visually uniting sports and the public, thereby revolutionizing sports marketing.", "keyIndex": 3, "sentences": ["Radio provided the driving force to solidify the era of patronage; however, the invention that soon followed remains to this day the most significant communication medium that has influenced and aided the development of sports.", "Who knew what sportscaster Bill Stern questioned and introduced in 1939 would enhance the growth and development of sports marketing practices for decades?", "The display platform, the television, though airing two average baseball teams battling for fourth place, provided an incredibly formidable and profitable union between sports and the American public.", "The television provided a means for sports organizations to expand their market presence and a unique opportunity for marketers to engage their publics.", "The notion of a picture being worth a thousand words became a reality with the invention and its intervention and presentation of sports."], "aGroup": ["radio, era of patronage"], "bGroup": ["visual union"], "answers": ["visual sports union", "local radio broadcasting", "amateur athlete support", "declining market presence", "ignoring public engagement"]}, {"id": "OLLE_TYPE_05_00", "difficulty": "보통", "title": "맛에 민감한 초미각자의 더 나은 건강 습관", "abstract": "Supertasters tend to have better overall health habits because their high taste sensitivity makes them avoid sweets, high-fat foods, alcohol, and smoking.", "keyIndex": 6, "sentences": ["Supertasters and nontasters respond similarly to many foods, but supertasters are more sensitive to certain sweet and bitter substances.", "These differences in taste sensitivity influence people’s eating habits in ways that can have repercussions for their physical health.", "For example, supertasters are less likely to be fond of sweets and tend to consume fewer high-fat foods, both of which are likely to reduce their risk for cardiovascular disease.", "Supertasters also tend to react more negatively to alcohol and smoking, thereby reducing their likelihood of developing drinking problems or nicotine addiction.", "The only health disadvantage identified for supertasters thus far is that they respond more negatively to many vegetables, which seems to hold down their vegetable intake.", "Overall, however, supertasters tend to have better health habits than nontasters, thanks to their strong reactions to certain tastes."], "aGroup": ["fond of sweets, consume high-fat foods, hold down vegetable intake"], "bGroup": ["healthier habits"], "answers": ["healthier overall habits", "extreme vegetable consumption", "increased cardiovascular risk", "severe nicotine addiction", "complete taste loss"]}, {"id": "OLLE_TYPE_05_01", "difficulty": "보통", "title": "아프리카 전통 사회에서 인지적 문지기로서의 노인", "abstract": "In traditional African societies, elders are deeply respected as cognitive gatekeepers and guardians of knowledge who convey accumulated wisdom to youngsters.", "keyIndex": 2, "sentences": ["Every society has its cognitive police officers or gatekeepers who together define the fundamental cognitive orientation of the people and principally oversee the approved characterization and the defense of the societal norms.", "Among traditional African societies, this policing or gatekeeping role is performed mostly by the adult members through the acquisition of a library of ideas, because they are believed to have accumulated the knowledge and wisdom of the society.", "No wonder then, that the Akan of Ghana has wise sayings and proverbs, such as Each time an elderly dies it is as if a library had burned down.", "In addition to acting as guides to the land and its flora and fauna, elders convey knowledge to youngsters individually by telling stories, and thus overseeing their learning process.", "There is also a reverence of filial piety, the respect for the elderly that is equated with Older People as Guardians of Knowledge in Traditional African Societies."], "aGroup": ["youngsters"], "bGroup": ["knowledge guardians"], "answers": ["elder knowledge guardianship", "youth cognitive dominance", "rejecting traditional norms", "independent learning process", "modern technological education"]}, {"id": "OLLE_TYPE_05_02", "difficulty": "높음", "title": "건축 법규가 가지는 구조적, 경제적, 사회적 한계", "abstract": "Despite their ability to mitigate some hazards, building codes have significant limitations regarding structural integrity, economic protection, and equitable enforcement.", "keyIndex": 3, "sentences": ["Building codes can reduce the adverse impacts of hazards.", "For example, hurricane clips may prevent roofs from detaching from buildings during the high winds of passing tropical cyclones and thus prevent rain damage.", "However, as with engineered structures, building codes have their limitations.", "It was reported that in the wake of Hurricane Andrew, which struck South Florida in 1992, officials realized that strict building codes would not prevent serious damage.", "Furthermore, earthquake codes are typically designed to prevent buildings from collapsing, not to maintain structural integrity of the building and ensure habitability after a large earthquake.", "This policy increases human survival rates in earthquakes, but is less effective in reducing the economic impact.", "Furthermore, building codes are the offspring of public policy, and policy is vulnerable to inequity in its application across the breadth of society, and may be ignored or not enforced."], "aGroup": ["reduce adverse impacts, prevent buildings from collapsing, human survival rates"], "bGroup": ["policy limitations"], "answers": ["significant policy limitations", "perfect disaster prevention", "equitable social application", "complete economic protection", "absolute structural integrity"]}, {"id": "OLLE_TYPE_05_03", "difficulty": "높음", "title": "자기 대화를 통한 불안과 스트레스의 긍정적 에너지 전환", "abstract": "Relabeling our stress and anxiety as excitement through positive self-talk can effectively convert negative feelings into a useful and positive energy.", "keyIndex": 8, "sentences": ["Harvard business professor Alison Wood Brooks has done studies that show how stress and anxiety change based on what we tell ourselves.", "Brooks’s experiment sounds like a blast or a nightmare, depending on your perspective.", "She took a group of subjects with stage fright to a crowded bar with a stage and had them get up there and sing.", "All the subjects arrived nervous, as expected.", "But Brooks measured whether or not having them change their language — calling their nerves excitement — made any difference.", "She had one nervous group tell themselves over and over, I am excited, and tested them against a control group who just sat with their nerves and their regular self-talk.", "The results were eye-opening.", "The decision to tell themselves that the feeling they were experiencing was excitement helped them convert the energy into something positive, even useful."], "aGroup": ["stress and anxiety, stage fright, nervous, regular self-talk"], "bGroup": ["positive reframing"], "answers": ["converting anxiety positively", "suppressing extreme emotions", "experiencing severe nightmares", "avoiding stage fright", "maintaining regular self-talk"]}, {"id": "OLLE_TYPE_PR_01", "difficulty": "보통", "title": "문제 해결을 위한 내면 성찰과 여백의 중요성", "abstract": "In problem-solving situations, taking time to quiet yourself without distractions restores clarity and enhances decision-making capacity.", "keyIndex": 5, "sentences": ["I met a CEO once who had an amazing approach to problem solving.", "Whenever his organization had a problem, he’d gather information about it.", "Once he had all the information, he’d say to his people, Okay, we’re going to go to solution now. But before we do that, I want you to spread out around the building and sit quietly, or take a walk for about a half hour.", "Whatever you do, I want you to quiet yourself. No telephone, nothing to read. And I want you to look for the answer within.", "He told me it blew his mind to see how people’s clarity and decision-making capacity would come back when they had a chance to quiet themselves and think through something without all kinds of distractions.", "I think half our problems of not behaving on our good intentions is that we don’t give ourselves any space to rethink who we want to be."], "aGroup": ["go to solution now, all kinds of distractions"], "bGroup": ["quiet reflection"], "answers": ["securing quiet reflection", "rushing immediate solutions", "gathering endless information", "ignoring inner thoughts", "maximizing external distractions"]}, {"id": "OLLE_TYPE_PR_02", "difficulty": "보통", "title": "대면 관계에 집중하기 위한 전자 매체 통제 규칙", "abstract": "To build real social capital in physical interactions, you should establish clear rules to manage and limit intrusive electronic communications.", "keyIndex": 2, "sentences": ["Your real social capital is most likely going to come from people you know in the physical world rather than through your virtual social networks.", "Knowing that, as well as knowing that you may get interrupted by communications from your electronic world, you should develop rules about how to deal with intrusive e-connections when you are actually face to face with friends.", "Too often you see people with their smartphones lined up on a restaurant table, willing to interrupt themselves to respond to whoever has just sent a text.", "This doesn’t mean that you can’t respond to these interruptions if they are important; it just means that you have to define an important message in advance and then leave the rest alone for after your social get-together.", "You need to take your local audience into account while understanding the needs of your remote audience."], "aGroup": ["virtual social networks, intrusive e-connections, interrupt themselves"], "bGroup": ["physical connections"], "answers": ["managing virtual interruptions", "abandoning physical networks", "responding immediately always", "ignoring remote audience", "staring at smartphones"]}, {"id": "ABSO_TYPE_06_20", "difficulty": "높음", "title": "효과적인 시간 관리: 중요성에 집중하여 심리적 균형 찾기", "abstract": "Effective time management, which focuses on important tasks rather than simply doing more, is essential for achieving goals while maintaining psychological balance.", "keyIndex": 5, "sentences": ["Sometimes, it seems there isn't enough time to do everything that you need to do.", "This can easily result in a build-up of stress when preparing for examinations, or during your final year of high school when you have to combine the pressures of intensive study with finding time to apply for colleges.", "That's why good management of your time is particularly important.", "This doesn't mean doing more work.", "It means focusing on the tasks that matter and will make a difference.", "Whether it's in your job or your lifestyle as a whole, learning how to manage your time effectively will help you feel more relaxed, focused, and in control.", "The aim of good time management is to achieve the goals you want without losing the balance of your mind."], "aGroup": ["시간 부족", "스트레스의 축적", "압박", "더 많은 일"], "bGroup": ["좋은 시간 관리", "중요한 작업에 집중", "효과적인 관리", "편안함", "마음의 균형"], "answers": ["focusing on importance", "doing more work", "building up stress", "losing mental balance", "poor physical health"]}, {"id": "ABSO_TYPE_06_21", "difficulty": "높음", "title": "성인군자의 가면: 숨겨진 권력욕과 발현되는 폭력성", "abstract": "The overly saintly exterior of some individuals often masks a strong hunger for power, and once they attain it, their repressed intolerant and punishing nature is revealed.", "keyIndex": 6, "sentences": ["In the course of your life you will come upon people with overly emphatic traits, which generally rest on top of the opposite traits, concealing them from public view.", "One of the types is the Saint.", "These people are paragons of goodness and purity.", "They support the best and most progressive causes.", "They are above the corruption and compromises of politics, or they have endless compassion for every type of victim.", "This saintly exterior, however, developed early on as a way to disguise their strong hunger for power and attention.", "Over the years they hone and perfect this public image.", "By projecting this saintly aura to the nth degree they will gain great power, leading a cult or political party.", "And once they are in power, the Shadow will have space to operate.", "They will become intolerant, railing at the wrong-doers, punishing them if necessary.", "Maximilien Robespierre (nicknamed the Incorruptible), who rose to power in the French Revolution, was such a type.", "After all, the guillotine was never busier than under his reign."], "aGroup": ["지나치게 두드러지는 특성", "선함과 순수함의 귀감", "대중적 이미지", "성자 같은 기운"], "bGroup": ["정반대의 특성", "권력욕", "그림자", "편협함", "처벌"], "answers": ["repressed shadow operation", "endless victim compassion", "progressive political causes", "overly saintly exterior", "honest public image"]}, {"id": "ABSO_TYPE_06_22", "difficulty": "보통", "title": "온라인 사진 공유의 이면: 이미지 통제력 상실", "abstract": "While sharing digital photos online brings joy, it also poses a risk of losing control over the images as they can be easily manipulated and spread by others.", "keyIndex": 6, "sentences": ["Perhaps one of the most notable technologies integrated directly in our lives is the digital camera.", "My daughter's first digital photo, for example, was taken within a few hours of her birth, and then texted to family members and posted to Facebook.", "In the moment when I posted the photo, I thought only about sharing my joyous moment and my pride in having such a beautiful newborn.", "The day after I posted this first photograph, I realized that this baby photo had taken on a life of its own.", "A friend had downloaded the photo and manipulated it using Photoshop, inserting my daughter's face into several other images, so that she became fictional front-page news and was featured on a magazine cover.", "Though we enjoyed this creative tribute to our newborn, at the same time, a mere day into motherhood, I realized that I was not in control of my daughter's image.", "The contrast between my own childhood, when a camera required physical film that had to be processed before photos were generated, shocked me."], "aGroup": ["기쁜 순간의 공유", "자체의 생명력", "사진 조작", "허구의 1면 기사"], "bGroup": ["통제력 상실", "물리적인 필름"], "answers": ["loss of image control", "creative digital tribute", "joyous sharing moment", "high resolution image", "physical photo film"]}, {"id": "ABSO_TYPE_06_23", "difficulty": "높음", "title": "유년기 음악 교육의 힘: 시공간적 인지 능력 향상", "abstract": "Early arts education, particularly music, provides significant intellectual benefits by highly improving children's spatial-temporal skills, which are crucial for mathematical and scientific understanding.", "keyIndex": 1, "sentences": ["Early experiences in the arts are important because they produce intellectual as well as aesthetic gains.", "In the best-researched example, participation in music seems to do mysterious but wonderful things, contrasting greatly with children's use of technology.", "Music educators have recently become so concerned about parents sending kids off to computer camps instead of music lessons that they have begun funding some expert studies.", "Researchers at the University of California, Irvine, studied how regular piano practice and computer training affect children's spatial-temporal skills.", "Such skills are key to understanding proportion, geometry, and other mathematical and sci
