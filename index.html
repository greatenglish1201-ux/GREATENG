// 사용자 추가 교재 (localStorage 'te_custom_books')
function loadCustomBooks(){

function getAllBooks(){

}
function bookLabel(src){
  return getAllBooks().find(b=>b.id===src)?.label || src;
}

// 보관(archive) 여부 판정: 시트 archived 컬럼이 TRUE이면 학생 화면에서 숨김.
// is_public은 건드리지 않으므로 archived만 해제하면 즉시 원상 복원됨.
function isArchived(p){
  const v=p&&p.archived;
  return v==='TRUE'||v===true||v==='true'||v==='1'||v===1;
}

// passage ID 생성 규칙 (MOGO_ 계열은 강 없음)
function makePassageId(source, chapter, number){
  const isMogo = source?.startsWith('MOGO_');
  const ns = String(number).padStart(3,'0');
  if (isMogo) return source + '_' + ns;
  return source + '_' + String(chapter).padStart(2,'0') + '_' + ns;
}

// detectBooks 호환용 정적 목록(매처 포함)
const BOOKS = getAllBooks().map(b=>({ id:b.id, label:b.label, match: id => id.startsWith(b.id) }));

// 정의된 교재 id를 길이 내림차순으로 정렬(긴 prefix 우선: 27ST_E가 27ST보다 먼저 매칭)
function definedBookId(pid){
  const DEFINED=[...getAllBooks()].sort((a,b)=>b.id.length-a.id.length);
  const hit=DEFINED.find(b=>pid===b.id||pid.startsWith(b.id+'_'));
  return hit?hit.id:null;
}
// passage 하나가 속한 교재 id를 결정.
// 1순위: 시트의 source 필드(권위 있는 값) → 2순위: 정의된 교재 id로 prefix 매칭 → 3순위: id에서 prefix 추출
function bookIdOf(p){
  if(p.source)return p.source;
  const byDef=definedBookId(p.id||'');
  if(byDef)return byDef;
  const parts=(p.id||'').split('_');let prefix='';
  for(let i=0;i<parts.length;i++){if(/^\d+$/.test(parts[i])||/^\d/.test(parts[i])&&parts[i].length<=3)break;prefix=prefix?(prefix+'_'+parts[i]):parts[i];}
  return prefix||parts[0]||'기타';
}
function detectBooks(passages){
  // source(또는 추론된 교재 id) 기준으로 그룹화 → 시트에 새 교재가 생겨도 자동 반영
  const order=[];const seen=new Set();
  passages.forEach(p=>{
    const bid=bookIdOf(p);
    if(!seen.has(bid)){seen.add(bid);order.push(bid);}
  });
  return order.map(bid=>({
    id:bid,
    label:bookLabel(bid),
    match:id=>{const q=passages.find(p=>p.id===id);return q?bookIdOf(q)===bid:id.startsWith(bid);}
  }));
}

// JSONP 방식으로 CORS 우회
function jsonpFetch(url, data) {
  return new Promise((resolve, reject) => {
    // 콜백 함수 고유 이름 생성
    const cbName = '__gas_cb_' + Date.now() + '_' + Math.floor(Math.random() * 1000000);
    // 파라미터 구성
    const params = new URLSearchParams();
    Object.keys(data || {}).forEach(k => {
      const v = data[k];
      params.append(k, v === null || v === undefined ? '' : String(v));
    });
    params.append('callback', cbName);
    
    // 타임아웃 (15초)
    const timeout = setTimeout(() => {
      cleanup();
      reject(new Error('서버 응답 시간 초과'));
    }, 15000);
    
    const cleanup = () => {
      clearTimeout(timeout);
      try { delete window[cbName]; } catch(e) { window[cbName] = undefined; }
      if (script.parentNode) script.parentNode.removeChild(script);
    };
    
    // 콜백 함수 등록
    window[cbName] = (result) => {
      cleanup();
      resolve(result);
    };
    
    // script 태그로 GAS 호출 (JSONP)
    const script = document.createElement('script');
    script.src = `${url}?${params.toString()}`;
    script.onerror = () => {
      cleanup();
      reject(new Error('서버 연결 실패'));
    };
    document.head.appendChild(script);
  });
}

/* ── 유틸 ── */
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

function splitKws(arr){
  // 쉼표로 묶인 키워드 문자열도 개별 항목으로 분리
  const out=[];
  for(const a of arr){
    for(const t of a.split(',')){const s=t.trim();if(s)out.push(s);}
  }
  return out;
}
function pickDistractors(correct, passage, allP, n=4){
  const pool=[];
  // 1순위: 해당 지문 answers[1~4]
  for(const a of passage.answers.slice(1)){
    const t=a.trim();
    if(t&&t!==correct&&!pool.includes(t))pool.push(t);
  }
  // 2순위: 해당 지문 aGroup (쉼표 분리)
  for(const t of splitKws(passage.aGroup)){
    if(pool.length>=n)break;
    if(t!==correct&&!pool.includes(t))pool.push(t);
  }
  // 3순위: 해당 지문 bGroup (쉼표 분리)
  for(const t of splitKws(passage.bGroup)){
    if(pool.length>=n)break;
    if(t!==correct&&!pool.includes(t))pool.push(t);
  }
  return shuffle(pool).slice(0,n);
}

function findBInSentences(passage){
  const r=[];
  // bGroup 항목이 쉼표 묶음이면 개별 키워드로 분리
  const kws=[];
  for(const bw of passage.bGroup){
    for(const t of bw.split(',')){const s=t.trim();if(s&&s.split(' ').length<=5)kws.push(s);}
  }
  for(const kw of kws){
    for(let i=0;i<passage.sentences.length;i++){
      if(passage.sentences[i].toLowerCase().includes(kw.toLowerCase())){
        if(!r.find(x=>x.si===i))r.push({kw,si:i,sent:passage.sentences[i]});
        break;
      }
    }
  }
  return r;
}

/* ── 문제 생성 ── */
// GAS 출제DB questions 배열을 지문 객체 필드로 변환
function applyGasQuestions(passage, questions){
  const p={...passage};
  questions.forEach(q=>{
    try{
      const __d=q.data_json?JSON.parse(q.data_json):null;
      if(__d&&__d.explanation) p['explanation_'+q.type]=__d.explanation; // 유형별 해설 보관
      const d=JSON.parse(q.data_json||'{}');
      if(q.type==='topic'){p.topic_options=d.options;p.topic_answer=Number(q.answer)||1;}
      else if(q.type==='blank'){p.blank_sel=d.sel||0;p.blank_candidates=d.candidates||[];p.blank_sentence_index=d.sentence_index;p.blank_target=d.target;p.blank_options=d.options;p.blank_answer=Number(q.answer)||1;}
      else if(q.type==='order'){p.order_given_index=d.given_index;p.order_blocks=d.blocks;p.order_options=d.options;p.order_answer=Number(q.answer)||1;}
      else if(q.type==='insert'){p.insert_sel=d.sel||0;p.insert_candidates=d.candidates||[];p.insert_sentence=d.sentence;p.insert_answer=Number(q.answer)||1;}
      else if(q.type==='summary'){p.summary_sel=d.sel||0;p.summary_candidates=d.candidates||[];p.summary_template=d.template;p.summary_A_options=d.A_options;p.summary_A_answer=d.A_answer||1;p.summary_B_options=d.B_options;p.summary_B_answer=d.B_answer||1;}
      else if(q.type==='implication'){p.implication_sentence_index=d.sentence_index;p.implication_keyword=d.keyword;p.implication_options=d.options;p.implication_answer=Number(q.answer)||1;}
      else if(q.type==='irrelevant'){p.irrel_sel=d.sel||0;p.irrel_candidates=d.candidates||[];p.irrel_insert_pos=d.insert_pos||0;p.irrel_confirmed=d.confirmed||false;p.irrelevant_sentence_index=d.sentence_index;}
      else if(q.type==='grammar'){p.grammar_sets=d.sets||[];p.grammar_sel=d.sel||0;p.grammar_items=d.items||[];p.grammar_answer=Number(q.answer)||1;}
      else if(q.type==='vocab'){p.vocab_sets=d.sets||[];p.vocab_sel=d.sel||0;p.vocab_items=d.items||[];p.vocab_answer=Number(q.answer)||1;}
    }catch(e){}
  });
  return p;
}

function normalizePassage(p){
  // sentences: 객체배열 → 문자열배열
  let sentences = p.sentences;
  if(sentences && sentences.length > 0 && typeof sentences[0] === 'object'){
    sentences = sentences.map(s => {
      // text 필드만 사용, ko(한글) 등 다른 필드 제외
      if(typeof s === 'string') return s;
      return (s.text || s.en || '').trim();
    }).filter(s => s.length > 0);
  } else if(sentences && sentences.length > 0 && typeof sentences[0] === 'string'){
    // 이미 문자열 배열이지만 한글이 섞여있으면 제거
    sentences = sentences.map(s => s.trim()).filter(s => {
      // 한글 문자가 50% 이상이면 제외 (ko 필드가 잘못 섞인 경우)
      const korean = (s.match(/[\uAC00-\uD7AF]/g)||[]).length;
      return korean < s.length * 0.5;
    });
  }
  // sentences가 없거나 형식이 달라 배열이 아니면 빈 배열로 보정 (렌더 throw → 백지화면 방지)
  if(!Array.isArray(sentences)) sentences = [];
  // blank_answer: 없으면 options[0]이 정답인 경우 1로 설정
  let blank_answer = p.blank_answer;
  if(!blank_answer && p.blank_options && p.blank_options.length > 0) blank_answer = 1;
  // grammar_items: word 필드 정규화 (sent 인덱스 기반으로 문장에서 추출)
  let grammar_items = p.grammar_items;
  if(grammar_items && grammar_items.length > 0 && grammar_items[0].word === undefined){
    grammar_items = grammar_items.map(item => ({...item, word: item.word || ''}));
  }
  // grammar_answer: grammar_sets에서 가져오기
  let grammar_answer = p.grammar_answer;
  if(!grammar_answer && p.grammar_sets && p.grammar_sets.length > 0) grammar_answer = p.grammar_sets[0].answer;
  // vocab_answer: vocab_sets에서 가져오기
  let vocab_answer = p.vocab_answer;
  if(!vocab_answer && p.vocab_sets && p.vocab_sets.length > 0) vocab_answer = p.vocab_sets[0].answer;
  return {...p, sentences, blank_answer, grammar_items, grammar_answer, vocab_answer};
}
function gen(passage, type, allP){
  passage = normalizePassage(passage);
  const s = passage.sentences;
  if(!s || s.length === 0) return null;
  // 미출제 유형 건너뜀
  const TYPE_KEYS={topic:'topic',order:'order',blank:'blank',summary:'summary',implication:'implication',irrelevant:'irrelevant',insert:'insert',grammar:'grammar',vocab:'vocab'};
  if((passage.disabled_types||[]).includes(TYPE_KEYS[type])) return null;
  // 시트(GAS) 지문: 출제DB에 실제 저장된 유형만 출제 (passages.js 지문은 기존 방식 유지)
  if(passage.__gasOnly && !(passage.__authored && passage.__authored.has(TYPE_KEYS[type]))) return null;

  // 유형별 저장 해설(있으면) → 문제 객체에 실어 채점 후 표시
  const __expl = passage['explanation_'+type] || '';

  switch(type){

  /* ① 주제 */
  case 'topic':{
    if(!passage.topic_options || passage.topic_options.length < 5) return null;
    const opts = passage.topic_options.map((text, i) => ({
      text,
      correct: i === (passage.topic_answer - 1)
    }));
    return {type, passage, explanation: __expl, options: shuffle(opts), instruction: '다음 글의 주제로 가장 적절한 것은?'};
  }

  /* ② 순서 배열 */
  case 'order':{
    if(!passage.order_blocks || passage.order_blocks.length < 2) return null;
    if(s.length < 4) return null;
    const givenIdx = passage.order_given_index || 0;
    // 순서배열은 원본 문장 전체 기준 (insert_sentence 포함 복원)
    // 단, sentences에 삽입문이 이미 포함된 경우(시트 지문 등) 중복 삽입 금지
    const __insTxt = (passage.insert_sentence||'').trim().slice(0,20);
    const __alreadyIn = __insTxt && s.some(x=>{
      const t = typeof x==='string'?x:(x?.text||'');
      return t.trim().startsWith(__insTxt);
    });
    const sOrig = (passage.insert_sentence && passage.insert_answer && !__alreadyIn)
      ? [...s.slice(0, passage.insert_answer), passage.insert_sentence, ...s.slice(passage.insert_answer)]
      : s;
    const given = sOrig[givenIdx];
    if(typeof given!=='string' || !given.trim()) return null; // 주어진 글 없으면 출제 제외
    const blockLabels = ['A','B','C'];
    // 유효한 sentence_indices만 가진 블록 필터링 후 최대 3개 사용
    const validBlocks = passage.order_blocks.filter(b =>
      b.sentence_indices && b.sentence_indices.length > 0 &&
      b.sentence_indices.every(i => i < sOrig.length) &&
      b.sentence_indices.map(i => sOrig[i]).join(' ').trim().length > 0
    );
    // ✅ 근본 수정 + 방어 로직: 저장된 blocks 배열 순서가 아니라 sentence_indices(본문 위치)
    //    기준으로 정답을 복원한다. teacher.html의 라벨/배열 순서와 무관하게 항상 정확.
    //    (시트 데이터는 그대로, 읽는 로직만 교정)
    // 1) 블록 내부 인덱스를 오름차순 정렬 (역순 저장 데이터 [4,3]·[2,1] 교정)
    const cleanBlocks = validBlocks.map(b => ({
      ...b,
      sentence_indices: [...b.sentence_indices].sort((x, y) => x - y)
    }));
    // 2) 블록을 시작 문장(최솟값) 기준 정렬 → 본문 진짜 순서 복원
    const sortedBlocks = [...cleanBlocks].sort((a, b) =>
      a.sentence_indices[0] - b.sentence_indices[0]
    );
    // 3) 방어: 블록들의 인덱스 범위가 서로 겹치거나 흩어진(인터리브) 비정상 데이터는 출제 제외.
    //    각 블록의 [min..max]가 다음 블록 min과 겹치면 순서 정답이 성립하지 않으므로 null 반환.
    for(let bi = 1; bi < sortedBlocks.length; bi++){
      const prevMax = Math.max(...sortedBlocks[bi-1].sentence_indices);
      const curMin = sortedBlocks[bi].sentence_indices[0];
      if(curMin <= prevMax) return null; // 흩어진/겹친 블록 → 안전하게 출제 제외
    }
    const numBlocks = Math.min(sortedBlocks.length, 3);
    if(numBlocks < 2) return null;
    const usedLabels = blockLabels.slice(0, numBlocks);
    // 본문 순서로 정렬된 블록 = 원래 정답 순서 (origLabel = A→B→C)
    const originalBlocks = sortedBlocks.slice(0, numBlocks).map((b, bi) => ({
      origLabel: usedLabels[bi],
      text: b.sentence_indices.map(i => sOrig[i]).join(' ')
    }));
    // 블록을 셔플 → 화면에 보여줄 순서 (새 레이블 부여)
    const shuffledBlocks = shuffle([...originalBlocks]);
    const blocks = shuffledBlocks.map((b, bi) => ({
      label: usedLabels[bi],   // 화면에 표시될 새 레이블
      origLabel: b.origLabel,  // 원래 순서 레이블
      text: b.text
    }));
    // 원래 레이블 → 새 레이블 맵 (정답 계산용)
    const newLabelMap = {};
    blocks.forEach(b => { newLabelMap[b.origLabel] = b.label; });
    // 정답: 원래 순서(A→B→C)를 새 레이블로 변환
    const correctText = '(' + usedLabels.map(l => newLabelMap[l]).join(')-(') + ')';
    // 모든 순열 생성
    const allPerms = [];
    const permute = (arr, cur=[]) => {
      if(cur.length===arr.length){allPerms.push([...cur]);return;}
      arr.forEach(x=>{if(!cur.includes(x))permute(arr,cur.concat(x));});
    };
    permute(usedLabels);
    const wrongPerms = allPerms
      .filter(p => '(' + p.join(')-(') + ')' !== correctText)
      .slice(0, 4)
      .map(p => '(' + p.join(')-(') + ')');
    const allOpts = shuffle([correctText, ...wrongPerms].slice(0,5))
      .map(text => ({text, correct: text===correctText}));
    return {type, passage, explanation: __expl, given, blocks, options: allOpts, instruction: '주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?'};
  }

  /* ③ 빈칸 추론 */
  case 'blank':{
    if(!passage.blank_target || !passage.blank_options || passage.blank_options.length < 5) return null;
    const blankSentIdx = passage.blank_sentence_index || 0;
    const blankSent = s[blankSentIdx];
    if(!blankSent || !blankSent.includes(passage.blank_target)) return null;
    const blanked = blankSent.replace(passage.blank_target, '_____');
    const opts = passage.blank_options.map((text, i) => ({
      text,
      correct: i === (passage.blank_answer - 1)
    }));
    return {type, passage, explanation: __expl, blanked, blankIdx: blankSentIdx, options: shuffle(opts), instruction: '다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?'};
  }

  /* ④ 문장 삽입 */
  case 'insert':{
    if(!passage.insert_sentence || !passage.insert_answer) return null;
    if(s.length < 4) return null;
    const correctPos = passage.insert_answer;
    const insertSentText = passage.insert_sentence.trim().slice(0,20);
    const sAtPos = typeof s[correctPos]==='string'?s[correctPos]:(s[correctPos]?.text||'');
    const needRemove = sAtPos.trim().startsWith(insertSentText);
    const sClean = needRemove ? [...s.slice(0,correctPos),...s.slice(correctPos+1)] : s;
    // needRemove시 문장이 제거돼 realPos는 sClean 길이를 넘지 않도록 보정
    const realPos = needRemove ? Math.min(correctPos, sClean.length) : correctPos;
    const total = sClean.length;
    // realPos가 total과 같으면 맨 끝 삽입 (after 없음)
    // before: realPos보다 앞, after: realPos보다 뒤 (realPos=total이면 after 없음)
    // before: 1~realPos-1, after: realPos+1~total (total=맨끝 자리 포함)
    const before = [];
    const after = [];
    for(let i = 1; i < realPos; i++) before.push(i); // i=0 제외
    for(let i = realPos + 1; i <= total; i++) after.push(i); // total=맨끝 자리
    // markerCount: before+after+1(realPos) 중 최대 5
    const markerCount = Math.min(5, before.length + after.length + 1);
    const maxBefore = Math.min(before.length, markerCount - 1);
    const maxAfter = Math.min(after.length, markerCount - 1);
    const minSlot = Math.max(0, markerCount - 1 - maxAfter);
    const maxSlot = Math.min(markerCount - 1, maxBefore);
    const clampedSlot = minSlot + Math.floor(Math.random() * (maxSlot - minSlot + 1));
    const needBefore = clampedSlot;
    const needAfter = markerCount - 1 - needBefore;
    // 균등 분배: 배열을 n등분해서 각 구간 중간값 선택
    const pickEvenly=(arr,n)=>{
      if(n<=0||arr.length===0)return[];
      if(n>=arr.length)return[...arr];
      const picks=[];
      for(let k=0;k<n;k++){
        const lo=Math.floor(k*arr.length/n);
        const hi=Math.floor((k+1)*arr.length/n)-1;
        picks.push(arr[Math.floor((lo+hi)/2)]);
      }
      return picks;
    };
    const beforePicks=pickEvenly(before,needBefore);
    const afterPicks=pickEvenly(after,needAfter);
    const markerIdxs = [...new Set([...beforePicks, realPos, ...afterPicks])].sort((a,b)=>a-b);
    return {type, passage, explanation: __expl, removed: passage.insert_sentence, remaining: sClean, markerIdxs, correctPos:realPos, instruction: '글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?'};
  }

  /* ⑤ 요약문 완성 */
  case 'summary':{
    if(!passage.summary_template || !passage.summary_A_options || !passage.summary_B_options) return null;
    const ansA = passage.summary_A_options[passage.summary_A_answer - 1];
    const ansB = passage.summary_B_options[passage.summary_B_answer - 1];
    const aArr = passage.summary_A_options.map((text, i) => ({text, correct: i === (passage.summary_A_answer - 1)}));
    const bArr = passage.summary_B_options.map((text, i) => ({text, correct: i === (passage.summary_B_answer - 1)}));
    // A와 B를 같은 순서로 셔플 (정답이 항상 같은 행에 오도록)
    const order = aArr.map((_,i)=>i);
    for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
    const aOpts = order.map(i=>aArr[i]);
    const bOpts = order.map(i=>bArr[i]);
    return {type, passage, explanation: __expl, abstract: passage.abstract, ansA, ansB, aOpts, bOpts, instruction: '다음 글의 내용을 한 문장으로 요약하고자 한다. 빈칸 (A)와 (B)에 들어갈 말로 가장 적절한 것은?'};
  }

  /* ⑥ 함의 추론 */
  case 'implication':{
    if(!passage.implication_keyword || !passage.implication_options || passage.implication_options.length < 5) return null;
    const sentIdx = passage.implication_sentence_index || 0;
    const targetSent = s[sentIdx];
    if(!targetSent) return null;
    const opts = passage.implication_options.map((text, i) => ({
      text,
      correct: i === (passage.implication_answer - 1)
    }));
    return {type, passage, explanation: __expl, targetIdx: sentIdx, underline: passage.implication_keyword, options: shuffle(opts), instruction: '밑줄 친 부분이 다음 글에서 의미하는 바로 가장 적절한 것은?'};
  }

  /* ⑦ 무관한 문장 */
  case 'irrelevant':{
    if(s.length < 5) return null; // 본문 5문장 이상이어야 ①~⑤ 번호 5개 보장
    // 새 데이터: 출제DB의 무관문장 사용 (삽입 위치는 출제 시 랜덤이므로 sentence_index 불필요)
    {
      const irrelSent = passage.irrel_sentence || (passage.irrel_candidates?.[passage.irrel_sel||0]) || null;
      if(irrelSent){
      // sentences가 객체 배열이면 text 추출
      const sTexts = s.map(x=>typeof x==='string'?x:(x?.text||''));
      // ★ 출제 시마다 삽입 위치 랜덤 (첫 문장 뒤 ~ 마지막 문장 앞) — 반복 풀이 시 위치 암기 방지
      const safeInsertAt = 1 + Math.floor(Math.random()*(sTexts.length-1));
      const fullClean = [...sTexts];
      fullClean.splice(safeInsertAt, 0, irrelSent);
      // ★ CSAT 표준: 무관문장을 포함한 "연속 5개 문장"에 ①~⑤ 부여 (번호 사이에 비번호 문장 없음)
      const fLen = fullClean.length;
      const wMin = Math.max(1, safeInsertAt - 4);
      const wMax = Math.min(safeInsertAt, fLen - 5);
      if(wMax < wMin) return null; // 안전장치 (s.length>=5면 발생 불가)
      const w = wMin + Math.floor(Math.random()*(wMax - wMin + 1));
      const numberedIdxs = [w, w+1, w+2, w+3, w+4];
      const correctNum = safeInsertAt - w + 1;
      return {type, passage, explanation: __expl, full:fullClean, numberedIdxs, correctNum, foreignSource: '', instruction: '다음 글에서 전체 흐름과 관계 없는 문장은?'};
      }
    }
    // 구 데이터 fallback: 다른 지문에서 외래 문장 삽입
    // (시트 지문은 출제DB 정답과 무관한 문제가 되므로 fallback 금지 → 출제 제외)
    if(passage.__gasOnly) return null;
    const others = allP.filter(p => p.id !== passage.id && Array.isArray(p.sentences) && p.sentences.length > 0);
    if(!others.length) return null;
    const rOther = others[Math.floor(Math.random() * others.length)];
    const rawF = rOther.sentences[Math.floor(Math.random() * rOther.sentences.length)];
    const foreign = typeof rawF==='string' ? rawF : (rawF?.text || rawF?.en || '');
    if(!foreign.trim()) return null;
    const insertAt = 1 + Math.floor(Math.random() * (s.length - 1));
    const full = [...s];
    full.splice(insertAt, 0, foreign);
    const restLen = full.length - 1;
    const chunkSize = restLen / 5;
    const numberedSet = new Set();
    for(let c = 0; c < 5; c++){
      const lo = 1 + Math.floor(c * chunkSize), hi = 1 + Math.floor((c + 1) * chunkSize);
      const segment = [...Array(hi - lo).keys()].map(k => lo + k);
      if(segment.length === 0){numberedSet.add(full.length - 1); continue;}
      numberedSet.add(segment[Math.floor(Math.random() * segment.length)]);
    }
    const numberedIdxs = [...numberedSet].sort((a, b) => a - b);
    const correctNum = numberedIdxs.indexOf(insertAt) + 1;
    if(correctNum === 0) return null;
    return {type, passage, explanation: __expl, full, numberedIdxs, correctNum, foreignSource: rOther.title, instruction: '다음 글에서 전체 흐름과 관계 없는 문장은?'};
  }

  /* ⑧ 어법 */
  case 'grammar':{
    if(!passage.grammar_items||passage.grammar_items.length<1) return null;
    // correct:false인 항목을 정답으로 자동 탐지
    const wrongIdx=passage.grammar_items.findIndex(it=>it.correct===false);
    const answer=wrongIdx>=0?wrongIdx+1:(passage.grammar_answer||1);
    const opts=passage.grammar_items.map((item,i)=>({
      text:item.word,
      note:item.note||'',
      correct:i+1===answer
    }));
    return {type,passage,explanation:__expl,options:opts,answer,instruction:'다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?'};
  }

  /* ⑨ 어휘 */
  case 'vocab':{
    if(!passage.vocab_items||passage.vocab_items.length<1) return null;
    // correct:false인 항목을 정답으로 자동 탐지
    const wrongIdx2=passage.vocab_items.findIndex(it=>it.correct===false);
    const answer=wrongIdx2>=0?wrongIdx2+1:(passage.vocab_answer||1);
    const opts=passage.vocab_items.map((item,i)=>({
      text:item.word,
      alt:item.alt||'',
      correct:i+1===answer
    }));
    return {type,passage,explanation:__expl,options:opts,answer,instruction:'다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?'};
  }

  default: return null;
  }
}

/* ── 타이머 훅 ── */
function useTimer(seconds, onExpire){
  const [left, setLeft]=useState(seconds);
  const [running, setRunning]=useState(true);
  const cbRef=useRef(onExpire);
  cbRef.current=onExpire;

  useEffect(()=>{
    setLeft(seconds);
    setRunning(true);
  },[seconds]);

  useEffect(()=>{
    if(!running)return;
    if(left<=0){cbRef.current?.();setRunning(false);return;}
    const t=setTimeout(()=>setLeft(l=>l-1),1000);
    return ()=>clearTimeout(t);
  },[left,running]);

  return {left, stop:()=>setRunning(false), reset:(s)=>{setLeft(s);setRunning(true);}};
}

function verifyLogin(name, pw){
  if(pw===getAdminPw()) return {ok:true, role:'admin', name};
  const students=getStudentsLocal();
  const s=students.find(s=>s.name===name&&s.password===pw);
  if(!s) return {ok:false, message:'이름 또는 비밀번호가 틀렸습니다.'};
  if(!s.active) return {ok:false, message:'비활성화된 계정입니다.'};

  return {ok:true, role:'student', name};
}

    const book=books.find(b=>b.id===activeBook);
    if(book) p=p.filter(x=>book.match(x.id));
    if(diffFilter!=='all')p=p.filter(x=>x.difficulty===diffFilter);
    if(searchText)p=p.filter(x=>x.title.includes(searchText)||x.id.includes(searchText.toUpperCase()));
    return p;
  },[diffFilter,searchText,activeBook,allPassages,books]);

  const toggleType=id=>{setSelectedTypes(p=>{const n=new Set(p);n.has(id)?n.delete(id):n.add(id);return n;});};
  const toggleAll=()=>{selectedTypes.size===TYPES.length?setSelectedTypes(new Set()):setSelectedTypes(new Set(TYPES.map(t=>t.id)));};
  const toggleP=id=>{setSelPassages(p=>{const n=new Set(p);n.has(id)?n.delete(id):n.add(id);return n;});};
  const selectAllInBook=(bookId)=>{
    const book=books.find(b=>b.id===bookId);if(!book)return;
    const ids=allPassages.filter(p=>book.match(p.id)).map(p=>p.id);
    setSelPassages(p=>{const n=new Set(p);ids.forEach(id=>n.add(id));return n;});
  };
  const deselectAllInBook=(bookId)=>{
    const book=books.find(b=>b.id===bookId);if(!book)return;
    const ids=allPassages.filter(p=>book.match(p.id)).map(p=>p.id);
    setSelPassages(p=>{const n=new Set(p);ids.forEach(id=>n.delete(id));return n;});
  };
  const bookSelCount=(bookId)=>{
    const book=books.find(b=>b.id===bookId);if(!book)return 0;
    return allPassages.filter(p=>book.match(p.id)&&selPassages.has(p.id)).length;
  };
  const bookTotalCount=(bookId)=>{
    const book=books.find(b=>b.id===bookId);if(!book)return 0;
    return allPassages.filter(p=>book.match(p.id)).length;
  };

  const PASSAGE_IDS=useMemo(()=>new Set(PASSAGES.map(p=>p.id)),[]);

  const [starting,setStarting]=useState(false);
  // ── 학습량 부족 경고 (학생 본인 로그인 시) ──
  // 목표 = (학습 시작일~오늘, 달력상 전체 일수)×30, 누적 < 목표×0.9 이면 경고
  const [shortfallWarn,setShortfallWarn]=useState(null); // null | {target, done, short, days, msg}
  const warnResolveRef=useRef(null); // 모달 '확인' 클릭 대기용
  const DAILY_GOAL=30;
  const MAX_DAILY=50; // 1회 출제 상한
  // 학습 계획 계산
  //  - target: 시작일~오늘 경과분(×30), 미달 판정용
  //  - short: 현 시점 부족분
  //  - recommend: 오늘 권장(정확값) = 30 + 올림(부족분/남은일수), 상한 없음
  //  - recommendCapped: 1회 출제용 = min(recommend, 50)
  const computeStudyPlan=(startDate,doneCount,expiry)=>{
    if(!startDate) return null;
    const sd=new Date(startDate);
    if(isNaN(sd)) return null;
    sd.setHours(0,0,0,0);
    const today=new Date(); today.setHours(0,0,0,0);
    const days=Math.floor((today-sd)/86400000)+1; // 시작일 당일 포함(경과 일수)
    if(days<1) return null;
    const target=days*DAILY_GOAL;
    const short=Math.max(0,target-doneCount); // 현 시점 부족분

    let recommend, remainDays=null, usingDeadline=false;
    if(expiry){
      const ed=new Date(expiry);
      if(!isNaN(ed)){
        ed.setHours(0,0,0,0);
        // 시험 직전 5일은 다른 과목 대비 기간 → 목표 마감을 만료일 5일 전으로 당김
        const goalEnd=new Date(ed.getTime()-5*86400000);
        const remain=Math.floor((goalEnd-today)/86400000)+1; // 오늘 포함 남은 일수
        if(remain>=1){
          remainDays=remain;
          // 오늘 권장 = 오늘치 30 + (밀린 부족분 × 1.5)를 남은 기간에 분배
          recommend=DAILY_GOAL+Math.ceil(short*1.5/remain);
          usingDeadline=true;
        }
      }
    }
    // 만료일 없음/지남 → 하루 30 고정 (나눌 기준 없음)
    if(recommend===undefined) recommend=DAILY_GOAL;

    const recommendCapped=Math.min(MAX_DAILY,recommend);
    const overCap=recommend>MAX_DAILY; // 권장이 1회 상한을 넘는지
    return {target,done:doneCount,short,days,recommend,recommendCapped,overCap,remainDays,usingDeadline};
  };
  const computeShortfall=(startDate,doneCount,expiry)=>{
    const plan=computeStudyPlan(startDate,doneCount,expiry);
    if(!plan) return null;
    if(doneCount>=plan.target*0.9) return null; // 10% 미만 미달이면 경고 없음
    return plan;
  };
  const start=async()=>{
    const types=[...selectedTypes];if(!types.length)return;
    if(selPassages.size===0)return;
    if(starting)return; // 중복 클릭 방지
    setStarting(true);
    setShortfallWarn(null);

    // 출제할 지문 풀 확정 + GAS 문제 선로딩을 '먼저' 시작 (팝업 읽는 동안 백그라운드 로딩)
    let pool=allPassages.filter(p=>selPassages.has(p.id));
    if(diffFilter!=='all')pool=pool.filter(p=>p.difficulty===diffFilter);
    pool=shuffle(pool);
    const gasIds=pool.filter(p=>!PASSAGE_IDS.has(p.id)).map(p=>p.id);
    const prefetchPromise=(gasIds.length&&scriptUrl)
      ? Promise.all(gasIds.map(pid=>jsonpFetch(scriptUrl,{action:'getQuestions',pid}).catch(()=>({ok:false,questions:[]}))))
      : Promise.resolve(null);

    let effectiveQCount=qCount; // 이번 회차에 사용할 문제 수 (메인 진입 팝업에서 이미 반영됨)
    try{
      // 선로딩된 GAS 문제 결과를 pool에 병합 (팝업 읽는 동안 대부분 끝나 있음)
      const fetched=await prefetchPromise;
      if(fetched){
        gasIds.forEach((pid,i)=>{
          const idx=pool.findIndex(p=>p.id===pid);
          if(idx<0)return;
          const qsArr=(fetched[i]?.ok&&fetched[i].questions)||[];
          const merged=qsArr.length?applyGasQuestions(pool[idx],qsArr):pool[idx];
          pool[idx]={...merged,__gasOnly:true,__authored:new Set(qsArr.map(q=>q.type))};
        });
      }

      // 지문별로 출제 가능한 유형의 문제를 미리 생성해 둔다 (유형 순서는 지문마다 랜덤)
      // byPassage = [{id, qs:[유형별 문제…]}], 각 지문 내 qs는 서로 다른 유형
      const byPassage=[];
      for(const p of pool){
        const pp=pool.find(x=>x.id===p.id)||p;
        const made=[];
        for(const t of shuffle([...types])){
          let q=null;
          try{ q=gen(pp,t,allPassages); }catch(e){ console.error('[문제 생성 오류]',pp?.id,t,e); }
          if(q) made.push(q); // 유형이 다르므로 같은 지문 내 유형 중복 없음
        }
        if(made.length) byPassage.push({id:p.id, qs:made});
      }

      // 라운드 로빈 균등 배분: 모든 지문에서 1문제씩(1라운드) → 부족하면 2·3라운드…
      // 각 지문은 자기 qs를 순서대로 소진 → 같은 지문에서 같은 유형이 다시 나오지 않음
      const picked=[];
      let round=0;
      let added=true;
      while(picked.length<effectiveQCount && added){
        added=false;
        for(const entry of byPassage){
          if(picked.length>=effectiveQCount) break;
          if(entry.qs.length>round){
            picked.push(entry.qs[round]);
            added=true;
          }
        }
        round++;
      }

      // 출제 순서 랜덤화 (지문 묶음으로 몰리지 않게)
      const qs=shuffle(picked).slice(0,Math.min(effectiveQCount,picked.length));
      if(!qs.length){ alert('출제할 수 있는 문제가 없습니다. 다른 교재나 유형을 선택해 주세요.'); return; }
      setQuestions(qs);setCurIdx(0);setUserAns({});setShowAns(false);setTimerKey(Date.now());setScreen('quiz');
    }catch(e){
      console.error('[시험 시작 오류]',e);
      alert('시험을 시작하는 중 오류가 발생했습니다. 새로고침 후 다시 시도해 주세요.');
    }finally{
      setStarting(false);
    }
  };

  const score=useMemo(()=>{let c=0,t=0;Object.values(userAns).forEach(a=>{if(a.correct)c++;t++;});return{correct:c,total:t};},[userAns]);

  const [printQs,setPrintQs]=useState([]);
  const [printMode,setPrintMode]=useState('q');

  // 🏆 메인 화면 탑3 배지 — 서버가 탑3일 때만 내려줌
  const [mainRank,setMainRank]=useState(null);
  useEffect(()=>{
    if(!scriptUrl||!studentName){setMainRank(null);return;}
    jsonpFetch(scriptUrl,{action:'getRank',student:studentName})
      .then(r=>{if(r&&r.ok&&r.show)setMainRank(r.rank);else setMainRank(null);})
      .catch(()=>{});
  },[scriptUrl,studentName]);

  // ── 학생 본인: 누적 풀이 데이터 로딩 (사각지대/권장량 계산용) ──
  const [myPerPid,setMyPerPid]=useState({});
  const [myDoneSince,setMyDoneSince]=useState(0);
  const [myStatsReady,setMyStatsReady]=useState(false);
  const myStatsRef=useRef('');
  useEffect(()=>{
    if(session?.role!=='student'||!scriptUrl||!studentName){setMyPerPid({});setMyDoneSince(0);setMyStatsReady(false);return;}
    if(myStatsRef.current===studentName) return;
    myStatsRef.current=studentName;
    jsonpFetch(scriptUrl,{action:'getStats',student:studentName})
      .then(d=>{
        const sess=(d&&d.sessionStats)||[];
        const sd=session?.startDate?new Date(session.startDate):null; if(sd)sd.setHours(0,0,0,0);
        const per={}; let since=0;
        sess.forEach(s=>{
          const sdate=new Date(String(s.date||'').replace(' ','T'));
          const afterStart=sd?(!isNaN(sdate)&&sdate>=sd):true;
          String(s.detail||'').split('||').filter(Boolean).forEach(line=>{
            const p=line.split('|'); const pid=p[0]||''; if(p.length<3||!pid)return;
            if(!per[pid])per[pid]={t:0,c:0};
            per[pid].t++; if(p[2]==='O')per[pid].c++;
            if(afterStart)since++;
          });
        });
        setMyPerPid(per); setMyDoneSince(since); setMyStatsReady(true);
      })
      .catch(()=>{ setMyStatsReady(true); }); // 실패해도 버튼은 풀어줌(기록 없음으로 간주)
  },[session,scriptUrl,studentName]);

  // ── 학생용 시험범위 프리셋 로딩 (공용 프리셋, GAS) ──
  const [stuPresets,setStuPresets]=useState([]);
  useEffect(()=>{
    if(!scriptUrl){setStuPresets([]);return;}
    jsonpFetch(scriptUrl,{action:'getPresets'})
      .then(d=>{ if(d&&d.ok&&Array.isArray(d.presets))setStuPresets(d.presets); })
      .catch(()=>{});
  },[scriptUrl]);

  // 메인(setup) 첫 진입 시 1회: 학습량 점검 팝업. 한 번 본 뒤에는 로그아웃 전까지 다시 안 뜸.
  useEffect(()=>{
    if(screen!=='setup') return;
    if(session?.role!=='student'||!session?.startDate||!scriptUrl||!studentName) return;
    const seenKey='greateng_intro_seen_'+studentName;
    try{ if(sessionStorage.getItem(seenKey)==='1') return; }catch(e){}
    try{ sessionStorage.setItem(seenKey,'1'); }catch(e){}
    jsonpFetch(scriptUrl,{action:'getStats',student:studentName})
      .then(d=>{
        const sess=(d&&d.sessionStats)||[];
        const sd=new Date(session.startDate); sd.setHours(0,0,0,0);
        let done=0;
        sess.forEach(s=>{
          const sdate=new Date(String(s.date||'').replace(' ','T'));
          if(isNaN(sdate)||sdate<sd) return;
          String(s.detail||'').split('||').filter(Boolean).forEach(line=>{
            if(line.split('|').length>=3) done++;
          });
        });
        const plan=computeStudyPlan(session.startDate,done,session.expiry);
        if(!plan) return;
        const isShort=done<plan.target*0.9;
        setShortfallWarn({...plan, mode:isShort?'short':'praise', msg:isShort?pickMotivation():pickPraise()});
        warnResolveRef.current=(choice)=>{
          if(isShort && choice===true && plan.recommendCapped>0) setQCount(plan.recommendCapped);
          setShortfallWarn(null); warnResolveRef.current=null;
        };
      })
      .catch(()=>{});
  },[screen,session,scriptUrl,studentName]);

  // 🔁 오답 복습 — 누적 이력에서 (지문×유형)별 마지막 시도가 틀림(X)인 조합만 재출제 (최대 10문항)
  const [reviewLoading,setReviewLoading]=useState(false);
  const startReview=async()=>{
    if(!scriptUrl||!studentName)return;
    setReviewLoading(true);
    try{
      const d=await jsonpFetch(scriptUrl,{action:'getStats',student:studentName});
      const sessions=(d&&d.sessionStats)||[];
      const last=new Map(); // "pid|유형명" → 마지막 O/X (sessions는 오래된→최신)
      sessions.forEach(s=>{
        String(s.detail||'').split('||').filter(Boolean).forEach(line=>{
          const parts=line.split('|');
          if(parts.length<3)return;
          last.set(parts[0].trim()+'|'+parts[1].trim(),parts[2].trim());
        });
      });
      const wrongCombos=[];
      last.forEach((ox,key)=>{
        if(ox!=='X')return;
        const sep=key.indexOf('|');
        const pid=key.slice(0,sep), tname=key.slice(sep+1);
        const tid=TYPES.find(t=>t.name===tname)?.id;
        if(!tid)return;
        const p=allPassages.find(pp=>pp.id===pid);
        if(!p)return; // 비공개·삭제된 지문은 제외
        wrongCombos.push({p,tid});
      });
      if(!wrongCombos.length){alert('복습할 오답이 없습니다! 🎉');setReviewLoading(false);return;}
      const picked=shuffle(wrongCombos).slice(0,10);
      // 시트 지문은 출제DB 로드 후 생성
      const gasIds=[...new Set(picked.filter(c=>!PASSAGE_IDS.has(c.p.id)).map(c=>c.p.id))];
      const qMap={};
      if(gasIds.length){
        const fetched=await Promise.all(gasIds.map(pid=>jsonpFetch(scriptUrl,{action:'getQuestions',pid}).catch(()=>({ok:false,questions:[]}))));
        gasIds.forEach((pid,i)=>{qMap[pid]=(fetched[i]?.ok&&fetched[i].questions)||[];});
      }
      const qs=[];
      for(const c of picked){
        let pp=c.p;
        if(qMap[pp.id]!==undefined){
          const qsArr=qMap[pp.id];
          pp={...(qsArr.length?applyGasQuestions(pp,qsArr):pp),__gasOnly:true,__authored:new Set(qsArr.map(q=>q.type))};
        }
        const q=gen(pp,c.tid,allPassages);
        if(q)qs.push(q);
      }
      if(!qs.length){alert('복습 문항을 생성하지 못했습니다.\n(해당 지문이 비공개이거나 출제 데이터가 부족합니다)');setReviewLoading(false);return;}
      setQuestions(shuffle(qs));setCurIdx(0);setUserAns({});setShowAns(false);setTimerKey(Date.now());setScreen('quiz');
    }catch(e){alert('오답 복습 로드 실패: '+e.message);}
    setReviewLoading(false);
  };

  const genQuestions=async()=>{
    const types=[...selectedTypes];if(!types.length||selPassages.size===0)return [];
    let pool=allPassages.filter(p=>selPassages.has(p.id));
    if(diffFilter!=='all')pool=pool.filter(p=>p.difficulty===diffFilter);
    if(hotOnly)pool=pool.filter(p=>p.is_hot==='TRUE'||p.is_hot===true);
    pool=shuffle(pool);

    const gasIds=pool.filter(p=>!PASSAGE_IDS.has(p.id)).map(p=>p.id);
    if(gasIds.length&&scriptUrl){
      const fetched=await Promise.all(gasIds.map(pid=>
        jsonpFetch(scriptUrl,{action:'getQuestions',pid}).catch(()=>({ok:false,questions:[]}))
      ));
      gasIds.forEach((pid,i)=>{
        const idx=pool.findIndex(p=>p.id===pid);
        if(idx<0)return;
        const qsArr=(fetched[i]?.ok&&fetched[i].questions)||[];
        const merged=qsArr.length?applyGasQuestions(pool[idx],qsArr):pool[idx];
        pool[idx]={...merged,__gasOnly:true,__authored:new Set(qsArr.map(q=>q.type))};
      });
    }

    const combos=[];
    for(const p of pool){
      for(const t of types){
        const q=gen(p,t,allPassages);
        if(q) combos.push(q);
      }
    }
    const shuffled=shuffle(combos);
    const qs=shuffled.slice(0,Math.min(qCount,shuffled.length));
    return qs;
  };

  const printDirect=async(mode)=>{
    const qs=await genQuestions();if(!qs.length)return;
    setPrintQs(qs);setPrintMode(mode);setScreen('print');
  };

  const doPrintFromQuiz=(mode)=>{
    setPrintQs(questions);setPrintMode(mode);setScreen('print');
  };

  const goToAdmin=(pw)=>{
    if(pw){const s={...session,adminPw:pw};setSession(s);sessionStorage.setItem(SESSION_KEY,JSON.stringify(s));}
    setScreen('admin');
  };

  if(screen==='login') return <LoginScreen scriptUrl={scriptUrl} setScriptUrl={setScriptUrl} onLogin={(sess)=>{setSession(sess);setStudentName(sess.name);sessionStorage.setItem(SESSION_KEY,JSON.stringify(sess));setScreen(sess.role==='admin'?'admin':'setup');}} />;
  if(screen==='admin') return <AdminPanel scriptUrl={scriptUrl} adminPw={session?.adminPw||''} goBack={()=>{try{sessionStorage.removeItem('greateng_admin_entered');}catch(e){}sessionStorage.removeItem(SESSION_KEY);setSession(null);setScreen('login');}} goToSetup={()=>{try{sessionStorage.removeItem('greateng_admin_entered');}catch(e){}setScreen('setup');}} openSetupNewTab={()=>{
    try{
      const s=session?{...session}:null;
      if(s){ delete s.adminPw; localStorage.setItem(HANDOFF_KEY,JSON.stringify({...s,_goSetup:true})); }
    }catch(e){}
    window.open(window.location.pathname+window.location.search,'_blank');
  }} />;
  if(screen==='study') return <StudyView scriptUrl={scriptUrl} studentName={studentName} goBack={()=>setScreen('setup')} />;
  if(screen==='setup') return <Setup {...{selectedTypes,setSelectedTypes,toggleType,toggleAll,filtP,selPassages,setSelPassages,toggleP,stuPresets,myPerPid,myStatsReady,activeBook,setActiveBook,selectAllInBook,deselectAllInBook,bookSelCount,bookTotalCount,qCount,setQCount,ansMode,setAnsMode,diffFilter,setDiffFilter,hotOnly,setHotOnly,searchText,setSearchText,start,starting,shortfallWarn,setShortfallWarn,warnResolveRef,printDirect,startReview,reviewLoading,mainRank,books,allPassages,studentName,setStudentName,scriptUrl,setScriptUrl,session,expandedLessons,setExpandedLessons,goToAdmin,goToStudy:()=>setScreen('study'),onLogout:()=>{try{sessionStorage.removeItem('greateng_intro_seen_'+studentName);}catch(e){}sessionStorage.removeItem(SESSION_KEY);setSession(null);setStudentName('');setScreen('login');}}} />;
  if(screen==='print') return <PrintView questions={printQs} mode={printMode} goBack={()=>setScreen(questions.length>0?'quiz':'setup')} />;
  if(screen==='results') return <Results questions={questions} userAns={userAns} score={score} studentName={studentName} scriptUrl={scriptUrl} gasPassages={gasPassages} goHome={()=>setScreen('setup')} doPrint={(mode)=>{setPrintQs(questions);setPrintMode(mode);setScreen('print');}} />;

  const q=questions[curIdx];
  if(!q)return <div style={{padding:40,textAlign:'center'}}>문제 없음<br/><button onClick={()=>setScreen('setup')}>돌아가기</button></div>;

  return <QuizErrorBoundary resetKey={curIdx} qInfo={q} onSkip={()=>{setShowAns(false);if(curIdx+1>=questions.length){setScreen('results');}else{setCurIdx(curIdx+1);setTimerKey(Date.now());}}}>
    <Quiz q={q} idx={curIdx} total={questions.length} userAnswer={userAns[curIdx]}
    showAnswer={showAns||(ansMode==='immediate'&&!!userAns[curIdx]&&!userAns[curIdx]?.expired)}
    onSubmit={ans=>{setUserAns(p=>({...p,[curIdx]:ans}));if(ansMode==='immediate')setShowAns(true);}}
    onNext={()=>{setShowAns(false);if(curIdx+1>=questions.length){setScreen('results');}else{setCurIdx(curIdx+1);setTimerKey(Date.now());}}}
    score={score} ansMode={ansMode} goHome={()=>setScreen('setup')}
    questions={questions} userAns={userAns} timerKey={timerKey}
    doPrint={doPrintFromQuiz}
  />
  </QuizErrorBoundary>;
}

/* ── 스타일 ── */
const S={
  // 브랜드 팔레트 토큰
  c:{wine:'#7a1020',wineSoft:'#9a3040',gold:'#C9A84C',goldDk:'#9a7040',
     ink:'#3a2a20',sub:'#9a8570',line:'rgba(201,168,76,0.22)',
     ok:'#1E6B30',okBg:'#EAF5EC',ng:'#B3261E',ngBg:'#FBECEA',

/* ── 로그인 화면 ── */
function LoginScreen({scriptUrl,setScriptUrl,onLogin}){
  const [name,setName]=useState('');
  const [pw,setPw]=useState('');
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState('');
  const [showUrlInput,setShowUrlInput]=useState(!scriptUrl);
  const [adminMode,setAdminMode]=useState(false);
  const [adminPwInput,setAdminPwInput]=useState('');
  const [adminErr,setAdminErr]=useState('');

  const serverAuth=async(name,pw)=>{
    try{
      return await jsonpFetch(scriptUrl,{action:'login',name,password:pw});
    }catch(e){
      return {status:'error',message:'서버 연결 실패'};
    }
  };

  const doLogin=async()=>{
    if(!name.trim()||!pw.trim()){setError('이름과 비밀번호를 입력해주세요.');return;}
    if(!scriptUrl){setError('관리자에게 서버 URL을 문의하세요.');return;}
    setLoading(true);setError('');
    // 서버 인증 (서버가 만료일/활성화 모두 체크)
    try{
      const result=await jsonpFetch(scriptUrl,{action:'login',name:name.trim(),password:pw});
      if(result.ok){
        onLogin({name:result.name||name.trim(),role:result.role||'student',startDate:result.startDate||'',expiry:result.expiry||'',adminPw:result.role==='admin'?pw:undefined});
      } else {
        setError(result.error||result.message||'로그인 실패');
      }
    }catch(e){
      setError('서버 연결 실패. 인터넷을 확인하세요.');
    }
    setLoading(false);
  };

  const doAdminLogin=async()=>{
    setLoading(true);setAdminErr('');
    try{
      const result=await jsonpFetch(scriptUrl,{action:'login',name:'관리자',password:adminPwInput});
      if(result.ok&&result.role==='admin'){
        onLogin({name:'관리자',role:'admin',adminPw:adminPwInput});
      } else {
        setAdminErr('비밀번호가 틀렸습니다.');
      }
    }catch(e){
      setAdminErr('서버 연결 실패');
    }
    setLoading(false);
  };

  const [tapCount,setTapCount]=useState(0);
  const handleLogoTap=()=>{
    const next=tapCount+1;
    setTapCount(next);
    if(next>=5){setShowUrlInput(true);setTapCount(0);}
  };

  return(
    <div style={{minHeight:'100vh',background:'linear-gradient(160deg,#1a0005 0%,#3d0010 50%,#1a0005 100%)',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:"'Pretendard',sans-serif",position:'relative',overflow:'hidden'}}>
      <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet"/>
      <div style={{position:'absolute',top:'-100px',left:'-100px',width:350,height:350,borderRadius:'50%',background:'radial-gradient(circle,rgba(201,168,76,0.15) 0%,transparent 70%)',pointerEvents:'none'}}/>
      <div style={{position:'absolute',bottom:'-80px',right:'-80px',width:300,height:300,borderRadius:'50%',background:'radial-gradient(circle,rgba(201,168,76,0.10) 0%,transparent 70%)',pointerEvents:'none'}}/>
      <div style={{width:'100%',maxWidth:400,padding:'0 20px'}}>
        <div style={{background:'rgba(15,0,6,0.80)',borderRadius:24,padding:'42px 32px',boxShadow:'0 8px 48px rgba(0,0,0,0.65)',backdropFilter:'blur(20px)',border:'1px solid rgba(201,168,76,0.4)'}}>
          <div style={{textAlign:'center',marginBottom:32}}>
            <div style={{cursor:'pointer',userSelect:'none',display:'inline-block',marginBottom:16}} onClick={handleLogoTap}>
              <img src={LOGO} alt="logo" style={{width:130,height:130,borderRadius:'50%',border:'2px solid #C9A84C',boxShadow:'0 0 40px rgba(201,168,76,0.4)',display:'block'}}/>
            </div>
            <h1 style={{fontSize:26,fontWeight:900,color:'#C9A84C',margin:0,letterSpacing:2,textShadow:'0 2px 12px rgba(0,0,0,0.6)'}}>대단한영어</h1>
            <p style={{fontSize:13,color:'rgba(201,168,76,0.65)',marginTop:7,letterSpacing:0.5}}>이름과 비밀번호를 입력하세요</p>
          </div>
          <input value={name} onChange={e=>setName(e.target.value)} placeholder="이름"
            style={{width:'100%',padding:'13px 16px',borderRadius:12,border:'1.5px solid rgba(201,168,76,0.35)',fontSize:15,outline:'none',boxSizing:'border-box',marginBottom:10,background:'rgba(255,255,255,0.07)',color:'#f5e6c0',fontFamily:"'Pretendard',sans-serif"}}/>
          <input type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="비밀번호"
            onKeyDown={e=>e.key==='Enter'&&doLogin()}
            style={{width:'100%',padding:'13px 16px',borderRadius:12,border:'1.5px solid rgba(201,168,76,0.35)',fontSize:15,outline:'none',boxSizing:'border-box',marginBottom:18,background:'rgba(255,255,255,0.07)',color:'#f5e6c0',fontFamily:"'Pretendard',sans-serif"}}/>
          {error&&<p style={{fontSize:12.5,color:'#ff8a80',textAlign:'center',marginBottom:12}}>{error}</p>}
          <button onClick={doLogin} disabled={loading} style={{width:'100%',padding:14,borderRadius:12,border:'none',background:'linear-gradient(135deg,#C9A84C 0%,#e8c96a 50%,#a8873d 100%)',color:'#3d0010',fontSize:16,fontWeight:800,cursor:'pointer',boxShadow:'0 4px 20px rgba(201,168,76,0.45)',letterSpacing:1}}>
            {loading?'확인 중...':'시작하기'}
          </button>

          {/* 숨겨진 관리자 URL 설정 - 로고 5번 탭으로 노출 */}
          {showUrlInput&&<div style={{marginTop:14,borderTop:'1px solid #f1f5f9',paddingTop:12}}>
            <p style={{fontSize:11,color:'#94a3b8',marginBottom:6,textAlign:'center'}}>⚙️ 서버 URL 설정</p>
            <input value={scriptUrl} onChange={e=>{setScriptUrl(e.target.value);localStorage.setItem('greateng_script_url',e.target.value);}}
              placeholder="Apps Script 배포 URL"
              style={{width:'100%',padding:'8px 12px',borderRadius:9,border:'1px solid #e2e8f0',fontSize:11.5,outline:'none',boxSizing:'border-box',color:'#64748b'}}/>
          </div>}
        </div>
      </div>
    </div>
  );
}

/* ── 관리자 패널 ── */
function AdminPanel({scriptUrl,adminPw,goBack,goToSetup,openSetupNewTab}){
  // 진입 시엔 결과 탭 고정, 새로고침(재로드) 시엔 보던 탭 유지
  const [tab,setTabState]=useState(()=>{
    try{
      // _adminEntered 플래그가 있으면 = 이미 패널에 머무는 중 새로고침 → 저장된 탭 복원
      if(sessionStorage.getItem('greateng_admin_entered')==='1'){
        return sessionStorage.getItem('greateng_admin_tab')||'results';
      }
    }catch(e){}
    // 새 진입
    try{sessionStorage.setItem('greateng_admin_entered','1');}catch(e){}
    return 'results';
  });
  const setTab=(t)=>{setTabState(t);try{sessionStorage.setItem('greateng_admin_tab',t);}catch(e){}};
  const [students,setStudents]=useState([]);
  const [loading,setLoading]=useState(false);
  const [msg,setMsg]=useState('');
  // 학생 추가/편집 폼
  const [form,setForm]=useState({name:'',password:'',expiry:'',startDate:'',active:true});
  const [editName,setEditName]=useState(null);
  const [blindLowThreshold,setBlindLowThreshold]=useState(1); // 관리자: '적게 푼' 기준 (N회 이하)
  // 결과 필터
  const [selectedStudent,setSelectedStudent]=useState(''); // '' = 전체
  const [stats,setStats]=useState(null);
  const [statsLoading,setStatsLoading]=useState(false);
  // ★ 시험결과 인쇄 — 섹션 선택 모달. null | {scope:'student'|'all', opts:{...}}
  const [reportModal,setReportModal]=useState(null);

  const api=async(body)=>{
    return jsonpFetch(scriptUrl, {...body, adminPw});
  };

  // 학생 목록: 서버 우선, 실패 시 로컬
  const loadStudents=async()=>{
    // 로컬 먼저 표시 (빠른 렌더링)
    setStudents(getStudentsLocal());
    if(scriptUrl){
      try{
        const d=await api({action:'getStudents'});
        if(d.ok){
          // 만료일·시작일을 YYYY-MM-DD 형식으로 정규화
          const normDate=(v)=>{
            if(!v) return '';
            const dt=new Date(v);
            if(isNaN(dt)) return v;
            const y=dt.getFullYear();
            const m=String(dt.getMonth()+1).padStart(2,'0');
            const day=String(dt.getDate()).padStart(2,'0');
            return `${y}-${m}-${day}`;
          };
          const normalized=(d.students||[]).map(s=>({
            ...s,
            expiry:normDate(s.expiry),
            startDate:normDate(s.startDate)
          }));
          setStudents(normalized);
          saveStudentsLocal(normalized);
        }
      }catch(e){}
    }
  };

  const [expandedSession,setExpandedSession]=useState(null);
  // ── 시험 범위(커버리지 분석용) ── 교재/강 id 집합. localStorage에 저장
  const RANGE_KEY='greateng_exam_range';
  const [examRange,setExamRange]=useState(()=>{
    try{const v=JSON.parse(localStorage.getItem(RANGE_KEY));return new Set(Array.isArray(v)?v:[]);}catch{return new Set();}
  });
  const [rangePids,setRangePids]=useState(null); // 범위에 속한 전체 pid 목록(범위 지문 분모)
  const [rangeOpen,setRangeOpen]=useState(false);
  const [rangeExpBook,setRangeExpBook]=useState(()=>new Set()); // 펼친 교재
  const [rangeExpChap,setRangeExpChap]=useState(()=>new Set()); // 펼친 강(교재|강 키)
  const [weakTab,setWeakTab]=useState('pid'); // 'pid'=지문약점, 'type'=유형약점
  const saveRange=(set)=>{
    setExamRange(new Set(set));
    try{localStorage.setItem(RANGE_KEY,JSON.stringify([...set]));}catch{}
  };
  // ── 시험범위 프리셋(공용, GAS 저장) ──
  const [presets,setPresets]=useState([]);
  const [presetBusy,setPresetBusy]=useState(false);
  const loadPresets=React.useCallback(()=>{
    if(!scriptUrl)return;
    jsonpFetch(scriptUrl,{action:'getPresets'})
      .then(d=>{ if(d&&d.ok&&Array.isArray(d.presets))setPresets(d.presets); })
      .catch(()=>{});
  },[scriptUrl]);
  React.useEffect(()=>{ loadPresets(); },[loadPresets]);
  const applyPreset=(pr)=>{ if(pr&&Array.isArray(pr.ranges))saveRange(new Set(pr.ranges)); };
  const savePresetToServer=(name,id)=>{
    if(!scriptUrl)return;
    setPresetBusy(true);
    jsonpFetch(scriptUrl,{action:'savePreset',name,id:id||'',ranges_json:JSON.stringify([...examRange])})
      .then(d=>{ if(d&&d.ok){ loadPresets(); setMsg('✅ 프리셋 저장됨'); } else setMsg('❌ 저장 실패: '+((d&&d.error)||'')); })
      .catch(()=>setMsg('❌ 프리셋 저장 통신 실패'))
      .finally(()=>setPresetBusy(false));
  };
  const deletePresetFromServer=(id)=>{
    if(!scriptUrl||!id)return;
    setPresetBusy(true);
    jsonpFetch(scriptUrl,{action:'deletePreset',id})
      .then(d=>{ if(d&&d.ok){ loadPresets(); setMsg('🗑 프리셋 삭제됨'); } else setMsg('❌ 삭제 실패'); })
      .catch(()=>setMsg('❌ 프리셋 삭제 통신 실패'))
      .finally(()=>setPresetBusy(false));
  };
  // 출제DB 전체 pid를 한 번 받아 캐시 → 범위(prefix) 필터로 분모 구성
  const [allQPids,setAllQPids]=useState(null);
  React.useEffect(()=>{
    if(!scriptUrl){setAllQPids([]);return;}
    jsonpFetch(scriptUrl,{action:'getQuestionPids'})
      .then(d=>setAllQPids((d&&d.ok&&d.pids)||[]))
      .catch(()=>setAllQPids([]));
  },[scriptUrl]);
  // 범위 트리/분모용 통합 pid 풀: passages.js(정적) ∪ 출제DB(GAS).
  // 정적은 allPassages 규칙과 동일하게 27STYD·27ST_E_test 제외(시트 전용).
  const rangePidPool=useMemo(()=>{
    const set=new Set();
    try{ (typeof PASSAGES!=='undefined'?PASSAGES:[]).forEach(p=>{
      const id=p&&p.id||''; if(!id)return;
      if(id.startsWith('27STYD')||id.startsWith('27ST_E_test'))return;
      set.add(id);
    }); }catch{}
    (Array.isArray(allQPids)?allQPids:[]).forEach(pid=>set.add(pid));
    return [...set];
  },[allQPids]);
  const [wrongSort,setWrongSort]=useState('count'); // 'count'=틀린 횟수순, 'ratio'=틀린 비율순
  // 화면·인쇄 공통 정렬 (어긋남 방지). sortMode 미지정 시 현재 wrongSort 사용.
  const sortWrongs=(arr,sortMode)=>{
    const mode=sortMode||wrongSort;
    return (arr||[]).slice().sort((a,b)=>{
      if(mode==='ratio'){
        const ra=Number(a.total)?Number(a.wrong)/Number(a.total):0;
        const rb=Number(b.total)?Number(b.wrong)/Number(b.total):0;
        return (rb-ra)||(Number(b.wrong)-Number(a.wrong));
      }
      return (Number(b.wrong)-Number(a.wrong))||((Number(b.total)?Number(b.wrong)/Number(b.total):0)-(Number(a.total)?Number(a.wrong)/Number(a.total):0));
    });
  };
  const loadStats=async(student)=>{
    if(!scriptUrl){setMsg('결과 저장 URL을 설정 탭에서 입력하세요.');return;}
    setStatsLoading(true);setStats(null);setExpandedSession(null);
    try{
      const body={action:'getStats'};
      if(student)body.student=student;
      const d=await api(body);
      if(d.ok!==false)setStats(d);
      else setMsg(d.error||'통계 오류');
    }catch(e){setMsg('통계 불러오기 실패');}
    setStatsLoading(false);
  };

  React.useEffect(()=>{loadStudents();loadStats('');},[]);

  const saveStudent=async()=>{
    if(!form.name||!form.password){setMsg('이름과 비밀번호를 입력하세요.');return;}
    setLoading(true);
    // 로컬 저장
    const arr=getStudentsLocal();
    const idx=arr.findIndex(s=>s.name===form.name);
    const obj={name:form.name,password:form.password,expiry:form.expiry||'',startDate:form.startDate||'',active:form.active!==false};
    if(idx>=0)arr[idx]=obj;else arr.push(obj);
    saveStudentsLocal(arr);
    // 서버 저장
    if(scriptUrl){
      try{await api({action:'saveStudent',...form});}catch(e){}
    }
    setMsg('저장 완료!');
    setForm({name:'',password:'',expiry:'',startDate:'',active:true});
    setEditName(null);
    await loadStudents();
    setLoading(false);
  };

  const deleteStudent=async(name)=>{
    if(!confirm(`'${name}' 학생을 삭제할까요?`))return;
    saveStudentsLocal(getStudentsLocal().filter(s=>s.name!==name));
    if(scriptUrl){try{await api({action:'deleteStudent',name});}catch(e){}}
    loadStudents();
  };

  // ── 교재 관리 (공개/숨김 일괄 토글) ──
  const [bookList,setBookList]=useState([]);      // [{source,label,total,publicCount}]
  const [bookLoading,setBookLoading]=useState(false);
  const [bookBusy,setBookBusy]=useState('');       // 작업 중인 교재 source
  const loadBooks=async()=>{
    if(!scriptUrl){setMsg('설정 탭에서 서버 URL을 먼저 입력하세요.');return;}
    setBookLoading(true);
    try{
      const r=await api({action:'getPassages'}); // 전체(비공개 포함)
      const passages=(r&&r.passages)||[];
      const groups={};
      passages.forEach(p=>{
        const bid=bookIdOf(p);
        if(!groups[bid])groups[bid]={source:bid,label:bookLabel(bid),total:0,publicCount:0};
        groups[bid].total++;
        if(p.is_public==='TRUE'||p.is_public===true)groups[bid].publicCount++;
      });
      setBookList(Object.values(groups).sort((a,b)=>a.label.localeCompare(b.label)));
    }catch(e){setMsg('교재 목록을 불러오지 못했습니다.');}
    setBookLoading(false);
  };
  // 교재 전체를 공개/비공개로 일괄 변경 (지문 데이터는 그대로, is_public만 변경)
  const setBookVisible=async(book,makeVisible)=>{
    if(!scriptUrl){setMsg('서버 URL이 필요합니다.');return;}
    const action=makeVisible?'표시':'숨김';
    if(!confirm(`'${book.label}' 교재를 ${book.total}개 지문 모두 ${makeVisible?'🌐 표시(공개)':'📦 숨김(비공개)'}로 변경할까요?`))return;
    setBookBusy(book.source);setMsg('');
    try{
      const r=await api({action:'getPassages'});
      const targets=((r&&r.passages)||[]).filter(p=>bookIdOf(p)===book.source);
      let ok=0,fail=0;
      for(const p of targets){
        const want=makeVisible?'TRUE':'FALSE';
        const cur=(p.is_public==='TRUE'||p.is_public===true)?'TRUE':'FALSE';
        if(cur===want){ok++;continue;} // 이미 원하는 상태면 건너뜀
        try{
          const res=await api({action:'savePassage',id:p.id,is_public:want});
          if(res&&(res.ok||res.warning||res.status==='ok'))ok++;else fail++;
        }catch(e){fail++;}
      }
      setMsg(`✅ '${book.label}' ${action} 완료 (성공 ${ok}개${fail?` / 실패 ${fail}개`:''})`);
      await loadBooks();
    }catch(e){setMsg('변경 중 오류가 발생했습니다.');}
    setBookBusy('');
  };


  const SHEETS_URL_KEY='greateng_sheets_url';
  const [sheetsUrl,setSheetsUrl]=useState(()=>localStorage.getItem('greateng_sheets_url')||'');
  const [scriptUrlLocal,setScriptUrlLocal]=useState(()=>localStorage.getItem('greateng_script_url')||scriptUrl||'');
  const [curAdminPw,setCurAdminPw]=useState('');
  const [newAdminPw,setNewAdminPw]=useState('');
  const [confirmNewPw,setConfirmNewPw]=useState('');
  const changeAdminPw=async()=>{
    if(!curAdminPw||!newAdminPw||!confirmNewPw){setMsg('모든 항목을 입력하세요.');return;}
    if(newAdminPw!==confirmNewPw){setMsg('새 비밀번호가 일치하지 않습니다.');return;}
    if(newAdminPw.length<4){setMsg('새 비밀번호는 4자 이상이어야 합니다.');return;}
    setLoading(true);
    try{
      const d=await jsonpFetch(scriptUrl,{action:'changeAdminPw',oldPw:curAdminPw,newPw:newAdminPw});
      if(d.status==='ok'){
        setCurAdminPw('');setNewAdminPw('');setConfirmNewPw('');
        setMsg('✅ 비밀번호 변경 완료! 다음 로그인부터 새 비밀번호를 사용하세요.');
      } else {
        setMsg('❌ '+(d.message||'변경 실패. 현재 비밀번호를 확인하세요.'));
      }
    }catch(e){
      setMsg('❌ 서버 연결 실패. 인터넷 연결을 확인하세요.');
    }
    setLoading(false);
  };

  const startEdit=(s)=>{setEditName(s.name);setForm({name:s.name,password:s.password,expiry:s.expiry||'',startDate:s.startDate||'',active:s.active});};

  // ── 약점/커버리지 공통 계산 (화면 카드 = 인쇄 동일 보장) ──
  const computeWeakness=()=>{
    if(!stats||!(stats.sessionStats||[]).length)return null;
    const perPid={}, perType={};
    const inRangeChk=(pid)=>{
      if(examRange.size===0)return true;
      for(const pre of examRange){ if(pid===pre||pid.startsWith(pre+'_'))return true; }
      return false;
    };
    (stats.sessionStats||[]).forEach((s,si)=>{
      (s.detail||'').split('||').filter(Boolean).forEach(line=>{
        const p=line.split('|'); const pid=p[0]||''; if(!pid)return;
        const tname=p[1]||''; const ok=p[2]==='O';
        if(!perPid[pid])perPid[pid]={t:0,c:0,hist:[]};
        perPid[pid].t++; if(ok)perPid[pid].c++; perPid[pid].hist.push({s:si,ok});
        if(tname&&inRangeChk(pid)){
          if(!perType[tname])perType[tname]={t:0,c:0,hist:[]};
          perType[tname].t++; if(ok)perType[tname].c++; perType[tname].hist.push({s:si,ok});
        }
      });
    });
    const rangeAll=(examRange.size>0)?rangePidPool.filter(inRangeChk):Object.keys(perPid);
    const WZ=1.96;
    const wilsonLowerWrong=(wrong,n)=>{ if(n<=0)return 0; const phat=wrong/n,z2=WZ*WZ;
      return Math.max(0,((phat+z2/(2*n))-WZ*Math.sqrt((phat*(1-phat)+z2/(4*n))/n))/(1+z2/n)); };
    const DECAY=0.6;
    const recencyWrongRate=(hist)=>{ const maxS=Math.max(...hist.map(h=>h.s)); let wSum=0,wWrong=0;
      hist.forEach(h=>{ const w=Math.pow(DECAY,maxS-h.s); wSum+=w; if(!h.ok)wWrong+=w; }); return wSum?wWrong/wSum:0; };
    const calcWeak=(dict,keys,recThr)=>keys.filter(k=>dict[k]).map(k=>{
      const d=dict[k]; const base=wilsonLowerWrong(d.t-d.c,d.t); let score=base,recencyApplied=false;
      if(d.t>=recThr){ score=base*0.4+recencyWrongRate(d.hist)*0.6; recencyApplied=true; }
      return {key:k,t:d.t,c:d.c,rate:Math.round(d.c/d.t*100),score,recencyApplied};
    }).filter(w=>w.score>0.05).sort((a,b)=>b.score-a.score).slice(0,15);
    const weakPid=calcWeak(perPid,rangeAll.filter(pid=>perPid[pid]),5);
    const weakType=calcWeak(perType,Object.keys(perType),3);
    const zero=rangeAll.filter(pid=>!perPid[pid]);
    const once=rangeAll.filter(pid=>perPid[pid]&&perPid[pid].t>0&&perPid[pid].t<=blindLowThreshold);
    // 커버 = 기준(blindLowThreshold)을 초과해 충분히 푼 지문 비율 (zero·once 제외)
    const covered=rangeAll.length-zero.length-once.length;
    const covPct=rangeAll.length?Math.round(covered/rangeAll.length*100):0;
    return {perPid,perType,rangeAll,weakPid,weakType,zero,once,covered,covPct};
  };

  // ── 개별 학생 약점 분석 리포트 인쇄 ──
  const printReport=(promo,secOpts)=>{
    if(!selectedStudent){setMsg('인쇄할 학생을 먼저 선택하세요.');return;}
    if(!stats){setMsg('데이터를 먼저 조회하세요.');return;}
    // 섹션 선택 옵션 (개별 리포트 전용). 미지정 시 전체 포함.
    const SO=secOpts||{weak:true,weakPid:true,weakType:true,blind:true,type:true,book:true,sess:true};
    const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    // 홍보 모드: 이름 완전 비식별

    const today=new Date();
    const dateStr=`${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')}`;
    const sessions=(stats.sessionStats||[]).slice().reverse();
    const types=(stats.typeStats||[]).slice().sort((a,b)=>Number(a.rate)-Number(b.rate)); // 약한 유형 먼저
    const wrongs=sortWrongs(stats.wrongRanking);
    const Wk=computeWeakness(); // 화면과 동일한 약점점수
    const books=(stats.bookStats||[]);
    // 종합 정답률
    const totCorrect=types.reduce((s,t)=>s+(Number(t.correct)||0),0);
    const totAll=types.reduce((s,t)=>s+(Number(t.total)||0),0);
    const overall=totAll?Math.round(totCorrect/totAll*100):0;
    const weakTypes=types.filter(t=>Number(t.rate)<70).slice(0,5);
    // ── 누적 학습량 & 목표 대비 부족 (학습 시작일 기준, 하루 30문항) ──
    const sessCount=sessions.length;

        // 시작일 당일 0시 이후 응시 회차의 문항만 합산
        let doneSince=0;
        sessions.forEach(s=>{
          const sdate=new Date(String(s.date||'').replace(' ','T'));
          if(isNaN(sdate)||sdate<sd0) return;

            if(line.split('|').length>=3) doneSince++;
          });
        });
        doneSinceStart=doneSince;

    const bar=(r)=>`<div style="display:inline-block;width:90px;height:7px;border-radius:4px;background:#eee;overflow:hidden;vertical-align:middle;margin-right:7px"><div style="width:${Number(r)}%;height:100%;background:${rateColor(r)}"></div></div>`;

    }).join('')}</table><div style="font-size:10px;color:#bbb;margin-top:4px">우측 숫자=약점 점수(표본 보정·최근 추세 반영, 높을수록 약점)</div>`:'';

      // 홍보용: 약점점수 기반 큰 글씨 (지문 약점 Top6 + 유형 약점)
      const scColP=sc=>sc>=50?'#B3261E':sc>=30?'#B7791F':'#9a7040';

      }).join(''):'';
      const weakBig=weakTypes.length?weakTypes.map(t=>`<span style="display:inline-block;background:#fff;border:2px solid ${rateColor(t.rate)};border-radius:24px;padding:7px 16px;margin:4px;font-size:16px;font-weight:800;color:#5a3a10">${esc(t.type)} <span style="color:${rateColor(t.rate)}">${esc(t.rate)}%</span></span>`).join(''):'';

      const LT='<', SC=LT+'script', ESC_='</'+'script>'; // 백틱/부모 script 충돌 회피

                  const head=((bk.label||bk.id)+' '+chL).trim();
                  const noL=no?(isNaN(parseInt(no))?no:parseInt(no)):'';

                const sortNums=(a,b)=>{ const na=typeof a==='number',nb=typeof b==='number'; if(na&&nb)return a-b; if(na)return -1; if(nb)return 1; return String(a).localeCompare(String(b)); };
                return [...groups.values()].map(g=>({head:g.head, nums:g.nums.sort(sortNums).map(n=>n+'번').join(', ')}));

                {/* 진짜 약점 카드 (지문/유형 탭) */}

                      return <div key={k} onClick={()=>setWeakTab(k)} style={{flex:1,textAlign:'center',padding:'8px 0',fontSize:12,fontWeight:on?800:500,color:on?'#7a1020':'#9a8570',borderBottom:on?'2px solid #7a1020':'2px solid transparent',cursor:'pointer'}}>{t}</div>;

                          const bk=allBookIds.find(b=>pid.startsWith(b+'_'));

                          const rest=pid.slice(bk.length+1).split('_');
                          let ch='',no='';
                          if(rest.length>=2){ch=rest[0];no=rest[1];}else{no=rest[0];}
                          const chL=ch?(isNaN(parseInt(ch))?ch+' ':parseInt(ch)+'강 '):'';
                          const noL=no?(parseInt(no)||no)+'번':'';
                          return {book:bookLabel(bk),loc:(chL+noL).trim()};

                                  groups[idx.get(it.pid)].items.push(it);
                                });
                                groups.forEach(g=>g.items.sort((a,b)=>a.qNo-b.qNo));
                                groups.sort((a,b)=>String(a.pid).localeCompare(String(b.pid),undefined,{numeric:true}));
                                return groups.map((g,k)=>{

                                      ))}
                                    </span>
                                  </div>;
                                });
                              })()}
                            </div>}
                        </>;
                      })()}
                  </div>}
                </div>;

                  const noL=no?(parseInt(no)||no)+'번 ':'';

                  </div>

                  : <button onClick={()=>setBookVisible(b,false)} disabled={busy}

                    </button>
                }

function QuickSelectBar(props){
  var activeBook=props.activeBook, allPassages=props.allPassages, selPassages=props.selPassages;
  var toggleP=props.toggleP, allSelInBook=props.allSelInBook;
  var selectAllInBook=props.selectAllInBook, deselectAllInBook=props.deselectAllInBook;
  var bookPassagesAll=allPassages.filter(function(p){
    return bookIdOf(p)===activeBook;
  });
  var gateIds=bookPassagesAll.filter(function(p){return p.id.includes('_GATE');}).map(function(p){return p.id;});
  var gateSelCnt=gateIds.filter(function(id){return selPassages.has(id);}).length;
  var gateAllSel=gateIds.length>0&&gateSelCnt===gateIds.length;
  function toggleGate(){
    if(gateAllSel){gateIds.forEach(function(id){toggleP(id);});}
    else{gateIds.forEach(function(id){if(!selPassages.has(id))toggleP(id);});}
  }
  var starIds=bookPassagesAll.filter(function(p){return p.difficulty==='높음';}).map(function(p){return p.id;});
  var starSelCnt=starIds.filter(function(id){return selPassages.has(id);}).length;
  var starAllSel=starIds.length>0&&starSelCnt===starIds.length;
  function toggleStar(){
    if(starAllSel){starIds.forEach(function(id){toggleP(id);});}
    else{
      bookPassagesAll.forEach(function(p){if(selPassages.has(p.id))toggleP(p.id);});
      starIds.forEach(function(id){toggleP(id);});
    }
  }
  return(
    <div style={{display:'flex',justifyContent:'flex-end',marginBottom:6,gap:5,flexWrap:'wrap'}}>
      <button onClick={function(){allSelInBook?deselectAllInBook(activeBook):selectAllInBook(activeBook);}} style={{padding:'5px 12px',borderRadius:14,border:'none',fontSize:11,fontWeight:600,cursor:'pointer',background:allSelInBook?'#fee2e2':'#dbeafe',color:allSelInBook?'#991b1b':'#1d4ed8'}}>{allSelInBook?'전체 해제':'전체 선택'}</button>

      {starIds.length>0&&<button onClick={toggleStar} style={{padding:'5px 12px',borderRadius:14,fontSize:11,fontWeight:600,cursor:'pointer',background:starAllSel?'#fef2f2':'#f8fafc',color:'#dc2626',border:'1px solid #fca5a5'}}>★ 중요문항 {starAllSel?'해제':'선택'}</button>}
      {gateIds.length>0&&<button onClick={toggleGate} style={{padding:'5px 12px',borderRadius:14,fontSize:11,fontWeight:600,cursor:'pointer',background:gateAllSel?'#fef3c7':'#f8fafc',color:'#92400e',border:'1px solid #fcd34d'}}>📌 Gateway {gateAllSel?'해제':'선택'}</button>}
    </div>
  );
}

  const isStudent=session?.role==='student';
  const [selPresetId,setSelPresetId]=useState('');
  const [blindThreshold,setBlindThreshold]=useState(5); // 사각지대 기준: N회 미만
  const presetMatch=(pid,ranges)=>{ for(const pre of (ranges||[])){ if(pid===pre||pid.startsWith(pre+'_'))return true; } return false; };
  const applyPresetRange=(pr)=>{
    if(!pr)return;
    const ids=allPassages.filter(p=>presetMatch(p.id,pr.ranges)).map(p=>p.id);
    setSelPassages(new Set(ids));
  };
  // 선택된 프리셋 범위에서 5회 미만 푼 지문만 자동 선택
  const applyBlindspots=()=>{
    const pr=(stuPresets||[]).find(x=>x.id===selPresetId);
    if(!pr){ alert('⚠️ 먼저 위에서 "내 시험 범위"를 선택해주세요.\n범위를 골라야 사각지대를 찾을 수 있어요.'); return; }
    if(!myStatsReady){ alert('잠시만요! 학습 기록을 불러오는 중이에요. 2~3초 후 다시 눌러주세요.'); return; }
    const rangeIds=allPassages.filter(p=>presetMatch(p.id,pr.ranges)).map(p=>p.id);
    if(rangeIds.length===0){ alert('이 시험 범위에 해당하는 지문을 찾지 못했어요. 범위를 다시 확인해주세요.'); return; }
    const blind=rangeIds.filter(pid=>((myPerPid[pid]&&myPerPid[pid].t)||0)<blindThreshold);
    if(blind.length===0){ alert(`🎉 이 범위는 모든 지문을 ${blindThreshold}회 이상 풀었어요!\n사각지대가 없습니다. 잘하고 있어요 👍`); return; }
    setSelPassages(new Set(blind));
    const typeCnt=Math.max(1,selectedTypes.size);
    const maxQ=blind.length*typeCnt; // 이론상 최대(지문수×선택유형수)
    const qtyNote = maxQ<qCount
      ? `\n\n⚠️ 현재 문제 수는 ${qCount}개로 설정돼 있지만, 사각지대 지문이 적어 최대 약 ${maxQ}문항까지 나올 수 있어요. (설정보다 적게 출제될 수 있어요)`
      : `\n\n현재 설정된 ${qCount}문항을 풀 수 있어요.`;
    alert(`🎯 사각지대 ${blind.length}개 지문을 골랐어요!${qtyNote}\n\n아래 "시작하기"를 누르면 풀 수 있어요.`);
  };
  // 일반 교재는 탭, 모의고사(MOGO_)는 드롭다운으로 분리
