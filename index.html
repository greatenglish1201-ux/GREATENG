 ultimate objectives of everything we do, so any system of ethics should recognize that fact."], "aGroup": ["suffering", "pain", "unhappiness"], "bGroup": ["maximize happiness", "maximize utility", "pleasure"], "answers": ["utility maximization principle", "individual moral sacrifice", "prevention of absolute equality", "justification of absolute suffering", "restriction of societal happiness"]}, {"id": "ABSO_TYPE_20_22", "difficulty": "높음", "title": "기후 변화에 대한 대중 매체의 오해 유발 보도", "abstract": "Despite a firm scientific consensus that humans cause global climate change, the media misleadingly presents the issue as an evenly divided debate.", "keyIndex": 6, "sentences": ["Until recently, the media often gave equal time and space to the arguments for and against humans as the cause of global climate change.", "Surveys have indicated that there is discord on the issue, but that the majority of scientists agree that humans are altering global climate.", "One analysis of a decade of research papers on global climate change found no papers that disputed human impacts on global climate.", "Also, all but one of the major scientific organizations in the United States whose members have expertise relevant to global climate change have issued statements acknowledging that human activities are altering the earth's climate.", "Therefore, there is a general consensus within the scientific community that humans are causing global climate change.", "While it is legitimate to explore the arguments against the consensus position, it is misleading for the media to present the issue so as to give the impression that the scientific community is evenly divided on the matter."], "aGroup": ["equal time and space", "evenly divided", "arguments against the consensus"], "bGroup": ["general consensus", "majority of scientists agree", "misleading for the media"], "answers": ["misleading media neutrality", "absolute scientific discord", "intentional scientific manipulation", "legitimate consensus rejection", "objective media representation"]}, {"id": "ABSO_TYPE_20_23", "difficulty": "보통", "title": "어휘 학습에서 문맥적 함축 의미의 중요성", "abstract": "Relying solely on explicit denotation leads to a superficial understanding, making it essential to learn connotative meanings in context.", "keyIndex": 6, "sentences": ["The denotation of a word is its explicit definition as listed in a dictionary.", "The denotative meaning of \"home\" is \"a place where one lives.\"", "The expressiveness of language, however, comes from the other type of word meaning — connotation, or the association that a word usually brings to mind.", "The connotative meaning of \"home\" is a place of security, comfort, and family.", "When Dorothy in The Wizard of Oz says, \"There's no place like home,\" she's not referring to the word's denotation, but the emotions \"home\" evokes for her and most people.", "So, focusing on a denotation approach to learning vocabulary can lead only to a superficial understanding of words.", "It is also inadequate in teaching the concepts behind complex words such as \"photosynthesis.\"", "Much more explanation is required to learn concept vocabulary.", "In other words, telling children to \"look it up in the dictionary\" without following up by illustrating how the word is used in context often leads to miscomprehension."], "aGroup": ["denotation", "explicit definition", "superficial understanding", "look it up in the dictionary"], "bGroup": ["connotation", "emotions", "concepts behind complex words", "used in context"], "answers": ["connotative context learning", "explicit dictionary definition", "complete grammatical analysis", "emotional detachment approach", "superficial vocabulary acquisition"]}, {"id": "ABSO_TYPE_20_24", "difficulty": "보통", "title": "목표 달성을 위해 발현되는 합리적 자아", "abstract": "Although humans are fundamentally irrational due to how they process emotions, they can exhibit exceptional rationality when intensely focused on achieving a goal.", "keyIndex": 11, "sentences": ["Throughout history we witness continual cycles of rising and falling levels of the irrational.", "To some extent irrationality, in fact, is a function of the structure of our brains and is wired into our very nature by the way we process emotions.", "Everyone is capable of irrational decisions, some of which are caused by circumstances beyond our control.", "However, almost all of us at some point in our lives have experienced moments of greater rationality.", "This often comes with the maker's mind-set.", "We have a project to get done, perhaps with a deadline.", "The only emotion we can afford is excitement.", "Other emotions simply make it impossible to concentrate.", "Because we have to get results, we become exceptionally practical.", "If people try to interrupt or infect us with emotions, we resent it.", "These moments — as fleeting as a few weeks or hours — reveal the rational self that is waiting to come out.", "It just requires some awareness and some practice."], "aGroup": ["the irrational", "emotions", "circumstances beyond our control", "impossible to concentrate"], "bGroup": ["greater rationality", "maker's mind-set", "exceptionally practical", "the rational self"], "answers": ["practical rational emergence", "chronic emotional dominance", "complete irrational submission", "physiological cognitive decline", "permanent maker mindset"]}];

const BOOK_LABELS={'27ST':'27수특영어','ABSO':'절대유형','OLLE':'올림포스 독해1','MOGO':'모의고사 GO3'};

function parseCSV(text){
  const rows=[];
  const lines=text.split('\n');
  let cur=null;
  for(let i=1;i<lines.length;i++){
    const raw=lines[i];
    if(!raw.trim())continue;
    // CSV 파싱: 쉼표로 분리하되 따옴표 안 쉼표 무시
    const cols=[];let c='',inQ=false;
    for(let k=0;k<raw.length;k++){
      const ch=raw[k];
      if(ch==='"'){inQ=!inQ;}
      else if(ch===','&&!inQ){cols.push(c);c='';}
      else{c+=ch;}
    }
    cols.push(c);
    const id=(cols[0]||'').trim();
    if(id&&/^[A-Z0-9_]/.test(id)&&(cols[1]||'').trim()){
      if(cur&&cur.sentences.length>0)rows.push(cur);
      cur={
        id,
        difficulty:(cols[1]||'보통').trim(),
        title:(cols[2]||'').trim(),
        abstract:(cols[3]||'').trim(),
        keyIndex:parseInt((cols[4]||'1').trim())||1,
        sentences:[],
        aGroup:(cols[6]||'').split('/').map(s=>s.trim()).filter(Boolean),
        bGroup:(cols[7]||'').split('/').map(s=>s.trim()).filter(Boolean),
        answers:(cols[8]||'').split('/').map(s=>s.trim()).filter(Boolean),
      };
      const logic=(cols[5]||'').trim();
      const parts=logic.split(/(?:^|\n)\s*\d+\.\s+/).filter(Boolean);
      parts.forEach(p=>{const t=p.trim().replace(/\n/g,' ');if(t)cur.sentences.push(t);});
    }else if(cur){
      const t=raw.trim().replace(/^\d+\.\s+/,'');
      if(t)cur.sentences.push(t);
    }
  }
  if(cur&&cur.sentences.length>0)rows.push(cur);
  return rows;
}

function detectBooks(passages){
  const map={};
  passages.forEach(p=>{
    const prefix=p.id.split('_').slice(0,-1).join('_').split('_')[0]||p.id.substring(0,4);
    if(!map[prefix])map[prefix]=true;
  });
  return Object.keys(map).map(pre=>({
    id:pre,
    label:BOOK_LABELS[pre]||pre,
    match:id=>id.startsWith(pre)
  }));
}

// JSONP 방식으로 CORS 우회
function jsonpFetch(url, data) {
  return new Promise((resolve, reject) => {
    const cbName = 'greateng_cb_' + Date.now();
    const payload = encodeURIComponent(JSON.stringify(data));
    const script = document.createElement('script');
    script.src = `${url}?callback=${cbName}&data=${payload}`;
    window[cbName] = (result) => {
      delete window[cbName];
      document.body.removeChild(script);
      resolve(result);
    };
    script.onerror = () => {
      delete window[cbName];
      document.body.removeChild(script);
      reject(new Error('JSONP 요청 실패'));
    };
    document.body.appendChild(script);
  });
}

const APP_NAME='대단한영어';
const APP_SUB='내신시험 출제예상문제';

/* ── 유틸 ── */
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

function splitKws(arr){
  // 쉼표로 묶인 키워드 문자열도 개별 항목으로 분리
  const out=[];
  for(const a of arr){
    for(const t of a.split(',')){const s=t.trim();if(s)out.push(s);}
  }
  return out;
}
function pickDistractors(correct, passage, allP, n=4){
  const pool=[];
  // 1순위: 해당 지문 answers[1~4]
  for(const a of passage.answers.slice(1)){
    const t=a.trim();
    if(t&&t!==correct&&!pool.includes(t))pool.push(t);
  }
  // 2순위: 해당 지문 aGroup (쉼표 분리)
  for(const t of splitKws(passage.aGroup)){
    if(pool.length>=n)break;
    if(t!==correct&&!pool.includes(t))pool.push(t);
  }
  // 3순위: 해당 지문 bGroup (쉼표 분리)
  for(const t of splitKws(passage.bGroup)){
    if(pool.length>=n)break;
    if(t!==correct&&!pool.includes(t))pool.push(t);
  }
  return shuffle(pool).slice(0,n);
}

function findBInSentences(passage){
  const r=[];
  // bGroup 항목이 쉼표 묶음이면 개별 키워드로 분리
  const kws=[];
  for(const bw of passage.bGroup){
    for(const t of bw.split(',')){const s=t.trim();if(s&&s.split(' ').length<=5)kws.push(s);}
  }
  for(const kw of kws){
    for(let i=0;i<passage.sentences.length;i++){
      if(passage.sentences[i].toLowerCase().includes(kw.toLowerCase())){
        if(!r.find(x=>x.si===i))r.push({kw,si:i,sent:passage.sentences[i]});
        break;
      }
    }
  }
  return r;
}

/* ── 문제 생성 ── */
function gen(passage, type, allP){
  const s=passage.sentences, ki=Math.min(passage.keyIndex,s.length)-1, ca=passage.answers[0];

  switch(type){

  /* ① 주제 찾기 */
  case 'topic':{
    let opts;
    if(passage.answers.length>=5){
      opts=passage.answers.map((a,i)=>({text:a,correct:i===0}));
    } else {
      opts=[{text:ca,correct:true},...pickDistractors(ca,passage,allP,4).map(d=>({text:d,correct:false}))];
    }
    return {type,passage,options:shuffle(opts),instruction:'다음 글의 주제로 가장 적절한 것은?'};
  }

  /* ② 순서 배열 */
  case 'order':{
    if(s.length<4)return null;
    const given=s[0], rest=s.slice(1), len=rest.length;
    const t1=Math.ceil(len/3), t2=Math.ceil(len*2/3);
    // 원래 순서대로 3덩어리
    const chunks=[
      rest.slice(0,t1).join(' '),
      rest.slice(t1,t2).join(' '),
      rest.slice(t2).join(' '),
    ];
    // 셔플된 인덱스 (예: [2,0,1])
    const order=shuffle([0,1,2]);
    // 화면에 A,B,C로 표시 (셔플된 순서)
    const blocks=[
      {label:'A',text:chunks[order[0]],orig:order[0]},
      {label:'B',text:chunks[order[1]],orig:order[1]},
      {label:'C',text:chunks[order[2]],orig:order[2]},
    ];
    // 정답: orig 0,1,2 순서로 복원하면 어떤 라벨 순서인가
    const labelMap={};
    blocks.forEach(b=>{labelMap[b.orig]=b.label;});
    const correctSeq=[labelMap[0],labelMap[1],labelMap[2]];
    const correctText=`(${correctSeq[0]}) → (${correctSeq[1]}) → (${correctSeq[2]})`;
    // 모든 순열에서 정답 제외
    const perms=[['A','B','C'],['A','C','B'],['B','A','C'],['B','C','A'],['C','A','B'],['C','B','A']];
    const wrong=perms.filter(p=>p.join('')!==correctSeq.join(''));
    const opts=shuffle([
      {text:correctText,correct:true},
      ...shuffle(wrong).slice(0,4).map(p=>({text:`(${p[0]}) → (${p[1]}) → (${p[2]})`,correct:false}))
    ]);
    return {type,passage,given,blocks,options:opts,instruction:'주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?'};
  }

  /* ③ 빈칸 추론 */
  case 'blank':{
    const bm=findBInSentences(passage);
    if(bm.length===0)return null;
    const tgtKw=bm.find(m=>m.si===ki)||bm[0];
    const keySent=s[ki]||tgtKw.sent;
    const keyWc=keySent.split(' ').length;

    // 절 분리 헬퍼
    const splitClauses=sent=>sent
      .split(/,\s*(?:which|that|because|although|while|when|if|so|but|and|or|however|yet)|;\s*|\s+—\s+/)
      .map(c=>c.trim()).filter(c=>c.split(' ').length>=5);

    // 다른 지문에서 절/표현 수집 (오답 풀)
    const getWrongPool=(len,isClause)=>{
      const pool=[];
      for(const p of shuffle(allP)){
        if(pool.length>=8)break;
        if(p.id===passage.id)continue;
        if(isClause){
          for(const sent of p.sentences){
            const cls=splitClauses(sent);
            for(const cl of shuffle(cls)){
              const wc=cl.split(' ').length;
              if(Math.abs(wc-len)<=4&&!pool.includes(cl)){pool.push(cl);break;}
            }
            if(pool.length>=8)break;
          }
        } else {
          const splitB=arr=>{const o=[];for(const a of arr){for(const t of a.split(',')){const s2=t.trim();if(s2&&s2.split(' ').length<=4)o.push(s2);}}return o;};
          for(const kw of splitB(p.bGroup)){
            if(Math.abs(kw.split(' ').length-len)<=1&&!pool.includes(kw)){pool.push(kw);}
            if(pool.length>=8)break;
          }
        }
      }
      return pool;
    };

    const rand=Math.random();

    // ── 타입 A: 주절 전체 빈칸 (문장이 15단어 이상이고 rand<0.33) ──
    if(rand<0.33&&keyWc>=15){
      const clauses=splitClauses(keySent);
      if(clauses.length>=2){
        const tgtC=clauses.reduce((a,b)=>a.split(' ').length>b.split(' ').length?a:b);
        const blankSent=keySent.replace(tgtC,'______________________');
        if(blankSent!==keySent){
          // 같은 지문 다른 문장 절 우선
          const wrongPool=[];
          for(const sent of [...s,...allP.filter(p=>p.id!==passage.id).flatMap(p=>p.sentences)]){
            if(wrongPool.length>=4)break;
            for(const cl of shuffle(splitClauses(sent))){
              const wc=cl.split(' ').length;
              if(cl!==tgtC&&Math.abs(wc-tgtC.split(' ').length)<=5&&!wrongPool.includes(cl)){wrongPool.push(cl);break;}
            }
          }
          if(wrongPool.length>=2){
            return {type,passage,blanked:blankSent,blankIdx:ki,
              options:shuffle([{text:tgtC,correct:true},...wrongPool.slice(0,4).map(w=>({text:w,correct:false}))]),
              instruction:'다음 빈칸에 들어갈 말로 가장 적절한 것은?'};
          }
        }
      }
    }

    // ── 타입 B: 긴 절 빈칸 (5~14단어, rand<0.66) ──
    if(rand<0.66){
      const clauses=keySent.split(/,\s*|\s+—\s+|;\s*/).map(c=>c.trim())
        .filter(c=>{const wc=c.split(' ').length;return wc>=5&&wc<=14;});
      if(clauses.length>=1){
        const tgtC=shuffle(clauses)[0];
        const blankSent=keySent.replace(tgtC,'______________________');
        if(blankSent!==keySent){
          const wrongPool=[];
          for(const sent of [...s,...allP.filter(p=>p.id!==passage.id).flatMap(p=>p.sentences)]){
            if(wrongPool.length>=4)break;
            const cls=sent.split(/,\s*|\s+—\s+|;\s*/).map(c=>c.trim())
              .filter(c=>{const wc=c.split(' ').length;return wc>=5&&wc<=14;});
            for(const cl of shuffle(cls)){
              if(cl!==tgtC&&!wrongPool.includes(cl)){wrongPool.push(cl);break;}
            }
          }
          if(wrongPool.length>=2){
            return {type,passage,blanked:blankSent,blankIdx:ki,
              options:shuffle([{text:tgtC,correct:true},...wrongPool.slice(0,4).map(w=>({text:w,correct:false}))]),
              instruction:'다음 빈칸에 들어갈 말로 가장 적절한 것은?'};
          }
        }
      }
    }

    // ── 타입 C: 키워드 단위 빈칸 (기본) ──
    const blanked=tgtKw.sent.replace(new RegExp(tgtKw.kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i'),'______________________');
    const isShort=w=>w.split(' ').length<=4;
    const splitB=arr=>{const o=[];for(const a of arr){for(const t of a.split(',')){const s2=t.trim();if(s2&&isShort(s2))o.push(s2);}}return o;};
    const selfPool=[...new Set([...splitB(passage.aGroup).filter(a=>a!==tgtKw.kw),...splitB(passage.bGroup).filter(b=>b!==tgtKw.kw)])];
    const otherPool=getWrongPool(tgtKw.kw.split(' ').length,false);
    const wp=[...selfPool,...otherPool].filter((x,i,a)=>a.indexOf(x)===i);
    return {type,passage,blanked,blankIdx:tgtKw.si,
      options:shuffle([{text:tgtKw.kw,correct:true},...shuffle(wp).slice(0,4).map(w=>({text:w,correct:false}))]),
      instruction:'다음 빈칸에 들어갈 말로 가장 적절한 것은?'};
  }

  /* ④ 문장 삽입 - 첫문장 뒤부터 마커 */
  case 'insert':{
    if(s.length<5)return null;
    const cands=[];
    for(let i=2;i<s.length;i++){if(i!==ki)cands.push(i);}
    if(cands.length<1)return null;
    const rmIdx=cands[Math.floor(Math.random()*cands.length)];
    const removed=s[rmIdx];
    const remaining=s.filter((_,i)=>i!==rmIdx);
    // 마커는 첫 문장 뒤부터, 최대 5개
    const markerStart=1; // remaining[0]은 그냥 표시, remaining[1] 앞부터 ①
    const maxMarkers=Math.min(remaining.length-1, 5);
    // correctPos: rmIdx가 원래 몇 번째였는지 → remaining에서의 위치
    const correctPos=Math.min(rmIdx-1, maxMarkers-1); // 0-based from marker start
    return {type,passage,removed,remaining,markerStart,maxMarkers,correctPos,instruction:'글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?'};
  }

  /* ⑤ 요약문 */
  case 'summary':{
    if(!passage.bGroup||passage.bGroup.length<2)return null;
    // bGroup[0], bGroup[1] 모두 4단어 이하여야 빈칸으로 적합
    if(passage.bGroup[0].split(' ').length>5||passage.bGroup[1].split(' ').length>5)return null;
    const ansA=passage.bGroup[0], ansB=passage.bGroup[1];
    const isS=w=>w.split(' ').length<=5;
    const splitKw=arr=>{const o=[];for(const a of arr){for(const t of a.split(',')){const s=t.trim();if(s&&isS(s))o.push(s);}}return o;};
    // 오답 후보: 해당 지문 aGroup (반의/대조) + bGroup[2이후] + 다른 지문 aGroup 보충
    const selfA=splitKw(passage.aGroup).filter(x=>x!==ansA&&x!==ansB);
    const selfB=splitKw(passage.bGroup.slice(2)).filter(x=>x!==ansA&&x!==ansB);
    const otherA=[];
    for(const p of shuffle(allP)){
      if(otherA.length>=8)break;
      if(p.id===passage.id)continue;
      for(const t of splitKw(p.aGroup)){
        if(t!==ansA&&t!==ansB&&!selfA.includes(t)&&!otherA.includes(t)&&isS(t)){otherA.push(t);break;}
      }
    }
    const wrongAll=shuffle([...selfA,...selfB,...otherA]);
    // (A)(B) 오답 각 4개씩, 서로 겹치지 않게
    const wA=wrongAll.slice(0,4);
    const wB=wrongAll.filter(x=>!wA.includes(x)).slice(0,4);
    // 정답이 같은 행에 오도록: 정답 위치를 먼저 결정하고 나머지 채우기
    const correctRow=Math.floor(Math.random()*5);
    const aArr=Array(5).fill(null), bArr=Array(5).fill(null);
    aArr[correctRow]={text:ansA,correct:true};
    bArr[correctRow]={text:ansB,correct:true};
    const wrongAPool=shuffle(wA.slice(0,4));
    const wrongBPool=shuffle(wB.slice(0,4));
    let ai=0,bi=0;
    for(let r=0;r<5;r++){
      if(r===correctRow)continue;
      aArr[r]={text:wrongAPool[ai++]||ansA,correct:false};
      bArr[r]={text:wrongBPool[bi++]||ansB,correct:false};
    }
    return {type,passage,abstract:passage.abstract,ansA,ansB,aOpts:aArr,bOpts:bArr,instruction:'다음 글의 내용을 한 문장으로 요약하고자 한다. 빈칸 (A)와 (B)에 들어갈 말로 가장 적절한 것은?'};
  }

  /* ⑥ 함축적 의미 */
  case 'implication':{
    const bm=findBInSentences(passage);
    // bGroup에서 못 찾으면 aGroup에서 밑줄 단어 찾기
    let tgtFallback=null;
    if(bm.length===0){
      // bGroup 쉼표 분리 후 재시도
      const bKws=[];
      for(const bw of passage.bGroup){for(const t of bw.split(',')){const s2=t.trim();if(s2&&s2.split(' ').length<=5)bKws.push(s2);}}
      for(const kw of bKws){
        for(let i=0;i<s.length;i++){
          if(s[i].toLowerCase().includes(kw.toLowerCase())){tgtFallback={kw,si:i,sent:s[i]};break;}
        }
        if(tgtFallback)break;
      }
      // 그래도 없으면 aGroup에서 시도
      if(!tgtFallback){
        for(const aw of passage.aGroup){
          const t=aw.split(',')[0].trim();
          for(let i=0;i<s.length;i++){
            if(t&&s[i].toLowerCase().includes(t.toLowerCase())){tgtFallback={kw:t,si:i,sent:s[i]};break;}
          }
          if(tgtFallback)break;
        }
      }
      if(!tgtFallback)return null;
    }
    let tgt=bm.length>0?(bm.find(m=>m.si===ki)||bm[bm.length-1]):tgtFallback;
    // 정답: abstract (글 전체 요약 한 문장)
    const correct=passage.abstract;
    if(!correct)return null;
    // 오답: 다른 지문의 abstract에서 4개 (길이 유사한 문장)
    const distPool=[];
    for(const p of shuffle(allP)){
      if(distPool.length>=4)break;
      if(p.id===passage.id||!p.abstract)continue;
      if(p.abstract!==correct&&!distPool.includes(p.abstract))distPool.push(p.abstract);
    }
    const tDist=shuffle(distPool).slice(0,4);
    return {type,passage,targetIdx:tgt.si,underline:tgt.kw,options:shuffle([{text:correct,correct:true},...tDist.map(d=>({text:d,correct:false}))]),instruction:'밑줄 친 부분이 다음 글에서 의미하는 바로 가장 적절한 것은?'};
  }

  /* ⑦ 무관한 문장 - foreign을 원문에 삽입, 5구간 분산 번호 */
  case 'irrelevant':{
    if(s.length<4)return null;
    const others=allP.filter(p=>p.id!==passage.id);
    const rOther=others[Math.floor(Math.random()*others.length)];
    const foreign=rOther.sentences[Math.floor(Math.random()*rOther.sentences.length)];
    // foreign을 첫 문장 뒤 랜덤 위치에 삽입 → full array
    const insertAt=1+Math.floor(Math.random()*(s.length-1));
    const full=[...s];
    full.splice(insertAt,0,foreign);
    // full 배열에서 첫 문장 제외(index 0), 나머지를 5구간으로 나눠 각 1개씩 번호 부여
    const restLen=full.length-1;
    const chunkSize=restLen/5;
    const numberedSet=new Set();
    for(let c=0;c<5;c++){
      const lo=1+Math.floor(c*chunkSize), hi=1+Math.floor((c+1)*chunkSize);
      const segment=[...Array(hi-lo).keys()].map(k=>lo+k);
      if(segment.length===0){numberedSet.add(full.length-1);continue;}
      numberedSet.add(segment[Math.floor(Math.random()*segment.length)]);
    }
    // 번호 순서대로 정렬 (원문 순서)
    const numberedIdxs=[...numberedSet].sort((a,b)=>a-b);
    // correctNum: insertAt이 numberedIdxs에서 몇 번째인지 (1-based)
    const correctNum=numberedIdxs.indexOf(insertAt)+1;
    if(correctNum===0)return null; // foreign이 번호 구간에 안 걸린 경우 재시도 불가 → null
    return {type,passage,full,numberedIdxs,correctNum,foreignSource:rOther.title,instruction:'다음 글에서 전체 흐름과 관계 없는 문장은?'};
  }

  default:return null;
  }
}

/* ── 타이머 훅 ── */
function useTimer(seconds, onExpire){
  const [left, setLeft]=useState(seconds);
  const [running, setRunning]=useState(true);
  const cbRef=useRef(onExpire);
  cbRef.current=onExpire;

  useEffect(()=>{
    setLeft(seconds);
    setRunning(true);
  },[seconds]);

  useEffect(()=>{
    if(!running)return;
    if(left<=0){cbRef.current?.();setRunning(false);return;}
    const t=setTimeout(()=>setLeft(l=>l-1),1000);
    return ()=>clearTimeout(t);
  },[left,running]);

  return {left, stop:()=>setRunning(false), reset:(s)=>{setLeft(s);setRunning(true);}};
}

function saveStudentsLocal(arr){localStorage.setItem(STUDENTS_KEY,JSON.stringify(arr));}

// 로컬 로그인 검증
function verifyLogin(name, pw){
  if(pw===getAdminPw()) return {ok:true, role:'admin', name};
  const students=getStudentsLocal();
  const s=students.find(s=>s.name===name&&s.password===pw);
  if(!s) return {ok:false, message:'이름 또는 비밀번호가 틀렸습니다.'};
  if(!s.active) return {ok:false, message:'비활성화된 계정입니다.'};
  if(s.expiry){const exp=new Date(s.expiry);if(!isNaN(exp)&&exp<new Date())return{ok:false,message:'만료된 계정입니다.'};}
  return {ok:true, role:'student', name};
}

function App(){
  const [screen,setScreen]=useState(()=>{
    try{const s=JSON.parse(sessionStorage.getItem(SESSION_KEY)||'null');if(s?.name)return 'setup';}catch(e){}
    return 'login';
  });
  const [session,setSession]=useState(()=>{
    try{return JSON.parse(sessionStorage.getItem(SESSION_KEY)||'null');}catch(e){return null;}
  });
  const [studentName,setStudentName]=useState(()=>{
    try{return JSON.parse(sessionStorage.getItem(SESSION_KEY)||'null')?.name||'';}catch(e){return '';}
  });
  const [scriptUrl,setScriptUrl]=useState(()=>localStorage.getItem(SCRIPT_URL_KEY)||HARDCODED_URL);
  const [selectedTypes,setSelectedTypes]=useState(new Set(TYPES.map(t=>t.id)));
  const [activeBook,setActiveBook]=useState('27ST');
  const [selPassages,setSelPassages]=useState(new Set());
  const [qCount,setQCount]=useState(10);
  const [ansMode,setAnsMode]=useState('immediate');
  const [diffFilter,setDiffFilter]=useState('all');
  const [searchText,setSearchText]=useState('');
  const [questions,setQuestions]=useState([]);
  const [curIdx,setCurIdx]=useState(0);
  const [userAns,setUserAns]=useState({});
  const [showAns,setShowAns]=useState(false);
  const [timerKey,setTimerKey]=useState(0);
  const [extraPassages,setExtraPassages]=useState([]);

  const allPassages=useMemo(()=>{
    const merged=[...PASSAGES];
    extraPassages.forEach(ep=>{if(!merged.find(p=>p.id===ep.id))merged.push(ep);});
    return merged;
  },[extraPassages]);

  const books=useMemo(()=>detectBooks(allPassages),[allPassages]);

  const handleCSVUpload=(e)=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      const parsed=parseCSV(ev.target.result);
      if(parsed.length>0){
        setExtraPassages(prev=>{
          const next=[...prev];
          parsed.forEach(p=>{if(!next.find(x=>x.id===p.id)&&!PASSAGES.find(x=>x.id===p.id))next.push(p);});
          return next;
        });
        // 새 교재 prefix 감지해서 BOOK_LABELS에 없으면 추가
        parsed.forEach(p=>{
          const pre=p.id.split('_')[0];
          if(!BOOK_LABELS[pre])BOOK_LABELS[pre]=pre;
        });
        alert(`${parsed.length}개 지문이 추가되었습니다!`);
      }else{
        alert('CSV 파싱 실패: 올바른 형식인지 확인해주세요.');
      }
    };
    reader.readAsText(file,'utf-8');
    e.target.value='';
  };

  const filtP=useMemo(()=>{
    let p=allPassages;
    // 활성 교재 탭 필터
    const book=books.find(b=>b.id===activeBook);
    if(book) p=p.filter(x=>book.match(x.id));
    if(diffFilter!=='all')p=p.filter(x=>x.difficulty===diffFilter);
    if(searchText)p=p.filter(x=>x.title.includes(searchText)||x.id.includes(searchText.toUpperCase()));
    return p;
  },[diffFilter,searchText,activeBook]);

  const toggleType=id=>{setSelectedTypes(p=>{const n=new Set(p);n.has(id)?n.delete(id):n.add(id);return n;});};
  const toggleAll=()=>{selectedTypes.size===TYPES.length?setSelectedTypes(new Set()):setSelectedTypes(new Set(TYPES.map(t=>t.id)));};
  const toggleP=id=>{setSelPassages(p=>{const n=new Set(p);n.has(id)?n.delete(id):n.add(id);return n;});};
  const selectAllInBook=(bookId)=>{
    const book=books.find(b=>b.id===bookId);if(!book)return;
    const ids=allPassages.filter(p=>book.match(p.id)).map(p=>p.id);
    setSelPassages(p=>{const n=new Set(p);ids.forEach(id=>n.add(id));return n;});
  };
  const deselectAllInBook=(bookId)=>{
    const book=books.find(b=>b.id===bookId);if(!book)return;
    const ids=allPassages.filter(p=>book.match(p.id)).map(p=>p.id);
    setSelPassages(p=>{const n=new Set(p);ids.forEach(id=>n.delete(id));return n;});
  };
  const bookSelCount=(bookId)=>{
    const book=books.find(b=>b.id===bookId);if(!book)return 0;
    return allPassages.filter(p=>book.match(p.id)&&selPassages.has(p.id)).length;
  };
  const bookTotalCount=(bookId)=>{
    const book=books.find(b=>b.id===bookId);if(!book)return 0;
    return allPassages.filter(p=>book.match(p.id)).length;
  };

  const start=()=>{
    const types=[...selectedTypes];if(!types.length)return;
    if(selPassages.size===0)return;
    // selPassages 기반 필터
    let pool=allPassages.filter(p=>selPassages.has(p.id));
    if(diffFilter!=='all')pool=pool.filter(p=>p.difficulty===diffFilter);
    pool=shuffle(pool);
    const cnt=Math.min(qCount,pool.length);
    const chosen=pool.slice(0,cnt);
    const qs=[];
    // summary 전용: bGroup>=2 지문만 사용 가능한 pool 분리
    const summaryPool=allPassages.filter(p=>p.bGroup&&p.bGroup.length>=2&&p.bGroup[0].split(' ').length<=5&&p.bGroup[1].split(' ').length<=5);
    const usedIds=new Set(chosen.map(p=>p.id));
    for(let i=0;i<chosen.length;i++){
      const t=types[i%types.length];
      let q=gen(chosen[i],t,allPassages);
      if(!q){
        if(t==='summary'){
          // summary 불가 지문이면 summaryPool에서 미사용 지문으로 교체 시도
          const alt=summaryPool.find(p=>!usedIds.has(p.id));
          if(alt){usedIds.add(alt.id);q=gen(alt,t,allPassages);}
        }
        // 여전히 null이면 다른 타입으로 fallback
        if(!q){const fallbackOrder=[...types.filter(x=>x!==t),'topic'];for(const ft of fallbackOrder){q=gen(chosen[i],ft,allPassages);if(q)break;}}
      }
      if(q)qs.push(q);
    }
    setQuestions(qs);setCurIdx(0);setUserAns({});setShowAns(false);setTimerKey(Date.now());setScreen('quiz');
  };

  const score=useMemo(()=>{let c=0,t=0;Object.values(userAns).forEach(a=>{if(a.correct)c++;t++;});return{correct:c,total:t};},[userAns]);

  const [printQs,setPrintQs]=useState([]);
  const [printMode,setPrintMode]=useState('q');

  const genQuestions=()=>{
    const types=[...selectedTypes];if(!types.length||selPassages.size===0)return [];
    let pool=allPassages.filter(p=>selPassages.has(p.id));
    if(diffFilter!=='all')pool=pool.filter(p=>p.difficulty===diffFilter);
    pool=shuffle(pool);
    const cnt=Math.min(qCount,pool.length);
    const chosen=pool.slice(0,cnt);
    const qs=[];
    const summaryPool2=allPassages.filter(p=>p.bGroup&&p.bGroup.length>=2&&p.bGroup[0].split(' ').length<=5&&p.bGroup[1].split(' ').length<=5);
    const usedIds2=new Set(chosen.map(p=>p.id));
    for(let i=0;i<chosen.length;i++){
      const t=types[i%types.length];
      let q=gen(chosen[i],t,allPassages);
      if(!q){
        if(t==='summary'){
          const alt=summaryPool2.find(p=>!usedIds2.has(p.id));
          if(alt){usedIds2.add(alt.id);q=gen(alt,t,allPassages);}
        }
        if(!q){const fallbackOrder=[...types.filter(x=>x!==t),'topic'];for(const ft of fallbackOrder){q=gen(chosen[i],ft,allPassages);if(q)break;}}
      }
      if(q)qs.push(q);
    }
    return qs;
  };

  const printDirect=(mode)=>{
    const qs=genQuestions();if(!qs.length)return;
    setPrintQs(qs);setPrintMode(mode);setScreen('print');
  };

  const doPrintFromQuiz=(mode)=>{
    setPrintQs(questions);setPrintMode(mode);setScreen('print');
  };

  if(screen==='login') return <LoginScreen scriptUrl={scriptUrl} setScriptUrl={setScriptUrl} onLogin={(sess)=>{setSession(sess);setStudentName(sess.name);sessionStorage.setItem(SESSION_KEY,JSON.stringify(sess));setScreen(sess.role==='admin'?'admin':'setup');}} />;
  if(screen==='admin') return <AdminPanel scriptUrl={scriptUrl} adminPw={session?.adminPw||''} goBack={()=>{sessionStorage.removeItem(SESSION_KEY);setSession(null);setScreen('login');}} />;
  if(screen==='setup') return <Setup {...{selectedTypes,toggleType,toggleAll,filtP,selPassages,toggleP,activeBook,setActiveBook,selectAllInBook,deselectAllInBook,bookSelCount,bookTotalCount,qCount,setQCount,ansMode,setAnsMode,diffFilter,setDiffFilter,searchText,setSearchText,start,printDirect,books,allPassages,handleCSVUpload,studentName,setStudentName,scriptUrl,setScriptUrl,session,onLogout:()=>{sessionStorage.removeItem(SESSION_KEY);setSession(null);setStudentName('');setScreen('login');}}} />;
  if(screen==='print') return <PrintView questions={printQs} mode={printMode} goBack={()=>setScreen(questions.length>0?'quiz':'setup')} />;
  if(screen==='results') return <Results questions={questions} userAns={userAns} score={score} studentName={studentName} scriptUrl={scriptUrl} goHome={()=>setScreen('setup')} doPrint={(mode)=>{setPrintQs(questions);setPrintMode(mode);setScreen('print');}} />;

  const q=questions[curIdx];
  if(!q)return <div style={{padding:40,textAlign:'center'}}>문제 없음<br/><button onClick={()=>setScreen('setup')}>돌아가기</button></div>;

  return <Quiz q={q} idx={curIdx} total={questions.length} userAnswer={userAns[curIdx]}
    showAnswer={showAns||(ansMode==='immediate'&&!!userAns[curIdx])}
    onSubmit={ans=>{setUserAns(p=>({...p,[curIdx]:ans}));if(ansMode==='immediate')setShowAns(true);}}
    onNext={()=>{setShowAns(false);setTimerKey(Date.now());if(curIdx+1>=questions.length)setScreen('results');else setCurIdx(curIdx+1);}}
    score={score} ansMode={ansMode} goHome={()=>setScreen('setup')}
    questions={questions} userAns={userAns} timerKey={timerKey}
    doPrint={doPrintFromQuiz}
  />;
}

      const d=await api({action:'getResults',student:filterStudent||undefined});

    // 로컬 저장

    if(scriptUrl){try{await api({action:'deleteStudent',name});}catch(e){}}

  // 관리자 비밀번호 변경
  const [newAdminPw,setNewAdminPw]=useState('');

          {btn(tab==='settings','⚙️ 설정',()=>setTab('settings'))}
          {btn(tab==='settings','⚙️ 설정',()=>setTab('settings'))}
        </div>

        {/* 학생 관리 탭 */}
        {tab==='students'&&<div>

              <input value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="이름"

                style={{flex:'1 1 120px',padding:'9px 12px',borderRadius:9,border:'1px solid #e2e8f0',fontSize:13.5,outline:'none'}}/>
              <input value={form.password} onChange={e=>setForm({...form,password:e.target.value})} placeholder="비밀번호"

              <label style={{display:'flex',alignItems:'center',gap:5,fontSize:13,color:'#334155',cursor:'pointer'}}>

            </div>

              <button onClick={saveStudent} disabled={loading} style={{padding:'9px 20px',borderRadius:10,border:'none',background:'#4f7df7',color:'#fff',fontWeight:600,fontSize:13,cursor:'pointer'}}>

          </div>

            {students.map((s,i)=>(
              <div key={i} style={{display:'flex',alignItems:'center',padding:'11px 16px',borderBottom:'1px solid #f1f5f9',gap:10}}>
                <div style={{flex:1}}>

                  <span style={{fontSize:11,color:'#94a3b8',marginLeft:8}}>{s.expiry||'만료없음'}</span>

                <button onClick={()=>startEdit(s)} style={{fontSize:12,padding:'5px 10px',borderRadius:8,border:'1px solid #e2e8f0',background:'#fff',cursor:'pointer',color:'#334155'}}>수정</button>

        {/* 결과 탭 */}
        {tab==='results'&&<div>
          <div style={{display:'flex',gap:8,marginBottom:12}}>

      </div>
    </div>
  );
}

function Setup({selectedTypes,toggleType,toggleAll,filtP,selPassages,toggleP,activeBook,setActiveBook,selectAllInBook,deselectAllInBook,bookSelCount,bookTotalCount,qCount,setQCount,ansMode,setAnsMode,diffFilter,setDiffFilter,searchText,setSearchText,start,printDirect,books,allPassages,handleCSVUpload,studentName,setStudentName,scriptUrl,setScriptUrl,session,onLogout}){

/* ── 타이머 컴포넌트 ── */
function Timer({timerKey,onExpire,stopped}){
  const [left,setLeft]=useState(120);
  const [paused,setPaused]=useState(false);
  useEffect(()=>{setLeft(120);setPaused(false);},[timerKey]);
  useEffect(()=>{
    if(paused||stopped)return;
    if(left<=0){onExpire?.();return;}
    const t=setTimeout(()=>setLeft(l=>l-1),1000);
    return()=>clearTimeout(t);
  },[left,paused,stopped]);

  const m=Math.floor(left/60), sec=left%60;
  const pct=left/120*100;
  const color=left<=30?'#ef4444':left<=60?'#f59e0b':'#4f7df7';
  return(
    <div style={{display:'flex',alignItems:'center',gap:10}}>
      <div style={{flex:1,background:'#e2e8f0',borderRadius:4,height:4,overflow:'hidden'}}>
        <div style={{background:color,height:'100%',width:`${pct}%`,transition:'width 1s linear',borderRadius:4}}/>
      </div>
      <span style={{fontSize:13,fontWeight:700,color,minWidth:42,textAlign:'right',fontVariantNumeric:'tabular-nums'}}>
        {m}:{sec.toString().padStart(2,'0')}
      </span>
    </div>
  );
}

/* ── 퀴즈 ── */
function Quiz({q,idx,total,userAnswer,showAnswer,onSubmit,onNext,score,ansMode,goHome,questions,userAns,timerKey,doPrint}){
  const [selected,setSelected]=useState(null);
  const [sA,setSA]=useState(null);
  const [sB,setSB]=useState(null);
  const [insertSel,setInsertSel]=useState(null);
  const [irrelSel,setIrrelSel]=useState(null);

  useEffect(()=>{setSelected(null);setSA(null);setSB(null);setInsertSel(null);setIrrelSel(null);},[idx]);

  const submit=()=>{
    let c=false;
    if(q.type==='summary'){c=q.aOpts[sA]?.correct&&q.bOpts[sB]?.correct;onSubmit({correct:c,selectedA:sA,selectedB:sB});}
    else if(q.type==='insert'){c=insertSel===q.correctPos;onSubmit({correct:c,selected:insertSel});}
    else if(q.type==='irrelevant'){c=irrelSel===q.correctNum;onSubmit({correct:c,selected:irrelSel});}
    else{c=q.options?.[selected]?.correct||false;onSubmit({correct:c,selected});}
  };

  const canSubmit=()=>{
    if(q.type==='summary')return sA!==null&&sB!==null;
    if(q.type==='insert')return insertSel!==null;
    if(q.type==='irrelevant')return irrelSel!==null;
    return selected!==null;
  };

  const handleExpire=()=>{if(!userAnswer)onSubmit({correct:false,expired:true});};

  const tInfo=TYPES.find(t=>t.id===q.type);
  const pct=((idx+1)/total)*100;

  return(
    <div style={S.page}>
      <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet"/>
      <div style={{...S.box,paddingBottom:90}}>

        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
          <button onClick={goHome} style={{background:'none',border:'none',color:'#64748b',fontSize:13,cursor:'pointer'}}>← 홈</button>
          <div style={{display:'flex',gap:6,alignItems:'center'}}>
            <span style={{fontSize:11.5,color:'#64748b'}}>정답률 {score.total>0?Math.round(score.correct/score.total*100):0}%</span>
            <button onClick={()=>doPrint('q')} style={{...S.chip(false),fontSize:10.5}}>🖨️ 문제지</button>
            <button onClick={()=>doPrint('a')} style={{...S.chip(false),fontSize:10.5}}>🖨️ 정답지</button>
          </div>
        </div>

        {/* 진행바 */}
        <div style={{background:'#e2e8f0',borderRadius:4,height:4,marginBottom:5,overflow:'hidden'}}>
          <div style={{background:'linear-gradient(90deg,#4f7df7,#6fa0ff)',height:'100%',width:`${pct}%`,transition:'width .4s',borderRadius:4}}/>
        </div>
        <div style={{display:'flex',justifyContent:'space-between',marginBottom:6,fontSize:10.5,color:'#94a3b8'}}>
          <span>{idx+1} / {total}</span><span>맞힌 문제: {score.correct}</span>
        </div>

        {/* 타이머 */}
        <div style={{marginBottom:14}}>
          <Timer timerKey={timerKey} onExpire={handleExpire} stopped={!!userAnswer}/>
        </div>

        {/* 문제 카드 */}
        <div style={S.card}>
          <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:12}}>
            <span style={{fontSize:17}}>{tInfo?.icon}</span>
            <span style={{fontSize:12,fontWeight:700,color:'#4f7df7'}}>{tInfo?.name}</span>
            <span style={{fontSize:10,color:q.passage.difficulty==='높음'?'#e53935':'#94a3b8',fontWeight:600,marginLeft:'auto',padding:'2px 8px',borderRadius:10,background:q.passage.difficulty==='높음'?'#fef2f2':'#f8fafc'}}>{q.passage.difficulty}</span>
          </div>
          {/* 출처 */}
          <p style={{fontSize:10.5,color:'#94a3b8',margin:'0 0 10px'}}>출처: {q.passage.id}</p>
          <p style={{fontSize:14.5,fontWeight:600,color:'#1e293b',marginBottom:16,lineHeight:1.5}}>{q.instruction}</p>

          <PassageView q={q} insertSel={insertSel} setInsertSel={userAnswer?null:setInsertSel} irrelSel={irrelSel} setIrrelSel={userAnswer?null:setIrrelSel} showAnswer={showAnswer}/>
        </div>

        {/* 선택지 */}
        <div style={S.card}>
          <OptsView q={q} selected={selected} setSelected={userAnswer?null:setSelected} sA={sA} setSA={userAnswer?null:setSA} sB={sB} setSB={userAnswer?null:setSB} showAnswer={showAnswer}/>

          {!userAnswer?(
            <button onClick={submit} disabled={!canSubmit()} style={{width:'100%',padding:12,borderRadius:12,border:'none',background:canSubmit()?'#4f7df7':'#cbd5e1',color:'#fff',fontSize:14.5,fontWeight:600,cursor:'pointer',marginTop:12}}>제출</button>
          ):(
            <div style={{marginTop:12}}>
              {showAnswer&&<div style={{padding:13,borderRadius:12,marginBottom:10,background:userAnswer.correct?'#f0fdf4':'#fef2f2',border:`1px solid ${userAnswer.correct?'#86efac':'#fca5a5'}`}}>
                <p style={{fontWeight:700,fontSize:14,color:userAnswer.correct?'#166534':'#991b1b',margin:0}}>
                  {userAnswer.expired?'⏰ 시간 초과':userAnswer.correct?'🎉 정답!':'❌ 오답'}
                </p>
                <p style={{fontSize:12,color:'#475569',marginTop:7,marginBottom:0,lineHeight:1.6}}>
                  <strong>{q.passage.title}</strong><br/>{q.passage.abstract}
                </p>
              </div>}
              <button onClick={onNext} style={{width:'100%',padding:12,borderRadius:12,border:'none',background:'#1e293b',color:'#fff',fontSize:14.5,fontWeight:600,cursor:'pointer'}}>
                {idx+1>=total?'결과 보기':'다음 문제 →'}
              </button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ── 지문 표시 ── */
function PassageView({q,insertSel,setInsertSel,irrelSel,setIrrelSel,showAnswer}){
  const M=['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩','⑪','⑫'];

  if(q.type==='order'){
    return(<div>
      <div style={{padding:11,background:'#f8fafc',borderRadius:10,border:'1px solid #e2e8f0',marginBottom:12}}>
        <p style={{fontSize:10.5,fontWeight:600,color:'#64748b',margin:'0 0 3px'}}>주어진 글</p>
        <p style={{fontSize:15,color:'#1e293b',margin:0,lineHeight:1.8}}>{q.given}</p>
      </div>
      {q.blocks.map(b=><div key={b.label} style={{padding:11,background:'#fff',borderRadius:10,border:'1px solid #e2e8f0',marginBottom:7}}>
        <span style={{fontWeight:700,color:'#4f7df7',fontSize:13.5,marginRight:7}}>({b.label})</span>
        <span style={{fontSize:15,color:'#334155',lineHeight:1.8}}>{b.text}</span>
      </div>)}
    </div>);
  }

  if(q.type==='insert'){
    return(<div>
      <div style={{padding:11,background:'#eef3ff',borderRadius:10,border:'1px solid #bfdbfe',marginBottom:12}}>
        <p style={{fontSize:10.5,fontWeight:600,color:'#4f7df7',margin:'0 0 3px'}}>주어진 문장</p>
        <p style={{fontSize:15,color:'#1e293b',margin:0,lineHeight:1.8}}>{q.removed}</p>
      </div>
      <div style={{fontSize:15,lineHeight:2,color:'#334155'}}>
        {q.remaining.map((sent,i)=>{
          // 첫 문장은 마커 없이 표시
          if(i<q.markerStart) return <span key={i}>{sent} </span>;
          const mIdx=i-q.markerStart;
          if(mIdx>=q.maxMarkers) return <span key={i}>{sent} </span>;
          const isCorrect=showAnswer&&mIdx===q.correctPos;
          const isSel=insertSel===mIdx;
          const isWrong=showAnswer&&isSel&&mIdx!==q.correctPos;
          return(<span key={i}>
            <span onClick={()=>setInsertSel&&setInsertSel(mIdx)} style={{
              cursor:setInsertSel?'pointer':'default',display:'inline-block',margin:'0 3px',
              padding:'1px 5px',borderRadius:4,fontWeight:700,fontSize:14.5,
              color:isCorrect?'#16a34a':isWrong?'#dc2626':isSel?'#4f7df7':'#f59e0b',
              background:isCorrect?'#dcfce7':isWrong?'#fee2e2':isSel?'#dbeafe':'transparent',
            }}>{M[mIdx]}</span>
            {sent}{' '}
          </span>);
        })}
      </div>
    </div>);
  }

  if(q.type==='blank'){
    return(<div style={{fontSize:15,lineHeight:2,color:'#334155'}}>
      {q.passage.sentences.map((sent,i)=><span key={i}>
        {i===q.blankIdx?<span style={{background:'#fef9c3',borderRadius:4,padding:'2px 3px'}}>{q.blanked}</span>:<span>{sent}</span>}{' '}
      </span>)}
    </div>);
  }

  if(q.type==='implication'){
    return(<div style={{fontSize:15,lineHeight:2,color:'#334155'}}>
      {q.passage.sentences.map((sent,i)=>{
        if(i===q.targetIdx){
          const ph=q.underline;
          const re=new RegExp(`(${ph.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,'i');
          const parts=sent.split(re);
          return <span key={i}>{parts.map((p,j)=>
            p.toLowerCase()===ph.toLowerCase()?<span key={j} style={{borderBottom:'3px solid #f59e0b',fontWeight:600,color:'#92400e',padding:'0 1px'}}>{p}</span>
            :<span key={j}>{p}</span>
          )}{' '}</span>;
        }
        return <span key={i}>{sent} </span>;
      })}
    </div>);
  }

  if(q.type==='irrelevant'){
    const numMap={};
    q.numberedIdxs.forEach((fi,ci)=>{numMap[fi]=ci+1;});
    return(<div style={{fontSize:15,lineHeight:2,color:'#334155'}}>
      {q.full.map((sent,i)=>{
        const num=numMap[i];
        if(i===0||num===undefined) return <span key={i}>{sent} </span>;
        const isC=showAnswer&&num===q.correctNum;
        const isS=irrelSel===num;
        const isW=showAnswer&&isS&&num!==q.correctNum;
        return <span key={i} onClick={()=>setIrrelSel&&setIrrelSel(num)} style={{
          cursor:setIrrelSel?'pointer':'default',
          background:isC?'#dcfce7':isW?'#fee2e2':isS?'#dbeafe':'transparent',
          borderRadius:4,padding:'1px 2px',transition:'all .12s'
        }}>
          <strong style={{color:isC?'#16a34a':isW?'#dc2626':'#4f7df7',marginRight:2,fontSize:13.5}}>{M[num-1]}</strong>
          {sent}{' '}
        </span>;
      })}
    </div>);
  }

  if(q.type==='summary'){
    // abstract에서 ansA/ansB를 정확히 찾아 치환
    let sumText=q.abstract;
    const replaceExact=(text,word,tag)=>{
      const idx=text.toLowerCase().indexOf(word.toLowerCase());
      if(idx===-1)return null;
      return text.slice(0,idx)+tag+text.slice(idx+word.length);
    };
    let replaced=sumText;
    const rA=q.ansA?replaceExact(replaced,q.ansA,'(A) _______'):null;
    if(rA)replaced=rA;
    const rB=q.ansB?replaceExact(replaced,q.ansB,'(B) _______'):null;
    if(rB)replaced=rB;
    // 치환 성공하면 abstract 사용, 아니면 영어 고정 문장
    if(rA&&rB){sumText=replaced;}
    else if(rA&&!rB){sumText=rA.replace('(A) _______','(A) _______')+' This is related to (B) _______ .';}
    else{sumText=`The passage is about (A) _______ and its relationship with (B) _______ .`;}
    return(<div>
      <div style={{fontSize:15,lineHeight:2,color:'#334155',marginBottom:14}}>
        {q.passage.sentences.map((s,i)=><span key={i}>{s} </span>)}
      </div>
      <div style={{padding:13,background:'#f1f5f9',borderRadius:10,border:'1px dashed #94a3b8'}}>
        <p style={{fontSize:11.5,fontWeight:700,color:'#475569',margin:'0 0 5px'}}>▼ 요약문</p>
        <p style={{fontSize:15,color:'#1e293b',margin:0,lineHeight:1.8}}>{sumText}</p>
      </div>
    </div>);
  }

  return(<div style={{fontSize:15,lineHeight:2,color:'#334155'}}>
    {q.passage.sentences.map((s,i)=><span key={i}>{s} </span>)}
  </div>);
}

/* ── 선택지 ── */
function OptsView({q,selected,setSelected,sA,setSA,sB,setSB,showAnswer}){
  const L=['①','②','③','④','⑤'];

  if(q.type==='insert')return <p style={{fontSize:12.5,color:'#64748b'}}>위 지문에서 ①~⑤ 중 주어진 문장이 들어갈 위치를 클릭하세요.</p>;
  if(q.type==='irrelevant')return <p style={{fontSize:12.5,color:'#64748b'}}>위 지문에서 전체 흐름과 관계 없는 문장의 번호를 클릭하세요.</p>;

  if(q.type==='summary'){
    return(<table style={{width:'100%',borderCollapse:'collapse',fontSize:15}}>
      <thead><tr>
        <th style={{padding:'7px 3px',textAlign:'center',color:'#64748b',borderBottom:'2px solid #e2e8f0',width:'8%'}}></th>
        <th style={{padding:'7px',textAlign:'left',color:'#4f7df7',fontWeight:700,borderBottom:'2px solid #e2e8f0'}}>(A)</th>
        <th style={{padding:'7px',textAlign:'left',color:'#7c3aed',fontWeight:700,borderBottom:'2px solid #e2e8f0'}}>(B)</th>
      </tr></thead>
      <tbody>{q.aOpts.map((aO,i)=>{
        const bO=q.bOpts[i];if(!bO)return null;
        const aC=showAnswer&&aO.correct, bC=showAnswer&&bO.correct;
        const aW=showAnswer&&sA===i&&!aO.correct, bW=showAnswer&&sB===i&&!bO.correct;
        return <tr key={i} onClick={()=>{if(setSA){setSA(i);setSB(i);}}} style={{cursor:setSA?'pointer':'default'}}>
          <td style={{padding:'9px 3px',textAlign:'center',fontWeight:700,color:'#94a3b8',borderBottom:'1px solid #f1f5f9'}}>{L[i]}</td>
          <td style={{padding:'9px 7px',borderBottom:'1px solid #f1f5f9',background:aC?'#f0fdf4':aW?'#fef2f2':(sA===i?'#eef3ff':''),fontWeight:aC||sA===i?600:400,color:aC?'#166534':aW?'#991b1b':'#334155'}}>{aO.text}</td>
          <td style={{padding:'9px 7px',borderBottom:'1px solid #f1f5f9',background:bC?'#f0fdf4':bW?'#fef2f2':(sB===i?'#f3f0ff':''),fontWeight:bC||sB===i?600:400,color:bC?'#166534':bW?'#991b1b':'#334155'}}>{bO.text}</td>
        </tr>;
      })}</tbody>
    </table>);
  }

  if(!q.options)return null;
  return(<div style={{display:'flex',flexDirection:'column',gap:6}}>
    {q.options.map((o,i)=>{
      let bg='#f8fafc',bd='1px solid #e2e8f0',cl='#334155';
      if(showAnswer&&o.correct){bg='#f0fdf4';bd='2px solid #22c55e';cl='#166534';}
      else if(showAnswer&&selected===i&&!o.correct){bg='#fef2f2';bd='2px solid #ef4444';cl='#991b1b';}
      else if(selected===i){bg='#eef3ff';bd='2px solid #4f7df7';cl='#1d4ed8';}
      return <button key={i} onClick={()=>setSelected&&setSelected(i)} style={{
        display:'flex',alignItems:'flex-start',gap:8,padding:'10px 13px',
        borderRadius:11,border:bd,background:bg,color:cl,fontSize:15,
        cursor:setSelected?'pointer':'default',textAlign:'left',lineHeight:1.5,transition:'all .12s'
      }}>
        <span style={{fontWeight:700,minWidth:17,color:showAnswer&&o.correct?'#16a34a':'inherit'}}>{L[i]}</span>
        <span>{o.text}</span>
      </button>;
    })}
  </div>);
}

/* ── 인쇄 화면 ── */
function PrintView({questions,mode,goBack}){
  const TN={topic:'주제 찾기',order:'순서 배열',blank:'빈칸 추론',insert:'문장 삽입',summary:'요약문',implication:'함축적 의미',irrelevant:'무관한 문장'};
  const M=['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩','⑪','⑫'];

  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

  const buildHTML=()=>{
    let h=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>대단한영어 내신시험 출제예상문제</title><style>@page{size:A4;margin:12mm 10mm}*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Batang',serif;font-size:9pt;line-height:1.65;color:#111}h1{text-align:center;font-size:14pt;border-bottom:2pt solid #000;padding-bottom:6px;margin-bottom:14px}.wrap{column-count:2;column-gap:16px;column-rule:1px solid #bbb}.q{break-inside:avoid;margin-bottom:14px;padding-bottom:10px;border-bottom:1px dashed #ccc}.qn{font-weight:bold;font-size:9.5pt;margin:2px 0 4px}.src{font-size:7pt;color:#999}.p{background:#f5f5f5;padding:5px 7px;border:1px solid #ddd;margin:3px 0;font-size:8.5pt;line-height:1.65}.gv{background:#eee;padding:5px 7px;border:1px solid #ccc;margin:3px 0;font-size:8.5pt}.op{margin:3px 0;font-size:8.5pt;line-height:1.5}.op div{margin:1px 0}table{border-collapse:collapse;width:100%;margin:3px 0;font-size:8.5pt}th,td{border:1px solid #000;padding:2px 5px}</style></head><body><h1>대단한영어 ${mode==='q'?'내신시험 출제예상문제':'정답지'}</h1>`;
    if(mode==='q'){
      h+='<div class="wrap">';
      questions.forEach((q,i)=>{
        h+=`<div class="q"><div class="src">${q.passage.id}</div><div class="qn">${i+1}. [${TN[q.type]}] ${esc(q.instruction)}</div>`;
        if(q.type==='order'){
          h+=`<div class="gv"><b>주어진 글:</b> ${esc(q.given)}</div>`;
          q.blocks.forEach(b=>h+=`<div class="p"><b>(${b.label})</b> ${esc(b.text)}</div>`);
          h+='<div class="op">';q.options.forEach((o,j)=>h+=`<div>${M[j]} ${esc(o.text)}</div>`);h+='</div>';
        }else if(q.type==='insert'){
          h+=`<div class="gv"><b>주어진 문장:</b> ${esc(q.removed)}</div><div class="p">`;
          q.remaining.forEach((s,j)=>{if(j>=q.markerStart){const mi=j-q.markerStart;if(mi<q.maxMarkers)h+=`<b>${M[mi]}</b> `;}h+=esc(s)+' ';});
          h+='</div>';
        }else if(q.type==='blank'){
          h+='<div class="p">';q.passage.sentences.forEach((s,j)=>h+=(j===q.blankIdx?`<u>${esc(q.blanked)}</u>`:esc(s))+' ');
          h+='</div><div class="op">';q.options.forEach((o,j)=>h+=`<div>${M[j]} ${esc(o.text)}</div>`);h+='</div>';
        }else if(q.type==='irrelevant'){
          h+='<div class="p">';const nm1={};q.numberedIdxs.forEach((fi,ci)=>{nm1[fi]=ci+1;});q.full.forEach((s,i)=>{if(nm1[i]&&i>0)h+=`<b>${M[nm1[i]-1]}</b> ${esc(s)} `;else h+=esc(s)+' ';});h+='</div>';
        }else if(q.type==='summary'){
          h+='<div class="p">';q.passage.sentences.forEach(s=>h+=esc(s)+' ');h+='</div>';
          h+=`<div class="gv"><b>요약문:</b> ${esc(q.abstract)}</div>`;
          h+='<table><tr><th></th><th>(A)</th><th>(B)</th></tr>';
          q.aOpts.forEach((a,j)=>{const b=q.bOpts[j];if(b)h+=`<tr><td style="text-align:center">${M[j]}</td><td>${esc(a.text)}</td><td>${esc(b.text)}</td></tr>`;});h+='</table>';
        }else if(q.type==='implication'){
          h+='<div class="p">';q.passage.sentences.forEach((s,j)=>{h+=(j===q.targetIdx?`<u>${esc(s)}</u>`:esc(s))+' ';});
          h+='</div><div class="op">';q.options.forEach((o,j)=>h+=`<div>${M[j]} ${esc(o.text)}</div>`);h+='</div>';
        }else{
          h+='<div class="p">';q.passage.sentences.forEach(s=>h+=esc(s)+' ');
          h+='</div><div class="op">';if(q.options)q.options.forEach((o,j)=>h+=`<div>${M[j]} ${esc(o.text)}</div>`);h+='</div>';
        }
        h+='</div>';
      });
      h+='</div>';
    }else{
      h+='<table><tr><th>번호</th><th>유형</th><th>출처</th><th>정답</th><th>해설</th></tr>';
      questions.forEach((q,i)=>{
        let ans='';
        if(q.type==='insert')ans=M[q.correctPos];
        else if(q.type==='irrelevant')ans=M[q.correctNum-1];
        else if(q.type==='summary'){const ai=q.aOpts.findIndex(o=>o.correct);ans=M[ai];}
        else if(q.options)ans=M[q.options.findIndex(o=>o.correct)];
        h+=`<tr><td style="text-align:center">${i+1}</td><td>${TN[q.type]}</td><td style="font-size:7.5pt">${q.passage.id}</td><td style="font-weight:bold;text-align:center">${ans}</td><td style="font-size:8pt">${esc(q.passage.title)}</td></tr>`;
      });
      h+='</table>';
    }
    h+='</body></html>';
    return h;
  };

  const openPrint=()=>{
    const html=buildHTML();
    const w=window.open('','_blank');
    if(w){w.document.write(html);w.document.close();setTimeout(()=>w.print(),400);}
  };

  return(
    <div style={{minHeight:'100vh',background:'#f5f7fa',fontFamily:"'Pretendard',sans-serif"}}>
      <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet"/>
      <div style={{maxWidth:600,margin:'0 auto',padding:'40px 16px',textAlign:'center'}}>
        <div style={{fontSize:48,marginBottom:12}}>{mode==='q'?'📄':'📋'}</div>
        <h2 style={{fontSize:20,fontWeight:700,color:'#1e293b',marginBottom:6}}>
          {APP_NAME} {mode==='q'?'문제지':'정답지'} 인쇄
        </h2>
        <p style={{fontSize:13,color:'#64748b',marginBottom:24}}>A4 2단 레이아웃 · {questions.length}문제</p>

        <button onClick={openPrint} style={{padding:'14px 32px',borderRadius:14,border:'none',background:'linear-gradient(135deg,#4f7df7,#3b5fe0)',color:'#fff',fontSize:15,fontWeight:700,cursor:'pointer',boxShadow:'0 4px 14px rgba(79,125,247,0.3)',marginBottom:16}}>
          🖨️ 인쇄하기
        </button>
        <br/>
        <button onClick={goBack} style={{padding:'10px 20px',borderRadius:10,border:'1px solid #e2e8f0',background:'#fff',fontSize:13,cursor:'pointer',color:'#64748b',marginTop:8}}>← 돌아가기</button>

        <div style={{marginTop:24,background:'#fff',borderRadius:14,padding:16,boxShadow:'0 1px 5px rgba(0,0,0,0.06)',textAlign:'left'}}>
          <h3 style={{fontSize:13,fontWeight:700,color:'#1e293b',marginBottom:10}}>미리보기</h3>
          <div style={{columns:2,columnGap:12,columnRule:'1px solid #e2e8f0'}}>
            {questions.map((q,i)=>(
              <div key={i} style={{breakInside:'avoid',marginBottom:8,padding:7,background:'#f8fafc',borderRadius:6,border:'1px solid #e2e8f0',fontSize:10.5}}>
                <div style={{fontWeight:700,color:'#1e293b'}}>{i+1}. [{TN[q.type]}]</div>
                <div style={{color:'#94a3b8',fontSize:9}}>{q.passage.id}</div>
                <div style={{color:'#475569',marginTop:2}}>{q.passage.title}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── 결과 ── */
function Results({questions,userAns,score,studentName,scriptUrl,goHome,doPrint}){
  const pct=score.total>0?Math.round(score.correct/score.total*100):0;
  const emoji=pct>=80?'🏆':pct>=50?'💪':'📖';
  const [saveStatus,setSaveStatus]=React.useState('idle'); // idle | saving | done | error

  // 결과 저장 (마운트 시 자동 전송)
  React.useEffect(()=>{
    if(!scriptUrl||!studentName)return;
    setSaveStatus('saving');
    const now=new Date();
    const dateStr=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    const details=questions.map((q,i)=>{
      const ans=userAns[i];
      return `${q.passage.id}|${TYPES.find(t=>t.id===q.type)?.name||q.type}|${ans?.correct?'O':'X'}`;
    }).join('||');
    const payload={
      action: 'saveResult',
      student: studentName,
      date: dateStr,
      score: `${score.correct}/${score.total}`,
      pct: pct,
      details: details
    };
      if(scriptUrl){
        // 저장 요청 후 성공으로 처리 (JSONP는 응답 확인 불필요)
        jsonpFetch(scriptUrl, payload).catch(()=>{});
        setSaveStatus('done');
      } else {
        setSaveStatus('done');
      }
  },[]);

  return(
    <div style={S.page}>
      <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet"/>
      <div style={S.box}>
        <div style={{textAlign:'center',marginBottom:24}}>
          <div style={{fontSize:42,marginBottom:4}}>{emoji}</div>
          <h2 style={{fontSize:20,fontWeight:700,color:'#1a2332',margin:0}}>결과</h2>
          {studentName&&<p style={{fontSize:14,color:'#4f7df7',fontWeight:600,margin:'4px 0 0'}}>{studentName}</p>}
          <p style={{fontSize:32,fontWeight:800,color:'#4f7df7',margin:'8px 0'}}>{score.correct} / {score.total}</p>
          <p style={{fontSize:13,color:'#64748b'}}>정답률 {pct}%</p>
          {/* 저장 상태 표시 */}
          {scriptUrl&&studentName&&(
            <p style={{fontSize:11.5,marginTop:4,color:saveStatus==='done'?'#16a34a':saveStatus==='error'?'#dc2626':'#94a3b8'}}>
              {saveStatus==='saving'?'📤 결과 저장 중...':saveStatus==='done'?'✅ 결과 저장 완료':saveStatus==='error'?'❌ 저장 실패 (URL 확인)':''}
            </p>
          )}
        </div>

        <div style={{display:'flex',gap:8,justifyContent:'center',marginBottom:18}}>
          <button onClick={()=>doPrint('q')} style={{padding:'9px 18px',borderRadius:10,border:'1px solid #e2e8f0',background:'#fff',fontSize:12.5,cursor:'pointer',fontWeight:500,color:'#334155'}}>🖨️ 문제지 인쇄</button>
          <button onClick={()=>doPrint('a')} style={{padding:'9px 18px',borderRadius:10,border:'1px solid #e2e8f0',background:'#fff',fontSize:12.5,cursor:'pointer',fontWeight:500,color:'#334155'}}>🖨️ 정답지 인쇄</button>
        </div>

        {questions.map((q,i)=>{
          const ans=userAns[i];
          const tI=TYPES.find(t=>t.id===q.type);
          return <div key={i} style={{...S.card,display:'flex',alignItems:'center',gap:9,padding:'12px 16px'}}>
            <span style={{fontSize:17}}>{ans?.correct?'✅':'❌'}</span>
            <div style={{flex:1}}>
              <span style={{fontSize:10.5,color:'#4f7df7',fontWeight:600}}>{tI?.name}</span>
              <p style={{fontSize:12.5,color:'#334155',margin:'2px 0 0'}}>{q.passage.title}</p>
            </div>
            <span style={{fontSize:9.5,color:'#94a3b8'}}>{q.passage.id}</span>
          </div>;
        })}

        <button onClick={goHome} style={{width:'100%',padding:13,borderRadius:14,border:'none',background:'#1e293b',color:'#fff',fontSize:14.5,fontWeight:700,cursor:'pointer',marginTop:14}}>새로운 세션 시작</button>
      </div>
    </div>
  );
}

/* ── 인쇄 HTML ── */
function printHTML(questions,userAns,mode){
  const TN={topic:'주제 찾기',order:'순서 배열',blank:'빈칸 추론',insert:'문장 삽입',summary:'요약문',implication:'함축적 의미',irrelevant:'무관한 문장'};
  const M=['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩','⑪','⑫'];
  let h=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${mode==='q'?'문제지':'정답지'}</title><style>
    body{font-family:'Batang','Times New Roman',serif;font-size:11pt;line-height:1.9;max-width:680px;margin:0 auto;padding:30px;color:#111}
    h1{text-align:center;font-size:16pt;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:20px}
    .q{margin-bottom:26px;page-break-inside:avoid}
    .qn{font-weight:bold;font-size:12pt;margin-bottom:6px}
    .src{font-size:9pt;color:#666;margin-bottom:4px}
    .p{background:#f7f7f7;padding:12px;border:1px solid #ddd;margin:8px 0;font-size:10.5pt;line-height:1.9}
    .gv{background:#eee;padding:10px;border:1px solid #ccc;margin:6px 0;font-size:10.5pt}
    .op{margin:8px 0} .op div{margin:3px 0;font-size:10.5pt}
    table{border-collapse:collapse;width:100%;margin:8px 0} th,td{border:1px solid #000;padding:5px 7px;font-size:10.5pt}
    @media print{body{padding:15px}.q{page-break-inside:avoid}}
  </style></head><body>`;

  if(mode==='q'){
    h+='<h1>대단한영어 내신시험 출제예상문제</h1>';
    questions.forEach((q,i)=>{
      h+=`<div class="q"><div class="src">출처: ${q.passage.id}</div>`;
      h+=`<div class="qn">${i+1}. [${TN[q.type]}] ${q.instruction}</div>`;

      if(q.type==='order'){
        h+=`<div class="gv"><b>주어진 글:</b> ${q.given}</div>`;
        q.blocks.forEach(b=>h+=`<div class="p"><b>(${b.label})</b> ${b.text}</div>`);
        h+='<div class="op">';q.options.forEach((o,j)=>h+=`<div>${M[j]} ${o.text}</div>`);h+='</div>';
      } else if(q.type==='insert'){
        h+=`<div class="gv"><b>주어진 문장:</b> ${q.removed}</div><div class="p">`;
        q.remaining.forEach((s,j)=>{
          if(j>=q.markerStart){const mIdx=j-q.markerStart;if(mIdx<q.maxMarkers)h+=`<b>${M[mIdx]}</b> `;}
          h+=s+' ';
        });
        h+='</div>';
      } else if(q.type==='blank'){
        h+='<div class="p">';
        q.passage.sentences.forEach((s,j)=>h+=(j===q.blankIdx?`<u>${q.blanked}</u>`:s)+' ');
        h+='</div><div class="op">';q.options.forEach((o,j)=>h+=`<div>${M[j]} ${o.text}</div>`);h+='</div>';
      } else if(q.type==='irrelevant'){
        h+='<div class="p">';const nm2={};q.numberedIdxs.forEach((fi,ci)=>{nm2[fi]=ci+1;});q.full.forEach((s,i)=>{if(nm2[i]&&i>0)h+=`<b>${M[nm2[i]-1]}</b> ${s} `;else h+=s+' ';});h+='</div>';
      } else if(q.type==='summary'){
        h+='<div class="p">';q.passage.sentences.forEach(s=>h+=s+' ');h+='</div>';
        h+=`<div class="gv"><b>요약문:</b> ${q.abstract}</div>`;
        h+='<table><tr><th></th><th>(A)</th><th>(B)</th></tr>';
        q.aOpts.forEach((a,j)=>{const b=q.bOpts[j];if(b)h+=`<tr><td style="text-align:center">${M[j]}</td><td>${a.text}</td><td>${b.text}</td></tr>`;});
        h+='</table>';
      } else if(q.type==='implication'){
        h+='<div class="p">';
        q.passage.sentences.forEach((s,j)=>{h+=(j===q.targetIdx?`<u>${s}</u>`:s)+' ';});
        h+='</div><div class="op">';q.options.forEach((o,j)=>h+=`<div>${M[j]} ${o.text}</div>`);h+='</div>';
      } else {
        h+='<div class="p">';q.passage.sentences.forEach(s=>h+=s+' ');
        h+='</div><div class="op">';if(q.options)q.options.forEach((o,j)=>h+=`<div>${M[j]} ${o.text}</div>`);h+='</div>';
      }
      h+='</div>';
    });
  } else {
    h+='<h1>정답지</h1><table><tr><th>번호</th><th>유형</th><th>출처</th><th>정답</th><th>해설</th></tr>';
    questions.forEach((q,i)=>{
      let ans='';
      if(q.type==='insert')ans=M[q.correctPos];
      else if(q.type==='irrelevant')ans=M[q.correctNum-1];
      else if(q.type==='summary'){const ai=q.aOpts.findIndex(o=>o.correct);ans=M[ai];}
      else if(q.options)ans=M[q.options.findIndex(o=>o.correct)];
      h+=`<tr><td style="text-align:center">${i+1}</td><td>${TN[q.type]}</td><td style="font-size:8pt">${q.passage.id}</td><td style="font-weight:bold;text-align:center">${ans}</td><td style="font-size:9pt">${q.passage.title}</td></tr>`;
    });
    h+='</table>';
  }
  h+='</body></html>';
  return h;
}



ReactDOM.createRoot(document.getElementById('root')).render(<App />);
