her mathematical and scientific concepts.", "After six months, the piano-taught children in the study had dramatically improved their scores on a spatial-temporal task, whereas the computer training had shown little effect.", "\"If I were a parent, I'd want to take these findings into consideration,\" reported one of the experiment's designers."], "aGroup": ["아이들의 기술 사용", "컴퓨터 캠프", "컴퓨터 훈련"], "bGroup": ["예술에서의 초기 경험", "지적 이점", "피아노 연습", "시공간적 기술", "수학적 과학적 개념"], "answers": ["spatial temporal skills", "aesthetic physical gains", "computer camp training", "technological device usage", "emotional empathy development"]}, {"id": "ABSO_TYPE_06_24", "difficulty": "높음", "title": "혁신의 함정과 다윈주의: 기존 제품의 강한 생존력", "abstract": "Blindly pursuing innovation can be dangerous, as Darwinism predicts that tried and true existing products often have a much stronger survival rate than new ones.", "keyIndex": 9, "sentences": ["There is a lot of exaggeration in the business press about the dangers of clinging to the past, and much of it is justified.", "But all the excitement about building better products and companies can make us forget that existing products and companies are here for a reason.", "After all, that is what Darwinism predicts.", "The death rate of new products and companies is dramatically higher than that of old ones.", "Dozens of new breakfast cereals fail every year, while the original cornflakes persists.", "Hundreds of new toys are introduced every year, yet most are failures.", "Even toys that were wildly popular for a while, like the Furby or Beanie Babies, have faded from the scene, while the Barbie doll persists.", "If there was truth in advertising, the slogan \"innovate or die\" would be replaced with \"innovate and die.\"", "To sum up, tried and true wins out over new and improved most of the time."], "aGroup": ["과거에 매달리는 것의 위험성", "혁신하라 그렇지 않으면 죽는다", "새롭고 개선된 것", "신제품의 사망률"], "bGroup": ["기존 제품과 기업", "다윈주의", "살아남는다", "입증되고 신뢰할 수 있는 것"], "answers": ["tried and true", "new and improved", "high death rate", "blind innovation pursuit", "short term popularity"]}, {"id": "OLLE_TYPE_08_ANALYSIS", "difficulty": "높음", "title": "과학적 지식의 철학적 기원과 확실성 탐구", "abstract": "Scientific knowledge is rooted in the philosophical quest for certainty, which prioritizes reason over easily misleading sensory observation.", "keyIndex": 3, "sentences": ["Knowledge, for science, aims to be proven knowledge, justified by evidence and reason.", "Nothing is accepted as true unless it has not been proved to be so, or there are good reasons to believe that it will be at some point in the future.", "This reflects the philosophical quest for certainty that goes back to René Descartes, who refused to accept anything that he could not know for certain to be true.", "He hoped to base all knowledge on self-evident propositions and thought that reason should take priority over observation.", "Descartes was aware that his senses frequently misled him.", "The implication of this — a view which had a long history, prior to the rise of science — was that, if the evidence of our senses did not conform to reason, it was likely that they were in error."], "aGroup": ["observation", "senses frequently misled", "in error"], "bGroup": ["proven knowledge", "certainty", "self-evident propositions", "reason"], "answers": ["priority of reason", "reliance on senses", "unverified scientific claims", "mythological belief system", "subjective emotional truth"]}, {"id": "OLLE_TYPE_08_01", "difficulty": "보통", "title": "고대 도시가 관개 농업 지역에 형성된 이유", "abstract": "Ancient urban centers developed in irrigated agricultural regions due to high output per unit of land, which enabled dense populations and efficient transport.", "keyIndex": 3, "sentences": ["Many of the ancient urban centers obtained their food supply from intensive irrigated agriculture in the region where they were located, and it is usually suggested that this is because labor productivity is particularly high with irrigated agriculture.", "It seems more relevant to point out that this type of primitive subsistence system has a particularly high output per unit of land.", "The high demand for labor per unit of land and the high output per unit of land made it necessary and possible for a large number of families to live within a small area.", "Therefore, even if the surplus per family is small, the total surplus available within a fairly small distance from the town will be large.", "In addition, the irrigation canals, or the river which were used for irrigation, can be used for boat transport of food to the town."], "aGroup": ["labor productivity", "primitive subsistence"], "bGroup": ["high output per unit of land", "large number of families", "small area", "boat transport"], "answers": ["high output per unit", "low labor productivity", "distant food transport", "scattered rural population", "modern agricultural methods"]}, {"id": "OLLE_TYPE_08_02", "difficulty": "보통", "title": "제한된 자원 할당과 기회비용", "abstract": "Because our resources are limited despite varied goals, making choices inevitably incurs opportunity costs.", "keyIndex": 5, "sentences": ["We have vast forests in this country but not enough to provide all of the wood, all of the wilderness, and all of the accessible recreation that we want.", "As soon as we log trees, build roads, or improve trails and campsites, we lose some wilderness.", "Similarly, we have large amounts of fresh water, but if we use water to grow rice in California, the water consumed cannot be used for drinking water in California cities.", "If we use fire to help a forest renew itself, we will have air pollution downwind while the fire burns.", "We have many goals, so we have to make choices about how to allocate our limited resources.", "The cost of those choices is what we give up — the cost of opportunities lost."], "aGroup": ["vast forests", "large amounts", "provide all"], "bGroup": ["limited resources", "make choices", "cost of opportunities lost"], "answers": ["opportunity cost", "unlimited natural resources", "spontaneous resource generation", "zero economic trade-off", "unconditional environmental preservation"]}, {"id": "OLLE_TYPE_08_03", "difficulty": "높음", "title": "기술 혁신에 따른 수입 감소의 역설과 사회 전체의 후생", "abstract": "Although technological innovations may reduce industry revenue and GDP, they can still significantly improve society as a whole by directly benefiting consumers.", "keyIndex": 9, "sentences": ["Not all innovations that improve human living standards show up in revenue and profits.", "Some instead accrue directly to consumers.", "Many of the product improvements brought about by technology have the paradoxical effect of reducing industry revenue.", "To see why, suppose people used to pay $1 to download a song.", "Then some change comes along so that people can listen to the song while paying only a quarter of what they used to pay.", "If there is no change in the number of people purchasing the song, revenue will fall by 75 percent.", "Even if the number of people buying a song doubles with the lower price, revenue will still fall by 50 percent.", "But people, by which we mean society as a whole, will be much better off.", "The point is that revenue reduction, and an accompanying failure to raise GDP, is not by itself evidence that society is worse off."], "aGroup": ["show up in revenue", "reducing industry revenue", "failure to raise GDP"], "bGroup": ["improve human living standards", "accrue directly to consumers", "society as a whole will be much better off"], "answers": ["better off society", "declining living standards", "stagnant consumer benefits", "exclusive corporate profits", "increased industry revenue"]}, {"id": "OLLE_TYPE_09_ANALYSIS", "difficulty": "높음", "title": "우수 실무자가 겪는 관리직 적응의 어려움", "abstract": "High-performing individuals often struggle as managers because their reluctance to abandon past success methods hinders their ability to coach others and learn from failures.", "keyIndex": 2, "sentences": ["If you were a high performer in your work before becoming a manager, you may find the journey into management particularly difficult.", "Because of their previous success, stars are understandably reluctant to give up the attitudes and practices they think produced their success thus far, and they're unwilling to change themselves.", "They don't know how to develop or coach people because they never needed much coaching themselves, or so they believe.", "They don't know how to deal with people who lack their motivation.", "Because they've never failed, they've had little practice reflecting on and learning from experience.", "No wonder many former stars turn into mediocre bosses.", "If you were a star, be aware that the very success that produced your promotion can now work against you."], "aGroup": ["high performer", "previous success", "never failed"], "bGroup": ["journey into management", "reluctant to give up", "unwilling to change", "mediocre bosses"], "answers": ["management difficulty", "seamless leadership transition", "continuous skill improvement", "high team motivation", "guaranteed future success"]}, {"id": "OLLE_TYPE_09_01", "difficulty": "보통", "title": "희소한 시간과 목적 선택의 우선순위", "abstract": "Because time and means are scarce, humans must choose which ends to satisfy, and this choice inherently reflects a ranking of priorities.", "keyIndex": 3, "sentences": ["Action takes place by choosing which ends shall be satisfied by the employment of means.", "Time is scarce for man only because whichever ends he chooses to satisfy, there are others that must remain unsatisfied.", "When we must use a means so that some ends remain unsatisfied, the necessity for a choice among ends arises.", "For example, Jones is engaged in watching a baseball game on television.", "He is faced with the choice of spending the next hour in (a) continuing to watch the baseball game, (b) playing bridge, or (c) going for a drive.", "He would like to do all three of these things, but his means (time) is insufficient.", "As a result, he must choose; one end can be satisfied, but the others must go unfulfilled.", "Suppose that he decides on course A.", "This is a clear indication that he has ranked the satisfaction of end A higher than the satisfaction of ends B or C."], "aGroup": ["do all three", "unsatisfied ends"], "bGroup": ["means is insufficient", "choose", "ranked the satisfaction higher"], "answers": ["ranked priorities", "abundant available time", "simultaneous goal satisfaction", "random choice making", "unlimited personal means"]}, {"id": "OLLE_TYPE_09_02", "difficulty": "높음", "title": "자연적 스트레스의 순기능과 인위적 독소의 역기능", "abstract": "While natural environmental stresses foster genetic diversity and adaptation, introducing toxins like pesticides reduces diversity and causes pests to develop tolerance.", "keyIndex": 6, "sentences": ["Environmental stresses cause changes in the genetic makeup of a population by favoring certain gene variants more than others.", "This is, in fact, the normal way that populations can adapt rapidly to changes in their environment without mutations being required to produce new adaptations.", "It is also the reason why populations with genetic diversity are more likely to survive in the face of change.", "However, there is another side of this phenomenon related to human impacts on populations.", "Toxins added to the environment create selection pressure for individuals that are more tolerant of the toxins.", "One negative impact of this is that it can reduce the genetic diversity of a population.", "Another problem occurs if the organism is a pest and the toxin is contained in, for example, a pesticide.", "As a result of the selection pressure, the population seems to develop tolerance to the toxin.", "The pesticide then becomes less effective."], "aGroup": ["normal way", "adapt rapidly", "genetic diversity"], "bGroup": ["human impacts", "toxins added", "reduce genetic diversity", "develop tolerance"], "answers": ["developed tolerance", "increased genetic diversity", "reduced selection pressure", "enhanced pesticide effectiveness", "natural harmless mutations"]}, {"id": "OLLE_TYPE_09_03", "difficulty": "높음", "title": "부의 상대적 비교와 행복", "abstract": "Both monkeys and humans determine their happiness and satisfaction based not on absolute wealth, but on their wealth relative to their peers.", "keyIndex": 1, "sentences": ["People's happiness depends not on their absolute wealth, but rather on their wealth relative to those around them.", "In one experiment, two capuchin monkeys were initially perfectly content with a reward of cucumbers when they successfully performed a task.", "But when one monkey was later given tastier grapes as a reward, the monkey receiving plain old cucumbers became enraged, angrily throwing the previously satisfactory salad vegetable at its handler.", "The monkeys' economy had grown, since grapes are better than cucumbers.", "But the resulting inequality brought only discontent.", "Humans are the same.", "When employees at the University of California were given information about the salaries of their peers, those discovering they were paid below the average suddenly became less satisfied and more likely to seek a new job.", "The attitudes of those earning above the average were happily unaffected."], "aGroup": ["absolute wealth", "perfectly content", "economy had grown"], "bGroup": ["relative to those around them", "inequality", "discontent", "less satisfied"], "answers": ["relative wealth", "absolute financial growth", "total economic equality", "independent happiness level", "unconditional life satisfaction"]}, {"id": "OLLE_TYPE_09_PR_01", "difficulty": "보통", "title": "참된 지식과 우연히 진실이 된 믿음의 차이", "abstract": "Real knowledge requires proper justification, whereas a belief based on mistaken visual evidence is not knowledge even if it turns out to be coincidentally true.", "keyIndex": 6, "sentences": ["Imagine that a farmer is wondering whether his black-and-white cow, Daisy, is in the field.", "He believes she is in the field when he goes to look, because he sees something black-and-white in the distance.", "Later, it turns out that what he saw was a large black-and-white bag, not Daisy.", "But the cow really was in the field — she was just hidden from sight in a dip.", "The farmer was right that Daisy was there, but wrong in what he saw.", "So, he didn't have real knowledge — it was just a belief that turned out to be true."], "aGroup": ["sees something black-and-white", "wrong in what he saw", "a belief"], "bGroup": ["hidden from sight", "didn't have real knowledge"], "answers": ["real knowledge", "false optical illusion", "undeniable absolute truth", "verifiable scientific evidence", "profound philosophical insight"]}, {"id": "OLLE_TYPE_09_PR_02", "difficulty": "높음", "title": "음식과 음료에서 느끼는 암묵적 지식으로서의 즐거움", "abstract": "The enjoyment we derive from food and drink is too complex for words and exists as a form of tacit knowledge that we understand but cannot articulate.", "keyIndex": 6, "sentences": ["Nearly everything we eat or drink for pleasure is too complex to fully describe in words.", "A bottle of wine may be described as having characteristics you like but still turn out to be not so nice, for reasons that are impossible to express in words.", "Conversely, it may be described as having characteristics you know you hate but still turn out to be delicious, again for reasons that cannot be explained in words.", "Even after experiencing the wine, it is impossible to say precisely and completely why you liked it.", "You might have words to describe some parts of your enjoyment (perhaps it had \"good structure\" or \"rich fruit\"), but those words will be both imperfect and incomplete descriptions, a pale shadow of what you actually enjoyed about it.", "What we enjoy in any particular food or drink is a type of tacit knowledge: a complex of interacting characteristics that we know but are unable to say."], "aGroup": ["express in words", "words to describe", "imperfect and incomplete descriptions"], "bGroup": ["too complex", "tacit knowledge", "unable to say"], "answers": ["tacit knowledge", "explicit verbal expression", "predictable flavor profile", "objective sensory data", "complete descriptive analysis"]},
{"id":"27ST_E_21_GATE","difficulty":"높음","title":"지리학의 본질: 공간적 배열과 맥락의 중요성","abstract":"Geography is essentially the study of spatial arrangements and their implications, which is crucial for understanding everything from daily activities to macroscopic policy decisions.","keyIndex":4,"sentences":["One word is inextricably associated with geography: where.","That is because geography starts from the premise that it matters where something takes place on Earth's surface.","The key questions are not simply \"where\" questions, though; they are \"why there\" and \"so what\" questions.","Getting to such questions means taking spatial arrangements, variations, and interconnections seriously.","Engaging in even the simplest day-to-day activity requires some appreciation of spatial circumstances — where to find food and services, how to get to work places, and the like.","Moving up in scale, without some awareness of how phenomena are arranged on Earth's surface, it is difficult to make reasoned business or policy judgments, make sense of events, or grasp some of the basic forces shaping life on the planet.","Locating a new store or public service requires taking into consideration population distributions, the location of roads and utilities, socio-economic patterns, and more.","Understanding why and where migration happens requires consideration of the political organization of territory, the spatial consequences of discrimination, socio-economic patterns, and the layout of the physical environment."],"aGroup":["simply where questions","day-to-day activity"],"bGroup":["why there and so what","spatial arrangements","variations","interconnections"],"answers":["spatial arrangements","chronological sequences","superficial features","isolated phenomena","temporary events"]},
{"id":"27ST_E_21_01","difficulty":"보통","title":"지리학이 도입한 공간 명시 방법의 혁신","abstract":"The introduction of spatially explicit methods by geography has revolutionized the study of human-environment interactions by overcoming past inaccurate practices.","keyIndex":8,"sentences":["Perhaps nothing has revolutionized the study of human-environment interactions more than the development of spatially explicit methods for collecting and analyzing data.","Just a few decades ago, most natural and social scientists collected their data without precise spatial referents.","References were made to watersheds, to communities, to villages, to cities, to proximity to rivers, and so on.","In some cases (in anthropology mostly), there was even the custom of changing the name of the community and even its location, \"to protect the informants.\"","While confidentiality remains an important concern when working with human subjects, the extreme to which this was done was largely unjustified.","Everyone knew more or less where these studied communities were, and anyone interested could have found out.","Be that as it may, there was very little interest, except in geography, to precisely locate a study area on a map with coordinates.","Geography persisted, and finally convinced the rest of us, that place was fundamentally important to understand human-environment dynamics."],"aGroup":["without precise spatial referents","changing the name and location","unjustified extreme","very little interest"],"bGroup":["spatially explicit methods","precisely locate","map with coordinates","fundamentally important"],"answers":["precise spatial referents","ambiguous time frames","anonymous research subjects","hypothetical ecological models","subjective human emotions"]},
{"id":"27ST_E_21_02","difficulty":"높음","title":"데카르트의 극단적 회의와 사유하는 자아의 존재 증명","abstract":"Through extreme skepticism regarding the unreliability of senses, Descartes paradoxically proved the undeniable existence of the thinking self.","keyIndex":6,"sentences":["The idea that our senses may be deceiving us was taken up by the French philosopher and mathematician René Descartes.","He realized that sometimes our senses give us a false impression — a straight stick in a glass of water appears to be bent, for example.","And if we know that they can be unreliable, it would be wrong to trust them completely — everything that we experience with our senses might be false.","It might even be that we are asleep, and that the world we are experiencing is no more than a dream, or that God or some mischievous power is making us believe things that are not really true.","If that is the case, though, we can never know anything for sure.","But Descartes then showed that there was one thing he could be sure of: In order to be deceived, he must exist, and exist as a thing that thinks.","So, although his senses could not be trusted, he could be sure he existed as something that was capable of thinking and reasoning."],"aGroup":["senses may be deceiving us","false impression","unreliable","dream","mischievous power","never know anything for sure"],"bGroup":["one thing he could be sure of","must exist","exist as a thing that thinks","capable of thinking and reasoning"],"answers":["capable of thinking","relying on senses","observing natural phenomena","ignoring empirical data","trusting divine revelation"]},
{"id":"27ST_E_21_03","difficulty":"높음","title":"아체 부족의 식량 공유를 통한 상호 생존 보험","abstract":"To cope with the unpredictable nature of hunting, the Ache tribe practices extensive resource sharing, establishing a mutual insurance policy against starvation.","keyIndex":8,"sentences":["Hunters in the Ache tribe, living in the Paraguayan jungle, have a lot of ups and downs in their success at the hunt.","Some days they bring home much more food than they could possibly eat; other days they come home empty-handed.","If a man caught a wild pig and hoarded it for himself and his family, much of it would go to waste (there are no deep-freeze refrigerators in the Paraguayan jungle).","During unlucky periods, individual hunters and their families would starve.","Instead of living by a philosophy of \"rugged individualism,\" however, hunters who have a lucky day share their meat with other families.","And they don't just share a little; they share a lot — fully 90%.","In exchange for this generosity, their neighbors share with them on days when the luck runs the other way.","By exchanging resources, particularly those that are unpredictable and uncertain (like meat from the hunt, as opposed to vegetable crops), the group provides a mutual insurance policy against starvation."],"aGroup":["ups and downs","empty-handed","hoarded it for himself","go to waste","starve","rugged individualism"],"bGroup":["share their meat","exchange for this generosity","exchanging resources","mutual insurance policy"],"answers":["mutual insurance policy","rugged individualism","competitive food hoarding","hierarchical resource distribution","independent survival strategies"]},
{"id":"27ST_E_22_GATE","difficulty":"높음","title":"자연 변동성을 수용하는 소프트 패스 하천 공학","abstract":"Soft-path river engineering, characterized by intellectual modesty, accepts the variability of a river's movement as ecologically significant, contrasting with interventionist hard-path methods.","keyIndex":9,"sentences":["What is soft-path river engineering?","One way to visualize its spirit is to liken it to a footpath in the forest.","Suppose a tree falls across a footpath.","A soft-path response would be simply to redirect the trail around the fallen tree.","A more interventionist response would be to remove the tree and restore the original route.","A still more interventionist response might be to straighten and pave the path to insert it more permanently in the landscape.","The true high-modernist step would, of course, be to create a superhighway that removes the landscape and bulldozes straight through all obstacles in the topography.","Soft-path engineering has the unique advantage of intellectual modesty with respect to what we actually know about river movement and its environmental effects.","In contrast to hard-path engineering, soft-path engineering accepts variability in the river's movement as significant until proven otherwise.","Backwaters, short-lived wetlands, braids and channels, swamps — all undesirable to hard-path engineering — are presumed by soft-path engineers to be ecologically important."],"aGroup":["interventionist response","restore the original route","straighten and pave","insert it permanently","high-modernist step","bulldozes straight through","hard-path engineering"],"bGroup":["soft-path response","redirect the trail","intellectual modesty","accepts variability","ecologically important"],"answers":["intellectual modesty","strict environmental control","high-modernist intervention","predictable river flow","permanent structural alterations"]},
{"id":"27ST_E_22_01","difficulty":"보통","title":"인간 중심 경관 개발이 초래하는 생태적 단절","abstract":"Landscapes altered for human connectivity inadvertently act as severe barriers for other species, diminishing the conservation value of remaining habitats.","keyIndex":3,"sentences":["Connectivity, the capacity of a landscape to support movement by any given species across the landscape, is of increasing concern for conservation biologists.","As the connectivity of a landscape increases from the human perspective (generally through increases in road networks), connectivity decreases for many other species.","Although we may see many species of animals moving across human landscapes (e.g. deer, wolves, and turtles crossing roads or wandering through our backyards), landscapes substantially altered for human use act as barriers to movement of both animal and plant species.","In some cases, these barriers are incomplete — many turtles die on roads, but some make it across.","In other cases, passage is essentially impossible — cities along landscape corridors such as river valleys can effectively eliminate genetic exchange between previously connected plant and animal populations; dams can permanently halt spawning of fish by blocking travel to their breeding grounds.","Thus, lack of connectivity can decrease the conservation value of remaining habitat below what its mapped area might suggest, increasing the impact of fragmentation."],"aGroup":["connectivity from the human perspective","road networks","substantially altered for human use","act as barriers","eliminate genetic exchange","halt spawning"],"bGroup":["connectivity for conservation","support movement by any given species","conservation value of remaining habitat"],"answers":["act as barriers","promote genetic exchange","facilitate natural migration","expand usable habitats","enhance ecological connectivity"]},
{"id":"27ST_E_22_02","difficulty":"보통","title":"지속 가능한 방향을 제시하는 바이오 발전의 다각적 이점","abstract":"Biopower promotes sustainability by utilizing waste products, which mitigates climate change and benefits both human health and rural economies.","keyIndex":1,"sentences":["By enhancing energy efficiency and putting waste products to use, biopower helps move utilities and industries in a sustainable direction.","The U.S. forest products industry now obtains half its energy by combusting woody waste and liquid waste from pulp mill processing.","Biopower helps alleviate climate change as well by reducing carbon dioxide emissions, and capturing landfill gas reduces emissions of methane, a potent greenhouse gas.","Biopower also benefits human health as it cuts down on pollution; by replacing coal in co-firing and direct combustion, biopower reduces emissions of sulfur dioxide because plant matter, unlike coal, contains no appreciable sulfur content.","In addition, biomass resources tend to be geographically spread out, so using them can help support rural economies and reduce many nations' dependence on imported fuels."],"aGroup":["climate change","carbon dioxide emissions","potent greenhouse gas","pollution","dependence on imported fuels"],"bGroup":["enhancing energy efficiency","putting waste products to use","sustainable direction","alleviate climate change","benefits human health","support rural economies"],"answers":["sustainable direction","accelerated climate change","increased fossil fuel dependence","geographical centralization","environmental degradation"]},
{"id":"27ST_E_22_03","difficulty":"높음","title":"생태계 핵심종 코끼리에 대한 인간 간섭의 파괴적 결과","abstract":"Human interventions that restrict the natural behaviors of elephants, a keystone species, can devastatingly disrupt the diversity and health of the savanna ecosystem.","keyIndex":6,"sentences":["One example of human interventions modifying the character of savannas is through their effects on savanna-dwelling mammals such as elephants.","They are what is known as a 'keystone species' because they have a strong effect on many aspects of the environment in which they live.","They diversify the ecosystems which they occupy and create a mosaic of habitats by browsing, trampling, and knocking over bushes and trees.","They also spread seeds through their eating and defecating habits and maintain or create water holes by wallowing.","All these roles are beneficial to other species.","Conversely, where human interference prevents elephants from moving freely within their habitats and leads to their numbers exceeding the carrying capacity of the savanna, their effect can be environmentally disastrous.","Equally, if humans reduce elephant numbers in a particular piece of savanna, the savanna may become less diverse and less open, and its water holes may fill with mud.","This will be harmful to other species."],"aGroup":["human interventions","prevents elephants from moving freely","exceeding the carrying capacity","environmentally disastrous","reduce elephant numbers","less diverse","harmful"],"bGroup":["keystone species","diversify the ecosystems","create a mosaic of habitats","maintain or create water holes","beneficial to other species"],"answers":["environmentally disastrous","ecologically beneficial","naturally self-regulating","promoting biodiversity","stabilizing animal populations"]},
{"id":"27ST_E_23_GATE","difficulty":"높음","title":"비선형 체계 내 혼돈 시스템의 예측 불가능성","abstract":"Chaos is generated within a nonlinear system when iteration passes a certain bifurcation point, leading to unpredictable patterns from identical initial conditions.","keyIndex":8,"sentences":["A good example of chaos is the magnetic pendulum sold as an executive toy.","It has four magnets arranged in a square at the base and a pendulum that swings back and forth between them.","Release the pendulum and note the magnets that it visits, and in what order.","If the pendulum is released from the same position a second time, the pattern of movement may at first be the same but soon it will become completely different.","In fact, the pattern of its movement is chaotic.","No matter how much care is taken to start the pendulum in the same position, it will visit an entirely different set of points on the two occasions.","Chaotic systems are generated by iteration, though not all iteration leads to chaos.","In order to produce chaos, the iteration has to be within what is called a nonlinear system.","Nor are all nonlinear systems chaotic: to become so they need to be pushed beyond a certain point, called a bifurcation.","Before that point is reached they may behave in a quite orderly fashion."],"aGroup":["same position","same pattern at first","orderly fashion"],"bGroup":["completely different","chaotic","entirely different set of points","generated by iteration","nonlinear system","beyond a bifurcation"],"answers":["completely different","highly predictable","perfectly linear","easily controllable","completely identical"]},
{"id":"27ST_E_23_01","difficulty":"보통","title":"상대적 운동: 비행기 조종사와 총알의 일화","abstract":"Since all motion is relative, the momentum of an object depends entirely on its relative velocity to the observer, making catching a bullet possible if velocities match.","keyIndex":2,"sentences":["There is one important thing to note about momentum.","Since motion is relative, only relative velocities are relevant.","In fact, when you think about it, all velocities are relative.","Thus, on the surface of the earth, we always reckon velocity with respect to the ground — the velocity of the earth itself does not matter.","There is a true story of a French pilot in World War II who stretched his hand out of his small airplane window and caught a bullet.","How is this possible?","The velocity of the bullet must have been about the same as the velocity of his plane.","This can happen, because a bullet slows down to such a velocity toward the end of its flight path due to the action of air drag.","Since only relative velocity matters, the momentum of the bullet was negligible as far as the pilot was concerned.","Thus, he would have had little problem in catching the bullet."],"aGroup":["absolute velocity","velocity of the earth itself"],"bGroup":["motion is relative","relative velocities are relevant","momentum of the bullet was negligible"],"answers":["relative velocities","absolute mass","constant acceleration","universal gravity","fixed reference points"]},
{"id":"27ST_E_23_02","difficulty":"보통","title":"고대 천문학자 히파르코스의 정밀한 천문 관측과 업적","abstract":"Hipparchus, a prominent Hellenistic astronomer, significantly advanced astronomy through precise measurements, extensive star cataloging, and developing the eccentric model.","keyIndex":1,"sentences":["Hipparchus of Nicaea was the most important astronomer of the Hellenistic Age after Aristarchus of Samos.","Unlike Aristarchus, Hipparchus believed in the geocentric universe of Aristotle.","A noted mathematician, Hipparchus gauged the movement of the sun and the moon using an astronomical model devised by Apollonius of Perga.","Hipparchus worked at Alexandria and Rhodes; at the latter city, he created a kind of astronomical research center in which he cataloged the stars according to brightness.","He produced a star chart of about 850 stars, tracking their movements and relative brightness.","Hipparchus made more accurate measurements than Aristarchus did of the distance of the moon and sun from the earth.","To account for the orbit of the sun around the earth he developed the idea of the eccentric, which Ptolemy of Alexandria would expand upon."],"aGroup":["Aristarchus's heliocentric universe","earlier imprecise measurements"],"bGroup":["gauged the movement","cataloged the stars","star chart","more accurate measurements","developed the idea of the eccentric"],"answers":["accurate measurements","vague estimations","philosophical speculations","mythological interpretations","unverified assumptions"]},
{"id":"27ST_E_23_03","difficulty":"높음","title":"분자 분석 기술을 통한 미생물 생태계의 재발견","abstract":"Advanced molecular analysis has revealed that microorganisms constitute the vast majority of Earth's biomass, correcting our biased, land-animal-centric view of life.","keyIndex":6,"sentences":["Living things are not confined to the familiar temperate realm of land, water, and sunlight inhabited by plants and plant-eating animals.","They can be found in the darkest depths of the ocean, in hot volcanic mud, in pools beneath the frozen surface of the Antarctic, and buried kilometers deep in the Earth's crust.","The creatures that live in these extreme environments are generally unfamiliar, not only because they are inaccessible, but also because they are mostly microscopic.","In more homely habitats, too, most organisms are too small for us to see without special equipment: they tend to go unnoticed, unless they cause a disease or rot the timbers of our houses.","Yet microorganisms make up most of the total mass of living matter on our planet.","Only recently, through new methods of molecular analysis and specifically through the analysis of DNA sequences, have we begun to get a picture of life on Earth that is not grossly distorted by our biased perspective as large animals living on dry land."],"aGroup":["familiar temperate realm","unnoticed","grossly distorted by our biased perspective","large animals living on dry land"],"bGroup":["extreme environments","mostly microscopic","most of the total mass","new methods of molecular analysis","true picture of life on Earth"],"answers":["biased perspective","objective observation","comprehensive understanding","microscopic focus","advanced technological viewpoint"]},
{"id":"ABSO_TYPE_07_20","difficulty":"보통","title":"타인의 조언에 대한 경계와 자기 내면의 목소리 경청","abstract":"Instead of blindly accepting others' advice which might stem from selfish intentions, you should be wary of unqualified advisors and listen to your own inner voice.","keyIndex":6,"sentences":["Most people love to give advice and will jump at any opportunity to do so.","Some have good intentions, while others seek to gain something by guiding you toward the goals they deem important.","Be honest with yourself, seek no advice from those who are not worthy to give it, even if they happen to be friends, and be especially wary of anyone who is envious of you.","The corrupt feelings within them will affect the counsel they give and likely lead you down a path of destruction.","Associate with those who are like yourself and those who will stand by you every step of the way.","Moreover, listen to your own heart and counsel, for there is no one that you can depend on more than yourself.","Your spirit can reveal your situation, and it can help you get through it."],"aGroup":["guiding you toward the goals they deem important","not worthy to give it","envious of you","corrupt feelings"],"bGroup":["honest with yourself","own heart and counsel","your spirit","depend on more than yourself"],"answers":["listen to yourself","blindly accept advice","seek external validation","ignore personal intuition","follow corrupt counsel"]},
{"id":"ABSO_TYPE_07_21","difficulty":"높음","title":"비행 방향에 따른 시차증의 심각성 차이","abstract":"Jet lag, caused by long-distance air travel, is significantly more severe when flying east due to an advanced sleep cycle compared to flying west.","keyIndex":2,"sentences":["Jet lag is a temporary physical condition characterized by sleepiness, insomnia, bad moods, and physical weakness.","It's caused by long-distance air travel across time zones, and its severity varies according to one factor in particular: jet lag hits hardest if you fly east rather than west.","Ask anybody who regularly does a London-New York round trip.","They will tell you that they feel totally exhausted for at least three days after arriving in London, but have no problems at all when they arrive in New York.","They say that flying west is like shifting to weekend time, when you stay out late and wake up to a late brunch.","But going east is like going to bed six hours too early and being awakened in the middle of the night."],"aGroup":["fly east","arriving in London","hits hardest","exhausted for at least three days","going to bed six hours too early"],"bGroup":["fly west","arrive in New York","have no problems at all","shifting to weekend time"],"answers":["flying east severity","flying west difficulty","preventing jet lag","adapting to destinations","overcoming physical weakness"]},
{"id":"ABSO_TYPE_07_22","difficulty":"보통","title":"이성적 사고를 통한 원초적 감정 충동의 통제","abstract":"Through the evolutionary development of rational thinking abilities, humans can control their primitive emotional urges and make reasonable choices.","keyIndex":5,"sentences":["Our emotionally driven urges to behave come from a very primitive part of the human brain.","Those urges are not always in our best interests.","Even though we feel like hitting someone during a peak moment of anger, for example, it's not a good idea.","Similarly, even though we feel like running offstage when we're afraid to give a speech, that's usually not a good idea, either.","Fortunately, there's another major player inside us — our ability to think.","As human beings evolved, the primitive parts of their brain were overlaid with new regions of gray matter.","These regions are devoted to making decisions, solving problems, and creating new options.","This enhanced brainpower means that we don't always have to believe the first thoughts that pop into our head.","Nor do we have to act on the first urges that we feel.","We can weigh the benefits and costs first.","Even in moments of distress, we have the power to choose."],"aGroup":["emotionally driven urges","primitive part","first thoughts that pop into our head","first urges"],"bGroup":["ability to think","regions of gray matter","enhanced brainpower","weigh the benefits and costs","power to choose"],"answers":["power to choose","blind emotional reaction","primitive brain dominance","acting on impulse","unavoidable distress response"]},
{"id":"ABSO_TYPE_07_23","difficulty":"높음","title":"성공적인 기업 리더의 진정한 특성","abstract":"Contrary to the common myth of charismatic extroverts, successful business leaders actually possess traits like attention to detail, persistence, humility, and discipline.","keyIndex":7,"sentences":["We can all think of charismatic business leaders who lead like heroes on horseback.","Extroversion, agreeableness, and openness to new experience are easily regarded as critical traits of successful leaders.","But most business leaders are not of that sort.","In 2009, a study called \"Which CEO Characteristics and Abilities Matter?\" was completed.","The researchers relied on detailed personality assessments of 316 CEOs and measured their companies' performances.","There is no one personality style that leads to corporate or any other kind of success.","But they found that the traits that correlated most powerfully with success were attention to detail, persistence, efficiency, analytical thoroughness, and the ability to work long hours.","This is consistent with Jim Collins' 2001 study Good to Great.","He found many of the best CEOs flamboyant visionaries.","They were humble, self-effacing, diligent, and resolute souls who found one thing they were really good at and did it over and over again.","They did not spend a lot of time on internal motivational campaigns.","They demanded discipline and efficiency."],"aGroup":["charismatic","heroes on horseback","Extroversion","agreeableness","openness","flamboyant visionaries"],"bGroup":["attention to detail","persistence","efficiency","humble","self-effacing","diligent","resolute","discipline"],"answers":["demand for discipline","charismatic heroic leadership","extroverted personality trait","superficial motivational campaign","glamorous visionary style"]},
{"id":"ABSO_TYPE_07_24","difficulty":"높음","title":"뉘른베르크 전범 재판의 창의적 법적 해결책","abstract":"During the Nuremberg trials, prosecutors devised a creative legal solution of criminal conspiracy to hold Nazi defendants accountable despite the absence of explicit prior laws.","keyIndex":5,"sentences":["A major issue of post-war trials is whether it's reasonable for prosecutors to hold defendants responsible for acts that were not prohibited at the time they were committed.","Many of the Nazi defendants at the Nuremberg trials after World War II, for example, argued that no existing laws or international standards banned their conduct during the war.","Consequently, they argued, there can be no legal basis for prosecuting them.","Such claims are based on a fundamental precept of the rule of law: no crime, no punishment without a legal prohibition.","To counter these arguments at Nuremberg, prosecutors strained to find sources in existing international law that did forbid aggressive war but they couldn't, so they moved to associate many of the other crimes of which the Nazis were accused with the start of such war.","The prosecution also had difficulty looking for a legal doctrine that would allow them to convict a large group of people for belonging to the Nazi war machine.","Here, too, a creative solution was found: the Nazis would be tried as part of a criminal conspiracy."],"aGroup":["acts that were not prohibited at the time","no existing laws","no legal basis","no crime","no punishment without a legal prohibition"],"bGroup":["counter these arguments","associate many of the other crimes","looking for a legal doctrine","creative solution","criminal conspiracy"],"answers":["creative legal solution","strict existing laws","lack of prosecution","ignoring international standards","absolute legal prohibition"]},
{"id":"27ST_E_24_GATE","difficulty":"보통","title":"낚시 포기 직전의 극적인 반전과 환희","abstract":"The thrilling joy of catching a huge fish right at the moment of giving up.","keyIndex":9,"sentences":["The shoreline was known for having the best fishing spots on the lake.","Jessie was sitting at one of those spots, but her fishing line still hadn't moved an inch.","With a deep sigh, Jessie pulled out the line and cast it back into the water.","Her dream of catching a big fish was fading.","'I can't believe I haven't caught a fish yet. Not a single one,' she thought.","Just as she was about to give up and leave, the fishing line suddenly became tense.","Jessie excitedly held onto the fishing pole as it began to move around wildly.","Her eyes widened and her heart began to beat faster with excitement.","With a big smile, she could feel that this was the biggest fish she had ever caught!"],"aGroup":["hadn't moved an inch","deep sigh","fading","about to give up"],"bGroup":["became tense","excitedly held onto","beat faster","biggest fish"],"answers":["thrilling fishing success","boring lake trip","fading childhood dream","peaceful nature walk","dangerous boat ride"]},
{"id":"27ST_E_24_01","difficulty":"높음","title":"일상과 체험 중심으로 확장되는 현대 문화 관광","abstract":"Modern cultural tourism has expanded from observing heritage sites to experiencing everyday culture and authentic ways of life.","keyIndex":4,"sentences":["Today's cultural tourist is just as likely to be in search of 'popular', 'everyday' or 'street' culture as they are likely to visit a heritage site or a museum.","The museum seems to have lost its dominant role as a factory of meaning in (post)modern society, so cultural tourists have gone in search of meaning elsewhere.","The predominant direction of expansion has been into 'everyday life'.","Cultural tourism is as much based on experiencing as it is on seeing; therefore, Raymond Williams' definitions of culture as a whole way of life as well as the arts and learning are particularly relevant here.","Past definitions of cultural tourism have placed too much emphasis on cultural tourism as a form of arts or heritage tourism in its narrowest sense; for example, visiting museums, monuments, galleries and theatres.","Cultural tourists are also interested in the more experiential aspects of culture.","In an international context, particularly in the context of indigenous or ethnic tourism, the way of life of a people can be a central focus, where the traveller is motivated primarily by first-hand, authentic or intimate contact with people whose ethnic or cultural background is different from their own."],"aGroup":["heritage site or a museum","seeing","narrowest sense"],"bGroup":["everyday culture","experiencing","whole way of life","authentic contact"],"answers":["experiencing everyday culture","preserving narrow heritage","seeing traditional arts","losing cultural meaning","avoiding ethnic contact"]},
{"id":"27ST_E_24_02","difficulty":"보통","title":"철저히 수치에 기반하는 스포츠의 순위 매기기","abstract":"Despite people's dislike of math, standardized rankings and evaluations in sports heavily rely on objective numbers and figures.","keyIndex":1,"sentences":["Although many U.S. Americans consider mathematics boring and tedious, all forms of standardized rankings involve figures and numbers.","When ranking quarterbacks, for instance, the NFL (National Football League) standardizes the ranking process by defining different numerical categories that cover all aspects of the position.","Each quarterback has certain numbers and figures, ranging from 'percentage of pass completions' to 'interceptions over touchdowns' to 'number of yards passed per game.'","The quarterback's livelihood depends on those numbers.","To negotiate a raise, a quarterback has to improve his numbers, and when a quarterback is benched, it is often due to unsatisfactory numbers.","Similarly, at least 13 million Americans belong to virtual football leagues in which participants select players from different professional teams; at the end of the season, the participant whose virtual team has amassed the most points, defined by each virtual league differently, wins the jackpot.","Such leagues even have a draft at the beginning of the season."],"aGroup":["boring and tedious"],"bGroup":["standardized rankings","numerical categories","numbers and figures","points"],"answers":["standardized numerical rankings","boring mathematical theories","emotional player evaluations","subjective drafting process","unpredictable game results"]},
{"id":"27ST_E_25_GATE","difficulty":"높음","title":"수업 토론 중 노트 필기의 중요성과 유용성","abstract":"Although taking notes during discussions is challenging, it is crucial for keeping students active, organizing thoughts, and preparing to speak.","keyIndex":10,"sentences":["The purpose of class discussions is to encourage you to be an active participant, not a passive recorder.","Much of the emphasis in a discussion is on getting students involved in thinking, reacting, and responding.","These are important intellectual activities in the learning process, for through them you are supposed to discover and express your opinions.","Writing is an invaluable tool for accomplishing these tasks.","Unfortunately, too many times, when class discussion begins, pens and pencils go down.","Admittedly, it is considerably more difficult to take notes from discussions than from lectures, for, unlike lectures, discussions tend to be disorganized and difficult to follow.","Also, students usually don't know how much of what other students are saying is important.","And if you are an active participant, it is not easy to take notes and formulate what you want to say.","But note taking in discussions is not only manageable, it is also important.","Note taking helps to keep you active and alert; it allows you to impose some organization on the discussion; and it can prepare you to speak."],"aGroup":["pens and pencils go down","disorganized","difficult to follow","not easy to take notes"],"bGroup":["invaluable tool","manageable","keep you active","impose some organization","prepare you to speak"],"answers":["importance of note-taking","passive lecture recording","discovering personal opinions","disorganized class discussions","reducing student participation"]},
{"id":"27ST_E_25_01","difficulty":"높음","title":"교육을 위한 내적 및 외적 통제의 필수성","abstract":"Effective teaching and learning require both teachers and students to submit to external and internal control to overcome disorder.","keyIndex":6,"sentences":["Teaching reflects what society itself demands; it necessitates that disorder — of students and teachers alike, of mind, behavior, and environment — yield to its opposite.","Effective teaching requires that, failing their own self-imposed order, students experience the imposition of some outer order so that inner order may develop.","This means in practice, for instance, that the goals of classes and courses be clearly set, that they be explained and justified, that the manner of achieving them be clear, that the presentation of materials conducive to reaching them be appropriate, and that all activities be directed somehow to their attainment.","It means, too, that students take up their own obligation to maintain the conditions under which learning occurs: quiet in their classrooms, respect for and courtesy toward others, civility of language and behavior, and the like.","Above all, it implies structured industry — study and activity that are oriented toward a goal and pursued with perseverance and method.","That is, good teaching requires that teachers and students subject themselves to external and internal control so that learning can take place."],"aGroup":["disorder","failing self-imposed order"],"bGroup":["outer order","inner order","clearly set","structured industry","external and internal control"],"answers":["internal and external control","free student expression","societal educational demands","unstructured classroom environment","avoiding outer order"]},
{"id":"27ST_E_25_02","difficulty":"높음","title":"부정적 언어가 아이들의 뇌에 미치는 강력한 악영향","abstract":"Negative words trigger a powerful stress response in children's brains, outweighing the emotional regulation effects of positive words.","keyIndex":5,"sentences":["When we lecture, scold, yell, or criticize, when we say something positive but in a sarcastic tone, or when we try to make our kids feel guilty, it activates their amygdala, triggering their stress response and putting them into a defensive, rigid, reactive state.","Even more basic, when we say no or don't, it releases stress chemicals in our kids' brains (and in ours) that are associated with fear and anger.","Functional brain imaging research has shown that even seeing the word no on a screen for less than a second while you're lying in an MRI scanner will cause your brain to suddenly release dozens of stress-producing hormones and neurotransmitters.","Conversely, positive words like yes, love, and peace activate systems in the prefrontal cortex that are related to emotional regulation.","The problem is that negative words like no and don't have a more powerful effect on kids than positive words.","For this reason, the researchers Suniya Luthar and John Gottman say that 'bad is stronger than good' when it comes to communicating with children and teens."],"aGroup":["scold","criticize","no","don't","stress response","defensive","rigid","stress-producing hormones"],"bGroup":["yes","love","peace","prefrontal cortex","emotional regulation"],"answers":["powerful negative effects","emotional brain regulation","positive communication skills","ignoring parental guidance","overcoming stress hormones"]},
{"id":"27ST_E_25_03","difficulty":"높음","title":"자의식과 명시적 자각이 유발하는 자동화된 수행의 저하","abstract":"The return of explicit awareness and self-consciousness can jeopardize the automatization of consciously learned skills.","keyIndex":5,"sentences":["The experiences of learning to ride a bicycle or drive a car illustrate well how the 'what' and 'how' systems — those involved in object identification and practical action — might interact during development.","When we learn to drive a car, we go through a first stage where each required action and sequence of actions — such as looking in the mirror, signaling with the blinker, pressing the clutch prior to shifting into gear, and so forth — are explicitly thought of and double-checked while monitoring our situation in the environment.","Once learned and after a few hours of practice, the required actions for driving become second nature, transferable to almost any vehicle and performed without explicit thinking.","Information appears to be perceived directly; the affordances of the road, the car, and the traffic implicitly detected.","Actually, this sort of automatization of conscious learning can be jeopardized by the return of explicit awareness.","If you start to think too much about your driving, you actually increase your chances of having an accident.","People in sport competitions confirm that self-consciousness is one's worst enemy: tennis, golf, or billiard players commonly report that they lose their 'touch' by thinking too much about their moves."],"aGroup":["explicitly thought of","explicit awareness","think too much","self-consciousness"],"bGroup":["second nature","without explicit thinking","implicitly detected","automatization"],"answers":["danger of explicit awareness","safe driving techniques","initial learning stages","mastering sports skills","interacting cognitive systems"]},
{"id":"27ST_E_26_GATE","difficulty":"높음","title":"순수문학과 장르문학의 캐릭터 재등장 및 변화 양상","abstract":"Unlike literary fiction, genre fiction and comics often feature characters reappearing over decades, leading to significant changes in their traits when handled by multiple authors.","keyIndex":8,"sentences":["In most fiction, characters' lives are limited to the individual work.","Readers may disagree on the characteristics and traits of fictional figures, and in drama there is room for different interpretations of characters.","However, it is less common for characters in literary fiction to reappear in subsequent works than in genre fiction, where series featuring the same central characters are common.","This is even more pronounced in comics, which are typically serialized in newspaper strips or comic books.","Thus characters introduced in the 1930s, like Superman and Batman, may still enjoy new adventures decades later.","During these characters' long histories, they change in various ways for a variety of reasons.","If a character is created by a single author, like Sherlock Holmes, the character's core traits may change little from story to story, but readers learn more about him with each successive story.","On the other hand, if characters are the work of several hands over decades, they may change considerably."],"aGroup":["limited to the individual work","less common to reappear"],"bGroup":["series featuring the same central characters","serialized","enjoy new adventures decades later","change in various ways"],"answers":["reappearing character traits","single limited narrative","fixed personality core","individual work boundary","consistent author vision"]},
{"id":"27ST_E_26_01","difficulty":"보통","title":"작품 감상에 영향을 미치는 일상적 맥락과 전시장의 고립성","abstract":"Artworks situated in everyday contexts connect with the real world to enrich the viewing experience, whereas those displayed in exhibitions appear isolated.","keyIndex":7,"sentences":["In the context of a studio visit, the viewer might notice several clipped newspaper articles pinned to the wall, a wax-coated hotplate, walls with paint marks, resin-drizzled floors and several sculptures barely visible through their plastic wrap.","Such real-world clues offer the visitor a foothold onto the artist's oeuvre.","The studio visitor imagines that the artist is currently a painter, who applies wax and resin and finds inspiration in particular articles.","Similarly, guests experiencing artworks in some homes notice art positioned next to furnishings, family photographs displayed on the piano and coffee-table books stacked to demonstrate preferences.","Together, these components affect particular experiences.","Within the artist's studio or collector's home, residue from studio activities or the collector's personal belongings help to connect the artworks to the world.","By contrast, artworks displayed in exhibitions feel comparatively isolated, practically clipped from the world where they originated.","This could explain why aestheticians tend to treat artworks as singletons, rather than as members of some set."],"aGroup":["isolated","practically clipped from the world where they originated","singletons"],"bGroup":["real-world clues","residue from studio activities","connect the artworks to the world"],"answers":["contextual art connection","strict museum regulation","universal aesthetic value","subjective emotional response","pure formal analysis"]},
{"id":"27ST_E_26_02","difficulty":"높음","title":"문화적 배경에 따른 신호 해석의 상대성과 의도성","abstract":"While linguists classify signals based on intentionality, differing cultural conventions can cause unintentional behavior to be interpreted as deliberate communication or vice versa.","keyIndex":5,"sentences":["Linguists typically distinguish between signals that are communicative and those that are informative, depending on whether the information is conveyed intentionally or not.","For example, a deliberate wink is distinguished from an involuntary blink by the communicative intention that lies behind it.","Yet in intercultural interaction, information conveyed unintentionally may actually be interpreted as intentional; for instance, in some cultures, showing the soles of one's shoes can communicate an insult and when somebody does that, it is typically assumed to have communicative intent.","However, for someone from a cultural group where that convention does not exist, such behaviour would be unintentional and hence would not be communicative.","In other words, a given piece of behaviour may be communicative to some of the participants and only informative to others."],"aGroup":["informative","unintentionally","involuntary","unintentional and hence would not be communicative"],"bGroup":["conveyed intentionally","deliberate","communicative intention","interpreted as intentional","assumed to have communicative intent"],"answers":["relative cultural interpretation","universal body language","intentional linguistic rules","strict social convention","deliberate nonverbal signal"]},
{"id":"27ST_E_26_03","difficulty":"보통","title":"서사 몰입이 뇌에 미치는 긍정적 영향과 공감 능력 배양","abstract":"Processing narratives universally activates brain patterns that stimulate psychological engagement with subjective experiences, significantly increasing empathy and cooperative behavior in real life.","keyIndex":3,"sentences":["Through stories we can explore the human condition and see how other people think.","This can affirm our own beliefs and perceptions, but it also challenges them.","Regardless of the language, there is something universal about what occurs in the brain at the point when we are processing narratives, triggering better self-awareness and empathy for others.","Psychologists scanned people listening to narratives in English, Farsi, and Mandarin, and found the same patterns of brain activation when people found meaning in the stories.","Other studies find that reading fiction significantly increases empathy toward others, including people of a different race or religion.","And the more absorbed in a story a reader is, the more empathetically they behave in real life.","For instance, if the researcher \"accidentally\" dropped his pens, those participants who had previously reported being \"highly absorbed\" in the story were about twice as likely to help pick up the pens.","Another study concluded that literary fiction \"uniquely engages the psychological processes needed to gain access to characters' subjective experiences.\"","That is to say, if you read novels, you can probably read emotions, vital skills for forming cooperative societies."],"aGroup":["processing narratives","reading fiction","absorbed in a story"],"bGroup":["empathy for others","increases empathy","behave empathetically","help pick up the pens","read emotions","vital skills for forming cooperative societies"],"answers":["narrative driven empathy","objective logical reasoning","universal linguistic structure","accurate memory retention","rapid information processing"]},
{"id":"27ST_E_27_GATE","difficulty":"높음","title":"정보와 의미의 본질적 차이 및 해석의 중추성","abstract":"Information represents uninterpreted, measurable data, whereas meaning encapsulates the nuanced interpretation of that data, which forms the core of all human cognition and emotion.","keyIndex":1,"sentences":["Information and meaning are, clearly, not the same thing.","The former refers to uninterpreted data or sensory states whose probability in a certain situation can be easily measured; the latter refers to the interpretation of the data or sensory states, including the special kinds of nuances and values that the information entails, or is intended to have, in the given situation.","This applies to any type of information, from alarm signals to sophisticated statements.","Take, for instance, a coin-tossing game in which it is decided that throwing three heads in a row constitutes a win.","If a certain player ends up consistently with the desired outcome, defeating all who challenge that player, then we tend to interpret the outcome either as the work of Fortune, or else as clever and undetectable cheating on the part of the winning player.","Interpretation is at the core of everything we do, think about, and feel."],"aGroup":["uninterpreted data or sensory states","probability can be easily measured","the desired outcome"],"bGroup":["interpretation of the data","nuances and values","interpret the outcome","at the core of everything"],"answers":["subjective human interpretation","objective data measurement","universal statistical probability","accurate sensory state","unbiased logical deduction"]},
{"id":"27ST_E_27_01","difficulty":"보통","title":"새로운 온라인 사회운동의 특성과 지배 권력 도전의 한계","abstract":"Although digital politics and smartphones have facilitated fluid and leaderless online activism, these new social movements ultimately show limitations in challenging dominant state powers.","keyIndex":7,"sentences":["Over the past twenty years, with the arrival of digital politics, social and political protest movements have changed and become ever more prominent through what the sociologist Manuel Castells has called Networks of Outrage and Hope.","We now have a swirling world of 'online activism', digital rebellion, information politics and People's Platforms.","Smartphones and social networking now provide a more fluid, leaderless, participatory activism that arises more spontaneously.","The early examples like the Occupy Movement (2011), the Arab Spring in Egypt (2010), the Umbrella Movement in Hong Kong (2014, 2019), the Gezi Park Movement in Turkey (2013), and the Pussy Riots in Russia (2011) galvanized large numbers of people and attracted world attention.","While some suggest that these new politics are enhancing democracy, others maintain that they do not really challenge the dominant power groups.","Looking back, most of them have proved unsuccessful, clamped down upon by the state.","There seems a limit to the power of new social movements."],"aGroup":["do not really challenge the dominant power groups","proved unsuccessful","clamped down upon by the state","a limit to the power"],"bGroup":["digital politics","Networks of Outrage and Hope","online activism","more fluid leaderless participatory activism","galvanized large numbers of people"],"answers":["limits of digital activism","successful democratic reform","absolute state power","continuous political progress","offline traditional protest"]},
{"id":"27ST_E_27_02","difficulty":"보통","title":"자동차의 등장이 초래한 교외화와 주거-직장 분리","abstract":"The advent of automobiles enabled individuals to commute longer distances, fueling the expansion of suburbs and permanently detaching residential areas from places of employment and recreation.","keyIndex":8,"sentences":["The advent of automobiles drastically altered urban landscapes by enabling the growth of suburbs.","Cars provided individuals the ability to live farther from city centers, where land was cheaper and more abundant.","This expansion created the modern suburb, characterized by residential zones separate from commercial and industrial areas, promoting a shift from high-density urban living to the spacious suburbs.","The flexibility cars offered meant people could commute daily, uniting work, leisure, and homelife in new ways.","In response, urban planning evolved, placing emphasis on roads and highways to accommodate increased travel.","This decentralization led to altered living patterns, encouraging families to seek homes in quieter, suburban environments while maintaining access to urban job markets.","The sprawling growth fueled demands for expanded infrastructure and services in these areas, bringing in new economic opportunities.","Cars were instrumental in shaping this living model by significantly detaching home locations from places of employment and recreation."],"aGroup":["advent of automobiles","ability to live farther from city centers","flexibility cars offered","expanded infrastructure"],"bGroup":["growth of suburbs","expansion created the modern suburb","decentralization","detaching home locations from places of employment and recreation"],"answers":["automotive urban decentralization","traditional high-density living","public transit expansion","strict commercial zoning","environmental traffic impact"]},
{"id":"ABSO_TYPE_08_20","difficulty":"높음","title":"면접에서 고유한 강점(USP) 전달의 중요성","abstract":"In a job interview, it is crucial to clearly and concisely communicate your unique selling point (USP) early on to intrigue the interviewer and differentiate yourself.","keyIndex":3,"sentences":["In a job interview, the first ten seconds and the first ten words are the most important.","Dramatize the opening of your interview with a line or a catchy phrase that telegraphs your value.","It should convey your unique selling point (USP).","What are the marketable qualities or talents unique to you?","How are you different?","In the branding world, the USP is the basis of a brand's tagline or catchphrase.","It's the theme tying everything together that conveys what is different, relevant, and meaningful about the brand.","You want to do the same.","This sentence — the essence of your personal brand value — should be simple enough to fit on the back of a business card.","If it can't be stated briefly and clearly, it is probably muddled and complicated.","Your USP should dramatize a benefit and solve a problem.","And it should be distinctive enough to intrigue people and make them curious about you."],"aGroup":["the first ten seconds and the first ten words","opening of your interview","a line or a catchy phrase"],"bGroup":["unique selling point (USP)","marketable qualities or talents unique to you","essence of your personal brand value","simple enough to fit on the back of a business card"],"answers":["unique selling point","detailed academic background","lengthy self introduction","generic communication skills","complex technical knowledge"]},
{"id":"ABSO_TYPE_08_21","difficulty":"높음","title":"비전이 실행을 앞설 때 발생하는 예술가의 두려움과 성장의 원동력","abstract":"The fear and uncertainty an artist experiences when their vision exceeds their execution is not a sign of self-doubt but an essential asset for continuous learning and growth.","keyIndex":9,"sentences":["An artist's fears arise when they look back, and the fears arise when they look ahead.","If they're prone to disaster fantasies they may even find themselves caught in the middle, staring at their half-finished canvas and fearing both that they lack the ability to finish it, and that no one will understand it if they do.","More often, though, fears rise in moments when vision races ahead of execution.","Consider the story of David Bayles, who studied piano with a master.","After a few months' practice, David lamented to his teacher, \"I can hear the music so much better in my head than I can get out of my fingers.\"","To which the Master replied, \"What makes you think that ever changes?\"","That's why they're called Masters.","He knew that vision should always be ahead of execution, which is an unchangeable fact.","When he raised David's observation from an expression of self-doubt to a simple observation of reality, uncertainty became an asset.","If his vision didn't exceed his capabilities, he wouldn't be able to learn."],"aGroup":["vision races ahead of execution","hear the music so much better in my head than I can get out of my fingers","self-doubt"],"bGroup":["simple observation of reality","uncertainty became an asset","vision exceed his capabilities","able to learn"],"answers":["uncertainty became an asset","perfection in technical execution","elimination of artistic fear","absolute confidence in skills","realistic and achievable goals"]},
{"id":"ABSO_TYPE_08_22","difficulty":"보통","title":"세밀한 시간 관리법의 한계와 부작용","abstract":"Traditional time management approaches that focus on micro-scheduling fail to address root causes and instead exacerbate anxiety and time poverty.","keyIndex":6,"sentences":["Texts on time management are remarkably similar in their advice: keep a log to see where your time is \"going,\" schedule every day, establish short-term and long-term goals, organize your workspace, and learn to say \"no.\"","While the order to plan, prioritize, and organize is not wrong, it tends to exacerbate our anxiety over time poverty by always measuring it.","Dividing our time into ever smaller and precise segments is not a long-term solution.","In this sense, time management is rather like those diets which exhort us to keep a food diary, plan meals, set goals, and so on.","Although this is not incorrect, it does not sufficiently take into account the reasons we may overeat in the first place and the factors which have contributed to the \"obesity epidemic.\"","Like the dietary focus on the restriction of calories which produces deprivation, time management books tend to engender deprivation, a sense of time poverty, with less-than-desirable results."],"aGroup":["keep a log","order to plan, prioritize, and organize","dividing our time into ever smaller and precise segments"],"bGroup":["exacerbate our anxiety over time poverty","not a long-term solution","does not sufficiently take into account the reasons","engender deprivation","less-than-desirable results"],"answers":["sense of time poverty","efficient time allocation","improved work productivity","perfect daily scheduling","long-term habit formation"]},
{"id":"ABSO_TYPE_08_23","difficulty":"높음","title":"심리적 만족을 위한 불필요한 의료 소비의 폐해","abstract":"The excessive consumption of unnecessary medical care driven by patients' desire for psychological comfort leads to rising insurance costs and imposes a massive financial burden on society.","keyIndex":7,"sentences":["Patients sometimes like more medical care even if it doesn't improve their health.","Many people with medical problems like more attention and having more things done.","Maybe they feel that their problems are being taken more seriously, maybe they feel more reassured, maybe they feel more cared for, or maybe they prefer actively doing something to a \"wait and see\" approach.","For those with insurance, the response may be, \"Who cares? It's relatively harmless, and people like it.\"","Because insurance picks up the tab, it seems free.","But the rising cost of insurance — in some cases, to pay for things that don't improve health — is exactly why more and more people can't afford insurance.","And unnecessary medical care isn't always harmless.","So an important question becomes, how much are you willing to increase your insurance premiums or Medicare taxes to accommodate medical care that satisfies but doesn't improve health?"],"aGroup":["more medical care even if it doesn't improve their health","like more attention","feel more reassured","seems free"],"bGroup":["rising cost of insurance","can't afford insurance","unnecessary medical care isn't always harmless","increase your insurance premiums or Medicare taxes"],"answers":["unnecessary medical care","improvement of public health","reduction of insurance premiums","free access to treatments","wait and see approach"]},

function parseCSV(text){
  const rows=[];
  const lines=text.split('\n');
  let cur=null;
  for(let i=1;i<lines.length;i++){
    const raw=lines[i];
    if(!raw.trim())continue;
    // CSV 파싱: 쉼표로 분리하되 따옴표 안 쉼표 무시
    const cols=[];let c='',inQ=false;
    for(let k=0;k<raw.length;k++){
      const ch=raw[k];
      if(ch==='"'){inQ=!inQ;}
      else if(ch===','&&!inQ){cols.push(c);c='';}
      else{c+=ch;}
    }
    cols.push(c);
    const id=(cols[0]||'').trim();
    if(id&&/^[A-Z0-9_]/.test(id)&&(cols[1]||'').trim()){
      if(cur&&cur.sentences.length>0)rows.push(cur);
      cur={
        id,
        difficulty:(cols[1]||'보통').trim(),
        title:(cols[2]||'').trim(),
        abstract:(cols[3]||'').trim(),
        keyIndex:parseInt((cols[4]||'1').trim())||1,
        sentences:[],
        aGroup:(cols[6]||'').split('/').map(s=>s.trim()).filter(Boolean),
        bGroup:(cols[7]||'').split('/').map(s=>s.trim()).filter(Boolean),
        answers:(cols[8]||'').split('/').map(s=>s.trim()).filter(Boolean),
      };
      const logic=(cols[5]||'').trim();
      const parts=logic.split(/(?:^|\n)\s*\d+\.\s+/).filter(Boolean);
      parts.forEach(p=>{const t=p.trim().replace(/\n/g,' ');if(t)cur.sentences.push(t);});
    }else if(cur){
      const t=raw.trim().replace(/^\d+\.\s+/,'');
      if(t)cur.sentences.push(t);
    }
  }
  if(cur&&cur.sentences.length>0)rows.push(cur);
  return rows;
}

function detectBooks(passages){
  const map={};
  passages.forEach(p=>{
    const prefix=p.id.split('_').slice(0,-1).join('_').split('_')[0]||p.id.substring(0,4);
    if(!map[prefix])map[prefix]=true;
  });
  return Object.keys(map).map(pre=>({
    id:pre,
    label:BOOK_LABELS[pre]||pre,
    match:id=>id.startsWith(pre)
  }));
}
