<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>수능 직전 워밍업 모의고사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@400;600;700&display=swap">
<style>
/* 레이아웃: 수능 문제지처럼 A4 한 장에 2단, 가운데 세로줄. 문항은 스크립트가 단 높이를 재며 채운다 */
:root{
  --desk:#e6e8eb; --paper:#fff; --ink:#111; --muted:#555; --rule:#222; --thin:#999;
  --ans:#c0262d; --ui:#24557f; --ui-soft:#e7eef6;
  --f-en:"Times New Roman","Noto Serif KR",Georgia,serif;
  --f-ko:"Noto Serif KR","Batang","AppleMyungjo",serif;
  --f-go:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--f-go);padding:14px 16px 40px}
/* 조작 막대 */
.bar{max-width:210mm;margin:0 auto 10px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.bar h1{font-size:18px;margin:0 auto 0 0;font-weight:700}
.chip{font:inherit;font-size:13px;border:1px solid var(--thin);background:#fff;color:var(--ink);padding:6px 14px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ui);border-color:var(--ui);color:#fff}
.chip.prt{border-color:var(--ui);color:var(--ui);font-weight:700}
.chip:focus-visible{outline:2px solid var(--ui);outline-offset:2px}
.hint{max-width:210mm;margin:0 auto 12px;color:var(--muted);font-size:12.5px;line-height:1.6}
.scroller{overflow-x:auto}

/* 쪽 */
.page{width:210mm;height:297mm;margin:0 auto 16px;background:var(--paper);box-shadow:0 1px 4px rgba(0,0,0,.18);
  padding:11mm 12mm 9mm;display:flex;flex-direction:column;position:relative}
.ph{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:2.2px solid var(--rule);padding-bottom:2.5mm;margin-bottom:1mm}
.ph .pn{font-family:var(--f-en);font-size:26pt;font-weight:700;line-height:1;min-width:16mm}
.ph .pn.r{text-align:right}
.ph .sub{font-family:var(--f-go);font-size:17pt;font-weight:900;letter-spacing:.35em;text-align:center;flex:1}
.ph2{border-bottom:.6px solid var(--rule);margin-bottom:3mm}
.first .ph{flex-direction:column;align-items:stretch;border-bottom:none;padding-bottom:0}
.cover-top{display:flex;justify-content:space-between;align-items:flex-start;font-size:9pt;color:var(--muted)}
.cover-title{text-align:center;font-family:var(--f-ko);font-size:13pt;font-weight:700;margin:1mm 0 1.5mm}
.cover-sub{display:flex;align-items:center;justify-content:center;gap:6mm}
.cover-sub .pn{font-family:var(--f-en);font-size:28pt;font-weight:700}
.cover-sub .area{font-family:var(--f-go);font-size:24pt;font-weight:900;letter-spacing:.3em;border:2.2px solid var(--rule);padding:1mm 7mm 1.5mm}
.cover-sub .gr{font-size:10pt;border:1.2px solid var(--rule);padding:1mm 3mm}
.idrow{display:flex;justify-content:flex-end;gap:6mm;font-size:9.5pt;margin:2mm 0 1.5mm}
.idrow span{display:inline-block;border-bottom:1px solid var(--ink);min-width:32mm}
.cover-rule{border-top:2.2px solid var(--rule);border-bottom:.6px solid var(--rule);height:1.6mm;margin-bottom:2.5mm}
.guide{font-size:9pt;line-height:1.5;border:1px solid var(--thin);padding:1.6mm 3mm;margin-bottom:3mm}

.cols{flex:1;display:grid;grid-template-columns:1fr 1fr;column-gap:8mm;position:relative;min-height:0}
.cols::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:.7px solid var(--rule)}
.col{overflow:hidden;min-width:0;height:100%}
.pf{font-size:7.6pt;color:var(--muted);text-align:center;border-top:.6px solid var(--thin);padding-top:1.5mm;margin-top:2mm;line-height:1.4}

/* 문항 */
.blk{margin:0 0 3.2mm}
.qp{font-family:var(--f-go);font-size:9.6pt;line-height:1.5;margin-bottom:1.6mm;text-indent:-5.2mm;padding-left:5.2mm}
.qp b.num{font-family:var(--f-en);font-size:11pt;font-weight:700;margin-right:1.2mm}
.qp .p3{font-weight:700}
.qp u{text-underline-offset:2px}
.src{display:none;font-size:7.5pt;color:var(--muted);font-weight:400;margin-left:1mm}
.teacher .src{display:inline}
.tx{font-family:var(--f-en);font-size:10pt;line-height:1.5;text-align:justify;text-indent:3.5mm;margin:0 0 1.2mm;hyphens:auto}
.tx.first{text-indent:0}
.tx.first b.num{font-size:11pt;margin-right:1mm}
.qp.srconly{margin:0}
.student .qp.srconly{display:none}
.qp.ghead{text-indent:0;padding-left:0;font-weight:500}
.tx.lab{text-indent:0;text-align:center;margin:1mm 0 .6mm}
.tx.lab u{text-decoration:none}
.bx{font-family:var(--f-en);font-size:10pt;line-height:1.5;text-align:justify;border:.8px solid var(--ink);padding:1.6mm 2.4mm;margin:0 0 1.6mm}
.bx.plain{border:none;padding:0;text-indent:3.5mm}
.ft{font-size:8pt;text-align:right;margin:0 0 1.2mm;font-family:var(--f-ko);white-space:pre-wrap}
.bl{display:inline-block;min-width:30mm;border-bottom:.9px solid var(--ink);margin:0 1mm}
.arrow{display:block;text-align:center;font-size:12pt}
.tx .arrow{text-indent:0}
img.fig{display:block;width:100%;margin:0 0 1.6mm}
.nb{border:.8px solid var(--ink);padding:2mm 3mm;font-family:var(--f-en);font-size:9.6pt;line-height:1.45;margin:0 0 1.6mm}
.nb .nt{text-align:center;font-weight:700;font-size:11pt;margin-bottom:1.2mm}
.nb p{margin:0 0 1mm}
.nb .nh{font-weight:700;margin-bottom:.4mm}
ol.ch{list-style:none;margin:1mm 0 0;padding:0;font-size:9.8pt;line-height:1.5}
ol.ch li{display:flex;gap:1.4mm;padding:.3mm 0;font-family:var(--f-en)}
ol.ch li.ko{font-family:var(--f-ko);font-size:9.5pt}
ol.ch li .m{flex:0 0 auto;width:4.6mm;font-family:var(--f-ko)}
ol.ch.inl{display:flex;justify-content:space-around;padding:0 4mm}
ol.ch.sum li span.a,ol.ch.sum li span.b{display:inline-block;width:30mm}
ol.ch.sum .hd{font-family:var(--f-en);padding-left:6mm}
.teacher ol.ch li.ok{color:var(--ans);font-weight:700}
.teacher ol.ch li.ok .m{position:relative}
.teacher ol.ch li.ok .m::after{content:"";position:absolute;left:-.9mm;top:-.2mm;width:4.4mm;height:4.4mm;border:1.4px solid var(--ans);border-radius:50%}

/* 해설 */
.key{width:100%;border-collapse:collapse;font-size:8.6pt;margin-bottom:3mm}
.key th,.key td{border:.6px solid var(--thin);padding:.8mm 1mm;text-align:center}
.key th{background:#f1f1f1;font-weight:700}
.key td.a{color:var(--ans);font-weight:700;font-size:10pt}
.ex{font-size:8.8pt;line-height:1.55;font-family:var(--f-go);margin:0 0 2.6mm}
.ex .eh{font-weight:700;margin-bottom:.6mm}
.ex .eh .a{color:var(--ans)}
.ex .eh .s{font-weight:400;color:var(--muted);font-size:7.8pt;margin-left:1mm}
.sech{font-family:var(--f-go);font-weight:900;font-size:11pt;margin:0 0 2.4mm;border-bottom:1px solid var(--ink);padding-bottom:.8mm}
.endnote{font-family:var(--f-go);font-size:9pt;border:1px solid var(--ink);padding:1.6mm 3mm;margin-top:2mm}

@media print{
  @page{size:A4;margin:0}
  body{background:#fff;padding:0}
  .bar,.hint{display:none}
  .scroller{overflow:visible}
  .page{margin:0;box-shadow:none;break-after:page}
  .teacher ol.ch li.ok{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="bar">
  <h1>수능 직전 워밍업 모의고사</h1>
  <div role="group" aria-label="보기 방식" style="display:flex;gap:4px">
    <button class="chip" id="mSt" type="button">학생용 (문제지)</button>
    <button class="chip" id="mTe" type="button">교사용 (정답·해설)</button>
  </div>
  <button class="chip prt" id="btnPrint" type="button" hidden>인쇄</button>
</div>
<p class="hint">독해 18~45번 28문항(63점)을 수능 문제지처럼 A4 2단으로 배치했습니다. 학생용은 문제만, 교사용은 정답에 빨간 동그라미가 표시되고 마지막에 정답표와 해설이 붙습니다. 인쇄는 인쇄 버튼(또는 Ctrl/⌘+P)을 누르면 한 쪽씩 A4로 나옵니다.</p>

<script>
const ITEMS = [{"n": 18, "pts": 2, "kind": "글의 목적", "src": "2021학년도 수능 18번", "prompt": "다음 글의 목적으로 가장 적절한 것은?", "body": ["<div class=\"tx\">Dear Friends,<br/>Season’s greetings. As some of you already know, we are starting the campus food drive. This is how you participate. You can bring your items for donation to our booths. Our donation booths are located in the lobbies of the campus libraries. Just drop off the items there during usual library hours from December 4 to 23. The donated food should be non-perishable like canned meats and canned fruits. Packaged goods such as jam and peanut butter are also good. We will distribute the food to our neighbors on Christmas Eve. We truly appreciate your help.<br/><br/>Many blessings,<br/>Joanna at Campus Food Bank<\/div>"], "choices": ["음식 기부에 참여하는 방법을 안내하려고", "음식 배달 자원봉사 참여에 감사하려고", "도서관 이용 시간 변경을 공지하려고", "음식물 낭비의 심각성을 알려 주려고", "크리스마스 행사 일정을 문의하려고"], "inline": false, "ans": "①", "sol": "기부 물품을 '어디에(도서관 로비 부스) / 언제(12월 4~23일, 도서관 운영시간) / 무엇을(통조림·잼 등 상하지 않는 식품)' 가져오면 되는지가 글의 중심. This is how you participate 뒤로 방법이 나열되므로 ① 안내 목적. 감사·공지·문의가 아니라 '참여 방법 안내'."}, {"n": 19, "pts": 2, "kind": "심경 변화", "src": "2022학년도 수능 19번", "prompt": "다음 글에 나타난 Evelyn의 심경 변화로 가장 적절한 것은?", "body": ["<div class=\"tx\">It was Evelyn’s first time to explore the Badlands of Alberta, famous across Canada for its numerous dinosaur fossils. As a young amateur bone-hunter, she was overflowing with anticipation. She had not travelled this far for the bones of common dinosaur species. Her life-long dream to find rare fossils of dinosaurs was about to come true. She began eagerly searching for them. After many hours of wandering throughout the deserted lands, however, she was unsuccessful. Now, the sun was beginning to set, and her goal was still far beyond her reach. Looking at the slowly darkening ground before her, she sighed to herself, “I can’t believe I came all this way for nothing. What a waste of time!”<\/div>"], "choices": ["confused → scared", "discouraged → confident", "relaxed → annoyed", "indifferent → depressed", "hopeful → disappointed"], "inline": false, "ans": "⑤", "sol": "전반부 overflowing with anticipation, life-long dream ... about to come true → 희망. however 뒤 unsuccessful, sun was beginning to set, goal still far beyond her reach, What a waste of time! → 실망. 따라서 hopeful → disappointed."}, {"n": 20, "pts": 2, "kind": "필자 주장", "src": "2021학년도 수능 20번", "prompt": "다음 글에서 필자가 주장하는 바로 가장 적절한 것은?", "body": ["<div class=\"tx\">Developing expertise carries costs of its own. We can become experts in some areas, like speaking a language or knowing our favorite foods, simply by living our lives, but in many other domains expertise requires considerable training and effort. What’s more, expertise is domain specific. The expertise that we work hard to acquire in one domain will carry over only imperfectly to related ones, and not at all to unrelated ones. In the end, as much as we may want to become experts on everything in our lives, there simply isn’t enough time to do so. Even in areas where we could, it won’t necessarily be worth the effort. It’s clear that we should concentrate our own expertise on those domains of choice that are most common and/or important to our lives, and those we actively enjoy learning about and choosing from.<\/div>"], "choices": ["자신에게 의미 있는 영역을 정해서 전문성을 키워야 한다.", "전문성 함양에는 타고난 재능보다 노력과 훈련이 중요하다.", "전문가가 되기 위해서는 다양한 분야에 관심을 가져야 한다.", "전문성을 기르기 위해서는 구체적인 계획과 실천이 필수적이다.", "전문가는 일의 우선순위를 결정해서 업무를 수행해야 한다."], "inline": false, "ans": "①", "sol": "전문성은 비용이 들고(domain specific) 모든 분야의 전문가가 될 시간은 없다 → 결론 문장 It's clear that we should concentrate our own expertise on those domains ... most common and/or important to our lives. 즉 '의미 있는 영역을 골라' 집중하라는 주장."}, {"n": 21, "pts": 3, "kind": "함축 의미", "src": "2022학년도 수능 21번", "prompt": "밑줄 친 <u>whether<\/u> <u>to<\/u> <u>make<\/u> <u>ready<\/u> <u>for<\/u> <u>the<\/u> <u>morning<\/u> <u>commute<\/u> <u>or<\/u> <u>not이<\/u> 다음 글에서 의미하는 바로 가장 적절한 것은?", "body": ["<div class=\"tx\">Scientists have no special purchase on moral or ethical decisions; a climate scientist is no more qualified to comment on health care reform than a physicist is to judge the causes of bee colony collapse. The very features that create expertise in a specialized domain lead to ignorance in many others. In some cases lay people―farmers, fishermen, patients, native peoples― may have relevant experiences that scientists can learn from. Indeed, in recent years, scientists have begun to recognize this: the Arctic Climate Impact Assessment includes observations gathered from local native groups. So our trust needs to be limited, and focused. It needs to be very particular. Blind trust will get us into at least as much trouble as no trust at all. But without some degree of trust in our designated experts―the men and women who have devoted their lives to sorting out tough questions about the natural world we live in―we are paralyzed, in effect not knowing <u>whether<\/u> <u>to<\/u> <u>make<\/u> <u>ready<\/u> <u>for<\/u> <u>the<\/u> <u>morning<\/u> <u>commute<\/u> <u>or<\/u> <u>not.<\/u><\/div>", "<div class=\"ft\">*lay: 전문가가 아닌  **paralyze: 마비시키다  ***commute: 통근<\/div>"], "choices": ["questionable facts that have been popularized by non-experts", "readily applicable information offered by specialized experts", "common knowledge that hardly influences crucial decisions", "practical information produced by both specialists and lay people", "biased knowledge that is widespread in the local community"], "inline": false, "ans": "②", "sol": "밑줄은 '아침 출근 준비를 할지 말지조차 모르는' 상태 = 전문가에 대한 최소한의 신뢰가 없으면 we are paralyzed. 즉 일상의 가장 기본적인 판단조차 내리지 못하는 무력한 상태를 가리킨다. 앞 문장 But without some degree of trust ... we are paralyzed 가 직접 단서."}, {"n": 22, "pts": 2, "kind": "글의 요지", "src": "2021학년도 수능 22번", "prompt": "다음 글의 요지로 가장 적절한 것은?", "body": ["<div class=\"tx\">Prior to file-sharing services, music albums landed exclusively in the hands of music critics before their release. These critics would listen to them well before the general public could and preview them for the rest of the world in their reviews. Once the internet made music easily accessible and allowed even advanced releases to spread through online social networks, availability of new music became democratized, which meant critics no longer had unique access. That is, critics and laypeople alike could obtain new music simultaneously. Social media services also enabled people to publicize their views on new songs, list their new favorite bands in their social media bios, and argue over new music endlessly on message boards. The result was that critics now could access the opinions of the masses on a particular album before writing their reviews. Thus, instead of music reviews guiding popular opinion toward art (as they did in preinternet times), music reviews began to reflect―consciously or subconsciously―public opinion.<\/div>", "<div class=\"ft\">*laypeople: 비전문가<\/div>"], "choices": ["미디어 환경의 변화로 음악 비평이 대중의 영향을 받게 되었다.", "인터넷의 발달로 다양한 장르의 음악을 접하는 것이 가능해졌다.", "비평가의 음악 비평은 자신의 주관적인 경험을 기반으로 한다.", "오늘날 새로운 음악은 대중의 기호를 확인한 후에 공개된다.", "온라인 환경의 대두로 음악 비평의 질이 전반적으로 상승하였다."], "inline": false, "ans": "①", "sol": "파일 공유 이전에는 비평가가 먼저 듣고 여론을 '이끌었'지만, 인터넷으로 음악 접근이 민주화되자 비평가가 대중 의견을 먼저 보고 리뷰를 쓰게 됨. 마지막 문장 music reviews began to reflect ... public opinion 이 요지."}, {"n": 23, "pts": 3, "kind": "글의 주제", "src": "2022학년도 수능 23번", "prompt": "다음 글의 주제로 가장 적절한 것은?", "body": ["<div class=\"tx\">Scientists use paradigms rather than believing them. The use of a paradigm in research typically addresses related problems by employing shared concepts, symbolic expressions, experimental and mathematical tools and procedures, and even some of the same theoretical statements. Scientists need only understand how to use these various elements in ways that others would accept. These elements of shared practice thus need not presuppose any comparable unity in scientists’ beliefs about what they are doing when they use them. Indeed, one role of a paradigm is to enable scientists to work successfully without having to provide a detailed account of what they are doing or what they believe about it. Thomas Kuhn noted that scientists “can agree in their identification of a paradigm without agreeing on, or even attempting to produce, a full interpretation or rationalization of it. Lack of a standard interpretation or of an agreed reduction to rules will not prevent a paradigm from guiding research.”<\/div>"], "choices": ["difficulty in drawing novel theories from existing paradigms", "significant influence of personal beliefs in scientific fields", "key factors that promote the rise of innovative paradigms", "roles of a paradigm in grouping like-minded researchers", "functional aspects of a paradigm in scientific research"], "inline": false, "ans": "⑤", "sol": "과학자들은 패러다임을 '믿는' 것이 아니라 '사용'한다. 공유된 도구·절차를 쓸 뿐 신념의 통일은 전제되지 않는다(Kuhn 인용). 즉 패러다임에 대한 해석의 합의 없이도 연구가 가능하다는 것이 주제."}, {"n": 24, "pts": 2, "kind": "글의 제목", "src": "2021학년도 수능 24번", "prompt": "다음 글의 제목으로 가장 적절한 것은?", "body": ["<div class=\"tx\">People don’t usually think of touch as a temporal phenomenon, but it is every bit as time-based as it is spatial. You can carry out an experiment to see for yourself. Ask a friend to cup his hand, palm face up, and close his eyes. Place a small ordinary object in his palm―a ring, an eraser, anything will do―and ask him to identify it without moving any part of his hand. He won’t have a clue other than weight and maybe overall size. Then tell him to keep his eyes closed and move his fingers over the object. He’ll most likely identify it at once. By allowing the fingers to move, you’ve added time to the sensory perception of touch. There’s a direct analogy between the fovea at the center of your retina and your fingertips, both of which have high acuity. Your ability to make complex use of touch, such as buttoning your shirt or unlocking your front door in the dark, depends on continuous time-varying patterns of touch sensation.<\/div>", "<div class=\"ft\">*analogy: 유사 **fovea: (망막의) 중심와(窩) ***retina: 망막<\/div>"], "choices": ["Touch and Movement: Two Major Elements of Humanity", "Time Does Matter: A Hidden Essence of Touch", "How to Use the Five Senses in a Timely Manner", "The Role of Touch in Forming the Concept of Time", "The Surprising Function of Touch as a Booster of Knowledge"], "inline": false, "ans": "②", "sol": "촉각은 공간적일 뿐 아니라 '시간 기반'임을 실험으로 보여 줌. 손을 움직이지 못하면 못 알아보고, 움직이면 즉시 알아본다 → By allowing the fingers to move, you've added time. 따라서 '시간이 촉각의 숨은 본질'이라는 제목이 적절."}, {"n": 25, "pts": 2, "kind": "도표 불일치", "src": "2022학년도 수능 25번", "prompt": "다음 도표의 내용과 일치하지 <u>않는<\/u> 것은?", "body": ["<img alt=\"도표\" class=\"fig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAtMAAAIUCAMAAADvx1APAAADAFBMVEX+/v4AAADl5eWysrJLS0sSEhIhISHY2NjPz885OTkAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADsneg2AAAk80lEQVR42u2diZbjLK9FOdTn7v++/wvfrsQDg8CAncHJPmt1dSZjx9mWhRDCOYQQQm8uIfQ5ujPNZY0+RhNMo0/zOmAawTRCMI0QTCME0wjBNIJphGAaIZhGCKYRgmkE0  of Chicago. Knight spent most of his career at the University of Chicago. Some of his students at Chicago later received the Nobel Prize. Knight is known as the author of the book <i>Risk, Uncertainty and Profit<\/i>, a study of the role of the entrepreneur in economic life. He also wrote a brief introduction to economics entitled <i>The Economic Organization<\/i>, which became a classic of microeconomic theory. But Knight was much more than an economist; he was also a social philosopher. Later in his career, Knight developed his theories of freedom, democracy, and ethics. After retiring in 1952, Knight remained active in teaching and writing.<\/div>", "<div class=\"ft\">*entrepreneur: 기업가<\/div>"], "choices": ["20세기의 가장 영향력 있는 경제학자들 중 한 명이었다.", "경력의 대부분을 University of Chicago에서 보냈다.", "그의 학생들 중 몇 명은 나중에 노벨상을 받았다.", "<i>Risk, Uncertainty and Profit<\/i>의 저자로 알려져 있다.", "은퇴 후에는 가르치는 일은 하지 않고 글 쓰는 일에 전념했다."], "inline": false, "ans": "⑤", "sol": "마지막 문장 After retiring in 1952, Knight remained active in teaching and writing — 은퇴 후에도 '가르치는 일과 글쓰기 모두' 계속했다. ⑤는 가르치는 일을 하지 않았다고 했으므로 불일치."}, {"n": 27, "pts": 2, "kind": "안내문 불일치", "src": "2022학년도 수능 27번", "prompt": "Cornhill No Paper Cup Challenge에 관한 다음 안내문의 내용과 일치하지 <u>않는<\/u> 것은?", "body": ["<div class=\"nb\"><div class=\"nt\">Cornhill No Paper Cup Challenge<\/div><p>Cornhill High School invites you to join the “No Paper Cup Challenge.” This encourages you to reduce your use of paper cups. Let’s save the earth together!<\/p><p class=\"nh\">How to Participate<\/p><p>1) After being chosen, record a video showing you are using a tumbler.<br>2) Choose the next participant by saying his or her name in the video.<br>3) Upload the video to our school website within 24 hours.<\/p><p>※ The student council president will start the challenge on December 1st, 2021.<\/p><p class=\"nh\">Additional Information<\/p><p>∙ The challenge will last for two weeks.<br>∙ All participants will receive T-shirts.<\/p><p>If you have questions about the challenge, contact us at cornhillsc@chs.edu.<\/p><\/div>"], "choices": ["참가자는 텀블러를 사용하는 자신의 동영상을 찍는다.", "참가자가 동영상을 업로드할 곳은 학교 웹사이트이다.", "학생회장이 시작할 것이다.", "두 달 동안 진행될 예정이다.", "참가자 전원이 티셔츠를 받을 것이다."], "inline": false, "ans": "④", "sol": "The challenge will last for two weeks(2주) 인데 ④는 '두 달'이라고 했으므로 불일치. ①은 record a video showing you are using a tumbler, ②는 Upload the video to our school website, ⑤는 All participants will receive T-shirts 로 일치."}, {"n": 28, "pts": 2, "kind": "안내문 일치", "src": "2021학년도 수능 28번", "prompt": "Jason’s Photography Class에 관한 다음 안내문의 내용과 일치하는 것은?", "body": ["<div class=\"nb\"><div class=\"nt\">Jason’s Photography Class<\/div><p>Are you tired of taking pictures with your camera set to “Auto”? Do you want to create more professional-looking photos? You won’t want to miss this opportunity.<\/p><p>∙ Date: Saturday, December 19<br>∙ Time: 1:30 p.m.—5:30 p.m.<br>∙ Place: Thrombon Building, Room 2 on the first floor<br>∙ Tuition Fee: $50 (snacks provided)<br>∙ Level: Beginner<br>∙ Topics to Be Covered:<br>&nbsp;&nbsp;&nbsp;– Equipment Selection<br>&nbsp;&nbsp;&nbsp;– Lighting Techniques<br>&nbsp;&nbsp;&nbsp;– Color Selection<br>&nbsp;&nbsp;&nbsp;– Special Effects<br>∙ Class size is limited to eight, so don’t delay!<\/p><p>Visit our web site at www.eypcap.com to register.<\/p><\/div>"], "choices": ["오전에 시작된다.", "3층에서 진행된다.", "중급자 수준이다.", "다루는 주제 중 하나는 특수 효과이다.", "수강 학생 수에는 제한이 없다."], "inline": false, "ans": "④", "sol": "Topics to Be Covered 에 Special Effects 가 포함되므로 ④가 일치. ① 1:30 p.m. 시작(오후), ② Room 2 on the first floor(1층), ③ Level: Beginner(초급), ⑤ Class size is limited to eight(인원 제한 있음)으로 모두 불일치."}, {"n": 29, "pts": 3, "kind": "어법", "src": "2022학년도 수능 29번", "prompt": "다음 글의 밑줄 친 부분 중, 어법상 <u>틀린<\/u> 것은?", "body": ["<div class=\"tx\">Like whole individuals, cells have a life span. During their life cycle (cell cycle), cell size, shape, and metabolic activities can change dramatically. A cell is “born” as a twin when its mother cell divides, <u>①producing<\/u> two daughter cells. Each daughter cell is smaller than the mother cell, and except for unusual cases, each grows until it becomes as large as the mother cell <u>②was.<\/u> During this time, the cell absorbs water, sugars, amino acids, and other nutrients and assembles them into new, living protoplasm. After the cell has grown to the proper size, its metabolism shifts as it either prepares to divide or matures and <u>③differentiates<\/u> into a specialized cell. Both growth and development require a complex and dynamic set of interactions involving all cell parts. <u>④What<\/u> cell metabolism and structure should be complex would not be surprising, but actually, they are rather simple and logical. Even the most complex cell has only a small number of parts, each <u>⑤responsible<\/u> for a distinct, well-defined aspect of cell life.<\/div>", "<div class=\"ft\">*metabolic: 물질대사의 **protoplasm: 원형질<\/div>"], "choices": ["", "", "", "", ""], "inline": true, "ans": "④", "sol": "④ What → That. cell metabolism and structure should be complex 는 그 자체로 완전한 절이므로 관계대명사 What이 아니라 접속사 That이 와야 한다(That ... would not be surprising 의 주어절). ① 분사구문 producing, ② 대동사 was(=was large), ③ differentiates 는 prepares 와 병렬, ⑤ responsible for ~ 는 앞의 each(= each part)를 꾸미는 형용사구로 모두 적절."}, {"n": 30, "pts": 2, "kind": "어휘", "src": "2021학년도 수능 30번", "prompt": "다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 <u>않은<\/u> 것은?", "body": ["<div class=\"tx\">How the bandwagon effect occurs is demonstrated by the history of measurements of the speed of light. Because this speed is the basis of the theory of relativity, it’s one of the most frequently and carefully measured <u>①quantities<\/u> in science. As far as we know, the speed hasn’t changed over time. However, from 1870 to 1900, all the experiments found speeds that were too high. Then, from 1900 to 1950, the <u>②opposite<\/u> happened―all the experiments found speeds that were too low! This kind of error, where results are always on one side of the real value, is called “bias.” It probably happened because over time, experimenters subconsciously adjusted their results to <u>③match<\/u> what they expected to find. If a result fit what they expected, they kept it. If a result didn’t fit, they threw it out. They weren’t being intentionally dishonest, just <u>④influenced<\/u> by the conventional wisdom. The pattern only changed when someone <u>⑤lacked<\/u> the courage to report what was actually measured instead of what was expected.<\/div>", "<div class=\"ft\">*bandwagon effect: 편승 효과<\/div>"], "choices": ["", "", "", "", ""], "inline": true, "ans": "⑤", "sol": "⑤ lacked → had. 앞까지는 '기대에 맞춰 결과를 무의식적으로 조정하는 편승 효과'를 설명하고, 마지막 문장은 그 패턴이 '깨진' 시점을 말한다. 기대가 아니라 실측값을 보고할 '용기를 가진' 사람이 나타났을 때 바뀐 것이므로 lacked는 문맥에 반대."}, {"n": null, "ghead": true, "prompt": "[31～34] 다음 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.", "src": "", "body": [], "choices": []}, {"n": 31, "pts": 2, "kind": "빈칸 추론", "src": "2022학년도 수능 31번", "prompt": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "body": ["<div class=\"tx first\"><b class=\"num\">31.<\/b> Humour involves not just practical disengagement but cognitive disengagement. As long as something is funny, we are for the moment not concerned with whether it is real or fictional, true or false. This is why we give considerable leeway to people telling funny stories. If they are getting extra laughs by exaggerating the silliness of a situation or even by making up a few details, we are happy to grant them comic licence, a kind of poetic licence. Indeed, someone listening to a funny story who tries to correct the teller―‘No, he didn’t spill the spaghetti on the keyboard and the monitor, just on the keyboard’―will probably be told by the other listeners to stop interrupting. The creator of humour is putting ideas into people’s heads for the pleasure those ideas will bring, not to provide <span class=\"bl\"><\/span> information.<\/div>", "<div class=\"ft\">*cognitive: 인식의 **leeway: 여지<\/div>"], "choices": ["accurate", "detailed", "useful", "additional", "alternative"], "inline": false, "ans": "①", "sol": "유머는 인지적 거리두기여서 사실 여부를 따지지 않고, 과장하거나 세부를 지어내도 comic licence 를 허용한다. 이야기를 바로잡으려는 사람은 오히려 제지당한다 → 유머의 목적은 '정확한(accurate)' 정보 제공이 아니다.", "grouped": true}, {"n": 32, "pts": 2, "kind": "빈칸 추론", "src": "2021학년도 수능 32번", "prompt": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "body": ["<div class=\"tx first\"><b class=\"num\">32.<\/b> Choosing similar friends can have a rationale. Assessing the survivability of an environment can be risky (if an environment turns out to be deadly, for instance, it might be too late by the time you found out), so humans have evolved the desire to associate with similar individuals as a way to perform this function efficiently. This is especially useful to a species that lives in so many different sorts of environments. However, the carrying capacity of a given environment <span class=\"bl\"><\/span> . If resources are very limited, the individuals who live in a particular place cannot all do the exact same thing (for example, if there are few trees, people cannot all live in tree houses, or if mangoes are in short supply, people cannot all live solely on a diet of mangoes). A rational strategy would therefore sometimes be to avoid similar members of one’s species.<\/div>"], "choices": ["exceeds the expected demands of a community", "is decreased by diverse means of survival", "places a limit on this strategy", "makes the world suitable for individuals", "prevents social ties to dissimilar members"], "inline": false, "ans": "③", "sol": "유사한 사람과 어울리는 전략이 유용하지만, However 뒤에서 자원이 한정되면 모두가 똑같이 살 수 없다는 예(나무집·망고)를 든다. 따라서 환경의 수용력이 이 전략에 '한계를 지운다'는 ③이 적절. 결론 문장 A rational strategy would therefore sometimes be to avoid similar members 와도 연결.", "grouped": true}, {"n": 33, "pts": 3, "kind": "빈칸 추론", "src": "2022학년도 수능 33번", "prompt": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "body": ["<div class=\"tx first\"><b class=\"num\">33.<\/b> Elinor Ostrom found that there are several factors critical to bringing about stable institutional solutions to the problem of the commons. She pointed out, for instance, that the actors affected by the rules for the use and care of resources must have the right to <span class=\"bl\"><\/span> . For that reason, the people who monitor and control the behavior of users should also be users and/or have been given a mandate by all users. This is a significant insight, as it shows that prospects are poor for a centrally directed solution to the problem of the commons coming from a state power in comparison with a local solution for which users assume personal responsibility. Ostrom also emphasizes the importance of democratic decision processes and that all users must be given access to local forums for solving problems and conflicts among themselves. Political institutions at central, regional, and local levels must allow users to devise their own regulations and independently ensure observance.<span class=\"p3\"> [3점]<\/span><\/div>", "<div class=\"ft\">*commons: 공유지  **mandate: 위임<\/div>"], "choices": ["participate in decisions to change the rules", "claim individual ownership of the resources", "use those resources to maximize their profits", "demand free access to the communal resources", "request proper distribution based on their merits"], "inline": false, "ans": "①", "sol": "빈칸 뒤 For that reason 이 결정적 단서 — 감시·통제하는 사람이 곧 이용자이거나 이용자의 위임을 받아야 한다. 또한 민주적 의사결정, 스스로 규정을 만들 권리를 강조한다. 따라서 이용자가 '규칙 변경 결정에 참여할 권리'가 있어야 한다는 ①.", "grouped": true}, {"n": 34, "pts": 3, "kind": "빈칸 추론", "src": "2021학년도 수능 34번", "prompt": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "body": ["<div class=\"tx first\"><b class=\"num\">34.<\/b> Successful integration of an educational technology is marked by that technology being regarded by users as an unobtrusive facilitator of learning, instruction, or performance. When the focus shifts from the technology being used to the educational purpose that technology serves, then that technology is becoming a comfortable and trusted element, and can be regarded as being successfully integrated. Few people give a second thought to the use of a ball-point pen although the mechanisms involved vary―some use a twist mechanism and some use a push button on top, and there are other variations as well. Personal computers have reached a similar level of familiarity for a great many users, but certainly not for all. New and emerging technologies often introduce both fascination and frustration with users. As long as <span class=\"bl\"><\/span> in promoting learning, instruction, or performance, then one ought not to conclude that the technology has been successfully integrated―at least for that user.<span class=\"p3\"> [3점]<\/span><\/div>", "<div class=\"ft\">*unobtrusive: 눈에 띄지 않는<\/div>"], "choices": ["the user successfully achieves familiarity with the technology", "the user’s focus is on the technology itself rather than its use", "the user continues to employ outdated educational techniques", "the user involuntarily gets used to the misuse of the technology", "the user’s preference for interaction with other users persists"], "inline": false, "ans": "②", "sol": "성공적 통합의 기준은 '기술 자체'가 아니라 '기술이 봉사하는 교육 목적'으로 초점이 옮겨가는 것(볼펜 비유). 따라서 사용자의 초점이 여전히 기술 자체에 머물러 있는 한 성공적으로 통합되었다고 할 수 없다 → ②.", "grouped": true}, {"n": 35, "pts": 2, "kind": "흐름 무관", "src": "2022학년도 수능 35번", "prompt": "다음 글에서 전체 흐름과 관계 <u>없는<\/u> 문장은?", "body": ["<div class=\"tx\">Since their introduction, information systems have substantially changed the way business is conducted. ①This is particularly true for business in the shape and form of cooperation between firms that involves an integration of value chains across multiple units. ②The resulting networks do not only cover the business units of a single firm but typically also include multiple units from different firms. ③As a consequence, firms do not only need to consider their internal organization in order to ensure sustainable business performance; they also need to take into account the entire ecosystem of units surrounding them. ④Many major companies are fundamentally changing their business models by focusing on profitable units and cutting off less profitable ones. ⑤In order to allow these different units to cooperate successfully, the existence of a common platform is crucial.<\/div>"], "choices": ["", "", "", "", ""], "inline": true, "ans": "④", "sol": "글은 정보시스템으로 인해 기업 간 가치사슬이 통합되고, 따라서 내부 조직을 넘어 '생태계 전체'를 고려해야 하며 공통 플랫폼이 중요하다는 흐름. ④의 '수익성 있는 사업부에 집중하고 비수익 사업부를 정리한다'는 내용은 네트워크·협력이라는 논지와 무관."}, {"n": null, "ghead": true, "prompt": "[36～37] 주어진 글 다음에 이어질 글의 순서로 가장 적절한 것을 고르시오.", "src": "", "body": [], "choices": []}, {"n": 36, "pts": 2, "kind": "글의 순서", "src": "2021학년도 수능 36번", "prompt": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "body": ["<div class=\"bx\">The objective of battle, to “throw” the enemy and to make him defenseless, may temporarily blind commanders and even strategists to the larger purpose of war. War is never an isolated act, nor is it ever only one decision.<\/div>", "<div class=\"tx\">(A) To be political, a political entity or a representative of a political entity, whatever its constitutional form, has to have an intention, a will. That intention has to be clearly expressed.<\/div>", "<div class=\"tx\">(B) In the real world, war’s larger purpose is always a political purpose. It transcends the use of force. This insight was famously captured by Clausewitz’s most famous phrase, “War is a mere continuation of politics by other means.”<\/div>", "<div class=\"tx\">(C) And one side’s will has to be transmitted to the enemy at some point during the confrontation (it does not have to be publicly communicated). A violent act and its larger political intention must also be attributed to one side at some point during the confrontation. History does not know of acts of war without eventual attribution.<\/div>", "<div class=\"ft\">*entity: 실체  **transcend: 초월하다<\/div>"], "choices": ["(A) － (C) － (B)", "(B) － (A) － (C)", "(B) － (C) － (A)", "(C) － (A) － (B)", "(C) － (B) － (A)"], "inline": false, "ans": "②", "sol": "주어진 글: 전투의 목표가 전쟁의 더 큰 목적을 가린다. (B) In the real world, war's larger purpose is always a political purpose 로 '더 큰 목적'을 받아 정치적 목적임을 제시. (A) To be political ... has to have an intention, a will 로 '정치적'의 조건을 설명. (C) And one side's will has to be transmitted 로 (A)의 will 을 이어받음. 따라서 (B)-(A)-(C).", "grouped": true}, {"n": 37, "pts": 3, "kind": "글의 순서", "src": "2022학년도 수능 37번", "prompt": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "body": ["<div class=\"bx\">In spite of the likeness between the fictional and real world, the fictional world deviates from the real one in one important respect.<\/div>", "<div class=\"tx\">(A) The author has selected the content according to his own worldview and his own conception of relevance, in an attempt to be neutral and objective or convey a subjective view on the world. Whatever the motives, the author’s subjective conception of the world stands between the reader and the original, untouched world on which the story is based.<\/div>", "<div class=\"tx\">(B) Because of the inner qualities with which the individual is endowed through heritage and environment, the mind functions as a filter; every outside impression that passes through it is filtered and interpreted. However, the world the reader encounters in literature is already processed and filtered by another consciousness.<\/div>", "<div class=\"tx\">(C) The existing world faced by the individual is in principle an infinite chaos of events and details before it is organized by a human mind. This chaos only gets processed and modified when perceived by a human mind.<span class=\"p3\"> [3점]<\/span><\/div>", "<div class=\"ft\">*deviate: 벗어나다 **endow: 부여하다 ***heritage: 유산<\/div>"], "choices": ["(A) － (C) － (B)", "(B) － (A) － (C)", "(B) － (C) － (A)", "(C) － (A) － (B)", "(C) － (B) － (A)"], "inline": false, "ans": "⑤", "sol": "주어진 글: 허구 세계는 한 가지 중요한 점에서 현실과 다르다. (C) 인간의 정신에 의해 조직되기 전의 현실은 무한한 혼돈이다 → 현실 쪽을 먼저 설명. (B) 그 정신이 필터로 기능하며, However 문학 속 세계는 '이미 다른 의식에 의해 처리된' 것. (A) 그 다른 의식 = 작가이며 작가의 주관이 독자와 원래 세계 사이에 놓인다. 따라서 (C)-(B)-(A).", "grouped": true}, {"n": null, "ghead": true, "prompt": "[38～39] 글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳을 고르시오.", "src": "", "body": [], "choices": []}, {"n": 38, "pts": 2, "kind": "문장 삽입", "src": "2021학년도 수능 38번", "prompt": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?", "body": ["<div class=\"bx\">I have still not exactly pinpointed Maddy’s character since wickedness takes many forms.<\/div>", "<div class=\"tx\">Imagine I tell you that Maddy is bad. Perhaps you infer from my intonation, or the context in which we are talking, that I mean morally bad. Additionally, you will probably infer that I am disapproving of Maddy, or saying that I think you should disapprove of her, or similar, given typical linguistic conventions and assuming I am sincere. ( ① ) However, you might not get a more detailed sense of the particular sorts of way in which Maddy is bad, her typical character traits, and the like, since people can be bad in many ways. ( ② ) In contrast, if I say that Maddy is wicked, then you get more of a sense of her typical actions and attitudes to others. ( ③ ) The word ‘wicked’ is more specific than ‘bad’. ( ④ ) But there is more detail nevertheless, perhaps a stronger connotation of the sort of person Maddy is. ( ⑤ ) In addition, and again assuming typical linguistic conventions, you should also get a sense that I am disapproving of Maddy, or saying that you should disapprove of her, or similar, assuming that we are still discussing her moral character.<\/div>", "<div class=\"ft\">*connotation: 함축<\/div>"], "choices": ["", "", "", "", ""], "inline": true, "ans": "④", "sol": "주어진 문장은 since wickedness takes many forms — '여전히 성격을 정확히 특정하지 못했다'는 유보. ③ 뒤에서 'wicked'가 'bad'보다 구체적이라고 한 다음, ④ 뒤 문장이 But there is more detail nevertheless 로 '그럼에도 더 구체적'이라고 반전한다. 이 But ... nevertheless 가 받을 유보 진술이 필요하므로 ④.", "grouped": true}, {"n": 39, "pts": 3, "kind": "문장 삽입", "src": "2022학년도 수능 39번", "prompt": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?", "body": ["<div class=\"bx\">As long as the irrealism of the silent black and white film predominated, one could not take filmic fantasies for representations of reality.<\/div>", "<div class=\"tx\">Cinema is valuable not for its ability to make visible the hidden outlines of our reality, but for its ability to reveal what reality itself veils―the dimension of fantasy. ( ① ) This is why, to a person, the first great theorists of film decried the introduction of sound and other technical innovations (such as color) that pushed film in the direction of realism. ( ② ) Since cinema was an entirely fantasmatic art, these innovations were completely unnecessary. ( ③ ) And what’s worse, they could do nothing but turn filmmakers and audiences away from the fantasmatic dimension of cinema, potentially transforming film into a mere delivery device for representations of reality. ( ④ ) But sound and color threatened to create just such an illusion, thereby destroying the very essence of film art. ( ⑤ ) As Rudolf Arnheim puts it, “The creative power of the artist can only come into play where reality and the medium of representation do not coincide.”<span class=\"p3\"> [3점]<\/span><\/div>", "<div class=\"ft\">*decry: 공공연히 비난하다 **fantasmatic: 환상의<\/div>"], "choices": ["", "", "", "", ""], "inline": true, "ans": "④", "sol": "주어진 문장: 무성 흑백영화의 비현실성이 지배하는 한 영화적 환상을 현실의 재현으로 '착각할 수 없었다'. ④ 뒤 문장이 But sound and color threatened to create just such an illusion — just such an illusion 이 가리킬 '그런 착각'이 앞에 제시되어야 하므로 ④.", "grouped": true}, {"n": 40, "pts": 2, "kind": "요약문", "src": "2021학년도 수능 40번", "prompt": "다음 글의 내용을 한 문장으로 요약하고자 한다. 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것은?", "body": ["<div class=\"bx\">From a cross-cultural perspective the equation between public leadership and dominance is questionable. What does one mean by ‘dominance’? Does it indicate coercion? Or control over ‘the most valued’? ‘Political’ systems may be about both, either, or conceivably neither. The idea of ‘control’ would be a bothersome one for many peoples, as for instance among many native peoples of Amazonia where all members of a community are fond of their personal autonomy and notably allergic to any obvious expression of control or coercion. The conception of political power as a coercive force, while it may be a Western fixation, is not a universal. It is very unusual for an Amazonian leader to give an order. If many peoples do not view political power as a coercive force, nor as the most valued domain, then the leap from ‘the political’ to ‘domination’ (as coercion), and from there to ‘domination of women’, is a shaky one. As Marilyn Strathern has remarked, the notions of ‘the political’ and ‘political personhood’ are cultural obsessions of our own, a bias long reflected in anthropological constructs.<\/div>", "<div class=\"ft\">*coercion: 강제  **autonomy: 자율 ***anthropological: 인류학의<\/div>", "<div class=\"tx\"><span class=\"arrow\">↓<\/span><\/div>", "<div class=\"bx\">It is <u>(A)<\/u> to understand political power in other cultures through our own notion of it because ideas of political power are not <u>(B)<\/u> across cultures.<\/div>"], "choices": ["rational …flexible", "appropriate …commonplace", "misguided …uniform", "unreasonable …varied", "effective …objective"], "inline": false, "ans": "③", "sol": "(A) misguided, (B) uniform. 7번째 문장 The conception of political power as a coercive force ... is not a universal(보편적이지 않다)과 마지막 문장 a bias(편향)가 근거. 정치권력에 대한 생각이 문화마다 같지(uniform) 않으므로, 우리 관념으로 다른 문화의 정치권력을 이해하는 것은 잘못(misguided)이다. ④ unreasonable … varied는 (B)가 not 안에 들어가 '다양하지 않다'가 되므로 반대."}, {"n": null, "pts": null, "kind": "", "src": "2022학년도 수능 41~42번", "prompt": "[41~42] 다음 글을 읽고, 물음에 답하시오.", "body": ["<div class=\"bx\">Classifying things together into groups is something we do all the time, and it isn’t hard to see why. Imagine trying to shop in a supermarket where the food was arranged in random order on the shelves: tomato soup next to the white bread in one aisle, chicken soup in the back next to the 60-watt light bulbs, one brand of cream cheese in front and another in aisle 8 near the cookies. The task of finding what you want would be <u>(a)time-consuming<\/u> and extremely difficult, if not impossible. In the case of a supermarket, someone had to <u>(b)design<\/u> the system of classification. But there is also a ready-made system of classification embodied in our language. The word “dog,” for example, groups together a certain class of animals and distinguishes them from other animals. Such a grouping may seem too <u>(c)abstract<\/u> to be called a classification, but this is only because you have already mastered the word. As a child learning to speak, you had to work hard to <u>(d)learn<\/u> the system of classification your parents were trying to teach you. Before you got the hang of it, you probably made mistakes, like calling the cat a dog. If you hadn’t learned to speak, the whole world would seem like the <u>(e)unorganized<\/u> supermarket; you would be in the position of an infant, for whom every object is new and unfamiliar. In learning the principles of classification, therefore, we’ll be learning about the structure that lies at the core of our language.<\/div>"], "choices": [], "inline": false, "ans": null, "sol": null}, {"n": 41, "pts": 2, "kind": "제목 (41~42 세트)", "src": "2022학년도 수능 41번", "prompt": "윗글의 제목으로 가장 적절한 것은?", "body": [], "choices": ["Similarities of Strategies in Sales and Language Learning", "Classification: An Inherent Characteristic of Language", "Exploring Linguistic Issues Through Categorization", "Is a Ready-Made Classification System Truly Better?", "Dilemmas of Using Classification in Language Education"], "inline": false, "ans": "②", "sol": "슈퍼마켓 비유로 분류의 필요성을 보여 준 뒤, 언어 자체에 '이미 만들어진 분류 체계'가 들어 있다('dog'이라는 단어가 한 부류를 묶는다)고 전개. 따라서 '분류: 언어에 내재한 특성'이 제목."}, {"n": 42, "pts": 2, "kind": "어휘 (41~42 세트)", "src": "2022학년도 수능 42번", "prompt": "밑줄 친 (a)~(e) 중에서 문맥상 낱말의 쓰임이 적절하지 <u>않은<\/u> 것은?", "body": [], "choices": ["(a)", "(b)", "(c)", "(d)", "(e)"], "inline": false, "ans": "③", "sol": "(c) abstract → obvious/natural 류가 적절. 'dog' 같은 단어 묶음이 분류라고 부르기엔 '너무 당연해 보인다'는 맥락이며, 그 이유는 but this is only because you have already mastered the word — 이미 그 단어를 익혔기 때문이다. '추상적'은 이 논리와 맞지 않는다."}, {"n": null, "pts": null, "kind": "", "src": "2021학년도 수능 43~45번", "prompt": "[43~45] 다음 글을 읽고, 물음에 답하시오.", "body": ["<div class=\"tx\"><u>(A)<\/u><\/div>", "<div class=\"bx\">In this area, heavy snow in winter was not uncommon. Sometimes it poured down for hours and hours and piled up very high. Then, no one could go out. Today too, because of the heavy snow, Mom was doing her office work at the kitchen table. Felix, the high schooler, had to take online classes in his room. Five-year-old Sean, who normally went to kindergarten, was sneaking around in the house playing home policeman. <u>(a)The<\/u> <u>kindergartener<\/u> wanted to know what his family members were up to, and was checking up on everyone.<\/div>", "<div class=\"ft\">*sneak: 몰래 움직이다<\/div>", "<div class=\"tx\"><u>(B)<\/u><\/div>", "<div class=\"bx\">“All right. I’m sure you’re doing your work.” Mom replied, and then sharply added a question. “Sean, what are you doing?” Sean’s face immediately became blank, and he said, “Nothing.” “Come here, Honey, and you can help me.” Sean ran to the kitchen right away. “What can I do for you, Mom?” His voice was high, and Felix could sense that his brother was excited. Felix was pleased to get rid of <u>(b)the<\/u> <u>policeman,<\/u> and now he could concentrate on the lesson, at least till Sean came back.<\/div>", "<div class=\"tx\"><u>(C)<\/u><\/div>", "<div class=\"bx\">While checking on his family, Sean interfered in their business as if it was his own. This time, <u>(c)the<\/u> <u>playful<\/u> <u>and<\/u> <u>curious<\/u> <u>boy<\/u> was interested in his brother Felix, who committed himself to studying no matter where he was. Sean secretly looked inside his brother’s room from the door, and shouted toward the kitchen where Mom was working, “Mom, Felix isn’t studying. He’s just watching a funny video.” Sean was naughtily smiling at his brother. <\/div>", "<div class=\"ft\">*naughtily: 짓궂게<\/div>", "<div class=\"tx\"><u>(D)<\/u><\/div>", "<div class=\"bx\">Felix was mad because <u>(d)his<\/u> <u>little<\/u> <u>brother<\/u> was bothering him. Felix was studying science using a video posted on the school web site. He made an angry face at the naughty boy. Right then, Mom asked loudly from the kitchen, “What are you doing, Felix?” Felix’s room was located next to the kitchen, and he could hear Mom clearly. “I’m watching a lecture video for my science class.” Felix argued against Sean’s accusation and mischievously stuck <u>(e)his<\/u> tongue out at his little brother. <\/div>", "<div class=\"ft\">*mischievously: 장난기 있게<\/div>"], "choices": [], "inline": false, "ans": null, "sol": null}, {"n": 43, "pts": 2, "kind": "순서 (43~45 세트)", "src": "2021학년도 수능 43번", "prompt": "주어진 글 (A)에 이어질 내용을 순서에 맞게 배열한 것으로 가장 적절한 것은?", "body": [], "choices": ["(B) － (D) － (C)", "(C) － (B) － (D)", "(C) － (D) － (B)", "(D) － (B) － (C)", "(D) － (C) － (B)"], "inline": false, "ans": "③", "sol": "(A) Sean이 집안을 돌며 가족을 점검 → (C) 형 Felix의 방을 몰래 들여다보고 주방의 엄마에게 '형이 공부 안 한다'고 외침 → (D) 화가 난 Felix에게 엄마가 “What are you doing, Felix?”라고 묻고 Felix가 해명 → (B) 엄마가 “All right. I’m sure you’re doing your work.”라고 답한 뒤 Sean을 주방으로 부름. 따라서 (C)-(D)-(B)."}, {"n": 44, "pts": 2, "kind": "지칭 (43~45 세트)", "src": "2021학년도 수능 44번", "prompt": "밑줄 친 (a)~(e) 중에서 가리키는 대상이 나머지 넷과 <u>다른<\/u> 것은?", "body": [], "choices": ["(a)", "(b)", "(c)", "(d)", "(e)"], "inline": false, "ans": "⑤", "sol": "(a) The kindergartener, (b) the policeman 등은 모두 다섯 살 Sean을 가리키지만, ⑤ (e)는 형 Felix를 가리킨다. 밑줄 주변의 서술어와 상황(온라인 수업/방)을 확인하면 지시 대상이 갈린다."}, {"n": 45, "pts": 2, "kind": "내용 불일치 (43~45 세트)", "src": "2021학년도 수능 45번", "prompt": "윗글에 관한 내용으로 적절하지 <u>않은<\/u> 것은?", "body": [], "choices": ["엄마는 폭설로 인해 집에서 업무를 보고 있었다.", "Sean은 엄마가 불러서 주방으로 달려갔다.", "Sean은 몰래 형의 방을 들여다보았다.", "Felix는 자신의 방에서 게임을 하고 있었다.", "Felix의 방은 주방 옆에 있었다."], "inline": false, "ans": "④", "sol": "(D) Felix was studying science using a video posted on the school web site — 학교 웹사이트에 올라온 영상으로 과학 공부를 하고 있었다(“I’m watching a lecture video for my science class.”). ④는 게임을 하고 있었다고 했으므로 불일치. 게임 이야기는 Sean의 거짓 고자질(He’s just watching a funny video)일 뿐이다."}];
const NUM = ['①','②','③','④','⑤'];
let mode = 'st';
try{ const m = localStorage.getItem('warmup-mode'); if(m) mode = m; }catch(e){}

/* ---------- 문항을 쪼갤 수 있는 덩어리로 ---------- */
function el(html){ const d=document.createElement('div'); d.innerHTML=html; return d; }
function isLabel(html){ return /class="tx"><u>\([A-D]\)<\/u><\/div>/.test(html); }
function bodyPieces(body, plainBox){
  // (A) 표지는 다음 상자와, 각주는 앞 덩어리와 붙인다
  const out=[]; let pend='';
  body.forEach(h=>{
    if(isLabel(h)){ pend += h.replace('class="tx"','class="tx lab"'); return; }
    if(/class="ft"/.test(h) && out.length && !pend){ out[out.length-1]+=h; return; }
    if(plainBox) h = h.replace('class="bx"','class="bx plain"');
    out.push(pend+h); pend='';
  });
  if(pend) out.push(pend);
  return out;
}
function choicesHTML(it){
  if(!it.choices.length) return '';
  const ansIdx = it.ans ? NUM.indexOf(it.ans) : -1;
  const allEmpty = it.choices.every(c=>!c.trim());
  if(allEmpty){
    return '<ol class="ch inl">'+it.choices.map((c,i)=>`<li class="${i===ansIdx?'ok':''}"><span class="m">${NUM[i]}</span></li>`).join('')+'</ol>';
  }
  const isSum = it.choices.every(c=>c.includes('…'));
  if(isSum){
    return '<ol class="ch sum"><li class="hd"><span class="m"></span><span class="a">(A)</span><span class="b">(B)</span></li>'+
      it.choices.map((c,i)=>{ const [a,b]=c.split('…').map(s=>s.trim());
        return `<li class="${i===ansIdx?'ok':''}"><span class="m">${NUM[i]}</span><span class="a">${a}</span><span>……</span><span class="b">&nbsp;${b}</span></li>`; }).join('')+'</ol>';
  }
  return '<ol class="ch">'+it.choices.map((c,i)=>{
    const ko = /[가-힣]/.test(c.replace(/<[^>]+>/g,''));
    return `<li class="${ko?'ko ':''}${i===ansIdx?'ok':''}"><span class="m">${NUM[i]}</span><span>${c}</span></li>`; }).join('')+'</ol>';
}
function buildUnits(){
  // unit = 한 문항(또는 세트 지문). parts = 순서대로 놓을 덩어리
  const units=[]; let inSet=false;
  let pend='';
  ITEMS.forEach(it=>{
    if(it.ghead){ pend=`<div class="qp ghead">${it.prompt}</div>`; return; }  // [31～34] 같은 묶음 발문은 다음 문항에 붙인다
    if(it.n===null){ // [41~42] / [43~45] 세트 지문
      inSet=true;
      const head = `<div class="qp">${it.prompt}<span class="src">${it.src}</span></div>`;
      const pieces = bodyPieces(it.body, /41/.test(it.prompt));
      units.push({parts:[head+pieces[0], ...pieces.slice(1)]});
      return;
    }
    const p3 = it.pts===3 ? ' <span class="p3">[3점]</span>' : '';
    let head;
    if(it.grouped){ // 묶음 문항: 발문 없이 번호만(31~34는 번호가 지문 첫머리에 있음), [3점]은 지문 끝
      head = (it.n<=34) ? `<div class="qp srconly"><span class="src">${it.src}</span></div>`
                        : `<div class="qp"><b class="num">${it.n}.</b><span class="src">${it.src}</span></div>`;
    } else {
      head = `<div class="qp"><b class="num">${it.n}.</b>${it.prompt}${p3}<span class="src">${it.src}</span></div>`;
    }
    head = pend + head; pend='';
    const pieces = bodyPieces(it.body, false);
    const parts = pieces.length ? [head+pieces[0], ...pieces.slice(1)] : [head];
    const ch = choicesHTML(it);
    if(ch){ // 선택지는 마지막 덩어리와 붙여 같은 단에 둔다(짧은 선택지만)
      if(it.choices.join('').length < 220 || !pieces.length) parts[parts.length-1]+=ch; else parts.push(ch);
    }
    units.push({parts});
  });
  return units;
}
function keyUnits(){
  const qs = ITEMS.filter(i=>i.n!==null && !i.ghead);
  const rows = [qs.slice(0,14), qs.slice(14)];
  const tbl = '<div class="sech">정답 및 해설</div>'+rows.map(r=>
    '<table class="key"><tr><th>번호</th>'+r.map(q=>`<th>${q.n}</th>`).join('')+'</tr><tr><th>정답</th>'+
    r.map(q=>`<td class="a">${q.ans}</td>`).join('')+'</tr><tr><th>배점</th>'+r.map(q=>`<td>${q.pts}</td>`).join('')+'</tr></table>').join('');
  const units=[{parts:[tbl]}];
  qs.forEach(q=>units.push({parts:[`<div class="ex"><div class="eh">${q.n}. <span class="a">${q.ans}</span> ${q.kind}<span class="s">${q.src}</span></div>${q.sol}</div>`]}));
  return units;
}

/* ---------- 쪽 만들기 ---------- */
let pageNo=0;
function newPage(out, first){
  pageNo++;
  const pg=document.createElement('section'); pg.className='page'+(first?' first':'');
  const odd = pageNo%2===1;
  if(first){
    pg.innerHTML = `<div class="ph"><div class="cover-top"><span>대단한영어 GREATENG</span><span>2027학년도 수능 대비</span></div>
      <div class="cover-title">수능 직전 워밍업 모의고사 문제지</div>
      <div class="cover-sub"><span class="pn">1</span><span class="area">영어 영역</span><span class="gr">독해</span></div>
      <div class="idrow">성명 <span></span> 수험 번호 <span></span></div></div>
      <div class="cover-rule"></div>
      <div class="guide">• 독해 18번부터 45번까지 28문항, 배점 합계 63점입니다. 듣기 1~17번은 포함되지 않았습니다.<br>• 권장 시간 50분. 막히는 문항은 표시만 하고 넘어가세요.</div>`;
  } else {
    pg.innerHTML = `<div class="ph">${odd?'<span class="pn"></span>':`<span class="pn">${pageNo}</span>`}<span class="sub">영어 영역</span>${odd?`<span class="pn r">${pageNo}</span>`:'<span class="pn"></span>'}</div><div class="ph2"></div>`;
  }
  pg.insertAdjacentHTML('beforeend','<div class="cols"><div class="col"></div><div class="col"></div></div><div class="pf">원 출제: 한국교육과정평가원 2021·2022학년도 대학수학능력시험 영어 영역(홀수형) · 저작권은 한국교육과정평가원에 있습니다 · 대단한영어 수업용</div>');
  out.appendChild(pg);
  return [...pg.querySelectorAll('.col')];
}
function fits(col){ return col.scrollHeight <= col.clientHeight + 1; }
function layout(units, out, startFirst, startOnNewPage){
  let cols = newPage(out, startFirst), ci=0;
  const next=()=>{ ci++; if(ci>1){ cols=newPage(out,false); ci=0; } };
  units.forEach(u=>{
    // 1) 문항 전체가 지금 단에 들어가면 그대로
    const whole = document.createElement('div'); whole.className='blk'; whole.innerHTML=u.parts.join('');
    cols[ci].appendChild(whole);
    if(fits(cols[ci])) return;
    cols[ci].removeChild(whole);
    // 2) 빈 단이면 들어가는지 확인 후 다음 단으로
    if(cols[ci].children.length){
      next(); cols[ci].appendChild(whole);
      if(fits(cols[ci])) return;
      cols[ci].removeChild(whole);
    }
    // 3) 그래도 길면 덩어리 단위로 나눠 싣는다
    u.parts.forEach((p,k)=>{
      const b=document.createElement('div'); b.className='blk'+(k<u.parts.length-1?' cont':''); b.innerHTML=p;
      cols[ci].appendChild(b);
      if(!fits(cols[ci]) && cols[ci].children.length>1){ cols[ci].removeChild(b); next(); cols[ci].appendChild(b); }
    });
  });
  return cols;
}
function render(){
  const out=document.getElementById('out'); out.innerHTML=''; pageNo=0;
  out.className = mode==='te' ? 'teacher' : 'student';
  layout(buildUnits(), out, true);
  // 끝 안내
  const lastCols=[...out.querySelectorAll('.page:last-child .col')];
  const tgt = lastCols[1].children.length ? lastCols[1] : lastCols[0];
  const end=document.createElement('div'); end.className='endnote'; end.textContent='※ 확인 사항: 답안지의 해당란에 필요한 내용을 정확히 표기했는지 확인하시오.';
  tgt.appendChild(end); if(!fits(tgt)) tgt.removeChild(end);
  if(mode==='te'){ layout(keyUnits(), out, false); }
  document.getElementById('mSt').setAttribute('aria-pressed', mode==='st');
  document.getElementById('mTe').setAttribute('aria-pressed', mode==='te');
  try{ localStorage.setItem('warmup-mode', mode); }catch(e){}
}
document.getElementById('mSt').onclick=()=>{ mode='st'; render(); };
document.getElementById('mTe').onclick=()=>{ mode='te'; render(); };
/* 인쇄 버튼: GitHub Pages처럼 직접 연 페이지에서만 보임 */
(function(){ let framed=true; try{ framed = window.self !== window.top; }catch(e){}
  const pb=document.getElementById('btnPrint'); if(!framed){ pb.hidden=false; pb.onclick=()=>window.print(); } })();
render();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(render);
</script>
