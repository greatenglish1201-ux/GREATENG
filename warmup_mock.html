<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>대단한영어 수능 직전 워밍업 모의고사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
/* 실제 수능 문제지 배치: A3 세로 한 쪽에 2단, 단마다 위·아래 두 문항. 서체는 원본(신명조·Times New Roman·태고딕) 대체 서체 */
:root{
  --desk:#e4e6e9; --paper:#fff; --ink:#000; --muted:#555; --ui:#24557f;
  --f-en:"Times New Roman",Times,"Liberation Serif","Nimbus Roman",serif;
  --f-my:"HCR Batang","함초롬바탕","Batang","바탕","Nanum Myeongjo","Noto Serif KR",serif;
  --f-go:"HY견고딕","HYGothic-Extra","Malgun Gothic","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--f-my);padding:14px 16px 40px}
.bar{max-width:297mm;margin:0 auto 10px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-family:"Noto Sans KR",sans-serif}
.bar h1{font-size:18px;margin:0 auto 0 0}
.chip{font:inherit;font-size:13px;border:1px solid #999;background:#fff;color:#111;padding:6px 14px;border-radius:999px;cursor:pointer;text-decoration:none}
.chip[aria-pressed="true"]{background:var(--ui);border-color:var(--ui);color:#fff}
.chip.prt{border-color:var(--ui);color:var(--ui);font-weight:700}
.chip:focus-visible{outline:2px solid var(--ui);outline-offset:2px}
.hint{max-width:297mm;margin:0 auto 12px;color:var(--muted);font-size:12.5px;line-height:1.6;font-family:"Noto Sans KR",sans-serif}
.scroller{overflow-x:auto}
.sheetwrap{width:max-content;margin:0 auto}
.a4box{width:210mm;height:297mm;overflow:hidden;margin:0 auto 16px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.a4box .page{transform:scale(.70707);transform-origin:0 0;margin:0;box-shadow:none}
/* A4: 여백을 줄인 가상 쪽(256×362mm)에 배치한 뒤 0.82배로 축소 → 글씨가 A3 축소본보다 약 16% 큼 */
.page.v4{width:256mm;height:362.2mm;padding:7mm 7mm 4mm}
.page.v4 .cols{column-gap:10mm}
.a4box .page.v4{transform:scale(.8203)}

/* 쪽(A3) */
.page{width:297mm;height:420mm;margin:0 auto 16px;background:var(--paper);box-shadow:0 1px 4px rgba(0,0,0,.2);
  padding:16mm 30mm 10mm;display:flex;flex-direction:column}
.ph{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;padding-bottom:2.2mm;border-bottom:1.6px solid var(--ink)}
.ph .l{justify-self:start}.ph .r{justify-self:end}
.ph .area{font-family:var(--f-go);font-weight:900;font-size:30pt;letter-spacing:-.02em;line-height:1}
.ph .pn{font-family:var(--f-en);font-weight:700;font-size:32pt;line-height:.9}
.hol{font-family:var(--f-go);font-weight:900;font-size:15pt;border:1.4px solid var(--ink);border-radius:2.2mm;padding:.6mm 2mm;line-height:1.2}
.cover{border-bottom:1.6px solid var(--ink);padding-bottom:2mm}
.cover .t1{display:grid;grid-template-columns:1fr auto 1fr;align-items:end}
.cover .t1 .brand{font-weight:900;margin-right:2mm}
.cover .t1 .ttl{font-family:var(--f-go);font-weight:500;font-size:15pt;letter-spacing:-.01em}
.cover .t1 .pn{justify-self:end;font-family:var(--f-en);font-weight:700;font-size:32pt;line-height:.9}
.cover .t2{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-top:2mm}
.cover .gyo{justify-self:start;font-family:var(--f-my);font-size:13pt;border:1.2px solid var(--ink);border-radius:999px;padding:.6mm 4mm}
.cover .area{font-family:var(--f-go);font-weight:900;font-size:34pt;letter-spacing:-.02em;line-height:1}
.cover .hol{justify-self:end}
.cover .id{display:flex;gap:8mm;justify-content:center;margin-top:3mm;font-family:var(--f-my);font-size:11pt;align-items:center}
.cover .id span.box{display:inline-block;border:1px solid var(--ink);width:38mm;height:7mm;vertical-align:middle;margin-left:2mm}
.cover .id span.box.w{width:52mm}

.cols{flex:1;display:grid;grid-template-columns:1fr 1fr;column-gap:16mm;position:relative;min-height:0;margin-top:3.2mm}
.cols::before{content:"";position:absolute;left:50%;top:-3.2mm;bottom:0;border-left:1.2px solid var(--ink)}
.col{overflow:hidden;min-width:0;height:100%}
.pf{display:flex;justify-content:center;padding-top:3mm}
.pf svg{display:block}
.copy{font-family:var(--f-my);font-size:8.5pt;color:#333;text-align:center;margin-top:1.5mm}

/* 문항 */
.blk{margin:0}
.gap{height:7mm}
.qp{font-family:var(--f-my);font-size:11.2pt;line-height:1.55;margin-bottom:2.4mm;padding-left:7mm;text-indent:-7mm;word-break:keep-all}
.qp b.num{font-family:var(--f-en);font-size:13.5pt;font-weight:700;margin-right:1.6mm;letter-spacing:-.02em}
.qp u,.tx u,.bx u,.nb u{text-decoration-thickness:.6px;text-underline-offset:2px}
.qp .en{font-family:var(--f-en);font-size:11.8pt}
.qp.ghead{text-indent:0;padding-left:0}
.qp.ghead b.gr{font-family:var(--f-en);font-weight:700;font-size:12.5pt;margin-right:1.4mm}
.tx{font-family:var(--f-en);font-size:11.6pt;line-height:17.4pt;text-align:justify;text-indent:6mm;margin:0;hyphens:manual}
.tx.first{text-indent:0}
.tx.first b.num{font-size:13.5pt;margin-right:1.6mm}
.tx.order{text-indent:-6mm;padding-left:6mm;margin-top:1.6mm}
.tx.order b{font-weight:400}
.tx.lab{text-indent:0;text-align:center;margin:2mm 0 1mm}
.tx.lab u{text-decoration:none}
.bx{font-family:var(--f-en);font-size:11.6pt;line-height:17.4pt;text-align:justify;border:1px solid var(--ink);padding:2mm 3mm;margin:0 0 2.2mm}
.bx.plain{border:none;padding:0;text-indent:6mm;margin:0}
.ft{font-family:var(--f-my);font-size:9.6pt;text-align:right;margin:1.6mm 0 2.4mm;white-space:pre-wrap}
.bl{display:inline-block;min-width:36mm;border-bottom:1px solid var(--ink);margin:0 1mm}
.arrow{display:block;text-align:center;font-size:14pt;margin:1mm 0}
img.fig{display:block;width:100%;margin:0 0 2.4mm}
.nb{border:1px solid var(--ink);padding:2.6mm 4mm;font-family:var(--f-en);font-size:11.2pt;line-height:16.4pt;margin:0 0 2.4mm}
.nb .nt{text-align:center;font-weight:700;font-size:13pt;margin-bottom:1.6mm}
.nb p{margin:0 0 1.2mm}
.nb .nh{font-weight:700;margin-bottom:.4mm}
ol.ch{list-style:none;margin:2.2mm 0 0;padding:0 0 0 1.6mm;font-size:11.2pt;line-height:16.2pt}
ol.ch li{display:flex;gap:1.6mm;font-family:var(--f-en)}
ol.ch li.ko{font-family:var(--f-my);letter-spacing:-.03em}
ol.ch li .m{flex:0 0 auto;width:5mm;font-family:var(--f-my)}
ol.ch.inl{display:flex;justify-content:space-around;padding:0 8mm;margin-top:3mm}
ol.ch.sum li span.a,ol.ch.sum li span.b{display:inline-block;width:36mm}
ol.ch.sum .hd{font-family:var(--f-en)}
.from{font-family:"Noto Sans KR",var(--f-go);font-size:8.6pt;color:#444;text-align:right;margin-top:1.4mm}
.guide{font-family:var(--f-go);font-weight:500;font-size:12.5pt;line-height:1.55;border:1px solid var(--ink);padding:2.4mm 4mm;margin-bottom:6mm;text-indent:3mm}
.endnote{font-family:var(--f-go);font-weight:500;font-size:11.5pt;line-height:1.5;border:1px solid var(--ink);padding:2mm 4mm;margin-top:6mm}

@media print{
  body{background:#fff;padding:0}
  .bar,.hint{display:none}
  .scroller{overflow:visible}
  .page{margin:0;box-shadow:none;break-after:page}
  .page:last-child{break-after:auto}
  .a4box{margin:0;box-shadow:none;break-after:page}
  .a4box:last-child{break-after:auto}
  .a4box .page{break-after:auto}
}
</style>
<style id="pagesize">@page{size:A3;margin:0}</style>

<script>
const ITEMS = [{"n": 18, "pts": 2, "kind": "글의 목적", "src": "2026학년도 수능 18번", "prompt": "다음 글의 목적으로 가장 적절한 것은?", "body": ["<div class=\"bx\"><p style=\"margin:0\">Dear students,<\/p><p style=\"margin:0;text-indent:6mm\">I am Amanda Clark, the school club director, and I am writing to you about our school clubs. Over the last few semesters, there have been requests for more diverse school clubs. For this reason, the school decided to expand the number of clubs for extracurricular activities. This provides students with an opportunity to make additional clubs. Students can make any type of club based on their various interests, such as hip-hop, K-pop dancing, or coding. Therefore, I am encouraging you to submit a proposal for a new club that you would like to create. Please turn this in to my office by the end of this week. I look forward to seeing your great ideas.<\/p><p style=\"margin:0\">Best regards,<br>Amanda Clark<\/p><\/div>"], "choices": ["동아리 활동에 대한 만족도를 조사하려고", "동아리 개설 제안서 제출을 독려하려고", "체험 활동 결과 보고서를 요청하려고", "동아리 신규 회원 모집을 공지하려고", "방과 후 활동 프로그램을 설명하려고"], "inline": false, "ans": "②", "sol": "I am encouraging you to submit a proposal for a new club that you would like to create(새로 만들고 싶은 동아리의 제안서를 제출하라고 권한다)가 목적. 앞부분(동아리 수를 늘리기로 함)은 배경, Therefore 뒤가 본론."}, {"n": 19, "pts": 2, "kind": "심경 변화", "src": "2025학년도 수능 19번", "prompt": "다음 글에 드러난 Peter의 심경 변화로 가장 적절한 것은?", "body": ["<div class=\"tx\">It was Valentine’s Day on Friday and Peter was certain that his wife, Amy, was going to love his surprise. Peter had spent a long time searching online for an event that would be a new way to spend time with Amy. He had finally found the perfect thing for her. She often told him that she liked to go to places she had never visited before, and he was absolutely sure that she would love going to the new, five-star restaurant downtown. He smiled as he called the restaurant and asked for a reservation for Friday. Unfortunately, his smile quickly disappeared when he was told that the restaurant was fully reserved. “That’s too bad,” he said quietly. “I thought that I had found the right place.”<\/div>"], "choices": ["relaxed → indifferent", "confident → disappointed", "confused → satisfied", "jealous → discouraged", "embarrassed → joyful"], "inline": false, "ans": "②", "sol": "앞: certain that his wife was going to love his surprise, absolutely sure, He smiled → 자신감. 뒤: his smile quickly disappeared, fully reserved, “That’s too bad,” he said quietly → 실망. 전환 신호는 Unfortunately."}, {"n": 20, "pts": 2, "kind": "필자 주장", "src": "2024학년도 수능 20번", "prompt": "다음 글에서 필자가 주장하는 바로 가장 적절한 것은?", "body": ["<div class=\"tx\">Values alone do not create and build culture. Living your values only some of the time does not contribute to the creation and maintenance of culture. Changing values into behaviors is only half the battle. Certainly, this is a step in the right direction, but those behaviors must then be shared and distributed widely throughout the organization, along with a clear and concise description of what is expected. It is not enough to simply talk about it. It is critical to have a visual representation of the specific behaviors that leaders and all people managers can use to coach their people. Just like a sports team has a playbook with specific plays designed to help them perform well and win, your company should have a playbook with the key shifts needed to transform your culture into action and turn your values into winning behaviors.<\/div>"], "choices": ["조직 문화 혁신을 위해서 모든 구성원이 공유할 핵심 가치를 정립해야 한다.", "조직 구성원의 행동을 변화시키려면 지도자는 명확한 가치관을 가져야 한다.", "조직 내 문화가 공유되기 위해서 구성원의 자발적 행동이 뒷받침되어야 한다.", "조직의 핵심 가치 실현을 위해 구성원 간의 지속적인 의사소통이 필수적이다.", "조직의 문화 형성에는 가치를 반영한 행동의 공유를 위한 명시적 지침이 필요하다."], "inline": false, "ans": "⑤", "sol": "가치만으로는 문화가 만들어지지 않고, 가치를 행동으로 바꾼 뒤 그 행동을 조직 전체에 공유해야 한다. 마지막 문장 your company should have a playbook with the key shifts … turn your values into winning behaviors(가치를 행동으로 옮길 지침서가 있어야 한다)가 주장."}, {"n": 21, "pts": 3, "kind": "함축 의미", "src": "2023학년도 수능 21번", "prompt": "밑줄 친 <u>make oneself public to oneself<\/u>가 다음 글에서 의미하는 바로 가장 적절한 것은?", "body": ["<div class=\"tx\">Coming of age in the 18th and 19th centuries, the personal diary became a centerpiece in the construction of a modern subjectivity, at the heart of which is the application of reason and critique to the understanding of world and self, which allowed the creation of a new kind of knowledge. Diaries were central media through which enlightened and free subjects could be constructed. They provided a space where one could write daily about her whereabouts, feelings, and thoughts. Over time and with rereading, disparate entries, events, and happenstances could be rendered into insights and narratives about the self, and allowed for the formation of subjectivity. It is in that context that the idea of “the self [as] both made and explored with words” emerges. Diaries were personal and private; one would write for oneself, or, in Habermas’s formulation, one would <u>make oneself public to oneself<\/u>. By making the self public in a private sphere, the self also became an object for self-inspection and self-critique.<\/div>", "<div class=\"ft\">* disparate: 이질적인 ** render: 만들다<\/div>"], "choices": ["use writing as a means of reflecting on oneself", "build one’s identity by reading others’ diaries", "exchange feedback in the process of writing", "create an alternate ego to present to others", "develop topics for writing about selfhood"], "inline": false, "ans": "①", "sol": "일기는 사적인 공간에서 자신에 대해 쓰고 다시 읽으며 자아를 형성하는 매체였다. 밑줄 바로 뒤 By making the self public in a private sphere, the self also became an object for self-inspection and self-critique(자기 성찰의 대상이 되었다)가 재진술 → ① 글쓰기를 자신을 돌아보는 수단으로 사용하는 것."}, {"n": 22, "pts": 2, "kind": "글의 요지", "src": "2022학년도 수능 22번", "prompt": "다음 글의 요지로 가장 적절한 것은?", "body": ["<div class=\"tx\">Environmental hazards include biological, physical, and chemical ones, along with the human behaviors that promote or allow exposure. Some environmental contaminants are difficult to avoid (the breathing of polluted air, the drinking of chemically contaminated public drinking water, noise in open public spaces); in these circumstances, exposure is largely involuntary. Reduction or elimination of these factors may require societal action, such as public awareness and public health measures. In many countries, the fact that some environmental hazards are difficult to avoid at the individual level is felt to be more morally egregious than those hazards that can be avoided. Having no choice but to drink water contaminated with very high levels of arsenic, or being forced to passively breathe in tobacco smoke in restaurants, outrages people more than the personal choice of whether an individual smokes tobacco. These factors are important when one considers how change (risk reduction) happens.<\/div>", "<div class=\"ft\">* contaminate: 오염시키다 ** egregious: 매우 나쁜<\/div>"], "choices": ["개인이 피하기 어려운 유해 환경 요인에 대해서는 사회적 대응이 필요하다.", "환경오염으로 인한 피해자들에게 적절한 보상을 하는 것이 바람직하다.", "다수의 건강을 해치는 행위에 대해 도덕적 비난 이상의 조치가 요구된다.", "환경오염 문제를 해결하기 위해서는 사후 대응보다 예방이 중요하다.", "대기오염 문제는 인접 국가들과의 긴밀한 협력을 통해 해결할 수 있다."], "inline": false, "ans": "①", "sol": "개인이 피하기 어려운 환경 유해 요인(오염된 공기·식수, 간접흡연)은 개인 선택보다 더 도덕적으로 나쁘게 여겨지며, 이를 줄이려면 public awareness and public health measures 같은 societal action이 필요하다 → ① 사회적 대응이 필요하다."}, {"n": 23, "pts": 2, "kind": "글의 주제", "src": "2026학년도 수능 23번", "prompt": "다음 글의 주제로 가장 적절한 것은?", "body": ["<div class=\"tx\">Emphasizing <i>speed over frequency<\/i> can make sense in contexts where everyone is expected to plan around the timetable, including peak-only commute services and very long trips with low demand. In all other contexts, though, it seems to be a common motorist’s error. Roads are there all the time, so their speed is the most important fact that distinguishes them. But transit is only there if it’s coming soon. If you have a car, you can use a road whenever you want and experience its speed. But transit has to exist when you need it (span), and it needs to be coming soon (frequency). Otherwise, waiting time will wipe out any time savings from a faster service. Unless you’re comfortable planning your life around a particular scheduled trip, speed is worthless without frequency, so a transit map that screams about speed and whispers about frequency may simply be planting confusion.<\/div>", "<div class=\"ft\">* commute: 통근<\/div>"], "choices": ["consequences of adjusting frequency of transit", "significance of designing an accurate transit map", "importance of valuing frequency in public transportation", "impact of creating high-speed public transportation systems", "methods to improve speed and frequency of commute services"], "inline": false, "ans": "③", "sol": "도로는 속도가 중요하지만 대중교통은 '곧 와야(frequency)' 쓸모가 있다. speed is worthless without frequency 가 핵심 → ③ 대중교통에서 배차 빈도를 중시하는 것의 중요성."}, {"n": 24, "pts": 3, "kind": "글의 제목", "src": "2024학년도 수능 24번", "prompt": "다음 글의 제목으로 가장 적절한 것은?", "body": ["<div class=\"tx\">The concept of overtourism rests on a particular assumption about people and places common in tourism studies and the social sciences in general. Both are seen as clearly defined and demarcated. People are framed as bounded social actors either playing the role of hosts or guests. Places, in a similar way, are treated as stable containers with clear boundaries. Hence, places can be full of tourists and thus suffer from overtourism. But what does it mean for a place to be full of people? Indeed, there are examples of particular attractions that have limited capacity and where there is actually no room for more visitors. This is not least the case with some man-made constructions such as the Eiffel Tower. However, with places such as cities, regions or even whole countries being promoted as destinations and described as victims of overtourism, things become more complex. What is excessive or out of proportion is highly relative and might be more related to other aspects than physical capacity, such as natural degradation and economic leakages (not to mention politics and local power dynamics).<\/div>", "<div class=\"ft\">* demarcate: 경계를 정하다<\/div>"], "choices": ["The Solutions to Overtourism: From Complex to Simple", "What Makes Popular Destinations Attractive to Visitors?", "Are Tourist Attractions Winners or Losers of Overtourism?", "The Severity of Overtourism: Much Worse than Imagined", "Overtourism: Not Simply a Matter of People and Places"], "inline": false, "ans": "⑤", "sol": "과잉관광 개념은 사람(주인/손님)과 장소(경계가 분명한 그릇)를 단순하게 보는 가정에 기댄다. 그러나 도시·국가 단위에서는 '지나치다'는 것이 상대적이고 자연 훼손·경제 누수·정치 등과도 관련된다(things become more complex) → ⑤ 단순히 사람과 장소의 문제가 아니다."}, {"n": 25, "pts": 2, "kind": "도표 불일치", "src": "2025학년도 수능 25번", "prompt": "다음 도표의 내용과 일치하지 <u>않는<\/u> 것은?", "body": ["<img class=\"fig\" alt=\"Percentages of Women Employed Behind the Scenes on Top 100 U.S. Films by Role in 2020, 2021, and 2022\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA7EAAAKQCAIAAADGxmopAAEAAElEQVR4nOydeVxN2/v41zlJKlSIJIUk13CN0U0khEskldnNPIX4mDIPt+teFJdrzqwrIZU5ZU6GJGNkLJISDZo7nXN+f6yv9Vt373NOp905p03P+w+vbfXstZ9n7bXXfs7az3qWQCqVIgAAAAAAAACowggrWwEAAAAAAAAAqGTAJwYAAAAAAACqOuATAwAAAAAAAFWdavR/BAJBZekBAAAAAAAAAJqEXlZXTfGfAQAAAAAAAODHgzEXDLETAAAAAAAAQFUHfGIAAAAAAACgqgM+MQAAAAAAAFDVAZ8YAAAAAAAAqOqATwwAAAAAAABUdcAnBgAAAAAAAKo64BMDAAAAAAAAVR3wiQEAAAAAAICqDvjEAAAAAAAAQFUHfGIAAAAAAACgqgM+MQAAAAAAAFDVqVbB86VSKUJIIBDgA3nHP4YA3/QBi8BkHuoDJoNFVdNkvukDJoNFVdNkfIw48f+rILXQJYpRXhIAAAAAAAAA1I3yPjHtSSOInQAAAAAAAACACvnExBOnXXKZxz+GAN/0AYs4CPBNH7CIgwDf9AGLOAjwTR+wiIMA3/QBizgI8E0flVjEGYidAAAAAAAAAH4QlPePBRA7AQAAAAAAAAA04BMDAAAAAAAAVR2IJ67qYTe80gdMBouUEeCbPt+dRTTfnckyledJq35fCmv4JtLwwSK+6fNd3MTvQqAiQDwxAFQO2dnZ1atX19PTq2xFgCqESCTS1taubC24893pz3OFNaYeD9shOztbJBLVrl1bR0cHl0ilUolEoqWlVbmKARVHef9Y8N944oru2fFDcuHChXXr1pUp1qhRI1tbWw8PjwYNGmhAK+DHoKCgYPny5UeOHElPT9fS0nJ2dt67d2+dOnWUPP3OnTs+Pj7y/jpr1qxGjRrJExAIBL6+vnZ2dnFxcfPnz2cLVKtWLSAgoEmTJkoq88Pj7Oycn59frlNMTEw 20년 16%보다 낮고 2022년 11%보다 높음, ③ Writer 12→16→17, ⑤ 2022년 Producer 28% = 2020년 28%."}, {"n": 26, "pts": 2, "kind": "내용 불일치", "src": "2023학년도 수능 26번", "prompt": "Niklas Luhmann에 관한 다음 글의 내용과 일치하지 <u>않는<\/u> 것은?", "body": ["<div class=\"tx\">Niklas Luhmann, a renowned sociologist of the twentieth century, was born in Lüneburg, Germany in 1927. After World War II, he studied law at the University of Freiburg until 1949. Early in his career, he worked for the State of Lower Saxony, where he was in charge of educational reform. In 1960—1961, Luhmann had the chance to study sociology at Harvard University, where he was influenced by Talcott Parsons, one of the most famous social system theorists. Later, Luhmann developed his own social system theory. In 1968, he became a professor of sociology at the University of Bielefeld. He researched a variety of subjects, including mass media and law. Although his books are known to be difficult to translate, they have in fact been widely translated into other languages.<\/div>"], "choices": ["제2차 세계 대전 이후에 법을 공부했다.", "State of Lower Saxony에서 교육 개혁을 담당했다.", "Harvard University에 있을 때 Talcott Parsons의 영향을 받았다.", "다양한 주제에 관해 연구했다.", "그의 책은 번역하기가 쉽다고 알려져 있다."], "inline": false, "ans": "⑤", "sol": "마지막 문장 Although his books are known to be difficult to translate, they have in fact been widely translated — 번역하기 '어렵다'고 알려져 있다. ⑤는 '쉽다고 알려져 있다'이므로 불일치."}, {"n": 27, "pts": 2, "kind": "안내문 불일치", "src": "2026학년도 수능 27번", "prompt": "School Bell Sound Contest에 관한 다음 안내문의 내용과 일치하지 <u>않는<\/u> 것은?", "body": ["<div class=\"nb\"><div class=\"nt\">School Bell Sound Contest<\/div><p style=\"text-indent:4mm\">Wakeville High School is holding a school bell sound contest. The theme of this contest is Happy School Life.<\/p><p><b>Deadline:<\/b> December 12, 2025<br><b>Participants:<\/b> Wakeville High School students of all grades<\/p><p class=\"nh\">Application Details<\/p><p>∙ Submit entries in MP3 format only.<br>∙ Upload entries to our school website (file size limit: 1MB).<br>∙ Include the description of the sound creation process.<\/p><p class=\"nh\">Selection Method<\/p><p>∙ Three school bell sounds will be selected by student vote, based on creativity and suitability.<\/p><p class=\"nh\">Awards<\/p><p>∙ The winning school bell sounds will replace our current bell sounds.<br>∙ The winners of the contest will each get a wireless speaker.<\/p><\/div>"], "choices": ["주제는 행복한 학교생활이다.", "Wakeville 고등학교 모든 학년의 학생이 참여할 수 있다.", "출품작은 학교 웹사이트에 업로드해야 한다.", "네 개의 학교 종소리가 학생 투표에 의해 선택될 것이다.", "우승자는 무선 스피커를 받을 것이다."], "inline": false, "ans": "④", "sol": "Three school bell sounds will be selected by student vote — 학생 투표로 '세 개'를 뽑는다. ④는 '네 개'라고 했으므로 불일치. ① The theme … is Happy School Life, ② students of all grades, ③ Upload entries to our school website, ⑤ each get a wireless speaker로 모두 일치."}, {"n": 28, "pts": 2, "kind": "안내문 일치", "src": "2022학년도 수능 28번", "prompt": "Goldbeach SeaWorld Sleepovers에 관한 다음 안내문의 내용과 일치하는 것은?", "body": ["<div class=\"nb\"><div class=\"nt\">Goldbeach SeaWorld Sleepovers<\/div><p style=\"text-indent:4mm\">Do your children love marine animals? A sleepover at Goldbeach SeaWorld will surely be an exciting overnight experience for them. Join us for a magical underwater sleepover.<\/p><p class=\"nh\">Participants<\/p><p>∙ Children ages 8 to 12<br>∙ Children must be accompanied by a guardian.<\/p><p><b>When:<\/b> Saturdays 5 p.m. to Sundays 10 a.m. in May, 2022<br><b>Activities:<\/b> guided tour, underwater show, and photo session with a mermaid<\/p><p class=\"nh\">Participation Fee<\/p><p>∙ $50 per person (dinner and breakfast included)<\/p><p class=\"nh\">Note<\/p><p>∙ Sleeping bags and other personal items will not be provided.<br>∙ All activities take place indoors.<br>∙ Taking photos is not allowed from 10 p.m. to 7 a.m.<\/p><p style=\"text-indent:4mm\">For more information, you can visit our website at www.goldbeachseaworld.com.<\/p><\/div>"], "choices": ["7세 이하의 어린이가 참가할 수 있다.", "평일에 진행된다.", "참가비에 아침 식사가 포함된다.", "모든 활동은 야외에서 진행된다.", "사진 촬영은 언제든지 할 수 있다."], "inline": false, "ans": "③", "sol": "$50 per person (dinner and breakfast included) — 참가비에 저녁과 아침 식사가 포함된다 → ③ 일치. ① 8~12세, ② 토요일 오후~일요일 오전, ④ All activities take place indoors(실내), ⑤ 밤 10시~아침 7시에는 촬영 금지로 모두 불일치."}, {"n": 29, "pts": 2, "kind": "어법", "src": "2025학년도 수능 29번", "prompt": "다음 글의 밑줄 친 부분 중, 어법상 <u>틀린<\/u> 것은?", "body": ["<div class=\"tx\">Think of yourself. When you decide to get up and get a drink of water, for example, you don’t consciously organize or consider the host of steps involved. Imagine if we ① <u>had<\/u> to consider every single muscle that needed to be contracted or relaxed just to stand up and walk. It would be tiresome and very slow ― as patients recovering from a brain injury affecting the motor system ② <u>knows<\/u>. The autopilot parts of our brain do it for us automatically, ③ <u>freeing<\/u> up our conscious mind for more important jobs. It is the older parts of our brain ④ <u>that<\/u> support these automatic processes that allow us to move, hear, see, and use many of our social skills. More recently evolved abilities like talking, reading, and writing are far less automated. So, most of the time, ⑤ <u>what<\/u> you are perceiving, feeling, or thinking is based on a very crude and fast analysis that happens completely without your awareness.<\/div>", "<div class=\"ft\">* crude: 투박한<\/div>"], "choices": ["", "", "", "", ""], "inline": false, "ans": "②", "sol": "② knows → know. 주어는 patients (recovering from a brain injury …)로 복수이므로 복수 동사 know. ① 가정법 과거 Imagine if we had to, ③ 분사구문 freeing, ④ It is ~ that 강조 구문의 that, ⑤ 주어 역할의 명사절 what you are perceiving … 모두 적절."}, {"n": 30, "pts": 3, "kind": "어휘", "src": "2024학년도 수능 30번", "prompt": "다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 <u>않은<\/u> 것은?", "body": ["<div class=\"tx\">Bazaar economies feature an apparently flexible price-setting mechanism that sits atop more enduring ties of shared culture. Both the buyer and seller are aware of each other’s ① <u>restrictions<\/u>. In Delhi’s bazaars, buyers and sellers can ② <u>assess<\/u> to a large extent the financial constraints that other actors have in their everyday life. Each actor belonging to a specific economic class understands what the other sees as a necessity and a luxury. In the case of electronic products like video games, they are not a ③ <u>necessity<\/u> at the same level as other household purchases such as food items. So, the seller in Delhi’s bazaars is careful not to directly ask for very ④ <u>low<\/u> prices for video games because at no point will the buyer see possession of them as an absolute necessity. Access to this type of knowledge establishes a price consensus by relating to each other’s preferences and limitations of belonging to a ⑤ <u>similar<\/u> cultural and economic universe.<\/div>", "<div class=\"ft\">* constraint: 압박 ** consensus: 일치<\/div>"], "choices": ["", "", "", "", ""], "inline": false, "ans": "④", "sol": "④ low → high. 비디오 게임은 구매자에게 필수품이 아니므로, 판매자는 '아주 높은' 가격을 바로 부르지 않도록 조심한다(because at no point will the buyer see possession of them as an absolute necessity). '낮은 가격을 요구하지 않는다'는 앞뒤 논리와 반대."}, {"n": null, "ghead": true, "prompt": "[31～34] 다음 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.", "src": "", "body": [], "choices": []}, {"n": 31, "pts": 2, "kind": "빈칸 추론", "src": "2023학년도 수능 31번", "prompt": "", "body": ["<div class=\"tx first\"><b class=\"num\">31.<\/b> There is something deeply paradoxical about the professional status of sports journalism, especially in the medium of print. In discharging their usual responsibilities of description and commentary, reporters’ accounts of sports events are eagerly consulted by sports fans, while in their broader journalistic role of covering sport in its many forms, sports journalists are among the most visible of all contemporary writers. The ruminations of the elite class of ‘celebrity’ sports journalists are much sought after by the major newspapers, their lucrative contracts being the envy of colleagues in other ‘disciplines’ of journalism. Yet sports journalists do not have a standing in their profession that corresponds to the size of their readerships or of their pay packets, with the old saying (now reaching the status of cliché) that sport is the ‘toy department of the news media’ still readily to hand as a dismissal of the worth of what sports journalists do. This reluctance to take sports journalism seriously produces the paradoxical outcome that sports newspaper writers are much read but little <span class=\"bl\"><\/span>.<\/div>", "<div class=\"ft\">* discharge: 이행하다 ** rumination: 생각  *** lucrative: 돈을 많이 버는<\/div>"], "choices": ["paid", "admired", "censored", "challenged", "discussed"], "inline": false, "ans": "②", "sol": "스포츠 기자는 독자도 많고 보수도 많지만(much read) 직업적 위상은 낮다(do not have a standing …, ‘toy department’). 이 역설을 '많이 읽히지만 거의 존경받지 못한다'로 정리 → ② admired.", "grouped": true}, {"n": 32, "pts": 2, "kind": "빈칸 추론", "src": "2022학년도 수능 32번", "prompt": "", "body": ["<div class=\"tx first\"><b class=\"num\">32.<\/b> News, especially in its televised form, is constituted not only by its choice of topics and stories but by its <span class=\"bl\"><\/span>. Presentational styles have been subject to a tension between an informational-educational purpose and the need to engage us entertainingly. While current affairs programmes are often ‘serious’ in tone sticking to the ‘rules’ of balance, more popular programmes adopt a friendly, lighter, idiom in which we are invited to consider the impact of particular news items from the perspective of the ‘average person in the street’. Indeed, contemporary news construction has come to rely on an increased use of faster editing tempos and ‘flashier’ presentational styles including the use of logos, sound-bites, rapid visual cuts and the ‘star quality’ of news readers. Popular formats can be said to enhance understanding by engaging an audience unwilling to endure the longer verbal orientation of older news formats. However, they arguably work to reduce understanding by failing to provide the structural contexts for news events.<\/div>"], "choices": ["coordination with traditional display techniques", "prompt and full coverage of the latest issues", "educational media contents favoured by producers", "commitment to long-lasting news standards", "verbal and visual idioms or modes of address"], "inline": false, "ans": "⑤", "sol": "뉴스는 주제뿐 아니라 '전달 방식'으로도 구성된다. 빈칸 바로 뒤 Presentational styles, 이어지는 friendly, lighter idiom, faster editing tempos, flashier presentational styles가 모두 표현·전달 방식 → ⑤ 언어적·시각적 표현 방식이나 말 걸기 방식.", "grouped": true}, {"n": 33, "pts": 3, "kind": "빈칸 추론", "src": "2025학년도 수능 33번", "prompt": "", "body": ["<div class=\"tx first\"><b class=\"num\">33.<\/b> We are famously living in the era of the attention economy, where the largest and most profitable businesses in the world are those that <i>consume<\/i> my attention. The advertising industry is literally dedicated to capturing the conscious hours of my life and selling them to someone else. It might seem magical that so many exciting and useful software systems are available to use for free, but it is now conventional wisdom that if you can’t see who is paying for something that appears to be free, then <span class=\"bl\"><\/span>. Our creative engagement with other people is mediated by AI-based recommendation systems that are designed to trap our attention through the process that Nick Seaver calls <i>captology<\/i>, keeping us attending to work sold by one company rather than another, replacing the freedom of personal exploration with algorithm-generated playlists or even algorithm-generated art.<span class=\"p3\"> [3점]<\/span><\/div>"], "choices": ["all of your attention has already been spent", "the real product being sold is you", "your privacy is being violated", "the public may be sponsoring you", "you owe the benefits to your friend AI"], "inline": false, "ans": "②", "sol": "주의력 경제에서 큰 기업은 내 주의(시간)를 '소비'해 광고주에게 판다. 무료로 보이는 것의 비용을 누가 내는지 안 보이면, 사실은 '당신이 팔리는 상품이다' → ②. 뒤 문장(AI 추천 시스템이 우리 주의를 붙잡아 둔다)도 같은 방향.", "grouped": true}, {"n": 34, "pts": 3, "kind": "빈칸 추론", "src": "2026학년도 수능 34번", "prompt": "", "body": ["<div class=\"tx first\"><b class=\"num\">34.<\/b> Kant was a strong defender of the rule of law as the ultimate guarantee, not only of security and peace, but also of freedom. He believed that human societies were moving towards more rational forms regulated by effective and binding legal frameworks because only such frameworks enabled people to live in harmony, to prosper and to co-operate. However, his belief in inevitable progress was not based on an optimistic or high-minded view of human nature. On the contrary, it comes close to Hobbes’s outlook: man’s violent and conflict-prone nature makes it necessary to establish and maintain an effective legal framework in order to secure peace. We cannot count on people’s benevolence or goodwill, but even ‘a nation of devils’ can live in harmony in a legal system that binds every citizen equally. Ideally, the law is the embodiment of those political principles that all rational beings would freely choose. If such laws forbid them to do something that they would not rationally choose to do anyway, then the law cannot be <span class=\"bl\"><\/span>.<span class=\"p3\"> [3점]<\/span><\/div>", "<div class=\"ft\">* benevolence: 자비심<\/div>"], "choices": ["regarded as reasonably confining human liberty", "viewed as a strong defender of the justice system", "understood as a restraint on their freedom", "enforced effectively to suppress their evil nature", "accepted within the assumption of ideal legal frameworks"], "inline": false, "ans": "③", "sol": "칸트에게 법은 모든 이성적 존재가 자유롭게 선택할 원칙의 구현이다. 그런 법이 금지하는 것은 어차피 이성적으로 선택하지 않을 일이므로, 법은 그들의 '자유에 대한 제약으로 이해될 수 없다' → ③. 첫 문장의 rule of law as the ultimate guarantee … of freedom과도 연결.", "grouped": true}, {"n": 35, "pts": 2, "kind": "흐름 무관", "src": "2024학년도 수능 35번", "prompt": "다음 글에서 전체 흐름과 관계 <u>없는<\/u> 문장은?", "body": ["<div class=\"tx\">Speaking fast is a high-risk proposition. It’s nearly impossible to maintain the ideal conditions to be persuasive, well-spoken, and effective when the mouth is traveling well over the speed limit. ① Although we’d like to think that our minds are sharp enough to always make good decisions with the greatest efficiency, they just aren’t. ② In reality, the brain arrives at an intersection of four or five possible things to say and sits idling for a couple of seconds, considering the options. ③ Making a good decision helps you speak faster because it provides you with more time to come up with your responses. ④ When the brain stops sending navigational instructions back to the mouth and the mouth is moving too fast to pause, that’s when you get a verbal fender bender, otherwise known as filler. ⑤ <i>Um<\/i>, <i>ah<\/i>, <i>you know<\/i>, and <i>like<\/i> are what your mouth does when it has nowhere to go.<\/div>"], "choices": ["", "", "", "", ""], "inline": false, "ans": "③", "sol": "글은 말을 너무 빨리 하면 뇌가 다음 말을 고르는 동안 입이 멈추지 못해 군말(filler)이 나온다는 흐름. ③ '좋은 결정이 응답할 시간을 더 줘서 더 빨리 말하게 돕는다'는 빨리 말하기를 긍정하는 방향이라 무관."}, {"n": null, "ghead": true, "prompt": "[36～37] 주어진 글 다음에 이어질 글의 순서로 가장 적절한 것을 고르시오.", "src": "", "body": [], "choices": []}, {"n": 36, "pts": 2, "kind": "글의 순서", "src": "2022학년도 수능 36번", "prompt": "", "body": ["<div class=\"bx\">According to the market response model, it is increasing prices that drive providers to search for new sources, innovators to substitute, consumers to conserve, and alternatives to emerge.<\/div>", "<div class=\"tx order\"><b>(A)<\/b> Many examples of such “green taxes” exist. Facing landfill costs, labor expenses, and related costs in the provision of garbage disposal, for example, some cities have required households to dispose of all waste in special trash bags, purchased by consumers themselves, and often costing a dollar or more each.<\/div>", "<div class=\"tx order\"><b>(B)<\/b> Taxing certain goods or services, and so increasing prices, should result in either decreased use of these resources or creative innovation of new sources or options. The money raised through the tax can be used directly by the government either to supply services or to search for alternatives.<\/div>", "<div class=\"tx order\"><b>(C)<\/b> The results have been greatly increased recycling and more careful attention by consumers to packaging and waste. By internalizing the costs of trash to consumers, there has been an observed decrease in the flow of garbage from households.<\/div>"], "choices": ["(A) － (C) － (B)", "(B) － (A) － (C)", "(B) － (C) － (A)", "(C) － (A) － (B)", "(C) － (B) － (A)"], "inline": false, "ans": "②", "sol": "주어진 글: 가격 상승이 대안을 찾게 만든다. (B) 그래서 세금으로 가격을 올리면 사용이 줄거나 대안이 생긴다 → (A) such “green taxes”의 예: 쓰레기 봉투 유료화 → (C) The results: 재활용 증가·쓰레기 감소. (A)의 such가 (B)의 Taxing을, (C)의 The results가 (A)의 사례를 받는다 → (B)-(A)-(C).", "grouped": true}, {"n": 37, "pts": 3, "kind": "글의 순서", "src": "2023학년도 수능 37번", "prompt": "", "body": ["<div class=\"bx\">The most commonly known form of results-based pricing is a practice called <i>contingency pricing<\/i>, used by lawyers.<\/div>", "<div class=\"tx order\"><b>(A)<\/b> Therefore, only an outcome in the client’s favor is compensated. From the client’s point of view, the pricing makes sense in part because most clients in these cases are unfamiliar with and possibly intimidated by law firms. Their biggest fears are high fees for a case that may take years to settle.<\/div>", "<div class=\"tx order\"><b>(B)<\/b> By using contingency pricing, clients are ensured that they pay no fees until they receive a settlement. In these and other instances of contingency pricing, the economic value of the service is hard to determine before the service, and providers develop a price that allows them to share the risks and rewards of delivering value to the buyer.<\/div>", "<div class=\"tx order\"><b>(C)<\/b> Contingency pricing is the major way that personal injury and certain consumer cases are billed. In this approach, lawyers do not receive fees or payment until the case is settled, when they are paid a percentage of the money that the client receives.<span class=\"p3\"> [3점]<\/span><\/div>", "<div class=\"ft\">* intimidate: 위협하다<\/div>"], "choices": ["(A) － (C) － (B)", "(B) － (A) － (C)", "(B) － (C) － (A)", "(C) － (A) － (B)", "(C) － (B) － (A)"], "inline": false, "ans": "④", "sol": "주어진 글: 성과 기반 가격 책정의 대표는 변호사의 contingency pricing. (C) 그 방식에선 사건이 해결될 때까지 보수를 받지 않는다 → (A) Therefore 의뢰인에게 유리한 결과에만 보수가 지급된다, 의뢰인 입장에서도 합리적 → (B) By using contingency pricing … 다른 사례로 일반화. → (C)-(A)-(B).", "grouped": true}, {"n": null, "ghead": true, "prompt": "[38～39] 글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳을 고르시오.", "src": "", "body": [], "choices": []}, {"n": 38, "pts": 2, "kind": "문장 삽입", "src": "2026학년도 수능 38번", "prompt": "", "body": ["<div class=\"bx\">Sometimes these internal narratives we form not only shape our beliefs and opinions but also become deeply rooted in our identity.<\/div>", "<div class=\"tx\">While stories clearly dominate statistics from both memorability and persuasiveness perspectives, it’s rarely a battle between facts and anecdotes ― or even facts and other facts. The real clash is actually <i>between stories<\/i>: the predominant incumbent and a new challenger. <span style=\"white-space:nowrap\">(&nbsp;①&nbsp;)<\/span> As storytelling creatures, we routinely form narratives to help us understand the world around us. <span style=\"white-space:nowrap\">(&nbsp;②&nbsp;)<\/span> When we experience different events or encounter various facts, our minds seek to make sense of them by forming stories around them. <span style=\"white-space:nowrap\">(&nbsp;③&nbsp;)<\/span> For example, if you have had some bad experiences with graduates from a particular university, you may create a negative narrative in your mind about people who went to that school. <span style=\"white-space:nowrap\">(&nbsp;④&nbsp;)<\/span> Suddenly, you judge everyone from the university by what you’ve experienced on just a few unfortunate occasions. <span style=\"white-space:nowrap\">(&nbsp;⑤&nbsp;)<\/span> For example, the narratives you have formed around gun control or climate change are most likely related with your political ideology ― who you are as an individual.<\/div>", "<div class=\"ft\">* anecdote: 일화 ** incumbent: 점유자<\/div>"], "choices": ["", "", "", "", ""], "inline": false, "ans": "⑤", "sol": "주어진 문장: 이런 내적 서사가 믿음·의견을 넘어 '정체성'에 깊이 뿌리내리기도 한다. ⑤ 뒤 문장이 For example, … gun control or climate change … related with your political ideology ― who you are as an individual(정체성)의 예이므로 ⑤. ④ 뒤 Suddenly … 는 앞 대학 예시에 이어지는 내용이라 끊을 수 없다.", "grouped": true}, {"n": 39, "pts": 3, "kind": "문장 삽입", "src": "2024학년도 수능 39번", "prompt": "", "body": ["<div class=\"bx\">At the next step in the argument, however, the analogy breaks down.<\/div>", "<div class=\"tx\">Misprints in a book or in any written message usually have a negative impact on the content, sometimes (literally) fatally. <span style=\"white-space:nowrap\">(&nbsp;①&nbsp;)<\/span> The displacement of a comma, for instance, may be a matter of life and death. <span style=\"white-space:nowrap\">(&nbsp;②&nbsp;)<\/span> Similarly most mutations have harmful consequences for the organism in which they occur, meaning that they reduce its reproductive fitness. <span style=\"white-space:nowrap\">(&nbsp;③&nbsp;)<\/span> Occasionally, however, a mutation may occur that increases the fitness of the organism, just as an accidental failure to reproduce the text of the first edition might provide more accurate or updated information. <span style=\"white-space:nowrap\">(&nbsp;④&nbsp;)<\/span> A favorable mutation is going to be more heavily represented in the next generation, since the organism in which it occurred will have more offspring and mutations are transmitted to the offspring. <span style=\"white-space:nowrap\">(&nbsp;⑤&nbsp;)<\/span> By contrast, there is no mechanism by which a book that accidentally corrects the mistakes of the first edition will tend to sell better.<span class=\"p3\"> [3점]<\/span><\/div>", "<div class=\"ft\">* analogy: 유사 ** mutation: 돌연변이<\/div>"], "choices": ["", "", "", "", ""], "inline": false, "ans": "⑤", "sol": "주어진 문장: 그러나 논증의 다음 단계에서 비유(오탈자 ↔ 돌연변이)가 무너진다. ⑤ 앞까지는 둘이 비슷하고(대개 해롭다, 가끔 이롭다, 유리한 돌연변이는 다음 세대에 늘어난다), ⑤ 뒤 By contrast, 책은 실수를 고쳐도 더 잘 팔리는 장치가 없다 → 비유가 깨지는 지점 ⑤.", "grouped": true}, {"n": 40, "pts": 2, "kind": "요약문", "src": "2025학년도 수능 40번", "prompt": "다음 글의 내용을 한 문장으로 요약하고자 한다. 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것은?", "body": ["<div class=\"tx\">People often assume that synthetic food ingredients are more harmful than natural ones, but this is not always the case. Typically, synthetic ingredients can be made in a precisely controlled fashion and have well-defined compositions and properties, allowing careful evaluation of their potential toxicity. On the other hand, natural ingredients often vary appreciably in their composition and properties depending on their origin, the time of year they were harvested, the climate they experienced throughout their lifetime, the soil quality, and how they were isolated and stored. These variations can make testing their safety extremely difficult ― one is never sure about the potential toxicity of minor components that may vary from time to time. In some cases, a natural food component has been consumed for hundreds or thousands of years without causing any obvious health problems and can, therefore, be assumed to be safe. However, one must still be very careful.<\/div>", "<div class=\"ft\">* synthetic: 합성의<\/div>", "<div class=\"tx\"><span class=\"arrow\">↓<\/span><\/div>", "<div class=\"bx\">The <u>&nbsp;&nbsp;(A)&nbsp;&nbsp;<\/u> of the production process for synthetic food ingredients and the variability of natural food ingredients may <u>&nbsp;&nbsp;(B)&nbsp;&nbsp;<\/u> people’s commonly held assumption that the natural ingredients are more secure.<\/div>"], "choices": ["controllability … challenge", "predictability … support", "manageability … intensify", "affordability … reverse", "accessibility … question"], "inline": false, "ans": "①", "sol": "합성 원료는 정밀하게 통제된 방식으로 만들어 성분·성질이 분명하므로 독성 평가가 쉽고, 천연 원료는 산지·수확 시기·기후 등에 따라 성분이 달라 안전성 검사가 어렵다. 요약: 합성 원료 생산 과정의 (A) controllability(통제 가능성)와 천연 원료의 가변성은 '천연이 더 안전하다'는 통념에 (B) challenge(이의를 제기)한다 → ①."}, {"n": null, "prompt": "[41～42] 다음 글을 읽고, 물음에 답하시오.", "src": "2023학년도 수능 41~42번", "body": ["<div class=\"tx\">There is evidence that even very simple algorithms can outperform expert judgement on simple prediction problems. For example, algorithms have proved more (a) <u>accurate<\/u> than humans in predicting whether a prisoner released on parole will go on to commit another crime, or in predicting whether a potential candidate will perform well in a job in future. In over 100 studies across many different domains, half of all cases show simple formulas make (b) <u>better<\/u> significant predictions than human experts, and the remainder (except a very small handful), show a tie between the two. When there are a lot of different factors involved and a situation is very uncertain, simple formulas can win out by focusing on the most important factors and being consistent, while human judgement is too easily influenced by particularly salient and perhaps (c) <u>irrelevant<\/u> considerations. A similar idea is supported by further evidence that ‘checklists’ can improve the quality of expert decisions in a range of domains by ensuring that important steps or considerations aren’t missed when people are feeling (d) <u>relaxed<\/u>. For example, treating patients in intensive care can require hundreds of small actions per day, and one small error could cost a life. Using checklists to ensure that no crucial steps are missed has proved to be remarkably (e) <u>effective<\/u> in a range of medical contexts, from preventing live infections to reducing pneumonia.<\/div>", "<div class=\"ft\">* parole: 가석방 ** salient: 두드러진 *** pneumonia: 폐렴<\/div>"], "choices": []}, {"n": 41, "pts": 2, "kind": "제목 (41~42 세트)", "src": "2023학년도 수능 41번", "prompt": "윗글의 제목으로 가장 적절한 것은?", "body": [], "choices": ["The Power of Simple Formulas in Decision Making", "Always Prioritise: Tips for Managing Big Data", "Algorithms’ Mistakes: The Myth of Simplicity", "Be Prepared! Make a Checklist Just in Case", "How Human Judgement Beats Algorithms"], "inline": false, "ans": "①", "sol": "간단한 알고리즘·공식이 많은 예측 문제에서 전문가 판단보다 낫거나 같고, 체크리스트도 전문가의 결정 질을 높인다 → ① 의사 결정에서 단순한 공식의 힘. ⑤는 정반대, ④는 체크리스트 사례만 확대."}, {"n": 42, "pts": 2, "kind": "어휘 (41~42 세트)", "src": "2023학년도 수능 42번", "prompt": "밑줄 친 (a)～(e) 중에서 문맥상 낱말의 쓰임이 적절하지 <u>않은<\/u> 것은?", "body": [], "choices": ["(a)", "(b)", "(c)", "(d)", "(e)"], "inline": false, "ans": "④", "sol": "(d) relaxed → stressed/pressured. 체크리스트는 사람들이 '압박을 받거나 지쳐 있을 때' 중요한 단계를 놓치지 않게 해 준다. 바로 뒤 예시(중환자실에서 하루 수백 가지 작은 조치, 작은 실수 하나가 생명을 앗아감)가 긴장된 상황이므로 relaxed는 반대."}, {"n": null, "prompt": "[43～45] 다음 글을 읽고, 물음에 답하시오.", "src": "2026학년도 수능 43~45번", "body": ["<div class=\"tx\"><u>(A)<\/u><\/div>", "<div class=\"bx\">“Mia, let’s go walk our dog!” Julia called out, but there was no answer. She checked her daughter’s room and found that Mia was absorbed in her smartphone, wearing her earbuds. Julia was concerned about her daughter. She turned to her husband, Sam. “Mia seems to live inside her phone, not with us.” Sam nodded, “I know. I feel like (a) <u>she<\/u> is growing distant from us. Why don’t we set up a family reading club?” Julia brightened at the suggestion, and Sam promised to talk with Mia about it.<\/div>", "<div class=\"tx\"><u>(B)<\/u><\/div>", "<div class=\"bx\">Mia’s family held their first book club meeting on Saturday afternoon. Everyone enjoyed the book Mia had chosen. Julia was the first to speak: “Dr. Duvall nearly invented a drug for eternal life, yet disappeared one day and ended up running Café Paris. That’s such a mystery.” Mia responded, her eyes sparkling, “Mom, I understand him. He always dreamed of being a barista, and his dream came true.” Sam supported (b) <u>his daughter<\/u>, and their conversation grew lively. During the discussion, Mia felt reconnected with her parents and already looked forward to their next book club meeting.<\/div>", "<div class=\"tx\"><u>(C)<\/u><\/div>", "<div class=\"bx\">At the library, Mia scanned the shelves for nearly an hour, feeling lost among the endless titles. Then, a librarian approached and asked, “Looking for something in particular?” “I need a book for my family’s reading club,” Mia admitted. “What genre do you enjoy?” she asked kindly. “Hmm, I like mysteries,” Mia replied. The librarian handed her a book titled <i>Café Paris<\/i> and said with a smile, “You’ll love this one.” Mia thanked (c) <u>her<\/u> and checked it out.<\/div>", "<div class=\"tx\"><u>(D)<\/u><\/div>", "<div class=\"bx\">When Sam suggested starting a family reading club, Mia immediately shook her head and said, “No, Dad. I don’t have time to read books. You know how busy (d) <u>I<\/u> am with exams all semester.” He didn’t give up. “But wouldn’t it be fun if we all read the same story and shared our thoughts? You could simply read for 20 minutes, maybe during your lunch break.” After some persuasion, Mia reluctantly agreed. Deep down, (e) <u>she<\/u> knew she was spending too much time on her phone. So she asked, “Dad, can I choose the first book?” Sam gladly said, “Yes.”<\/div>"], "choices": []}, {"n": 43, "pts": 2, "kind": "순서 (43~45 세트)", "src": "2026학년도 수능 43번", "prompt": "주어진 글 (A)에 이어질 내용을 순서에 맞게 배열한 것으로 가장 적절한 것은?", "body": [], "choices": ["(B) － (D) － (C)", "(C) － (B) － (D)", "(C) － (D) － (B)", "(D) － (B) － (C)", "(D) － (C) － (B)"], "inline": false, "ans": "⑤", "sol": "(A) 폰에 빠진 Mia를 걱정, Sam이 가족 독서 모임을 제안하기로 함 → (D) Sam이 제안, Mia가 마지못해 동의하고 첫 책을 고르겠다고 함 → (C) 도서관에서 사서의 추천으로 Café Paris를 빌림 → (B) 첫 독서 모임, Mia가 부모와 다시 가까워짐. → (D)-(C)-(B)."}, {"n": 44, "pts": 2, "kind": "지칭 (43~45 세트)", "src": "2026학년도 수능 44번", "prompt": "밑줄 친 (a)～(e) 중에서 가리키는 대상이 나머지 넷과 <u>다른<\/u> 것은?", "body": [], "choices": ["(a)", "(b)", "(c)", "(d)", "(e)"], "inline": false, "ans": "③", "sol": "(a) she, (b) his daughter, (d) I, (e) she는 모두 Mia. (c) her는 Mia에게 책을 건네준 사서(librarian) → ③."}, {"n": 45, "pts": 2, "kind": "내용 불일치 (43~45 세트)", "src": "2026학년도 수능 45번", "prompt": "윗글에 관한 내용으로 적절하지 <u>않은<\/u> 것은?", "body": [], "choices": ["Julia는 스마트폰에 빠져 있는 Mia를 걱정했다.", "가족들은 Mia가 선정한 책을 좋아했다.", "Mia는 책장을 살펴보며 거의 한 시간을 보냈다.", "Mia는 미스터리 장르를 좋아한다고 말했다.", "Mia는 Sam의 독서 모임 제안을 처음부터 환영했다."], "inline": false, "ans": "⑤", "sol": "(D) Mia immediately shook her head and said, “No, Dad. I don’t have time to read books.” … After some persuasion, Mia reluctantly agreed — 처음엔 거절했다가 마지못해 동의했다. ⑤ '처음부터 환영했다'는 불일치."}];

function spaceMarks(h){ return h.replace(/(<u>\s*)(\([a-e]\)|[①②③④⑤])(?=[A-Za-z])/g,'$1$2 ').replace(/([①②③④⑤]|\([a-e]\)) (?=\S)/g,'$1&nbsp;'); }
function isLabel(h){ return /class="tx"><u>\([A-D]\)<\/u><\/div>/.test(h); }
function bodyPieces(body, plainBox){
  const out=[]; let pend='';
  body.forEach(h=>{
    h=spaceMarks(h);
    if(isLabel(h)){ pend += h.replace('class="tx"','class="tx lab"'); return; }
    if(/class="ft"/.test(h) && out.length && !pend){ out[out.length-1]+=h; return; }
    if(plainBox) h = h.replace('class="bx"','class="bx plain"');
    out.push(pend+h); pend='';
  });
  if(pend) out.push(pend);
  return out;
}
function choicesHTML(it){
  if(!it.choices.length) return '';
  if(it.choices.every(c=>!c.trim()))
    return '<ol class="ch inl">'+it.choices.map((c,i)=>`<li><span class="m">${NUM[i]}</span></li>`).join('')+'</ol>';
  if(it.choices.every(c=>c.includes('…')))
    return '<ol class="ch sum"><li class="hd"><span class="m"></span><span class="a">&nbsp;&nbsp;(A)</span><span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span><span class="b">&nbsp;&nbsp;&nbsp;(B)</span></li>'+
      it.choices.map((c,i)=>{ const [a,b]=c.split('…').map(s=>s.trim());
        return `<li><span class="m">${NUM[i]}</span><span class="a">${a}</span><span>……</span><span class="b">&nbsp;&nbsp;${b}</span></li>`; }).join('')+'</ol>';
  return '<ol class="ch">'+it.choices.map((c,i)=>{
    const ko = /[가-힣]/.test(c.replace(/<[^>]+>/g,''));
    return `<li class="${ko?'ko':''}"><span class="m">${NUM[i]}</span><span>${c}</span></li>`; }).join('')+'</ol>';
}
function srcLine(s){ return `<div class="from">출처: ${s}</div>`; }
function promptHTML(p){ // 발문 속 영어 낱말은 Times로 (글자 노드에만 적용)
  const d=document.createElement('div'); d.innerHTML=p;
  const w=document.createTreeWalker(d,NodeFilter.SHOW_TEXT); const nodes=[]; while(w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(t=>{ if(!/[A-Za-z]{2,}/.test(t.nodeValue)) return;
    const frag=document.createElement('span');
    frag.innerHTML=t.nodeValue.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/([A-Za-z][A-Za-z’'\-]*(?:[ .,][A-Za-z][A-Za-z’'\-]*)*\.?)/g, m=>m.length<2?m:`<span class="en">${m}</span>`);
    t.replaceWith(...frag.childNodes); });
  return d.innerHTML;
}

    if(it.n===null){ // [41~42]·[43~45] 세트
      const m = it.prompt.replace(/~/,'～').match(/^(\[[^\]]+\])\s*(.*)$/);
      const head = `<div class="qp ghead"><b class="gr">${m[1]}</b>${m[2]}</div>`;
      const pieces = bodyPieces(it.body, /41/.test(it.prompt));
      setSrc = it.src.replace(/~/,'～');
      units.push({parts:[head+pieces[0], ...pieces.slice(1)], set:true});
      return;
    }
    const p3 = it.pts===3 ? ' [3점]' : '';
    let head;
    if(it.grouped) head = (it.n<=34) ? '' : `<div class="qp"><b class="num">${it.n}.</b></div>`;
    else head = `<div class="qp"><b class="num">${it.n}.</b>${promptHTML(it.prompt)}${p3}</div>`;
    head = pend + head; pend='';
    const pieces = bodyPieces(it.body, false);
    const parts = pieces.length ? [head+pieces[0], ...pieces.slice(1)] : [head];
    const tail = choicesHTML(it) + (it.n>=41 ? ((it.n===42||it.n===45) ? srcLine(setSrc) : '') : srcLine(it.src));
    if(it.choices.join('').length < 260 || !pieces.length) parts[parts.length-1]+=tail; else parts.push(tail);
    units.push({parts, inSet: it.n>=41});
  });
  return units;
}

let pageNo=0, total=0;
function footSVG(n){
  return `<svg width="76" height="30" viewBox="0 0 76 30" aria-label="${n}쪽"><rect x=".6" y=".6" width="74.8" height="28.8" fill="none" stroke="#000" stroke-width="1"/>
    <line x1=".6" y1="29.4" x2="75.4" y2=".6" stroke="#000" stroke-width=".8"/>
    <text x="8" y="14" font-family="Times New Roman,serif" font-size="14" font-weight="700">${n}</text>
    <text x="56" y="26" font-family="Times New Roman,serif" font-size="14" font-weight="700" class="tot">${total||''}</text></svg>`;
}
function newPage(out){
  pageNo++;
  const pg=document.createElement('section'); pg.className='page'+(paper==='A4'?' v4':'');
  if(pageNo===1){
    pg.innerHTML=`<div class="cover"><div class="t1"><span></span><span class="ttl"><b class="brand">대단한영어</b> 2027학년도 수능 대비 워밍업 모의고사 문제지</span><span class="pn">1</span></div>
      <div class="t2"><span class="gyo">제 3 교시</span><span class="area">영어 영역</span><span class="hol">홀수형</span></div>
      <div class="id">성명<span class="box"></span> &nbsp; 수험 번호<span class="box w"></span></div></div>`;
  } else {
    const odd = pageNo%2===1;
    pg.innerHTML = `<div class="ph">${odd?'<span class="l hol">홀수형</span>':`<span class="l pn">${pageNo}</span>`}<span class="area">영어 영역</span>${odd?`<span class="r pn">${pageNo}</span>`:'<span class="r hol">홀수형</span>'}</div>`;
  }
  pg.insertAdjacentHTML('beforeend',`<div class="cols"><div class="col"></div><div class="col"></div></div><div class="pf">${footSVG(pageNo)}</div><div class="copy">원 출제: 한국교육과정평가원 2022~2026학년도 대학수학능력시험 영어 영역 · 이 문제지에 관한 저작권은 한국교육과정평가원에 있습니다.</div>`);
  out.appendChild(pg);
  return [...pg.querySelectorAll('.col')];
}
const fits = c => c.scrollHeight <= c.clientHeight + 1;
function render(){
  const out=document.getElementById('out'); out.innerHTML=''; pageNo=0;
  out.className = 'sheetwrap';
  let cols=newPage(out), ci=0, count=0;   // count = 이 단에 놓인 문항 수
  const nextCol=()=>{ ci++; count=0; if(ci>1){ cols=newPage(out); ci=0; } };
  // 1쪽 첫 단 안내
  cols[0].insertAdjacentHTML('beforeend','<div class="guide">18번부터 45번까지는 독해 문제입니다. 문항마다 끝에 원래 출제된 연도와 번호를 적었습니다. 답은 답안지에 표기하시기 바랍니다.</div>');
  const units = buildUnits();
  const MM=96/25.4, MINGAP=8*MM;
  const usedH=c=>{ const l=c.lastElementChild; if(!l) return 0; return l.getBoundingClientRect().bottom - c.getBoundingClientRect().top; };
  const mk=(html,cls)=>{ const d=document.createElement('div'); d.className=cls||'blk'; d.innerHTML=html; return d; };
  const gapEl=h=>{ const g=document.createElement('div'); g.className='gap'; g.style.height=h+'px'; return g; };
  units.forEach(u=>{
    const col=()=>cols[ci];
    // 세트 지문([41～42]·[43～45])은 새 단 맨 위에서 시작, 덩어리별로 이어 싣는다
    if(u.set){
      if(count>0) nextCol();
      u.parts.forEach((p,k)=>{
        const b=mk(p); col().appendChild(b);
        if(!fits(col())){ col().removeChild(b); nextCol(); col().appendChild(b); }
      });
      count=2; return;
    }
    // 세트 안 문항(41·42·43·44·45)은 지문 바로 뒤에 이어서
    if(u.inSet){
      const g=gapEl(5*MM), b=mk(u.parts.join(''));
      col().appendChild(g); col().appendChild(b);
      if(!fits(col())){ col().removeChild(g); col().removeChild(b); nextCol(); col().appendChild(b); }
      count=2; return;
    }
    const whole=mk(u.parts.join(''));
    // 아래 문항: 위 문항과 붙이지 않고, 남는 공간의 절반을 사이에 둔다(실제 시험지처럼 아래쪽 문항이 단 중간 아래에서 시작)
    if(count===1){
      const c=col(), top=usedH(c), H=c.clientHeight;
      const g=gapEl(0); c.appendChild(g); c.appendChild(whole);
      const h2=whole.getBoundingClientRect().height;
      const free=H-top-h2;
      if(free>=MINGAP){ g.style.height=Math.max(MINGAP, free*0.5)+'px'; count=2; return; }
      c.removeChild(g); c.removeChild(whole); nextCol();
    } else if(count>=2){ nextCol(); }
    // 위 문항: 단 맨 위
    const c=col(); c.appendChild(whole);
    if(fits(c)){ count = (usedH(c) > c.clientHeight - 60*MM) ? 2 : 1; return; }
    // 한 단에 다 안 들어가는 경우(드묾): 덩어리별로 나눠 싣기
    c.removeChild(whole);
    u.parts.forEach(p=>{ const b=mk(p); col().appendChild(b); if(!fits(col())){ col().removeChild(b); nextCol(); col().appendChild(b); } });
    count=2;
  });
  // 끝 안내
  const end='<div class="endnote">※ 확인 사항<br>&nbsp;○ 답안지의 해당란에 필요한 내용을 정확히 기입(표기)했는지 확인하시오.</div>';
  cols[ci].insertAdjacentHTML('beforeend',end);
  if(!fits(cols[ci])){ cols[ci].lastElementChild.remove(); nextCol(); cols[ci].insertAdjacentHTML('beforeend',end); }
  total=pageNo; out.querySelectorAll('.pf .tot').forEach(t=>t.textContent=total);
  if(paper==='A4'){ // 여백 줄인 가상 쪽(.v4)에 배치한 뒤 A4 크기로 축소
    out.querySelectorAll('.page').forEach(pg=>{ const box=document.createElement('div'); box.className='a4box'; pg.replaceWith(box); box.appendChild(pg); });
  }
  document.getElementById('pA3').setAttribute('aria-pressed', paper==='A3');
  document.getElementById('pA4').setAttribute('aria-pressed', paper==='A4');
  document.getElementById('pagesize').textContent='@page{size:'+paper+';margin:0}';
  try{ localStorage.setItem('warmup-paper', paper); }catch(e){}
}
document.getElementById('pA3').onclick=()=>{ paper='A3'; render(); };
document.getElementById('pA4').onclick=()=>{ paper='A4'; render(); };
(function(){ let framed=true; try{ framed = window.self !== window.top; }catch(e){}
  const pb=document.getElementById('btnPrint'); if(!framed){ pb.hidden=false; pb.onclick=()=>window.print(); } })();
render();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(render);
</script>
