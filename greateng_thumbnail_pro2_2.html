<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대단한영어 썸네일 생성기 Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Noto+Serif+KR:wght@400;700&family=Nanum+Gothic:wght@400;700;800&family=Nanum+Myeongjo:wght@400;700&family=Black+Han+Sans&family=Gothic+A1:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--surface:#16181f;--surface2:#1e2130;--surface3:#252840;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#eef0f8;--text2:#7a85a0;--text3:#444d62;
  --accent:#F0A500;--radius:10px;--radius-sm:6px;
}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;display:flex;height:100vh;overflow:hidden}

/* ── 패널 ── */
.panel{width:360px;min-width:360px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh}
.panel-head{padding:18px 20px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.panel-head h1{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.3px}
.panel-head p{font-size:10px;color:var(--text3);margin-top:3px}
.panel-scroll{flex:1;overflow-y:auto}
.panel-scroll::-webkit-scrollbar{width:3px}
.panel-scroll::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* 섹션 */
.sec{border-bottom:1px solid var(--border)}
.sec-head{display:flex;align-items:center;gap:10px;padding:12px 20px;cursor:pointer;user-select:none;transition:background .12s}
.sec-head:hover{background:var(--surface2)}
.sec-toggle{width:34px;height:18px;border-radius:9px;border:none;cursor:pointer;transition:background .2s;flex-shrink:0;position:relative}
.sec-toggle.on{background:var(--accent)}
.sec-toggle.off{background:var(--surface3)}
.sec-toggle::after{content:'';position:absolute;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;transition:left .2s}
.sec-toggle.on::after{left:19px}
.sec-toggle.off::after{left:3px}
.sec-title{font-size:12px;font-weight:700;color:var(--text);flex:1}
.sec-badge{font-size:9px;color:var(--text3);background:var(--surface3);padding:2px 6px;border-radius:4px}
.chevron{font-size:10px;color:var(--text3);transition:transform .2s}
.chevron.open{transform:rotate(180deg)}
.sec-body{padding:14px 20px;background:var(--surface);display:none}
.sec-body.open{display:block}

/* 전역 섹션 (팔레트 등) */
.global-sec{padding:14px 20px;border-bottom:1px solid var(--border)}
.sec-label{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.8px;text-transform:uppercase;margin-bottom:10px}

/* 팔레트 */
.palettes{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.pal{aspect-ratio:1;border-radius:8px;cursor:pointer;border:2px solid transparent;transition:all .15s;position:relative;overflow:hidden}
.pal:hover{transform:scale(1.06)}
.pal.active{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.2)}
.pal-lbl{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.55);font-size:8px;color:#fff;text-align:center;padding:2px 0}

/* 색상 점 */
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .12s;flex-shrink:0}
.dot:hover{transform:scale(1.12)}
.dot.active{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.3)}

/* 입력 필드 */
.field{margin-bottom:10px}
.field label{display:block;font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
.field input[type=text]{width:100%;padding:7px 10px;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-size:12px;font-family:'Noto Sans KR',sans-serif;outline:none;transition:border-color .15s}
.field input[type=text]:focus{border-color:var(--accent)}
.field select{width:100%;padding:7px 10px;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-size:12px;outline:none;cursor:pointer}
.field select option{background:var(--surface2)}

/* 슬라이더 */
.sl-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.sl-row label{font-size:10px;color:var(--text2);width:50px;flex-shrink:0;white-space:nowrap}
.sl-row input[type=range]{flex:1;-webkit-appearance:none;height:3px;background:var(--surface3);border-radius:2px;outline:none;cursor:pointer}
.sl-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--accent);cursor:pointer}
.sl-val{font-size:10px;color:var(--accent);width:42px;text-align:right;font-weight:700;flex-shrink:0}
.sl-num{width:42px;padding:2px 4px;background:var(--surface3);border:1px solid var(--border2);border-radius:4px;color:var(--accent);font-size:10px;font-weight:700;text-align:center;outline:none;flex-shrink:0}
.sl-num::-webkit-inner-spin-button,.sl-num::-webkit-outer-spin-button{-webkit-appearance:none}

/* 2열 그리드 */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* 구분선 */
.divider{height:1px;background:var(--border);margin:10px 0}

/* 푸터 */
.panel-foot{padding:14px 20px;border-top:1px solid var(--border);flex-shrink:0}
.btn-dl{width:100%;padding:11px;background:var(--accent);color:#0B1F3A;font-size:13px;font-weight:700;font-family:'Noto Sans KR',sans-serif;border:none;border-radius:var(--radius);cursor:pointer;transition:opacity .15s,transform .1s}
.btn-dl:hover{opacity:.9}
.btn-dl:active{transform:scale(.98)}

/* ── 미리보기 ── */
.preview{flex:1;background:#06080f;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;overflow:hidden}
.preview-lbl{font-size:9px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:14px}
.canvas-wrap{max-width:min(580px,100%);width:100%;border-radius:12px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.7)}
canvas{display:block;width:100%;aspect-ratio:1}
.size-note{margin-top:10px;font-size:10px;color:var(--text3)}

/* 초기화 + 프리셋 */
.reset-bar{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center}
.btn-reset{padding:6px 14px;background:transparent;border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text2);font-size:11px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-reset:hover{background:var(--surface2);color:var(--text)}
.preset-sec{padding:12px 20px;border-bottom:1px solid var(--border)}
.preset-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.preset-name{flex:1;padding:5px 8px;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-size:11px;font-family:'Noto Sans KR',sans-serif;outline:none;min-width:0}
.preset-name:focus{border-color:var(--accent)}
.btn-ps{padding:5px 9px;font-size:10px;font-weight:700;font-family:'Noto Sans KR',sans-serif;border-radius:var(--radius-sm);cursor:pointer;transition:all .15s;white-space:nowrap;border:1px solid}
.btn-save{background:var(--accent);border-color:var(--accent);color:#0B1F3A}
.btn-save:hover{opacity:.85}
.btn-load{background:transparent;border-color:var(--border2);color:var(--text2)}
.btn-load:hover{background:var(--surface2);color:var(--text)}
.btn-load.has-data{border-color:var(--accent);color:var(--accent)}
.preset-dot{width:8px;height:8px;border-radius:50%;background:var(--surface3);flex-shrink:0;transition:background .2s}
.preset-dot.saved{background:var(--accent)}

/* ── 모드 탭 ── */
.mode-tabs{display:flex;gap:6px;padding:12px 20px;border-bottom:1px solid var(--border);flex-shrink:0}
.mode-tab{flex:1;padding:9px 8px;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text2);font-size:11px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;transition:all .15s;text-align:center}
.mode-tab:hover{background:var(--surface3);color:var(--text)}
.mode-tab.active{background:var(--accent);border-color:var(--accent);color:#0B1F3A}
/* 모드별 표시제어 */
.mode-thumb-only{} .mode-widget-only{display:none}
body.widget-mode .mode-thumb-only{display:none}
body.widget-mode .mode-widget-only{display:block}
body.widget-mode .preview-thumb{display:none}
.preview-thumb{display:flex}
.preview-widget{display:none}
body.widget-mode .preview-widget{display:flex}
/* 위젯 캔버스 미리보기 (세로형) */
.canvas-wrap-w{max-width:min(360px,100%);width:100%;border-radius:12px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.7)}
canvas#cvw{display:block;width:100%;aspect-ratio:1020/1410}
.preview-thumb{flex-direction:column;align-items:center}
.preview-widget{flex-direction:column;align-items:center}
</style>
</head>
<body>

<!-- ── 좌측 패널 ── -->
<div class="panel">
  <div class="panel-head">
    <h1>대단한영어 썸네일 생성기 Pro</h1>
    <p>요소 토글 · 위치 · 크기 · 폰트 · 색상 개별 설정</p>
  </div>

  <div class="mode-tabs">
    <button class="mode-tab active" id="tab-thumb" onclick="setMode('thumb')">썸네일 680²</button>
    <button class="mode-tab" id="tab-widget" onclick="setMode('widget')">위젯배너 1020×1410</button>
  </div>

  <div class="panel-scroll">

    <!-- ════════ 위젯배너 전용 패널 ════════ -->
    <div class="mode-widget-only">
      <div class="global-sec">
        <div class="sec-label">배경 테마</div>
        <div class="palettes" id="palettes-w"></div>
      </div>
      <div class="global-sec">
        <div class="sec-label">영문 태그라인</div>
        <div class="field"><input type="text" id="w-eng" value="Summer Intensive" oninput="renderW()"></div>
      </div>
      <div class="global-sec">
        <div class="sec-label">한글 메인 카피</div>
        <div class="field"><label>1번째 줄</label><input type="text" id="w-kr1" value="여름방학," oninput="renderW()"></div>
        <div class="field"><label>2번째 줄</label><input type="text" id="w-kr2" value="실력이 도약합니다" oninput="renderW()"></div>
        <div class="sl-row"><label>글자 크기</label><input type="range" min="60" max="120" value="92" id="w-krfs" oninput="document.getElementById('w-krfv').value=this.value;renderW()"><input type="number" class="sl-num" id="w-krfv" value="92" min="60" max="120" oninput="document.getElementById('w-krfs').value=this.value;renderW()"></div>
        <div class="field"><label>폰트</label><select id="w-krfont" onchange="renderW()"></select></div>
      </div>
      <div class="global-sec">
        <div class="sec-label">버튼</div>
        <div class="field"><input type="text" id="w-btn" value="여름특강 신청  →" oninput="renderW()"></div>
      </div>
      <div class="global-sec">
        <div class="sec-label">방패 크기 · 위치</div>
        <div class="sl-row"><label>크기</label><input type="range" min="300" max="520" value="423" id="w-shw" oninput="document.getElementById('w-shwv').value=this.value;renderW()"><input type="number" class="sl-num" id="w-shwv" value="423" min="300" max="520" oninput="document.getElementById('w-shw').value=this.value;renderW()"></div>
        <div class="sl-row"><label>상단 여백</label><input type="range" min="40" max="220" value="75" id="w-shy" oninput="document.getElementById('w-shyv').value=this.value;renderW()"><input type="number" class="sl-num" id="w-shyv" value="75" min="40" max="220" oninput="document.getElementById('w-shy').value=this.value;renderW()"></div>
      </div>
    </div>
    <!-- ════════ /위젯배너 패널 ════════ -->

    <div class="mode-thumb-only">
    <!-- 초기화 + 프리셋 -->
    <div class="reset-bar">
      <button class="btn-reset" onclick="resetAll()">↺ 초기화</button>
      <span style="font-size:10px;color:var(--text3);flex:1;text-align:right">현재 설정을 기본값으로 되돌립니다</span>
    </div>

    <div class="preset-sec">
      <div class="sec-label">프리셋</div>
      <div class="preset-row">
        <div class="preset-dot" id="pdot-0"></div>
        <input class="preset-name" id="pname-0" placeholder="프리셋 1 이름" value="프리셋 1">
        <button class="btn-ps btn-save" onclick="savePreset(0)">저장</button>
        <button class="btn-ps btn-load" id="pload-0" onclick="loadPreset(0)">불러오기</button>
      </div>
      <div class="preset-row">
        <div class="preset-dot" id="pdot-1"></div>
        <input class="preset-name" id="pname-1" placeholder="프리셋 2 이름" value="프리셋 2">
        <button class="btn-ps btn-save" onclick="savePreset(1)">저장</button>
        <button class="btn-ps btn-load" id="pload-1" onclick="loadPreset(1)">불러오기</button>
      </div>
      <div class="preset-row">
        <div class="preset-dot" id="pdot-2"></div>
        <input class="preset-name" id="pname-2" placeholder="프리셋 3 이름" value="프리셋 3">
        <button class="btn-ps btn-save" onclick="savePreset(2)">저장</button>
        <button class="btn-ps btn-load" id="pload-2" onclick="loadPreset(2)">불러오기</button>
      </div>
    </div>

    <!-- 배경 테마 -->
    <div class="global-sec">
      <div class="sec-label">배경 테마</div>
      <div class="palettes" id="palettes"></div>
    </div>

    <!-- 학원명 배지 (항상 ON) -->
    <div class="sec" id="sec-badge">
      <div class="sec-head" onclick="toggleBody('badge')">
        <div class="sec-title">학원명 배지</div>
        <span class="sec-badge">항상 표시</span>
        <span class="chevron" id="chev-badge">▼</span>
      </div>
      <div class="sec-body" id="body-badge">
        <div class="field"><label>배지 텍스트</label><input type="text" id="txt-badge" value="대단한영어 GREATENG" oninput="render()"></div>
        <div class="field"><label>폰트</label><select id="font-badge" onchange="render()"></select></div>
        <div class="sl-row"><label>글자 크기</label><input type="range" min="12" max="22" value="17" id="fs-badge" oninput="syncNum('fs-badge','fv-badge',this.value);render()"><input type="number" class="sl-num" id="fv-badge" value="17" min="12" max="22" oninput="syncSlider('fs-badge','fv-badge',this.value);render()"></div>
        <div class="sl-row"><label>X 위치</label><input type="range" min="0" max="680" value="40" id="bx-badge" oninput="syncNum('bx-badge','bv-badge',this.value);render()"><input type="number" class="sl-num" id="bv-badge" value="40" min="0" max="680" oninput="syncSlider('bx-badge','bv-badge',this.value);render()"></div>
        <div class="sl-row"><label>Y 위치</label><input type="range" min="0" max="680" value="42" id="by-badge" oninput="syncNum('by-badge','byv-badge',this.value);render()"><input type="number" class="sl-num" id="byv-badge" value="42" min="0" max="680" oninput="syncSlider('by-badge','byv-badge',this.value);render()"></div>
        <div class="field"><label>배지 색상</label><div class="dots" id="dots-badge"></div></div>
      </div>
    </div>

    <!-- 학교·학년 -->
    <div class="sec" id="sec-school">
      <div class="sec-head" onclick="toggleBody('school')">
        <button class="sec-toggle on" id="tog-school" onclick="event.stopPropagation();toggleElem('school')"></button>
        <div class="sec-title">학교 · 학년</div>
        <span class="chevron" id="chev-school">▼</span>
      </div>
      <div class="sec-body" id="body-school">
        <div class="field"><label>텍스트</label><input type="text" id="txt-school" value="포항제철중학교" oninput="render()"></div>
        <div class="field"><label>폰트</label><select id="font-school" onchange="render()"></select></div>
        <div class="sl-row"><label>글자 크기</label><input type="range" min="16" max="52" value="30" id="fs-school" oninput="syncNum('fs-school','fv-school',this.value);render()"><input type="number" class="sl-num" id="fv-school" value="30" min="16" max="52" oninput="syncSlider('fs-school','fv-school',this.value);render()"></div>
        <div class="sl-row"><label>X 위치</label><input type="range" min="0" max="680" value="340" id="bx-school" oninput="syncNum('bx-school','bv-school',this.value);render()"><input type="number" class="sl-num" id="bv-school" value="340" min="0" max="680" oninput="syncSlider('bx-school','bv-school',this.value);render()"></div>
        <div class="sl-row"><label>Y 위치</label><input type="range" min="0" max="680" value="148" id="by-school" oninput="syncNum('by-school','byv-school',this.value);render()"><input type="number" class="sl-num" id="byv-school" value="148" min="0" max="680" oninput="syncSlider('by-school','byv-school',this.value);render()"></div>
        <div class="field"><label>텍스트 색상</label><div class="dots" id="dots-school"></div></div>
      </div>
    </div>

    <!-- 강조 박스 -->
    <div class="sec" id="sec-box">
      <div class="sec-head" onclick="toggleBody('box')">
        <button class="sec-toggle on" id="tog-box" onclick="event.stopPropagation();toggleElem('box')"></button>
        <div class="sec-title">강조 박스</div>
        <span class="chevron" id="chev-box">▼</span>
      </div>
      <div class="sec-body" id="body-box">
        <div class="field"><label>텍스트</label><input type="text" id="txt-box" value="중2 중간고사 분석" oninput="render()"></div>
        <div class="field"><label>서브텍스트</label><input type="text" id="txt-boxsub" value="1학기 1차 고사 · 영어과 · 2026.04.28" oninput="render()"></div>
        <div class="field"><label>폰트</label><select id="font-box" onchange="render()"></select></div>
        <div class="sl-row"><label>글자 크기</label><input type="range" min="18" max="56" value="36" id="fs-box" oninput="syncNum('fs-box','fv-box',this.value);render()"><input type="number" class="sl-num" id="fv-box" value="36" min="18" max="56" oninput="syncSlider('fs-box','fv-box',this.value);render()"></div>
        <div class="sl-row"><label>X 위치</label><input type="range" min="0" max="680" value="60" id="bx-box" oninput="syncNum('bx-box','bv-box',this.value);render()"><input type="number" class="sl-num" id="bv-box" value="60" min="0" max="680" oninput="syncSlider('bx-box','bv-box',this.value);render()"></div>
        <div class="sl-row"><label>Y 위치</label><input type="range" min="0" max="680" value="168" id="by-box" oninput="syncNum('by-box','byv-box',this.value);render()"><input type="number" class="sl-num" id="byv-box" value="168" min="0" max="680" oninput="syncSlider('by-box','byv-box',this.value);render()"></div>
        <div class="field"><label>박스 색상</label><div class="dots" id="dots-box"></div></div>
      </div>
    </div>

    <!-- 카드 1 -->
    <div class="sec" id="sec-c1">
      <div class="sec-head" onclick="toggleBody('c1')">
        <button class="sec-toggle on" id="tog-c1" onclick="event.stopPropagation();toggleElem('c1')"></button>
        <div class="sec-title">카드 1</div>
        <span class="chevron" id="chev-c1">▼</span>
      </div>
      <div class="sec-body" id="body-c1">
        <div class="field"><label>제목</label><input type="text" id="txt-c1" value="문장 삽입" oninput="render()"></div>
        <div class="field"><label>설명</label><input type="text" id="sub-c1" value="기출 11·19번 완전 일치" oninput="render()"></div>

const state={

const DEFAULTS = {

};

// ── 현재 설정 수집 ─────────────────────────────────────────
function collectSettings(){
  const inputs={};
  Object.keys(DEFAULTS.inputs).forEach(id=>{
    const el=document.getElementById(id);
    if(el)inputs[id]=el.value;
  });
  const sliders={};
  Object.keys(DEFAULTS.sliders).forEach(id=>{
    const el=document.getElementById(id);
    if(el)sliders[id]=parseInt(el.value);
  });
  const fonts={};
  Object.keys(DEFAULTS.fonts).forEach(id=>{
    const el=document.getElementById(id);
    if(el)fonts[id]=el.selectedIndex;
  });
  const toggles={};
  ['school','box','c1','c2','c3','bot','cred'].forEach(k=>{
    const tog=document.getElementById('tog-'+k);
    toggles[k]=tog?tog.className.includes('on'):true;
  });
  return {
    palId:curPal.id,
    state:JSON.parse(JSON.stringify(state)),
    inputs,sliders,fonts,toggles,
  };
}

// ── 설정 적용 ──────────────────────────────────────────────
function applySettings(cfg){
  // 팔레트
  const pal=PALETTES.find(p=>p.id===cfg.palId)||PALETTES[0];
  curPal=pal;
  document.querySelectorAll('.pal').forEach(el=>{
    el.classList.toggle('active', el.title===pal.label);
  });
  // 팔레트 active는 label로 찾기 어려우므로 index로
  const pidx=PALETTES.findIndex(p=>p.id===cfg.palId);
  document.querySelectorAll('.pal').forEach((el,i)=>{
    el.classList.toggle('active',i===pidx);
  });

  // state
  Object.assign(state, JSON.parse(JSON.stringify(cfg.state)));

  // 색상 점 업데이트
  const dotMaps={badge:'badge',school:'school',box:'box',c1:'c1',c2:'c2',c3:'c3',bot:'bot'};
  Object.entries(dotMaps).forEach(([key,sk])=>{
    const div=document.getElementById('dots-'+key);
    if(!div)return;
    div.querySelectorAll('.dot').forEach(d=>{
      d.classList.toggle('active',d.style.background===state[sk].color||
        rgbToHex(d.style.background)===state[sk].color.toLowerCase());
    });
  });

  // inputs
  Object.entries(cfg.inputs).forEach(([id,val])=>{
    const el=document.getElementById(id);
    if(el)el.value=val;
  });

  // sliders + 숫자입력
  Object.entries(cfg.sliders).forEach(([id,val])=>{
    const el=document.getElementById(id);
    if(el){el.value=val;}
    // 숫자입력창: byv-, bv-, fv- 패턴
    const numId=id.replace(/^(fs|bx|by)-/,(m,p1)=>({fs:'fv',bx:'bv',by:'byv'}[p1]+'-'));
    const nel=document.getElementById(numId);
    if(nel)nel.value=val;
  });

  // fonts
  Object.entries(cfg.fonts).forEach(([id,idx])=>{
    const el=document.getElementById(id);
    if(el)el.selectedIndex=idx;
  });

  // toggles
  Object.entries(cfg.toggles).forEach(([k,on])=>{
    const tog=document.getElementById('tog-'+k);
    if(tog)tog.className='sec-toggle '+(on?'on':'off');
    if(k!=='badge' && state[k]!==undefined)state[k].on=on;
  });

  render();
}

function rgbToHex(rgb){
  const m=rgb.match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/);
  if(!m)return rgb;
  return '#'+[m[1],m[2],m[3]].map(x=>parseInt(x).toString(16).padStart(2,'0')).join('').toUpperCase();
}

// ── 초기화 ────────────────────────────────────────────────
function resetAll(){
  if(!confirm('모든 설정을 초기값으로 되돌리겠습니까?'))return;
  applySettings(JSON.parse(JSON.stringify(DEFAULTS)));
}

// ── 프리셋 저장/불러오기 ───────────────────────────────────
function updatePresetUI(){
  for(let i=0;i<3;i++){
    const data=localStorage.getItem('ge_preset_'+i);
    const dot=document.getElementById('pdot-'+i);
    const btn=document.getElementById('pload-'+i);
    const nameEl=document.getElementById('pname-'+i);
    if(data){
      const cfg=JSON.parse(data);
      if(dot)dot.classList.add('saved');
      if(btn)btn.classList.add('has-data');
      if(nameEl && cfg.presetName)nameEl.value=cfg.presetName;
    } else {
      if(dot)dot.classList.remove('saved');
      if(btn)btn.classList.remove('has-data');
    }
  }
}

function savePreset(i){
  const cfg=collectSettings();
  const nameEl=document.getElementById('pname-'+i);
  cfg.presetName=nameEl?nameEl.value||('프리셋 '+(i+1)):'프리셋 '+(i+1);
  localStorage.setItem('ge_preset_'+i, JSON.stringify(cfg));
  updatePresetUI();
  const btn=document.querySelector(`.preset-row:nth-child(${i+1}) .btn-save`);
  if(btn){
    const orig=btn.textContent;
    btn.textContent='✓ 저장됨';
    setTimeout(()=>{btn.textContent=orig;},1200);
  }
}

function loadPreset(i){
  const data=localStorage.getItem('ge_preset_'+i);
  if(!data){alert('저장된 프리셋이 없습니다.');return;}
  applySettings(JSON.parse(data));
}

function sv(id,val){const el=document.getElementById(id);if(el)el.textContent=val;}
function syncNum(sliderId,numId,val){const n=document.getElementById(numId);if(n)n.value=val;}
function syncSlider(sliderId,numId,val){const s=document.getElementById(sliderId);if(s){s.value=val;}}
function gv(id){const el=document.getElementById(id);return el?el.value.trim():'';}
function gi(id){const el=document.getElementById(id);return el?parseInt(el.value):0;}
function gf(id){const el=document.getElementById(id);return el?el.value:"'Noto Sans KR',sans-serif";}

// 아코디언
function toggleBody(key){
  const body=document.getElementById('body-'+key);

  if(!body)return;
  const open=body.classList.contains('open');
  body.classList.toggle('open',!open);
  if(chev)chev.classList.toggle('open',!open);
}

// ON/OFF 토글
function toggleElem(key){
  state[key].on=!state[key].on;
  const tog=document.getElementById('tog-'+key);
  if(tog){tog.className='sec-toggle '+(state[key].on?'on':'off');}

}

// 폰트 셀렉트 생성
['badge','school','box','c1','c2','c3','bot','cred'].forEach(key=>{
  const sel=document.getElementById('font-'+key);
  if(!sel)return;
  FONTS.forEach((f,i)=>{
    const opt=document.createElement('option');
    opt.value=f.val;opt.textContent=f.label;
    if(i===0)opt.selected=true;
    sel.appendChild(opt);
  });
});

// 색상 점 생성
function makeDots(containerId,stateKey){
  const div=document.getElementById('dots-'+containerId);
  if(!div)return;
  ACCENT_COLORS.forEach((c,i)=>{
    const d=document.createElement('div');
    d.className='dot'+(state[stateKey].color===c.h?' active':'');
    d.style.background=c.h;
    if(c.h==='#FFFFFF')d.style.border='2px solid rgba(255,255,255,0.25)';
    d.title=c.l;
    d.onclick=()=>{
      div.querySelectorAll('.dot').forEach(x=>x.classList.remove('active'));
      d.classList.add('active');
      state[stateKey].color=c.h;
      render();
    };
    div.appendChild(d);
  });
}
makeDots('badge','badge');
makeDots('school','school');
makeDots('box','box');
makeDots('c1','c1');
makeDots('c2','c2');
makeDots('c3','c3');
makeDots('bot','bot');

// 캔버스 유틸
function rr(ctx,x,y,w,h,r,fill,stroke,sw){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
  ctx.fillStyle=fill;ctx.fill();
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=sw||1;ctx.stroke();}
}

function getBadgeTxt(hex){
  return['#FFFFFF','#F0A500','#4CAF8A','#5DCAA5','#85B7EB','#AABBD4'].includes(hex)?'#0B1F3A':'#FFFFFF';
}

function render(){
  const cv=document.getElementById('cv');
  const ctx=cv.getContext('2d');
  const p=curPal;
  const W=680,H=680;
  ctx.clearRect(0,0,W,H);

  // 배경
  ctx.fillStyle=p.bg;ctx.fillRect(0,0,W,H);
  ctx.fillStyle=p.bg2;ctx.globalAlpha=.5;
  ctx.beginPath();ctx.arc(620,70,220,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(60,630,180,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
  ctx.strokeStyle=p.stroke;ctx.lineWidth=1;ctx.globalAlpha=.25;
  ctx.beginPath();ctx.arc(340,340,310,0,Math.PI*2);ctx.stroke();
  ctx.globalAlpha=.15;ctx.lineWidth=.5;
  ctx.beginPath();ctx.arc(340,340,245,0,Math.PI*2);ctx.stroke();
  ctx.globalAlpha=1;

  // ── 학원명 배지 (항상 ON) ──
  const bx=gi('bx-badge'), by=gi('by-badge');
  const bfs=gi('fs-badge'), bfont=gf('font-badge');
  const badgeTxt2=gv('txt-badge')||'대단한영어 GREATENG';
  ctx.font=`bold ${bfs}px ${bfont}`;
  const badgeW=Math.max(180, ctx.measureText(badgeTxt2).width+40), badgeH=38;
  rr(ctx,bx,by,badgeW,badgeH,6,state.badge.color,'');
  ctx.fillStyle=getBadgeTxt(state.badge.color);
  ctx.textAlign='center';
  ctx.fillText(badgeTxt2, bx+badgeW/2, by+badgeH*0.68);

  // ── ON인 요소 수집하여 자동 배치 ──
  const onElems=[];
  if(state.school.on) onElems.push('school');
  if(state.box.on)    onElems.push('box');
  const onCards=[state.c1.on,state.c2.on,state.c3.on].filter(Boolean).length;
  if(onCards>0)       onElems.push('cards');
  if(state.bot.on)    onElems.push('bot');

  // 학교명
  if(state.school.on){
    const sx=gi('bx-school'), sy=gi('by-school');
    const sfs=gi('fs-school'), sfont=gf('font-school');
    ctx.fillStyle=state.school.color;
    ctx.font=`bold ${sfs}px ${sfont}`;
    ctx.textAlign='center';
    ctx.fillText(gv('txt-school'), sx, sy);
  }

  // 강조 박스
  if(state.box.on){
    const boxx=gi('bx-box'), boxy=gi('by-box');
    const boxfs=gi('fs-box'), boxfont=gf('font-box');
    const boxW=680-(boxx*2), boxH=86+Math.max(0,(boxfs-36)*1.4);
    rr(ctx,boxx,boxy,boxW,boxH,14,state.box.color,'');
    const btxt=getBadgeTxt(state.box.color);
    ctx.fillStyle=btxt;
    ctx.font=`bold ${boxfs}px ${boxfont}`;
    ctx.textAlign='center';
    ctx.fillText(gv('txt-box'), boxx+boxW/2, boxy+boxH*0.58);
    ctx.font=`bold 13px ${boxfont}`;
    ctx.fillText(gv('txt-boxsub'), boxx+boxW/2, boxy+boxH*0.86);
  }

  // 구분선 (ON 요소 있을 때)
  if(onElems.length>1){
    const lineY=state.box.on ? gi('by-box')+72+Math.max(0,(gi('fs-box')-36)*1.4)+12 : 290;
    ctx.strokeStyle=p.stroke;ctx.lineWidth=1.2;ctx.globalAlpha=1;
    ctx.beginPath();ctx.moveTo(80,lineY);ctx.lineTo(600,lineY);ctx.stroke();
  }

  // 카드들
  const cDefs=[
    {key:'c1',defX:40},
    {key:'c2',defX:248},
    {key:'c3',defX:456},
  ];
  const activeCards=cDefs.filter(c=>state[c.key].on);
  const cardW=activeCards.length===1?300:activeCards.length===2?270:184;

  activeCards.forEach((c,idx)=>{
    const cx=gi('bx-'+c.key);
    const cy=gi('by-'+c.key);
    const cfs=gi('fs-'+c.key);
    const cfont=gf('font-'+c.key);
    const col=state[c.key].color;
    const cardH=96;

    rr(ctx,cx,cy,cardW,cardH,10,p.card,p.cs,0.5);
    rr(ctx,cx,cy,cardW,5,3,col,'');
    ctx.fillStyle=col;
    ctx.font=`bold ${cfs}px ${cfont}`;
    ctx.textAlign='center';
    ctx.fillText(gv('txt-'+c.key), cx+cardW/2, cy+cardH*0.45);
    ctx.fillStyle=p.sub;
    ctx.font=`11px ${cfont}`;
    ctx.fillText(gv('sub-'+c.key), cx+cardW/2, cy+cardH*0.72);
  });

  // 하단 문구
  if(state.bot.on){
    const botx=gi('bx-bot'), boty=gi('by-bot');
    const botfs=gi('fs-bot'), botfont=gf('font-bot');
    ctx.fillStyle=state.bot.color;
    ctx.font=`bold ${botfs}px ${botfont}`;
    ctx.textAlign='center';
    ctx.fillText(gv('txt-bot'), botx, boty);
    ctx.fillStyle=p.muted;
    ctx.font=`12px ${botfont}`;
    ctx.fillText('기출 분석 → 유형 보완 → 2차 고사 대비', botx, boty+22);
  }

  // 크레딧 (ON일 때)
  const credTog=document.getElementById('tog-cred');
  const credOn=credTog?credTog.className.includes('on'):true;
  if(credOn){
    const credx=gi('bx-cred'), credy=gi('by-cred');
    const credfs=gi('fs-cred'), credfont=gf('font-cred');
    ctx.strokeStyle=p.stroke;ctx.lineWidth=.5;
    ctx.beginPath();ctx.moveTo(80,credy-12);ctx.lineTo(600,credy-12);ctx.stroke();
    ctx.fillStyle=p.muted;
    ctx.font=`${credfs}px ${credfont}`;
    ctx.textAlign='center';
    ctx.fillText(gv('txt-cred'), credx, credy);
  }
}

function download(){
  render();
  const a=document.createElement('a');
  a.download='greateng_thumbnail.png';
  a.href=document.getElementById('cv').toDataURL('image/png');
  a.click();
}

// 크레딧 토글 처리
document.getElementById('tog-cred').onclick=function(e){
  e.stopPropagation();
  const on=this.className.includes('off');
  this.className='sec-toggle '+(on?'on':'off');
  render();
};

const shieldImg=new Image();
let shieldReady=false;
shieldImg.onload=()=>{shieldReady=true;renderW();};
shieldImg.src=SHIELD_SRC;

let curPalW=WPAL[0];

// 위젯 팔레트 생성
const palDivW=document.getElementById('palettes-w');
WPAL.forEach((p,i)=>{
  const d=document.createElement('div');
  d.className='pal'+(i===0?' active':'');
  d.style.background='linear-gradient(135deg,'+p.top+','+p.bot+')'; d.style.borderColor='#C9A84C';
  const lbl=document.createElement('div');
  lbl.className='pal-lbl'; lbl.textContent=p.label;
  d.appendChild(lbl);
  d.onclick=()=>{
    palDivW.querySelectorAll('.pal').forEach(x=>x.classList.remove('active'));
    d.classList.add('active'); curPalW=p; renderW();
  };
  palDivW.appendChild(d);
});

// 위젯 폰트 셀렉트
(function(){
  const sel=document.getElementById('w-krfont');
  FONTS.forEach((f,i)=>{
    const o=document.createElement('option');
    o.value=f.val; o.textContent=f.label;
    if(i===0)o.selected=true;
    sel.appendChild(o);
  });
})();

function gold2(ctx,x,y,w,h){
  const g=ctx.createLinearGradient(x,y,x,y+h);
  g.addColorStop(0,'#E8CE85'); g.addColorStop(.5,'#C9A84C'); g.addColorStop(1,'#B08A3E');
  return g;
}

function renderW(){
  const cv=document.getElementById('cvw');
  if(!cv)return;
  const ctx=cv.getContext('2d');
  const W=1020,H=1410;
  const p=curPalW;
  ctx.clearRect(0,0,W,H);
  // 배경 그라데이션
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,p.top); bg.addColorStop(1,p.bot);
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  // 골드 테두리
  ctx.strokeStyle='#C9A84C'; ctx.lineWidth=3;
  ctx.strokeRect(18,18,W-36,H-36);
  // 방패
  const shW=parseInt(document.getElementById('w-shw').value);
  const shY=parseInt(document.getElementById('w-shy').value);
  let afterShield=shY+260;
  if(shieldReady){
    const ratio=shieldImg.height/shieldImg.width;
    const shH=shW*ratio;
    ctx.drawImage(shieldImg,(W-shW)/2,shY,shW,shH);
    afterShield=shY+shH;
  }
  // 영문 태그라인 (세리프 이탤릭)
  const eng=document.getElementById('w-eng').value.trim();
  let ey=afterShield+90;
  ctx.fillStyle='#E3CD8A';
  ctx.font="italic 700 64px 'Noto Serif KR', serif";
  ctx.textAlign='center';
  ctx.fillText(eng, W/2, ey);
  // 영문 밑줄
  const ew=ctx.measureText(eng).width;
  ctx.strokeStyle='#E3CD8A'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(W/2-60,ey+20); ctx.lineTo(W/2+60,ey+20); ctx.stroke();
  // 한글 메인카피 (2줄)
  const kr1=document.getElementById('w-kr1').value;
  const kr2=document.getElementById('w-kr2').value;
  const krfs=parseInt(document.getElementById('w-krfs').value);
  const krfont=document.getElementById('w-krfont').value;
  ctx.fillStyle='#FFFFFF';
  ctx.font=`900 ${krfs}px ${krfont}`;
  let ky=ey+120;
  if(kr1){ctx.fillText(kr1,W/2,ky); ky+=krfs*1.18;}
  if(kr2){ctx.fillText(kr2,W/2,ky);}
  // 버튼
  const btn=document.getElementById('w-btn').value;
  const bw=800,bh=120,bx=(W-bw)/2,by=H-200;
  rr(ctx,bx,by,bw,bh,60,gold2(ctx,bx,by,bw,bh),'');
  ctx.fillStyle=p.bot;
  ctx.font="900 50px 'Noto Sans KR', sans-serif";
  ctx.fillText(btn, W/2, by+bh*0.64);
}

function downloadW(){
  renderW();
  const a=document.createElement('a');
  a.download='greateng_widget_banner.png';
  a.href=document.getElementById('cvw').toDataURL('image/png');
  a.click();
}

function setMode(m){
  if(m==='widget'){
    document.body.classList.add('widget-mode');
    document.getElementById('tab-widget').classList.add('active');
    document.getElementById('tab-thumb').classList.remove('active');
    renderW();
  }else{
    document.body.classList.remove('widget-mode');
    document.getElementById('tab-thumb').classList.add('active');
    document.getElementById('tab-widget').classList.remove('active');
    render();
  }
}


render();
updatePresetUI();
</script>
