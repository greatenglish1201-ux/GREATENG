<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대단한영어 멤버스 · 숙제 현황</title>
<style>
  :root{
    --wine:#7a1020; --gold:#C9A84C; --ink:#3a2a20; --ink-soft:#6b5a4d;
    --cream:#f7f3ec; --cream-deep:#e8ddc9; --navy:#1f4e79;
    --ok:#274e13; --ok-bg:#d9ead3; --late:#7f6000; --late-bg:#fff2cc;
    --miss:#cc0000; --miss-bg:#f4cccc; --pre-bg:#cfe8d6; --exam-bg:#ddebf7;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Malgun Gothic',sans-serif;
    background:linear-gradient(160deg,#1a0005,#3d0010); color:#2a2a2a; padding:18px;
    min-height:100vh;
  }
  .wrap{ max-width:1100px; margin:0 auto; }
  header.top{ text-align:center; color:#fff; margin-bottom:20px; }
  header.top h1{ margin:0; font-size:23px; font-weight:900; letter-spacing:1px; }
  header.top h1 span{ color:var(--gold); }
  header.top p{ margin:4px 0 0; font-size:12px; color:#e8d8b8; font-style:italic; letter-spacing:1px; }
  .card{ background:#fff; border-radius:16px; padding:18px; margin-bottom:16px; box-shadow:0 6px 22px rgba(0,0,0,0.22); }
  .card h2{ margin:0 0 14px; font-size:16px; color:var(--wine); display:flex; align-items:center; gap:7px; }
  .btn{ border:none; border-radius:10px; padding:10px 15px; font-size:14px; font-weight:700; cursor:pointer; }
  .btn-primary{ background:var(--ink); color:var(--gold); }
  .btn-line{ background:#fff; border:1px solid var(--cream-deep); color:var(--ink-soft); }
  .period-btn{ border:1px solid var(--cream-deep); background:#fff; color:var(--ink-soft); border-radius:8px; padding:7px 13px; font-size:13px; font-weight:700; cursor:pointer; }
  .period-btn.active{ background:var(--ink); color:var(--gold); border-color:var(--ink); }
  .insp-period-btn{ border:1px solid var(--cream-deep); background:#fff; color:var(--ink-soft); border-radius:8px; padding:6px 12px; font-size:12.5px; font-weight:700; cursor:pointer; }
  .insp-period-btn.active{ background:var(--wine); color:#fff; border-color:var(--wine); }
  .class-btn{ border:1px solid var(--cream-deep); background:#fff; color:var(--ink-soft); border-radius:8px; padding:7px 13px; font-size:13px; font-weight:700; cursor:pointer; }
  .class-btn.active{ background:var(--gold); color:var(--ink); border-color:var(--gold); }
  .controls{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:6px; }
  select,input{ padding:9px 11px; border:1px solid #ddd; border-radius:9px; font-size:14px; }
  .loading{ color:#999; font-size:13px; padding:8px 0; }

  /* 오늘 미제출 */
  .miss-box{ border-radius:12px; padding:13px 15px; }
  .miss-box.has{ background:var(--miss-bg); border:1px solid #f0a8a8; }
  .miss-box.none{ background:var(--ok-bg); border:1px solid #bfe6cf; }
  .miss-title{ font-weight:800; font-size:15px; margin-bottom:6px; }
  .miss-names{ font-size:13.5px; line-height:1.7; }

  /* 격자 */
  .grid-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table.grid{ border-collapse:collapse; font-size:16px; white-space:nowrap; }
  table.grid th, table.grid td{ border:1px solid #eee; padding:7px 9px; text-align:center; min-width:38px; }
  table.grid th.name, table.grid td.name{ position:sticky; left:0; background:#faf7f1; font-weight:700; text-align:left; min-width:90px; z-index:2; }
  table.grid thead th{ background:#f3ece0; color:var(--ink); font-weight:700; position:sticky; top:0; }
  td.s-제출{ background:var(--ok-bg); color:var(--ok); }
  td.s-지연제출{ background:var(--late-bg); color:var(--late); }
  td.s-미제출{ background:var(--miss-bg); color:var(--miss); font-weight:700; }
  td.s-선제출{ background:var(--pre-bg); color:var(--ok); }
  td.s-시험{ background:var(--exam-bg); color:var(--navy); }
  td.s-휴일{ background:#eee; color:#888; }
  td.clickable{ cursor:pointer; }
  td.clickable:hover{ outline:2px solid var(--wine); outline-offset:-2px; }

  /* 제출률 */
  .rate-row{ display:flex; align-items:center; gap:10px; padding:8px 11px; border-radius:9px; background:#f7f7f9; margin-bottom:5px; font-size:13px; }
  .rate-bar{ flex:1; height:9px; background:#eee; border-radius:5px; overflow:hidden; }
  .rate-fill{ height:100%; background:linear-gradient(90deg,var(--wine),var(--gold)); }
  .rate-pct{ font-weight:800; min-width:42px; text-align:right; }

  /* 사진 */
  .photo-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  .photo-card{ border:1px solid #eee; border-radius:11px; overflow:hidden; background:#fafafa; }
  .photo-card img{ width:100%; height:150px; object-fit:cover; display:block; cursor:pointer; background:#eee; }
  .photo-meta{ padding:8px 10px; font-size:12px; }
  .photo-meta .pm-name{ font-weight:800; color:var(--wine); }
  .photo-meta .pm-src{ color:#555; margin-top:2px; line-height:1.4; }
  .photo-meta .pm-ts{ color:#999; font-size:11px; margin-top:3px; }
  .no-photo{ height:150px; display:flex; align-items:center; justify-content:center; color:#bbb; font-size:12px; background:#f0f0f0; }

  /* 라이트박스 */
  #lightbox{ display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:9999; align-items:center; justify-content:center; padding:20px; }
  #lightbox img{ max-width:96%; max-height:90%; border-radius:8px; }
  #lightbox .close{ position:absolute; top:16px; right:20px; color:#fff; font-size:30px; cursor:pointer; }

  .muted{ color:#999; font-size:13px; }
  .legend{ display:flex; gap:12px; flex-wrap:wrap; font-size:11.5px; color:#666; margin-top:10px; }
  .legend span{ display:inline-flex; align-items:center; gap:4px; }
  .dot{ width:11px; height:11px; border-radius:3px; display:inline-block; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>대단한영어 <span>멤버스</span> · 숙제 현황</h1>
    <p>탁월함이 습관이 되도록</p>
  </header>

  <!-- 오늘 미제출자 -->
  <div class="card">
    <h2>⚠️ 오늘 미제출</h2>
    <div id="today-box"><div class="loading">불러오는 중...</div></div>
  </div>

  <!-- 한 달 전체 격자 -->
  <div class="card">
    <h2>📅 전체 현황</h2>
    <div class="controls" style="margin-bottom:12px;">
      <span style="font-size:13px; font-weight:700; color:var(--ink-soft);">기간:</span>
      <button class="period-btn" data-days="14" onclick="setPeriod(14)">14일</button>
      <button class="period-btn" data-days="30" onclick="setPeriod(30)">30일</button>
      <button class="period-btn" data-days="60" onclick="setPeriod(60)">60일</button>
      <button class="period-btn" data-days="180" onclick="setPeriod(180)">180일</button>
      <button class="period-btn" data-days="365" onclick="setPeriod(365)">1년</button>
    </div>
    <div class="controls" id="class-filter-row" style="margin-bottom:12px;">
      <span style="font-size:13px; font-weight:700; color:var(--ink-soft);">클래스:</span>
      <!-- 클래스 버튼은 JS로 동적 생성 -->
    </div>
    <div class="controls">
      <button class="btn btn-primary" onclick="loadAll()">🔄 새로고침</button>
      <span class="muted" id="grid-info"></span>
    </div>
    <div class="grid-scroll"><div id="grid-area"><div class="loading">불러오는 중...</div></div></div>
    <div class="legend">
      <span><i class="dot" style="background:var(--ok-bg)"></i>제출</span>
      <span><i class="dot" style="background:var(--late-bg)"></i>지연</span>
      <span><i class="dot" style="background:var(--miss-bg)"></i>미제출</span>
      <span><i class="dot" style="background:var(--pre-bg)"></i>선제출</span>
      <span><i class="dot" style="background:var(--exam-bg)"></i>시험</span>
      <span class="muted">· 칸을 누르면 그날 제출 사진 확인</span>
    </div>
  </div>

  <!-- 제출률 순위 -->
  <div class="card">
    <h2>📊 제출률 <span id="rate-period-label" style="font-size:13px; color:var(--ink-soft); font-weight:600;">(최근 14일)</span></h2>
    <div id="rate-area"><div class="loading">불러오는 중...</div></div>
  </div>

  <!-- 사진 확인 -->
  <div class="card">
    <h2>📷 제출 사진 확인</h2>
    <div class="controls">
      <select id="photo-student"><option value="">전체 학생</option></select>
      <button class="btn btn-primary" onclick="loadPhotos()">사진 불러오기</button>
      <span class="muted">엉뚱한 사진 검증용 · 최신순 최대 100건</span>
    </div>
    <div id="photo-area"><div class="muted">학생을 선택하거나 '사진 불러오기'를 누르세요.</div></div>
  </div>
</div>

<div id="inspect" style="display:none; position:fixed; inset:0; background:rgba(20,5,10,0.6); z-index:9000; overflow-y:auto; padding:20px;">
  <div style="max-width:760px; margin:0 auto; background:#fff; border-radius:18px; padding:20px; box-shadow:0 12px 50px rgba(0,0,0,0.4);">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;">
      <div>
        <div id="insp-name" style="font-size:22px; font-weight:900; color:var(--wine);">학생</div>
        <div id="insp-meta" style="font-size:13px; color:var(--ink-soft); margin-top:3px;"></div>
      </div>
      <span onclick="closeInspect()" style="font-size:28px; color:#999; cursor:pointer; padding:0 6px;">&times;</span>
    </div>
    <div id="insp-summary" style="margin-bottom:14px;"></div>

    <div style="display:flex; gap:6px; align-items:center; margin-bottom:10px; flex-wrap:wrap;">
      <span style="font-size:12.5px; font-weight:700; color:var(--ink-soft);">기간:</span>
      <button class="insp-period-btn" data-days="14" onclick="setInspPeriod(14)">14일</button>
      <button class="insp-period-btn" data-days="30" onclick="setInspPeriod(30)">30일</button>
      <button class="insp-period-btn" data-days="60" onclick="setInspPeriod(60)">60일</button>
      <button class="insp-period-btn" data-days="90" onclick="setInspPeriod(90)">90일</button>
    </div>
    <div style="font-size:13px; font-weight:800; color:var(--ink); margin-bottom:8px;">📅 제출 현황</div>
    <div id="insp-days" style="margin-bottom:14px;"></div>
    <div id="insp-wordwrite" style="background:#eef4fb; border:1px solid #cdddf2; border-radius:10px; padding:10px 13px; margin-bottom:18px; font-size:13px;"></div>

    <div style="border-top:2px solid var(--cream-deep); margin-top:6px; padding-top:16px; margin-bottom:18px;">
      <div style="font-size:13px; font-weight:800; color:var(--ink); margin-bottom:10px;">📢 학부모 리포트</div>
      <div style="display:flex; gap:8px; align-items:center; margin-bottom:10px; flex-wrap:wrap;">
        <select id="insp-report-period" style="padding:9px 11px;">
          <option value="30">최근 30일</option>
          <option value="180">최근 180일</option>
          <option value="365">최근 1년</option>
        </select>
        <button class="btn btn-primary" onclick="genReport()">리포트 생성</button>
        <button class="btn btn-line" id="insp-copy-btn" onclick="copyReport()" style="display:none;">📋 복사</button>
      </div>
      <textarea id="insp-report-text" readonly placeholder="리포트 생성을 누르면 학부모 전송용 텍스트가 만들어집니다." style="width:100%; min-height:220px; padding:13px; border:1px solid #ddd; border-radius:10px; font-size:13px; line-height:1.7; resize:vertical; font-family:inherit;"></textarea>
      <div id="insp-copy-msg" style="font-size:12.5px; color:var(--ok); text-align:center; min-height:16px; margin-top:5px;"></div>
    </div>

    <div style="font-size:13px; font-weight:800; color:var(--ink); margin-bottom:8px;">📷 제출 사진 (최신순)</div>
    <div id="insp-photos"><div class="loading">불러오는 중...</div></div>
  </div>
</div>

<div id="lightbox" onclick="this.style.display='none'">
  <span class="close">&times;</span>
  <img id="lightbox-img" src="" alt="제출 사진">
</div>

<script>
  const HW_URL = "https://script.google.com/macros/s/AKfycbwu_6vMigAhIXq8o-4mda7Gyd1dfiC5nSsT0Ei9Ckwlwuc_OGMAEb9FybGB6lOJcsbL/exec";

  // JSONP 헬퍼
  function jsonp(params){
    return new Promise((resolve)=>{
      const cb = 'cb_' + Math.random().toString(36).slice(2);
      let done = false;
      const cleanup = ()=>{ try{ delete window[cb]; }catch(e){ window[cb]=undefined; } const s=document.getElementById(cb); if(s) s.remove(); };
      window[cb] = (data)=>{ done=true; cleanup(); resolve(data); };
      const s = document.createElement('script');
      s.id = cb;
      s.src = HW_URL + '?' + params + '&callback=' + cb + '&t=' + Date.now();
      s.onerror = ()=>{ if(done) return; cleanup(); resolve(null); };
      document.body.appendChild(s);
      setTimeout(()=>{ if(done) return; cleanup(); resolve(null); }, 12000);
    });
  }

  let overviewCache = null;
  let statusByStudent = {}; // 격자용: 이름 → {date:status}
  let allDates = [];
  let studentMeta = {};     // 이름 → {grade,course,klass,school}
  let curDays = 14;         // 기본 14일
  let curClass = '';        // '' = 전체

  // 클래스 버튼 생성 (명단 메타에서 클래스 종류 수집, 과정순 정렬)
  function buildClassButtons(){
    const row = document.getElementById('class-filter-row');
    // 기존 버튼 제거(라벨만 남김)
    row.querySelectorAll('.class-btn').forEach(b=>b.remove());
    // 클래스 수집
    const order = ['고3','제철고1','예비고','중등기초','중2'];
    const seen = new Set();
    Object.values(studentMeta).forEach(s=>{ if(s.klass) seen.add(s.klass); });
    const classes = Array.from(seen).sort((a,b)=>{
      const ia = order.indexOf(a), ib = order.indexOf(b);
      return (ia<0?99:ia) - (ib<0?99:ib);
    });
    // 전체 버튼 + 각 클래스
    const mk = (label, val)=>{
      const b = document.createElement('button');
      b.className = 'class-btn' + (curClass===val ? ' active' : '');
      b.textContent = label;
      b.onclick = ()=> setClass(val);
      row.appendChild(b);
    };
    mk('전체', '');
    classes.forEach(c=> mk(c, c));
  }

  function setClass(val){
    curClass = val;
    document.querySelectorAll('#class-filter-row .class-btn').forEach(b=>{
      b.classList.toggle('active', (b.textContent==='전체'?'':b.textContent) === val);
    });
    // 다시 렌더 (재호출 없이 캐시로 필터)
    if(overviewCache){ renderToday(overviewCache); renderRates(overviewCache); }
    if(allGridNames.length) renderGrid(allGridNames);
  }

  // 클래스 필터 통과 여부
  function inClass(name){
    if(!curClass) return true;
    const m = studentMeta[name];
    return m && m.klass === curClass;
  }

  function setPeriod(days){
    curDays = days;
    document.querySelectorAll('.period-btn').forEach(b=>{
      b.classList.toggle('active', parseInt(b.dataset.days) === days);
    });
    const lbl = document.getElementById('rate-period-label');
    if(lbl) lbl.textContent = '(최근 ' + (days===365?'1년':days+'일') + ')';
    loadAll();
  }

  async function loadAll(){
    document.getElementById('today-box').innerHTML = '<div class="loading">불러오는 중...</div>';
    document.getElementById('grid-area').innerHTML = '<div class="loading">불러오는 중...</div>';
    document.getElementById('rate-area').innerHTML = '<div class="loading">불러오는 중...</div>';

    // 명단 메타 로드 (과정/클래스/학교)
    const ros = await jsonp('type=roster');
    studentMeta = {};
    if(ros && ros.students){ ros.students.forEach(s=> studentMeta[s.name] = s); }
    buildClassButtons();

    const ov = await jsonp('type=adminOverview&days=' + curDays);
    if(!ov){ document.getElementById('today-box').innerHTML = '<span class="muted">불러오기 실패</span>'; return; }
    overviewCache = ov;
    renderToday(ov);
    renderRates(ov);
    fillPhotoStudents(ov);
    await buildGrid(ov);
  }

  // ===== 개인 점검 모달 =====
  function metaLine(nm){
    const m = studentMeta[nm] || {};
    const parts = [m.klass, m.course, m.school, m.grade].filter(Boolean);
    return parts.join(' · ');
  }

  let _inspCurName = '';
  let inspDays = 30; // 개별 점검 기본 30일

  function setInspPeriod(days){
    inspDays = days;
    document.querySelectorAll('.insp-period-btn').forEach(b=>{
      b.classList.toggle('active', parseInt(b.dataset.days) === days);
    });
    if(_inspCurName) loadInspDays(_inspCurName);
  }

  async function openInspect(name){
    _inspCurName = name;
    document.getElementById('inspect').style.display = 'block';
    document.getElementById('insp-name').textContent = name;
    document.getElementById('insp-meta').textContent = metaLine(name);
    document.getElementById('insp-summary').innerHTML = '';
    document.getElementById('insp-days').innerHTML = '<div class="loading">불러오는 중...</div>';
    document.getElementById('insp-photos').innerHTML = '<div class="loading">불러오는 중...</div>';
    document.getElementById('insp-wordwrite').innerHTML = '';
    const rt = document.getElementById('insp-report-text'); if(rt) rt.value = '';
    const cb = document.getElementById('insp-copy-btn'); if(cb) cb.style.display = 'none';
    // 기간 버튼 기본 30일 활성화
    document.querySelectorAll('.insp-period-btn').forEach(b=>{
      b.classList.toggle('active', parseInt(b.dataset.days) === inspDays);
    });
    window.scrollTo(0,0);

    await loadInspDays(name);

    // 사진 전부 (기간 무관 전체)
    const ph = await jsonp('type=adminSubmissions&name=' + encodeURIComponent(name));
    renderInspectPhotos(ph);
    renderWordWriteDates(ph);
  }

  // 현황 + 요약 (기간별)
  async function loadInspDays(name){
    document.getElementById('insp-days').innerHTML = '<div class="loading">불러오는 중...</div>';
    const st = await jsonp('type=homeworkStatus&name=' + encodeURIComponent(name) + '&days=' + inspDays);
    const days = (st && st.days) || [];
    renderInspectDays(days);

    let sub=0,late=0,miss=0,pre=0;
    days.forEach(d=>{ if(d.status==='제출')sub++; else if(d.status==='지연제출')late++; else if(d.status==='미제출')miss++; else if(d.status==='선제출')pre++; });
    const total = sub+late+miss+pre;
    const pct = total ? Math.round((sub+late+pre)/total*100) : 0;
    document.getElementById('insp-summary').innerHTML =
      '<div style="display:flex; gap:8px; flex-wrap:wrap;">'
      + '<span style="background:var(--ok-bg); color:var(--ok); padding:7px 13px; border-radius:9px; font-weight:700; font-size:13px;">제출 '+sub+'</span>'
      + '<span style="background:var(--late-bg); color:var(--late); padding:7px 13px; border-radius:9px; font-weight:700; font-size:13px;">지연 '+late+'</span>'
      + '<span style="background:var(--miss-bg); color:var(--miss); padding:7px 13px; border-radius:9px; font-weight:700; font-size:13px;">미제출 '+miss+'</span>'
      + '<span style="background:#eee; color:#333; padding:7px 13px; border-radius:9px; font-weight:700; font-size:13px;">제출률 '+pct+'%</span></div>';
  }

  // 단어쓰기 추가 제출 날짜만 간단히 표시
  function renderWordWriteDates(d){
    const el = document.getElementById('insp-wordwrite');
    const items = (d && d.items) || [];
    const dates = items
      .filter(it => (it.type||'').includes('단어쓰기'))
      .map(it => it.due)
      .filter(Boolean);
    // 중복 제거 + 정렬
    const uniq = Array.from(new Set(dates)).sort();
    if(!uniq.length){
      el.innerHTML = '<span style="color:#aaa;">단어쓰기 추가 제출 없음</span>';
      return;
    }
    const pretty = uniq.map(x=>{ const [y,m,dd]=x.split('-'); return parseInt(m)+'/'+parseInt(dd); });
    el.innerHTML = '<span style="font-weight:700; color:var(--navy);">📝 단어쓰기 추가 제출 ('+uniq.length+'회): </span>' + pretty.join(', ');
  }

  function renderInspectDays(days){
    const el = document.getElementById('insp-days');
    if(!days.length){ el.innerHTML = '<span class="muted">현황 없음</span>'; return; }
    const color = (st)=> st==='제출'?'var(--ok-bg)':st==='지연제출'?'var(--late-bg)':st==='미제출'?'var(--miss-bg)':st==='선제출'?'var(--pre-bg)':st==='시험'?'var(--exam-bg)':'#eee';
    let h = '<div style="display:flex; flex-wrap:wrap; gap:6px;">';
    days.forEach(d=>{
      const [y,m,dd] = d.date.split('-');
      h += '<div style="min-width:58px; text-align:center; padding:8px 4px; border-radius:9px; background:'+color(d.status)+'; font-size:12px; font-weight:700;">'
        + parseInt(m)+'/'+parseInt(dd)+'<br><span style="font-size:11px;">'+(d.status||'-')+'</span></div>';
    });
    h += '</div>';
    el.innerHTML = h;
  }

  function renderInspectPhotos(d){
    const el = document.getElementById('insp-photos');
    const items = (d && d.items) || [];
    if(!items.length){ el.innerHTML = '<span class="muted">제출 사진이 없습니다.</span>'; return; }
    let h = '<div class="photo-grid">';
    items.forEach(it=>{
      const img = it.thumb
        ? '<img src="'+it.thumb+'" referrerpolicy="no-referrer" onclick="zoom(\''+(it.fileId?('https://drive.google.com/thumbnail?id='+it.fileId+'&sz=w1200'):it.thumb)+'\')" onerror="this.parentNode.innerHTML=\'&lt;div class=&quot;no-photo&quot;&gt;사진 열기 실패&lt;/div&gt;\'">'
        : '<div class="no-photo">사진 없음</div>';
      h += '<div class="photo-card">'+img
        + '<div class="photo-meta"><div class="pm-src">'+(it.src||'')+(it.type?(' · '+it.type):'')+'</div>'
        + '<div class="pm-ts">'+(it.due||'')+(it.ts?(' (제출 '+it.ts+')'):'')+'</div></div></div>';
    });
    h += '</div>';
    el.innerHTML = h;
  }

  function closeInspect(){ document.getElementById('inspect').style.display = 'none'; }

  // ===== 학부모 리포트 생성 (시트 수식과 동일) =====
  let _inspName = '';
  function genReport(){
    const name = document.getElementById('insp-name').textContent;
    _inspName = name;
    const days = parseInt(document.getElementById('insp-report-period').value) || 30;
    const ta = document.getElementById('insp-report-text');
    ta.value = '리포트 생성 중...';
    jsonp('type=adminReport&name=' + encodeURIComponent(name) + '&days=' + days).then(d=>{
      if(!d){ ta.value = '생성 실패 — 다시 시도해주세요.'; return; }
      ta.value = buildReportText(d);
      document.getElementById('insp-copy-btn').style.display = 'inline-block';
    });
  }

  // 선생님 총평 (시트 C6 수식과 동일 분기)
  function teacherComment(c, l, m){
    const total = c + l + m;
    if(total === 0) return '데이터 없음';
    if(m/total >= 0.2) return '🚨 [관심 요망] 숙제 미제출 비율이 높습니다(20% 이상). 아이가 학습에 어려움을 겪지 않도록 가정의 각별한 관심과 독려 부탁드립니다.';
    if(l/total >= 0.3) return '⛔ [습관 개선] 지연 제출이 30%를 넘었습니다. 몰아서 하는 숙제는 학습 효과가 낮으므로, 매일 꾸준히 하는 습관을 가질 수 있도록 지도 부탁드립니다.';
    if(m >= 2) return '⚠️ 숙제 미제출이 종종 발생하고 있습니다. 기한 내 제출하는 습관을 들일 수 있도록 가정에서도 독려해 주시기를 바랍니다.';
    if(m === 1) return '💡 아깝게 미제출이 1회 있네요! 다음에는 100% 제출로 \'Perfect\'를 달성할 수 있도록 많은 격려 부탁드립니다.';
    if((m + l) === 0) return '👑 [Perfect] 지각/미제출 0회! 완벽한 성실함을 보여주었습니다. 아이에게 아낌없는 칭찬과 박수를 보내주세요!';
    if(l/total < 0.05) return '💎 [Excellent] 미제출 0회! 지연 제출 5% 미만으로 매우 훌륭합니다. 성실한 학습 태도를 많이 칭찬해 주세요!';
    return '✅ 숙제는 빠짐없이 제출하고 있으나, 기한 엄수까지 챙긴다면 더욱 완벽하겠습니다. 가정의 관심 부탁드립니다.';
  }

  function fmtDate(d){
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const dd = String(d.getDate()).padStart(2,'0');
    return { full:`${y}.${m}.${dd}`, md:`${m}.${dd}` };
  }

  // 최종 리포트 텍스트 (시트 조립 수식과 동일)
  function buildReportText(d){
    const name = d.name;
    const c = d.submitted, l = d.late, m = d.missed, ww = d.wordWrite;
    const days = d.days || 30;
    const today = new Date();
    const start = new Date(today.getTime() - days*86400000);
    const end = new Date(today.getTime() - 1*86400000);
    const s = fmtDate(start), e = fmtDate(end);
    const comment = teacherComment(c, l, m);
    return `[📢 ${name} 학생 학습 리포트]\n`
      + `📅 기간: ${s.full} ~ ${e.md}\n\n`
      + `안녕하세요, 대단한영어입니다.\n`
      + `${name} 학생의 학습 종합 분석 결과를 안내해 드립니다.\n\n`
      + `📊 [숙제 누적 데이터]\n`
      + `▪ 제출 ${c}회\n`
      + `▪ 지연제출 ${l}회\n`
      + `▪ 미제출 ${m}회\n\n`
      + `🗣️ [선생님 총평]\n`
      + `${comment}\n\n`
      + `📝 [단어 재시 횟수]\n`
      + `▪ 단어시험 재시 ${ww}회\n\n`
      + `${name} 학생이 앞으로도 성실히 학습에 임할 수 있도록, 가정에서도 따뜻한 관심과 격려 부탁드립니다.`;
  }

  function copyReport(){
    const ta = document.getElementById('insp-report-text');
    const msg = document.getElementById('insp-copy-msg');
    ta.select();
    ta.setSelectionRange(0, 99999);
    try {
      const ok = document.execCommand('copy');
      if(navigator.clipboard){ navigator.clipboard.writeText(ta.value).catch(()=>{}); }
      msg.textContent = ok ? '✅ 복사됐어요 — 카톡/문자에 붙여넣으세요.' : '복사 실패 — 길게 눌러 직접 복사하세요.';
    } catch(e){
      if(navigator.clipboard){ navigator.clipboard.writeText(ta.value).then(()=>{ msg.textContent='✅ 복사됐어요.'; }).catch(()=>{ msg.textContent='복사 실패 — 직접 복사하세요.'; }); }
      else msg.textContent = '복사 실패 — 직접 복사하세요.';
    }
    setTimeout(()=>{ msg.textContent=''; }, 4000);
  }

  function renderToday(ov){
    const box = document.getElementById('today-box');
    const m = (ov.todayMisses || []).filter(inClass);
    if(m.length){
      box.className = '';
      box.innerHTML = '<div class="miss-box has"><div class="miss-title" style="color:var(--miss)">오늘 ' + m.length + '명 미제출</div><div class="miss-names">' + m.join(', ') + '</div></div>';
    } else {
      box.innerHTML = '<div class="miss-box none"><div class="miss-title" style="color:var(--ok)">✅ 오늘 미제출자 없음</div></div>';
    }
  }

  function renderRates(ov){
    const area = document.getElementById('rate-area');
    const studs = (ov.students||[]).filter(s=> inClass(s.name)).map(s=>{
      const total = s.submitted + s.late + s.missed + s.pre;
      const done = s.submitted + s.late + s.pre; // 낸 것(지연·선제출 포함)
      const pct = total ? Math.round(done/total*100) : 0;
      return Object.assign({}, s, { pct, total });
    }).sort((a,b)=> a.pct - b.pct); // 낮은 순(주의 학생 위로)
    if(!studs.length){ area.innerHTML = '<span class="muted">데이터 없음</span>'; return; }
    let h = '';
    studs.forEach(s=>{
      h += '<div class="rate-row"><span style="font-weight:700; min-width:60px; cursor:pointer; color:var(--wine);" onclick="openInspect(\''+s.name+'\')">'+s.name+' 🔍</span>'
        + '<div class="rate-bar"><div class="rate-fill" style="width:'+s.pct+'%"></div></div>'
        + '<span class="rate-pct" style="color:'+(s.pct<70?'#cc0000':'#274e13')+'">'+s.pct+'%</span></div>';
    });
    area.innerHTML = h;
  }

  let allGridNames = [];

  // 격자: adminGrid 한 번 호출로 전체 받기 (로딩 최적화)
  async function buildGrid(ov){
    const area = document.getElementById('grid-area');
    document.getElementById('grid-info').textContent = '불러오는 중...';
    const g = await jsonp('type=adminGrid&days=' + curDays);
    if(!g || !g.rows){ area.innerHTML = '<span class="muted">불러오기 실패</span>'; return; }

    allDates = g.dates || [];
    statusByStudent = {};
    allGridNames = [];
    g.rows.forEach(row=>{
      allGridNames.push(row.name);
      statusByStudent[row.name] = {};
      (allDates).forEach((dt,i)=>{ statusByStudent[row.name][dt] = row.statuses[i] || ''; });
    });

    if(!allGridNames.length){ area.innerHTML = '<span class="muted">학생 없음</span>'; return; }
    renderGrid(allGridNames);
  }

  function renderGrid(names){
    const area = document.getElementById('grid-area');
    if(!allDates.length){ area.innerHTML = '<span class="muted">현황 데이터 없음</span>'; return; }
    const filtered = names.filter(inClass);
    document.getElementById('grid-info').textContent = '학생 ' + filtered.length + '명 · ' + allDates.length + '일' + (curClass?(' · '+curClass):'');
    if(!filtered.length){ area.innerHTML = '<span class="muted">해당 클래스 학생이 없습니다.</span>'; return; }
    let h = '<table class="grid"><thead><tr><th class="name">학생</th>';
    allDates.forEach(dt=>{
      const [y,m,d] = dt.split('-');
      h += '<th>'+parseInt(m)+'/'+parseInt(d)+'</th>';
    });
    h += '</tr></thead><tbody>';
    filtered.forEach(nm=>{
      h += '<tr><td class="name" style="cursor:pointer; color:var(--wine);" onclick="openInspect(\''+nm+'\')">'+nm+' 🔍</td>';
      allDates.forEach(dt=>{
        const st = (statusByStudent[nm] && statusByStudent[nm][dt]) || '';
        const cls = st ? ('s-'+st) : '';
        const click = st ? ' clickable' : '';
        const mark = st==='제출'?'O':st==='미제출'?'X':st==='지연제출'?'△':st==='선제출'?'◎':st==='시험'?'시':st==='휴일'?'-':'';
        h += '<td class="'+cls+click+'" onclick="openDay(\''+nm+'\',\''+dt+'\')">'+mark+'</td>';
      });
      h += '</tr>';
    });
    h += '</tbody></table>';
    area.innerHTML = h;
  }

  // 격자 칸 클릭 → 그 학생/날짜 사진
  async function openDay(name, date){
    document.getElementById('photo-student').value = '';
    const area = document.getElementById('photo-area');
    area.innerHTML = '<div class="loading">' + name + ' · ' + date + ' 사진 불러오는 중...</div>';
    const d = await jsonp('type=adminSubmissions&name=' + encodeURIComponent(name) + '&date=' + encodeURIComponent(date));
    renderPhotos(d, name + ' · ' + date);
    document.querySelector('.card:last-of-type').scrollIntoView({behavior:'smooth'});
  }

  function fillPhotoStudents(ov){
    const sel = document.getElementById('photo-student');
    sel.innerHTML = '<option value="">전체 학생</option>';
    (ov.students||[]).forEach(s=> sel.add(new Option(s.name, s.name)));
  }

  async function loadPhotos(){
    const name = document.getElementById('photo-student').value;
    const area = document.getElementById('photo-area');
    area.innerHTML = '<div class="loading">사진 불러오는 중...</div>';
    const d = await jsonp('type=adminSubmissions' + (name ? '&name=' + encodeURIComponent(name) : ''));
    renderPhotos(d, name || '전체');
  }

  function renderPhotos(d, label){
    const area = document.getElementById('photo-area');
    const items = (d && d.items) || [];
    if(!items.length){ area.innerHTML = '<span class="muted">' + label + ' — 제출 사진이 없습니다.</span>'; return; }
    let h = '<div class="muted" style="margin-bottom:10px;">' + label + ' · ' + items.length + '건</div><div class="photo-grid">';
    items.forEach(it=>{
      const img = it.thumb
        ? '<img src="'+it.thumb+'" referrerpolicy="no-referrer" onclick="zoom(\''+(it.fileId?('https://drive.google.com/thumbnail?id='+it.fileId+'&sz=w1200'):it.thumb)+'\')" onerror="this.parentNode.innerHTML=\'&lt;div class=&quot;no-photo&quot;&gt;사진 열기 실패&lt;/div&gt;\'">'
        : '<div class="no-photo">사진 없음</div>';
      h += '<div class="photo-card">'+img
        + '<div class="photo-meta"><div class="pm-name">'+it.name+'</div>'
        + '<div class="pm-src">'+(it.src||'')+(it.type?(' · '+it.type):'')+'</div>'
        + '<div class="pm-ts">'+(it.due||'')+(it.ts?(' (제출 '+it.ts+')'):'')+'</div></div></div>';
    });
    h += '</div>';
    area.innerHTML = h;
  }

  function zoom(url){
    document.getElementById('lightbox-img').src = url;
    document.getElementById('lightbox').style.display = 'flex';
  }

  // 시작
  setPeriod(14);
</script>
</body>
</html>
