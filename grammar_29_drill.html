<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대단한영어 · 29번 어법 60초 판정</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --wine:#7a1020; --wine-soft:#9a2435; --gold:#C9A84C; --gold-soft:#e3cf95;
  --ink:#3a2a20; --paper:#fbf8f2; --line:#e0d6c0; --grey:#8b8378; --steel:#3f5a72;
}
*{box-sizing:border-box}
body{margin:0; background:#e8e4dc; color:var(--ink);
  font-family:'Noto Sans KR',sans-serif; font-size:14px; line-height:1.6}

.toolbar{position:sticky; top:0; z-index:50; display:flex; gap:8px; align-items:center;
  flex-wrap:wrap; padding:9px 14px; background:var(--steel); color:#fff}
.toolbar .brand{font-family:'Space Grotesk',sans-serif; font-weight:700;
  letter-spacing:.04em; font-size:13px; margin-right:auto}
.toolbar button,.toolbar select{font-family:'Noto Sans KR',sans-serif; font-size:12.5px;
  padding:5px 11px; border-radius:2px; border:1px solid rgba(255,255,255,.45);
  background:transparent; color:#fff; cursor:pointer}
.toolbar select option{color:#222}
.toolbar button:hover,.toolbar select:hover{background:rgba(255,255,255,.14)}
.toolbar button.on{background:var(--gold); border-color:var(--gold); color:#2a1a10; font-weight:700}
.toolbar button:focus-visible,.toolbar select:focus-visible{outline:2px solid var(--gold-soft); outline-offset:2px}
.warn{display:none; font-size:11px; color:#ffe08a}

.sheet{width:210mm; min-height:297mm; margin:16px auto; padding:12mm 13mm;
  background:var(--paper); box-shadow:0 2px 14px rgba(0,0,0,.16)}
.head{display:flex; align-items:flex-end; justify-content:space-between;
  border-bottom:2px solid var(--steel); padding-bottom:5px; margin-bottom:3.5mm}
.head .t1{font-size:10.5px; letter-spacing:.14em; color:var(--steel); font-weight:700}
.head .t2{font-size:16px; font-weight:900; margin-top:2px}
.head .meta{font-family:'Space Grotesk',sans-serif; font-size:10.5px;
  color:var(--grey); text-align:right; line-height:1.6}
.namebar{display:flex; border:1px solid var(--line); margin-bottom:3.5mm; font-size:10.5px}
.namebar div{padding:4px 8px; border-right:1px solid var(--line); color:var(--grey)}
.namebar div:last-child{border-right:0; flex:1}

/* 60초 절차 */
.flow{display:flex; gap:0; margin-bottom:4mm; border:1px solid var(--steel); background:#fff}
.flow div{flex:1; padding:6px 9px; border-right:1px solid var(--line); font-size:11px}
.flow div:last-child{border-right:0}
.flow b{display:block; font-family:'Space Grotesk',sans-serif; font-size:10px;
  color:var(--steel); letter-spacing:.06em; margin-bottom:2px}

/* 포인트 카드 */
.pt{border:1px solid var(--line); background:#fff; margin-bottom:3mm; break-inside:avoid}
.pt-h{display:flex; align-items:center; gap:8px; padding:5px 10px;
  background:#eef1f4; border-bottom:1px solid var(--line)}
.pt-h .n{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:10px;
  background:var(--steel); color:#fff; padding:1px 7px}
.pt-h .ttl{font-weight:700; font-size:13px}
.pt-h .sig{margin-left:auto; font-size:10.5px; color:var(--grey)}
.pt-b{padding:7px 10px; font-size:11.8px}
.pt-b .ask{color:var(--wine); font-weight:700; margin-bottom:3px}
.pt-b .ex{font-family:'Noto Serif',serif; font-size:11.5px; color:var(--ink);
  background:#faf7f0; border-left:2px solid var(--gold); padding:3px 8px; margin-top:4px}
.pt-b .ex i{color:var(--grey); font-style:normal; font-family:'Noto Sans KR',sans-serif; font-size:10.5px}

/* 드릴 */
.drill-p{border:1px solid var(--line); background:#fff; padding:7px 11px;
  font-family:'Noto Serif',serif; font-size:12.4px; line-height:1.72;
  text-align:justify; margin-bottom:3mm}
.drill-p u{text-decoration-thickness:1.1px; text-underline-offset:3px;
  text-decoration-skip-ink:none; box-decoration-break:clone}
.drill-p u::before{font-family:'Space Grotesk',sans-serif; font-size:10px; font-weight:700;
  color:var(--steel); vertical-align:.25em; margin-right:2px; text-decoration:none;
  display:inline-block}
.drill-p u.n1::before{content:'①'} .drill-p u.n2::before{content:'②'}
.drill-p u.n3::before{content:'③'} .drill-p u.n4::before{content:'④'}
.drill-p u.n5::before{content:'⑤'}
.note{text-align:right; font-size:10.5px; color:var(--grey); margin-bottom:3mm}

table{width:100%; border-collapse:collapse; font-size:11.5px}
th,td{border:1px solid var(--line); padding:4px 8px; vertical-align:top}
th{background:#eef1f4; font-weight:700; font-size:10.5px; text-align:left}
.cn{font-family:'Space Grotesk',sans-serif; font-weight:700; color:var(--steel)}
.chk{display:inline-block; width:11px; height:11px; border:1.2px solid var(--ink)}

.answer-row{display:flex; gap:10px; align-items:center; margin-top:3mm}
.answer-row .lab{font-size:11px; color:var(--grey)}
.circle{width:21px; height:21px; border:1.2px solid var(--ink); border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-family:'Space Grotesk',sans-serif; font-size:11px; color:var(--grey)}
.blank{border-bottom:1px solid var(--ink); height:20px}

.ans{display:none}
body.show-ans .ans{display:block}
.ans-box{border:1px solid var(--wine-soft); background:#fdf6f6; padding:6px 9px;
  font-size:11px; margin-top:5px; break-inside:avoid}
.ans-box .k{font-weight:700; color:var(--wine); margin-right:5px}
.ans-box .tip{margin-top:4px; color:var(--wine-soft)}

.cycle{font-size:11px}
.cycle td{text-align:center}
.foot{margin-top:4mm; padding-top:4px; border-top:1px solid var(--line);
  font-size:9.5px; color:var(--grey); display:flex; justify-content:space-between;
  break-inside:avoid; break-before:avoid; page-break-before:avoid}

@page{size:A4; margin:11mm}
@media print{
  body{background:#fff}
  .toolbar{display:none}
  .sheet{width:auto; min-height:auto; margin:0; padding:0; box-shadow:none; background:#fff}
  .sheet + .sheet{page-break-before:always}
  .sheet:last-child{page-break-after:avoid}
  .pt,.drill-p,.flow{background:#fff}
  .pt-h,th{background:#f0f0f0}
  .drill-p u{text-decoration-color:#000; text-decoration-thickness:1.2px}
}
@media (max-width:820px){
  .sheet{width:auto; padding:16px}
  .flow{flex-direction:column}
  .flow div{border-right:0; border-bottom:1px solid var(--line)}
}
</style>
</head>
<body>

<div class="toolbar">
  <span class="brand">대단한영어 · 29번 어법 60초 판정</span>
  <label style="font-size:11px;opacity:.85">회차</label>
  <select id="selD"></select>
  <span class="warn" id="warnAns">해설 ON — 인쇄 장수가 늘어납니다</span>
  <button id="btnAns" type="button">교사용 해설 보기</button>
  <button type="button" onclick="window.print()">인쇄</button>
</div>

<div id="root"></div>

<script>
/* ============================================================
   29번 어법 드릴 데이터
   ⚠️ 회차가 늘면 DRILLS 배열에만 추가. 위쪽 HTML/CSS는 건드리지 않음.
   밑줄은 <u class="n1">…</u> ~ n5. 번호는 CSS가 자동 부여.
   pt = 포인트 번호(1~6). 아래 POINTS와 연결됨.
   ============================================================ */

var POINTS = [
 {n:1, name:"수일치", sig:"밑줄이 동사",
  ask:"진짜 주어가 무엇인가?",
  body:"주어와 동사 사이의 전치사구·관계절을 <b>손으로 지우고</b> 남은 주어만 본다. 바로 앞 명사에 맞추면 틀린다.",
  ex:"The package <i>of tools, techniques, and knowledge</i> <b>was</b> …  <i>→ 주어는 package(단수)</i>"},
 {n:2, name:"태 (능동·수동)", sig:"밑줄이 동사",
  ask:"주어가 하는가, 당하는가?",
  body:"밑줄 <b>뒤에 목적어가 있으면 능동</b>, 없으면 수동을 의심한다. 감정동사는 사람이 주어면 대개 수동.",
  ex:"we are <b>motivated</b> to learn  <i>→ 우리가 동기를 '부여받는' 쪽 = 수동</i>"},
 {n:3, name:"준동사 vs 본동사", sig:"밑줄이 -ing / p.p. / to+V",
  ask:"이 문장에 <b>본동사가 있는가?</b>",
  body:"29번에서 가장 자주 나온다. 본동사가 없는데 준동사가 있으면 <b>준동사를 본동사로</b> 바꿔야 한다. 접속사 없이 동사가 둘이면 반대로 하나를 준동사로.",
  ex:"The package … used by foragers <b>being</b> too complex  <i>→ 본동사 없음 → was</i>"},
 {n:4, name:"관계사", sig:"밑줄이 who/which/that/where/전치사+which",
  ask:"뒤 문장이 <b>완전한가?</b>",
  body:"완전 → 관계부사 또는 <b>전치사+관계대명사</b>. 불완전(주어나 목적어가 빠짐) → 관계대명사.",
  ex:"environments <b>in which</b> we live  <i>→ we live 완전 → 전치사+which 맞음</i>"},
 {n:5, name:"병렬", sig:"밑줄 앞에 and / or / but",
  ask:"접속사 앞뒤 <b>형태가 같은가?</b>",
  body:"동사면 동사, to부정사면 to부정사, 명사면 명사. 멀리 떨어진 짝을 찾아야 할 때가 많다.",
  ex:"to <b>learn</b>, to <b>share</b>, and to <b>accumulate</b>  <i>→ 세 개 형태 일치</i>"},
 {n:6, name:"대명사·수식어", sig:"밑줄이 it/they/this/부사·형용사",
  ask:"가리키는 명사가 무엇인가? / 무엇을 꾸미는가?",
  body:"대명사는 <b>수·인칭</b>을 선행 명사와 맞춘다. 부사는 동사·형용사를, 형용사는 명사를 꾸민다.",
  ex:"pools that <b>greatly</b> exceed …  <i>→ 동사 exceed를 꾸밈 = 부사 맞음</i>"}
];

var DRILLS = [
{
  id:"d2026",
  src:"2026수능 29번",
  qtext:"다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?",
  note:"* forage: 구하러 다니다",
  ans:2,
  sents:[
    "We are exceptionally smart, and this helps us adapt to a wide range of environments.",
    "But we are not nearly smart enough as individuals <u class=\"n1\">to solve</u> the adaptive problems that confronted modern humans as they spread across the globe.",
    "The package of tools, foraging techniques, ecological knowledge, and social arrangements used by any group of foragers <u class=\"n2\">being</u> far too complex for any individual to create.",
    "We are able to learn all the things we need to know in each of the many different environments <u class=\"n3\">in which</u> we live only because we acquire information from others.",
    "We are much better at learning from others than other species are, and we are <u class=\"n4\">motivated</u> to learn from others even when we do not understand why our models are doing what they are doing.",
    "This psychology allows human populations to accumulate pools of adaptive information that <u class=\"n5\">greatly</u> exceed the inventive capacities of individuals."
  ],
  items:[
    {n:1, word:"to solve",   pt:3, ok:true,
     why:"enough + to부정사. 앞에 본동사 are가 이미 있으므로 준동사가 맞다"},
    {n:2, word:"being",      pt:3, ok:false, fix:"was",
     why:"주어 The package에 <b>본동사가 없다</b>. used by…는 주어를 꾸미는 분사구일 뿐"},
    {n:3, word:"in which",   pt:4, ok:true,
     why:"뒤의 we live가 완전한 절 → 전치사+관계대명사가 맞다"},
    {n:4, word:"motivated",  pt:2, ok:true,
     why:"우리가 동기를 부여받는 쪽 → 수동. 뒤에 목적어도 없다"},
    {n:5, word:"greatly",    pt:6, ok:true,
     why:"동사 exceed를 꾸미므로 부사가 맞다. 선행사 pools(복수)라 exceed도 맞다"}
  ],
  teachNote:"이 지문 하나로 포인트 2·3·4·6이 다 나온다. 특히 ②는 <b>주어와 동사 사이가 24단어</b>나 떨어져 있어, "
    + "수식어를 지우는 훈련이 안 된 학생은 절대 못 본다. 첫 회차에 '주어 찾고 수식어 지우기'를 손으로 시킬 것. "
    + "병렬(5번 포인트)만 이 지문에 없으므로 다른 회차에서 보충."
}
];

/* ---------------- 렌더 ---------------- */
(function(){
  var CN="①②③④⑤", root=document.getElementById('root');
  var selD=document.getElementById('selD'), btn=document.getElementById('btnAns');
  function cn(i){ return CN.charAt(i-1)||('('+i+')'); }
  function esc(x){ return x==null?'':String(x); }

  function sheetPoints(){
    var h='<section class="sheet"><div class="head"><div>'
     +'<div class="t1">GRAMMAR · 29번 판정 카드</div>'
     +'<div class="t2">60초 안에 끝내는 어법</div></div>'
     +'<div class="meta">매 수업 앞 10분<br>상시 소지</div></div>';

    h+='<div class="flow">'
     +'<div><b>STEP 1</b>밑줄의 <b>품사</b>부터 본다 — 동사인가, 준동사인가, 관계사인가</div>'
     +'<div><b>STEP 2</b>해당 <b>포인트 하나</b>로 간다</div>'
     +'<div><b>STEP 3</b>그 <b>한 가지만</b> 확인한다</div>'
     +'<div><b>STEP 4</b>안 보이면 <b>넘긴다</b> — 지문 해석하지 않는다</div></div>';

    POINTS.forEach(function(p){
      h+='<div class="pt"><div class="pt-h"><span class="n">'+p.n+'</span>'
       +'<span class="ttl">'+p.name+'</span><span class="sig">'+p.sig+'</span></div>'
       +'<div class="pt-b"><div class="ask">→ '+p.ask+'</div>'+p.body
       +'<div class="ex">'+p.ex+'</div></div></div>';
    });

    h+='<table class="cycle" style="margin-top:2mm"><tr><th colspan="7" style="text-align:center">'
     +'26회 순환 — 매 수업 앞 10분</th></tr><tr>'
     +POINTS.map(function(p){return '<th style="text-align:center">'+p.n+'. '+p.name+'</th>'}).join('')
     +'<th style="text-align:center">종합</th></tr><tr>'
     +POINTS.map(function(){return '<td>4~5회</td>'}).join('')+'<td>2회</td></tr></table>';

    return h+'<div class="foot"><span>대단한영어 GREATENG · 29번 어법</span><span>판정 카드</span></div></section>';
  }

  function sheetDrill(d){
    var h='<section class="sheet"><div class="head"><div>'
     +'<div class="t1">GRAMMAR · 드릴</div><div class="t2">'+esc(d.src)+'</div></div>'
     +'<div class="meta">목표 60초<br>지문 해석 금지</div></div>';
    h+='<div class="namebar"><div>이름</div><div>날짜</div><div>걸린 시간</div><div></div></div>';
    h+='<div style="font-weight:700;font-size:13px;margin-bottom:3px">29. '+esc(d.qtext)+'</div>';
    h+='<div class="drill-p">'+d.sents.join(' ')+'</div>';
    if(d.note) h+='<div class="note">'+esc(d.note)+'</div>';

    h+='<table><tr><th style="width:8%">번호</th><th style="width:20%">밑줄</th>'
     +'<th style="width:26%">어느 포인트인가</th><th style="width:20%">판정</th>'
     +'<th>확인한 근거 한 줄</th></tr>'
     +d.items.map(function(it){
        return '<tr><td style="text-align:center" class="cn">'+cn(it.n)+'</td>'
         +'<td style="font-family:\'Noto Serif\',serif"><b>'+esc(it.word)+'</b></td>'
         +'<td style="height:27px"></td>'
         +'<td style="font-size:11px;color:var(--grey)">맞음 <i class="chk"></i>'
         +'&nbsp;&nbsp;틀림 <i class="chk"></i></td><td></td></tr>';
       }).join('')+'</table>';

    h+='<div class="answer-row"><span class="lab">정답</span><span class="circle">?</span>'
     +'<span class="lab" style="margin-left:12px">고쳐 쓰면</span>'
     +'<div class="blank" style="flex:1"></div></div>';

    h+='<div class="ans"><div class="ans-box">'
     +d.items.map(function(it){
        var P=POINTS[it.pt-1];
        return '<div><span class="k">'+cn(it.n)+' '+esc(it.word)+'</span>'
         +'<span style="color:var(--steel);font-weight:700">['+P.n+'. '+P.name+']</span> '
         +(it.ok?'맞음 — ':'<b style="color:var(--wine)">틀림 ← 정답</b> — ')
         +it.why+(it.fix?' <b>→ '+esc(it.fix)+'</b>':'')+'</div>';
      }).join('')
     +(d.teachNote?'<div class="tip">'+d.teachNote+'</div>':'')
     +'</div></div>';

    return h+'<div class="foot"><span>대단한영어 GREATENG · 29번 어법</span><span>'+esc(d.src)+'</span></div></section>';
  }

  function render(){
    var v=selD.value, h=sheetPoints();
    DRILLS.filter(function(d){ return v==='__all__'||d.id===v; })
          .forEach(function(d){ h+=sheetDrill(d); });
    root.innerHTML=h;
  }

  var all=document.createElement('option');
  all.value='__all__'; all.textContent='전체 ('+DRILLS.length+'회차)';
  selD.appendChild(all);
  DRILLS.forEach(function(d){
    var o=document.createElement('option');
    o.value=d.id; o.textContent=d.src; selD.appendChild(o);
  });
  selD.value='__all__';
  selD.addEventListener('change', render);

  btn.addEventListener('click', function(){
    var on=document.body.classList.toggle('show-ans');
    btn.classList.toggle('on', on);
    btn.textContent=on?'교사용 해설 숨기기':'교사용 해설 보기';
    document.getElementById('warnAns').style.display=on?'inline':'none';
  });

  render();
})();
</script>
</body>
</html>
