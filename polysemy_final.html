<title>수능 다의어 파이널</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* 레이아웃: A4 낱장 시트를 화면에 그대로 쌓고, 인쇄 시 한 장씩 끊는다 */
:root{
  --desk:#e9ecf0; --paper:#ffffff; --ink:#1c2230; --muted:#5d6676; --line:#cfd5de;
  --accent:#24557f; --accent-soft:#e7eef6; --ans:#b0332b; --hl:#fff1b8;
  --f-title:"Noto Serif KR","Nanum Myeongjo",serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-en:"Source Serif 4","Times New Roman",Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#14181f; --paper:#1d222b; --ink:#e4e8ef; --muted:#9aa3b2; --line:#39414e;
  --accent:#8db6dc; --accent-soft:#25303d; --ans:#ff8a7e; --hl:#4a4320; color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#14181f; --paper:#1d222b; --ink:#e4e8ef; --muted:#9aa3b2; --line:#39414e;
  --accent:#8db6dc; --accent-soft:#25303d; --ans:#ff8a7e; --hl:#4a4320; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--desk);color:var(--ink);font-family:var(--f-body);font-size:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.bar{max-width:210mm;margin:0 auto 14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.bar h1{font-family:var(--f-title);font-size:20px;margin:0 auto 0 0;text-wrap:balance}
.grp{display:flex;gap:4px;flex-wrap:wrap}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--paper);color:var(--ink);
  padding:6px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{max-width:210mm;margin:0 auto 14px;color:var(--muted);font-size:12.5px;line-height:1.6}
.sheet{background:var(--paper);max-width:210mm;margin:0 auto 18px;padding:12mm 12mm 10mm;
  box-shadow:0 1px 3px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:9px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;
  border-bottom:2px solid var(--ink);padding-bottom:6px}
.head .ttl{font-family:var(--f-title);font-size:18px;font-weight:700}
.head .ttl small{font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--accent);
  letter-spacing:.06em;display:block;margin-bottom:2px}
.head .meta{font-size:11.5px;color:var(--muted);text-align:right;line-height:1.55}
.name{display:inline-block;min-width:34mm;border-bottom:1px solid var(--ink)}
.part{font-size:13px;font-weight:700;color:var(--accent);display:flex;gap:8px;align-items:baseline}
.part span{font-weight:400;color:var(--muted);font-size:11.5px}
.box{border:1px solid var(--accent);background:var(--accent-soft);padding:6px 10px;
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px 12px;font-size:12px}
.box div{min-width:0}
.cards{display:flex;flex-direction:column}
.card{display:grid;grid-template-columns:20px 92px minmax(0,1fr) 30mm;gap:8px;align-items:start;
  padding:5px 0;border-top:1px solid var(--line)}
.card:last-child{border-bottom:1px solid var(--line)}
.no{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;padding-top:2px}
.w{font-family:var(--f-en);font-weight:700;font-size:15px;line-height:1.2}
.w i{display:block;font-family:var(--f-body);font-style:normal;font-weight:400;font-size:11px;color:var(--muted);margin-top:2px}
.s{font-family:var(--f-en);font-size:13px;line-height:1.45;min-width:0}
.s b{background:var(--hl);padding:0 2px;font-weight:700}
.src{font-family:var(--f-body);font-size:10.5px;color:var(--muted);white-space:nowrap}
.blank{border:1px solid var(--line);min-height:28px;padding:3px 6px;font-size:12px;line-height:1.35;color:var(--ans);font-weight:500}
.blank .k{font-weight:700;margin-right:3px}
.pairs{display:flex;flex-direction:column;gap:12px}
.pair{border-top:1px solid var(--line);padding-top:6px;display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px}
.pair .w{font-size:14.5px;margin-bottom:3px}
.ln{display:grid;grid-template-columns:18px minmax(0,1fr) 44mm;gap:6px;align-items:start;margin-top:5px}
.ln .blank{min-height:34px}
.ln .ab{font-size:12px;color:var(--muted);padding-top:1px}
.foot{margin-top:auto;font-size:10.5px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:4px}
.student .blank{color:transparent}
.student .blank *{visibility:hidden}
@media (max-width:640px){
  .sheet{padding:16px 14px}
  .box{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card{grid-template-columns:20px minmax(0,1fr)}
  .card .s,.card .blank{grid-column:2}
  .ln{grid-template-columns:18px minmax(0,1fr)}
  .ln .blank{grid-column:2}
}
@media print{
  @page{size:A4;margin:0}
  :root{--desk:#fff;--paper:#fff;--ink:#000;--muted:#444;--line:#999;--accent:#1d4a72;--accent-soft:#eef3f8;--ans:#b0332b;--hl:#fff1b8;color-scheme:light}
  body{padding:0;background:#fff}
  .bar,.hint{display:none}
  .sheet{box-shadow:none;margin:0;max-width:none;width:210mm;height:297mm;break-after:page;overflow:hidden}
  .card,.pair{break-inside:avoid}
}
</style>

<script>
const R = [{"t": "1회 · 동사 ①", "box": ["(결과를) 내놓다, 산출하다", "(규칙을) 지키다, 준수하다", "(기능·역할을) 하다", "(마음을) 사로잡다", "(문제를) 다루다", "(문제를) 일으키다, 제기하다", "(사건이) 해결되다, 합의되다", "(업무를) 수행하다", "(위험에) 대비하다, 감당하다", "개최하다, 열다", "끌어들이다", "허락하다, 인정해 주다"], "A": [{"w": "address", "src": "2023수능 35번", "s": "In order to <b>address</b> serious noise issues in school, students, parents and teachers should search for a solution together.", "known": "주소", "ans": "(문제를) 다루다", "key": "ⓔ"}, {"w": "observe", "src": "2026수능 21번", "s": "No offices or factories need to be built, no local regulations are <b>observed</b>, and ― in most cases ― no local taxes are paid.", "known": "관찰하다", "ans": "(규칙을) 지키다, 준수하다", "key": "ⓑ"}, {"w": "grant", "src": "2022수능 31번", "s": "If they are getting extra laughs by exaggerating the silliness of a situation or even by making up a few details, we are happy to <b>grant</b> them comic licence, a kind of poetic licence.", "known": "주다", "ans": "허락하다, 인정해 주다", "key": "ⓛ"}, {"w": "yield", "src": "2026수능 36번", "s": "It seems to <b>yield</b> a smooth time scale but in fact does not: …", "known": "양보하다", "ans": "(결과를) 내놓다, 산출하다", "key": "ⓐ"}, {"w": "present", "src": "2025수능 30번", "s": "For example, competition <b>presents</b> an inevitable conflict between the motivation to achieve one’s personal goal and the desire to maintain good relationships with others.", "known": "선물; 현재의", "ans": "(문제를) 일으키다, 제기하다", "key": "ⓕ"}, {"w": "cover", "src": "2026수능 31번", "s": "Their access to information in multiple markets enabled them to easily <b>cover</b> the risks associated with agricultural commodity trade.", "known": "덮다", "ans": "(위험에) 대비하다, 감당하다", "key": "ⓘ"}, {"w": "conduct", "src": "2022수능 35번", "s": "Since their introduction, information systems have substantially changed the way business is <b>conducted</b>.", "known": "지휘하다", "ans": "(업무를) 수행하다", "key": "ⓗ"}, {"w": "engage", "src": "2022수능 32번", "s": "Popular formats can be said to enhance understanding by <b>engaging</b> an audience unwilling to endure the longer verbal orientation of older news formats.", "known": "약혼하다", "ans": "(마음을) 사로잡다", "key": "ⓓ"}, {"w": "hold", "src": "2025수능 18번", "s": "We hope you understand and we promise to <b>hold</b> another race in the near future.", "known": "잡다", "ans": "개최하다, 열다", "key": "ⓙ"}, {"w": "draw", "src": "2025수능 31번", "s": "The language becomes ‘transparent’ — the fiction <b>draws</b> the whole person into its own world.", "known": "그리다", "ans": "끌어들이다", "key": "ⓚ"}, {"w": "serve", "src": "2024수능 36번", "s": "In these and sometimes other forms of negotiation, negotiation <b>serves</b> functions other than reconciling conflicting interests.", "known": "(음식을) 내다", "ans": "(기능·역할을) 하다", "key": "ⓒ"}, {"w": "settle", "src": "2023수능 37번", "s": "In this approach, lawyers do not receive fees or payment until the case is <b>settled</b>, when they are paid a percentage of the money that the client receives.", "known": "정착하다", "ans": "(사건이) 해결되다, 합의되다", "key": "ⓖ"}], "B": [{"w": "grant", "p": [{"src": "2022수능 31번", "s": "… we are happy to <b>grant</b> them comic licence, a kind of poetic licence.", "ans": "v. 허락하다, 인정해 주다"}, {"src": "2026수능 35번", "s": "In the short term, the impact of missing that <b>grant</b> deadline may be greater than the impact of missing a woodworking class.", "ans": "n. 보조금, 지원금"}]}, {"w": "yield", "p": [{"src": "2026수능 36번", "s": "It seems to <b>yield</b> a smooth time scale but in fact does not: …", "ans": "v. 내놓다, 산출하다"}, {"src": "2022수능 30번", "s": "Large-scale adoption of “organic” farming methods, however, would reduce <b>yields</b> and increase production costs for many major crops.", "ans": "n. 수확량"}]}, {"w": "cover", "p": [{"src": "2026수능 31번", "s": "Their access to information in multiple markets enabled them to easily <b>cover</b> the risks associated with agricultural commodity trade.", "ans": "(위험에) 대비하다"}, {"src": "2023수능 31번", "s": "… in their broader journalistic role of <b>covering</b> sport in its many forms, sports journalists are among the most visible of all contemporary writers.", "ans": "취재하다, 보도하다"}]}, {"w": "observe", "p": [{"src": "2026수능 21번", "s": "No offices or factories need to be built, no local regulations are <b>observed</b>, and ― in most cases ― no local taxes are paid.", "ans": "준수하다"}, {"src": "2024수능 37번", "s": "They will <b>observe</b> the regularity of behavior and decide on their own that they ought to conform.", "ans": "관찰하다, 알아차리다"}]}, {"w": "hold", "p": [{"src": "2025수능 18번", "s": "We hope you understand and we promise to <b>hold</b> another race in the near future.", "ans": "개최하다"}, {"src": "2023수능 20번", "s": "The strategy is to analyze all the possible scenarios that the future <b>holds</b> and then to see what proportion of them lead to success or failure.", "ans": "(앞으로) 품고 있다, 가져오다"}]}, {"w": "serve", "p": [{"src": "2024수능 36번", "s": "In these and sometimes other forms of negotiation, negotiation <b>serves</b> functions other than reconciling conflicting interests.", "ans": "(기능을) 하다"}, {"src": "2026수능 24번", "s": "This could also lead to smaller non-commercial independent events being set up that would only <b>serve</b> to divide audiences further.", "ans": "serve to do: (결국) ~하는 결과가 되다"}]}]}, {"t": "2회 · 동사 ②", "box": ["(강연을) 하다", "(돈을) 모으다, 거두다", "(범죄를) 저지르다", "(주의를) 끌다", "(책임을) 이행하다", "a. 예비의", "v. 이루다, 형성하다", "v. 중요하다", "v. 특징으로 하다, 갖추다", "~로 여기다, 취급하다", "운영하다", "직면하다, 맞닥뜨리다"], "A": [{"w": "raise", "src": "2022수능 36번", "s": "The money <b>raised</b> through the tax can be used directly by the government either to supply services or to search for alternatives.", "known": "올리다", "ans": "(돈을) 모으다, 거두다", "key": "ⓑ"}, {"w": "run", "src": "2026수능 43~45번", "s": "Duvall nearly invented a drug for eternal life, yet disappeared one day and ended up <b>running</b> Café Paris.", "known": "달리다", "ans": "운영하다", "key": "ⓚ"}, {"w": "feature", "src": "2024수능 30번", "s": "Bazaar economies <b>feature</b> an apparently flexible price-setting mechanism that sits atop
