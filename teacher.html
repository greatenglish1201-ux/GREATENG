function callClaude(key,sys,user){
  if(!key) throw new Error('API 키 없음');
  return fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':key,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:4096,
      system:sys,messages:[{role:'user',content:user}]})
  }).then(r=>r.json());
}

function parseJSON(text){
  let s=text.replace(/```(?:json)?|```/g,'').trim();
  if(!s.endsWith('}')){const i=s.lastIndexOf('}');if(i>0)s=s.slice(0,i+1);}
  return JSON.parse(s);
}

function sheetsGet(url,params){
  return new Promise((res,rej)=>{
    const cb='cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const qs=Object.entries(params).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
    const sc=document.createElement('script');
    sc.src=url+'?'+qs+'&callback='+cb;
    window[cb]=(d)=>{delete window[cb];sc.remove();res(d);};
    sc.onerror=()=>rej(new Error('연결 실패'));
    setTimeout(()=>{if(window[cb]){delete window[cb];rej(new Error('시간 초과'));}},12000);
    document.body.appendChild(sc);
  });
}

function sheetsSave(url,passage){
  return new Promise((res,rej)=>{
    const cb='cb_save_'+Date.now();
    const encoded=encodeURIComponent(JSON.stringify(passage));
    const sc=document.createElement('script');
    sc.src=url+'?action=save&data='+encoded+'&callback='+cb;
    window[cb]=(d)=>{delete window[cb];sc.remove();res(d);};
    sc.onerror=()=>rej(new Error('저장 실패'));
    setTimeout(()=>{if(window[cb]){delete window[cb];rej(new Error('시간 초과'));}},12000);
    document.body.appendChild(sc);
  });
}

function Highlighted({text,words}){
  if(!words||!words.length) return React.createElement(React.Fragment,null,text);
  const sorted=[...words].sort((a,b)=>b.length-a.length);
  const esc=w=>w.replace(/[-.*+?^${}()|[\]\\]/g,'\\$&');
  const pat=new RegExp('('+sorted.map(esc).join('|')+')','gi');
  const parts=text.split(pat);
  return React.createElement(React.Fragment,null,...parts.map((p,i)=>
    sorted.some(w=>w.toLowerCase()===p.toLowerCase())
      ?<mark key={i} style={{background:'#FFD700',color:'inherit',borderRadius:2,padding:'0 2px',fontWeight:700}}>{p}</mark>
      :p
  ));
}

const makeSlot=i=>({
  id:i,text:'',viewMode:'teacher',
  meta:{source:'ABSO',chapter:'01',number:String(i+1).padStart(3,'0'),difficulty:'중'},
  status:'idle',analysis:null,error:'',open:true,
});

function saveSlots(slots){
  try{localStorage.setItem(LS.SLOTS,JSON.stringify(
    slots.map(s=>({id:s.id,text:s.text,meta:s.meta,status:s.status,analysis:s.analysis,error:'',open:s.open}))
  ));}catch(e){}
}
function loadSlots(){
  try{
    const raw=localStorage.getItem(LS.SLOTS);
    if(!raw)return null;
    const saved=JSON.parse(raw);
    return Array.from({length:5},(_,i)=>{
      const s=saved.find(x=>x.id===i);
      return s?{...makeSlot(i),...s,error:''}:makeSlot(i);
    });
  }catch(e){return null;}
}

/* ── DOCX 학생용 (흑백 A4 1페이지) ── */
function buildDOCX(slot,mode){
  const {Document,Packer,Paragraph,TextRun,Table,TableRow,TableCell,
    AlignmentType,BorderStyle,WidthType,ShadingType,VerticalAlign}=docx;
  const IS=mode==='student';
  const {analysis,meta}=slot;
  if(!analysis)return;
  const {sentences=[],flow={},grammar={}}=analysis;
  const {blocks=[],interBlockConnectors=[],keyword='',topicSummary='',structureType=''}=flow;
  const {difficultSentences=[]}=grammar;
  const sm=Object.fromEntries(sentences.map(s=>[s.num,s]));
  const conn=i=>interBlockConnectors[i]||'→';
  const id=meta.source+'_'+String(meta.chapter).padStart(2,'0')+'_'+String(meta.number).padStart(3,'0');
  const F='Malgun Gothic',P9=18,P8=16,P10=20;
  const nb={style:BorderStyle.NONE,size:0,color:'FFFFFF'};
  const bd=(c='888888',sz=3)=>({style:BorderStyle.SINGLE,size:sz,color:c});
  const nobs={top:nb,bottom:nb,left:nb,right:nb};
  const CM={top:60,bottom:60,left:100,right:100};
  const cell=(children,opts={})=>new TableCell({
    borders:opts.borders||{top:bd(opts.bc||'AAAAAA'),bottom:bd(opts.bc||'AAAAAA'),
      left:bd(opts.bc||'AAAAAA'),right:bd(opts.bc||'AAAAAA')},
    shading:opts.bg?{fill:opts.bg,type:ShadingType.CLEAR}:undefined,
    width:opts.w?{size:opts.w,type:WidthType.DXA}:undefined,
    verticalAlign:VerticalAlign.CENTER,margins:opts.m||CM,children,
  });
  const para=(text,opts={})=>new Paragraph({
    alignment:opts.a||AlignmentType.LEFT,
    spacing:{before:opts.sb||0,after:opts.sa||40},
    border:opts.border,indent:opts.indent,
    children:Array.isArray(text)?text:[new TextRun({
      text:String(text||''),bold:opts.bold||false,size:opts.size||P9,
      color:opts.color||'1a1a1a',font:F,italics:opts.italic||false})],
  });
  const run=(text,opts={})=>new TextRun({
    text:String(text||''),bold:opts.bold||false,size:opts.size||P9,
    color:opts.color||'1a1a1a',font:F,italics:opts.italic||false});
  const blank=()=>new Paragraph({spacing:{after:80,before:0},
    border:{bottom:{style:BorderStyle.SINGLE,size:3,color:'888888',space:1}},
    children:[run(' ',{size:P9})]});
  const ch=[];

  /* 헤더 */
  ch.push(new Table({width:{size:9200,type:WidthType.DXA},columnWidths:[6500,2700],
    rows:[new TableRow({children:[
      cell([para([run('수능 영어 독해 — 흐름 분석',{bold:true,size:P10}),
        run('  '+(IS?'[학생용]':'[교사용]')+'  '+id,{size:P8,color:'666666'})],{sa:0})],
        {borders:nobs,w:6500,m:{top:0,bottom:0,left:0,right:0}}),
      cell([para([run('이름: ',{size:P8,color:'666666'}),run('____________',{size:P8}),
        run('  날짜: ',{size:P8,color:'666666'}),run('________',{size:P8})],
        {a:AlignmentType.RIGHT,sa:0})],
        {borders:nobs,w:2700,m:{top:0,bottom:0,left:0,right:0}}),
    ]})]
  }));
  ch.push(new Paragraph({spacing:{before:0,after:100},
    border:{bottom:{style:BorderStyle.SINGLE,size:8,color:'1a1a1a',space:1}},
    children:[run('')]}));

  /* 지문 */
  ch.push(para('■ 지문',{bold:true,size:P8,color:'333333',sa:60}));
  const pRuns=[];
  sentences.forEach(s=>{
    pRuns.push(run(nStr(s.num)+' ',{bold:true,size:P9}));
    pRuns.push(run(s.text+' ',{size:P9}));
  });
  ch.push(new Paragraph({spacing:{before:0,after:120},
    border:{left:{style:BorderStyle.SINGLE,size:10,color:'555555',space:6}},
    indent:{left:160},children:pRuns}));

  /* Block Diagram */
  ch.push(para('■ 글의 구조',{bold:true,size:P8,color:'333333',sb:60,sa:60}));
  const nc=blocks.length-1;
  const bw=Math.floor((9200-nc*440)/blocks.length);
  const colW=[];blocks.forEach((_,bi)=>{colW.push(bw);if(bi<blocks.length-1)colW.push(440);});
  const hCells=blocks.map((blk,bi)=>{
    const hd=IS?[blank()]:[para(blk.name,{bold:true,size:P9,sa:20}),para(blk.nameEn,{size:P8,italic:true,sa:0})];
    const c=cell(hd,{bg:'EEEEEE',bc:'666666',w:bw});
    if(bi<blocks.length-1)return[c,cell([para(conn(bi),{bold:true,size:P10,color:'444444',a:AlignmentType.CENTER,sa:0})],{borders:nobs,w:440})];
    return[c];
  }).flat();
  const maxS=Math.max(...blocks.map(b=>(b.sentenceNums||[]).length));
  const bRows=Array.from({length:maxS},(_,ri)=>{
    const rCells=blocks.map((blk,bi)=>{
      const sn=(blk.sentenceNums||[])[ri];
      const sent=sn?sm[sn]:null;
      const c=cell(sent?[para([run(nStr(sent.num)+' ',{bold:true,size:P9}),
        run('('+sent.symbol+')  ',{size:P8}),run(sent.role,{size:P8,color:'444444'})],{sa:0})]:[para('',{sa:0})],
        {bc:'BBBBBB',w:bw});
      if(bi<blocks.length-1)return[c,cell([para('',{sa:0})],{borders:nobs,w:440})];
      return[c];
    }).flat();
    return new TableRow({children:rCells});
  });
  ch.push(new Table({width:{size:9200,type:WidthType.DXA},columnWidths:colW,
    rows:[new TableRow({children:hCells}),...bRows]}));
  ch.push(para('',{sa:80}));

  /* 핵심소재/주제요약/구조 — 표 없이 텍스트 */
  ch.push(new Paragraph({spacing:{before:0,after:50},children:[run('▸ 핵심 소재: ',{bold:true,size:P8}),IS?run('_________________________',{size:P8}):run(keyword,{size:P9})]}));
  ch.push(new Paragraph({spacing:{before:0,after:50},children:[run('▸ 주제 요약: ',{bold:true,size:P8}),IS?run('_________________________',{size:P8}):run(topicSummary,{size:P9})]}));
  ch.push(new Paragraph({spacing:{before:0,after:100},children:[run('▸ 구조 유형: ',{bold:true,size:P8}),IS?run('_________________________',{size:P8}):run(structureType,{size:P9})]}));

  /* 문장별 분석 */
  const dsToShow=IS?sentences.filter(s=>difficultSentences.find(d=>d.num===s.num)):sentences;
  if(dsToShow.length){
    ch.push(para(IS?'■ 구문 분석':'■ 문장별 분석 (끊어읽기 + 구문)',{bold:true,size:P8,color:'333333',sb:60,sa:60}));
    dsToShow.forEach(s=>{
      const ds=difficultSentences.find(d=>d.num===s.num);
      const chunks=s.chunks||[];
      ch.push(new Paragraph({spacing:{before:0,after:30},
        border:{bottom:{style:BorderStyle.SINGLE,size:3,color:'CCCCCC',space:1}},
        children:[run(nStr(s.num)+' ('+s.symbol+')  ',{bold:true,size:P9}),run(s.text,{size:P8,italic:true,color:'333333'})]}));
      if(!IS&&chunks.length){
        ch.push(new Paragraph({spacing:{before:30,after:0},indent:{left:200},
          children:[run(chunks.map(c=>c.en||'').join(' / '),{size:P8,italic:true})]}));
        ch.push(new Paragraph({spacing:{before:0,after:40},indent:{left:200},
          children:[run(chunks.map(c=>c.ko||'').join(' / '),{size:P8,color:'444444'})]}));
      }
      if(ds){
        [{l:'구조',f:'structure'},{l:'해석',f:'translation'},{l:'포인트',f:'point'}].forEach(r=>{
          ch.push(new Paragraph({spacing:{before:0,after:20},indent:{left:200},children:[
            run('['+r.l+'] ',{bold:true,size:P8,color:'555555'}),
            IS&&r.f==='translation'?run('______________________________',{size:P8}):run(ds[r.f]||'',{size:P8}),
          ]}));
        });
      }
      ch.push(para('',{sa:60}));
    });
  }

  const doc=new Document({
    styles:{default:{document:{run:{font:F,size:P9}}}},
    sections:[{properties:{page:{size:{width:11906,height:16838},margin:{top:700,right:700,bottom:700,left:700}}},children:ch}]
  });
  Packer.toBlob(doc).then(blob=>saveAs(blob,id+'_'+(IS?'학생용':'교사용')+'.docx'));
}

/* ── HTML 출력 ── */
function buildHTML(slot,mode){
  const IS=mode==='student';
  const {analysis,meta}=slot;
  if(!analysis)return'';
  const {sentences=[],flow={},grammar={}}=analysis;
  const {blocks=[],interBlockConnectors=[],keyword='',topicSummary='',structureType=''}=flow;
  const {difficultSentences=[]}=grammar;
  const sm=Object.fromEntries(sentences.map(s=>[s.num,s]));
  const conn=i=>interBlockConnectors[i]||'→';
  const id=meta.source+'_'+String(meta.chapter).padStart(2,'0')+'_'+String(meta.number).padStart(3,'0');
  const esc=w=>w.replace(/[-.*+?^${}()|[\]\\]/g,'\\$&');
  const hlHTML=(text,words)=>{
    if(!words||!words.length)return text;
    const sorted=[...words].sort((a,b)=>b.length-a.length);
    const pat=new RegExp('('+sorted.map(esc).join('|')+')','gi');
    return text.replace(pat,m=>'<mark style="background:#FFD700;color:inherit;border-radius:2px;padding:0 2px;font-weight:700">'+m+'</mark>');
  };
  const passHTML=sentences.map(s=>{
    const sc=SM[s.symbol]||{};
    return'<span><span style="font-size:12px;font-weight:700;color:'+sc.tx+';margin-right:4px">'+nStr(s.num)+'</span>'+hlHTML(s.text,s.keyWords||[])+' </span>';
  }).join('');
  const blockCards=blocks.map((blk,bi)=>{
    const c=BC[blk.color]||BC.blue;
    const ss=(blk.sentenceNums||[]).map(n=>sm[n]).filter(Boolean);
    const hd=IS
      ?'<div style="border-bottom:2px solid '+c.bd+';height:22px;width:85%;margin-bottom:5px"></div>'
      :'<div style="font-size:1em;font-weight:700;color:'+c.tx+'">'+blk.name+'</div><div style="font-size:.72em;color:'+c.tx+';font-style:italic;font-weight:600;opacity:.85">'+blk.nameEn+'</div>';
    const rows=ss.map((sent,si)=>{
      const sc=SM[sent.symbol]||{};
      const arr=si>0?'<div style="font-size:9px;color:#ccc;margin:1px 0 1px 20px">↓</div>':'';
      return arr+'<div style="display:flex;align-items:flex-start;gap:6px;padding:5px 7px;border-radius:6px;background:'+sc.bg+';margin-bottom:3px"><span style="font-size:1em;font-weight:700;color:'+sc.tx+';flex-shrink:0;margin-top:1px">'+nStr(sent.num)+'</span><div style="flex:1;min-width:0"><span style="font-size:.7em;font-weight:700;padding:1px 4px;border-radius:3px;background:rgba(255,255,255,.6);color:'+sc.tx+';border:1px solid '+sc.bd+'">'+sent.symbol+'</span><div style="font-size:.75em;color:#444;word-break:keep-all;line-height:1.4;margin-top:2px">'+sent.role+'</div></div></div>';
    }).join('');
    const connDiv=bi<blocks.length-1?'<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex-shrink:0;padding-top:50px;min-width:32px"><div style="font-size:1.2em;font-weight:700;color:#666">'+conn(bi)+'</div><div style="font-size:.6em;color:#bbb;text-align:center">'+(SM[conn(bi)]&&SM[conn(bi)].lbl||'')+'</div></div>':'';
    return'<div style="flex:1 1 130px;min-width:0;border-radius:10px;border:2px solid '+c.bd+'"><div style="padding:8px 11px;background:'+c.hd+';border-bottom:1.5px solid '+c.bd+';border-radius:8px 8px 0 0">'+hd+'</div><div style="padding:7px;background:#fff">'+rows+'</div></div>'+connDiv;
  }).join('');
  const dsToShow=IS?sentences.filter(s=>difficultSentences.find(d=>d.num===s.num)):sentences;
  const analysisHTML=dsToShow.map(s=>{
    const sc=SM[s.symbol]||{};
    const ds=difficultSentences.find(d=>d.num===s.num);
    const chunks=s.chunks||[];
    const chunksDiv=!IS&&chunks.length?'<div style="padding:7px 12px;background:#fff;border-top:1px dashed #eee"><div style="font-size:.85em;font-style:italic;color:#222;line-height:1.9;word-break:keep-all">'+chunks.map(c=>c.en||'').join(' / ')+'</div><div style="font-size:.85em;color:#555;line-height:1.9;word-break:keep-all;border-top:1px dashed #e8e8e8;margin-top:3px;padding-top:3px">'+chunks.map(c=>c.ko||'').join(' / ')+'</div></div>':'';
    const diffDiv=ds?'<div style="padding:7px 12px;background:#fafafa;border-top:1px dashed #eee">'+[{l:'구조',f:'structure'},{l:'해석',f:'translation'},{l:'포인트',f:'point'}].map(r=>'<div style="display:flex;gap:8px;padding:3px 0;border-bottom:1px dashed #f0f0f0;align-items:flex-start"><span style="font-size:.7em;font-weight:700;color:#888;flex-shrink:0;width:32px;padding-top:1px">'+r.l+'</span>'+(IS&&r.f==='translation'?'<div style="flex:1;border-bottom:1px solid #bbb;height:20px"></div>':'<div style="font-size:.88em;color:#333;word-break:keep-all;flex:1">'+(ds[r.f]||'')+'</div>')+'</div>').join('')+'</div>':'';
    if(!chunksDiv&&!diffDiv)return'';
    return'<div style="margin-bottom:6px;border:0.5px solid '+sc.bd+';border-radius:8px;overflow:hidden"><div style="padding:6px 12px;background:'+sc.bg+';display:flex;align-items:center;gap:7px"><span style="font-size:1em;font-weight:700;color:'+sc.tx+'">'+nStr(s.num)+'</span><span style="font-size:.7em;font-weight:700;padding:1px 5px;border-radius:3px;background:rgba(255,255,255,.5);color:'+sc.tx+';border:1px solid '+sc.bd+'">'+s.symbol+'</span><span style="font-size:.85em;color:'+sc.tx+';font-style:italic;word-break:keep-all">'+s.text+'</span></div>'+chunksDiv+diffDiv+'</div>';
  }).filter(Boolean).join('');

  return'<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">'
    +'<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">'
    +'<title>'+id+' '+(IS?'학생용':'교사용')+'</title>'
    +'<style>*{box-sizing:border-box;margin:0;padding:0}'
    +'body{font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#1a1a1a;background:#fff;'
    +'font-size:14px;line-height:1.65;padding:13mm 13mm 11mm;word-break:keep-all}'
    +'@page{size:A4;margin:9mm 11mm}'
    +'@media print{.np{display:none!important}body{padding:0}}'
    +'@media screen and (min-width:1024px){body{font-size:16px;padding:24px 28px}}'
    +'@media screen and (min-width:1194px){body{font-size:17px;padding:28px 32px}}'
    +'</style></head><body>'
    +'<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;border-bottom:2.5px solid #1a1a1a;padding-bottom:6px">'
    +'<div style="font-size:1.1em;font-weight:700">수능 영어 독해 — 흐름 분석 <span style="font-size:.62em;color:#888;font-weight:400;margin-left:6px">'+id+' '+(IS?'학생용':'교사용')+'</span></div>'
    +'<div style="font-size:.8em;color:#666;display:flex;gap:16px"><span>이름: <span style="display:inline-block;width:80px;border-bottom:1px solid #999">&nbsp;</span></span><span>날짜: <span style="display:inline-block;width:70px;border-bottom:1px solid #999">&nbsp;</span></span></div>'
    +'</div>'
    +'<div style="border-left:4px solid #185FA5;background:#fafafa;border-radius:0 8px 8px 0;padding:12px 16px;font-size:1em;line-height:2.2;margin-bottom:14px;word-break:keep-all;overflow-wrap:break-word">'+passHTML+'</div>'
    +'<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:14px">'+SYMS.map(s=>{const sc=SM[s]||{};return'<span style="display:flex;align-items:center;gap:4px;font-size:.72em;color:#666;padding:3px 9px;border:0.5px solid #e0e0e0;border-radius:4px"><span style="width:8px;height:8px;border-radius:2px;background:'+sc.bd+';display:inline-block"></span>('+s+') '+sc.lbl+'</span>';}).join('')+'</div>'
    +'<div style="font-size:.72em;font-weight:700;color:#666;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px">글의 구조 — Block Diagram</div>'
    +'<div style="display:flex;align-items:flex-start;gap:5px;margin-bottom:16px;flex-wrap:wrap">'+blockCards+'</div>'
    +'<div style="display:grid;grid-template-columns:1fr 2fr 1.5fr;gap:8px;margin-bottom:16px">'
    +[{lbl:'핵심 소재',val:keyword},{lbl:'주제 한 줄 요약',val:topicSummary},{lbl:'구조 유형',val:structureType}].map(({lbl,val})=>
      '<div style="padding:9px 12px;background:#f8f8f8;border-radius:8px;border:0.5px solid #e5e5e5"><div style="font-size:.68em;font-weight:700;color:#888;letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px">'+lbl+'</div>'+(IS?'<div style="border-bottom:1.5px solid #aaa;height:22px"></div>':'<div style="font-size:.88em;word-break:keep-all">'+val+'</div>')+'</div>'
    ).join('')+'</div>'
    +(analysisHTML?'<div style="border-top:1.5px solid #e5e5e5;padding-top:14px"><div style="font-size:.72em;font-weight:700;color:#666;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px">'+(IS?'구문 분석':'문장별 분석 — 끊어읽기 & 구문')+'</div>'+analysisHTML+'</div>':'')
    +'<div class="np" style="margin-top:20px;text-align:center;padding-top:14px;border-top:1px solid #eee"><button onclick="window.print()" style="padding:10px 28px;font-size:14px;font-weight:500;background:#185FA5;color:#fff;border:none;border-radius:8px;cursor:pointer">🖨 인쇄 / PDF 저장</button></div>'
    +'</body></html>';
}

function dlHTML(slot,mode){
  const html=buildHTML(slot,mode);
  const id=slot.meta.source+'_'+String(slot.meta.chapter).padStart(2,'0')+'_'+String(slot.meta.number).padStart(3,'0');
  const blob=new Blob([html],{type:'text/html;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=id+'_'+(mode==='teacher'?'교사용':'학생용')+'.html';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}

function App(){
  const [slots,setSlots]=useState(()=>loadSlots()||Array.from({length:5},(_,i)=>makeSlot(i)));
  const [viewMode,setViewMode]=useState('teacher');
  const [apiKey,setApiKey]=useState(()=>localStorage.getItem(LS.KEY)||'');
  const [appsURL,setAppsURL]=useState(()=>localStorage.getItem(LS.URL)||'');
  const [keyInput,setKeyInput]=useState('');
  const [urlInput,setUrlInput]=useState('');
  const [showSet,setShowSet]=useState(false);
  const [msg,setMsg]=useState('');
  const running=useRef(false);

  useEffect(()=>{saveSlots(slots);},[slots]);
  const flash=(m,t=3000)=>{setMsg(m);setTimeout(()=>setMsg(''),t);};
  const upSlot=useCallback((id,patch)=>setSlots(p=>p.map(s=>s.id===id?{...s,...patch}:s)),[]);

  const upAnalysis=useCallback((id,path,val)=>setSlots(p=>p.map(s=>{
    if(s.id!==id)return s;
    const a=JSON.parse(JSON.stringify(s.analysis));
    const parts=path.split('.');let cur=a;
    for(let i=0;i<parts.length-1;i++){if(cur[parts[i]]===undefined)cur[parts[i]]={};cur=cur[parts[i]];}
    cur[parts[parts.length-1]]=val;
    return{...s,analysis:a};
  })),[]);

  const handleMeta=useCallback((id,f,v)=>setSlots(prev=>{
    const next=prev.map(s=>s.id===id?{...s,meta:{...s.meta,[f]:v}}:s);
    if(id===0&&(f==='chapter'||f==='number')){
      const bCh=parseInt(f==='chapter'?v:next[0].meta.chapter)||1;
      const bN=parseInt(f==='number'?v:next[0].meta.number)||1;
      return next.map(s=>s.id===0?s:{...s,meta:{...s.meta,
        chapter:String(bCh).padStart(2,'0'),
        number:String(bN+s.id).padStart(3,'0')}});
    }
    return next;
  }),[]);

  const doAnalyze=useCallback(async(slot)=>{
    upSlot(slot.id,{status:'analyzing',error:''});
    try{
      const d=await callClaude(apiKey,FLOW_SYS,slot.text);
      if(d.error)throw new Error(d.error.message||JSON.stringify(d.error));
      const p=parseJSON(d.content[0].text);
      upSlot(slot.id,{status:'analyzed',meta:{...slot.meta,difficulty:p.difficulty||'중'},
        analysis:{sentences:p.sentences||[],
          flow:{blocks:p.blocks||[],interBlockConnectors:p.interBlockConnectors||[],
            keyword:p.keyword||'',topicSummary:p.topicSummary||'',structureType:p.structureType||''},
          grammar:{difficultSentences:p.difficultSentences||[]}},open:true});
    }catch(e){upSlot(slot.id,{status:'idle',error:'오류: '+e.message});}
  },[upSlot,apiKey]);

  const runAll=useCallback(async()=>{
    if(running.current)return;
    if(!apiKey){alert('API Key를 먼저 설정해주세요.');setShowSet(true);return;}
    running.current=true;
    for(const slot of slots.filter(s=>s.text.trim()&&s.status==='idle')){
      await doAnalyze(slot);
    }
    running.current=false;
  },[slots,doAnalyze,apiKey]);

  const reanalyze=useCallback(async(slot)=>{
    if(!confirm('흐름 분석을 다시 할까요?'))return;
    upSlot(slot.id,{status:'idle',analysis:null,error:''});
    setTimeout(()=>doAnalyze({...slot,status:'idle'}),100);
  },[upSlot,doAnalyze]);

  const saveSheet=useCallback(async(slot)=>{
    if(!appsURL){alert('Apps Script URL을 설정해주세요.');return;}
    try{
      const {meta,analysis}=slot;
      const id=meta.source+'_'+String(meta.chapter).padStart(2,'0')+'_'+String(meta.number).padStart(3,'0');
      await sheetsSave(appsURL,{id,...meta,confirmed:true,
        sentences:analysis?.sentences||[],flow:analysis?.flow||{},grammar:analysis?.grammar||{}});
      upSlot(slot.id,{status:'saved'});flash('✓ '+id+' 저장 완료');
    }catch(e){alert('저장 오류: '+e.message);}
  },[appsURL,upSlot]);

  const loadSheet=useCallback(async()=>{
    if(!appsURL){alert('Apps Script URL을 설정해주세요.');return;}
    flash('불러오는 중...');
    try{
      const data=await sheetsGet(appsURL,{action:'getAll'});
      const ps=(data.passages||[]).filter(p=>p.sentences&&p.sentences.length).slice(0,5);
      if(!ps.length){flash('저장된 분석 없음');return;}
      setSlots(Array.from({length:5},(_,i)=>{
        const p=ps[i];if(!p)return makeSlot(i);
        return{...makeSlot(i),text:(p.sentences||[]).map(s=>s.text).join(' '),
          meta:{source:p.source||'ABSO',chapter:p.chapter||'01',number:p.number||'001',difficulty:p.difficulty||'중'},
          status:p.confirmed?'saved':'analyzed',
          analysis:{sentences:p.sentences||[],flow:p.flow||{},grammar:p.grammar||{}},open:true};
      }));
      flash('✓ '+ps.length+'개 불러오기 완료');
    }catch(e){flash('불러오기 실패: '+e.message,4000);}
  },[appsURL]);

  const keyOk=apiKey.startsWith('sk-ant');
  const pending=slots.filter(s=>s.text.trim()&&s.status==='idle').length;
  const iB={border:'none',borderBottom:'1px dashed #ccc',background:'transparent',
    outline:'none',padding:'2px 0',fontFamily:'inherit',color:'inherit',width:'100%'};
  const sB={border:'none',background:'transparent',outline:'none',cursor:'pointer',fontFamily:'inherit'};

  return(
    <div style={{minHeight:'100vh',background:'#f2f3f7'}}>
      <div style={{background:'#185FA5',padding:'0 18px',display:'flex',alignItems:'center',
        justifyContent:'space-between',height:52,position:'sticky',top:0,zIndex:100,
        boxShadow:'0 2px 8px rgba(0,0,0,.18)'}}>
        <div style={{color:'#fff',fontWeight:700,fontSize:15}}>📘 GREATENG 분석 툴</div>
        <div style={{display:'flex',gap:7,alignItems:'center'}}>
          {msg&&<span style={{color:'#a5d6f5',fontSize:11.5}}>{msg}</span>}
          <div style={{display:'flex',gap:2,background:'rgba(0,0,0,.2)',borderRadius:7,padding:3}}>
            {['teacher','student'].map(m=>(
              <button key={m} onClick={()=>setViewMode(m)}
                style={{padding:'4px 12px',fontSize:12,fontWeight:600,
                  background:viewMode===m?'#fff':'transparent',
                  color:viewMode===m?'#185FA5':'rgba(255,255,255,.75)',
                  border:'none',borderRadius:5,cursor:'pointer'}}>
                {m==='teacher'?'교사용':'학생용'}
              </button>
            ))}
          </div>
          <span style={{fontSize:10.5,padding:'2px 8px',borderRadius:10,
            background:keyOk?'rgba(45,138,96,.4)':'rgba(200,60,40,.4)',
            color:keyOk?'#7febb6':'#ffb3a7'}}>{keyOk?'API ✓':'미설정'}</span>
          <button onClick={loadSheet} style={{background:'rgba(255,255,255,.15)',color:'#a5d6f5',
            border:'none',borderRadius:6,padding:'4px 10px',fontSize:11.5,cursor:'pointer'}}>☁ 불러오기</button>
          <button onClick={()=>{if(confirm('초기화?')){const f=Array.from({length:5},(_,i)=>makeSlot(i));setSlots(f);saveSlots(f);}}}
            style={{background:'rgba(255,255,255,.1)',color:'#ffb3a7',border:'none',
              borderRadius:6,padding:'4px 9px',fontSize:13,cursor:'pointer'}}>🗑</button>
          <a href="question.html" style={{background:'rgba(255,255,255,.15)',color:'#fff',
            border:'none',borderRadius:6,padding:'4px 10px',fontSize:11.5,cursor:'pointer',textDecoration:'none'}}>
            📝 문제 출제
          </a>
          <button onClick={()=>setShowSet(v=>!v)} style={{background:'rgba(255,255,255,.15)',
            color:'#fff',border:'none',borderRadius:6,padding:'4px 10px',fontSize:11.5,cursor:'pointer'}}>⚙</button>
        </div>
      </div>

      {showSet&&(
        <div style={{background:'#1a3d6e',padding:'14px 20px',display:'flex',flexDirection:'column',gap:10}}>
          {[{lbl:'Claude API Key',val:keyInput||(apiKey?'••••••••':''),set:setKeyInput,ph:'sk-ant-api03-...',type:'password'},
            {lbl:'Apps Script URL',val:urlInput||appsURL,set:setUrlInput,ph:'https://script.google.com/...',type:'text'}].map((r,i)=>(
            <div key={i} style={{display:'flex',gap:10,alignItems:'center'}}>
              <span style={{color:'#a5d6f5',fontSize:12.5,width:140,flexShrink:0}}>{r.lbl}</span>
              <input type={r.type} value={r.val} onChange={e=>r.set(e.target.value)}
                placeholder={r.ph} style={{flex:1,padding:'7px 10px',borderRadius:6,border:'none',
                  fontSize:12,fontFamily:'monospace'}}/>
            </div>
          ))}
          <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
            <span style={{fontSize:11,color:'#88aacc',alignSelf:'center'}}>브라우저에만 저장됩니다</span>
            <button onClick={()=>{
              const k=keyInput||apiKey,u=urlInput||appsURL;
              if(k){localStorage.setItem(LS.KEY,k);setApiKey(k);}
              if(u){localStorage.setItem(LS.URL,u);setAppsURL(u);}
              setShowSet(false);flash('설정 저장 ✓');
            }} style={{background:'#2d8a60',color:'#fff',border:'none',borderRadius:6,
              padding:'7px 20px',fontSize:12.5,cursor:'pointer',fontWeight:500}}>저장</button>
            <button onClick={()=>setShowSet(false)} style={{background:'rgba(255,255,255,.1)',
              color:'#ccc',border:'none',borderRadius:6,padding:'7px 12px',fontSize:12.5,cursor:'pointer'}}>닫기</button>
          </div>
        </div>
      )}

      <div style={{maxWidth:1000,margin:'0 auto',padding:'18px 14px'}}>
        {!keyOk&&<div style={{background:'#FFF8E6',border:'0.5px solid #F0C040',borderRadius:8,
          padding:'10px 16px',marginBottom:12,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <span style={{fontSize:13,color:'#856404'}}>⚠ Claude API Key가 없습니다.</span>
          <button onClick={()=>setShowSet(true)} style={{padding:'5px 14px',fontSize:12,
            background:'#856404',color:'#fff',border:'none',borderRadius:5,cursor:'pointer'}}>설정</button>
        </div>}

        <div style={{background:'#fff',borderRadius:10,border:'0.5px solid #e5e5e5',
          padding:'12px 16px',marginBottom:12,display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
          <span style={{fontSize:13,fontWeight:600,color:'#555'}}>교재</span>
          <div style={{display:'flex',gap:5}}>
            {SOURCES.map(src=>(
              <button key={src} onClick={()=>setSlots(prev=>prev.map(s=>({...s,meta:{...s.meta,source:src}})))}
                style={{padding:'5px 14px',fontSize:13,fontWeight:500,
                  background:slots.every(s=>s.meta.source===src)?'#185FA5':'#f0f0f0',
                  color:slots.every(s=>s.meta.source===src)?'#fff':'#555',
                  border:'none',borderRadius:6,cursor:'pointer'}}>{src}</button>
            ))}
          </div>
          <div style={{flex:1}}/>
          <span style={{fontSize:12.5,color:'#999'}}>{pending>0?'대기 '+pending+'개':'대기 없음'}</span>
          <button onClick={runAll} disabled={pending===0||!keyOk}
            style={{padding:'8px 22px',fontSize:13.5,fontWeight:600,
              background:pending>0&&keyOk?'#185FA5':'#ccc',color:'#fff',
              border:'none',borderRadius:7,cursor:pending>0&&keyOk?'pointer':'default'}}>
            🔍 전체 분석 ({pending}개)
          </button>
        </div>

        {slots.map(slot=>(
          <SlotCard key={slot.id} slot={slot} viewMode={viewMode} iB={iB} sB={sB}
            onText={v=>upSlot(slot.id,{text:v})}
            onMeta={handleMeta}
            onToggle={()=>upSlot(slot.id,{open:!slot.open})}
            onConfirm={()=>upSlot(slot.id,{status:'confirmed'})}
            onReanalyze={()=>reanalyze(slot)}
            onSave={()=>saveSheet(slot)}
            onAnalysis={upAnalysis}
          />
        ))}
      </div>
    </div>
  );
}

function SlotCard({slot,viewMode,iB,sB,onText,onMeta,onToggle,onConfirm,onReanalyze,onSave,onAnalysis}){
  const IS=viewMode==='student';
  const st=STATUS[slot.status]||STATUS.idle;
  const {sentences=[],flow={},grammar={}}=slot.analysis||{};
  const {blocks=[],interBlockConnectors=[],keyword='',topicSummary='',structureType=''}=flow;
  const {difficultSentences=[]}=grammar;
  const sm=Object.fromEntries(sentences.map(s=>[s.num,s]));
  const conn=i=>interBlockConnectors[i]||'→';
  const editable=slot.status!=='saved';
  const df=DIFF_STYLE[slot.meta.difficulty]||DIFF_STYLE['중'];

  return(
    <div style={{background:'#fff',borderRadius:12,border:'0.5px solid #e5e5e5',
      marginBottom:12,overflow:'hidden',
      boxShadow:slot.status==='saved'?'0 0 0 2px #185FA5':'none'}}>
      <div style={{padding:'11px 16px',display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',
        borderBottom:slot.open&&(slot.text||slot.analysis)?'0.5px solid #f0f0f0':'none',
        background:slot.status==='saved'?'#EDF4FF':'#fff'}}>
        <div style={{width:24,height:24,borderRadius:'50%',background:st.bg,color:st.color,
          display:'flex',alignItems:'center',justifyContent:'center',
          fontSize:11,fontWeight:700,flexShrink:0}}>{slot.id+1}</div>
        <span style={{fontSize:10,fontWeight:700,padding:'2px 8px',borderRadius:4,
          background:st.bg,color:st.color}}>{st.label}</span>
        <select value={slot.meta.source} onChange={e=>onMeta(slot.id,'source',e.target.value)}
          style={{...sB,fontSize:12.5,color:'#333',border:'0.5px solid #ddd',borderRadius:5,padding:'4px 8px'}}>
          {SOURCES.map(s=><option key={s} value={s}>{s}</option>)}
        </select>
        {['chapter','number'].map(f=>(
          <div key={f} style={{display:'flex',alignItems:'center',background:'#f5f5f5',
            borderRadius:6,border:'0.5px solid #ddd',overflow:'hidden'}}>
            <button onClick={()=>{const cur=parseInt(slot.meta[f])||1;const max=f==='chapter'?30:99;
              onMeta(slot.id,f,String(Math.max(1,cur-1)).padStart(f==='chapter'?2:3,'0'));}}
              style={{...sB,padding:'4px 8px',fontSize:14,color:'#555',borderRight:'0.5px solid #ddd'}}>▼</button>
            <span style={{fontSize:13,fontWeight:500,color:'#333',minWidth:f==='chapter'?26:30,
              textAlign:'center',padding:'0 2px'}}>{parseInt(slot.meta[f]||1)}{f==='chapter'?'강':'번'}</span>
            <button onClick={()=>{const cur=parseInt(slot.meta[f])||1;const max=f==='chapter'?30:99;
              onMeta(slot.id,f,String(Math.min(max,cur+1)).padStart(f==='chapter'?2:3,'0'));}}
              style={{...sB,padding:'4px 8px',fontSize:14,color:'#555',borderLeft:'0.5px solid #ddd'}}>▲</button>
          </div>
        ))}
        <select value={slot.meta.difficulty} onChange={e=>onMeta(slot.id,'difficulty',e.target.value)}
          style={{...sB,fontSize:12.5,fontWeight:600,color:df.color,border:'0.5px solid #ddd',
            borderRadius:5,padding:'4px 6px',background:df.bg}}>
          {DIFFS.map(d=><option key={d} value={d}>{d}</option>)}
        </select>
        {slot.status==='analyzed'&&<span style={{fontSize:10,color:'#bbb'}}>AI추정</span>}
        {slot.id===0&&slot.status==='idle'&&<span style={{fontSize:10,color:'#bbb'}}>↑ 이후 자동 연번</span>}
        <div style={{flex:1}}/>
        {slot.error&&<span style={{fontSize:11,color:'#c0392b',maxWidth:200,overflow:'hidden',
          textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={slot.error}>{slot.error}</span>}
        {slot.analysis&&(
          <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
            <button onClick={()=>dlHTML(slot,'teacher')} style={{padding:'4px 9px',fontSize:11,background:'#185FA5',color:'#fff',border:'none',borderRadius:5,cursor:'pointer'}}>HTML↓교사</button>
            <button onClick={()=>dlHTML(slot,'student')} style={{padding:'4px 9px',fontSize:11,background:'#2d8a60',color:'#fff',border:'none',borderRadius:5,cursor:'pointer'}}>HTML↓학생</button>
            <button onClick={()=>buildDOCX(slot,'teacher')} style={{padding:'4px 9px',fontSize:11,background:'#1F3864',color:'#fff',border:'none',borderRadius:5,cursor:'pointer'}}>DOCX↓교사</button>
            <button onClick={()=>buildDOCX(slot,'student')} style={{padding:'4px 9px',fontSize:11,background:'#1a5c3a',color:'#fff',border:'none',borderRadius:5,cursor:'pointer'}}>DOCX↓학생</button>
          </div>
        )}
        <button onClick={onToggle} style={{...sB,fontSize:13,color:'#ccc',padding:'3px 6px'}}>{slot.open?'▲':'▼'}</button>
      </div>

      {slot.open&&slot.status==='idle'&&(
        <div style={{padding:16}}>
          <textarea value={slot.text} onChange={e=>onText(e.target.value)}
            placeholder={'지문 '+(slot.id+1)+' 붙여넣기...'}
            style={{width:'100%',minHeight:100,padding:'10px 13px',fontSize:14,lineHeight:1.9,
              border:'0.5px solid #e0e0e0',borderRadius:8,resize:'vertical',fontFamily:'inherit',
              color:'#1a1a1a',background:'#fafafa'}}/>
        </div>
      )}

      {slot.open&&slot.analysis&&(
        <div style={{padding:16}}>
          {/* 지문 */}
          <div style={{borderLeft:'4px solid #185FA5',background:'#fafafa',borderRadius:'0 8px 8px 0',
            padding:'12px 16px',fontSize:15,lineHeight:2.2,marginBottom:12,
            wordBreak:'keep-all',overflowWrap:'break-word'}}>
            {sentences.map(s=>{
              const sc=SM[s.symbol]||{};
              return<span key={s.num}>
                <span style={{fontSize:12,fontWeight:700,color:sc.tx,marginRight:4}}>{nStr(s.num)}</span>
                <Highlighted text={s.text} words={s.keyWords||[]}/>
                {' '}
              </span>;
            })}
          </div>

          {/* 범례 */}
          <div style={{display:'flex',flexWrap:'wrap',gap:4,marginBottom:12}}>
            {SYMS.map(sym=>{const sc=SM[sym]||{};return(
              <span key={sym} style={{display:'flex',alignItems:'center',gap:4,fontSize:11,
                color:'#666',padding:'3px 8px',border:'0.5px solid #e5e5e5',borderRadius:4}}>
                <span style={{width:7,height:7,borderRadius:2,background:sc.bd,display:'inline-block'}}/>
                ({sym}) {sc.lbl}
              </span>);
            })}
          </div>

          {/* Block Diagram */}
          <div style={{fontSize:11,fontWeight:700,color:'#888',letterSpacing:'.1em',
            textTransform:'uppercase',marginBottom:8}}>Block Diagram</div>
          <div style={{display:'flex',alignItems:'flex-start',gap:5,marginBottom:12,flexWrap:'wrap'}}>
            {blocks.map((blk,bi)=>{
              const c=BC[blk.color]||BC.blue;
              const bsents=(blk.sentenceNums||[]).map(n=>sm[n]).filter(Boolean);
              return(
                <React.Fragment key={blk.id}>
                  <div style={{flex:'1 1 130px',minWidth:0,borderRadius:10,border:'2px solid '+c.bd}}>
                    <div style={{padding:'8px 11px',background:c.hd,borderBottom:'1.5px solid '+c.bd,borderRadius:'8px 8px 0 0'}}>
                      {IS
                        ?<div style={{borderBottom:'2px solid '+c.bd,height:22,width:'85%',marginBottom:5}}/>
                        :editable
                        ?<><input value={blk.name} onChange={e=>onAnalysis(slot.id,'flow.blocks.'+bi+'.name',e.target.value)}
                            style={{...iB,fontSize:13.5,fontWeight:600,color:c.tx,borderBottomColor:c.bd,marginBottom:2}}/>
                           <input value={blk.nameEn} onChange={e=>onAnalysis(slot.id,'flow.blocks.'+bi+'.nameEn',e.target.value)}
                            style={{...iB,fontSize:11,fontStyle:'italic',fontWeight:600,color:c.tx,borderBottomColor:c.bd,opacity:.85}}/></>
                        :<><div style={{fontSize:13.5,fontWeight:600,color:c.tx,marginBottom:2,wordBreak:'keep-all'}}>{blk.name}</div>
                           <div style={{fontSize:11,color:c.tx,fontStyle:'italic',fontWeight:600,opacity:.85}}>{blk.nameEn}</div></>
                      }
                    </div>
                    <div style={{padding:'7px',background:'#fff'}}>
                      {bsents.map((sent,si)=>{
                        const sc=SM[sent.symbol]||{};
                        const si2=sentences.indexOf(sent);
                        return<div key={sent.num}>
                          {si>0&&<div style={{fontSize:9,color:'#ccc',paddingLeft:22,margin:'1px 0'}}>↓</div>}
                          <div style={{display:'flex',alignItems:'flex-start',gap:6,padding:'5px 6px',
                            borderRadius:6,background:sc.bg,marginBottom:3}}>
                            <span style={{fontSize:15,fontWeight:600,color:sc.tx,flexShrink:0,marginTop:1}}>{nStr(sent.num)}</span>
                            <div style={{flex:1,minWidth:0}}>
                              {editable&&!IS
                                ?<><select value={sent.symbol}
                                    onChange={e=>onAnalysis(slot.id,'sentences.'+si2+'.symbol',e.target.value)}
                                    style={{...sB,fontSize:10,fontWeight:700,padding:'1px 4px',borderRadius:3,
                                      background:sc.bg,color:sc.tx,border:'1px solid '+sc.bd,marginBottom:3,display:'block'}}>
                                    {SYMS.map(s=><option key={s} value={s}>{s}</option>)}
                                  </select>
                                  <textarea value={sent.role}
                                    onChange={e=>onAnalysis(slot.id,'sentences.'+si2+'.role',e.target.value)}
                                    rows={2} style={{...iB,fontSize:10.5,color:'#444',borderBottomColor:'#ddd',
                                      resize:'none',lineHeight:1.4,overflow:'hidden'}}/></>
                                :<>
                                  <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:3}}>
                                    <div style={{width:36,height:16,borderRadius:3,borderBottom:'1.5px solid '+sc.bd,opacity:.5}}/>
                                  </div>
                                  <div style={{width:'100%',height:14,borderBottom:'1px dashed '+sc.bd,opacity:.4,marginBottom:2}}/>
                                  <div style={{width:'80%',height:14,borderBottom:'1px dashed '+sc.bd,opacity:.3}}/>
                                </>
                              }
                            </div>
                          </div>
                        </div>;
                      })}
                    </div>
                  </div>
                  {bi<blocks.length-1&&(
                    <div style={{display:'flex',flexDirection:'column',alignItems:'center',
                      justifyContent:'center',gap:2,flexShrink:0,paddingTop:52,minWidth:32}}>
                      {editable&&!IS
                        ?<select value={conn(bi)}
                            onChange={e=>{const cc=[...interBlockConnectors];cc[bi]=e.target.value;
                              onAnalysis(slot.id,'flow.interBlockConnectors',cc);}}
                            style={{...sB,fontSize:16,fontWeight:600,color:'#555',textAlign:'center',width:'100%'}}>
                            {SYMS.map(s=><option key={s} value={s}>{s}</option>)}
                          </select>
                        :<div style={{fontSize:16,fontWeight:600,color:'#555'}}>{conn(bi)}</div>
                      }
                      <div style={{fontSize:9,color:'#bbb',textAlign:'center',lineHeight:1.3}}>
                        {SM[conn(bi)]&&SM[conn(bi)].lbl||''}
                      </div>
                    </div>
                  )}
                </React.Fragment>
              );
            })}
          </div>

          {/* 메타 */}
          <div style={{display:'flex',gap:8,marginBottom:12,flexWrap:'wrap'}}>
            {[{lbl:'핵심 소재',f:'keyword',val:keyword,flex:1},
              {lbl:'주제 요약',f:'topicSummary',val:topicSummary,flex:2}].map(({lbl,f,val,flex})=>(
              <div key={f} style={{flex,minWidth:120,background:'#f8f8f8',
                border:'0.5px solid #e5e5e5',borderRadius:8,padding:'8px 12px'}}>
                <div style={{fontSize:10,fontWeight:700,color:'#888',letterSpacing:'.08em',
                  textTransform:'uppercase',marginBottom:5}}>{lbl}</div>
                {IS?<div style={{borderBottom:'1.5px solid #bbb',height:22}}/>
                  :<textarea value={val}
                    onChange={e=>onAnalysis(slot.id,'flow.'+f,e.target.value)}
                    rows={2} style={{...iB,fontSize:13,color:'#1a1a1a',resize:'none',
                      lineHeight:1.5,overflow:'hidden',wordBreak:'keep-all'}}/>}
              </div>
            ))}
            <div style={{flex:1.3,minWidth:100,background:'#f8f8f8',
              border:'0.5px solid #e5e5e5',borderRadius:8,padding:'8px 12px'}}>
              <div style={{fontSize:10,fontWeight:700,color:'#888',letterSpacing:'.08em',
                textTransform:'uppercase',marginBottom:5}}>구조 유형</div>
              {IS?<div style={{display:'flex',flexWrap:'wrap',gap:3}}>
                {['통념→반박→결론','문제→해결책','질문→답변'].map(s=>(
                  <span key={s} style={{fontSize:10,padding:'2px 6px',
                    border:'0.5px solid #ddd',borderRadius:3,color:'#bbb'}}>□ {s}</span>))}
              </div>
              :<select value={structureType}
                  onChange={e=>onAnalysis(slot.id,'flow.structureType',e.target.value)}
                  style={{...sB,width:'100%',fontSize:13,color:'#1a1a1a'}}>
                  {STRUCTS.map(s=><option key={s} value={s}>{s}</option>)}
                </select>}
            </div>
          </div>

          {/* 문장별 분석 */}
          {(()=>{
            const dsToShow=IS
              ?sentences.filter(s=>difficultSentences.find(d=>d.num===s.num))
              :sentences;
            if(!dsToShow.length)return null;
            return(
              <div style={{marginBottom:10}}>
                <div style={{fontSize:11,fontWeight:700,color:'#888',letterSpacing:'.08em',
                  textTransform:'uppercase',marginBottom:8}}>
                  {IS?'구문 분석':'문장별 분석 — 끊어읽기 & 구문'}
                </div>
                {dsToShow.map(s=>{
                  const sc=SM[s.symbol]||{};
                  const ds=difficultSentences.find(d=>d.num===s.num);
                  const di=difficultSentences.findIndex(d=>d.num===s.num);
                  const chunks=s.chunks||[];
                  return(
                    <div key={s.num} style={{marginBottom:6,border:'0.5px solid '+sc.bd,
                      borderRadius:8,overflow:'hidden'}}>
                      <div style={{padding:'6px 12px',background:sc.bg,
                        display:'flex',alignItems:'center',gap:7}}>
                        <span style={{fontSize:15,fontWeight:700,color:sc.tx,flexShrink:0}}>{nStr(s.num)}</span>
                        <span style={{fontSize:10,fontWeight:700,padding:'1px 5px',borderRadius:3,
                          background:'rgba(255,255,255,.5)',color:sc.tx,border:'1px solid '+sc.bd,
                          flexShrink:0}}>({s.symbol})</span>
                        <span style={{fontSize:13,color:sc.tx,fontStyle:'italic',
                          wordBreak:'keep-all',overflowWrap:'break-word',lineHeight:1.5}}>{s.text}</span>
                      </div>
                      {!IS&&chunks.length>0&&(
                        <div style={{padding:'7px 12px',background:'#fff',borderTop:'0.5px solid #eee'}}>
                          <div style={{fontSize:13,fontStyle:'italic',color:'#1a1a1a',
                            lineHeight:1.9,wordBreak:'keep-all',overflowWrap:'break-word'}}>
                            {chunks.map(c=>c.en||'').join(' / ')}
                          </div>
                          <div style={{fontSize:13,color:'#555',lineHeight:1.9,
                            wordBreak:'keep-all',overflowWrap:'break-word',
                            borderTop:'0.5px dashed #e5e5e5',marginTop:3,paddingTop:3}}>
                            {chunks.map(c=>c.ko||'').join(' / ')}
                          </div>
                        </div>
                      )}
                      {ds&&(
                        <div style={{padding:'7px 12px',background:'#fafafa',borderTop:'0.5px solid #eee'}}>
                          <div style={{fontSize:10,fontWeight:700,color:'#aaa',marginBottom:4}}>구문 분석</div>
                          {[{lbl:'구조',f:'structure'},{lbl:'해석',f:'translation'},{lbl:'포인트',f:'point'}].map(row=>(
                            <div key={row.f} style={{display:'flex',gap:8,padding:'3px 0',
                              borderBottom:'0.5px dashed #eee',alignItems:'flex-start'}}>
                              <span style={{fontSize:10,fontWeight:700,color:'#888',
                                flexShrink:0,width:34,paddingTop:2}}>{row.lbl}</span>
                              <textarea value={ds[row.f]||''}
                                onChange={e=>{const nd=[...difficultSentences];
                                  nd[di]={...nd[di],[row.f]:e.target.value};
                                  onAnalysis(slot.id,'grammar.difficultSentences',nd);}}
                                rows={1} style={{...iB,fontSize:12.5,color:'#333',resize:'none',
                                  lineHeight:1.5,flex:1,overflow:'hidden',wordBreak:'break-all'}}/>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            );
          })()}

          {/* 액션 */}
          <div style={{display:'flex',gap:8,flexWrap:'wrap',paddingTop:4}}>
            {slot.status==='analyzed'&&(
              <button onClick={onConfirm} style={{padding:'7px 18px',fontSize:13,fontWeight:600,
                background:'#534AB7',color:'#fff',border:'none',borderRadius:7,cursor:'pointer'}}>✓ 흐름 확정</button>
            )}
            {['analyzed','confirmed','saved'].includes(slot.status)&&(
              <button onClick={onReanalyze} style={{padding:'7px 14px',fontSize:12.5,background:'transparent',
                color:'#534AB7',border:'0.5px solid #534AB7',borderRadius:6,cursor:'pointer'}}>↺ 재분석</button>
            )}
            {(slot.status==='confirmed'||slot.status==='saved')&&(
              <button onClick={onSave} style={{padding:'7px 18px',fontSize:13,fontWeight:600,
                background:'#2d8a60',color:'#fff',border:'none',borderRadius:7,cursor:'pointer'}}>
                {slot.status==='saved'?'💾 재저장':'💾 Sheets 저장'}
              </button>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
