  const [slotSheetSaving,setSlotSheetSaving]=useState({});
  const [showSheetLoad,setShowSheetLoad]=useState(false);
  const [sheetPassages,setSheetPassages]=useState([]);
  const [sheetLoadSrc,setSheetLoadSrc]=useState('');
  const [sheetLoadSearch,setSheetLoadSearch]=useState('');
  const [sheetLoadSel,setSheetLoadSel]=useState({});
  const [expandedChapter,setExpandedChapter]=useState('');
  // 학생용 출력 옵션 모달
  const [stuModal,setStuModal]=useState(null); // null | {kind:'html'|'docx'|'all-docx', slot:slot, opts:{...}}
  const [stuOpts,setStuOptsState]=useState(()=>getStuOpts());
  const [showSet,setShowSet]=useState(false);
  const [customBooks,setCustomBooks]=useState(()=>loadCustomBooks());
  const [newBook,setNewBook]=useState({id:'',label:'',storage:'sheet'});
  const [mogoNew,setMogoNew]=useState({yr:'26',gr:'G1',mon:'06',org:'경기'});
  const [bookNew,setBookNew]=useState({yr:'26',pub:'EBS',pubCustom:'',name:''});
  const [printNew,setPrintNew]=useState({yr:'26',school:'',gr:'G3',exam:'1MID'});
  const [showBookMgr,setShowBookMgr]=useState(false);
  const [showOutputMenu,setShowOutputMenu]=useState(false);
  const [filterHot,setFilterHot]=useState(false);
  const allBooks=React.useMemo(()=>[...BOOK_DEFS,...customBooks],[customBooks]);
  const [showLoad,setShowLoad]=useState(false);
  const [loadedPassages,setLoadedPassages]=useState([]);
  const [loadSrc,setLoadSrc]=useState('');
  const [loadSearch,setLoadSearch]=useState('');
  const [loadFetching,setLoadFetching]=useState(false);
  const [ghDd,setGhDd]=useState(false);
  const [loadSel,setLoadSel]=useState({});
  const [msg,setMsg]=useState('');
  const running=useRef(false);

  const saveTimer=useRef(null);
  useEffect(()=>{
    if(saveTimer.current)clearTimeout(saveTimer.current);
    saveTimer.current=setTimeout(()=>saveSlots(slots),300);
    return()=>{if(saveTimer.current)clearTimeout(saveTimer.current);};
  },[slots]);
  const flash=(m,t=3000)=>{setMsg(m);setTimeout(()=>setMsg(''),t);};
  const upSlot=useCallback((id,patch)=>setSlots(p=>p.map(s=>s.id===id?{...s,...patch}:s)),[]);

  // ── 교재목록 시트 동기화 ──────────────────────────────
  // 추가/변경된 교재를 '교재목록' 시트에 저장 (삭제는 동기화하지 않음 - 안전)
  const syncBooksToSheet=useCallback(async(books)=>{
    if(!appsUrl||!books||!books.length)return;
    try{await formPostFetch(appsUrl,{action:'saveBooks',books_json:JSON.stringify(books)});}
    catch(e){console.warn('교재목록 시트 동기화 실패:',e);}
  },[appsUrl]);
  // 사용자 교재 추가 헬퍼: state + localStorage + 시트 동기화 일괄 처리
  const addCustomBook=useCallback((book)=>{
    setCustomBooks(prev=>{
      if(prev.find(b=>b.id===book.id)||BOOK_DEFS.find(b=>b.id===book.id))return prev;
      const next=[...prev,book];
      saveCustomBooks(next);
      syncBooksToSheet([book]);
      return next;
    });
  },[syncBooksToSheet]);
  // ── 마운트 시 시트 교재목록을 localStorage에 병합 (다른 기기 동기화) ──
  const booksLoaded=useRef(false);
  useEffect(()=>{
    if(booksLoaded.current||!appsUrl)return;
    booksLoaded.current=true;
    (async()=>{
      try{
        const r=await jsonpFetch(appsUrl,{action:'getBooks'});
        if(!r||!r.ok||!Array.isArray(r.books))return;
        const local=loadCustomBooks();
        const localIds=new Set(local.map(b=>b.id));
        const defIds=new Set(BOOK_DEFS.map(b=>b.id));
        // BOOK_DEFS에 없고 localStorage에도 없는 시트 교재만 병합
        const merged=[...local];
        let added=0;
        r.books.forEach(b=>{
          if(!b||!b.id)return;
          if(defIds.has(b.id)||localIds.has(b.id))return;
          merged.push({id:b.id,label:b.label||b.id,storage:b.storage||'sheet'});
          localIds.add(b.id);added++;
        });
        if(added>0){saveCustomBooks(merged);setCustomBooks(merged);}
      }catch(e){console.warn('교재목록 시트 로드 실패:',e);}
    })();
  },[appsUrl]);

  const generateBlockSummaries=useCallback(async(slot,silent=false)=>{
    if(!apiKey){if(!silent)alert('API Key가 없습니다.');return;}
    const blocks=slot.analysis?.flow?.blocks||[];
    const sentences=slot.analysis?.sentences||[];
    if(!blocks.length){if(!silent)alert('블록 분석 데이터가 없습니다.');return;}
    upSlot(slot.id,{blockSummaries:'loading'});
    try{
      const prompt=BLOCK_SUM_PROMPT(blocks,sentences);
      const d=await callClaude(apiKey,BLOCK_SUM_SYS,prompt);
      if(d.error)throw new Error(d.error.message||'API 오류');
      const raw=d.content[0].text.replace(/```(?:json)?|```/g,'').trim();
      const arrStart=raw.indexOf('[');
      const arrEnd=raw.lastIndexOf(']');
      if(arrStart<0||arrEnd<0)throw new Error('응답에 JSON 배열 없음');
      let jsonStr=raw.slice(arrStart,arrEnd+1);
      // 흔한 JSON 오류 수정: 후행 쉼표 제거
      jsonStr=jsonStr.replace(/,(\s*[}\]])/g,'$1');
      let parsed;
      try{parsed=JSON.parse(jsonStr);}
      catch(e){throw new Error('JSON 파싱 실패: '+e.message+'\n응답: '+jsonStr.slice(0,200));}
      upSlot(slot.id,{blockSummaries:parsed});
      flash('✓ 블록 요약 생성 완료');
    }catch(e){
      upSlot(slot.id,{blockSummaries:null});
      alert('요약 생성 실패: '+e.message);
    }
  },[apiKey,upSlot]);

  const upAnalysis=useCallback((id,path,val)=>setSlots(p=>p.map(s=>{
    if(s.id!==id)return s;
    const a=JSON.parse(JSON.stringify(s.analysis));
    const parts=path.split('.');let cur=a;
    for(let i=0;i<parts.length-1;i++){if(cur[parts[i]]===undefined)cur[parts[i]]={};cur=cur[parts[i]];}
    cur[parts[parts.length-1]]=val;
    return{...s,analysis:a};
  })),[]);

  const handleMeta=useCallback((id,f,v)=>setSlots(prev=>{
    const next=prev.map(s=>s.id===id?{...s,meta:{...s.meta,[f]:v}}:s);
    if(id===0&&(f==='chapter'||f==='number')){
      // chapter가 텍스트(test 등)이면 전체 슬롯에 동일하게 적용
      if(f==='chapter'&&isNaN(parseInt(v))){
        return next.map(s=>s.id===0?s:{...s,meta:{...s.meta,chapter:v}});
      }
      const bCh=parseInt(f==='chapter'?v:next[0].meta.chapter)||1;
      const bN=parseInt(f==='number'?v:next[0].meta.number)||1;
      return next.map(s=>s.id===0?s:{...s,meta:{...s.meta,
        chapter:String(bCh).padStart(2,'0'),
        number:String(bN+s.id).padStart(3,'0')}});
    }
    if(id===0&&f==='chapterOrg'){
      return next.map(s=>s.id===0?s:{...s,meta:{...s.meta,chapterOrg:v}});
    }
    return next;
  }),[]);

  const doAnalyze=useCallback(async(slot)=>{
    upSlot(slot.id,{status:'analyzing',error:''});
    try{
      const d=await callClaude(apiKey,FLOW_SYS,slot.text,8192);
      if(d.error)throw new Error(d.error.message||JSON.stringify(d.error));
      const p=parseJSON(d.content[0].text);
      const analyzedSlot={...slot,status:'analyzed',meta:{...slot.meta,difficulty:p.difficulty||'중'},
        analysis:{sentences:p.sentences||[],title:p.title||'',abstract:p.abstract||'',
          flow:{blocks:p.blocks||[],interBlockConnectors:p.interBlockConnectors||[],
            keyword:p.keyword||'',topicSummary:p.topicSummary||'',structureType:p.structureType||''},
          grammar:{difficultSentences:p.difficultSentences||[]}},open:true};
      upSlot(slot.id,analyzedSlot);
      // 분석 완료 후 자동으로 블록 요약 생성
      generateBlockSummaries(analyzedSlot,true);
    }catch(e){upSlot(slot.id,{status:'idle',error:'오류: '+e.message});}
  },[upSlot,apiKey,generateBlockSummaries]);

  const runAll=useCallback(async()=>{
    if(running.current)return;
    if(!apiKey){alert('API Key를 먼저 설정해주세요.');setShowSet(true);return;}
    running.current=true;
    for(const slot of slots.filter(s=>s.text.trim()&&s.status==='idle')){
      await doAnalyze(slot);
    }
    running.current=false;
  },[slots,doAnalyze,apiKey]);

  const reanalyze=useCallback(async(slot)=>{
    if(!confirm('흐름 분석을 다시 할까요?'))return;
    upSlot(slot.id,{status:'idle',analysis:null,error:''});
    setTimeout(()=>doAnalyze({...slot,status:'idle'}),100);
  },[upSlot,doAnalyze]);

  const saveMainToGitHub=useCallback(async()=>{
    if(!ghToken||!ghRepo){alert('설정에서 GitHub Token과 저장소를 입력해주세요.');return;}
    setMainGhSaving(true);
    try{
      const entries=slots.filter(s=>['analyzed','saved','confirmed'].includes(s.status)&&(s.passageData||s.analysis?.sentences?.length)).map(s=>{
        const p=s.passageData||{};
        const metaId=makePassageId(s.meta.source,s.meta.chapter,s.meta.number);
        const gs=(p.grammar_sets||[])[p.grammar_sel??0]||{items:[],answer:1};
        const vs=(p.vocab_sets||[])[p.vocab_sel??0]||{items:[],answer:1};
        const gItems=p.grammar_items?.length?p.grammar_items:gs.items;
        const vItems=p.vocab_items?.length?p.vocab_items:vs.items;
        return{id:p.id||metaId,difficulty:p.difficulty||s.meta.difficulty,title:p.title||'',
          sentences:s.analysis?.sentences?.length?s.analysis.sentences:p.sentences||[],
          abstract:p.abstract||'',
          topic_options:p.topic_options,topic_answer:p.topic_answer,
          blank_sel:p.blank_sel||0,blank_candidates:p.blank_candidates||[],
          blank_sentence_index:p.blank_sentence_index,blank_target:p.blank_target,
          blank_options:p.blank_options,blank_answer:p.blank_answer,
          order_given_index:p.order_given_index,order_blocks:p.order_blocks,
          order_options:p.order_options,order_answer:p.order_answer,
          insert_sel:p.insert_sel||0,insert_candidates:p.insert_candidates||[],
          insert_sentence:p.insert_sentence,insert_answer:p.insert_answer,
          summary_sel:p.summary_sel||0,summary_candidates:p.summary_candidates||[],
          summary_template:p.summary_template,
          summary_A_options:p.summary_A_options,summary_A_answer:p.summary_A_answer,
          summary_B_options:p.summary_B_options,summary_B_answer:p.summary_B_answer,
          implication_sentence_index:p.implication_sentence_index,implication_keyword:p.implication_keyword,
          implication_options:p.implication_options,implication_answer:p.implication_answer,
          irrel_sel:p.irrel_sel||0,irrel_candidates:p.irrel_candidates||[],
          irrel_insert_pos:p.irrel_insert_pos||0,irrel_confirmed:p.irrel_confirmed||false,
          irrelevant_sentence_index:p.irrelevant_sentence_index,
          irrel_sentence:p.irrel_candidates?.[p.irrel_sel]||'',
          grammar_sets:p.grammar_sets||[],grammar_sel:p.grammar_sel||0,
          grammar_items:(()=>{const sorted=[...gItems].sort((a,b)=>Number(a.sent)-Number(b.sent));return sorted;})(),
          grammar_answer:(()=>{const sorted=[...gItems].sort((a,b)=>Number(a.sent)-Number(b.sent));const idx=sorted.findIndex(it=>it.correct===false);return idx>=0?idx+1:(p.grammar_answer||gs.answer||1);})(),
          vocab_sets:p.vocab_sets||[],vocab_sel:p.vocab_sel||0,
          vocab_items:(()=>{const sorted=[...vItems].sort((a,b)=>Number(a.sent)-Number(b.sent));return sorted;})(),
          vocab_answer:(()=>{const sorted=[...vItems].sort((a,b)=>Number(a.sent)-Number(b.sent));const idx=sorted.findIndex(it=>it.correct===false);return idx>=0?idx+1:(p.vocab_answer||vs.answer||1);})(),
          aGroup:(p.summary_A_options||[]).slice(0,3),bGroup:(p.summary_B_options||[]).slice(0,3),
          flow:s.analysis?.flow&&Object.keys(s.analysis.flow).length?s.analysis.flow:p.flow||{},grammar:s.analysis?.grammar&&Object.keys(s.analysis.grammar).length?s.analysis.grammar:p.grammar||{},
          blockSummaries:s.blockSummaries&&s.blockSummaries!=='loading'?s.blockSummaries:undefined};
      });
      if(!entries.length){alert('저장할 분석 데이터가 없습니다.');setMainGhSaving(false);return;}
      const jsonText=entries.map(e=>JSON.stringify(e,null,2)).join(',\n\n');
      const path='passages.js';
      const getRes=await fetch('https://api.github.com/repos/'+ghRepo+'/contents/'+path,{headers:{'Authorization':'token '+ghToken}});
      if(!getRes.ok)throw new Error('passages.js 읽기 실패');
      const getJson=await getRes.json();
      const decoded=new TextDecoder('utf-8').decode(Uint8Array.from(atob(getJson.content.replace(/\n/g,'')),c=>c.charCodeAt(0)));
      const newContent=upsertPassages(decoded,entries);
      const putRes=await fetch('https://api.github.com/repos/'+ghRepo+'/contents/'+path,{
        method:'PUT',headers:{'Authorization':'token '+ghToken,'Content-Type':'application/json'},
        body:JSON.stringify({message:'Add passages via teacher.html',content:btoa(unescape(encodeURIComponent('\uFEFF'+newContent))),sha:getJson.sha})
      });
      if(!putRes.ok)throw new Error('GitHub 저장 실패: '+(await putRes.text()));
      alert('✓ GitHub 저장 완료! 30초 후 자동 배포됩니다.');
    }catch(e){alert('오류: '+e.message);}
    setMainGhSaving(false);
  },[slots,ghToken,ghRepo]);

  // ──────────────────────────────────────────────
  // 시트 저장 — 슬롯 1개를 지문DB + 출제DB에 저장
  // ──────────────────────────────────────────────
  const buildSlotPayload=useCallback((slot)=>{
    const p=slot.passageData||{};
    const metaId=makePassageId(slot.meta.source,slot.meta.chapter,slot.meta.number);
    const id=p.id||metaId;
    // 지문DB payload
    const sentences=slot.analysis?.sentences?.length?slot.analysis.sentences:(p.sentences||[]);
    const flow=slot.analysis?.flow&&Object.keys(slot.analysis.flow).length?slot.analysis.flow:(p.flow||{});
    // 구문해설(difficultSentences)을 flow_json에 동봉 — 시트 스키마/GAS 무변경으로 보존
    const diffSents=slot.analysis?.grammar?.difficultSentences||[];
    const blockSummaries=slot.blockSummaries&&slot.blockSummaries!=='loading'?slot.blockSummaries:null;
    const passagePayload={
      id,
      source:slot.meta.source||'',
      chapter:slot.meta.chapter||'',
      chapter_org:slot.meta.chapterOrg||'',
      number:slot.meta.number||'',
      difficulty:p.difficulty||slot.meta.difficulty||'',
      title:p.title||slot.analysis?.title||'',
      abstract:p.abstract||slot.analysis?.abstract||'',
      sentences_json:JSON.stringify(sentences),
      flow_json:JSON.stringify(diffSents.length?{...flow,difficultSentences:diffSents}:flow),
      blockSummaries_json:blockSummaries?JSON.stringify(blockSummaries):'',
      is_public:slot.isPublic?'TRUE':'FALSE',
      is_hot:slot.isHot?'TRUE':'FALSE',
    };
    // 출제DB payload — 9가지 유형 (데이터가 있는 것만 저장)
    const gs=(p.grammar_sets||[])[p.grammar_sel??0]||{items:[],answer:1};
    const vs=(p.vocab_sets||[])[p.vocab_sel??0]||{items:[],answer:1};
    const questions=[];
    if(p.topic_options&&p.topic_options.length){
      questions.push({type:'topic',data_json:JSON.stringify({options:p.topic_options}),answer:p.topic_answer||''});
    }
    // 빈칸: blank_candidates 없으면 blank_target로 단일 후보 즉석 생성
    let blankCands=p.blank_candidates;
    if((!blankCands||!blankCands.length)&&p.blank_target){
      blankCands=[{sentence_index:p.blank_sentence_index,keyword:p.blank_target,distractors:(p.blank_options||[]).slice(1)}];
    }
    if(blankCands&&blankCands.length){
      questions.push({type:'blank',data_json:JSON.stringify({sel:p.blank_sel||0,candidates:blankCands,sentence_index:p.blank_sentence_index,target:p.blank_target,options:p.blank_options,answer:p.blank_answer}),answer:p.blank_answer||''});
    }
    if(p.order_blocks||p.order_options){
      questions.push({type:'order',data_json:JSON.stringify({given_index:p.order_given_index,blocks:p.order_blocks,options:p.order_options}),answer:p.order_answer||''});
    }
    // 삽입: insert_candidates 없으면 insert_sentence로 단일 후보 즉석 생성
    let insCands=p.insert_candidates;
    if((!insCands||!insCands.length)&&p.insert_sentence){
      insCands=[{sentence:p.insert_sentence,pos:p.insert_answer||1}];
    }
    if(insCands&&insCands.length){
      questions.push({type:'insert',data_json:JSON.stringify({sel:p.insert_sel||0,candidates:insCands,sentence:p.insert_sentence,answer:p.insert_answer}),answer:p.insert_answer||''});
    }
    if(p.summary_candidates&&p.summary_candidates.length){
      questions.push({type:'summary',data_json:JSON.stringify({sel:p.summary_sel||0,candidates:p.summary_candidates,template:p.summary_template,A_options:p.summary_A_options,A_answer:p.summary_A_answer||1,B_options:p.summary_B_options,B_answer:p.summary_B_answer||1}),answer:''});
    }
    if(p.implication_options&&p.implication_options.length){
      questions.push({type:'implication',data_json:JSON.stringify({sentence_index:p.implication_sentence_index,keyword:p.implication_keyword,options:p.implication_options}),answer:p.implication_answer||''});
    }
    if(p.irrel_candidates&&p.irrel_candidates.length){
      questions.push({type:'irrelevant',data_json:JSON.stringify({sel:p.irrel_sel||0,candidates:p.irrel_candidates,insert_pos:p.irrel_insert_pos||0,confirmed:p.irrel_confirmed||false,sentence_index:p.irrelevant_sentence_index}),answer:''});
    }
    if(gs.items&&gs.items.length){
      const sorted=[...gs.items].sort((a,b)=>Number(a.sent)-Number(b.sent));
      const idx=sorted.findIndex(it=>it.correct===false);
      const ans=idx>=0?idx+1:(p.grammar_answer||gs.answer||1);
      questions.push({type:'grammar',data_json:JSON.stringify({sets:p.grammar_sets||[],sel:p.grammar_sel||0,items:sorted}),answer:ans});
    }
    if(vs.items&&vs.items.length){
      const sorted=[...vs.items].sort((a,b)=>Number(a.sent)-Number(b.sent));
      const idx=sorted.findIndex(it=>it.correct===false);
      const ans=idx>=0?idx+1:(p.vocab_answer||vs.answer||1);
      questions.push({type:'vocab',data_json:JSON.stringify({sets:p.vocab_sets||[],sel:p.vocab_sel||0,items:sorted}),answer:ans});
    }
    return{passagePayload,questions,id};
  },[]);

  const saveSlotToSheet=useCallback(async(slot)=>{
    if(!appsUrl){alert('설정에서 Apps Script URL을 먼저 입력해주세요.');return false;}
    const {passagePayload,questions,id}=buildSlotPayload(slot);
    if(!id||!slot.meta.source){alert('교재/강/번호가 비어있습니다.');return false;}
    setSlotSheetSaving(prev=>({...prev,[slot.id]:true}));
    try{

      // 1) 지문DB (POST - 큰 데이터)
      const r1=await formPostFetch(appsUrl,{action:'savePassage',...passagePayload});
      if(!r1.ok&&!r1.warning)throw new Error('지문 저장 실패: '+(r1.error||'unknown'));
      // 2) 출제DB (POST - 큰 데이터)
      if(questions.length){
        const r2=await formPostFetch(appsUrl,{action:'saveQuestions',pid:id,questions_json:JSON.stringify(questions)});
        if(!r2.ok&&!r2.warning)throw new Error('출제 저장 실패: '+(r2.error||'unknown'));
      }
      return true;
    }catch(e){
      alert('시트 저장 오류 ('+id+'): '+e.message);
      return false;
    }finally{
      setSlotSheetSaving(prev=>{const n={...prev};delete n[slot.id];return n;});
    }
  },[appsUrl,buildSlotPayload]);

  const saveAllToSheet=useCallback(async()=>{
    if(!appsUrl){alert('설정에서 Apps Script URL을 먼저 입력해주세요.');return;}
    const targets=slots.filter(s=>['analyzed','confirmed','saved'].includes(s.status)&&(s.passageData||s.analysis?.sentences?.length));
    if(!targets.length){alert('저장할 슬롯이 없습니다. (분석완료/저장완료 상태만 대상)');return;}
    if(!confirm(`${targets.length}개 슬롯을 시트에 저장할까요?`))return;
    setSheetSaving(true);
    let ok=0,fail=0;
    const okIds=[];
    for(const slot of targets){
      const success=await saveSlotToSheet(slot);
      if(success){ok++;okIds.push(slot.id);}else fail++;
    }
    if(okIds.length){
      setSlots(prev=>prev.map(s=>{
        if(!okIds.includes(s.id))return s;
        const pid=makePassageId(s.meta?.source,s.meta?.chapter,s.meta?.number);
        return{...s,status:'saved',passageData:s.passageData||{id:pid,...(s.analysis||{})}};
      }));
    }
    setSheetSaving(false);
    alert(`✓ 시트 저장 완료\n성공 ${ok}개 / 실패 ${fail}개`);
  },[appsUrl,slots,saveSlotToSheet]);

  // ──────────────────────────────────────────────
  // 일괄 공개/비공개 - saved 상태 슬롯들 한번에 토글
  // ──────────────────────────────────────────────
  const bulkTogglePublic=useCallback(async(makePublic)=>{
    if(!appsUrl){alert('설정에서 Apps Script URL을 먼저 입력해주세요.');return;}
    // saved 상태이고 변경이 필요한 슬롯만 (이미 같은 상태면 건너뜀)
    const targets=slots.filter(s=>s.status==='saved'&&!!s.isPublic!==makePublic&&(s.passageData?.id||makePassageId(s.meta?.source,s.meta?.chapter,s.meta?.number)));
    if(!targets.length){
      alert(makePublic?'모든 저장된 슬롯이 이미 공개 상태입니다.':'모든 저장된 슬롯이 이미 비공개 상태입니다.');
      return;
    }
    if(!confirm(`${targets.length}개 슬롯을 ${makePublic?'🌐 공개':'🔒 비공개'}로 변경할까요?`))return;
    
    setSheetSaving(true);
    let ok=0,fail=0;
    const okIds=[];
    const failItems=[];
    
    for(const slot of targets){
      try{
        const pid=slot.passageData.id;
        // 데이터 안전: 시트의 현재 상태 검증 (sentences가 비어있으면 차단)
        const cur=await jsonpFetch(appsUrl,{action:'getPassages',id:pid});
        const sheetP=(cur&&cur.passages&&cur.passages[0])||null;
        
        let payload;
        if(!sheetP||(()=>{try{return JSON.parse(sheetP.sentences_json||'[]').length===0;}catch{return true;}})()){
          // 시트에 데이터 없음 → 최소 payload
          payload={action:'savePassage',id:pid,is_public:makePublic?'TRUE':'FALSE'};
        }else{
          // 시트에 데이터 있음 → 전체 payload (Apps Script 미패치 대비)
          const {passagePayload}=buildSlotPayload({...slot,isPublic:makePublic});
          payload={action:'savePassage',...passagePayload};
        }
        
        const r=await formPostFetch(appsUrl,payload);
        if(r&&(r.ok||r.warning)){
          ok++;
          okIds.push(slot.id);
        }else{
          fail++;
          failItems.push(`${slot.meta.source} ${slot.meta.chapter}강 ${slot.meta.number}번: ${r?.error||'unknown'}`);
        }
      }catch(e){
        fail++;
        failItems.push(`${slot.meta.source} ${slot.meta.chapter}강 ${slot.meta.number}번: ${e.message}`);
      }
    }
    
    // 성공한 슬롯들 isPublic 업데이트
    if(okIds.length){
      setSlots(prev=>prev.map(s=>okIds.includes(s.id)?{...s,isPublic:makePublic}:s));
    }
    
    setSheetSaving(false);
    let msg=`✓ 일괄 ${makePublic?'공개':'비공개'} 완료\n성공 ${ok}개 / 실패 ${fail}개`;
    if(failItems.length){
      msg+='\n\n실패 항목:\n'+failItems.slice(0,5).join('\n');
      if(failItems.length>5)msg+=`\n... 외 ${failItems.length-5}개`;
    }
    alert(msg);
  },[appsUrl,slots,buildSlotPayload]);

  // ──────────────────────────────────────────────
  // 시트 불러오기 — 지문DB + 출제DB 통합
  // ──────────────────────────────────────────────
  const loadFromSheet=useCallback(async()=>{
    if(!appsUrl){alert('설정에서 Apps Script URL을 먼저 입력해주세요.');return;}
    setSheetLoading(true);
    try{
      const r=await jsonpFetch(appsUrl,{action:'getPassages'});
      if(!r.ok)throw new Error(r.error||'unknown');
      setSheetPassages(r.passages||[]);
      setShowSheetLoad(true);
    }catch(e){
      alert('시트 불러오기 실패: '+e.message);
    }
    setSheetLoading(false);
  },[appsUrl]);

  const loadSheetIntoSlots=useCallback(async(selectedIds)=>{
    if(!selectedIds.length){alert('선택된 지문이 없습니다.');return;}
    setSheetLoading(true);
    const restored=[];
    try{
      // 유효 지문 선별 후 출제DB 병렬 조회 (직렬 → 병렬: N×1~2초 → 1~2초)
      const validSps=selectedIds.map(id=>sheetPassages.find(p=>p.id===id)).filter(Boolean);
      const qResults=await Promise.all(validSps.map(sp=>
        jsonpFetch(appsUrl,{action:'getQuestions',pid:sp.id}).catch(()=>({ok:false,questions:[]}))
      ));
      for(let vi=0;vi<validSps.length;vi++){
        const sp=validSps[vi];
        const r=qResults[vi];
        const qs=r.ok?(r.questions||[]):[];
        // passageData 복원
        const pd={
          id:sp.id,
          difficulty:sp.difficulty,
          title:sp.title,
          abstract:sp.abstract,
          sentences:sp.sentences_json?JSON.parse(sp.sentences_json):[],
          flow:sp.flow_json?JSON.parse(sp.flow_json):{},
        };
        const blockSummaries=sp.blockSummaries_json?JSON.parse(sp.blockSummaries_json):null;
        // 각 출제 타입을 passageData에 다시 분해 흡수
        qs.forEach(q=>{
          let d={};
          try{d=q.data_json?JSON.parse(q.data_json):{};}catch{return;}
          if(q.type==='topic'){
            pd.topic_options=d.options;
            pd.topic_answer=q.answer;
          }
          else if(q.type==='blank'){
            pd.blank_sel=d.sel||0;
            pd.blank_candidates=d.candidates||[];
            // 평탄 필드 복원: candidates[sel]로부터
            const bc=pd.blank_candidates[pd.blank_sel]||{};
            pd.blank_sentence_index=d.sentence_index??bc.sentence_index;
            pd.blank_target=d.target??bc.target;
            pd.blank_options=d.options||(bc.options||(bc.correct?[bc.correct,...(bc.distractors||[])]:[]));
            pd.blank_answer=q.answer||bc.answer||1;
          }
          else if(q.type==='order'){
            pd.order_given_index=d.given_index;
            pd.order_blocks=d.blocks;
            pd.order_options=d.options;
            pd.order_answer=q.answer;
          }
          else if(q.type==='insert'){
            pd.insert_sel=d.sel||0;
            pd.insert_candidates=d.candidates||[];
            // 평탄 필드 복원
            const ic=pd.insert_candidates[pd.insert_sel]||{};
            pd.insert_sentence=d.sentence||ic.sentence;
            pd.insert_answer=q.answer||ic.pos||1;
          }
          else if(q.type==='summary'){
            pd.summary_sel=d.sel||0;
            pd.summary_candidates=d.candidates||[];
            // 평탄 필드 복원: candidates[sel]로부터
            const sc=pd.summary_candidates[pd.summary_sel]||{};
            pd.summary_template=d.template||sc.template||'';
            // A_options/B_options는 [correct, ...distractors] 형태로 평탄화
            pd.summary_A_options=d.A_options||(sc.A_correct?[sc.A_correct,...(sc.A_distractors||[])]:[]);
            pd.summary_A_answer=d.A_answer||1;
            pd.summary_B_options=d.B_options||(sc.B_correct?[sc.B_correct,...(sc.B_distractors||[])]:[]);
            pd.summary_B_answer=d.B_answer||1;
          }
          else if(q.type==='implication'){
            pd.implication_sentence_index=d.sentence_index;
            pd.implication_keyword=d.keyword;
            pd.implication_options=d.options;
            pd.implication_answer=q.answer;
          }
          else if(q.type==='irrelevant'){
            pd.irrel_sel=d.sel||0;
            pd.irrel_candidates=d.candidates||[];
            pd.irrel_insert_pos=d.insert_pos||0;
            pd.irrel_confirmed=d.confirmed||false;
            pd.irrelevant_sentence_index=d.sentence_index;
          }
          else if(q.type==='grammar'){
            pd.grammar_sets=d.sets||[];
            pd.grammar_sel=d.sel||0;
            pd.grammar_items=d.items||[];
            pd.grammar_answer=q.answer||1;
          }
          else if(q.type==='vocab'){
            pd.vocab_sets=d.sets||[];
            pd.vocab_sel=d.sel||0;
            pd.vocab_items=d.items||[];
            pd.vocab_answer=q.answer||1;
          }
        });
        // restorePassageData 호출하여 grammar_sets/vocab_sets/insert_candidates 정리
        const restoredPd=restorePassageData(pd);
        restored.push({sp,pd:restoredPd,blockSummaries});
      }
      // 빈 슬롯에 차례로 채우기
      setSlots(prev=>{
        const next=[...prev];
        let idx=0;
        for(const {sp,pd,blockSummaries} of restored){
          // ★ 같은 ID 슬롯이 이미 있으면 그 슬롯을 덮어쓰기 (isPublic 등 시트 상태 반영)
          const existingIdx=next.findIndex(s=>s.passageData?.id===pd.id);
          let targetIdx;
          if(existingIdx>=0){
            targetIdx=existingIdx;
          }else{
            // 없으면 빈 슬롯 찾기
            while(idx<next.length&&next[idx].text&&next[idx].text.trim())idx++;
            if(idx>=next.length)break;
            targetIdx=idx;
            idx++;
          }
          const sentenceText=(pd.sentences||[]).map(s=>typeof s==='string'?s:(s.text||'')).join(' ');
          next[targetIdx]={
            ...next[targetIdx],
            text:sentenceText,
            meta:{source:sp.source||'',chapter:Number(sp.chapter)||1,chapterOrg:sp.chapter_org||'',number:Number(sp.number)||1,difficulty:sp.difficulty||'중'},
            status:'saved',
            analysis:{sentences:pd.sentences||[],flow:pd.flow||{},grammar:{difficultSentences:(pd.flow&&pd.flow.difficultSentences)||[]}},
            passageData:pd,
            blockSummaries,
            open:true,
            error:'',
            isPublic:sp.is_public==='TRUE'||sp.is_public===true,
            isHot:sp.is_hot==='TRUE'||sp.is_hot===true,
          };
        }
        saveSlots(next);
        return next;
      });
      setShowSheetLoad(false);
      setSheetLoadSel({});
      alert(`✓ ${restored.length}개 지문을 슬롯에 불러왔습니다.`);
    }catch(e){
      alert('불러오기 오류: '+e.message);
    }
    setSheetLoading(false);
  },[appsUrl,sheetPassages]);

  const fetchPassages=useCallback(async()=>{
    if(loadedPassages.length>0){setShowLoad(true);return;}
    setLoadFetching(true);
    try{
      // 1차: 같은 폴더 상대경로 시도 (GitHub Pages에서 호스팅된 경우)
      let text='';
      try{
        const r=await fetch('passages.js?t='+Date.now());
        if(r.ok)text=await r.text();
      }catch(e){}
      // 2차: GitHub raw URL 시도 (로컬 파일에서 실행 중인 경우)
      if(!text&&ghRepo){
        const branches=['main','master'];
        for(const br of branches){
          try{
            const url=`https://raw.githubusercontent.com/${ghRepo}/${br}/passages.js?t=${Date.now()}`;
            const r2=await fetch(url);
            if(r2.ok){text=await r2.text();break;}
          }catch(e){}
        }
      }
      // 3차: GitHub API 시도 (인증 토큰 사용)
      if(!text&&ghToken&&ghRepo){
        const r3=await fetch(`https://api.github.com/repos/${ghRepo}/contents/passages.js`,
          {headers:{'Authorization':`token ${ghToken}`,'Accept':'application/vnd.github.v3+json'}});
        if(r3.ok){
          const j=await r3.json();
          text=new TextDecoder('utf-8').decode(Uint8Array.from(atob(j.content.replace(/\n/g,'')),c=>c.charCodeAt(0)));
        }
      }
      if(!text)throw new Error('passages.js 로드 실패 (모든 경로 실패)');
      const modified=text.replace(/^\uFEFF/,'').replace(/^\s*(const|let|var)\s+PASSAGES\s*=/,'window.__LOAD_PASSAGES =');
      new Function(modified)();
      const ps=window.__LOAD_PASSAGES||[];
      if(!ps.length)throw new Error('passages.js 파싱 결과 비어있음');
      setLoadedPassages(ps);
      setShowLoad(true);
    }catch(e){alert('passages.js 로드 실패: '+e.message);}
    setLoadFetching(false);
  },[loadedPassages,ghToken,ghRepo]);

  const restorePassageData=(p)=>{
    if(!p)return p;
    let pd={...p};
    // grammar_sets 없고 grammar_items 있으면 복원
    if((!pd.grammar_sets||!pd.grammar_sets.length||pd.grammar_sets.every(s=>!s?.items?.length))&&pd.grammar_items?.length){
      pd.grammar_sets=[{items:pd.grammar_items,answer:pd.grammar_answer||1}];
      pd.grammar_sel=0;
    }
    // vocab_sets 없고 vocab_items 있으면 복원
    if((!pd.vocab_sets||!pd.vocab_sets.length||pd.vocab_sets.every(s=>!s?.items?.length))&&pd.vocab_items?.length){
      pd.vocab_sets=[{items:pd.vocab_items,answer:pd.vocab_answer||1}];
      pd.vocab_sel=0;
    }
    // insert_candidates 구버전(문자열 배열) 또는 잘못된 구조 정리
    if(pd.insert_candidates?.length){
      pd.insert_candidates=pd.insert_candidates.filter(c=>c&&typeof c==='object'&&c.sentence);
    }
    // insert_candidates 없고 insert_sentence 있으면 단일 후보로 복원
    if((!pd.insert_candidates||!pd.insert_candidates.length)&&pd.insert_sentence){
      pd.insert_candidates=[{sentence:pd.insert_sentence,pos:pd.insert_answer||1}];
      pd.insert_sel=0;
    }
    return pd;
  };

  const normalizeSentences=(sents)=>{
    if(!sents||!sents.length) return [];
    if(typeof sents[0]==='string') return sents.map((t,i)=>({num:i+1,text:t,symbol:'',role:'',chunks:[]}));
    return sents;
  };

  const loadIntoSlot=useCallback((p)=>{
    const normed=normalizeSentences(p.sentences);

                // 여전히 없으면 시트에서 직접 조회
                if(!passageData&&appsUrl){
                  try{
                    const r=await jsonpFetch(appsUrl,{action:'getPassages',id:pid});
                    const sp=(r&&r.passages&&r.passages[0])||null;
                    if(sp){
                      const qs_r=await jsonpFetch(appsUrl,{action:'getQuestions',pid});
                      const qs_=(qs_r&&qs_r.questions)||[];
                      // restoreFromSheet 로직 (loadSelected와 동일)
                      let pd={};
                      try{pd=JSON.parse(sp.passage_json||'{}');}catch{}
                      if(!pd.sentences?.length){try{pd.sentences=JSON.parse(sp.sentences_json||'[]');}catch{}}
                      pd.id=pd.id||pid;
                      pd.source=sp.source||slot.meta.source;
                      pd.chapter=sp.chapter||slot.meta.chapter;
                      pd.number=sp.number||slot.meta.number;
                      qs_.forEach(q=>{
                        let d={};try{d=q.data_json?JSON.parse(q.data_json):{};}catch{return;}
                        if(q.type==='topic'){pd.topic_options=d.options;pd.topic_answer=q.answer;}
                        else if(q.type==='blank'){pd.blank_sel=d.sel||0;pd.blank_candidates=(d.candidates||[]).map(c=>{const sents=pd.sentences||[];const ri=sents.findIndex(s=>(typeof s==='string'?s:s.text||'').includes(c.keyword));return ri>=0?{...c,sentence_index:ri}:c;});const bc=pd.blank_candidates[pd.blank_sel]||{};pd.blank_sentence_index=bc.sentence_index??d.sentence_index;pd.blank_target=d.target??bc.keyword;pd.blank_options=d.options||(bc.keyword?[bc.keyword,...(bc.distractors||[])]:['','','','','']);pd.blank_answer=q.answer;}
                        else if(q.type==='order'){pd.order_given_index=d.given_index||0;pd.order_blocks=d.blocks||[];pd.order_options=d.options||['(A)-(B)-(C)','(B)-(C)-(A)','(C)-(A)-(B)','(B)-(A)-(C)','(A)-(C)-(B)'];pd.order_answer=q.answer;}
                        else if(q.type==='summary'){pd.summary_sel=d.sel||0;pd.summary_candidates=d.candidates||[];if(d.candidates?.length){const sc=d.candidates[pd.summary_sel]||{};pd.summary_template=sc.template||d.template;pd.summary_A_options=[sc.A_correct,...(sc.A_distractors||[])];pd.summary_B_options=[sc.B_correct,...(sc.B_distractors||[])];pd.summary_A_answer=q.answer;pd.summary_B_answer=1;}}
                        else if(q.type==='implication'){pd.implication_sentence_index=d.sentence_index||0;pd.implication_keyword=d.keyword||'';pd.implication_options=d.options||['','','','',''];pd.implication_answer=q.answer;}
                        else if(q.type==='irrelevant'){pd.irrel_sel=d.sel||0;pd.irrel_candidates=d.candidates||[];pd.irrel_insert_pos=d.insert_pos||0;pd.irrel_confirmed=d.confirmed||false;pd.irrelevant_sentence_index=d.insert_pos||0;}
                        else if(q.type==='insert'){pd.insert_sel=d.sel||0;pd.insert_candidates=(d.candidates||[]).map(c=>{const sents=pd.sentences||[];const ri=sents.findIndex(s=>(typeof s==='string'?s:s.text||'').includes(c.sentence));return{...c,sentence_index:ri>=0?ri:c.sentence_index};});pd.insert_sentence=d.sentence||pd.insert_candidates[0]?.sentence||'';pd.insert_answer=d.answer||q.answer;}
                        else if(q.type==='grammar'){pd.grammar_sets=d.sets||[];pd.grammar_sel=d.sel||0;pd.grammar_answer=q.answer;if((!pd.grammar_sets.length)&&d.items?.length)pd.grammar_sets=[{items:d.items,answer:q.answer}];}
                        else if(q.type==='vocab'){pd.vocab_sets=d.sets||[];pd.vocab_sel=d.sel||0;pd.vocab_answer=q.answer;if((!pd.vocab_sets.length)&&d.items?.length)pd.vocab_sets=[{items:d.items,answer:q.answer}];}
                      });
                      passageData=restorePassageData(pd);
                    }
                  }catch(e){console.warn('시트 조회 실패:',e);}
                }
                if(!passageData){
                  alert('출제 데이터를 불러오지 못했습니다.\n시트 저장 후 다시 시도해주세요.');
                  return;
                }
                setAuthorInitPassageData(passageData);
                setAuthorKey(k=>k+1);
                setViewMode('authoring');
              }}
            onText={v=>{
              // 기존에 passageData가 있고, 텍스트가 크게 바뀌면 경고
              if(slot.passageData&&slot.text&&v.trim()&&Math.abs(v.length-slot.text.length)>50){
                if(!window.confirm(`⚠️ 이 슬롯에는 이미 ${slot.passageData.id} 데이터가 있습니다.\n\n새 지문을 분석하려면 강/번호를 먼저 변경하거나 슬롯을 초기화해주세요.\n\n그대로 텍스트를 변경하시겠습니까?`)){
                  return;
                }
              }
              upSlot(slot.id,{text:v});
            }}
            onClear={()=>{
              if(window.confirm('이 슬롯을 비울까요? (저장된 GitHub 데이터는 유지됩니다)')){
                upSlot(slot.id,{text:'',meta:{source:'',chapter:'',number:'',difficulty:'중'},status:'idle',analysis:null,passageData:null,blockSummaries:null,open:false,error:''});
              }
            }}
            onMeta={handleMeta}
            onToggle={()=>upSlot(slot.id,{open:!slot.open})}
            onConfirm={()=>upSlot(slot.id,{status:'confirmed'})}
            onSave={()=>upSlot(slot.id,{status:'saved'})}
            onSheetSave={async()=>{const ok=await saveSlotToSheet(slot);if(ok){const pid=makePassageId(slot.meta?.source,slot.meta?.chapter,slot.meta?.number);upSlot(slot.id,{status:'saved',passageData:slot.passageData||{id:pid,...(slot.analysis||{})}});flash('시트 저장 ✓');}}}
            onTogglePublic={async()=>{
              const next=!slot.isPublic;
              if(!appsUrl){
                upSlot(slot.id,{isPublic:next});
                flash('Apps Script URL 미설정 - 로컬만 변경됨');
                return;
              }
              // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
              // 데이터 안정성 최우선 정책 (이전 채팅에서 결정된 안 G 적용)
              //
              // 위험 시나리오: 다기기/시점 차이로 로컬 슬롯이 시트보다 덜 완성된 상태일 때
              //   토글로 전체 payload를 보내면 시트의 완성 데이터를 덮어쓸 위험
              //
              // 해결책 (2중 방어):
              //   ① 토글은 오직 {id, is_public}만 전송 → 다른 필드 영향 최소화
              //   ② Apps Script가 패치된 버전이면 다른 필드는 기존값 유지
              //      미패치 버전이면 사전 차단: 시트 데이터와 비교해서 손실 위험 시 중단
              // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
              const pid=slot.passageData?.id
                      ||(makePassageId(slot.meta.source,slot.meta.chapter,slot.meta.number));
              try{
                // ① 시트의 현재 상태 조회 (안전 검증용)
                const cur=await jsonpFetch(appsUrl,{action:'getPassages',id:pid});
                const sheetP=(cur&&cur.passages&&cur.passages[0])||null;
                
                // ② 시트에 데이터가 있는데, 로컬과 다른 경우 경고
                if(sheetP){
                  const localTitle=slot.passageData?.title||'';
                  const localSentLen=(slot.analysis?.sentences||slot.passageData?.sentences||[]).length;
                  const sheetSentLen=(()=>{try{return JSON.parse(sheetP.sentences_json||'[]').length;}catch{return 0;}})();
                  
                  // 시트는 데이터가 있는데 로컬은 비어있음 → 절대 안 됨
                  if(sheetSentLen>0&&localSentLen===0){
                    alert('❌ 차단: 시트에 분석 데이터가 있지만 이 슬롯은 비어있습니다.\n\n공개 토글 시 시트 데이터가 손실될 수 있어 작업을 중단합니다.\n슬롯에 데이터를 먼저 불러온 후 다시 시도하세요.');
                    return;
                  }
                  
                  // 시트 sentences 길이와 로컬이 크게 다름 → 사용자 확인
                  if(sheetSentLen>0&&Math.abs(sheetSentLen-localSentLen)>2){
                    if(!window.confirm(`⚠️ 데이터 불일치 감지\n\n시트: ${sheetSentLen}개 문장\n로컬: ${localSentLen}개 문장\n\n그대로 진행하면 시트가 로컬 기준으로 덮어써집니다.\n계속하시겠습니까?`)){
                      return;
                    }
                  }
                }
                
                // ③ 최소 payload만 전송 (id + is_public)
                //    Apps Script가 패치된 경우: 다른 필드는 기존값 유지
                //    Apps Script가 미패치된 경우: 다른 필드가 ''로 덮어써짐 (위험)
                //    → 따라서 미패치 상태면 아래 추가 안전망 동작
                const safeMode=!sheetP||(sheetP&&JSON.parse(sheetP.sentences_json||'[]').length===0);
                let payload;
                if(safeMode){
                  // 시트에 데이터가 아예 없거나 이번이 첫 저장 → 최소 payload OK
                  payload={action:'savePassage',id:pid,is_public:next?'TRUE':'FALSE'};
                }else{
                  // 시트에 데이터가 있음 → Apps Script 미패치 대비 전체 payload 전송
                  // (단, 위 검증 통과 후이므로 로컬 데이터도 충실한 상태)
                  const {passagePayload}=buildSlotPayload({...slot,isPublic:next});
                  payload={action:'savePassage',...passagePayload};
                }
                
                const r=await formPostFetch(appsUrl,payload);
                if(r&&(r.ok||r.warning)){
                  upSlot(slot.id,{isPublic:next});
                  flash(next?'🌐 공개 설정 완료':'🔒 비공개 설정 완료');
                }else{
                  flash('공개 설정 실패: '+(r?.error||'unknown'));
                }
              }catch(e){flash('공개 설정 오류: '+e.message);}
            }}
            onStuOutput={(kind)=>setStuModal({kind,slot,opts:{...stuOpts}})}
            sheetSaving={!!slotSheetSaving[slot.id]}
            onReanalyze={()=>reanalyze(slot)}
            onAnalysis={upAnalysis}
            onGenSum={()=>generateBlockSummaries(slot)}
          />
        ))}
      </div>}
    </div>
  );
}

          {/* Block Diagram */}
          <div style={{fontSize:11,fontWeight:700,color:'#888',letterSpacing:'.1em',
            textTransform:'uppercase',marginBottom:8}}>Block Diagram</div>
          <div style={{display:'flex',alignItems:'flex-start',gap:5,marginBottom:12,flexWrap:'wrap'}}>
            {blocks.map((blk,bi)=>{
              const c=BC[blk.color]||BC.blue;
              const bsents=(blk.sentenceNums||[]).map(n=>sm[n]).filter(Boolean);
              return(
                <React.Fragment key={blk.id}>
                  <div style={{flex:'1 1 130px',minWidth:0,borderRadius:10,border:'2px solid '+c.bd}}>
                    <div style={{padding:'8px 11px',background:c.hd,borderBottom:'1.5px solid '+c.bd,borderRadius:'8px 8px 0 0'}}>
                      {IS
                        ?<div style={{borderBottom:'2px solid '+c.bd,height:22,width:'85%',marginBottom:5}}/>
                        :editable
                        ?<><input value={blk.name} onChange={e=>onAnalysis(slot.id,'flow.blocks.'+bi+'.name',e.target.value)}
                            style={{...iB,fontSize:13.5,fontWeight:600,color:c.tx,borderBottomColor:c.bd,marginBottom:2}}/>
                           <input value={blk.nameEn} onChange={e=>onAnalysis(slot.id,'flow.blocks.'+bi+'.nameEn',e.target.value)}
                            style={{...iB,fontSize:11,fontStyle:'italic',fontWeight:600,color:c.tx,borderBottomColor:c.bd,opacity:.85}}/></>
                        :<><div style={{fontSize:13.5,fontWeight:600,color:c.tx,marginBottom:2,wordBreak:'keep-all'}}>{blk.name}</div>
                           <div style={{fontSize:11,color:c.tx,fontStyle:'italic',fontWeight:600,opacity:.85}}>{blk.nameEn}</div></>
                      }
                    </div>
                    <div style={{padding:'7px',background:'#fff'}}>
                      {bsents.map((sent,si)=>{
                        const sc=SM[sent.symbol]||{};
                        const si2=sentences.indexOf(sent);
                        return<div key={sent.num}>
                          {si>0&&<div style={{fontSize:9,color:'#ccc',paddingLeft:22,margin:'1px 0'}}>↓</div>}
                          <div style={{display:'flex',alignItems:'flex-start',gap:6,padding:'5px 6px',
                            borderRadius:6,background:sc.bg,marginBottom:3}}>
                            <span style={{fontSize:15,fontWeight:600,color:sc.tx,flexShrink:0,marginTop:1}}>{nStr(sent.num)}</span>
                            <div style={{flex:1,minWidth:0}}>
                              {editable&&!IS
                                ?<><select value={sent.symbol}
                                    onChange={e=>onAnalysis(slot.id,'sentences.'+si2+'.symbol',e.target.value)}
                                    style={{...sB,fontSize:10,fontWeight:700,padding:'1px 4px',borderRadius:3,
                                      background:sc.bg,color:sc.tx,border:'1px solid '+sc.bd,marginBottom:3,display:'block'}}>
                                    {SYMS.map(s=><option key={s} value={s}>{s}</option>)}
                                  </select>
                                  <textarea value={sent.role}
                                    onChange={e=>onAnalysis(slot.id,'sentences.'+si2+'.role',e.target.value)}
                                    style={{...iB,fontSize:10.5,color:'#444',borderBottomColor:'#ddd',
                                      resize:'none',lineHeight:1.4,overflow:'hidden',minHeight:'2em',display:'block',width:'100%'}}/></>
                                :<>
                                  <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:3}}>
                                    <span style={{fontSize:10,fontWeight:700,padding:'1px 5px',borderRadius:3,
                                      background:sc.bg,color:sc.tx,border:'1px solid '+sc.bd,letterSpacing:'.03em'}}>{sent.symbol}</span>
                                  </div>
                                  <div style={{fontSize:10.5,color:'#333',lineHeight:1.45,wordBreak:'keep-all'}}>{sent.role}</div>
                                </>
                              }
                            </div>
                          </div>
                        </div>;
                      })}
                    </div>
                  </div>
                  {bi<blocks.length-1&&(
                    <div style={{display:'flex',flexDirection:'column',alignItems:'center',
                      justifyContent:'center',gap:2,flexShrink:0,paddingTop:52,minWidth:32}}>
                      {editable&&!IS
                        ?<select value={conn(bi)}
                            onChange={e=>{const cc=[...interBlockConnectors];cc[bi]=e.target.value;
                              onAnalysis(slot.id,'flow.interBlockConnectors',cc);}}
                            style={{...sB,fontSize:16,fontWeight:600,color:'#555',textAlign:'center',width:'100%'}}>
                            {SYMS.map(s=><option key={s} value={s}>{s}</option>)}
                          </select>
                        :<div style={{fontSize:16,fontWeight:600,color:'#555'}}>{conn(bi)}</div>
                      }
                      <div style={{fontSize:9,color:'#bbb',textAlign:'center',lineHeight:1.3}}>
                        {SM[conn(bi)]&&SM[conn(bi)].lbl||''}
                      </div>
                    </div>
                  )}
                </React.Fragment>
              );
            })}
          </div>

          {/* 메타 */}
          <div style={{display:'flex',gap:8,marginBottom:12,flexWrap:'wrap'}}>
            {[{lbl:'핵심 소재',f:'keyword',val:keyword,flex:1},
              {lbl:'주제 요약',f:'topicSummary',val:topicSummary,flex:2}].map(({lbl,f,val,flex})=>(
              <div key={f} style={{flex,minWidth:120,background:'#f8f8f8',
                border:'0.5px solid #e5e5e5',borderRadius:8,padding:'8px 12px'}}>
                <div style={{fontSize:10,fontWeight:700,color:'#888',letterSpacing:'.08em',
                  textTransform:'uppercase',marginBottom:5}}>{lbl}</div>
                {IS?<div style={{borderBottom:'1.5px solid #bbb',height:22}}/>
                  :<textarea value={val}
                    onChange={e=>{onAnalysis(slot.id,'flow.'+f,e.target.value);e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px';}}
                    ref={el=>{if(el){el.style.height='auto';el.style.height=el.scrollHeight+'px';}}}
                    style={{...iB,fontSize:13,color:'#1a1a1a',resize:'none',
                      lineHeight:1.5,overflow:'hidden',wordBreak:'keep-all',
                      minHeight:'2.5em',display:'block',width:'100%'}}/>}
              </div>
            ))}
            <div style={{flex:1.3,minWidth:100,background:'#f8f8f8',
              border:'0.5px solid #e5e5e5',borderRadius:8,padding:'8px 12px'}}>
              <div style={{fontSize:10,fontWeight:700,color:'#888',letterSpacing:'.08em',
                textTransform:'uppercase',marginBottom:5}}>구조 유형</div>
              {IS?<div style={{display:'flex',flexWrap:'wrap',gap:3}}>
                {['통념→반박→결론','문제→해결책','질문→답변'].map(s=>(
                  <span key={s} style={{fontSize:10,padding:'2px 6px',
                    border:'0.5px solid #ddd',borderRadius:3,color:'#bbb'}}>□ {s}</span>))}
              </div>
              :<select value={structureType}
                  onChange={e=>onAnalysis(slot.id,'flow.structureType',e.target.value)}
                  style={{...sB,width:'100%',fontSize:13,color:'#1a1a1a'}}>
                  {STRUCTS.map(s=><option key={s} value={s}>{s}</option>)}
                </select>}
            </div>
          </div>

          {/* 블록 요약 빈칸 섹션 */}
          {(()=>{
            const bs=slot.blockSummaries;
            const hasAnalysis=blocks.length>0;
            if(!hasAnalysis)return null;
            const BC2={blue:{bd:'#185FA5',bg:'#E6F1FB',tx:'#0C447C'},coral:{bd:'#D85A30',bg:'#FAECE7',tx:'#712B13'},
              teal:{bd:'#1D9E75',bg:'#E1F5EE',tx:'#085041'},purple:{bd:'#534AB7',bg:'#EEEDFE',tx:'#3C3489'},
              green:{bd:'#639922',bg:'#EAF3DE',tx:'#173404'},amber:{bd:'#BA7517',bg:'#FAEEDA',tx:'#633806'},gray:{bd:'#5F5E5A',bg:'#F1EFE8',tx:'#2C2C2A'}};

            const renderSummary=(sumText,keywords,bc)=>{
              if(!sumText)return null;
              const parts=sumText.split(/\{([^}]+)\}/g);
              return parts.map((part,i)=>{
                if(i%2===1){
                  if(IS){
                    return<span key={i} style={{display:'inline-block',borderBottom:'1.5px solid '+bc.bd,
                      minWidth:60,marginRight:2}}>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>;
                  }
                  return<span key={i} style={{display:'inline-block',background:bc.bg,color:bc.tx,
                    border:'1px solid '+bc.bd,borderRadius:4,padding:'0 5px',fontSize:11.5,fontWeight:500}}>{part}</span>;
                }
                return<span key={i}>{part}</span>;
              });
            };

            return(
              <div style={{marginBottom:12}}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
                  <div style={{fontSize:11,fontWeight:700,color:'#888',letterSpacing:'.08em',textTransform:'uppercase'}}>
                    블록 요약 빈칸
                  </div>
                  {!IS&&<button onClick={onGenSum} disabled={bs==='loading'}
                    style={{padding:'3px 10px',fontSize:11,background:bs==='loading'?'#ccc':'#185FA5',
                      color:'#fff',border:'none',borderRadius:5,cursor:'pointer'}}>
                    {bs==='loading'?'생성중...':bs?'재생성 ↻':'요약 생성 ↗'}
                  </button>}
                </div>
                {bs&&bs!=='loading'&&Array.isArray(bs)?
                  bs.map((item,bi)=>{
                    const blk=blocks.find(b=>b.id===item.blockId)||blocks[bi]||{};
                    const bc=BC2[blk.color]||BC2.gray;
                    return(
                      <div key={bi} style={{border:'0.5px solid '+bc.bd,borderRadius:8,
                        overflow:'hidden',marginBottom:8}}>
                        <div style={{background:bc.bg,padding:'5px 10px',display:'flex',gap:8,alignItems:'center'}}>
                          <span style={{fontSize:11,fontWeight:600,color:bc.tx}}>{blk.name||item.blockId}</span>
                          <span style={{fontSize:10,color:bc.tx,opacity:.7}}>{blk.nameEn||''}</span>
                        </div>
                        <div style={{padding:'8px 12px',fontSize:12.5,fontStyle:'italic',
                          color:'#333',lineHeight:1.8,wordBreak:'keep-all'}}>
                          {renderSummary(item.summary,item.keywords,bc)}
                        </div>
                      </div>
                    );
                  })
                  :<div style={{fontSize:12,color:'#bbb',padding:'10px 0',textAlign:'center'}}>
                    {IS?'(요약 미생성)':bs==='loading'?'생성 중...':'요약 생성 버튼을 눌러주세요'}
                  </div>
                }
              </div>
            );
          })()}

          {/* 문장별 분석 */}
          {(()=>{
            const dsToShow=IS
              ?sentences.filter(s=>difficultSentences.find(d=>d.num===s.num))
              :sentences;
            if(!dsToShow.length)return null;
            return(
              <div style={{marginBottom:10}}>
                <div style={{fontSize:11,fontWeight:700,color:'#888',letterSpacing:'.08em',
                  textTransform:'uppercase',marginBottom:8}}>
                  {IS?'구문 분석':'문장별 분석 — 끊어읽기 & 구문'}
                </div>
                {dsToShow.map(s=>{
                  const sc=SM[s.symbol]||{};
                  const bc=sentBlockColor(blocks,s.num);
                  const ds=difficultSentences.find(d=>d.num===s.num);
                  const di=difficultSentences.findIndex(d=>d.num===s.num);
                  const chunks=s.chunks||[];
                  return(
                    <div key={s.num} style={{marginBottom:6,border:'0.5px solid '+bc.bd,
                      borderRadius:8,overflow:'hidden'}}>
                      <div style={{padding:'6px 12px',background:bc.bg,
                        display:'flex',alignItems:'center',gap:7}}>
                        <span style={{fontSize:15,fontWeight:700,color:bc.tx,flexShrink:0}}>{nStr(s.num)}</span>
                        <span style={{fontSize:10,fontWeight:700,padding:'1px 5px',borderRadius:3,
                          background:'rgba(255,255,255,.6)',color:sc.tx||'#555',border:'1px solid '+(sc.bd||'#999'),
                          flexShrink:0}}>({s.symbol})</span>
                        <span style={{fontSize:13,color:bc.tx,fontStyle:'italic',
                          wordBreak:'keep-all',overflowWrap:'break-word',lineHeight:1.5}}>
                          {chunks.length>0?chunks.map(c=>c.en||'').join(' / '):s.text}
                        </span>
                      </div>
                      {!IS&&chunks.length>0&&(
                        <div style={{padding:'7px 12px',background:'#fff',borderTop:'0.5px solid #eee'}}>
                          <div style={{fontSize:13,color:'#555',lineHeight:1.9,
                            wordBreak:'keep-all',overflowWrap:'break-word'}}>
                            {chunks.map(c=>c.ko||'').join(' / ')}
                          </div>
                        </div>
                      )}
                      {ds&&(
                        <div style={{padding:'7px 12px',background:'#fafafa',borderTop:'0.5px solid #eee'}}>
                          <div style={{fontSize:10,fontWeight:700,color:'#aaa',marginBottom:4}}>구문 분석</div>
                          {[{lbl:'구조',f:'structure'},{lbl:'해석',f:'translation'},{lbl:'포인트',f:'point'}].map(row=>(
                            <div key={row.f} style={{display:'flex',gap:8,padding:'3px 0',
                              borderBottom:'0.5px dashed #eee',alignItems:'flex-start'}}>
                              <span style={{fontSize:10,fontWeight:700,color:'#888',
                                flexShrink:0,width:34,paddingTop:2}}>{row.lbl}</span>
                              <textarea value={ds[row.f]||''}
                                onChange={e=>{const nd=[...difficultSentences];
                                  nd[di]={...nd[di],[row.f]:e.target.value};
                                  onAnalysis(slot.id,'grammar.difficultSentences',nd);}}
                                rows={1} style={{...iB,fontSize:12.5,color:'#333',resize:'none',
                                  lineHeight:1.5,flex:1,overflow:'hidden',wordBreak:'break-all'}}/>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            );
          })()}

          {/* 액션 */}
          <div style={{display:'flex',gap:8,flexWrap:'wrap',paddingTop:4,alignItems:'center'}}>
            {['analyzed','confirmed','saved'].includes(slot.status)&&onSheetSave&&(
              <button onClick={onSheetSave} disabled={sheetSaving} style={{padding:'7px 18px',fontSize:13,fontWeight:600,
                background:sheetSaving?'#888':'#534AB7',color:'#fff',border:'none',borderRadius:7,cursor:sheetSaving?'wait':'pointer'}}>
                {sheetSaving?'저장중...':'📊 시트 저장'}
              </button>
            )}
            {slot.status==='saved'&&onTogglePublic&&(
              <button onClick={onTogglePublic} style={{padding:'7px 14px',fontSize:12.5,fontWeight:600,
                background:slot.isPublic?'#0a7c42':'#e9ecef',
                color:slot.isPublic?'#fff':'#555',
                border:slot.isPublic?'none':'1px solid #ccc',borderRadius:6,cursor:'pointer'}}>
                {slot.isPublic?'🌐 공개중':'🔒 비공개'}
              </button>
            )}
            {['analyzed','confirmed','saved'].includes(slot.status)&&(
              <button onClick={onReanalyze} style={{padding:'7px 14px',fontSize:12.5,background:'transparent',
                color:'#534AB7',border:'0.5px solid #534AB7',borderRadius:6,cursor:'pointer'}}>↺ 재분석</button>
            )}
            {slot.analysis&&(
              <button onClick={onAuthor} style={{padding:'7px 10px',fontSize:12.5,background:'#6A0DAD',color:'#fff',border:'none',borderRadius:6,cursor:'pointer',fontWeight:600}}>✏저작</button>
            )}
            <div style={{flex:1}}/>
            <button onClick={onToggle} title="접기"
              style={{width:28,height:28,padding:0,fontSize:14,fontWeight:700,borderRadius:5,border:'none',
                background:'#534AB7',color:'#fff',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>▲</button>
          </div>
        </div>
      )}
    </div>
  );
});
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
