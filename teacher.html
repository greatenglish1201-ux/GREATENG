// JSONP fetch (CORS 우회 - Apps Script 호출용)
function jsonpFetch(url, data){
  return new Promise((resolve, reject)=>{
    const cb='jsonp_cb_'+Date.now()+'_'+Math.floor(Math.random()*100000);
    const params=new URLSearchParams({...data, callback:cb}).toString();
    const script=document.createElement('script');
    const timer=setTimeout(()=>{cleanup(); reject(new Error('JSONP timeout'));}, 30000);
    function cleanup(){clearTimeout(timer); delete window[cb]; if(script.parentNode)script.parentNode.removeChild(script);}
    window[cb]=(res)=>{cleanup(); resolve(res);};
    script.src=url+(url.includes('?')?'&':'?')+params;
    script.onerror=()=>{cleanup(); reject(new Error('JSONP network error'));};
    document.body.appendChild(script);
  });
}

// Form POST fetch (큰 데이터 전송용 - URL 길이 제한 우회)
// hidden iframe에 form.submit() → iframe load 시 textarea 응답 읽음
function formPostFetch(url, data){
  return new Promise((resolve, reject)=>{
    const iframeName='formpost_'+Date.now()+'_'+Math.floor(Math.random()*100000);
    const iframe=document.createElement('iframe');
    iframe.name=iframeName;
    iframe.style.display='none';
    const form=document.createElement('form');
    form.method='POST';
    form.action=url;
    form.target=iframeName;
    form.enctype='application/x-www-form-urlencoded';
    form.style.display='none';
    // 모든 데이터를 payload 1개 필드에 JSON으로 묶음
    const input=document.createElement('input');
    input.type='hidden';
    input.name='payload';
    input.value=JSON.stringify(data);
    form.appendChild(input);
    const timer=setTimeout(()=>{cleanup(); reject(new Error('formPost timeout'));}, 60000);
    function cleanup(){
      clearTimeout(timer);
      if(iframe.parentNode)iframe.parentNode.removeChild(iframe);
      if(form.parentNode)form.parentNode.removeChild(form);
    }
    iframe.onload=()=>{
      try{
        // 같은 도메인이 아니라 iframe 내용 직접 접근 불가
        // → Apps Script가 textarea로 응답 → iframe.contentDocument 시도
        let text='';
        try{
          const doc=iframe.contentDocument||iframe.contentWindow.document;
          const ta=doc.getElementById('__greateng_response__');
          if(ta)text=ta.value;
        }catch(crossErr){
          // cross-origin: postMessage 방식 필요하지만 일단 ok 가정
          cleanup();
          resolve({ok:true,warning:'cross-origin: 응답 확인 불가 (저장은 됐을 가능성 높음)'});
          return;
        }
        if(text){
          try{
            const decoded=text.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&');
            const result=JSON.parse(decoded);
            cleanup();
            resolve(result);
          }catch(parseErr){
            cleanup();
            reject(new Error('응답 파싱 실패: '+parseErr.message));
          }
        }else{
          cleanup();
          resolve({ok:true,warning:'응답 없음 (저장은 됐을 가능성)'});
        }
      }catch(e){
        cleanup();
        reject(new Error('formPost 응답 오류: '+e.message));
      }
    };
    iframe.onerror=()=>{cleanup(); reject(new Error('formPost network error'));};
    document.body.appendChild(iframe);
    document.body.appendChild(form);
    form.submit();
  });
}

function upsertPassages(currentContent,newEntries){
  const start=currentContent.indexOf('[');
  const end=currentContent.lastIndexOf(']');
  if(start<0||end<0)throw new Error('passages.js 형식 오류');
  let existing;
  try{existing=JSON.parse(currentContent.slice(start,end+1));}
  catch{throw new Error('passages.js JSON 파싱 실패');}
  // 기존 배열 중복 제거 (필드 수 많은 것 우선)
  const deduped=[];const seenIds=new Set();
  existing.forEach(e=>{
    if(!seenIds.has(e.id)){seenIds.add(e.id);deduped.push(e);}
    else{const i=deduped.findIndex(x=>x.id===e.id);if(i>=0&&Object.keys(e).length>Object.keys(deduped[i]).length)deduped[i]=e;}
  });
  existing=deduped;
  // 새 항목 upsert
  newEntries.forEach(ne=>{
    const idx=existing.findIndex(e=>e.id===ne.id);
    if(idx>=0)existing[idx]=Object.fromEntries(Object.entries({...existing[idx],...ne}).filter(([,v])=>v!==null&&v!==undefined&&!(Array.isArray(v)&&v.length===0)));else existing.push(ne);
  });
  return currentContent.slice(0,start)+JSON.stringify(existing,null,2)+currentContent.slice(end+1);
}

function parseJSON(text){
  let s=text.replace(/```(?:json)?|```/g,'').trim();
  // 중첩 괄호 추적으로 정확한 JSON 경계 추출
  const start=s.search(/[{[]/);
  if(start<0)throw new Error('JSON 시작 없음');
  const opener=s[start];
  const closer=opener==='{'?'}':']';
  let depth=0,inStr=false,escape=false,end=-1;
  for(let i=start;i<s.length;i++){
    const c=s[i];
    if(escape){escape=false;continue;}
    if(c==='\\'){escape=true;continue;}
    if(c==='"'){inStr=!inStr;continue;}
    if(inStr)continue;
    if(c==='{'||c==='[')depth++;
    else if(c==='}'||c===']')depth--;
    if(depth===0){end=i;break;}
  }
  if(end>=0)s=s.slice(start,end+1);
  else s=s.slice(start);
  return JSON.parse(s);
}



function Highlighted({text,words}){
  if(!words||!words.length) return React.createElement(React.Fragment,null,text);
  const sorted=[...words].sort((a,b)=>b.length-a.length);
  const esc=w=>w.replace(/[-.*+?^${}()|[\]\\]/g,'\\$&');
  const pat=new RegExp('('+sorted.map(esc).join('|')+')','gi');
  const parts=text.split(pat);
  return React.createElement(React.Fragment,null,...parts.map((p,i)=>
    sorted.some(w=>w.toLowerCase()===p.toLowerCase())
      ?<mark key={i} style={{background:'#FFD700',color:'inherit',borderRadius:2,padding:'0 2px',fontWeight:700}}>{p}</mark>
      :p
  ));
}

  const SHOW_ANSWERS=!IS||O.showAnswers;
  const {analysis,meta}=slot;
  if(!analysis)return;
  const {sentences=[],flow={},grammar={}}=analysis;
  const {blocks=[],interBlockConnectors=[],keyword='',topicSummary='',structureType=''}=flow;
  const {difficultSentences=[]}=grammar;
  const sm=Object.fromEntries(sentences.map(s=>[s.num,s]));
  const conn=i=>interBlockConnectors[i]||'→';
  const id=makePassageId(meta.source,meta.chapter,meta.number);
  const F='Malgun Gothic',P9=18,P8=16,P10=20;
  const nb={style:BorderStyle.NONE,size:0,color:'FFFFFF'};
  const bd=(c='888888',sz=3)=>({style:BorderStyle.SINGLE,size:sz,color:c});
  const nobs={top:nb,bottom:nb,left:nb,right:nb};
  // 블록 컬러맵 (hex # 제거)
  const BDC={
    blue:{hd:'B5D4F4',bd:'185FA5',tx:'0C447C',row:'E6F1FB'},
    coral:{hd:'F5C4B3',bd:'D85A30',tx:'712B13',row:'FAECE7'},
    teal:{hd:'9FE1CB',bd:'1D9E75',tx:'085041',row:'E1F5EE'},
    purple:{hd:'CECBF6',bd:'534AB7',tx:'3C3489',row:'EEEDFE'},
    green:{hd:'C0DD97',bd:'639922',tx:'173404',row:'EAF3DE'},
    amber:{hd:'FAC775',bd:'BA7517',tx:'633806',row:'FAEEDA'},
    gray:{hd:'E4E3DF',bd:'5F5E5A',tx:'2C2C2A',row:'F1EFE8'},
  };
  const bdc=c=>BDC[c]||BDC.gray;
  const CM={top:60,bottom:60,left:100,right:100};
  const cell=(children,opts={})=>new TableCell({
    borders:opts.borders||{top:bd(opts.bc||'AAAAAA'),bottom:bd(opts.bc||'AAAAAA'),
      left:bd(opts.bc||'AAAAAA'),right:bd(opts.bc||'AAAAAA')},
    shading:opts.bg?{fill:opts.bg,type:ShadingType.CLEAR}:undefined,
    width:opts.w?{size:opts.w,type:WidthType.DXA}:undefined,
    verticalAlign:VerticalAlign.CENTER,margins:opts.m||CM,children,
  });
  const para=(text,opts={})=>new Paragraph({
    alignment:opts.a||AlignmentType.LEFT,
    spacing:{before:opts.sb||0,after:opts.sa||40},
    border:opts.border,indent:opts.indent,
    children:Array.isArray(text)?text:[new TextRun({
      text:String(text||''),bold:opts.bold||false,size:opts.size||P9,
      color:opts.color||'1a1a1a',font:F,italics:opts.italic||false})],
  });
  const run=(text,opts={})=>new TextRun({
    text:String(text||''),bold:opts.bold||false,size:opts.size||P9,
    color:opts.color||'1a1a1a',font:F,italics:opts.italic||false});
  const blank=()=>new Paragraph({spacing:{after:80,before:0},
    border:{bottom:{style:BorderStyle.SINGLE,size:3,color:'888888',space:1}},
    children:[run(' ',{size:P9})]});
const ch=[];

  /* 헤더 */
  const now=new Date();
  const ts=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  ch.push(new Paragraph({spacing:{before:0,after:80},children:[
    run('수능 영어 독해 — 흐름 분석',{bold:true,size:P10}),
    run('  '+(IS?'[학생용]':'[교사용]')+'  '+id+'  ',{size:P8,color:'666666'}),
    run(ts,{size:P8,color:'999999'}),
  ]}));

  /* 지문 */
  if(O.passage){
  ch.push(para('■ 지문',{bold:true,size:P8,color:'185FA5',sa:20}));
  const pRuns=[];
  sentences.forEach(s=>{
    pRuns.push(run(nStr(s.num)+' ',{bold:true,size:P9}));
    pRuns.push(run(s.text+' ',{size:P9}));
  });
  ch.push(new Paragraph({spacing:{before:0,after:120},
    border:{left:{style:BorderStyle.SINGLE,size:14,color:'185FA5',space:6}},
    indent:{left:160},children:pRuns}));
  }

  /* Block Diagram */
  if(O.structure){
  ch.push(para('■ 글의 구조',{bold:true,size:P8,color:'185FA5',sb:20,sa:20}));
  const nc=blocks.length-1;
  const bw=Math.floor((9200-nc*440)/blocks.length);
  const colW=[];blocks.forEach((_,bi)=>{colW.push(bw);if(bi<blocks.length-1)colW.push(440);});
  const hCells=blocks.map((blk,bi)=>{
    const _bc=bdc(blk.color);
    const hd=IS?[blank()]:[para(blk.name,{bold:true,size:P9,color:_bc.tx,sa:20}),para(blk.nameEn,{size:P8,italic:true,color:_bc.tx,sa:0})];
    const c=cell(hd,{bg:_bc.hd,bc:_bc.bd,w:bw});
    if(bi<blocks.length-1)return[c,cell([para(conn(bi),{bold:true,size:P10,color:'444444',a:AlignmentType.CENTER,sa:0})],{borders:nobs,w:440})];
    return[c];
  }).flat();
  const maxS=Math.max(...blocks.map(b=>(b.sentenceNums||[]).length));
  const bRows=Array.from({length:maxS},(_,ri)=>{
    const rCells=blocks.map((blk,bi)=>{
      const sn=(blk.sentenceNums||[])[ri];
      const sent=sn?sm[sn]:null;
      const _bdc=bdc(blk.color);
      const c=cell(sent?[para([run(nStr(sent.num)+' ',{bold:true,size:P9,color:_bdc.tx}),
        run('('+sent.symbol+')  ',{size:P8,color:_bdc.bd}),run(sent.role,{size:P8,color:_bdc.tx})],{sa:0})]:[para('',{sa:0})],
        {bc:_bdc.bd,bg:_bdc.row,w:bw});
      if(bi<blocks.length-1)return[c,cell([para('',{sa:0})],{borders:nobs,w:440})];
      return[c];
    }).flat();
    return new TableRow({children:rCells});
  });
  ch.push(new Table({width:{size:9200,type:WidthType.DXA},columnWidths:colW,
    rows:[new TableRow({children:hCells}),...bRows]}));
  }

  /* 핵심소재/주제요약/구조 — 가로 1행 표 (지면 절약) */
  if(O.keyTopics){
    const ktItems=[
      {lbl:'핵심 소재',val:keyword,w:2400},
      {lbl:'주제 요약',val:topicSummary,w:4400},
      {lbl:'구조 유형',val:structureType,w:2400},
    ];
    const ktCells=ktItems.map(it=>cell([new Paragraph({spacing:{before:0,after:0},children:[
      run(it.lbl,{bold:true,size:P8,color:'185FA5'})
    ]}),new Paragraph({spacing:{before:20,after:0},children:[
      IS?run('________________',{size:P8}):run(it.val,{size:P8})
    ]})],{bc:'CCCCCC',w:it.w,m:{top:60,bottom:60,left:120,right:120}}));
    ch.push(new Table({width:{size:9200,type:WidthType.DXA},
      columnWidths:ktItems.map(i=>i.w),
      rows:[new TableRow({children:ktCells})]}));
  }

  /* 문장별 분석 */
  if(O.sentences){
  // hardOnly: 어려운 문장만 / hardOnly=false: 전체 문장
  const dsToShow=O.hardOnly?sentences.filter(s=>difficultSentences.find(d=>d.num===s.num)):sentences;
  if(dsToShow.length){
    ch.push(para(IS?'■ 구문 분석':'■ 문장별 분석 (끊어읽기 + 구문)',{bold:true,size:P8,color:'185FA5',sb:20,sa:20}));
    dsToShow.forEach(s=>{
      const ds=difficultSentences.find(d=>d.num===s.num);
      const chunks=s.chunks||[];
      const hasChunks=SHOW_ANSWERS&&chunks.length;
      // 방안2: 번호·하단 테두리=소속 블록 색, (기호)=기호 색
      const _blk=blocks.find(b=>Array.isArray(b.sentenceNums)&&b.sentenceNums.includes(s.num));
      const _bc=bdc(_blk&&_blk.color);
      const _symc=((SM[s.symbol]&&SM[s.symbol].bd)||'#888888').replace('#','');
      // chunks 있으면: 번호+심볼+끊어읽기 영문을 한 줄에 / chunks 없으면: 원본 문장 표시
      if(hasChunks){
        ch.push(new Paragraph({spacing:{before:0,after:0},
          border:{bottom:{style:BorderStyle.SINGLE,size:3,color:_bc.bd,space:1}},
          children:[run(nStr(s.num),{bold:true,size:P9,color:_bc.tx}),
            run(' ('+s.symbol+')  ',{bold:true,size:P9,color:_symc}),
            run(chunks.map(c=>c.en||'').join(' / '),{size:P8,italic:true})]}));
        ch.push(new Paragraph({spacing:{before:0,after:0},indent:{left:200},
          children:[run(chunks.map(c=>c.ko||'').join(' / '),{size:P8,color:'444444'})]}));
      }else{
        ch.push(new Paragraph({spacing:{before:0,after:0},
          border:{bottom:{style:BorderStyle.SINGLE,size:3,color:_bc.bd,space:1}},
          children:[run(nStr(s.num),{bold:true,size:P9,color:_bc.tx}),
            run(' ('+s.symbol+')  ',{bold:true,size:P9,color:_symc}),
            run(s.text,{size:P8,italic:true,color:'333333'})]}));
      }
      if(ds){
        [{l:'구조',f:'structure'},{l:'해석',f:'translation'},{l:'포인트',f:'point'}].forEach(r=>{
          ch.push(new Paragraph({spacing:{before:0,after:0},indent:{left:200},children:[
            run('['+r.l+'] ',{bold:true,size:P8,color:'555555'}),
            (IS&&!SHOW_ANSWERS&&r.f==='translation')?run('______________________________',{size:P8}):run(ds[r.f]||'',{size:P8}),
          ]}));
        });
      }else if(IS&&!SHOW_ANSWERS){
        // 학생용 빈칸 모드: 해설 없는 문장도 해석 빈칸은 표시
        ch.push(new Paragraph({spacing:{before:0,after:0},indent:{left:200},children:[
          run('[해석] ',{bold:true,size:P8,color:'555555'}),
          run('______________________________',{size:P8}),
        ]}));
      }
    });
  }
  }
  return ch;
}

function buildDOCX(slot,mode,opts){
  const {Document,Packer}=docx;
  const IS=mode==='student';
  const {meta}=slot;
  if(!slot.analysis)return;
  const id=makePassageId(meta.source,meta.chapter,meta.number);
  const ch=buildDOCXChildren(slot,mode,opts);
  const doc=new Document({
    styles:{default:{document:{run:{font:'Malgun Gothic',size:18}}}},
    sections:[{properties:{page:{size:{width:11906,height:16838},margin:{top:700,right:700,bottom:700,left:700}}},children:ch}]
  });
  Packer.toBlob(doc).then(blob=>saveAs(blob,id+'_'+(opts?(opts.showAnswers?'교사용':'학생용'):(IS?'학생용':'교사용'))+'.docx'));
}


/* ── 통합 DOCX (전체 슬롯) ── */
function buildAllDOCX(slots,mode,opts){
  const {Document,Packer}=docx;
  const IS=mode==='student';
  const activeSlots=slots.filter(s=>s.analysis&&s.status==='saved');
  if(!activeSlots.length){alert('저장완료된 슬롯이 없습니다.');return;}
  const sections=activeSlots.map(slot=>{
    const ch=buildDOCXChildren(slot,mode,opts);
    return{properties:{page:{size:{width:11906,height:16838},margin:{top:700,right:700,bottom:700,left:700}}},children:ch};
  });
  const doc=new Document({styles:{default:{document:{run:{font:'Malgun Gothic',size:18}}}},sections});
  Packer.toBlob(doc).then(blob=>saveAs(blob,'전체_'+(opts?(opts.showAnswers?'교사용':'학생용'):(IS?'학생용':'교사용'))+'.docx'));
}

function buildAllHTML(slots,mode,opts){

    +htmlParts.map((h,i)=>{
      const body=h.replace(/<!DOCTYPE[^>]*>/i,'').replace(/<html[^>]*>/i,'').replace(/<\/html>/i,'')
        .replace(/<head[\s\S]*?<\/head>/i,'').replace(/<\/?body[^>]*>/gi,'');
      return'<div style="page-break-after:'+(i<htmlParts.length-1?'always':'auto')+';padding:20px 28px">'+body+'</div>';

    +'</body></html>';

/* ── HTML 출력 ── */
function buildHTML(slot,mode,opts){
  const IS=mode==='student';
  const O=IS?(opts||getStuOpts()):{passage:true,structure:true,keyTopics:true,sentences:true,hardOnly:false,showAnswers:true};
  const SHOW_ANSWERS=!IS||O.showAnswers;
  const {analysis,meta}=slot;
  if(!analysis)return'';
  const {sentences=[],flow={},grammar={}}=analysis;
  const {blocks=[],interBlockConnectors=[],keyword='',topicSummary='',structureType=''}=flow;
  const {difficultSentences=[]}=grammar;
  const sm=Object.fromEntries(sentences.map(s=>[s.num,s]));
  const conn=i=>interBlockConnectors[i]||'→';
  const id=makePassageId(meta.source,meta.chapter,meta.number);
  const esc=w=>w.replace(/[-.*+?^${}()|[\]\\]/g,'\\$&');
  const hlHTML=(text,words)=>{
    if(!words||!words.length)return text;
    const sorted=[...words].sort((a,b)=>b.length-a.length);
    const pat=new RegExp('('+sorted.map(esc).join('|')+')','gi');
    return text.replace(pat,m=>'<mark style="background:#FFD700;color:inherit;border-radius:2px;padding:0 2px;font-weight:700">'+m+'</mark>');
  };
  const passHTML=sentences.map(s=>{
    const sc=SM[s.symbol]||{};
    return'<span><span style="font-size:12px;font-weight:700;color:'+sc.tx+';margin-right:4px">'+nStr(s.num)+'</span>'+s.text+' </span>';
  }).join('');
  const blockCards=blocks.map((blk,bi)=>{
    const c=BC[blk.color]||BC.blue;
    const ss=(blk.sentenceNums||[]).map(n=>sm[n]).filter(Boolean);
    const hd=IS
      ?'<div style="border-bottom:2px solid '+c.bd+';height:22px;width:85%;margin-bottom:5px"></div>'
      :'<div style="font-size:1em;font-weight:700;color:'+c.tx+'">'+blk.name+'</div><div style="font-size:.72em;color:'+c.tx+';font-style:italic;font-weight:600;opacity:.85">'+blk.nameEn+'</div>';
    const rows=ss.map((sent,si)=>{
      const sc=SM[sent.symbol]||{};
      const arr=si>0?'<div style="font-size:9px;color:#ccc;margin:1px 0 1px 20px">↓</div>':'';
      return arr+'<div style="display:flex;align-items:flex-start;gap:6px;padding:5px 7px;border-radius:6px;background:'+sc.bg+';margin-bottom:3px"><span style="font-size:1em;font-weight:700;color:'+sc.tx+';flex-shrink:0;margin-top:1px">'+nStr(sent.num)+'</span><div style="flex:1;min-width:0"><span style="font-size:.7em;font-weight:700;padding:1px 4px;border-radius:3px;background:rgba(255,255,255,.6);color:'+sc.tx+';border:1px solid '+sc.bd+'">'+sent.symbol+'</span><div style="font-size:.75em;color:#444;word-break:keep-all;line-height:1.4;margin-top:2px">'+sent.role+'</div></div></div>';
    }).join('');
    const connDiv=bi<blocks.length-1?'<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex-shrink:0;padding-top:50px;min-width:32px"><div style="font-size:1.2em;font-weight:700;color:#666">'+conn(bi)+'</div><div style="font-size:.6em;color:#bbb;text-align:center">'+(SM[conn(bi)]&&SM[conn(bi)].lbl||'')+'</div></div>':'';
    return'<div style="flex:1 1 130px;min-width:0;border-radius:10px;border:2px solid '+c.bd+'"><div style="padding:8px 11px;background:'+c.hd+';border-bottom:1.5px solid '+c.bd+';border-radius:8px 8px 0 0">'+hd+'</div><div style="padding:7px;background:#fff">'+rows+'</div></div>'+connDiv;
  }).join('');
  // hardOnly: 어려운 문장만 / hardOnly=false: 전체 문장
  const dsToShow=O.hardOnly?sentences.filter(s=>difficultSentences.find(d=>d.num===s.num)):sentences;
  const analysisHTML=dsToShow.map(s=>{
    const sc=SM[s.symbol]||{};
    const bc=sentBlockColor(blocks,s.num);
    const ds=difficultSentences.find(d=>d.num===s.num);
    const chunks=s.chunks||[];

function dlHTML(slot,mode,opts){
  const html=buildHTML(slot,mode,opts);

  const blob=new Blob([html],{type:'text/html;charset=utf-8'});

  a.href=url;a.download=id+'_'+(mode==='teacher'?'교사용':'학생용')+'.html';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);

Rules: topic.candidates[0]=correct.
blank rules (CSAT-style):
- Select THESIS sentence as blank location (글의 핵심 주장 문장)
- keyword = exact substring from that sentence that PARAPHRASES the main idea (not copies it verbatim from elsewhere)
- Prefer sentences with negation/contrast structures (cannot, not A but B) — these are CSAT favorites
- distractors must be PLAUSIBLE TRAPS using vocab/concepts from the passage but wrong in meaning
- distractors should NOT be obvious synonyms of the answer (would create ambiguity)
- One distractor should be the OPPOSITE/REVERSE of correct (most reliable trap)
- One distractor should be PARTIALLY correct (only covers part of the meaning)

- Each block should START with a sentence containing a discourse cue:

  * Connectives: However/Therefore/Moreover/For example/In contrast (logical signal)
  * Pronouns: it/they/he/she referring to entity in prior block
- The CORRECT order should have UNAMBIGUOUS cues — each block's opening cue must logically link only to ONE specific prior block

TEXT:\n`+t;

function splitTexts(text){
  // 1. --- 구분선
  if(text.indexOf('\n---')>=0)return text.split(/\n---+\n?/).map(t=>t.trim()).filter(Boolean);
  // 2. 문번호 패턴: 줄 시작 숫자(18~50) + 다음/밑줄/주어진/글/빈칸 등
  const byNum=text.split(/(?=\n\s*(?:[1-9]\d)\s+(?:다음|밑줄|주어진|글의|빈칸|흐름|문맥|어법|어휘|아래))/).map(t=>t.trim()).filter(Boolean);
  if(byNum.length>1)return byNum.filter(p=>/[A-Za-z]{15,}/.test(p));
  // 3. 빈 줄 2개 이상으로 분리
  const byBlank=text.split(/\n{3,}/).map(t=>t.trim()).filter(Boolean);
  if(byBlank.length>1)return byBlank.filter(p=>/[A-Za-z]{15,}/.test(p));
  // 4. 단일 지문
  return[text.trim()].filter(Boolean);
}

          {sentItems.map((it,k)=>{
            const c2=it.correct?'#185FA5':'#E24B4A';
            const num2=numMap.get(it);
            return<span key={k} style={{display:'inline-flex',alignItems:'center',marginRight:4,padding:'0 6px',borderRadius:12,background:c2+'18',border:`1px solid ${c2}44`,color:c2,fontWeight:700,fontSize:11,cursor:'pointer'}}
              onClick={()=>{upPDeep(p=>{const ss=[...(isG?p.grammar_sets:p.vocab_sets)||[]];const si2=isG?p.grammar_sel:p.vocab_sel;if(!ss[si2])return p;ss[si2]={...ss[si2],items:ss[si2].items.filter(x=>!(Number(x.sent)===i&&x.word===it.word))};return isG?{...p,grammar_sets:ss}:{...p,vocab_sets:ss};});}}>
              {num2?`${num2}. `:''}{it.word} ✕
            </span>;
          })}
          <span style={{color:'#aaa',fontStyle:'italic'}}>{s}</span>
        </span>;
      }
      positioned.forEach(({it,idx,displayWord,searchLen})=>{
        if(idx<offset)return; // 이미 처리된 영역 건너뜀
        if(idx>offset)parts.push(<span key={offset}
          onClick={()=>{
            upPDeep(p=>{
              const ss=[...(isG?p.grammar_sets:p.vocab_sets)||[]];
              const si=isG?p.grammar_sel:p.vocab_sel;
              if(!ss[si])return p;
              // 클릭한 위치의 단어를 새 항목으로 추가 (빈 영역 클릭 시)
              return p;
            });
          }}
          style={{cursor:'default'}}>{s.slice(offset,idx)}</span>);
        const c=it.correct?'#185FA5':'#E24B4A';
        const num=numMap.get(it);
        const itemList=(isG?p.grammar_sets:p.vocab_sets)?.[isG?p.grammar_sel:p.vocab_sel]?.items||[];
        const myIdx=itemList.findIndex(x=>Number(x.sent)===i&&x.word===it.word);
        const isSelected=selectedGrammarIdx===myIdx;
        parts.push(<span key={idx}
          onClick={(e)=>{
            e.stopPropagation();
            // shift+클릭: 항목 삭제, 일반 클릭: 항목 선택
            if(e.shiftKey){
              upPDeep(p=>{
                const ss=[...(isG?p.grammar_sets:p.vocab_sets)||[]];
                const si=isG?p.grammar_sel:p.vocab_sel;
                if(!ss[si])return p;
                ss[si]={...ss[si],items:ss[si].items.filter(x=>!(Number(x.sent)===i&&x.word===it.word))};
                return isG?{...p,grammar_sets:ss}:{...p,vocab_sets:ss};
              });
            } else {
              setSelectedGrammarIdx(myIdx);
            }
          }}
          title="클릭: 선택 / Shift+클릭: 삭제"
          style={{background:c+'22',borderBottom:'2px solid '+c,fontWeight:700,padding:'0 2px',color:c,borderRadius:2,cursor:'pointer',outline:isSelected?'2px solid #F59E0B':'none'}}>
          {num?`${num}. `:''}{displayWord}
        </span>);
        offset=idx+searchLen;
      });
      if(offset<s.length)parts.push(<span key={offset} style={{cursor:'default'}}>{s.slice(offset)}</span>);
      return<span style={{fontSize:12,lineHeight:1.8}}>{parts}</span>;
    }
    return<span style={{fontSize:12,lineHeight:1.6,color:'#555'}}>{s}</span>;
  };

  const LeftPanel=({p})=>{
    const irrelPos=at===5?p.irrel_insert_pos:-1;
    const insPos=at===6?p.insert_answer:-1;
    const rows=[];
    for(let i=0;i<=p.sentences.length;i++){
      if(at===5){
        const isP=irrelPos===i;
        const confirmed=p.irrel_confirmed&&p.irrelevant_sentence_index===i;
        if(!p.irrel_confirmed){
          rows.push(<div key={'ip'+i} onClick={()=>upP({irrel_insert_pos:i})} style={{cursor:'pointer',display:'flex',alignItems:'center',gap:4,margin:'2px 0',padding:'2px 6px',borderRadius:4,background:isP?'#0F6E5614':'transparent',border:'1px dashed '+(isP?'#0F6E56':'transparent')}}>
            <span style={{fontSize:10,color:isP?'#0F6E56':'#ccc',fontWeight:700}}>▶ {isP?'여기에 삽입':'클릭'}</span></div>);
          if(isP)rows.push(<div key={'iprev'+i} style={{margin:'2px 0 4px 24px',padding:'6px 9px',borderLeft:'3px solid #0F6E56',borderRadius:4,background:'#0F6E5610',fontSize:12,color:'#0F6E56',fontStyle:'italic'}}>{p.irrel_candidates?.[p.irrel_sel]}</div>);
        } else if(confirmed){
          rows.push(<div key={'iprev'+i} style={{margin:'2px 0 4px 0',padding:'6px 9px',borderLeft:'3px solid #0F6E56',borderRadius:4,background:'#0F6E5610',fontSize:12,color:'#0F6E56',fontStyle:'italic'}}>
            ✓ [{i}] {p.irrel_candidates?.[p.irrel_sel]}</div>);
        }
      }

      if(i===p.sentences.length)break;
      const s=p.sentences[i];
      let bg='transparent',bl='3px solid transparent';
      const bc_=p.blank_candidates?.[p.blank_sel];
      if(at===1&&bc_?.sentence_index===i){bg='#993C1D08';bl='3px solid #993C1D';}
      else if(at===1){p.blank_candidates?.forEach((c,ci)=>{if(ci!==p.blank_sel&&c.sentence_index===i){bg='#854F0B06';bl='3px solid #854F0B33';}});}
      else if(at===2){const bl2=getBlockLabel(p,i);if(bl2){const bc2=BLK_C[bl2];bg=bc2+'12';bl='3px solid '+bc2;}}
      else if(at===4&&i===p.implication_sentence_index){bg='#99355610';bl='3px solid #993556';}
      else if(at===6&&p.insert_answer===i){bg='#534AB714';bl='3px solid #534AB7';}
      else if((at===7||at===8)){const sets=at===7?p.grammar_sets:p.vocab_sets;const sel=at===7?(p.grammar_sel||0):(p.vocab_sel||0);const item=sets?.[sel]?.items?.find(it=>Number(it.sent)===i);if(item){const c=item.correct?'#185FA5':'#E24B4A';bg=c+'08';bl='3px solid '+c;}}
      const stxt=typeof s==='string'?s:(s?.text||'');
      const isInsertSel=at===6&&p.insert_answer===i;
      rows.push(<div key={i}
        onClick={at===6?()=>upP({insert_sentence:stxt,insert_answer:i}):undefined}
        style={{display:'flex',gap:6,marginBottom:5,padding:'5px 8px',borderRadius:6,background:bg,borderLeft:bl,
          cursor:at===6?'pointer':'default',
          opacity:at===6&&p.insert_answer!=null&&!isInsertSel?0.5:1}}>
        <span style={{color:'#bbb',fontFamily:'monospace',fontSize:11,flexShrink:0,marginTop:2,minWidth:20}}>[{i}]</span>
        {at===2&&getBlockLabel(p,i)&&<span style={{fontSize:11,fontWeight:700,color:BLK_C[getBlockLabel(p,i)],marginRight:2,flexShrink:0,marginTop:2}}>({getBlockLabel(p,i)})</span>}
        {isInsertSel
          ?<span style={{fontSize:12,lineHeight:1.8,color:'#534AB7',fontWeight:600,textDecoration:'line-through',textDecorationColor:'#534AB7'}}>{stxt}</span>
          :renderSent(p,stxt,i)}
      </div>);
    }
    return<div style={{overflowY:'auto',maxHeight:500}}><div style={{fontSize:11,fontWeight:600,color:'#888',marginBottom:8}}>{at===5?'▶ 클릭으로 삽입 위치 선택':at===6?'문장을 클릭하면 삽입 문장으로 선택됩니다':'전체 지문'}</div>{rows}</div>;
  };

  const RightPanel=({p})=>{
    const T=AUTHOR_TABS[at];
    const optBtn=(sel,isRec,n,txt,onclick)=><button onClick={onclick} style={{display:'block',width:'100%',textAlign:'left',marginBottom:5,padding:'9px 11px',borderRadius:8,background:sel?T.c+'18':'transparent',border:`0.5px solid ${sel?T.c:'#e5e5e5'}`,color:sel?T.c:'#1d1d1f',cursor:'pointer',fontSize:13,lineHeight:1.45}}>
      {sel&&bdg('✓ 정답',T.c)}{isRec&&!sel&&bdg('AI 추천','#854F0B')}
      <span style={{fontSize:11,color:'#bbb',marginRight:4}}>({n})</span>{txt}</button>;

    if(at===0)return<div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
        <div style={{fontSize:11,fontWeight:600,color:'#888'}}>선지 편집 &amp; 정답 선택</div>

      </div>
      {(p.topic_options||[]).map((o,i)=>{const isSel=p.topic_answer===i+1;return<div key={i} style={{display:'flex',gap:6,alignItems:'center',marginBottom:6}}>
        <button onClick={()=>upP({topic_answer:i+1})} style={{minWidth:28,height:28,borderRadius:14,border:`1px solid ${isSel?'#185FA5':'#ddd'}`,background:isSel?'#185FA5':'transparent',color:isSel?'#fff':'#999',fontSize:12,cursor:'pointer',fontWeight:700}}>{i+1}</button>
        <input value={o} onChange={e=>{const opts=[...p.topic_options];opts[i]=e.target.value;upP({topic_options:opts});}}
          style={{flex:1,fontSize:13,padding:'6px 9px',borderRadius:7,border:`1px solid ${isSel?'#185FA5':'#e5e5e5'}`,fontWeight:isSel?600:400,color:isSel?'#185FA5':'#1d1d1f'}}/>
        {isSel&&<span style={{fontSize:11,color:'#185FA5',whiteSpace:'nowrap'}}>✓ 정답</span>}
      </div>;})}
    </div>;

    if(at===1)return<div>
      <div style={{fontSize:11,fontWeight:600,color:'#888',marginBottom:8}}>① 빈칸 후보 선택</div>
      {p.blank_candidates?.map((c,ci)=><button key={ci} onClick={()=>upPDeep(p=>{const upd={...p,blank_sel:ci,blank_sentence_index:c.sentence_index,blank_target:c.keyword,blank_options:[c.keyword,...c.distractors]};return upd;})} style={{display:'block',width:'100%',textAlign:'left',marginBottom:7,background:p.blank_sel===ci?'#993C1D10':'transparent',border:`1px solid ${p.blank_sel===ci?'#993C1D':'#e5e5e5'}`,borderRadius:9,padding:'10px 12px',cursor:'pointer'}}>
        {p.blank_sel===ci&&bdg('✓','#993C1D')}{ci===0&&bdg('AI 추천','#854F0B')}
        <div style={{fontSize:11,color:'#bbb',marginBottom:2}}>문장 [{c.sentence_index}]</div>
        <div style={{fontSize:13,fontWeight:p.blank_sel===ci?600:400,color:p.blank_sel===ci?'#993C1D':'#1d1d1f'}}>"{c.keyword}"</div>
      </button>)}
      <hr style={{border:'none',borderTop:'0.5px solid #eee',margin:'10px 0'}}/>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
        <div style={{fontSize:11,fontWeight:600,color:'#888'}}>② 오답 선택지</div>

      </div>
      <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:8}}>
        <span style={{fontSize:12,color:'#993C1D',fontWeight:600,whiteSpace:'nowrap'}}>정답:</span>
        <input value={p.blank_target||''} onChange={e=>{const opts=[...(p.blank_options||[])];opts[0]=e.target.value;upP({blank_target:e.target.value,blank_options:opts});}}
          style={{flex:1,fontSize:13,fontWeight:700,padding:'5px 9px',borderRadius:6,border:'1px solid #993C1D',color:'#993C1D'}}/>
      </div>
      {[0,1,2,3].map(i=><div key={i} style={{display:'flex',alignItems:'center',gap:5,marginBottom:5}}>
        <span style={{fontSize:11,color:'#bbb',minWidth:32}}>오답{i+1}</span>
        <input value={p.blank_options?.[i+1]||''} onChange={e=>{const opts=[...(p.blank_options||[])];opts[i+1]=e.target.value;upP({blank_options:opts});}} style={{flex:1,fontSize:12,padding:'5px 8px',border:'0.5px solid #e5e5e5',borderRadius:6}}/>
      </div>)}
    </div>;

    if(at===2){
      if(!p.order_blocks?.length){
        const sentCount=p.sentences?.length||0;
        const canGen=sentCount>=5;
        return<div style={{padding:'20px 16px',textAlign:'center'}}>
          <div style={{color:'#E24B4A',fontSize:13,marginBottom:12}}>⚠ 순서배열 데이터 없음</div>
          {canGen?(
            <button onClick={()=>genOrderBlocks(p)} disabled={genLoading==='order'}
              style={{padding:'9px 22px',fontSize:13,fontWeight:600,
                background:genLoading==='order'?'#888':'#534AB7',color:'#fff',
                border:'none',borderRadius:7,cursor:genLoading==='order'?'wait':'pointer'}}>
              {genLoading==='order'?'생성 중...':'🔄 순서 AI 생성'}
            </button>
          ):(
            <div style={{color:'#888',fontSize:12}}>문장 수 부족 (현재 {sentCount}, 최소 5필요)</div>
          )}
        </div>;
      }
      return<div>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
          <span style={{fontSize:11,fontWeight:600,color:'#888',flex:1}}>블록 구성 확인</span>

        </div>
        {[{label:'A',sentence_indices:[p.order_given_index]},...p.order_blocks].map(b=>{
          const c=BLK_C[b.label]||'#888';
          return<div key={b.label} style={{marginBottom:8,border:`1px solid ${c}44`,borderRadius:9,overflow:'hidden'}}>
            <div style={{background:c+'22',padding:'5px 11px',fontSize:11,fontWeight:700,color:c}}>({b.label}) 문장[{b.sentence_indices.join(', ')}]</div>
            <div style={{padding:'8px 11px',fontSize:12,color:'#555',lineHeight:1.5}}>
              {b.sentence_indices.map((idx,n)=>{const ss=p.sentences[idx];const st=typeof ss==='string'?ss:(ss?.text||'');return<div key={idx}>{n>0&&<div style={{borderTop:'0.5px solid #f0f0f0',margin:'3px 0'}}/>}<span style={{color:'#bbb',fontSize:10,marginRight:4}}>[{idx}]</span>{st}</div>})}
            </div>
          </div>;
        })}
        <hr style={{border:'none',borderTop:'0.5px solid #eee',margin:'10px 0'}}/>
        {p.order_options.map((o,i)=>optBtn(p.order_answer===i+1,i===0,i+1,o,()=>upP({order_answer:i+1})))}
      </div>;
    }

    if(at===3)return<div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
        <div style={{fontSize:11,fontWeight:600,color:'#888'}}>① 요약문 템플릿 선택</div>

      </div>
      {(!p.summary_candidates||p.summary_candidates.length===0)&&genLoading!=='summary'&&
        <div style={{padding:'10px 12px',background:'#FFF8E6',border:'0.5px solid #F0C040',borderRadius:7,fontSize:12,color:'#856404',marginBottom:8}}>
          후보가 없습니다. ↻ 버튼으로 AI 생성하세요.
        </div>}
      {p.summary_candidates?.map((c,ci)=>{
        const tpl=c.template.replace('________(A)________',`<span style="background:#854F0B22;color:#854F0B;fontWeight:700;padding:0 3px">(A):${c.A_correct}</span>`).replace('________(B)________',`<span style="background:#185FA522;color:#185FA5;fontWeight:700;padding:0 3px">(B):${c.B_correct}</span>`);
        const sel=p.summary_sel===ci;
        return<button key={ci} onClick={()=>upPDeep(p=>({...p,summary_sel:ci,summary_template:c.template,summary_A_options:[c.A_correct,...c.A_distractors],summary_B_options:[c.B_correct,...c.B_distractors],summary_A_answer:1,summary_B_answer:1}))} style={{display:'block',width:'100%',textAlign:'left',marginBottom:8,background:sel?'#f5f5f7':'transparent',border:`1px solid ${sel?'#185FA5':'#e5e5e5'}`,borderRadius:9,padding:'10px 12px',cursor:'pointer'}}>
          {sel&&bdg('✓','#185FA5')}{ci===0&&bdg('AI 추천','#854F0B')}
          <div style={{fontSize:12,lineHeight:1.7,marginTop:4}} dangerouslySetInnerHTML={{__html:tpl}}/>
        </button>;
      })}
      <hr style={{border:'none',borderTop:'0.5px solid #eee',margin:'10px 0'}}/>
      {[{key:'A',c:'#854F0B',opts:'summary_A_options',ans:'summary_A_answer'},{key:'B',c:'#185FA5',opts:'summary_B_options',ans:'summary_B_answer'}].map(({key,c,opts,ans})=>
        <div key={key} style={{padding:10,background:c+'08',border:`0.5px solid ${c}44`,borderRadius:8,marginBottom:8}}>
          <div style={{fontSize:11,fontWeight:700,color:c,marginBottom:5}}>빈칸 ({key})</div>
          <GrammarItemInput value={p[opts]?.[0]||''} onSave={v=>{const o=[...(p[opts]||[])];o[0]=v;upP({[opts]:o});}} style={{width:'100%',fontSize:13,fontWeight:600,padding:'5px 8px',border:'0.5px solid #e5e5e5',borderRadius:6,marginBottom:5}}/>
          {[0,1,2,3].map(i=><GrammarItemInput key={i} value={p[opts]?.[i+1]||''} onSave={v=>{const o=[...(p[opts]||[])];o[i+1]=v;upP({[opts]:o});}} placeholder={`오답${i+1}`} style={{width:'100%',fontSize:12,padding:'4px 8px',border:'0.5px solid #e5e5e5',borderRadius:6,marginBottom:4}}/>)}
        </div>
      )}
      <LocalTextarea value={p.summary_template||''} onSave={v=>upP({summary_template:v})} rows={3} style={{width:'100%',fontSize:12,padding:'7px 9px',border:'0.5px solid #e5e5e5',borderRadius:7,resize:'vertical',marginBottom:6}}/>
    </div>;

    if(at===4)return<div>
      <div style={{marginBottom:10}}>
        <div style={{fontSize:11,fontWeight:600,color:'#888',marginBottom:4}}>밑줄 표현 (지문에서 드래그로 변경)</div>
        <div style={{padding:'7px 10px',background:'#99355610',borderRadius:7,fontSize:13,color:'#993556',fontWeight:600}}>
          {p.implication_keyword||'미선택'} <span style={{fontSize:11,color:'#bbb',fontWeight:400}}>문장[{p.implication_sentence_index}]</span>
        </div>
      </div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
        <div style={{fontSize:11,fontWeight:600,color:'#888'}}>선지 편집 &amp; 정답 선택</div>

      </div>
      {(()=>{const opts=[...(p.implication_options||[])];while(opts.length<5)opts.push('');return opts;})().map((o,i)=>{const isSel=p.implication_answer===i+1;return<div key={i} style={{display:'flex',gap:6,alignItems:'center',marginBottom:6}}>
        <button onClick={()=>upP({implication_answer:i+1})} style={{minWidth:28,height:28,borderRadius:14,border:`1px solid ${isSel?'#993556':'#ddd'}`,background:isSel?'#993556':'transparent',color:isSel?'#fff':'#999',fontSize:12,cursor:'pointer',fontWeight:700}}>{i+1}</button>
        <input value={o} onChange={e=>{const opts=[...(p.implication_options||[])];while(opts.length<5)opts.push('');opts[i]=e.target.value;upP({implication_options:opts});}}
          style={{flex:1,fontSize:13,padding:'6px 9px',borderRadius:7,border:`1px solid ${isSel?'#993556':'#e5e5e5'}`,fontWeight:isSel?600:400,color:isSel?'#993556':'#1d1d1f'}}/>
        {isSel&&<span style={{fontSize:11,color:'#993556',whiteSpace:'nowrap'}}>✓ 정답</span>}
      </div>;})}
    </div>;

    if(at===5)return<div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
        <div style={{fontSize:11,fontWeight:600,color:'#888'}}>① 무관 문장 선택</div>

      </div>
      {(!p.irrel_candidates||p.irrel_candidates.length===0)&&genLoading!=='irrel'&&
        <div style={{padding:'10px 12px',background:'#F0FFF8',border:'0.5px solid #0F6E5640',borderRadius:7,fontSize:12,color:'#0F6E56',marginBottom:8}}>
          후보가 없습니다. ↻ 버튼으로 AI 생성하세요.
        </div>}
      {p.irrel_candidates?.map((s,ci)=><button key={ci} onClick={()=>upP({irrel_sel:ci})} style={{display:'block',width:'100%',textAlign:'left',marginBottom:7,background:p.irrel_sel===ci?'#0F6E5610':'transparent',border:`1px solid ${p.irrel_sel===ci?'#0F6E56':'#e5e5e5'}`,borderRadius:9,padding:'10px 12px',cursor:'pointer'}}>
        {p.irrel_sel===ci&&bdg('✓','#0F6E56')}{ci===0&&bdg('AI 추천','#854F0B')}
        <div style={{fontSize:12,lineHeight:1.6,marginTop:4}}>{s}</div>
      </button>)}
      <hr style={{border:'none',borderTop:'0.5px solid #eee',margin:'10px 0'}}/>
      <div style={{fontSize:11,fontWeight:600,color:'#888',marginBottom:6}}>② 직접 수정</div>
      <LocalTextarea value={p.irrel_candidates?.[p.irrel_sel]||''} onSave={v=>{const c=[...(p.irrel_candidates||[])];c[p.irrel_sel]=v;upP({irrel_candidates:c});}} rows={3} style={{width:'100%',fontSize:12,padding:'7px',border:'0.5px solid #e5e5e5',borderRadius:7,resize:'vertical',marginBottom:6}}/>

    </div>;

    if(at===6)return<div>
      {/* 현재 선택된 문장 */}
      <div style={{marginBottom:12,padding:'10px 12px',background:'#534AB708',border:'1px solid #534AB733',borderRadius:8}}>
        <div style={{fontSize:11,fontWeight:600,color:'#534AB7',marginBottom:5}}>선택된 삽입 문장</div>
        {p.insert_sentence
          ?<div style={{fontSize:12,color:'#534AB7',fontWeight:600,lineHeight:1.6}}>{p.insert_sentence}</div>
          :<div style={{fontSize:12,color:'#bbb'}}>왼쪽 본문에서 문장을 클릭하세요</div>}
      </div>
      {/* 직접 수정 */}
      <div style={{fontSize:11,fontWeight:600,color:'#888',marginBottom:5}}>직접 수정</div>
      <LocalTextarea value={p.insert_sentence||''} onSave={v=>upP({insert_sentence:v})} rows={3}
        style={{width:'100%',fontSize:12,padding:'7px',border:'1px solid #534AB733',borderRadius:7,resize:'vertical',marginBottom:10}}/>
    </div>;

    if(at===7||at===8){
      const isG=at===7;
      const sets=isG?p.grammar_sets:p.vocab_sets;
      const sel=isG?(p.grammar_sel||0):(p.vocab_sel||0);
      const ans=isG?(p.grammar_answer||1):(p.vocab_answer||1);
      const selKey=isG?'grammar_sel':'vocab_sel';
      const ansKey=isG?'grammar_answer':'vocab_answer';
      const c='#E24B4A';
      return<div>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
          <div style={{fontSize:11,fontWeight:600,color:'#888'}}>① 세트 선택</div>

        </div>
        {(!sets||sets.length===0)&&genLoading!==(isG?'grammar':'vocab')&&
          <div style={{padding:'10px 12px',background:'#F5F5F7',border:'0.5px solid #ddd',borderRadius:7,fontSize:12,color:'#888',marginBottom:8}}>
            세트가 없습니다. ↻ 버튼으로 AI 생성하세요.
          </div>}
        {sets?.map((set,si)=><button key={si} onClick={()=>upP({[selKey]:si,[ansKey]:set.answer})} style={{display:'block',width:'100%',textAlign:'left',marginBottom:8,background:sel===si?'#f5f5f7':'transparent',border:`1px solid ${sel===si?'#185FA5':'#e5e5e5'}`,borderRadius:9,padding:'10px 12px',cursor:'pointer'}}>
          {sel===si&&bdg('✓','#185FA5')}{si===0&&bdg('AI 추천','#854F0B')}
          <div style={{marginTop:6,display:'flex',flexWrap:'wrap',gap:4}}>
            {set.items.map((item,ii)=>{const ic=item.correct?'#185FA5':'#E24B4A';return<span key={ii} style={{fontSize:11,padding:'2px 7px',borderRadius:5,background:ic+'18',color:ic,border:`0.5px solid ${ic}44`}}>{ii+1}. {isG?item.word:`${item.word}/${item.alt}`}</span>;})}
          </div>
        </button>)}
        <hr style={{border:'none',borderTop:'0.5px solid #eee',margin:'10px 0'}}/>
        <div style={{fontSize:11,fontWeight:600,color:'#888',marginBottom:8}}>② 항목 편집 &amp; 정답 선택</div>
        {(()=>{
          const items=sets?.[sel]?.items||[];
          const sorted=[...items].sort((a,b)=>a.sent-b.sent);
          const numMap=new Map(sorted.map((it,idx)=>[it,idx+1]));
          return items.map((item,ii)=>{
          const isSel=ans===ii+1;
          const dispNum=numMap.get(item)||ii+1;
          const isBodySel=selectedGrammarIdx===ii;
          return<div key={ii} onClick={()=>setSelectedGrammarIdx(ii)} style={{marginBottom:8,border:`1px solid ${isBodySel?'#F59E0B':isSel?'#E24B4A':'#e5e5e5'}`,borderRadius:8,padding:'9px 11px',background:isBodySel?'#FFFBF0':isSel?'#E24B4A08':'#fff',cursor:'pointer'}}>
            <div style={{display:'flex',gap:6,alignItems:'center',marginBottom:6}}>
              <span style={{fontSize:11,color:isBodySel?'#F59E0B':'#bbb',minWidth:22,fontWeight:isBodySel?700:400}}>{ii+1}{isBodySel?'✎':''}</span>
              <GrammarItemInput value={item.word}
                onSave={v=>{upPDeep(p=>{const sets=[...(isG?p.grammar_sets:p.vocab_sets)];const items=[...sets[isG?p.grammar_sel:p.vocab_sel].items];items[ii]={...items[ii],word:v,original:items[ii].original||items[ii].word};sets[isG?p.grammar_sel:p.vocab_sel]={...sets[isG?p.grammar_sel:p.vocab_sel],items};return isG?{...p,grammar_sets:sets}:{...p,vocab_sets:sets};});}}
                style={{flex:1,border:`1px solid ${isBodySel?'#F59E0B':'#ddd'}`,borderRadius:6,padding:'4px 8px',fontSize:13,fontWeight:700,background:isBodySel?'#FFFBF0':'#fff'}}/>
              <button onClick={()=>{upPDeep(p=>{const sets=[...(isG?p.grammar_sets:p.vocab_sets)];const items=[...sets[isG?p.grammar_sel:p.vocab_sel].items];items[ii]={...items[ii],correct:!items[ii].correct};sets[isG?p.grammar_sel:p.vocab_sel]={...sets[isG?p.grammar_sel:p.vocab_sel],items};return isG?{...p,grammar_sets:sets}:{...p,vocab_sets:sets};});}}
                style={{padding:'4px 8px',fontSize:11,borderRadius:6,border:`1px solid ${item.correct?'#185FA5':'#E24B4A'}`,background:item.correct?'#185FA518':'#E24B4A18',color:item.correct?'#185FA5':'#E24B4A',cursor:'pointer',whiteSpace:'nowrap'}}>
                {item.correct?'✓ 올바름':'✗ 오류'}
              </button>
              <button onClick={()=>upP({[ansKey]:ii+1})} style={{padding:'4px 10px',fontSize:11,borderRadius:6,border:`1px solid ${isSel?'#E24B4A':'#ddd'}`,background:isSel?'#E24B4A':'transparent',color:isSel?'#fff':'#666',cursor:'pointer',whiteSpace:'nowrap'}}>
                {isSel?'✓ 정답':'정답 지정'}
              </button>
              <button onClick={()=>{upPDeep(p=>{const sets=[...(isG?p.grammar_sets:p.vocab_sets)];const items=sets[isG?p.grammar_sel:p.vocab_sel].items.filter((_,i)=>i!==ii);sets[isG?p.grammar_sel:p.vocab_sel]={...sets[isG?p.grammar_sel:p.vocab_sel],items};return isG?{...p,grammar_sets:sets,grammar_answer:1}:{...p,vocab_sets:sets,vocab_answer:1};});}}
                style={{padding:'4px 8px',fontSize:11,borderRadius:6,border:'1px solid #fcc',background:'#fff5f5',color:'#E24B4A',cursor:'pointer'}}>삭제</button>
            </div>
            {isG&&item.pos==null&&<GrammarItemInput value={item.original||''}
              onSave={v=>{upPDeep(p=>{const sets=[...(isG?p.grammar_sets:p.vocab_sets)];const items=[...sets[p.grammar_sel].items];items[ii]={...items[ii],original:v};sets[p.grammar_sel]={...sets[p.grammar_sel],items};return{...p,grammar_sets:sets};});}}
              placeholder='본문 원문 (위치 탐색용)' style={{width:'100%',border:'1px solid #185FA533',borderRadius:6,padding:'4px 8px',fontSize:11,color:'#185FA5',boxSizing:'border-box',marginBottom:4}}/>}
            {isG&&(()=>{const itemKey=`g_${sel}_${ii}_${item.word}`;const cand=grammarAltCandidates[itemKey];return(<div style={{marginTop:4}}>
              {cand?.loading&&<span style={{fontSize:10,color:'#bbb'}}>오류형 후보 생성 중...</span>}
              {!cand?.loading&&!cand?.words?.length&&item.word&&<button onClick={()=>genGrammarAltCandidates(item.word,itemKey)} style={{fontSize:10,padding:'2px 8px',border:'1px solid #ddd',borderRadius:5,background:'#f9f9f9',color:'#888',cursor:'pointer'}}>오류형 후보 ↻</button>}
              {cand?.words?.length>0&&<div style={{display:'flex',flexWrap:'wrap',gap:4,alignItems:'center'}}>
                <button onClick={()=>genGrammarAltCandidates(item.word,itemKey)} style={{fontSize:10,padding:'2px 6px',border:'1px solid #ddd',borderRadius:5,background:'#f9f9f9',color:'#aaa',cursor:'pointer'}}>↻</button>
                {cand.words.map((c,ci)=><button key={ci} onClick={()=>{upPDeep(p=>{const sets=[...p.grammar_sets];const items=[...sets[p.grammar_sel].items];items[ii]={...items[ii],word:c.w};sets[p.grammar_sel]={...sets[p.grammar_sel],items};return{...p,grammar_sets:sets};});}} style={{fontSize:11,padding:'2px 8px',borderRadius:5,border:'1px solid #E24B4A44',background:'#E24B4A08',color:'#E24B4A',cursor:'pointer'}}>{c.w}</button>)}
              </div>}
            </div>);})()} 
            <GrammarItemInput value={isG?item.note:(item.alt||'')}
              onSave={v=>{upPDeep(p=>{const sets=[...(isG?p.grammar_sets:p.vocab_sets)];const items=[...sets[isG?p.grammar_sel:p.vocab_sel].items];items[ii]=isG?{...items[ii],note:v}:{...items[ii],alt:v};sets[isG?p.grammar_sel:p.vocab_sel]={...sets[isG?p.grammar_sel:p.vocab_sel],items};return isG?{...p,grammar_sets:sets}:{...p,vocab_sets:sets};});}}
              multiline={isG}
              placeholder={isG?'어법 설명':'대체 표현'} style={{width:'100%',border:'1px solid #eee',borderRadius:6,padding:'4px 8px',fontSize:11,color:'#888',boxSizing:'border-box',lineHeight:1.5}}/>
            {!isG&&(()=>{const itemKey=`${sel}_${ii}_${item.word}`;const cand=vocabAltCandidates[itemKey];return(<div style={{marginTop:4}}>
              {cand?.loading&&<span style={{fontSize:10,color:'#bbb'}}>후보 생성 중...</span>}
              {!cand?.loading&&!cand?.words?.length&&item.word&&<button onClick={()=>genVocabAltCandidates(item.word,itemKey)} style={{fontSize:10,padding:'2px 8px',border:'1px solid #ddd',borderRadius:5,background:'#f9f9f9',color:'#888',cursor:'pointer'}}>반의어/유의어 ↻</button>}
              {cand?.words?.length>0&&<div style={{display:'flex',flexWrap:'wrap',gap:4,alignItems:'center'}}>
                <button onClick={()=>genVocabAltCandidates(item.word,itemKey)} style={{fontSize:10,padding:'2px 6px',border:'1px solid #ddd',borderRadius:5,background:'#f9f9f9',color:'#aaa',cursor:'pointer'}}>↻</button>
                {cand.words.map((c,ci)=><button key={ci} onClick={()=>{upPDeep(p=>{const sets=[...p.vocab_sets];const items=[...sets[p.vocab_sel].items];items[ii]={...items[ii],alt:c.w};sets[p.vocab_sel]={...sets[p.vocab_sel],items};return{...p,vocab_sets:sets};});}} style={{fontSize:11,padding:'2px 8px',borderRadius:5,border:`1px solid ${c.type==='반의'?'#E24B4A44':'#185FA544'}`,background:c.type==='반의'?'#E24B4A08':'#185FA508',color:c.type==='반의'?'#E24B4A':'#185FA5',cursor:'pointer'}}>{c.type} {c.w}</button>)}
              </div>}
            </div>);})()} 
          </div>;
        });})()}
        <button onClick={()=>{upPDeep(p=>{const sets=[...(isG?p.grammar_sets:p.vocab_sets)];const items=[...sets[isG?p.grammar_sel:p.vocab_sel].items,{sent:0,word:'새 항목',correct:false,note:'',alt:'',original:''}];sets[isG?p.grammar_sel:p.vocab_sel]={...sets[isG?p.grammar_sel:p.vocab_sel],items};return isG?{...p,grammar_sets:sets}:{...p,vocab_sets:sets};});}}
          style={{width:'100%',padding:'8px',fontSize:12,borderRadius:7,border:'1px dashed #ccc',background:'transparent',color:'#666',cursor:'pointer',marginTop:4}}>+ 항목 추가</button>
      </div>;
    }
    return null;
  };

  const buildOutput=()=>{
    const entries=passages.filter(p=>p.data).map(({data:p})=>{
      const gs=(p.grammar_sets||[])[p.grammar_sel]||{items:[],answer:1};
      const vs=(p.vocab_sets||[])[p.vocab_sel]||{items:[],answer:1};
      return{id:p.id,difficulty:p.difficulty,title:p.title,sentences:p.sentences,abstract:p.abstract,
        topic_options:p.topic_options,topic_answer:p.topic_answer,
        blank_sel:p.blank_sel||0,blank_candidates:p.blank_candidates||[],
        blank_sentence_index:p.blank_sentence_index,blank_target:p.blank_target,
        blank_options:p.blank_options,blank_answer:p.blank_answer,
        order_given_index:p.order_given_index,order_blocks:p.order_blocks,
        order_options:p.order_options,order_answer:p.order_answer,
        insert_sel:p.insert_sel||0,insert_candidates:p.insert_candidates||[],
        insert_sentence:p.insert_sentence,insert_answer:p.insert_answer,
        summary_sel:p.summary_sel||0,summary_candidates:p.summary_candidates||[],
        summary_template:p.summary_template,
        summary_A_options:p.summary_A_options,summary_A_answer:p.summary_A_answer,
        summary_B_options:p.summary_B_options,summary_B_answer:p.summary_B_answer,
        implication_sentence_index:p.implication_sentence_index,implication_keyword:p.implication_keyword,
        implication_options:p.implication_options,implication_answer:p.implication_answer,
        irrel_sel:p.irrel_sel||0,irrel_candidates:p.irrel_candidates||[],
        irrel_insert_pos:p.irrel_insert_pos||0,irrel_confirmed:p.irrel_confirmed||false,
        irrelevant_sentence_index:p.irrelevant_sentence_index,
        irrel_sentence:p.irrel_candidates?.[p.irrel_sel]||'',
        grammar_sets:p.grammar_sets||[],grammar_sel:p.grammar_sel||0,
        grammar_items:(()=>{const sorted=[...gs.items].sort((a,b)=>Number(a.sent)-Number(b.sent));return sorted;})(),
        grammar_answer:(()=>{const sorted=[...gs.items].sort((a,b)=>Number(a.sent)-Number(b.sent));const idx=sorted.findIndex(it=>it.correct===false);return idx>=0?idx+1:(p.grammar_answer||gs.answer||1);})(),
        vocab_sets:p.vocab_sets||[],vocab_sel:p.vocab_sel||0,
        vocab_items:(()=>{const sorted=[...vs.items].sort((a,b)=>Number(a.sent)-Number(b.sent));return sorted;})(),
        vocab_answer:(()=>{const sorted=[...vs.items].sort((a,b)=>Number(a.sent)-Number(b.sent));const idx=sorted.findIndex(it=>it.correct===false);return idx>=0?idx+1:(p.vocab_answer||vs.answer||1);})(),
        aGroup:(p.summary_A_options||[]).slice(0,3),bGroup:(p.summary_B_options||[]).slice(0,3),
        disabled_types:p.disabled_types||[]};
    });
    return`// GREATENG passageData 추가분 (${entries.length}개)\n// order_answer는 merge 스크립트 재처리 필요\n\n`+entries.map(e=>JSON.stringify(e,null,2)).join(',\n\n');
  };

  const card={background:'#fff',borderRadius:10,border:'0.5px solid #e5e5e5',padding:'14px 16px',marginBottom:12};

  if(step==='setup')return(
    <div style={{maxWidth:600,margin:'0 auto',padding:'24px 14px'}}>
      <div style={card}>
        <div style={{fontWeight:600,fontSize:15,marginBottom:4}}>출제 저작 도구</div>
        <div style={{color:'#888',fontSize:13,marginBottom:20}}>지문 붙여넣기 → AI 흐름 분석 → 출제 저작</div>
        <div style={{display:'grid',gridTemplateColumns:'2fr 1fr',gap:10,marginBottom:14}}>
          <div><label style={{fontSize:12,fontWeight:500,color:'#666',display:'block',marginBottom:4}}>교재 코드</label>
            <select value={pfx} onChange={e=>setPfx(e.target.value)} style={{width:'100%',padding:'7px 10px',border:'0.5px solid #e5e5e5',borderRadius:7,fontSize:13,background:'#fff'}}>
              {BOOK_DEFS.filter(b=>!b.id.startsWith('MOGO_')).map(b=>(
                <option key={b.id} value={b.id}>{b.id} ({b.label})</option>
              ))}
              {getMogoGroups().map(g=>(
                <optgroup key={g.yr+'_'+g.gr} label={`모의고사 ${g.yr} ${g.gr}`}>
                  {g.items.map(b=><option key={b.id} value={b.id}>{b.label}</option>)}
                </optgroup>
              ))}
            </select>
          </div>
          <div><label style={{fontSize:12,fontWeight:500,color:'#666',display:'block',marginBottom:4}}>강 (Chapter)</label><input type="number" value={chapter} onChange={e=>setChapter(+e.target.value)} min={1} max={50} style={{width:'100%',padding:'7px 10px',border:'0.5px solid #e5e5e5',borderRadius:7,fontSize:13}}/></div>
          <div><label style={{fontSize:12,fontWeight:500,color:'#666',display:'block',marginBottom:4}}>시작 번호</label><input type="number" value={startNum} onChange={e=>setStartNum(+e.target.value)} style={{width:'100%',padding:'7px 10px',border:'0.5px solid #e5e5e5',borderRadius:7,fontSize:13}}/></div>
        </div>
        <div style={{marginBottom:16}}>
          <label style={{fontSize:12,fontWeight:500,color:'#666',display:'block',marginBottom:4}}>지문 텍스트 <span style={{fontWeight:400,color:'#bbb'}}>— 교재 전체 붙여넣기 가능 (자동 분리)</span></label>
          <textarea value={rawText} onChange={e=>setRawText(e.target.value)} rows={11} style={{width:'100%',fontFamily:'monospace',fontSize:12,padding:'8px 10px',border:'0.5px solid #e5e5e5',borderRadius:7,resize:'vertical'}} placeholder={"지문 붙여넣기...\n\n여러 지문 자동 인식:\n• --- 구분선\n• '20 다음...', '21 글의...' 문번호 패턴\n• 3줄 이상 빈 줄"}/>
        </div>
        {rawText.trim()&&(()=>{const n=splitTexts(rawText).length;return<div style={{background:n>1?'#E8F5E9':'#F5F5F5',border:`0.5px solid ${n>1?'#81C784':'#e5e5e5'}`,borderRadius:7,padding:'8px 12px',fontSize:12.5,color:n>1?'#2d8a60':'#888',marginBottom:10}}>
          {n>1?`✓ ${n}개 지문 자동 감지됨 — 순서대로 자동 분석합니다`:`지문 1개 감지됨`}
        </div>;})()} 
        {err&&<div style={{color:'#E24B4A',fontSize:12,marginBottom:8}}>{err}</div>}
        {!apiKey&&<div style={{color:'#856404',background:'#FFF8E6',border:'0.5px solid #F0C040',borderRadius:7,padding:'8px 12px',fontSize:12,marginBottom:10}}>⚠ 상단 ⚙ 설정에서 API Key를 먼저 입력해주세요.</div>}
        <button onClick={analyze} disabled={!rawText.trim()} style={{width:'100%',padding:'11px',background:'#185FA5',color:'#fff',border:'none',borderRadius:8,fontSize:14,fontWeight:600,cursor:'pointer'}}>분석 시작 ↗</button>
      </div>
    </div>
  );

  if(step==='proc')return(
    <div style={{maxWidth:520,margin:'0 auto',padding:'40px 14px',textAlign:'center'}}>
      <div style={{fontWeight:500,fontSize:15,marginBottom:16}}>{passages.filter(p=>!p.loading&&(p.data||p.error)).length}/{passages.length} 완료</div>
      <div style={{background:'#e5e5ea',borderRadius:100,height:5,marginBottom:20}}>
        <div style={{background:'#185FA5',borderRadius:100,height:5,width:`${passages.length?(passages.filter(p=>!p.loading).length/passages.length*100):0}%`,transition:'width .4s'}}/>
      </div>
      <div style={{textAlign:'left'}}>
        {passages.map((p,i)=><div key={i} style={{...card,display:'flex',alignItems:'center',gap:10,padding:'10px 14px',marginBottom:8}}>
          <span style={{color:p.data?'#2d8a60':p.error?'#E24B4A':'#888'}}>{p.loading?'○':p.error?'✕':p.data?'●':'·'}</span>
          <span style={{fontSize:13,color:'#666'}}>지문 {i+1}</span>
          {p.data&&<span style={{marginLeft:'auto',fontWeight:500}}>{p.data.title}</span>}
          {p.error&&<span style={{marginLeft:'auto',fontSize:11,color:'#E24B4A'}}>{p.error.slice(0,60)}</span>}
        </div>)}
      </div>
    </div>
  );

  if(step==='edit'){
    const p=P();
    const curId=p?.id||'';
    const savedSlots=(slots||[]).filter(s=>s.status==='saved');
    return(
      <div style={{padding:'14px'}}>
        {/* 교재ID/번호 + 슬롯 전환 */}
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8,flexWrap:'wrap'}}>
          {curId&&<span style={{fontSize:12,fontFamily:'monospace',background:'#185FA510',color:'#185FA5',border:'1px solid #185FA540',borderRadius:6,padding:'3px 10px',fontWeight:600}}>{curId}</span>}
          {savedSlots.length>0&&<>
            <span style={{fontSize:11,color:'#bbb'}}>|</span>
            <span style={{fontSize:11,color:'#888'}}>슬롯 전환:</span>
            {savedSlots.map((s,si)=>{
              const sid=s.passageData?.id||(makePassageId(s.meta?.source,s.meta?.chapter||1,s.meta?.number||1));
              const isNow=sid===curId;
              return<button key={si} onClick={()=>{if(!isNow&&onSlotChange)onSlotChange(s.passageData?restorePassageData(s.passageData):null,s.meta);}}
                style={{fontSize:11,padding:'3px 9px',borderRadius:6,
                  border:`1px solid ${isNow?'#185FA5':'#e5e5e5'}`,
                  background:isNow?'#185FA5':'transparent',
                  color:isNow?'#fff':'#555',
                  cursor:isNow?'default':'pointer',fontWeight:isNow?600:400}}>
                {parseInt(s.meta?.chapter)||1}강 {parseInt(s.meta?.number)||1}번
              </button>;
            })}
          </>}
        </div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
          <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
            {passages.filter(pg=>pg.data).map((pg,_,arr)=><button key={pg.id} onClick={()=>{setPi(pg.id);setAt(0);}} style={{background:pi===pg.id?'#1d1d1f':'transparent',color:pi===pg.id?'#fff':'#555',border:'0.5px solid #e5e5e5',borderRadius:7,padding:'4px 12px',fontSize:13,cursor:'pointer',fontWeight:pi===pg.id?500:400}}>{pg.data.title}</button>)}
          </div>
          <div style={{display:'flex',gap:6}}>

            <button onClick={saveCurrentTabToSheet} disabled={sheetSaving} style={{padding:'5px 14px',fontSize:12,background:sheetSaving?'#888':'#7B5EA7',color:'#fff',border:'none',borderRadius:7,cursor:'pointer',fontWeight:500}}>{sheetSaving?'저장중...':'📊 '+AUTHOR_TABS[at].lb+' 저장'}</button>
            <button onClick={saveCurrentQuestionsToSheet} disabled={sheetSaving} style={{padding:'5px 14px',fontSize:12,background:sheetSaving?'#888':'#534AB7',color:'#fff',border:'none',borderRadius:7,cursor:'pointer',fontWeight:500}}>{sheetSaving?'저장중...':'📊 전체 저장'}</button>
            <button onClick={()=>saveToGitHub(buildOutput())} disabled={ghSaving} style={{padding:'5px 14px',fontSize:12,background:ghSaving?'#888':'#1a5c3a',color:'#fff',border:'none',borderRadius:7,cursor:'pointer',fontWeight:500}}>{ghSaving?'저장중...':'GitHub 저장 ↗'}</button>

        <pre style={{background:'#f5f5f7',border:'0.5px solid #e5e5e5',borderRadius:8,padding:14,fontSize:11,overflow:'auto',maxHeight:560,fontFamily:'monospace',lineHeight:1.5,whiteSpace:'pre-wrap',wordBreak:'break-word'}}>{outText}</pre>

    outline:'none',padding:'2px 0',fontFamily:'inherit',color:'inherit',width:'100%'};
const sB={border:'none',background:'transparent',outline:'none',cursor:'pointer',fontFamily:'inherit'};
function App(){
  const [slots,setSlots]=useState(()=>loadSlots()||Array.from({length:12},(_,i)=>makeSlot(i)));
  const [authorInitText,setAuthorInitText]=useState('');
  const [authorInitMeta,setAuthorInitMeta]=useState(null);

  const [viewMode,setViewMode]=useState('teacher');

  const [keyInput,setKeyInput]=useState('');

  const [ghRepo,setGhRepo]=useState(()=>localStorage.getItem('gh_repo')||'greatenglish1201-ux/GREATENG');

  const [appsUrlInput,setAppsUrlInput]=useState('');
  const [sheetSaving,setSheetSaving]=useState(false);
