function upsertPassages(currentContent,newEntries){
  const start=currentContent.indexOf('[');
  const end=currentContent.lastIndexOf(']');
  if(start<0||end<0)throw new Error('passages.js 형식 오류');
  let existing;
  try{existing=JSON.parse(currentContent.slice(start,end+1));}
  catch{throw new Error('passages.js JSON 파싱 실패');}
  // 기존 배열 중복 제거 (필드 수 많은 것 우선)
  const deduped=[];const seenIds=new Set();
  existing.forEach(e=>{
    if(!seenIds.has(e.id)){seenIds.add(e.id);deduped.push(e);}
    else{const i=deduped.findIndex(x=>x.id===e.id);if(i>=0&&Object.keys(e).length>Object.keys(deduped[i]).length)deduped[i]=e;}
  });
  existing=deduped;
  // 새 항목 upsert
  newEntries.forEach(ne=>{
    const idx=existing.findIndex(e=>e.id===ne.id);
    if(idx>=0)existing[idx]=ne;else existing.push(ne);
  });
  return currentContent.slice(0,start)+JSON.stringify(existing,null,2)+currentContent.slice(end+1);
}

function callClaude(key,sys,user){
  if(!key) throw new Error('API 키 없음');
  return fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':key,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:4096,
      system:sys,messages:[{role:'user',content:user}]})
  }).then(r=>r.json());
}

function parseJSON(text){
  let s=text.replace(/```(?:json)?|```/g,'').trim();
  // 중첩 괄호 추적으로 정확한 JSON 경계 추출
  const start=s.search(/[{[]/);
  if(start<0)throw new Error('JSON 시작 없음');
  const opener=s[start];
  const closer=opener==='{'?'}':']';
  let depth=0,inStr=false,escape=false,end=-1;
  for(let i=start;i<s.length;i++){
    const c=s[i];
    if(escape){escape=false;continue;}
    if(c==='\\'){escape=true;continue;}
    if(c==='"'){inStr=!inStr;continue;}
    if(inStr)continue;
    if(c==='{'||c==='[')depth++;
    else if(c==='}'||c===']')depth--;
    if(depth===0){end=i;break;}
  }
  if(end>=0)s=s.slice(start,end+1);
  else s=s.slice(start);
  return JSON.parse(s);
}



function Highlighted({text,words}){
  if(!words||!words.length) return React.createElement(React.Fragment,null,text);
  const sorted=[...words].sort((a,b)=>b.length-a.length);
  const esc=w=>w.replace(/[-.*+?^${}()|[\]\\]/g,'\\$&');
  const pat=new RegExp('('+sorted.map(esc).join('|')+')','gi');
  const parts=text.split(pat);
  return React.createElement(React.Fragment,null,...parts.map((p,i)=>
    sorted.some(w=>w.toLowerCase()===p.toLowerCase())
      ?<mark key={i} style={{background:'#FFD700',color:'inherit',borderRadius:2,padding:'0 2px',fontWeight:700}}>{p}</mark>
      :p
  ));
}

/* ── DOCX 학생용 (흑백 A4 1페이지) ── */
function buildDOCXChildren(slot,mode){
const {Document,Packer,Paragraph,TextRun,Table,TableRow,TableCell,
    AlignmentType,BorderStyle,WidthType,ShadingType,VerticalAlign}=docx;
  const IS=mode==='student';
  const {analysis,meta}=slot;
  if(!analysis)return;
  const {sentences=[],flow={},grammar={}}=analysis;
  const {blocks=[],interBlockConnectors=[],keyword='',topicSummary='',structureType=''}=flow;
  const {difficultSentences=[]}=grammar;
  const sm=Object.fromEntries(sentences.map(s=>[s.num,s]));
  const conn=i=>interBlockConnectors[i]||'→';
  const id=meta.source+'_'+String(meta.chapter).padStart(2,'0')+'_'+String(meta.number).padStart(3,'0');
  const F='Malgun Gothic',P9=18,P8=16,P10=20;
  const nb={style:BorderStyle.NONE,size:0,color:'FFFFFF'};
  const bd=(c='888888',sz=3)=>({style:BorderStyle.SINGLE,size:sz,color:c});
  const nobs={top:nb,bottom:nb,left:nb,right:nb};
  const CM={top:60,bottom:60,left:100,right:100};
  const cell=(children,opts={})=>new TableCell({
    borders:opts.borders||{top:bd(opts.bc||'AAAAAA'),bottom:bd(opts.bc||'AAAAAA'),
      left:bd(opts.bc||'AAAAAA'),right:bd(opts.bc||'AAAAAA')},
    shading:opts.bg?{fill:opts.bg,type:ShadingType.CLEAR}:undefined,
    width:opts.w?{size:opts.w,type:WidthType.DXA}:undefined,
    verticalAlign:VerticalAlign.CENTER,margins:opts.m||CM,children,
  });
  const para=(text,opts={})=>new Paragraph({
    alignment:opts.a||AlignmentType.LEFT,
    spacing:{before:opts.sb||0,after:opts.sa||40},
    border:opts.border,indent:opts.indent,
    children:Array.isArray(text)?text:[new TextRun({
      text:String(text||''),bold:opts.bold||false,size:opts.size||P9,
      color:opts.color||'1a1a1a',font:F,italics:opts.italic||false})],
  });
  const run=(text,opts={})=>new TextRun({
    text:String(text||''),bold:opts.bold||false,size:opts.size||P9,
    color:opts.color||'1a1a1a',font:F,italics:opts.italic||false});
  const blank=()=>new Paragraph({spacing:{after:80,before:0},
    border:{bottom:{style:BorderStyle.SINGLE,size:3,color:'888888',space:1}},
    children:[run(' ',{size:P9})]});
const ch=[];

  /* 헤더 */
  ch.push(new Table({width:{size:9200,type:WidthType.DXA},columnWidths:[6500,2700],
    rows:[new TableRow({children:[
      cell([para([run('수능 영어 독해 — 흐름 분석',{bold:true,size:P10}),
        run('  '+(IS?'[학생용]':'[교사용]')+'  '+id,{size:P8,color:'666666'})],{sa:0})],
        {borders:nobs,w:6500,m:{top:0,bottom:0,left:0,right:0}}),
      cell([para([run('이름: ',{size:P8,color:'666666'}),run('____________',{size:P8}),
        run('  날짜: ',{size:P8,color:'666666'}),run('________',{size:P8})],
        {a:AlignmentType.RIGHT,sa:0})],
        {borders:nobs,w:2700,m:{top:0,bottom:0,left:0,right:0}}),
    ]})]
  }));
  ch.push(new Paragraph({spacing:{before:0,after:100},
    border:{bottom:{style:BorderStyle.SINGLE,size:8,color:'1a1a1a',space:1}},
    children:[run('')]}));

  /* 지문 */
  ch.push(para('■ 지문',{bold:true,size:P8,color:'333333',sa:60}));
  const pRuns=[];
  sentences.forEach(s=>{
    pRuns.push(run(nStr(s.num)+' ',{bold:true,size:P9}));
    pRuns.push(run(s.text+' ',{size:P9}));
  });
  ch.push(new Paragraph({spacing:{before:0,after:120},
    border:{left:{style:BorderStyle.SINGLE,size:10,color:'555555',space:6}},
    indent:{left:160},children:pRuns}));

  /* Block Diagram */
  ch.push(para('■ 글의 구조',{bold:true,size:P8,color:'333333',sb:60,sa:60}));
  const nc=blocks.length-1;
  const bw=Math.floor((9200-nc*440)/blocks.length);
  const colW=[];blocks.forEach((_,bi)=>{colW.push(bw);if(bi<blocks.length-1)colW.push(440);});
  const hCells=blocks.map((blk,bi)=>{
    const hd=IS?[blank()]:[para(blk.name,{bold:true,size:P9,sa:20}),para(blk.nameEn,{size:P8,italic:true,sa:0})];
    const c=cell(hd,{bg:'EEEEEE',bc:'666666',w:bw});
    if(bi<blocks.length-1)return[c,cell([para(conn(bi),{bold:true,size:P10,color:'444444',a:AlignmentType.CENTER,sa:0})],{borders:nobs,w:440})];
    return[c];
  }).flat();
  const maxS=Math.max(...blocks.map(b=>(b.sentenceNums||[]).length));
  const bRows=Array.from({length:maxS},(_,ri)=>{
    const rCells=blocks.map((blk,bi)=>{
      const sn=(blk.sentenceNums||[])[ri];
      const sent=sn?sm[sn]:null;
      const c=cell(sent?[para([run(nStr(sent.num)+' ',{bold:true,size:P9}),
        run('('+sent.symbol+')  ',{size:P8}),run(sent.role,{size:P8,color:'444444'})],{sa:0})]:[para('',{sa:0})],
        {bc:'BBBBBB',w:bw});
      if(bi<blocks.length-1)return[c,cell([para('',{sa:0})],{borders:nobs,w:440})];
      return[c];
    }).flat();
    return new TableRow({children:rCells});
  });
  ch.push(new Table({width:{size:9200,type:WidthType.DXA},columnWidths:colW,
    rows:[new TableRow({children:hCells}),...bRows]}));
  ch.push(para('',{sa:80}));

  /* 핵심소재/주제요약/구조 — 표 없이 텍스트 */
  ch.push(new Paragraph({spacing:{before:0,after:50},children:[run('▸ 핵심 소재: ',{bold:true,size:P8}),IS?run('_________________________',{size:P8}):run(keyword,{size:P9})]}));
  ch.push(new Paragraph({spacing:{before:0,after:50},children:[run('▸ 주제 요약: ',{bold:true,size:P8}),IS?run('_________________________',{size:P8}):run(topicSummary,{size:P9})]}));
  ch.push(new Paragraph({spacing:{before:0,after:100},children:[run('▸ 구조 유형: ',{bold:true,size:P8}),IS?run('_________________________',{size:P8}):run(structureType,{size:P9})]}));

  /* 문장별 분석 */
  const dsToShow=IS?sentences.filter(s=>difficultSentences.find(d=>d.num===s.num)):sentences;
  if(dsToShow.length){
    ch.push(para(IS?'■ 구문 분석':'■ 문장별 분석 (끊어읽기 + 구문)',{bold:true,size:P8,color:'333333',sb:60,sa:60}));
    dsToShow.forEach(s=>{
      const ds=difficultSentences.find(d=>d.num===s.num);
      const chunks=s.chunks||[];
      ch.push(new Paragraph({spacing:{before:0,after:30},
        border:{bottom:{style:BorderStyle.SINGLE,size:3,color:'CCCCCC',space:1}},
        children:[run(nStr(s.num)+' ('+s.symbol+')  ',{bold:true,size:P9}),run(s.text,{size:P8,italic:true,color:'333333'})]}));
      if(!IS&&chunks.length){
        ch.push(new Paragraph({spacing:{before:30,after:0},indent:{left:200},
          children:[run(chunks.map(c=>c.en||'').join(' / '),{size:P8,italic:true})]}));
        ch.push(new Paragraph({spacing:{before:0,after:40},indent:{left:200},
          children:[run(chunks.map(c=>c.ko||'').join(' / '),{size:P8,color:'444444'})]}));
      }
      if(ds){
        [{l:'구조',f:'structure'},{l:'해석',f:'translation'},{l:'포인트',f:'point'}].forEach(r=>{
          ch.push(new Paragraph({spacing:{before:0,after:20},indent:{left:200},children:[
            run('['+r.l+'] ',{bold:true,size:P8,color:'555555'}),
            IS&&r.f==='translation'?run('______________________________',{size:P8}):run(ds[r.f]||'',{size:P8}),
          ]}));
        });
      }
      ch.push(para('',{sa:60}));
    });
  }
  return ch;
}

function buildDOCX(slot,mode){
  const {Document,Packer}=docx;
  const IS=mode==='student';
  const {meta}=slot;
  if(!slot.analysis)return;
  const id=meta.source+'_'+String(meta.chapter).padStart(2,'0')+'_'+String(meta.number).padStart(3,'0');
  const ch=buildDOCXChildren(slot,mode);
  const doc=new Document({
    styles:{default:{document:{run:{font:'Malgun Gothic',size:18}}}},
    sections:[{properties:{page:{size:{width:11906,height:16838},margin:{top:700,right:700,bottom:700,left:700}}},children:ch}]
  });
  Packer.toBlob(doc).then(blob=>saveAs(blob,id+'_'+(IS?'학생용':'교사용')+'.docx'));
}


/* ── 통합 DOCX (전체 슬롯) ── */
function buildAllDOCX(slots,mode){
  const {Document,Packer}=docx;
  const IS=mode==='student';
  const activeSlots=slots.filter(s=>s.analysis&&s.status==='saved');
  if(!activeSlots.length){alert('저장완료된 슬롯이 없습니다.');return;}
  const sections=activeSlots.map(slot=>{
    const ch=buildDOCXChildren(slot,mode);
    return{properties:{page:{size:{width:11906,height:16838},margin:{top:700,right:700,bottom:700,left:700}}},children:ch};
  });
  const doc=new Document({styles:{default:{document:{run:{font:'Malgun Gothic',size:18}}}},sections});
  Packer.toBlob(doc).then(blob=>saveAs(blob,'전체_'+(IS?'학생용':'교사용')+'.docx'));
}

function buildHTML(slot,mode){
  const IS=mode==='student';
  const {analysis,meta}=slot;
  if(!analysis)return'';
  const {sentences=[],flow={},grammar={}}=analysis;
  const {blocks=[],interBlockConnectors=[],keyword='',topicSummary='',structureType=''}=flow;
  const {difficultSentences=[]}=grammar;
  const sm=Object.fromEntries(sentences.map(s=>[s.num,s]));
  const conn=i=>interBlockConnectors[i]||'→';
  const id=meta.source+'_'+String(meta.chapter).padStart(2,'0')+'_'+String(meta.number).padStart(3,'0');
  const esc=w=>w.replace(/[-.*+?^${}()|[\]\\]/g,'\\$&');
  const hlHTML=(text,words)=>{
    if(!words||!words.length)return text;
    const sorted=[...words].sort((a,b)=>b.length-a.length);
    const pat=new RegExp('('+sorted.map(esc).join('|')+')','gi');
    return text.replace(pat,m=>'<mark style="background:#FFD700;color:inherit;border-radius:2px;padding:0 2px;font-weight:700">'+m+'</mark>');
  };
  const passHTML=sentences.map(s=>{
    const sc=SM[s.symbol]||{};
    return'<span><span style="font-size:12px;font-weight:700;color:'+sc.tx+';margin-right:4px">'+nStr(s.num)+'</span>'+s.text+' </span>';
  }).join('');
  const blockCards=blocks.map((blk,bi)=>{
    const c=BC[blk.color]||BC.blue;
    const ss=(blk.sentenceNums||[]).map(n=>sm[n]).filter(Boolean);
    const hd=IS
      ?'<div style="border-bottom:2px solid '+c.bd+';height:22px;width:85%;margin-bottom:5px"></div>'
      :'<div style="font-size:1em;font-weight:700;color:'+c.tx+'">'+blk.name+'</div><div style="font-size:.72em;color:'+c.tx+';font-style:italic;font-weight:600;opacity:.85">'+blk.nameEn+'</div>';
    const rows=ss.map((sent,si)=>{
      const sc=SM[sent.symbol]||{};

function splitTexts(text){
  // 1. --- 구분선
  if(text.indexOf('\n---')>=0)return text.split(/\n---+\n?/).map(t=>t.trim()).filter(Boolean);
  // 2. 문번호 패턴: 줄 시작 숫자(18~50) + 다음/밑줄/주어진/글/빈칸 등
  const byNum=text.split(/(?=\n\s*(?:[1-9]\d)\s+(?:다음|밑줄|주어진|글의|빈칸|흐름|문맥|어법|어휘|아래))/).map(t=>t.trim()).filter(Boolean);
  if(byNum.length>1)return byNum.filter(p=>/[A-Za-z]{15,}/.test(p));
  // 3. 빈 줄 2개 이상으로 분리
  const byBlank=text.split(/\n{3,}/).map(t=>t.trim()).filter(Boolean);
  if(byBlank.length>1)return byBlank.filter(p=>/[A-Za-z]{15,}/.test(p));
  // 4. 단일 지문
  return[text.trim()].filter(Boolean);
}

      else if(at===6&&p.insert_answer===i){bg='#534AB714';bl='3px solid #534AB7';}
      else if((at===7||at===8)){const sets=at===7?p.grammar_sets:p.vocab_sets;const sel=at===7?(p.grammar_sel||0):(p.vocab_sel||0);const item=sets?.[sel]?.items?.find(it=>Number(it.sent)===i);if(item){const c=item.correct?'#185FA5':'#E24B4A';bg=c+'08';bl='3px solid '+c;}}
      const stxt=typeof s==='string'?s:(s?.text||'');
      const isInsertSel=at===6&&p.insert_answer===i;
      rows.push(<div key={i}
        onClick={at===6?()=>upP({insert_sentence:stxt,insert_answer:i}):undefined}
        style={{display:'flex',gap:6,marginBottom:5,padding:'5px 8px',borderRadius:6,background:bg,borderLeft:bl,
          cursor:at===6?'pointer':'default',
          opacity:at===6&&p.insert_answer!=null&&!isInsertSel?0.5:1}}>
        <span style={{color:'#bbb',fontFamily:'monospace',fontSize:11,flexShrink:0,marginTop:2,minWidth:20}}>[{i}]</span>
        {at===2&&getBlockLabel(p,i)&&<span style={{fontSize:11,fontWeight:700,color:BLK_C[getBlockLabel(p,i)],marginRight:2,flexShrink:0,marginTop:2}}>({getBlockLabel(p,i)})</span>}
        {isInsertSel
          ?<span style={{fontSize:12,lineHeight:1.8,color:'#534AB7',fontWeight:600,textDecoration:'line-through',textDecorationColor:'#534AB7'}}>{stxt}</span>
          :renderSent(p,stxt,i)}
      </div>);
    }
    return<div style={{overflowY:'auto',maxHeight:500}}><div style={{fontSize:11,fontWeight:600,color:'#888',marginBottom:8}}>{at===5?'▶ 클릭으로 삽입 위치 선택':at===6?'문장을 클릭하면 삽입 문장으로 선택됩니다':'전체 지문'}</div>{rows}</div>;
  };

  const RightPanel=({p})=>{
    const T=AUTHOR_TABS[at];
    const optBtn=(sel,isRec,n,txt,onclick)=><button onClick={onclick} style={{display:'block',width:'100%',textAlign:'left',marginBottom:5,padding:'9px 11px',borderRadius:8,background:sel?T.c+'18':'transparent',border:`0.5px solid ${sel?T.c:'#e5e5e5'}`,color:sel?T.c:'#1d1d1f',cursor:'pointer',fontSize:13,lineHeight:1.45}}>
      {sel&&bdg('✓ 정답',T.c)}{isRec&&!sel&&bdg('AI 추천','#854F0B')}
      <span style={{fontSize:11,color:'#bbb',marginRight:4}}>({n})</span>{txt}</button>;

    if(at===0)return<div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
        <div style={{fontSize:11,fontWeight:600,color:'#888'}}>선지 편집 &amp; 정답 선택</div>
        {genLoading==='topic'
          ?<span style={{fontSize:11,color:'#185FA5'}}>⏳ AI 생성 중...</span>
          :<button onClick={()=>genTopicOptions(p)} style={{fontSize:11,padding:'3px 9px',borderRadius:5,border:'1px solid #185FA5',background:'#185FA510',color:'#185FA5',cursor:'pointer'}}>↻ 선지 재생성</button>}
      </div>
      {(p.topic_options||[]).map((o,i)=>{const isSel=p.topic_answer===i+1;return<div key={i} style={{display:'flex',gap:6,alignItems:'center',marginBottom:6}}>
        <button onClick={()=>upP({topic_answer:i+1})} style={{minWidth:28,height:28,borderRadius:14,border:`1px solid ${isSel?'#185FA5':'#ddd'}`,background:isSel?'#185FA5':'transparent',color:isSel?'#fff':'#999',fontSize:12,cursor:'pointer',fontWeight:700}}>{i+1}</button>
        <input value={o} onChange={e=>{const opts=[...p.topic_options];opts[i]=e.target.value;upP({topic_options:opts});}}
          style={{flex:1,fontSize:13,padding:'6px 9px',borderRadius:7,border:`1px solid ${isSel?'#185FA5':'#e5e5e5'}`,fontWeight:isSel?600:400,color:isSel?'#185FA5':'#1d1d1f'}}/>
        {isSel&&<span style={{fontSize:11,color:'#185FA5',whiteSpace:'nowrap'}}>✓ 정답</span>}
      </div>;})}
    </div>;

    if(at===1)return<div>
      <div style={{fontSize:11,fontWeight:600,color:'#888',marginBottom:8}}>① 빈칸 후보 선택</div>
      {p.blank_candidates?.map((c,ci)=><button key={ci} onClick={()=>upPDeep(p=>{const upd={...p,blank_sel:ci,blank_sentence_index:c.sentence_index,blank_target:c.keyword,blank_options:[c.keyword,...c.distractors]};return upd;})} style={{display:'block',width:'100%',textAlign:'left',marginBottom:7,background:p.blank_sel===ci?'#993C1D10':'transparent',border:`1px solid ${p.blank_sel===ci?'#993C1D':'#e5e5e5'}`,borderRadius:9,padding:'10px 12px',cursor:'pointer'}}>
        {p.blank_sel===ci&&bdg('✓','#993C1D')}{ci===0&&bdg('AI 추천','#854F0B')}
        <div style={{fontSize:11,color:'#bbb',marginBottom:2}}>문장 [{c.sentence_index}]</div>
        <div style={{fontSize:13,fontWeight:p.blank_sel===ci?600:400,color:p.blank_sel===ci?'#993C1D':'#1d1d1f'}}>"{c.keyword}"</div>
      </button>)}
      <hr style={{border:'none',borderTop:'0.5px solid #eee',margin:'10px 0'}}/>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
        <div style={{fontSize:11,fontWeight:600,color:'#888'}}>② 오답 선택지</div>
        {genLoading==='blank'
          ?<span style={{fontSize:11,color:'#993C1D',animation:'pulse 1s infinite'}}>⏳ AI 생성 중...</span>
          :<button onClick={()=>genBlankDistractors(p.blank_sentence_index,p.blank_target,p)} style={{fontSize:11,padding:'3px 9px',borderRadius:5,border:'1px solid #993C1D',background:'#993C1D10',color:'#993C1D',cursor:'pointer'}}>↻ 오답 재생성</button>}
      </div>
      <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:8}}>
        <span style={{fontSize:12,color:'#993C1D',fontWeight:600,whiteSpace:'nowrap'}}>정답:</span>
        <input value={p.blank_target||''} onChange={e=>{const opts=[...(p.blank_options||[])];opts[0]=e.target.value;upP({blank_target:e.target.value,blank_options:opts});}}
          style={{flex:1,fontSize:13,fontWeight:700,padding:'5px 9px',borderRadius:6,border:'1px solid #993C1D',color:'#993C1D'}}/>
      </div>
      {[0,1,2,3].map(i=><div key={i} style={{display:'flex',alignItems:'center',gap:5,marginBottom:5}}>
        <span style={{fontSize:11,color:'#bbb',minWidth:32}}>오답{i+1}</span>
        <input value={p.blank_options?.[i+1]||''} onChange={e=>{const opts=[...(p.blank_options||[])];opts[i+1]=e.target.value;upP({blank_options:opts});}} style={{flex:1,fontSize:12,padding:'5px 8px',border:'0.5px solid #e5e5e5',borderRadius:6}}/>
      </div>)}
    </div>;

    if(at===2){
      if(!p.order_blocks?.length)return<p style={{color:'#E24B4A',fontSize:13}}>⚠ 순서배열 불가 (문장 수 부족)</p>;
      return<div>
        <div style={{fontSize:11,fontWeight:600,color:'#888',marginBottom:8}}>블록 구성 확인</div>
        {[{label:'A',sentence_indices:[p.order_given_index]},...p.order_blocks].map(b=>{
          const c=BLK_C[b.label]||'#888';
          return<div key={b.label} style={{marginBottom:8,border:`1px solid ${c}44`,borderRadius:9,overflow:'hidden'}}>
            <div style={{background:c+'22',padding:'5px 11px',fontSize:11,fontWeight:700,color:c}}>({b.label}) 문장[{b.sentence_indices.join(', ')}]</div>
            <div style={{padding:'8px 11px',fontSize:12,color:'#555',lineHeight:1.5}}>
              {b.sentence_indices.map((idx,n)=>{const ss=p.sentences[idx];const st=typeof ss==='string'?ss:(ss?.text||'');return<div key={idx}>{n>0&&<div style={{borderTop:'0.5px solid #f0f0f0',margin:'3px 0'}}/>}<span style={{color:'#bbb',fontSize:10,marginRight:4}}>[{idx}]</span>{st}</div>})}
            </div>
          </div>;
        })}
        <hr style={{border:'none',borderTop:'0.5px solid #eee',margin:'10px 0'}}/>
        {p.order_options.map((o,i)=>optBtn(p.order_answer===i+1,i===0,i+1,o,()=>upP({order_answer:i+1})))}
      </div>;
    }

    if(at===3)return<div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
        <div style={{fontSize:11,fontWeight:600,color:'#888'}}>① 요약문 템플릿 선택</div>
        {genLoading==='summary'
          ?<span style={{fontSize:11,color:'#854F0B'}}>⏳ AI 생성 중...</span>
          :<button onClick={()=>genSummaryCandidates(p)} style={{fontSize:11,padding:'3px 9px',borderRadius:5,border:'1px solid #854F0B',background:'#854F0B10',color:'#854F0B',cursor:'pointer'}}>↻ 후보 재생성</button>}
      </div>
      {(!p.summary_candidates||p.summary_candidates.length===0)&&genLoading!=='summary'&&
        <div style={{padding:'10px 12px',background:'#FFF8E6',border:'0.5px solid #F0C040',borderRadius:7,fontSize:12,color:'#856404',marginBottom:8}}>
          후보가 없습니다. ↻ 버튼으로 AI 생성하세요.
        </div>}
      {p.summary_candidates?.map((c,ci)=>{
        const tpl=c.template.replace('________(A)________',`<span style="background:#854F0B22;color:#854F0B;fontWeight:700;padding:0 3px">(A):${c.A_correct}</span>`).replace('________(B)________',`<span style="background:#185FA522;color:#185FA5;fontWeight:700;padding:0 3px">(B):${c.B_correct}</span>`);
        const sel=p.summary_sel===ci;
        return<button key={ci} onClick={()=>upPDeep(p=>({...p,summary_sel:ci,summary_template:c.template,summary_A_options:[c.A_correct,...c.A_distractors],summary_B_options:[c.B_correct,...c.B_distractors],summary_A_answer:1,summary_B_answer:1}))} style={{display:'block',width:'100%',textAlign:'left',marginBottom:8,background:sel?'#f5f5f7':'transparent',border:`1px solid ${sel?'#185FA5':'#e5e5e5'}`,borderRadius:9,padding:'10px 12px',cursor:'pointer'}}>
          {sel&&bdg('✓','#185FA5')}{ci===0&&bdg('AI 추천','#854F0B')}
          <div style={{fontSize:12,lineHeight:1.7,marginTop:4}} dangerouslySetInnerHTML={{__html:tpl}}/>
        </button>;
      })}
      <hr style={{border:'none',borderTop:'0.5px solid #eee',margin:'10px 0'}}/>
      {[{key:'A',c:'#854F0B',opts:'summary_A_options',ans:'summary_A_answer'},{key:'B',c:'#185FA5',opts:'summary_B_options',ans:'summary_B_answer'}].map(({key,c,opts,ans})=>
        <div key={key} style={{padding:10,background:c+'08',border:`0.5px solid ${c}44`,borderRadius:8,marginBottom:8}}>
          <div style={{fontSize:11,fontWeight:700,color:c,marginBottom:5}}>빈칸 ({key})</div>
          <GrammarItemInput value={p[opts]?.[0]||''} onSave={v=>{const o=[...(p[opts]||[])];o[0]=v;upP({[opts]:o});}} style={{width:'100%',fontSize:13,fontWeight:600,padding:'5px 8px',border:'0.5px solid #e5e5e5',borderRadius:6,marginBottom:5}}/>
          {[0,1,2,3].map(i=><GrammarItemInput key={i} value={p[opts]?.[i+1]||''} onSave={v=>{const o=[...(p[opts]||[])];o[i+1]=v;upP({[opts]:o});}} placeholder={`오답${i+1}`} style={{width:'100%',fontSize:12,padding:'4px 8px',border:'0.5px solid #e5e5e5',borderRadius:6,marginBottom:4}}/>)}
        </div>
      )}
      <LocalTextarea value={p.summary_template||''} onSave={v=>upP({summary_template:v})} rows={3} style={{width:'100%',fontSize:12,padding:'7px 9px',border:'0.5px solid #e5e5e5',borderRadius:7,resize:'vertical',marginBottom:6}}/>
    </div>;

    if(at===4)return<div>
      <div style={{marginBottom:10}}>
        <div style={{fontSize:11,fontWeight:600,color:'#888',marginBottom:4}}>밑줄 표현 (지문에서 드래그로 변경)</div>
        <div style={{padding:'7px 10px',background:'#99355610',borderRadius:7,fontSize:13,color:'#993556',fontWeight:600}}>
          {p.implication_keyword||'미선택'} <span style={{fontSize:11,color:'#bbb',fontWeight:400}}>문장[{p.implication_sentence_index}]</span>
        </div>
      </div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
        <div style={{fontSize:11,fontWeight:600,color:'#888'}}>선지 편집 &amp; 정답 선택</div>
        {genLoading==='implication'
          ?<span style={{fontSize:11,color:'#993556',animation:'pulse 1s infinite'}}>⏳ AI 생성 중...</span>
          :<button onClick={()=>genImplicationOptions(p.implication_sentence_index,p.implication_keyword,p)} style={{fontSize:11,padding:'3px 9px',borderRadius:5,border:'1px solid #993556',background:'#99355610',color:'#993556',cursor:'pointer'}}>↻ 선지 재생성</button>}
      </div>
      {(()=>{const opts=[...(p.implication_options||[])];while(opts.length<5)opts.push('');return opts;})().map((o,i)=>{const isSel=p.implication_answer===i+1;return<div key={i} style={{display:'flex',gap:6,alignItems:'center',marginBottom:6}}>
        <button onClick={()=>upP({implication_answer:i+1})} style={{minWidth:28,height:28,borderRadius:14,border:`1px solid ${isSel?'#993556':'#ddd'}`,background:isSel?'#993556':'transparent',color:isSel?'#fff':'#999',fontSize:12,cursor:'pointer',fontWeight:700}}>{i+1}</button>
        <input value={o} onChange={e=>{const opts=[...(p.implication_options||[])];while(opts.length<5)opts.push('');opts[i]=e.target.value;upP({implication_options:opts});}}
          style={{flex:1,fontSize:13,padding:'6px 9px',borderRadius:7,border:`1px solid ${isSel?'#993556':'#e5e5e5'}`,fontWeight:isSel?600:400,color:isSel?'#993556':'#1d1d1f'}}/>
        {isSel&&<span style={{fontSize:11,color:'#993556',whiteSpace:'nowrap'}}>✓ 정답</span>}
      </div>;})}
    </div>;

    if(at===5)return<div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
        <div style={{fontSize:11,fontWeight:600,color:'#888'}}>① 무관 문장 선택</div>
        {genLoading==='irrel'
          ?<span style={{fontSize:11,color:'#0F6E56'}}>⏳ AI 생성 중...</span>
          :<button onClick={()=>genIrrelCandidates(p)} style={{fontSize:11,padding:'3px 9px',borderRadius:5,border:'1px solid #0F6E56',background:'#0F6E5610',color:'#0F6E56',cursor:'pointer'}}>↻ 후보 재생성</button>}
      </div>
      {(!p.irrel_candidates||p.irrel_candidates.length===0)&&genLoading!=='irrel'&&
        <div style={{padding:'10px 12px',background:'#F0FFF8',border:'0.5px solid #0F6E5640',borderRadius:7,fontSize:12,color:'#0F6E56',marginBottom:8}}>
          후보가 없습니다. ↻ 버튼으로 AI 생성하세요.
        </div>}
      {p.irrel_candidates?.map((s,ci)=><button key={ci} onClick={()=>upP({irrel_sel:ci})} style={{display:'block',width:'100%',textAlign:'left',marginBottom:7,background:p.irrel_sel===ci?'#0F6E5610':'transparent',border:`1px solid ${p.irrel_sel===ci?'#0F6E56':'#e5e5e5'}`,borderRadius:9,padding:'10px 12px',cursor:'pointer'}}>
        {p.irrel_sel===ci&&bdg('✓','#0F6E56')}{ci===0&&bdg('AI 추천','#854F0B')}
        <div style={{fontSize:12,lineHeight:1.6,marginTop:4}}>{s}</div>
      </button>)}
      <hr style={{border:'none',borderTop:'0.5px solid #eee',margin:'10px 0'}}/>
      <div style={{fontSize:11,fontWeight:600,color:'#888',marginBottom:6}}>② 직접 수정</div>
      <LocalTextarea value={p.irrel_candidates?.[p.irrel_sel]||''} onSave={v=>{const c=[...(p.irrel_candidates||[])];c[p.irrel_sel]=v;upP({irrel_candidates:c});}} rows={3} style={{width:'100%',fontSize:12,padding:'7px',border:'0.5px solid #e5e5e5',borderRadius:7,resize:'vertical',marginBottom:6}}/>
      {!p.irrel_confirmed?
        <button onClick={()=>upP({irrelevant_sentence_index:p.irrel_insert_pos||0,irrel_confirmed:true})}
          style={{width:'100%',padding:'9px',borderRadius:8,background:'#0F6E5618',border:'1px solid #0F6E56',color:'#0F6E56',fontWeight:600,cursor:'pointer',fontSize:13}}>✓ 확정</button>
        :<div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'8px 10px',background:'#0F6E5610',borderRadius:7,fontSize:12,color:'#0F6E56'}}>
          <span>✓ 확정됨 — [{p.irrel_insert_pos}] 위치, 무관문장 삽입</span>
          <button onClick={()=>upP({irrel_confirmed:false})} style={{fontSize:11,padding:'2px 8px',borderRadius:5,border:'1px solid #0F6E56',background:'transparent',color:'#0F6E56',cursor:'pointer'}}>취소</button>
        </div>}
    </div>;

    if(at===6)return<div>
      {/* 현재 선택된 문장 */}
      <div style={{marginBottom:12,padding:'10px 12px',background:'#534AB708',border:'1px solid #534AB733',borderRadius:8}}>
        <div style={{fontSize:11,fontWeight:600,color:'#534AB7',marginBottom:5}}>선택된 삽입 문장</div>
        {p.insert_sentence
          ?<div style={{fontSize:12,color:'#534AB7',fontWeight:600,lineHeight:1.6}}>{p.insert_sentence}</div>
          :<div style={{fontSize:12,color:'#bbb'}}>왼쪽 본문에서 문장을 클릭하세요</div>}
      </div>
      {/* 직접 수정 */}
      <div style={{fontSize:11,fontWeight:600,color:'#888',marginBottom:5}}>직접 수정</div>
      <LocalTextarea value={p.insert_sentence||''} onSave={v=>upP({insert_sentence:v})} rows={3}
        style={{width:'100%',fontSize:12,padding:'7px',border:'1px solid #534AB733',borderRadius:7,resize:'vertical',marginBottom:10}}/>
    </div>;

    if(at===7||at===8){
      const isG=at===7;
      const sets=isG?p.grammar_sets:p.vocab_sets;
      const sel=isG?(p.grammar_sel||0):(p.vocab_sel||0);
      const ans=isG?(p.grammar_answer||1):(p.vocab_answer||1);
      const selKey=isG?'grammar_sel':'vocab_sel';
      const ansKey=isG?'grammar_answer':'vocab_answer';
      const c='#E24B4A';
      return<div>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
          <div style={{fontSize:11,fontWeight:600,color:'#888'}}>① 세트 선택</div>
          {genLoading===(isG?'grammar':'vocab')
            ?<span style={{fontSize:11,color:'#1d1d1f'}}>⏳ AI 생성 중...</span>
            :<button onClick={()=>genGrammarVocabSet(isG,p)} style={{fontSize:11,padding:'3px 9px',borderRadius:5,border:'1px solid #555',background:'#55555510',color:'#555',cursor:'pointer'}}>↻ 세트 재생성</button>}
        </div>
        {(!sets||sets.length===0)&&genLoading!==(isG?'grammar':'vocab')&&
          <div style={{padding:'10px 12px',background:'#F5F5F7',border:'0.5px solid #ddd',borderRadius:7,fontSize:12,color:'#888',marginBottom:8}}>
            세트가 없습니다. ↻ 버튼으로 AI 생성하세요.
          </div>}
        {sets?.map((set,si)=><button key={si} onClick={()=>upP({[selKey]:si,[ansKey]:set.answer})} style={{display:'block',width:'100%',textAlign:'left',marginBottom:8,background:sel===si?'#f5f5f7':'transparent',border:`1px solid ${sel===si?'#185FA5':'#e5e5e5'}`,borderRadius:9,padding:'10px 12px',cursor:'pointer'}}>
          {sel===si&&bdg('✓','#185FA5')}{si===0&&bdg('AI 추천','#854F0B')}
          <div style={{marginTop:6,display:'flex',flexWrap:'wrap',gap:4}}>
            {set.items.map((item,ii)=>{const ic=item.correct?'#185FA5':'#E24B4A';return<span key={ii} style={{fontSize:11,padding:'2px 7px',borderRadius:5,background:ic+'18',color:ic,border:`0.5px solid ${ic}44`}}>{ii+1}. {isG?item.word:`${item.word}/${item.alt}`}</span>;})}
          </div>
        </button>)}
        <hr style={{border:'none',borderTop:'0.5px solid #eee',margin:'10px 0'}}/>
        <div style={{fontSize:11,fontWeight:600,color:'#888',marginBottom:8}}>② 항목 편집 &amp; 정답 선택</div>
        {(()=>{
          const items=sets?.[sel]?.items||[];
          const sorted=[...items].sort((a,b)=>a.sent-b.sent);
          const numMap=new Map(sorted.map((it,idx)=>[it,idx+1]));
          return items.map((item,ii)=>{
          const isSel=ans===ii+1;
          const dispNum=numMap.get(item)||ii+1;
          return<div key={ii} style={{marginBottom:8,border:`1px solid ${isSel?'#E24B4A':'#e5e5e5'}`,borderRadius:8,padding:'9px 11px',background:isSel?'#E24B4A08':'#fff'}}>
            <div style={{display:'flex',gap:6,alignItems:'center',marginBottom:6}}>
              <span style={{fontSize:11,color:'#bbb',minWidth:18}}>{ii+1}.</span>
              <GrammarItemInput value={item.word}

function App(){
  const [slots,setSlots]=useState(()=>loadSlots()||Array.from({length:10},(_,i)=>makeSlot(i)));
  const [authorInitText,setAuthorInitText]=useState('');
  const [authorInitMeta,setAuthorInitMeta]=useState(null);
  const [authorInitPassageData,setAuthorInitPassageData]=useState(null);
  const [authorKey,setAuthorKey]=useState(0);
  const [mainGhSaving,setMainGhSaving]=useState(false);
  const [viewMode,setViewMode]=useState('teacher');
  const [apiKey,setApiKey]=useState(()=>localStorage.getItem(LS.KEY)||'');
  const [keyInput,setKeyInput]=useState('');
  const [ghToken,setGhToken]=useState(()=>localStorage.getItem('gh_token')||'');
  const [ghRepo,setGhRepo]=useState(()=>localStorage.getItem('gh_repo')||'greatenglish1201-ux/GREATENG');
  const [ghTokenInput,setGhTokenInput]=useState('');
  const [ghRepoInput,setGhRepoInput]=useState('');
  const [showSet,setShowSet]=useState(false);
  const [showLoad,setShowLoad]=useState(false);
  const [loadedPassages,setLoadedPassages]=useState([]);
  const [loadSrc,setLoadSrc]=useState('');
  const [loadSearch,setLoadSearch]=useState('');
  const [loadFetching,setLoadFetching]=useState(false);
  const [loadSel,setLoadSel]=useState({});
  const [msg,setMsg]=useState('');
  const running=useRef(false);

  useEffect(()=>{saveSlots(slots);},[slots]);
  const flash=(m,t=3000)=>{setMsg(m);setTimeout(()=>setMsg(''),t);};
  const upSlot=useCallback((id,patch)=>setSlots(p=>p.map(s=>s.id===id?{...s,...patch}:s)),[]);

  const generateBlockSummaries=useCallback(async(slot)=>{
    if(!apiKey){alert('API Key가 없습니다.');return;}
    const blocks=slot.analysis?.flow?.blocks||[];
    const sentences=slot.analysis?.sentences||[];
    if(!blocks.length){alert('블록 분석 데이터가 없습니다.');return;}
    upSlot(slot.id,{blockSummaries:'loading'});
    try{
      const prompt=BLOCK_SUM_PROMPT(blocks,sentences);
      const d=await callClaude(apiKey,BLOCK_SUM_SYS,prompt);
      if(d.error)throw new Error(d.error.message||'API 오류');
      const raw=d.content[0].text.replace(/```(?:json)?|```/g,'').trim();
      const arrStart=raw.indexOf('[');
      const arrEnd=raw.lastIndexOf(']');
      if(arrStart<0||arrEnd<0)throw new Error('응답에 JSON 배열 없음');
      let jsonStr=raw.slice(arrStart,arrEnd+1);
      // 흔한 JSON 오류 수정: 후행 쉼표 제거
      jsonStr=jsonStr.replace(/,(\s*[}\]])/g,'$1');
      let parsed;
      try{parsed=JSON.parse(jsonStr);}

              if(ghRepoInput){localStorage.setItem('gh_repo',ghRepoInput);setGhRepo(ghRepoInput);}
              setGhTokenInput('');setGhRepoInput('');
              setShowSet(false);flash('설정 저장 ✓');
            }} style={{background:'#2d8a60',color:'#fff',border:'none',borderRadius:6,
              padding:'7px 20px',fontSize:12.5,cursor:'pointer',fontWeight:500}}>저장</button>
            <button onClick={()=>setShowSet(false)} style={{background:'rgba(255,255,255,.1)',
              color:'#ccc',border:'none',borderRadius:6,padding:'7px 12px',fontSize:12.5,cursor:'pointer'}}>닫기</button>
          </div>
        </div>
      )}

      {viewMode==='authoring'?<AuthoringTool key={authorKey} apiKey={apiKey} ghToken={ghToken} ghRepo={ghRepo} slots={slots} onSlotChange={(pd,meta)=>{setAuthorInitPassageData(pd);setAuthorInitMeta(meta);setAuthorKey(k=>k+1);}} onSaveComplete={(pd)=>{if(!pd)return;setSlots(prev=>prev.map(s=>s.passageData?.id===pd.id?{...s,passageData:{...s.passageData,...pd}}:s));}} initialText={authorInitText} initialMeta={authorInitMeta} initialPassageData={authorInitPassageData}/>:
      <div style={{maxWidth:1000,margin:'0 auto',padding:'18px 14px'}}>
        {!keyOk&&<div style={{background:'#FFF8E6',border:'0.5px solid #F0C040',borderRadius:8,
          padding:'10px 16px',marginBottom:12,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <span style={{fontSize:13,color:'#856404'}}>⚠ Claude API Key가 없습니다.</span>
          <button onClick={()=>setShowSet(true)} style={{padding:'5px 14px',fontSize:12,
            background:'#856404',color:'#fff',border:'none',borderRadius:5,cursor:'pointer'}}>설정</button>
        </div>}

        <div style={{background:'#fff',borderRadius:10,border:'0.5px solid #e5e5e5',
          padding:'12px 16px',marginBottom:12,display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
          <span style={{fontSize:13,fontWeight:600,color:'#555'}}>교재</span>
          <div style={{display:'flex',gap:5}}>
            {SOURCES.map(src=>(
              <button key={src} onClick={()=>setSlots(prev=>prev.map(s=>({...s,meta:{...s.meta,source:src}})))}
                style={{padding:'5px 14px',fontSize:13,fontWeight:500,
                  background:slots.every(s=>s.meta.source===src)?'#185FA5':'#f0f0f0',
                  color:slots.every(s=>s.meta.source===src)?'#fff':'#555',
                  border:'none',borderRadius:6,cursor:'pointer'}}>{src}</button>
            ))}
          </div>
          <div style={{flex:1}}/>
          <span style={{fontSize:12.5,color:'#999'}}>{pending>0?'대기 '+pending+'개':'대기 없음'}</span>
          <button onClick={runAll} disabled={pending===0||!keyOk}
            style={{padding:'8px 22px',fontSize:13.5,fontWeight:600,
              background:pending>0&&keyOk?'#185FA5':'#ccc',color:'#fff',
              border:'none',borderRadius:7,cursor:pending>0&&keyOk?'pointer':'default'}}>
            🔍 전체 분석 ({pending}개)
          </button>
        </div>

        {slots.map(slot=>(
          <SlotCard key={slot.id} slot={slot} viewMode={viewMode} iB={iB} sB={sB}
            onAuthor={async()=>{
                setAuthorInitText(slot.text);
                setAuthorInitMeta(slot.meta);
                const pid=slot.meta.source+'_'+String(slot.meta.chapter).padStart(2,'0')+'_'+String(slot.meta.number).padStart(3,'0');
                let passageData=slot.passageData;
                if(!passageData){
                  let pool=loadedPassages.length?loadedPassages:(window.PASSAGES||[]);
                  let found=pool.find(p=>p.id===pid);
                  if(!found&&loadedPassages.length===0){
                    try{
                      const r=await fetch('passages.js?t='+Date.now());
                      const text=await r.text();
                      const modified=text.replace(/^\s*(const|let|var)\s+PASSAGES\s*=/,'window.__LOAD_PASSAGES =');
                      new Function(modified)();
                      const ps=window.__LOAD_PASSAGES||[];
                      setLoadedPassages(ps);
                      found=ps.find(p=>p.id===pid);
                    }catch(e){}
                  }
                  passageData=found?restorePassageData(found):null;
                }
                setAuthorInitPassageData(passageData);
                setAuthorKey(k=>k+1);
                setViewMode('authoring');
              }}
            onText={v=>upSlot(slot.id,{text:v})}
            onMeta={handleMeta}
            onToggle={()=>upSlot(slot.id,{open:!slot.open})}
            onConfirm={()=>upSlot(slot.id,{status:'confirmed'})}
            onSave={()=>upSlot(slot.id,{status:'saved'})}
            onReanalyze={()=>reanalyze(slot)}
            onAnalysis={upAnalysis}
            onGenSum={()=>generateBlockSummaries(slot)}
          />
        ))}
      </div>}
    </div>
  );
}

function SlotCard({slot,viewMode,iB,sB,onText,onMeta,onToggle,onConfirm,onSave,onReanalyze,onAnalysis,onAuthor,onGenSum}){
  const IS=viewMode==='student';
  const st=STATUS[slot.status]||STATUS.idle;
  const {sentences=[],flow={},grammar={}}=slot.analysis||{};
  const {blocks=[],interBlockConnectors=[],keyword='',topicSummary='',structureType=''}=flow;
  const {difficultSentences=[]}=grammar;
  const sm=Object.fromEntries(sentences.map(s=>[s.num,s]));
  const conn=i=>interBlockConnectors[i]||'→';
  const editable=slot.status!=='saved';
  const df=DIFF_STYLE[slot.meta.difficulty]||DIFF_STYLE['중'];

  return(
    <div style={{background:'#fff',borderRadius:12,border:'0.5px solid #e5e5e5',
      marginBottom:12,overflow:'hidden',
      boxShadow:slot.status==='saved'?'0 0 0 2px #185FA5':'none'}}>
      <div style={{padding:'11px 16px',display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',
        borderBottom:slot.open&&(slot.text||slot.analysis)?'0.5px solid #f0f0f0':'none',
        background:slot.status==='saved'?'#EDF4FF':'#fff'}}>

          display:'flex',alignItems:'center',justifyContent:'center',
          fontSize:11,fontWeight:700,flexShrink:0}}>{slot.id+1}</div>
        <span style={{fontSize:10,fontWeight:700,padding:'2px 8px',borderRadius:4,
          background:st.bg,color:st.color}}>{st.label}</span>
        <select value={slot.meta.source} onChange={e=>onMeta(slot.id,'source',e.target.value)}
          style={{...sB,fontSize:12.5,color:'#333',border:'0.5px solid #ddd',borderRadius:5,padding:'4px 8px'}}>
          {SOURCES.map(s=><option key={s} value={s}>{s}</option>)}
        </select>
        {['chapter','number'].map(f=>(
          <div key={f} style={{display:'flex',alignItems:'center',background:'#f5f5f5',
            borderRadius:6,border:'0.5px solid #ddd',overflow:'hidden'}}>
            <button onClick={()=>{const cur=parseInt(slot.meta[f])||1;const max=f==='chapter'?30:99;
              onMeta(slot.id,f,String(Math.max(1,cur-1)).padStart(f==='chapter'?2:3,'0'));}}
              style={{...sB,padding:'4px 8px',fontSize:14,color:'#555',borderRight:'0.5px solid #ddd'}}>▼</button>
            <span style={{fontSize:13,fontWeight:500,color:'#333',minWidth:f==='chapter'?26:30,
              textAlign:'center',padding:'0 2px'}}>{parseInt(slot.meta[f]||1)}{f==='chapter'?'강':'번'}</span>
            <button onClick={()=>{const cur=parseInt(slot.meta[f])||1;const max=f==='chapter'?30:99;
              onMeta(slot.id,f,String(Math.min(max,cur+1)).padStart(f==='chapter'?2:3,'0'));}}
              style={{...sB,padding:'4px 8px',fontSize:14,color:'#555',borderLeft:'0.5px solid #ddd'}}>▲</button>
          </div>
        ))}
        <select value={slot.meta.difficulty} onChange={e=>onMeta(slot.id,'difficulty',e.target.value)}
          style={{...sB,fontSize:12.5,fontWeight:600,color:df.color,border:'0.5px solid #ddd',
            borderRadius:5,padding:'4px 6px',background:df.bg}}>
          {DIFFS.map(d=><option key={d} value={d}>{d}</option>)}
        </select>
        {slot.status==='analyzed'&&<span style={{fontSize:10,color:'#bbb'}}>AI추정</span>}
        {slot.id===0&&slot.status==='idle'&&<span style={{fontSize:10,color:'#bbb'}}>↑ 이후 자동 연번</span>}
        <div style={{flex:1}}/>
        {slot.error&&<span style={{fontSize:11,color:'#c0392b',maxWidth:200,overflow:'hidden',
          textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={slot.error}>{slot.error}</span>}
        {slot.analysis&&(
          <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
            <button onClick={()=>dlHTML(slot,'teacher')} style={{padding:'4px 9px',fontSize:11,background:'#185FA5',color:'#fff',border:'none',borderRadius:5,cursor:'pointer'}}>HTML↓교사</button>
            <button onClick={()=>dlHTML(slot,'student')} style={{padding:'4px 9px',fontSize:11,background:'#2d8a60',color:'#fff',border:'none',borderRadius:5,cursor:'pointer'}}>HTML↓학생</button>
            <button onClick={()=>buildDOCX(slot,'teacher')} style={{padding:'4px 9px',fontSize:11,background:'#1F3864',color:'#fff',border:'none',borderRadius:5,cursor:'pointer'}}>DOCX↓교사</button>
            <button onClick={()=>buildDOCX(slot,'student')} style={{padding:'4px 9px',fontSize:11,background:'#1a5c3a',color:'#fff',border:'none',borderRadius:5,cursor:'pointer'}}>DOCX↓학생</button>
            <button onClick={onAuthor} style={{padding:'4px 9px',fontSize:11,background:'#6A0DAD',color:'#fff',border:'none',borderRadius:5,cursor:'pointer'}}>✏ 출제 저작</button>
          </div>
        )}
        <button onClick={onToggle} style={{...sB,fontSize:13,color:'#ccc',padding:'3px 6px'}}>{slot.open?'▲':'▼'}</button>
      </div>

      {slot.open&&slot.status==='idle'&&(
        <div style={{padding:16}}>
          <textarea value={slot.text} onChange={e=>onText(e.target.value)}
            placeholder={'지문 '+(slot.id+1)+' 붙여넣기...'}
            style={{width:'100%',minHeight:100,padding:'10px 13px',fontSize:14,lineHeight:1.9,
              border:'0.5px solid #e0e0e0',borderRadius:8,resize:'vertical',fontFamily:'inherit',
              color:'#1a1a1a',background:'#fafafa'}}/>
        </div>
      )}

      {slot.open&&slot.analysis&&(
        <div style={{padding:16}}>
          {/* 지문 */}
          <div style={{borderLeft:'4px solid #185FA5',background:'#fafafa',borderRadius:'0 8px 8px 0',
            padding:'12px 16px',fontSize:15,lineHeight:2.2,marginBottom:12,
            wordBreak:'keep-all',overflowWrap:'break-word'}}>
            {sentences.map(s=>{
              const sc=SM[s.symbol]||{};
              return<span key={s.num}>
                <span style={{fontSize:12,fontWeight:700,color:sc.tx,marginRight:4}}>{nStr(s.num)}</span>
                {s.text}
                {' '}
              </span>;
            })}
          </div>

          {/* 범례 */}
          <div style={{display:'flex',flexWrap:'wrap',gap:4,marginBottom:12}}>
            {SYMS.map(sym=>{const sc=SM[sym]||{};return(
              <span key={sym} style={{display:'flex',alignItems:'center',gap:4,fontSize:11,
                color:'#666',padding:'3px 8px',border:'0.5px solid #e5e5e5',borderRadius:4}}>
                <span style={{width:7,height:7,borderRadius:2,background:sc.bd,display:'inline-block'}}/>
                ({sym}) {sc.lbl}
              </span>);
            })}
          </div>

          {/* Block Diagram */}
          <div style={{fontSize:11,fontWeight:700,color:'#888',letterSpacing:'.1em',
            textTransform:'uppercase',marginBottom:8}}>Block Diagram</div>
          <div style={{display:'flex',alignItems:'flex-start',gap:5,marginBottom:12,flexWrap:'wrap'}}>
            {blocks.map((blk,bi)=>{
              const c=BC[blk.color]||BC.blue;
              const bsents=(blk.sentenceNums||[]).map(n=>sm[n]).filter(Boolean);
              return(
                <React.Fragment key={blk.id}>
                  <div style={{flex:'1 1 130px',minWidth:0,borderRadius:10,border:'2px solid '+c.bd}}>
                    <div style={{padding:'8px 11px',background:c.hd,borderBottom:'1.5px solid '+c.bd,borderRadius:'8px 8px 0 0'}}>
                      {IS
                        ?<div style={{borderBottom:'2px solid '+c.bd,height:22,width:'85%',marginBottom:5}}/>
                        :editable
                        ?<><input value={blk.name} onChange={e=>onAnalysis(slot.id,'flow.blocks.'+bi+'.name',e.target.value)}
                            style={{...iB,fontSize:13.5,fontWeight:600,color:c.tx,borderBottomColor:c.bd,marginBottom:2}}/>
                           <input value={blk.nameEn} onChange={e=>onAnalysis(slot.id,'flow.blocks.'+bi+'.nameEn',e.target.value)}
                            style={{...iB,fontSize:11,fontStyle:'italic',fontWeight:600,color:c.tx,borderBottomColor:c.bd,opacity:.85}}/></>
                        :<><div style={{fontSize:13.5,fontWeight:600,color:c.tx,marginBottom:2,wordBreak:'keep-all'}}>{blk.name}</div>
                           <div style={{fontSize:11,color:c.tx,fontStyle:'italic',fontWeight:600,opacity:.85}}>{blk.nameEn}</div></>
                      }
                    </div>
                    <div style={{padding:'7px',background:'#fff'}}>
                      {bsents.map((sent,si)=>{
                        const sc=SM[sent.symbol]||{};
                        const si2=sentences.indexOf(sent);
                        return<div key={sent.num}>
                          {si>0&&<div style={{fontSize:9,color:'#ccc',paddingLeft:22,margin:'1px 0'}}>↓</div>}
                          <div style={{display:'flex',alignItems:'flex-start',gap:6,padding:'5px 6px',
                            borderRadius:6,background:sc.bg,marginBottom:3}}>
                            <span style={{fontSize:15,fontWeight:600,color:sc.tx,flexShrink:0,marginTop:1}}>{nStr(sent.num)}</span>
                            <div style={{flex:1,minWidth:0}}>
                              {editable&&!IS
                                ?<><select value={sent.symbol}
                                    onChange={e=>onAnalysis(slot.id,'sentences.'+si2+'.symbol',e.target.value)}
                                    style={{...sB,fontSize:10,fontWeight:700,padding:'1px 4px',borderRadius:3,
                                      background:sc.bg,color:sc.tx,border:'1px solid '+sc.bd,marginBottom:3,display:'block'}}>
                                    {SYMS.map(s=><option key={s} value={s}>{s}</option>)}
                                  </select>
                                  <textarea value={sent.role}
                                    onChange={e=>onAnalysis(slot.id,'sentences.'+si2+'.role',e.target.value)}
                                    rows={2} style={{...iB,fontSize:10.5,color:'#444',borderBottomColor:'#ddd',
                                      resize:'none',lineHeight:1.4,overflow:'hidden'}}/></>
                                :<>
                                  <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:3}}>
                                    <span style={{fontSize:10,fontWeight:700,padding:'1px 5px',borderRadius:3,
                                      background:sc.bg,color:sc.tx,border:'1px solid '+sc.bd,letterSpacing:'.03em'}}>{sent.symbol}</span>
                                  </div>
                                  <div style={{fontSize:10.5,color:'#333',lineHeight:1.45,wordBreak:'keep-all'}}>{sent.role}</div>

                  {bi<blocks.length-1&&(
                    <div style={{display:'flex',flexDirection:'column',alignItems:'center',
                      justifyContent:'center',gap:2,flexShrink:0,paddingTop:52,minWidth:32}}>
                      {editable&&!IS
                        ?<select value={conn(bi)}
                            onChange={e=>{const cc=[...interBlockConnectors];cc[bi]=e.target.value;
                              onAnalysis(slot.id,'flow.interBlockConnectors',cc);}}
                            style={{...sB,fontSize:16,fontWeight:600,color:'#555',textAlign:'center',width:'100%'}}>
                            {SYMS.map(s=><option key={s} value={s}>{s}</option>)}
                          </select>
                        :<div style={{fontSize:16,fontWeight:600,color:'#555'}}>{conn(bi)}</div>
                      }
                      <div style={{fontSize:9,color:'#bbb',textAlign:'center',lineHeight:1.3}}>

                border:'0.5px solid #e5e5e5',borderRadius:8,padding:'8px 12px'}}>
                <div style={{fontSize:10,fontWeight:700,color:'#888',letterSpacing:'.08em',
                  textTransform:'uppercase',marginBottom:5}}>{lbl}</div>
                {IS?<div style={{borderBottom:'1.5px solid #bbb',height:22}}/>
                  :<textarea value={val}
                    onChange={e=>onAnalysis(slot.id,'flow.'+f,e.target.value)}
                    rows={2} style={{...iB,fontSize:13,color:'#1a1a1a',resize:'none',
                      lineHeight:1.5,overflow:'hidden',wordBreak:'keep-all'}}/>}

            <div style={{flex:1.3,minWidth:100,background:'#f8f8f8',
              border:'0.5px solid #e5e5e5',borderRadius:8,padding:'8px 12px'}}>

                {['통념→반박→결론','문제→해결책','질문→답변'].map(s=>(

              </div>
              :<select value={structureType}
                  onChange={e=>onAnalysis(slot.id,'flow.structureType',e.target.value)}

          {/* 블록 요약 빈칸 섹션 */}
          {(()=>{
            const bs=slot.blockSummaries;
            const hasAnalysis=blocks.length>0;
            if(!hasAnalysis)return null;
            const BC2={blue:{bd:'#185FA5',bg:'#E6F1FB',tx:'#0C447C'},coral:{bd:'#D85A30',bg:'#FAECE7',tx:'#712B13'},
              teal:{bd:'#1D9E75',bg:'#E1F5EE',tx:'#085041'},purple:{bd:'#534AB7',bg:'#EEEDFE',tx:'#3C3489'},
              green:{bd:'#639922',bg:'#EAF3DE',tx:'#173404'},amber:{bd:'#BA7517',bg:'#FAEEDA',tx:'#633806'},gray:{bd:'#5F5E5A',bg:'#F1EFE8',tx:'#2C2C2A'}};

            const renderSummary=(sumText,keywords,bc)=>{
              if(!sumText)return null;
              const parts=sumText.split(/\{([^}]+)\}/g);
              return parts.map((part,i)=>{
                if(i%2===1){
                  if(IS){
                    return<span key={i} style={{display:'inline-block',borderBottom:'1.5px solid '+bc.bd,
                      minWidth:60,marginRight:2}}>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>;

                  return<span key={i} style={{display:'inline-block',background:bc.bg,color:bc.tx,
                    border:'1px solid '+bc.bd,borderRadius:4,padding:'0 5px',fontSize:11.5,fontWeight:500}}>{part}</span>;

            return(
              <div style={{marginBottom:12}}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
                  <div style={{fontSize:11,fontWeight:700,color:'#888',letterSpacing:'.08em',textTransform:'uppercase'}}>
                    블록 요약 빈칸
                  </div>
                  {!IS&&<button onClick={onGenSum} disabled={bs==='loading'}
                    style={{padding:'3px 10px',fontSize:11,background:bs==='loading'?'#ccc':'#185FA5',
                      color:'#fff',border:'none',borderRadius:5,cursor:'pointer'}}>
                    {bs==='loading'?'생성중...':bs?'재생성 ↻':'요약 생성 ↗'}

                </div>
                {bs&&bs!=='loading'&&Array.isArray(bs)?
                  bs.map((item,bi)=>{
                    const blk=blocks.find(b=>b.id===item.blockId)||blocks[bi]||{};

                      <div key={bi} style={{border:'0.5px solid '+bc.bd,borderRadius:8,
                        overflow:'hidden',marginBottom:8}}>
                        <div style={{background:bc.bg,padding:'5px 10px',display:'flex',gap:8,alignItems:'center'}}>
                          <span style={{fontSize:11,fontWeight:600,color:bc.tx}}>{blk.name||item.blockId}</span>
                          <span style={{fontSize:10,color:bc.tx,opacity:.7}}>{blk.nameEn||''}</span>
                        </div>
                        <div style={{padding:'8px 12px',fontSize:12.5,fontStyle:'italic',
                          color:'#333',lineHeight:1.8,wordBreak:'keep-all'}}>
                          {renderSummary(item.summary,item.keywords,bc)}
                        </div>
                      </div>
                    );
                  })
                  :<div style={{fontSize:12,color:'#bbb',padding:'10px 0',textAlign:'center'}}>
                    {IS?'(요약 미생성)':bs==='loading'?'생성 중...':'요약 생성 버튼을 눌러주세요'}
                  </div>
                }
              </div>
            );
          })()}

          {/* 문장별 분석 */}
          {(()=>{
            const dsToShow=IS
              ?sentences.filter(s=>difficultSentences.find(d=>d.num===s.num))
              :sentences;
            if(!dsToShow.length)return null;
            return(
              <div style={{marginBottom:10}}>
                <div style={{fontSize:11,fontWeight:700,color:'#888',letterSpacing:'.08em',
                  textTransform:'uppercase',marginBottom:8}}>
                  {IS?'구문 분석':'문장별 분석 — 끊어읽기 & 구문'}
                </div>
                {dsToShow.map(s=>{
                  const sc=SM[s.symbol]||{};
                  const ds=difficultSentences.find(d=>d.num===s.num);
                  const di=difficultSentences.findIndex(d=>d.num===s.num);
                  const chunks=s.chunks||[];
                  return(
                    <div key={s.num} style={{marginBottom:6,border:'0.5px solid '+sc.bd,
                      borderRadius:8,overflow:'hidden'}}>
                      <div style={{padding:'6px 12px',background:sc.bg,
                        display:'flex',alignItems:'center',gap:7}}>
                        <span style={{fontSize:15,fontWeight:700,color:sc.tx,flexShrink:0}}>{nStr(s.num)}</span>
                        <span style={{fontSize:10,fontWeight:700,padding:'1px 5px',borderRadius:3,
                          background:'rgba(255,255,255,.5)',color:sc.tx,border:'1px solid '+sc.bd,
                          flexShrink:0}}>({s.symbol})</span>
                        <span style={{fontSize:13,color:sc.tx,fontStyle:'italic',
                          wordBreak:'keep-all',overflowWrap:'break-word',lineHeight:1.5}}>
                          {chunks.length>0?chunks.map(c=>c.en||'').join(' / '):s.text}
                        </span>
                      </div>
                      {!IS&&chunks.length>0&&(
                        <div style={{padding:'7px 12px',background:'#fff',borderTop:'0.5px solid #eee'}}>
                          <div style={{fontSize:13,color:'#555',lineHeight:1.9,
                            wordBreak:'keep-all',overflowWrap:'break-word'}}>
                            {chunks.map(c=>c.ko||'').join(' / ')}
                          </div>
                        </div>
                      )}
                      {ds&&(
                        <div style={{padding:'7px 12px',background:'#fafafa',borderTop:'0.5px solid #eee'}}>
                          <div style={{fontSize:10,fontWeight:700,color:'#aaa',marginBottom:4}}>구문 분석</div>
                          {[{lbl:'구조',f:'structure'},{lbl:'해석',f:'translation'},{lbl:'포인트',f:'point'}].map(row=>(
                            <div key={row.f} style={{display:'flex',gap:8,padding:'3px 0',
                              borderBottom:'0.5px dashed #eee',alignItems:'flex-start'}}>
                              <span style={{fontSize:10,fontWeight:700,color:'#888',
                                flexShrink:0,width:34,paddingTop:2}}>{row.lbl}</span>
                              <textarea value={ds[row.f]||''}
                                onChange={e=>{const nd=[...difficultSentences];
                                  nd[di]={...nd[di],[row.f]:e.target.value};
                                  onAnalysis(slot.id,'grammar.difficultSentences',nd);}}
                                rows={1} style={{...iB,fontSize:12.5,color:'#333',resize:'none',
                                  lineHeight:1.5,flex:1,overflow:'hidden',wordBreak:'break-all'}}/>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            );
          })()}

          {/* 액션 */}
          <div style={{display:'flex',gap:8,flexWrap:'wrap',paddingTop:4}}>
            {slot.status==='analyzed'&&(
              <button onClick={onConfirm} style={{padding:'7px 18px',fontSize:13,fontWeight:600,
                background:'#534AB7',color:'#fff',border:'none',borderRadius:7,cursor:'pointer'}}>✓ 흐름 확정</button>
            )}
            {slot.status==='confirmed'&&(
              <button onClick={onSave} style={{padding:'7px 18px',fontSize:13,fontWeight:600,
                background:'#185FA5',color:'#fff',border:'none',borderRadius:7,cursor:'pointer'}}>💾 저장</button>
            )}
            {['analyzed','confirmed','saved'].includes(slot.status)&&(
              <button onClick={onReanalyze} style={{padding:'7px 14px',fontSize:12.5,background:'transparent',
                color:'#534AB7',border:'0.5px solid #534AB7',borderRadius:6,cursor:'pointer'}}>↺ 재분석</button>
            )}

          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
