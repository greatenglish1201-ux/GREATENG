function upsertPassages(currentContent,newEntries){
  const start=currentContent.indexOf('[');
  const end=currentContent.lastIndexOf(']');
  if(start<0||end<0)throw new Error('passages.js 형식 오류');
  let existing;
  try{existing=JSON.parse(currentContent.slice(start,end+1));}
  catch{throw new Error('passages.js JSON 파싱 실패');}
  newEntries.forEach(ne=>{
    const idx=existing.findIndex(e=>e.id===ne.id);
    if(idx>=0)existing[idx]=ne;else existing.push(ne);
  });
  return currentContent.slice(0,start)+JSON.stringify(existing,null,2)+currentContent.slice(end+1);
}

function callClaude(key,sys,user){
  if(!key) throw new Error('API 키 없음');
  return fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':key,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:4096,
      system:sys,messages:[{role:'user',content:user}]})
  }).then(r=>r.json());
}

function parseJSON(text){
  let s=text.replace(/```(?:json)?|```/g,'').trim();
  if(!s.endsWith('}')){const i=s.lastIndexOf('}');if(i>0)s=s.slice(0,i+1);}
  return JSON.parse(s);
}



function Highlighted({text,words}){
  if(!words||!words.length) return React.createElement(React.Fragment,null,text);
  const sorted=[...words].sort((a,b)=>b.length-a.length);
  const esc=w=>w.replace(/[-.*+?^${}()|[\]\\]/g,'\\$&');
  const pat=new RegExp('('+sorted.map(esc).join('|')+')','gi');
  const parts=text.split(pat);
  return React.createElement(React.Fragment,null,...parts.map((p,i)=>
    sorted.some(w=>w.toLowerCase()===p.toLowerCase())
      ?<mark key={i} style={{background:'#FFD700',color:'inherit',borderRadius:2,padding:'0 2px',fontWeight:700}}>{p}</mark>
      :p
  ));
}

const makeSlot=i=>({

function saveSlots(slots){
  try{localStorage.setItem(LS.SLOTS,JSON.stringify(
    slots.map(s=>({id:s.id,text:s.text,meta:s.meta,status:s.status,analysis:s.analysis,error:'',open:s.open}))

}
function loadSlots(){
  try{
    const raw=localStorage.getItem(LS.SLOTS);
    if(!raw)return null;
    const saved=JSON.parse(raw);
    return Array.from({length:5},(_,i)=>{
      const s=saved.find(x=>x.id===i);
      return s?{...makeSlot(i),...s,error:''}:makeSlot(i);
    });
  }catch(e){return null;}
}

/* ── DOCX 학생용 (흑백 A4 1페이지) ── */
function buildDOCX(slot,mode){
  const {Document,Packer,Paragraph,TextRun,Table,TableRow,TableCell,
    AlignmentType,BorderStyle,WidthType,ShadingType,VerticalAlign}=docx;
  const IS=mode==='student';
  const {analysis,meta}=slot;
  if(!analysis)return;
  const {sentences=[],flow={},grammar={}}=analysis;
  const {blocks=[],interBlockConnectors=[],keyword='',topicSummary='',structureType=''}=flow;
  const {difficultSentences=[]}=grammar;
  const sm=Object.fromEntries(sentences.map(s=>[s.num,s]));
  const conn=i=>interBlockConnectors[i]||'→';
  const id=meta.source+'_'+String(meta.chapter).padStart(2,'0')+'_'+String(meta.number).padStart(3,'0');
  const F='Malgun Gothic',P9=18,P8=16,P10=20;
  const nb={style:BorderStyle.NONE,size:0,color:'FFFFFF'};
  const bd=(c='888888',sz=3)=>({style:BorderStyle.SINGLE,size:sz,color:c});
  const nobs={top:nb,bottom:nb,left:nb,right:nb};
  const CM={top:60,bottom:60,left:100,right:100};
  const cell=(children,opts={})=>new TableCell({
    borders:opts.borders||{top:bd(opts.bc||'AAAAAA'),bottom:bd(opts.bc||'AAAAAA'),
      left:bd(opts.bc||'AAAAAA'),right:bd(opts.bc||'AAAAAA')},
    shading:opts.bg?{fill:opts.bg,type:ShadingType.CLEAR}:undefined,
    width:opts.w?{size:opts.w,type:WidthType.DXA}:undefined,
    verticalAlign:VerticalAlign.CENTER,margins:opts.m||CM,children,
  });
  const para=(text,opts={})=>new Paragraph({
    alignment:opts.a||AlignmentType.LEFT,
    spacing:{before:opts.sb||0,after:opts.sa||40},
    border:opts.border,indent:opts.indent,
    children:Array.isArray(text)?text:[new TextRun({
      text:String(text||''),bold:opts.bold||false,size:opts.size||P9,
      color:opts.color||'1a1a1a',font:F,italics:opts.italic||false})],
  });
  const run=(text,opts={})=>new TextRun({
    text:String(text||''),bold:opts.bold||false,size:opts.size||P9,
    color:opts.color||'1a1a1a',font:F,italics:opts.italic||false});
  const blank=()=>new Paragraph({spacing:{after:80,before:0},
    border:{bottom:{style:BorderStyle.SINGLE,size:3,color:'888888',space:1}},
    children:[run(' ',{size:P9})]});
  const ch=[];

  /* 헤더 */
  ch.push(new Table({width:{size:9200,type:WidthType.DXA},columnWidths:[6500,2700],
    rows:[new TableRow({children:[
      cell([para([run('수능 영어 독해 — 흐름 분석',{bold:true,size:P10}),
        run('  '+(IS?'[학생용]':'[교사용]')+'  '+id,{size:P8,color:'666666'})],{sa:0})],
        {borders:nobs,w:6500,m:{top:0,bottom:0,left:0,right:0}}),
      cell([para([run('이름: ',{size:P8,color:'666666'}),run('____________',{size:P8}),
        run('  날짜: ',{size:P8,color:'666666'}),run('________',{size:P8})],
        {a:AlignmentType.RIGHT,sa:0})],
        {borders:nobs,w:2700,m:{top:0,bottom:0,left:0,right:0}}),
    ]})]
  }));
  ch.push(new Paragraph({spacing:{before:0,after:100},
    border:{bottom:{style:BorderStyle.SINGLE,size:8,color:'1a1a1a',space:1}},
    children:[run('')]}));

  /* 지문 */
  ch.push(para('■ 지문',{bold:true,size:P8,color:'333333',sa:60}));
  const pRuns=[];
  sentences.forEach(s=>{
    pRuns.push(run(nStr(s.num)+' ',{bold:true,size:P9}));
    pRuns.push(run(s.text+' ',{size:P9}));
  });
  ch.push(new Paragraph({spacing:{before:0,after:120},
    border:{left:{style:BorderStyle.SINGLE,size:10,color:'555555',space:6}},
    indent:{left:160},children:pRuns}));

  /* Block Diagram */
  ch.push(para('■ 글의 구조',{bold:true,size:P8,color:'333333',sb:60,sa:60}));
  const nc=blocks.length-1;
  const bw=Math.floor((9200-nc*440)/blocks.length);
  const colW=[];blocks.forEach((_,bi)=>{colW.push(bw);if(bi<blocks.length-1)colW.push(440);});
  const hCells=blocks.map((blk,bi)=>{
    const hd=IS?[blank()]:[para(blk.name,{bold:true,size:P9,sa:20}),para(blk.nameEn,{size:P8,italic:true,sa:0})];
    const c=cell(hd,{bg:'EEEEEE',bc:'666666',w:bw});
    if(bi<blocks.length-1)return[c,cell([para(conn(bi),{bold:true,size:P10,color:'444444',a:AlignmentType.CENTER,sa:0})],{borders:nobs,w:440})];
    return[c];
  }).flat();
  const maxS=Math.max(...blocks.map(b=>(b.sentenceNums||[]).length));
  const bRows=Array.from({length:maxS},(_,ri)=>{
    const rCells=blocks.map((blk,bi)=>{
      const sn=(blk.sentenceNums||[])[ri];
      const sent=sn?sm[sn]:null;
      const c=cell(sent?[para([run(nStr(sent.num)+' ',{bold:true,size:P9}),
        run('('+sent.symbol+')  ',{size:P8}),run(sent.role,{size:P8,color:'444444'})],{sa:0})]:[para('',{sa:0})],
        {bc:'BBBBBB',w:bw});
      if(bi<blocks.length-1)return[c,cell([para('',{sa:0})],{borders:nobs,w:440})];
      return[c];
    }).flat();
    return new TableRow({children:rCells});
  });
  ch.push(new Table({width:{size:9200,type:WidthType.DXA},columnWidths:colW,
    rows:[new TableRow({children:hCells}),...bRows]}));
  ch.push(para('',{sa:80}));

  /* 핵심소재/주제요약/구조 — 표 없이 텍스트 */
  ch.push(new Paragraph({spacing:{before:0,after:50},children:[run('▸ 핵심 소재: ',{bold:true,size:P8}),IS?run('_________________________',{size:P8}):run(keyword,{size:P9})]}));
  ch.push(new Paragraph({spacing:{before:0,after:50},children:[run('▸ 주제 요약: ',{bold:true,size:P8}),IS?run('_________________________',{size:P8}):run(topicSummary,{size:P9})]}));
  ch.push(new Paragraph({spacing:{before:0,after:100},children:[run('▸ 구조 유형: ',{bold:true,size:P8}),IS?run('_________________________',{size:P8}):run(structureType,{size:P9})]}));

  /* 문장별 분석 */
  const dsToShow=IS?sentences.filter(s=>difficultSentences.find(d=>d.num===s.num)):sentences;
  if(dsToShow.length){
    ch.push(para(IS?'■ 구문 분석':'■ 문장별 분석 (끊어읽기 + 구문)',{bold:true,size:P8,color:'333333',sb:60,sa:60}));
    dsToShow.forEach(s=>{
      const ds=difficultSentences.find(d=>d.num===s.num);
      const chunks=s.chunks||[];
      ch.push(new Paragraph({spacing:{before:0,after:30},
        border:{bottom:{style:BorderStyle.SINGLE,size:3,color:'CCCCCC',space:1}},
        children:[run(nStr(s.num)+' ('+s.symbol+')  ',{bold:true,size:P9}),run(s.text,{size:P8,italic:true,color:'333333'})]}));
      if(!IS&&chunks.length){
        ch.push(new Paragraph({spacing:{before:30,after:0},indent:{left:200},
          children:[run(chunks.map(c=>c.en||'').join(' / '),{size:P8,italic:true})]}));
        ch.push(new Paragraph({spacing:{before:0,after:40},indent:{left:200},
          children:[run(chunks.map(c=>c.ko||'').join(' / '),{size:P8,color:'444444'})]}));
      }
      if(ds){
        [{l:'구조',f:'structure'},{l:'해석',f:'translation'},{l:'포인트',f:'point'}].forEach(r=>{
          ch.push(new Paragraph({spacing:{before:0,after:20},indent:{left:200},children:[
            run('['+r.l+'] ',{bold:true,size:P8,color:'555555'}),
            IS&&r.f==='translation'?run('______________________________',{size:P8}):run(ds[r.f]||'',{size:P8}),
          ]}));
        });
      }
      ch.push(para('',{sa:60}));
    });
  }

  const doc=new Document({
    styles:{default:{document:{run:{font:F,size:P9}}}},
    sections:[{properties:{page:{size:{width:11906,height:16838},margin:{top:700,right:700,bottom:700,left:700}}},children:ch}]
  });
  Packer.toBlob(doc).then(blob=>saveAs(blob,id+'_'+(IS?'학생용':'교사용')+'.docx'));
}

function buildHTML(slot,mode){
  const IS=mode==='student';
  const {analysis,meta}=slot;
  if(!analysis)return'';
  const {sentences=[],flow={},grammar={}}=analysis;
  const {blocks=[],interBlockConnectors=[],keyword='',topicSummary='',structureType=''}=flow;
  const {difficultSentences=[]}=grammar;
  const sm=Object.fromEntries(sentences.map(s=>[s.num,s]));
  const conn=i=>interBlockConnectors[i]||'→';
  const id=meta.source+'_'+String(meta.chapter).padStart(2,'0')+'_'+String(meta.number).padStart(3,'0');
  const esc=w=>w.replace(/[-.*+?^${}()|[\]\\]/g,'\\$&');
  const hlHTML=(text,words)=>{
    if(!words||!words.length)return text;
    const sorted=[...words].sort((a,b)=>b.length-a.length);
    const pat=new RegExp('('+sorted.map(esc).join('|')+')','gi');
    return text.replace(pat,m=>'<mark style="background:#FFD700;color:inherit;border-radius:2px;padding:0 2px;font-weight:700">'+m+'</mark>');
  };
  const passHTML=sentences.map(s=>{
    const sc=SM[s.symbol]||{};
    return'<span><span style="font-size:12px;font-weight:700;color:'+sc.tx+';margin-right:4px">'+nStr(s.num)+'</span>'+s.text+' </span>';
  }).join('');
  const blockCards=blocks.map((blk,bi)=>{
    const c=BC[blk.color]||BC.blue;

    const hd=IS
      ?'<div style="border-bottom:2px solid '+c.bd+';height:22px;width:85%;margin-bottom:5px"></div>'
      :'<div style="font-size:1em;font-weight:700;color:'+c.tx+'">'+blk.name+'</div><div style="font-size:.72em;color:'+c.tx+';font-style:italic;font-weight:600;opacity:.85">'+blk.nameEn+'</div>';

      const sc=SM[sent.symbol]||{};

      return arr+'<div style="display:flex;align-items:flex-start;gap:6px;padding:5px 7px;border-radius:6px;background:'+sc.bg+';margin-bottom:3px"><span style="font-size:1em;font-weight:700;color:'+sc.tx+';flex-shrink:0;margin-top:1px">'+nStr(sent.num)+'</span><div style="flex:1;min-width:0"><span style="font-size:.7em;font-weight:700;padding:1px 4px;border-radius:3px;background:rgba(255,255,255,.6);color:'+sc.tx+';border:1px solid '+sc.bd+'">'+sent.symbol+'</span><div style="font-size:.75em;color:#444;word-break:keep-all;line-height:1.4;margin-top:2px">'+sent.role+'</div></div></div>';

    return'<div style="flex:1 1 130px;min-width:0;border-radius:10px;border:2px solid '+c.bd+'"><div style="padding:8px 11px;background:'+c.hd+';border-bottom:1.5px solid '+c.bd+';border-radius:8px 8px 0 0">'+hd+'</div><div style="padding:7px;background:#fff">'+rows+'</div></div>'+connDiv;
  }).join('');
  const dsToShow=IS?sentences.filter(s=>difficultSentences.find(d=>d.num===s.num)):sentences;
  const analysisHTML=dsToShow.map(s=>{
    const sc=SM[s.symbol]||{};

function dlHTML(slot,mode){
  const html=buildHTML(slot,mode);
  const id=slot.meta.source+'_'+String(slot.meta.chapter).padStart(2,'0')+'_'+String(slot.meta.number).padStart(3,'0');
  const blob=new Blob([html],{type:'text/html;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=id+'_'+(mode==='teacher'?'교사용':'학생용')+'.html';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}

Rules: topic.candidates[0]=correct. blank.keyword=exact substring. order.possible=false if <7 sentences. grammar/vocab word=exact word from that sentence. answer=1-based index of wrong item.

function splitTexts(text){
  // 1. --- 구분선
  if(text.indexOf('\n---')>=0)return text.split(/\n---+\n?/).map(t=>t.trim()).filter(Boolean);
  // 2. 문번호 패턴: 줄 시작 숫자(18~50) + 다음/밑줄/주어진/글/빈칸 등
  const byNum=text.split(/(?=\n\s*(?:[1-9]\d)\s+(?:다음|밑줄|주어진|글의|빈칸|흐름|문맥|어법|어휘|아래))/).map(t=>t.trim()).filter(Boolean);
  if(byNum.length>1)return byNum.filter(p=>/[A-Za-z]{15,}/.test(p));
  // 3. 빈 줄 2개 이상으로 분리
  const byBlank=text.split(/\n{3,}/).map(t=>t.trim()).filter(Boolean);
  if(byBlank.length>1)return byBlank.filter(p=>/[A-Za-z]{15,}/.test(p));
  // 4. 단일 지문
  return[text.trim()].filter(Boolean);
}

function buildPassageData(a,pfx,ch,num){
  const cs=String(ch).padStart(2,'0');
  const ns=String(num).padStart(3,'0');
  const sc=a.summary.candidates[0];
  return{
    id:`${pfx}_${cs}_${ns}`,difficulty:a.difficulty||'보통',title:a.title||'제목',
    sentences:a.sentences||[],abstract:a.abstract||'',
    topic_options:a.topic.candidates,topic_answer:1,
    blank_sel:0,blank_sentence_index:a.blank.candidates[0].sentence_index,
    blank_target:a.blank.candidates[0].keyword,
    blank_candidates:a.blank.candidates,
    blank_options:[a.blank.candidates[0].keyword,...a.blank.candidates[0].distractors],blank_answer:1,
    order_given_index:0,order_blocks:a.order.possible!==false&&a.order.blocks?a.order.blocks:[],
    order_options:['(A)-(B)-(C)','(B)-(C)-(A)','(C)-(A)-(B)','(B)-(A)-(C)','(A)-(C)-(B)'],order_answer:1,
    summary_sel:0,summary_candidates:a.summary.candidates,summary_template:sc.template,
    summary_A_options:[sc.A_correct,...sc.A_distractors],summary_A_answer:1,
    summary_B_options:[sc.B_correct,...sc.B_distractors],summary_B_answer:1,
    implication_sentence_index:a.implication.possible!==false?a.implication.sentence_index:0,
    implication_keyword:a.implication.possible!==false?a.implication.keyword:'',
    implication_options:a.implication.possible!==false?a.implication.candidates:['','','','',''],implication_answer:1,
    irrel_sel:0,irrel_candidates:a.irrelevant.candidates,irrel_insert_pos:a.irrelevant.recommended_pos||1,irrel_confirmed:false,
    irrelevant_sentence_index:a.irrelevant.recommended_pos||1,
    insert_sel:0,insert_candidates:a.insert.candidates,
    insert_sentence:a.insert.candidates[0].sentence,insert_answer:a.insert.candidates[0].pos,
    grammar_sets:a.grammar.sets,grammar_sel:0,grammar_answer:a.grammar.sets[0].answer,
    vocab_sets:a.vocab.sets,vocab_sel:0,vocab_answer:a.vocab.sets[0].answer,
    aGroup:[sc.A_correct,...sc.A_distractors].slice(0,3),bGroup:[sc.B_correct,...sc.B_distractors].slice(0,3)
  };
}

function AuthoringTool({apiKey, ghToken, ghRepo, initialText}){
  const [step,setStep]=useState('setup'); // setup|proc|edit|out
  const [rawText,setRawText]=useState('');
  React.useEffect(()=>{if(initialText){setRawText(initialText);setStep('setup');}},[initialText]);
  const [pfx,setPfx]=useState('27STYD');
  const [chapter,setChapter]=useState(1);
  const [startNum,setStartNum]=useState(1);
  const [passages,setPassages]=useState([]); // [{rawText,data,error,loading}]
  const [pi,setPi]=useState(0);
  const [at,setAt]=useState(0);
  const [outText,setOutText]=useState('');
  const [copied,setCopied]=useState(false);
  const [err,setErr]=useState('');
  const [ghSaving,setGhSaving]=useState(false);

  const saveToGitHub=async(jsonText)=>{
    if(!ghToken||!ghRepo){alert('설정에서 GitHub Token과 저장소를 먼저 입력해주세요.');return;}
    setGhSaving(true);
    try{
      const path='passages.js';
      const apiBase=`https://api.github.com/repos/${ghRepo}/contents/${path}`;
      // 1. 현재 파일 읽기
      const getRes=await fetch(apiBase,{headers:{'Authorization':`token ${ghToken}`,'Accept':'application/vnd.github.v3+json'}});
      if(!getRes.ok)throw new Error('passages.js 읽기 실패: '+getRes.status);
      const fileData=await getRes.json();
      const currentContent=decodeURIComponent(escape(atob(fileData.content.replace(/\n/g,''))));
      // 2. 새 내용 append
      const parsedNew=JSON.parse('['+jsonText.replace(/^\/\/.*\n/gm,'').trim()+']');
      const newContent=upsertPassages(currentContent,parsedNew);
      // 3. 커밋
      const encoded=btoa(unescape(encodeURIComponent(newContent)));
      const putRes=await fetch(apiBase,{
        method:'PUT',
        headers:{'Authorization':`token ${ghToken}`,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
        body:JSON.stringify({message:`Add ${passages.filter(p=>p.data).map(p=>p.data.id).join(', ')}`,content:encoded,sha:fileData.sha})
      });
      if(!putRes.ok)throw new Error('커밋 실패: '+putRes.status);
      alert('✓ GitHub 저장 완료! 30초 후 자동 배포됩니다.');
    }catch(e){alert('저장 실패: '+e.message);}
    setGhSaving(false);
  };

  const P=()=>passages[pi]?.data;

  const upP=(patch)=>setPassages(prev=>prev.map((p,i)=>i===pi?{...p,data:{...p.data,...patch}}:p));
  const upPDeep=(fn)=>setPassages(prev=>prev.map((p,i)=>i===pi?{...p,data:fn({...p.data})}:p));

  const analyze=async()=>{
    if(!apiKey){setErr('설정 메뉴에서 API Key를 먼저 입력해주세요.');return;}
    if(!rawText.trim()){setErr('지문 텍스트를 입력해주세요.');return;}
    setErr('');
    const parts=splitTexts(rawText);
    const init=parts.map((t,i)=>({id:i,rawText:t,data:null,error:null,loading:false}));
    setPassages(init);setStep('proc');
    const upd=[...init];
    for(let i=0;i<parts.length;i++){
      upd[i]={...upd[i],loading:true};setPassages([...upd]);
      try{
        const d=await callClaude(apiKey,'Return ONLY valid JSON, no markdown.',AUTH_PROMPT(parts[i]));
        if(d.error)throw new Error(d.error.message||'API error');
        const a=parseJSON(d.content[0].text);
        upd[i]={...upd[i],data:buildPassageData(a,pfx,chapter,startNum+i),loading:false};
      }catch(e){upd[i]={...upd[i],error:e.message,loading:false};}
      setPassages([...upd]);
    }
    const first=upd.findIndex(p=>p.data);
    if(first>=0){setPi(first);setAt(0);setStep('edit');}
  };

  const getBlockLabel=(p,i)=>{
    if(i===p.order_given_index)return'A';
    let l='';(p.order_blocks||[]).forEach(b=>{if(b.sentence_indices.includes(i))l=b.label;});return l;
  };

  const bdg=(txt,c)=><span style={{fontSize:10,fontWeight:700,padding:'1px 7px',borderRadius:20,marginRight:5,background:c+'22',color:c}}>{txt}</span>;

  const renderSent=(p,s,i)=>{
    const bc=p.blank_candidates?.[p.blank_sel];
    if(at===1&&bc?.sentence_index===i&&bc.keyword){
      const idx=s.indexOf(bc.keyword);
      if(idx>=0)return<span style={{fontSize:12,lineHeight:1.6}}>{s.slice(0,idx)}<span style={{background:'#993C1D22',borderBottom:'2px solid #993C1D',fontWeight:700,padding:'0 2px',color:'#993C1D'}}>{bc.keyword}</span>{s.slice(idx+bc.keyword.length)}</span>;
    }
    if(at===4&&i===p.implication_sentence_index&&p.implication_keyword){
      const idx=s.indexOf(p.implication_keyword);
      if(idx>=0)return<span style={{fontSize:12,lineHeight:1.6}}>{s.slice(0,idx)}<u style={{textDecorationColor:'#993556',fontWeight:600}}>{p.implication_keyword}</u>{s.slice(idx+p.implication_keyword.length)}</span>;
    }
    if((at===7||at===8)){
      const sets=at===7?p.grammar_sets:p.vocab_sets;
      const sel=at===7?p.grammar_sel:p.vocab_sel;
      const item=sets?.[sel]?.items?.find(it=>it.sent===i);
      if(item){
        const idx=s.indexOf(item.word);const c=item.correct?'#185FA5':'#E24B4A';
        const num=sets[sel].items.indexOf(item)+1;
        if(idx>=0)return<span style={{fontSize:12,lineHeight:1.6,color:'#666'}}>{s.slice(0,idx)}<span style={{background:c+'22',borderBottom:'2px solid '+c,fontWeight:700,padding:'0 3px',color:c}}>{num}. {item.word}</span>{s.slice(idx+item.word.length)}</span>;
      }
    }
    return<span style={{fontSize:12,lineHeight:1.6,color:'#555'}}>{s}</span>;
  };

  const LeftPanel=({p})=>{
    const irrelPos=at===5?p.irrel_insert_pos:-1;
    const insPos=at===6?p.insert_answer:-1;
    const rows=[];
    for(let i=0;i<=p.sentences.length;i++){
      if(at===5){
        const isP=irrelPos===i;
        rows.push(<div key={'ip'+i} onClick={()=>upP({irrel_insert_pos:i})} style={{cursor:'pointer',display:'flex',alignItems:'center',gap:4,margin:'2px 0',padding:'2px 6px',borderRadius:4,background:isP?'#0F6E5614':'transparent',border:'1px dashed '+(isP?'#0F6E56':'transparent')}}>
          <span style={{fontSize:10,color:isP?'#0F6E56':'#ccc',fontWeight:700}}>▶ {isP?'여기에 삽입':'클릭'}</span></div>);
        if(isP)rows.push(<div key={'iprev'+i} style={{margin:'2px 0 4px 24px',padding:'6px 9px',borderLeft:'3px solid #0F6E56',borderRadius:4,background:'#0F6E5610',fontSize:12,color:'#0F6E56',fontStyle:'italic'}}>{p.irrel_candidates?.[p.irrel_sel]}</div>);
      }
      if(at===6){
        const isP=insPos===i;
        rows.push(<div key={'inp'+i} onClick={()=>upP({insert_answer:i})} style={{cursor:'pointer',display:'flex',alignItems:'center',gap:4,margin:'2px 0',padding:'2px 6px',borderRadius:4,background:isP?'#534AB714':'transparent',border:'1px dashed '+(isP?'#534AB7':'transparent')}}>
          <span style={{fontSize:10,color:isP?'#534AB7':'#ccc',fontWeight:700}}>▶ {isP?'여기에 삽입':'클릭'}</span></div>);
        if(isP)rows.push(<div key={'inprev'+i} style={{margin:'2px 0 4px 24px',padding:'6px 9px',borderLeft:'3px solid #534AB7',borderRadius:4,background:'#534AB710',fontSize:12,color:'#534AB7',fontStyle:'italic'}}>{p.insert_sentence}</div>);
      }
      if(i===p.sentences.length)break;
      const s=p.sentences[i];
      let bg='transparent',bl='3px solid transparent';
      const bc_=p.blank_candidates?.[p.blank_sel];
      if(at===1&&bc_?.sentence_index===i){bg='#993C1D08';bl='3px solid #993C1D';}
      else if(at===1){p.blank_candidates?.forEach((c,ci)=>{if(ci!==p.blank_sel&&c.sentence_index===i){bg='#854F0B06';bl='3px solid #854F0B33';}});}
      else if(at===2){const bl2=getBlockLabel(p,i);if(bl2){const bc2=BLK_C[bl2];bg=bc2+'12';bl='3px solid '+bc2;}}
      else if(at===4&&i===p.implication_sentence_index){bg='#99355610';bl='3px solid #993556';}
      else if((at===7||at===8)){const sets=at===7?p.grammar_sets:p.vocab_sets;const sel=at===7?p.grammar_sel:p.vocab_sel;const item=sets?.[sel]?.items?.find(it=>it.sent===i);if(item){const c=item.correct?'#185FA5':'#E24B4A';bg=c+'08';bl='3px solid '+c;}}
      rows.push(<div key={i} style={{display:'flex',gap:6,marginBottom:5,padding:'5px 8px',borderRadius:6,background:bg,borderLeft:bl}}>
        <span style={{color:'#bbb',fontFamily:'monospace',fontSize:11,flexShrink:0,marginTop:2,minWidth:20}}>[{i}]</span>
        {at===2&&getBlockLabel(p,i)&&<span style={{fontSize:11,fontWeight:700,color:BLK_C[getBlockLabel(p,i)],marginRight:2,flexShrink:0,marginTop:2}}>({getBlockLabel(p,i)})</span>}
        {renderSent(p,s,i)}
      </div>);
    }
    return<div style={{overflowY:'auto',maxHeight:500}}><div style={{fontSize:11,fontWeight:600,color:'#888',marginBottom:8}}>{at===5||at===6?'▶ 클릭으로 삽입 위치 선택':'전체 지문'}</div>{rows}</div>;
  };

  const RightPanel=({p})=>{
    const T=AUTHOR_TABS[at];
    const optBtn=(sel,isRec,n,txt,onclick)=><button onClick={onclick} style={{display:'block',width:'100%',textAlign:'left',marginBottom:5,padding:'9px 11px',borderRadius:8,background:sel?T.c+'18':'transparent',border:`0.5px solid ${sel?T.c:'#e5e5e5'}`,color:sel?T.c:'#1d1d1f',cursor:'pointer',fontSize:13,lineHeight:1.45}}>
      {sel&&bdg('✓ 정답',T.c)}{isRec&&!sel&&bdg('AI 추천','#854F0B')}
      <span style={{fontSize:11,color:'#bbb',marginRight:4}}>({n})</span>{txt}</button>;

    if(at===0)return<div>{p.topic_options.map((o,i)=>optBtn(p.topic_answer===i+1,i===0,i+1,o,()=>upP({topic_answer:i+1})))}</div>;

    if(at===1)return<div>
      <div style={{fontSize:11,fontWeight:600,color:'#888',marginBottom:8}}>① 빈칸 후보 선택</div>
      {p.blank_candidates?.map((c,ci)=><button key={ci} onClick={()=>upPDeep(p=>{const upd={...p,blank_sel:ci,blank_sentence_index:c.sentence_index,blank_target:c.keyword,blank_options:[c.keyword,...c.distractors]};return upd;})} style={{display:'block',width:'100%',textAlign:'left',marginBottom:7,background:p.blank_sel===ci?'#993C1D10':'transparent',border:`1px solid ${p.blank_sel===ci?'#993C1D':'#e5e5e5'}`,borderRadius:9,padding:'10px 12px',cursor:'pointer'}}>
        {p.blank_sel===ci&&bdg('✓','#993C1D')}{ci===0&&bdg('AI 추천','#854F0B')}
        <div style={{fontSize:11,color:'#bbb',marginBottom:2}}>문장 [{c.sentence_index}]</div>
        <div style={{fontSize:13,fontWeight:p.blank_sel===ci?600:400,color:p.blank_sel===ci?'#993C1D':'#1d1d1f'}}>"{c.keyword}"</div>
      </button>)}
      <hr style={{border:'none',borderTop:'0.5px solid #eee',margin:'10px 0'}}/>
      <div style={{fontSize:11,fontWeight:600,color:'#888',marginBottom:8}}>② 오답 선택지</div>
      <div style={{padding:'7px 9px',background:'#993C1D10',borderRadius:6,fontSize:12,color:'#993C1D',marginBottom:8}}><b>정답:</b> {p.blank_target}</div>
      {[0,1,2,3].map(i=><div key={i} style={{display:'flex',alignItems:'center',gap:5,marginBottom:5}}>
        <span style={{fontSize:11,color:'#bbb',minWidth:32}}>오답{i+1}</span>
        <input defaultValue={p.blank_options[i+1]||''} onBlur={e=>{const opts=[...p.blank_options];opts[i+1]=e.target.value;upP({blank_options:opts});}} style={{flex:1,fontSize:12,padding:'5px 8px',border:'0.5px solid #e5e5e5',borderRadius:6}}/>
      </div>)}
    </div>;

    if(at===2){
      if(!p.order_blocks?.length)return<p style={{color:'#E24B4A',fontSize:13}}>⚠ 순서배열 불가 (문장 수 부족)</p>;
      return<div>
        <div style={{fontSize:11,fontWeight:600,color:'#888',marginBottom:8}}>블록 구성 확인</div>
        {[{label:'A',sentence_indices:[p.order_given_index]},...p.order_blocks].map(b=>{
          const c=BLK_C[b.label]||'#888';
          return<div key={b.label} style={{marginBottom:8,border:`1px solid ${c}44`,borderRadius:9,overflow:'hidden'}}>
            <div style={{background:c+'22',padding:'5px 11px',fontSize:11,fontWeight:700,color:c}}>({b.label}) 문장[{b.sentence_indices.join(', ')}]</div>
            <div style={{padding:'8px 11px',fontSize:12,color:'#555',lineHeight:1.5}}>
              {b.sentence_indices.map((idx,n)=><div key={idx}>{n>0&&<div style={{borderTop:'0.5px solid #f0f0f0',margin:'3px 0'}}/>}<span style={{color:'#bbb',fontSize:10,marginRight:4}}>[{idx}]</span>{p.sentences[idx]}</div>)}
            </div>
          </div>;
        })}
        <hr style={{border:'none',borderTop:'0.5px solid #eee',margin:'10px 0'}}/>
        {p.order_options.map((o,i)=>optBtn(p.order_answer===i+1,i===0,i+1,o,()=>upP({order_answer:i+1})))}
      </div>;
    }

    if(at===3)return<div>
      <div style={{fontSize:11,fontWeight:600,color:'#888',marginBottom:8}}>① 요약문 템플릿 선택</div>
      {p.summary_candidates?.map((c,ci)=>{
        const tpl=c.template.replace('________(A)________',`<span style="background:#854F0B22;color:#854F0B;fontWeight:700;padding:0 3px">(A):${c.A_correct}</span>`).replace('________(B)________',`<span style="background:#185FA522;color:#185FA5;fontWeight:700;padding:0 3px">(B):${c.B_correct}</span>`);
        const sel=p.summary_sel===ci;
        return<button key={ci} onClick={()=>upPDeep(p=>({...p,summary_sel:ci,summary_template:c.template,summary_A_options:[c.A_correct,...c.A_distractors],summary_B_options:[c.B_correct,...c.B_distractors],summary_A_answer:1,summary_B_answer:1}))} style={{display:'block',width:'100%',textAlign:'left',marginBottom:8,background:sel?'#f5f5f7':'transparent',border:`1px solid ${sel?'#185FA5':'#e5e5e5'}`,borderRadius:9,padding:'10px 12px',cursor:'pointer'}}>
          {sel&&bdg('✓','#185FA5')}{ci===0&&bdg('AI 추천','#854F0B')}
          <div style={{fontSize:12,lineHeight:1.7,marginTop:4}} dangerouslySetInnerHTML={{__html:tpl}}/>
        </button>;
      })}
      <hr style={{border:'none',borderTop:'0.5px solid #eee',margin:'10px 0'}}/>
      {[{key:'A',c:'#854F0B',opts:'summary_A_options',ans:'summary_A_answer'},{key:'B',c:'#185FA5',opts:'summary_B_options',ans:'summary_B_answer'}].map(({key,c,opts,ans})=>
        <div key={key} style={{padding:10,background:c+'08',border:`0.5px solid ${c}44`,borderRadius:8,marginBottom:8}}>
          <div style={{fontSize:11,fontWeight:700,color:c,marginBottom:5}}>빈칸 ({key})</div>
          <input defaultValue={p[opts]?.[0]||''} onBlur={e=>{const o=[...p[opts]];o[0]=e.target.value;upP({[opts]:o});}} style={{width:'100%',fontSize:13,fontWeight:600,padding:'5px 8px',border:'0.5px solid #e5e5e5',borderRadius:6,marginBottom:5}}/>
          {[0,1,2,3].map(i=><input key={i} defaultValue={p[opts]?.[i+1]||''} onBlur={e=>{const o=[...p[opts]];o[i+1]=e.target.value;upP({[opts]:o});}} placeholder={`오답${i+1}`} style={{width:'100%',fontSize:12,padding:'4px 8px',border:'0.5px solid #e5e5e5',borderRadius:6,marginBottom:4}}/>)}
        </div>
      )}
      <textarea defaultValue={p.summary_template} onBlur={e=>upP({summary_template:e.target.value})} rows={3} style={{width:'100%',fontSize:12,padding:'7px 9px',border:'0.5px solid #e5e5e5',borderRadius:7,resize:'vertical',marginBottom:6}}/>
    </div>;

    if(at===4)return<div>
      <div style={{padding:'8px 10px',background:'#99355610',borderRadius:7,marginBottom:10,fontSize:12}}>
        <b style={{color:'#993556'}}>밑줄 표현:</b> {p.implication_keyword}<div style={{color:'#888',fontSize:11,marginTop:2}}>문장 [{p.implication_sentence_index}]</div>
      </div>
      {p.implication_options?.map((o,i)=>optBtn(p.implication_answer===i+1,i===0,i+1,o,()=>upP({implication_answer:i+1})))}
    </div>;

    if(at===5)return<div>
      <div style={{fontSize:11,fontWeight:600,color:'#888',marginBottom:8}}>① 무관 문장 선택</div>
      {p.irrel_candidates?.map((s,ci)=><button key={ci} onClick={()=>upP({irrel_sel:ci})} style={{display:'block',width:'100%',textAlign:'left',marginBottom:7,background:p.irrel_sel===ci?'#0F6E5610':'transparent',border:`1px solid ${p.irrel_sel===ci?'#0F6E56':'#e5e5e5'}`,borderRadius:9,padding:'10px 12px',cursor:'pointer'}}>
        {p.irrel_sel===ci&&bdg('✓','#0F6E56')}{ci===0&&bdg('AI 추천','#854F0B')}
        <div style={{fontSize:12,lineHeight:1.6,marginTop:4}}>{s}</div>
      </button>)}
      <hr style={{border:'none',borderTop:'0.5px solid #eee',margin:'10px 0'}}/>
      <div style={{fontSize:11,fontWeight:600,color:'#888',marginBottom:6}}>② 직접 수정</div>
      <textarea defaultValue={p.irrel_candidates?.[p.irrel_sel]||''} onBlur={e=>{const c=[...(p.irrel_candidates||[])];c[p.irrel_sel]=e.target.value;upP({irrel_candidates:c});}} rows={3} style={{width:'100%',fontSize:12,padding:'7px',border:'0.5px solid #e5e5e5',borderRadius:7,resize:'vertical',marginBottom:6}}/>
      {!p.irrel_confirmed?
        <button onClick={()=>upPDeep(p=>{
          const pos=p.irrel_insert_pos||0,sent=p.irrel_candidates?.[p.irrel_sel]||'';
          const ns=[...p.sentences];ns.splice(pos,0,sent);
          const shift=x=>x>=pos?x+1:x;
          return{...p,sentences:ns,irrelevant_sentence_index:pos,irrel_confirmed:true,
            blank_sentence_index:shift(p.blank_sentence_index),insert_answer:shift(p.insert_answer),
            implication_sentence_index:shift(p.implication_sentence_index),
            order_given_index:shift(p.order_given_index),
            order_blocks:(p.order_blocks||[]).map(b=>({...b,sentence_indices:b.sentence_indices.map(shift)})),
            grammar_sets:(p.grammar_sets||[]).map(s=>({...s,items:s.items.map(it=>({...it,sent:shift(it.sent)}))})),
            vocab_sets:(p.vocab_sets||[]).map(s=>({...s,items:s.items.map(it=>({...it,sent:shift(it.sent)}))}))};
        })} style={{width:'100%',padding:'9px',borderRadius:8,background:'#0F6E5618',border:'1px solid #0F6E56',color:'#0F6E56',fontWeight:600,cursor:'pointer',fontSize:13}}>✓ 확정 — sentences에 삽입</button>
        :<div style={{padding:'8px 10px',background:'#0F6E5610',borderRadius:7,fontSize:12,color:'#0F6E56'}}>✓ 확정됨 — 문장[{p.irrelevant_sentence_index}]이 무관문장</div>}
    </div>;

    if(at===6)return<div>
      <div style={{fontSize:11,fontWeight:600,color:'#888',marginBottom:8}}>① 삽입 문장 선택</div>
      {p.insert_candidates?.map((c,ci)=><button key={ci} onClick={()=>upP({insert_sel:ci,insert_sentence:c.sentence,insert_answer:c.pos})} style={{display:'block',width:'100%',textAlign:'left',marginBottom:7,background:p.insert_sel===ci?'#534AB710':'transparent',border:`1px solid ${p.insert_sel===ci?'#534AB7':'#e5e5e5'}`,borderRadius:9,padding:'10px 12px',cursor:'pointer'}}>
        {p.insert_sel===ci&&bdg('✓','#534AB7')}{ci===0&&bdg('AI 추천','#854F0B')}
        <div style={{fontSize:12,lineHeight:1.6,marginTop:4}}>{c.sentence}</div>
      </button>)}
      <hr style={{border:'none',borderTop:'0.5px solid #eee',margin:'10px 0'}}/>
      <div style={{fontSize:11,fontWeight:600,color:'#888',marginBottom:6}}>② 직접 수정</div>
      <textarea defaultValue={p.insert_sentence||''} onBlur={e=>upP({insert_sentence:e.target.value})} rows={3} style={{width:'100%',fontSize:12,padding:'7px',border:'0.5px solid #e5e5e5',borderRadius:7,resize:'vertical'}}/>
    </div>;

    if(at===7||at===8){
      const isG=at===7;
      const sets=isG?p.grammar_sets:p.vocab_sets;
      const sel=isG?p.grammar_sel:p.vocab_sel;
      const ans=isG?p.grammar_answer:p.vocab_answer;
      const selKey=isG?'grammar_sel':'vocab_sel';
      const ansKey=isG?'grammar_answer':'vocab_answer';
      const c='#E24B4A';
      return<div>
        <div style={{fontSize:11,fontWeight:600,color:'#888',marginBottom:8}}>① 세트 선택</div>
        {sets?.map((set,si)=><button key={si} onClick={()=>upP({[selKey]:si,[ansKey]:set.answer})} style={{display:'block',width:'100%',textAlign:'left',marginBottom:8,background:sel===si?'#f5f5f7':'transparent',border:`1px solid ${sel===si?'#185FA5':'#e5e5e5'}`,borderRadius:9,padding:'10px 12px',cursor:'pointer'}}>
          {sel===si&&bdg('✓','#185FA5')}{si===0&&bdg('AI 추천','#854F0B')}
          <div style={{marginTop:6,display:'flex',flexWrap:'wrap',gap:4}}>
            {set.items.map((item,ii)=>{const ic=item.correct?'#185FA5':'#E24B4A';return<span key={ii} style={{fontSize:11,padding:'2px 7px',borderRadius:5,background:ic+'18',color:ic,border:`0.5px solid ${ic}44`}}>{ii+1}. {isG?item.word:`${item.word}/${item.alt}`}</span>;})}
          </div>
        </button>)}
        <hr style={{border:'none',borderTop:'0.5px solid #eee',margin:'10px 0'}}/>
        <div style={{fontSize:11,fontWeight:600,color:'#888',marginBottom:8}}>② {isG?'틀린 것':'어색한 것'} 선택 (정답)</div>
        {sets?.[sel]?.items?.map((item,ii)=><button key={ii} onClick={()=>upP({[ansKey]:ii+1})} style={{display:'block',width:'100%',textAlign:'left',marginBottom:6,background:ans===ii+1?'#E24B4A18':'transparent',border:`0.5px solid ${ans===ii+1?'#E24B4A':'#e5e5e5'}`,borderRadius:8,padding:'9px 11px',cursor:'pointer'}}>
          {ans===ii+1&&bdg('✓ 정답',c)}{!item.correct&&ans!==ii+1&&bdg('AI 추천 오류','#854F0B')}
          <span style={{fontSize:11,color:'#bbb',marginRight:5}}>{ii+1}.</span>
          <b style={{fontSize:13,color:ans===ii+1?c:'#1d1d1f'}}>{item.word}</b>
          {isG?<span style={{fontSize:11,color:'#888',marginLeft:8}}>{item.note}</span>:<><span style={{fontSize:12,color:'#888'}}> → </span><span style={{fontSize:12,color:'#854F0B',fontWeight:600}}>{item.alt}</span><span style={{fontSize:11,color:'#bbb',marginLeft:6}}>[{item.sent}]번</span></>}
        </button>)}
      </div>;
    }
    return null;
  };

  const buildOutput=()=>{
    const entries=passages.filter(p=>p.data).map(({data:p})=>{
      const gs=(p.grammar_sets||[])[p.grammar_sel]||{items:[],answer:1};
      const vs=(p.vocab_sets||[])[p.vocab_sel]||{items:[],answer:1};
      return{id:p.id,difficulty:p.difficulty,title:p.title,sentences:p.sentences,abstract:p.abstract,
        topic_options:p.topic_options,topic_answer:p.topic_answer,
        blank_sentence_index:p.blank_sentence_index,blank_target:p.blank_target,
        blank_options:p.blank_options,blank_answer:p.blank_answer,
        order_given_index:p.order_given_index,order_blocks:p.order_blocks,
        order_options:p.order_options,order_answer:p.order_answer,
        insert_sentence:p.insert_sentence,insert_answer:p.insert_answer,
        summary_template:p.summary_template,
        summary_A_options:p.summary_A_options,summary_A_answer:p.summary_A_answer,
        summary_B_options:p.summary_B_options,summary_B_answer:p.summary_B_answer,
        implication_sentence_index:p.implication_sentence_index,implication_keyword:p.implication_keyword,
        implication_options:p.implication_options,implication_answer:p.implication_answer,
        irrelevant_sentence_index:p.irrelevant_sentence_index,
        aGroup:p.summary_A_options.slice(0,3),bGroup:p.summary_B_options.slice(0,3),
        grammar_items:gs.items,grammar_answer:p.grammar_answer,
        vocab_items:vs.items,vocab_answer:p.vocab_answer};
    });
    return`// GREATENG passageData 추가분 (${entries.length}개)\n// order_answer는 merge 스크립트 재처리 필요\n\n`+entries.map(e=>JSON.stringify(e,null,2)).join(',\n\n');
  };

  const card={background:'#fff',borderRadius:10,border:'0.5px solid #e5e5e5',padding:'14px 16px',marginBottom:12};

  if(step==='setup')return(
    <div style={{maxWidth:600,margin:'0 auto',padding:'24px 14px'}}>
      <div style={card}>
        <div style={{fontWeight:600,fontSize:15,marginBottom:4}}>출제 저작 도구</div>
        <div style={{color:'#888',fontSize:13,marginBottom:20}}>지문 붙여넣기 → AI 분석 → 9가지 유형 문제 후보 자동 생성</div>
        <div style={{display:'grid',gridTemplateColumns:'2fr 1fr',gap:10,marginBottom:14}}>
          <div><label style={{fontSize:12,fontWeight:500,color:'#666',display:'block',marginBottom:4}}>교재 코드</label>
            <select value={pfx} onChange={e=>setPfx(e.target.value)} style={{width:'100%',padding:'7px 10px',border:'0.5px solid #e5e5e5',borderRadius:7,fontSize:13,background:'#fff'}}>
              <option value="27STYD">27STYD (수특영독)</option>
              <option value="27ST_E">27ST_E (수특영어)</option>
              <option value="ABSO_TYPE">ABSO_TYPE (절대유형)</option>
              <option value="MOGO_GO3">MOGO_GO3 (모의고사)</option>
            </select>
          </div>
          <div><label style={{fontSize:12,fontWeight:500,color:'#666',display:'block',marginBottom:4}}>강 (Chapter)</label><input type="number" value={chapter} onChange={e=>setChapter(+e.target.value)} min={1} max={50} style={{width:'100%',padding:'7px 10px',border:'0.5px solid #e5e5e5',borderRadius:7,fontSize:13}}/></div>
          <div><label style={{fontSize:12,fontWeight:500,color:'#666',display:'block',marginBottom:4}}>시작 번호</label><input type="number" value={startNum} onChange={e=>setStartNum(+e.target.value)} style={{width:'100%',padding:'7px 10px',border:'0.5px solid #e5e5e5',borderRadius:7,fontSize:13}}/></div>
        </div>
        <div style={{marginBottom:16}}>
          <label style={{fontSize:12,fontWeight:500,color:'#666',display:'block',marginBottom:4}}>지문 텍스트 <span style={{fontWeight:400,color:'#bbb'}}>— 교재 전체 붙여넣기 가능 (자동 분리)</span></label>
          <textarea value={rawText} onChange={e=>setRawText(e.target.value)} rows={11} style={{width:'100%',fontFamily:'monospace',fontSize:12,padding:'8px 10px',border:'0.5px solid #e5e5e5',borderRadius:7,resize:'vertical'}} placeholder={"지문 붙여넣기...\n\n여러 지문 자동 인식:\n• --- 구분선\n• '20 다음...', '21 글의...' 문번호 패턴\n• 3줄 이상 빈 줄"}/>
        </div>
        {rawText.trim()&&(()=>{const n=splitTexts(rawText).length;return<div style={{background:n>1?'#E8F5E9':'#F5F5F5',border:`0.5px solid ${n>1?'#81C784':'#e5e5e5'}`,borderRadius:7,padding:'8px 12px',fontSize:12.5,color:n>1?'#2d8a60':'#888',marginBottom:10}}>
          {n>1?`✓ ${n}개 지문 자동 감지됨 — 순서대로 자동 분석합니다`:`지문 1개 감지됨`}
        </div>;})()} 
        {err&&<div style={{color:'#E24B4A',fontSize:12,marginBottom:8}}>{err}</div>}
        {!apiKey&&<div style={{color:'#856404',background:'#FFF8E6',border:'0.5px solid #F0C040',borderRadius:7,padding:'8px 12px',fontSize:12,marginBottom:10}}>⚠ 상단 ⚙ 설정에서 API Key를 먼저 입력해주세요.</div>}
        <button onClick={analyze} disabled={!rawText.trim()} style={{width:'100%',padding:'11px',background:'#185FA5',color:'#fff',border:'none',borderRadius:8,fontSize:14,fontWeight:600,cursor:'pointer'}}>분석 시작 ↗</button>
      </div>
    </div>
  );

  if(step==='proc')return(
    <div style={{maxWidth:520,margin:'0 auto',padding:'40px 14px',textAlign:'center'}}>
      <div style={{fontWeight:500,fontSize:15,marginBottom:16}}>{passages.filter(p=>!p.loading&&(p.data||p.error)).length}/{passages.length} 완료</div>
      <div style={{background:'#e5e5ea',borderRadius:100,height:5,marginBottom:20}}>
        <div style={{background:'#185FA5',borderRadius:100,height:5,width:`${passages.length?(passages.filter(p=>!p.loading).length/passages.length*100):0}%`,transition:'width .4s'}}/>
      </div>
      <div style={{textAlign:'left'}}>
        {passages.map((p,i)=><div key={i} style={{...card,display:'flex',alignItems:'center',gap:10,padding:'10px 14px',marginBottom:8}}>
          <span style={{color:p.data?'#2d8a60':p.error?'#E24B4A':'#888'}}>{p.loading?'○':p.error?'✕':p.data?'●':'·'}</span>
          <span style={{fontSize:13,color:'#666'}}>지문 {i+1}</span>
          {p.data&&<span style={{marginLeft:'auto',fontWeight:500}}>{p.data.title}</span>}

              <span style={{fontSize:12,color:'#888',alignSelf:'center'}}>{ci+1}/{ok.length}</span>
              <button onClick={()=>{if(ci<ok.length-1){setPi(ok[ci+1].id);setAt(0);}}} disabled={ci>=ok.length-1} style={{padding:'5px 10px',fontSize:12,border:'0.5px solid #e5e5e5',borderRadius:7,cursor:'pointer',opacity:ci>=ok.length-1?.3:1}}>다음 ▶</button>
            </>);})()}
            <button onClick={()=>saveToGitHub(buildOutput())} disabled={ghSaving} style={{padding:'5px 14px',fontSize:12,background:ghSaving?'#888':'#1a5c3a',color:'#fff',border:'none',borderRadius:7,cursor:'pointer',fontWeight:500}}>{ghSaving?'저장중...':'GitHub 저장 ↗'}</button>
            <button onClick={()=>{setOutText(buildOutput());setStep('out');}} style={{padding:'5px 14px',fontSize:12,background:'#185FA5',color:'#fff',border:'none',borderRadius:7,cursor:'pointer',fontWeight:500}}>출력 ↗</button>
          </div>
        </div>
        <div style={{display:'flex',gap:5,flexWrap:'wrap',marginBottom:12}}>
          {AUTHOR_TABS.map((t,i)=><button key={i} onClick={()=>setAt(i)} style={{fontSize:12,padding:'4px 10px',borderRadius:6,border:`0.5px solid ${at===i?t.c:'#e5e5e5'}`,background:at===i?t.c+'18':'transparent',color:at===i?t.c:'#666',fontWeight:at===i?600:400,cursor:'pointer'}}>{t.lb}</button>)}
        </div>
        {p&&<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
          <div style={{...card,padding:'12px'}}><LeftPanel p={p}/></div>
          <div style={{...card,padding:'12px',overflowY:'auto',maxHeight:540}}><RightPanel p={p}/></div>

  }

  if(step==='out')return(
    <div style={{padding:'14px'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
        <span style={{fontWeight:500,fontSize:15}}>출력 결과</span>

          <button onClick={()=>setStep('edit')} style={{padding:'5px 12px',fontSize:12,border:'0.5px solid #e5e5e5',borderRadius:7,cursor:'pointer'}}>← 편집</button>

          <button onClick={()=>saveToGitHub(buildOutput())} disabled={ghSaving} style={{padding:'5px 14px',fontSize:12,background:ghSaving?'#888':'#185FA5',color:'#fff',border:'none',borderRadius:7,cursor:'pointer',fontWeight:500}}>{ghSaving?'저장중...':'GitHub 저장 ↗'}</button>
        </div>
      </div>
      <div style={card}>
        <p style={{fontSize:12,color:'#888',marginBottom:10}}>GREATENG passageData 배열에 붙여넣으세요. (order_answer는 merge 스크립트 재처리 권장)</p>
        <pre style={{background:'#f5f5f7',border:'0.5px solid #e5e5e5',borderRadius:8,padding:14,fontSize:11,overflow:'auto',maxHeight:560,fontFamily:'monospace',lineHeight:1.5,whiteSpace:'pre-wrap',wordBreak:'break-word'}}>{outText}</pre>

    </div>

  return null;
}

function App(){
  const [slots,setSlots]=useState(()=>loadSlots()||Array.from({length:5},(_,i)=>makeSlot(i)));
  const [authorInitText,setAuthorInitText]=useState('');
  const [mainGhSaving,setMainGhSaving]=useState(false);
  const [viewMode,setViewMode]=useState('teacher');
  const [apiKey,setApiKey]=useState(()=>localStorage.getItem(LS.KEY)||'');
  const [keyInput,setKeyInput]=useState('');
  const [ghToken,setGhToken]=useState(()=>localStorage.getItem('gh_token')||'');
  const [ghRepo,setGhRepo]=useState(()=>localStorage.getItem('gh_repo')||'greatenglish1201-ux/GREATENG');
  const [ghTokenInput,setGhTokenInput]=useState('');
  const [ghRepoInput,setGhRepoInput]=useState('');
  const [showSet,setShowSet]=useState(false);
  const [showLoad,setShowLoad]=useState(false);
  const [loadedPassages,setLoadedPassages]=useState([]);
  const [loadSrc,setLoadSrc]=useState('');
  const [loadSearch,setLoadSearch]=useState('');
  const [loadFetching,setLoadFetching]=useState(false);
  const [loadSel,setLoadSel]=useState({});
  const [msg,setMsg]=useState('');
  const running=useRef(false);

  useEffect(()=>{saveSlots(slots);},[slots]);
  const flash=(m,t=3000)=>{setMsg(m);setTimeout(()=>setMsg(''),t);};
  const upSlot=useCallback((id,patch)=>setSlots(p=>p.map(s=>s.id===id?{...s,...patch}:s)),[]);

  const generateBlockSummaries=useCallback(async(slot)=>{
    if(!apiKey){alert('API Key가 없습니다.');return;}
    const blocks=slot.analysis?.flow?.blocks||[];
    const sentences=slot.analysis?.sentences||[];
    if(!blocks.length){alert('블록 분석 데이터가 없습니다.');return;}
    upSlot(slot.id,{blockSummaries:'loading'});
    try{
      const prompt=BLOCK_SUM_PROMPT(blocks,sentences);
      const d=await callClaude(apiKey,BLOCK_SUM_SYS,prompt);
      if(d.error)throw new Error(d.error.message||'API 오류');
      const raw=d.content[0].text.replace(/```(?:json)?|```/g,'').trim();
      const arrStart=raw.indexOf('[');
      const arrEnd=raw.lastIndexOf(']');
      if(arrStart<0||arrEnd<0)throw new Error('응답 형식 오류');
      const parsed=JSON.parse(raw.slice(arrStart,arrEnd+1));
      upSlot(slot.id,{blockSummaries:parsed});
      flash('✓ 블록 요약 생성 완료');
    }catch(e){
      upSlot(slot.id,{blockSummaries:null});
      alert('요약 생성 실패: '+e.message);
    }
  },[apiKey,upSlot]);

  const upAnalysis=useCallback((id,path,val)=>setSlots(p=>p.map(s=>{
    if(s.id!==id)return s;
    const a=JSON.parse(JSON.stringify(s.analysis));
    const parts=path.split('.');let cur=a;
    for(let i=0;i<parts.length-1;i++){if(cur[parts[i]]===undefined)cur[parts[i]]={};cur=cur[parts[i]];}
    cur[parts[parts.length-1]]=val;
    return{...s,analysis:a};
  })),[]);

  const handleMeta=useCallback((id,f,v)=>setSlots(prev=>{
    const next=prev.map(s=>s.id===id?{...s,meta:{...s.meta,[f]:v}}:s);
    if(id===0&&(f==='chapter'||f==='number')){
      const bCh=parseInt(f==='chapter'?v:next[0].meta.chapter)||1;
      const bN=parseInt(f==='number'?v:next[0].meta.number)||1;
      return next.map(s=>s.id===0?s:{...s,meta:{...s.meta,
        chapter:String(bCh).padStart(2,'0'),
        number:String(bN+s.id).padStart(3,'0')}});
    }
    return next;
  }),[]);

  const doAnalyze=useCallback(async(slot)=>{
    upSlot(slot.id,{status:'analyzing',error:''});
    try{
      const d=await callClaude(apiKey,FLOW_SYS,slot.text);
      if(d.error)throw new Error(d.error.message||JSON.stringify(d.error));
      const p=parseJSON(d.content[0].text);
      upSlot(slot.id,{status:'analyzed',meta:{...slot.meta,difficulty:p.difficulty||'중'},
        analysis:{sentences:p.sentences||[],
          flow:{blocks:p.blocks||[],interBlockConnectors:p.interBlockConnectors||[],
            keyword:p.keyword||'',topicSummary:p.topicSummary||'',structureType:p.structureType||''},
          grammar:{difficultSentences:p.difficultSentences||[]}},open:true});
    }catch(e){upSlot(slot.id,{status:'idle',error:'오류: '+e.message});}
  },[upSlot,apiKey]);

  const runAll=useCallback(async()=>{
    if(running.current)return;
    if(!apiKey){alert('API Key를 먼저 설정해주세요.');setShowSet(true);return;}
    running.current=true;
    for(const slot of slots.filter(s=>s.text.trim()&&s.status==='idle')){
      await doAnalyze(slot);
    }
    running.current=false;
  },[slots,doAnalyze,apiKey]);

  const reanalyze=useCallback(async(slot)=>{
    if(!confirm('흐름 분석을 다시 할까요?'))return;
    upSlot(slot.id,{status:'idle',analysis:null,error:''});
    setTimeout(()=>doAnalyze({...slot,status:'idle'}),100);
  },[upSlot,doAnalyze]);

  const saveMainToGitHub=useCallback(async()=>{
    if(!ghToken||!ghRepo){alert('설정에서 GitHub Token과 저장소를 입력해주세요.');return;}
    setMainGhSaving(true);
    try{
      const entries=slots.filter(s=>s.analysis&&s.text.trim()).map(s=>{
        const d=s.data||{};
        return{
          id:d.id||s.meta.source+'_'+String(s.meta.chapter).padStart(2,'0')+'_'+String(s.meta.number).padStart(3,'0'),
          title:d.title||'',difficulty:s.meta.difficulty||'보통',
          sentences:s.analysis.sentences||[],
          flow:s.analysis.flow||{},
          grammar:s.analysis.grammar||{},
          blockSummaries:Array.isArray(s.blockSummaries)?s.blockSummaries:undefined
        };
      });
      if(!entries.length){alert('저장할 분석 데이터가 없습니다.');setMainGhSaving(false);return;}
      const jsonText=entries.map(e=>JSON.stringify(e,null,2)).join(',\n\n');
      const path='passages.js';
      const getRes=await fetch('https://api.github.com/repos/'+ghRepo+'/contents/'+path,{headers:{'Authorization':'token '+ghToken}});
      if(!getRes.ok)throw new Error('passages.js 읽기 실패');
      const getJson=await getRes.json();
      const decoded=decodeURIComponent(escape(atob(getJson.content.replace(/\n/g,''))));
      const newContent=upsertPassages(decoded,entries);
      const putRes=await fetch('https://api.github.com/repos/'+ghRepo+'/contents/'+path,{
        method:'PUT',headers:{'Authorization':'token '+ghToken,'Content-Type':'application/json'},
        body:JSON.stringify({message:'Add passages via teacher.html',content:btoa(unescape(encodeURIComponent(newContent))),sha:getJson.sha})
      });
      if(!putRes.ok)throw new Error('GitHub 저장 실패: '+(await putRes.text()));
      alert('✓ GitHub 저장 완료! 30초 후 자동 배포됩니다.');
    }catch(e){alert('오류: '+e.message);}
    setMainGhSaving(false);
  },[slots,ghToken,ghRepo]);

  const fetchPassages=useCallback(async()=>{
    if(loadedPassages.length>0){setShowLoad(true);return;}
    setLoadFetching(true);
    try{
      const r=await fetch('passages.js?t='+Date.now());
      const text=await r.text();
      const modified=text.replace(/^\s*(const|let|var)\s+PASSAGES\s*=/,'window.__LOAD_PASSAGES =');
      new Function(modified)();
      const ps=window.__LOAD_PASSAGES||[];
      setLoadedPassages(ps);
      setShowLoad(true);
    }catch(e){alert('passages.js 로드 실패: '+e.message);}
    setLoadFetching(false);
  },[loadedPassages]);

  const normalizeSentences=(sents)=>{
    if(!sents||!sents.length) return [];
    if(typeof sents[0]==='string') return sents.map((t,i)=>({num:i+1,text:t,symbol:'',role:'',chunks:[]}));
    return sents;
  };

  const loadIntoSlot=useCallback((p)=>{
    const normed=normalizeSentences(p.sentences);
    const text=normed.map(s=>s.text||'').join(' ');
    const emptyIdx=slots.findIndex(s=>!s.text.trim()&&s.status==='idle');
    const idx=emptyIdx>=0?emptyIdx:0;
    upSlot(slots[idx].id,{
      text,
      meta:{source:p.id.split('_')[0],chapter:p.id.split('_')[1]||'01',
        number:p.id.split('_')[2]||'001',difficulty:p.difficulty||'중'},
      status:'saved',
      analysis:{sentences:normed,flow:p.flow||{},grammar:p.grammar||{}},
      blockSummaries:Array.isArray(p.blockSummaries)?p.blockSummaries:null,
      open:true
    });
    flash('✓ '+p.id+' 불러오기 완료');
  },[slots,upSlot]);

  const loadSelected=useCallback((selected)=>{
    selected.forEach(p=>loadIntoSlot(p));
    setShowLoad(false);
  },[loadIntoSlot]);



  const keyOk=apiKey.startsWith('sk-ant');

  const iB={border:'none',borderBottom:'1px dashed #ccc',background:'transparent',
    outline:'none',padding:'2px 0',fontFamily:'inherit',color:'inherit',width:'100%'};
  const sB={border:'none',background:'transparent',outline:'none',cursor:'pointer',fontFamily:'inherit'};

  return(
    <div style={{minHeight:'100vh',background:'#f2f3f7'}}>
      <div style={{background:'#185FA5',padding:'0 18px',display:'flex',alignItems:'center',
        justifyContent:'space-between',height:52,position:'sticky',top:0,zIndex:100,
        boxShadow:'0 2px 8px rgba(0,0,0,.18)'}}>
        <div style={{color:'#fff',fontWeight:700,fontSize:15}}>📘 GREATENG 분석 툴</div>
        <div style={{display:'flex',gap:7,alignItems:'center'}}>
          {msg&&<span style={{color:'#a5d6f5',fontSize:11.5}}>{msg}</span>}
          <div style={{display:'flex',gap:2,background:'rgba(0,0,0,.2)',borderRadius:7,padding:3}}>
            {['teacher','student','authoring'].map(m=>(
              <button key={m} onClick={()=>setViewMode(m)}
                style={{padding:'4px 12px',fontSize:12,fontWeight:600,
                  background:viewMode===m?'#fff':'transparent',
                  color:viewMode===m?'#185FA5':'rgba(255,255,255,.75)',
                  border:'none',borderRadius:5,cursor:'pointer'}}>
                {m==='teacher'?'교사용':m==='student'?'학생용':'✏ 출제 저작'}
              </button>
            ))}
          </div>
          <span style={{fontSize:10.5,padding:'2px 8px',borderRadius:10,
            background:keyOk?'rgba(45,138,96,.4)':'rgba(200,60,40,.4)',
            color:keyOk?'#7febb6':'#ffb3a7'}}>{keyOk?'API ✓':'미설정'}</span>

          {viewMode!=='authoring'&&<button onClick={fetchPassages} disabled={loadFetching}

            {loadFetching?'로딩...':'📂 불러오기'}
          </button>}
          {viewMode!=='authoring'&&<button onClick={saveMainToGitHub} disabled={mainGhSaving}
            style={{background:mainGhSaving?'rgba(0,0,0,.3)':'rgba(45,138,96,.5)',color:'#fff',border:'none',
              borderRadius:6,padding:'4px 10px',fontSize:11.5,fontWeight:600,cursor:'pointer'}}>
            {mainGhSaving?'저장중...':'GitHub 저장 ↗'}
          </button>}
          <button onClick={()=>{if(confirm('초기화?')){const f=Array.from({length:5},(_,i)=>makeSlot(i));setSlots(f);saveSlots(f);}}}
            style={{background:'rgba(255,255,255,.1)',color:'#ffb3a7',border:'none',

        </div>

      {showLoad&&(

                style={{flex:1,minWidth:120,padding:'6px 10px',border:'1px solid #ddd',borderRadius:7,fontSize:13,outline:'none'}}/>
              <select value={loadSrc} onChange={e=>setLoadSrc(e.target.value)}
                style={{padding:'6px 10px',border:'1px solid #ddd',borderRadius:7,fontSize:13,outline:'none'}}>

                      return(
                      <div key={p.id}
                        onClick={()=>setLoadSel(prev=>({...prev,[p.id]:!prev[p.id]}))}
