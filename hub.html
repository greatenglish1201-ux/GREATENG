<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>대단한영어 · 관리자 허브</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --wine:#8e1530; --wine-deep:#6f0f24; --gold:#b08a3e;
    --bg:#f7f4ef; --card:#ffffff;
    --ink:#1d1d1f; --ink-2:#515154; --ink-3:#86868b;
    --line:#ece6db; --fill:#f3eee5;
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 28px rgba(44,36,32,.07);
    --shadow-hover:0 8px 16px rgba(44,36,32,.10), 0 20px 44px rgba(44,36,32,.10);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh;
    font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    background:var(--bg); color:var(--ink);
    padding:48px 20px 64px;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    letter-spacing:-0.01em;
  }
  .wrap{ max-width:860px; margin:0 auto; }
  header{ text-align:center; margin-bottom:40px; }
  .brand{ font-size:14px; font-weight:600; color:var(--wine); letter-spacing:0.04em; margin-bottom:10px; }
  header h1{ margin:0; font-size:30px; font-weight:700; letter-spacing:-0.03em; }
  header p{ margin:9px 0 0; font-size:14px; color:var(--ink-3); font-weight:500; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px; }
  .tile{
    display:block; text-decoration:none; color:inherit;
    background:var(--card); border:1px solid rgba(0,0,0,.03);
    border-radius:20px; padding:24px; box-shadow:var(--shadow);
    transition:transform .18s ease, box-shadow .18s ease;
    position:relative; overflow:hidden;
  }
  .tile:hover{ transform:translateY(-3px); box-shadow:var(--shadow-hover); }
  .tile:active{ transform:translateY(-1px); }
  .tile::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--accent,var(--wine)); }
  .tile .ico{
    width:46px; height:46px; border-radius:13px;
    display:flex; align-items:center; justify-content:center;
    font-size:22px; margin-bottom:16px; background:var(--accent-soft,#f3eee5);
  }
  .tile h2{ margin:0 0 5px; font-size:17px; font-weight:600; letter-spacing:-0.02em; }
  .tile p{ margin:0; font-size:13px; color:var(--ink-3); line-height:1.5; font-weight:500; }
  .tile .go{ margin-top:14px; font-size:13px; font-weight:600; color:var(--wine); }
  footer{ text-align:center; margin-top:40px; font-size:12px; color:var(--ink-3); }
  /* 카드 순서 정렬 */
  .sort-ctrl{ display:flex; flex-direction:column; align-items:flex-end; gap:10px; margin-bottom:16px; }
  .sort-btn{ border:1px solid var(--line); background:var(--card); color:var(--ink-2);
    font-size:13px; font-weight:600; padding:8px 16px; border-radius:980px; cursor:pointer;
    font-family:inherit; transition:background .15s ease; }
  .sort-btn:hover{ background:var(--fill); }
  .sort-bar{ display:none; align-items:center; gap:12px; width:100%;
    background:var(--fill); border:1px solid var(--line); border-radius:14px; padding:12px 16px; }
  .sort-bar.active{ display:flex; }
  .sort-bar span{ font-size:13px; color:var(--ink-2); flex:1; }
  .sort-save{ border:none; background:var(--wine); color:#fff; font-size:13px; font-weight:600;
    padding:9px 16px; border-radius:980px; cursor:pointer; font-family:inherit; white-space:nowrap; transition:opacity .15s ease; }
  .sort-save:hover{ opacity:.88; }
  .tile.sortable{ cursor:grab; user-select:none; }
  .tile.sortable:active{ cursor:grabbing; }
  .tile.dragging{ opacity:.4; }
  .tile.drag-over{ outline:2px dashed var(--wine); outline-offset:3px; }
  .drag-grip{ position:absolute; top:14px; right:16px; font-size:18px; color:var(--ink-3); letter-spacing:-2px; }
  @media (max-width:560px){ .sort-bar{ flex-direction:column; align-items:stretch; } .sort-bar span{ text-align:center; } }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">대단한영어 · GREATENG</div>
    <h1>관리자 허브</h1>
    <p>모든 도구를 한곳에서</p>
  </header>
  <div class="sort-ctrl">
    <button id="sortToggle" class="sort-btn">카드 순서 바꾸기</button>
    <div id="sortBar" class="sort-bar">
      <span>카드를 끌어서 순서를 바꾼 뒤 저장하세요</span>
      <button id="sortSave" class="sort-save">순서 저장 (코드 복사)</button>
    </div>
  </div>
  <div class="grid" id="grid"></div>
  <footer>대단한영어 · 탁월함이 습관이 되도록</footer>
</div>

<script>
  /* ============================================================
     ▼▼▼ 페이지 추가는 여기만 고치세요 ▼▼▼
     새 페이지가 생기면 아래 목록에 한 줄 추가하면 카드가 자동 생성됩니다.

     형식: { name:"이름", url:"파일.html", desc:"한 줄 설명", icon:"이모지", color:"#색상" }
       - name : 카드 제목
       - url  : 같은 폴더의 파일명 (예: "voca.html") 또는 전체 주소(https://...)
       - desc : 카드 아래 설명
       - icon : 이모지 1개
       - color: 왼쪽 막대·아이콘 배경 색 (생략하면 와인색)

     예) 새 페이지 추가:
       { name:"새 도구", url:"newtool.html", desc:"설명", icon:"\u2b50", color:"#3a8a5c" },
     ============================================================ */
  const PAGES = [
    { name:"학생 퀴즈",     url:"index.html",              desc:"학생용 퀴즈 앱 · 관리자 패널",        icon:"\ud83d\udcdd", color:"#8e1530" },
    { name:"교사 분석 툴",  url:"teacher.html",            desc:"지문 작성 · 문항 생성 · 분석",        icon:"\ud83e\uddd1\u200d\ud83c\udfeb", color:"#6f0f24" },
    { name:"멤버스 (보카)", url:"voca.html",               desc:"단어 시험 · 숙제 제출 · 관리자",      icon:"\ud83d\udcda", color:"#b08a3e" },
    { name:"숙제 현황",     url:"hw-monitor.html",         desc:"제출 현황 · 사진 확인 · 학부모 리포트", icon:"\ud83d\udcca", color:"#2b5b8a" },
    { name:"출제 허브",     url:"exam-analysis.html",      desc:"기출 분석 · 예상문제 생성",            icon:"\ud83c\udfaf", color:"#7a5a9a" },
    { name:"학교 정보",     url:"pohang_highschools.html", desc:"포항 학교 지도 · 입시 정보",          icon:"\ud83c\udfeb", color:"#3a8a5c" },
    { name:"수능대비반",    url:"suneung_2026.html",       desc:"고3 수능대비반 안내 페이지",          icon:"\ud83c\udf93", color:"#c06a2c" },
    { name:"애널리틱스",    url:"https://analytics.google.com/analytics/web/#/a398325140p542064683/reports/intelligenthome", desc:"방문자 · 트래픽 통계 (GA4)", icon:"\ud83d\udcc8", color:"#d4a017" },
    /* ▼ 새 페이지는 이 아래에 추가 ▼ */
    { name:"메인 페이지",   url:"main.html",               desc:"학원 대표 홈 · 소개 · 후기 · 비즈채널", icon:"\ud83c\udfdb\ufe0f", color:"#8e1530" },
    { name:"학부모 안내",   url:"parent_guide.html",       desc:"수업 방식 · 상담 가이드 · 시간표/교육비", icon:"\ud83d\udccb", color:"#9a3a5a" },
    { name:"썸네일 생성기", url:"greateng_thumbnail_pro2_2.html", desc:"블로그 썸네일 · 위젯배너 제작", icon:"\ud83c\udfa8", color:"#c0568e" },

  ];
  /* ▲▲▲ 여기까지만 고치면 됩니다 ▲▲▲ */

  function softBg(hex){
    const h = hex.replace('#','');
    const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
    const mix = (c)=> Math.round(c + (255-c)*0.88);
    return 'rgb('+mix(r)+','+mix(g)+','+mix(b)+')';
  }
  function esc(s){ return String(s).replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

  /* 현재 순서를 담는 작업용 배열 */
  let order = PAGES.map((p,i)=>i);
  let sortMode = false;

  const grid = document.getElementById('grid');

  function render(){
    grid.innerHTML = order.map(function(idx){
      const p = PAGES[idx];
      const color = p.color || 'var(--wine)';
      const soft = (p.color ? softBg(p.color) : '#f3eee5');
      if(sortMode){
        // 정렬 모드: 링크 비활성 + 드래그 가능
        return '<div class="tile sortable" draggable="true" data-idx="'+idx+'" style="--accent:'+color+'; --accent-soft:'+soft+';">'
          + '<div class="drag-grip">⠿</div>'
          + '<div class="ico">'+esc(p.icon||'\ud83d\udd17')+'</div>'
          + '<h2>'+esc(p.name)+'</h2>'
          + '<p>'+esc(p.desc||'')+'</p>'
          + '</div>';
      }
      return '<a class="tile" href="'+esc(p.url)+'" target="_blank" rel="noopener" style="--accent:'+color+'; --accent-soft:'+soft+';">'
        + '<div class="ico">'+esc(p.icon||'\ud83d\udd17')+'</div>'
        + '<h2>'+esc(p.name)+'</h2>'
        + '<p>'+esc(p.desc||'')+'</p>'
        + '<div class="go">열기 →</div>'
        + '</a>';
    }).join('');
    if(sortMode) bindDrag();
  }

  /* 드래그 정렬 */
  let dragFrom = null;
  function bindDrag(){
    const tiles = grid.querySelectorAll('.sortable');
    tiles.forEach(function(t){
      t.addEventListener('dragstart', function(e){
        dragFrom = +t.dataset.idx;
        t.classList.add('dragging');
        e.dataTransfer.effectAllowed='move';
      });
      t.addEventListener('dragend', function(){ t.classList.remove('dragging'); });
      t.addEventListener('dragover', function(e){ e.preventDefault();
        const over = grid.querySelector('.drag-over');
        if(over && over!==t) over.classList.remove('drag-over');
        t.classList.add('drag-over');
      });
      t.addEventListener('dragleave', function(){ t.classList.remove('drag-over'); });
      t.addEventListener('drop', function(e){
        e.preventDefault();
        t.classList.remove('drag-over');
        const to = +t.dataset.idx;
        if(dragFrom===null || dragFrom===to) return;
        const fromPos = order.indexOf(dragFrom);
        const toPos = order.indexOf(to);
        order.splice(toPos,0, order.splice(fromPos,1)[0]);
        render();
      });
    });
  }

  /* 정렬 모드 토글 */
  document.getElementById('sortToggle').addEventListener('click', function(){
    sortMode = !sortMode;
    document.getElementById('sortBar').classList.toggle('active', sortMode);
    this.textContent = sortMode ? '정렬 끝내기' : '카드 순서 바꾸기';
    render();
  });

  /* 순서 저장 (코드 복사) */
  document.getElementById('sortSave').addEventListener('click', function(){
    const lines = order.map(function(idx){
      const p = PAGES[idx];
      const parts = ['name:"'+p.name+'"','url:"'+p.url+'"','desc:"'+(p.desc||'')+'"'];
      if(p.icon) parts.push('icon:"'+p.icon+'"');
      if(p.color) parts.push('color:"'+p.color+'"');
      return '    { '+parts.join(', ')+' },';
    }).join('\n');
    const code = '  const PAGES = [\n'+lines+'\n  ];';
    navigator.clipboard.writeText(code).then(function(){
      alert('새 순서 코드가 복사되었습니다.\n\nGitHub에서 hub.html 을 열고,\n기존 "const PAGES = [ ... ];" 부분을 통째로 지운 뒤\n붙여넣기(Ctrl+V) 하고 Commit 하세요.');
    }).catch(function(){
      prompt('아래 코드를 전체 복사해서 붙여넣으세요:', code);
    });
  });

  render();
</script>
</body>
</html>
