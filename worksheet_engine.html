<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대단한영어 · 수능 파이널 워크시트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --wine:#7a1020; --wine-soft:#9a2435; --gold:#C9A84C; --gold-soft:#e3cf95;
  --ink:#3a2a20; --paper:#fbf8f2; --line:#e0d6c0; --grey:#8b8378; --green:#3b6d5a; --steel2:#3f5a72;
}
*{box-sizing:border-box}
body{margin:0; background:#e8e4dc; color:var(--ink);
  font-family:'Noto Sans KR',sans-serif; font-size:14px; line-height:1.6}
.g{color:var(--grey)}
i.it{font-style:italic}

/* ---------- 툴바 (화면 전용) ---------- */
.toolbar{position:sticky; top:0; z-index:50; display:flex; gap:8px; align-items:center;
  flex-wrap:wrap; padding:9px 14px; background:var(--wine); color:#fff}
.toolbar .brand{font-family:'Space Grotesk',sans-serif; font-weight:700;
  letter-spacing:.04em; font-size:13px; margin-right:6px}
.toolbar label{font-size:11px; opacity:.85; margin-left:6px}
.toolbar select,.toolbar button{font-family:'Noto Sans KR',sans-serif; font-size:12.5px;
  padding:5px 10px; border-radius:2px; border:1px solid rgba(255,255,255,.45);
  background:transparent; color:#fff; cursor:pointer}
.toolbar select option{color:#222}
.toolbar button:hover,.toolbar select:hover{background:rgba(255,255,255,.14)}
.toolbar button.on{background:var(--gold); border-color:var(--gold); color:#2a1a10; font-weight:700}
.toolbar button:focus-visible,.toolbar select:focus-visible{outline:2px solid var(--gold-soft); outline-offset:2px}
.toolbar .sp{margin-left:auto}

.empty{max-width:640px; margin:60px auto; background:#fff; border:1px solid var(--line);
  padding:26px 30px; line-height:1.9}
.empty h2{margin:0 0 10px; font-size:17px; color:var(--wine)}
.empty code{background:#f2ece0; padding:1px 5px; font-family:'Space Grotesk',monospace}

/* ---------- 용지 ---------- */
.sheet{width:210mm; min-height:297mm; margin:16px auto; padding:12mm 13mm;
  background:var(--paper); box-shadow:0 2px 14px rgba(0,0,0,.16)}
.sheet.hide{display:none}

.head{display:flex; align-items:flex-end; justify-content:space-between;
  border-bottom:2px solid var(--wine); padding-bottom:5px; margin-bottom:3.5mm}
.head .t1{font-size:10.5px; letter-spacing:.14em; color:var(--wine); font-weight:700}
.head .t2{font-size:17px; font-weight:900; margin-top:2px}
.head .meta .nm{font-family:'Noto Sans KR',sans-serif; color:var(--ink)}
.head .meta{font-family:'Space Grotesk',sans-serif; font-size:10.5px;
  color:var(--grey); text-align:right; line-height:1.6}
.sheet-b .head{border-bottom-color:var(--green)}
.sheet-b .head .t1{color:var(--green)}
.sheet-b .step-h .n{background:var(--green)}

.namebar{display:flex; border:1px solid var(--line); margin-bottom:3.5mm; font-size:10.5px}
.namebar div{padding:4px 8px; border-right:1px solid var(--line); color:var(--grey)}
.namebar div:last-child{border-right:0; flex:1}

/* ---------- 지문 ---------- */
.qnum{font-weight:700; font-size:14px; margin-bottom:3px}
.passage{border:1px solid var(--line); background:#fff; padding:7px 11px;
  font-family:'Noto Serif',serif; font-size:15.6px; line-height:1.95;
  text-align:justify; margin-bottom:3mm}
.snum{font-family:'Space Grotesk',sans-serif; font-size:10px; font-weight:700;
  color:var(--wine); vertical-align:.25em; margin-right:2px}
/* 문항 밑줄 — 발문과 범위가 일치해야 함. 줄바꿈돼도 끊기지 않게 */
.passage u, .exam-col u{
  text-decoration-line:underline; text-decoration-thickness:1.1px;
  text-underline-offset:3.5px; text-decoration-skip-ink:none;
  box-decoration-break:clone; -webkit-box-decoration-break:clone}
/* 번호 붙은 밑줄(30번 어휘형) — ①~⑤ 자동 부여 */
.passage u[class^="n"]::before, .exam-col u[class^="n"]::before{
  font-family:'Space Grotesk',sans-serif; font-size:10px; font-weight:700;
  color:var(--wine); vertical-align:.25em; margin-right:2px;
  text-decoration:none; display:inline-block}
.passage u.n1::before,.exam-col u.n1::before{content:'①'}
.passage u.n2::before,.exam-col u.n2::before{content:'②'}
.passage u.n3::before,.exam-col u.n3::before{content:'③'}
.passage u.n4::before,.exam-col u.n4::before{content:'④'}
.passage u.n5::before,.exam-col u.n5::before{content:'⑤'}
.note{text-align:right; font-size:10.5px; color:var(--grey); margin-bottom:2mm}
.choices{font-family:'Noto Serif',serif; font-size:14.4px; line-height:1.9; margin-bottom:4mm}
.choices div .cn{font-family:'Space Grotesk',sans-serif; color:var(--grey); margin-right:5px}

/* ---------- STEP ---------- */
.step{margin-bottom:3.5mm; break-inside:avoid}
.step-h{display:flex; align-items:center; gap:7px; margin-bottom:5px;
  border-bottom:1px solid var(--line); padding-bottom:3px}
.step-h .n{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:10px;
  background:var(--wine); color:#fff; padding:1px 6px; letter-spacing:.05em}
.step-h .ttl{font-weight:700; font-size:14px}
.step-h .hint{font-size:11.4px; color:var(--grey); margin-left:auto; font-weight:400}

.grid2{display:grid; grid-template-columns:1fr 1fr; gap:0 12px}
.grid3{display:grid; grid-template-columns:1fr 1fr 1.4fr; gap:0 12px}
.field{margin-bottom:6px}
.field label{display:block; font-size:11.4px; color:var(--grey); margin-bottom:3px}
.blank{border-bottom:1px solid var(--ink); height:27px}
.blank.tall{height:40px}
.box{border:1px solid var(--line); background:#fff; min-height:30px; padding:5px 8px}
.box.tall{min-height:54px}

.pick{display:flex; gap:17px; font-size:12.4px; align-items:center; padding-top:4px}
.pick span{display:inline-flex; align-items:center; gap:4px}
.chk{display:inline-block; width:11px; height:11px; border:1.2px solid var(--ink)}
.note-if{margin-top:7px; font-size:11.4px; color:var(--wine-soft);
  border-left:2px solid var(--gold); padding:3px 0 3px 8px; background:#fff}

table{width:100%; border-collapse:collapse; font-size:12.4px}
th,td{border:1px solid var(--line); padding:5px 9px; vertical-align:top}
th{background:#f2ece0; font-weight:700; font-size:11.2px; text-align:left}
td.eng{font-family:'Noto Serif',serif; width:47%}
td.mine{height:32px}

/* ---------- 트리 ---------- */
.tree{border:1px solid var(--line); background:#fff; padding:8px 11px}
.trunk-label{font-size:10.8px; letter-spacing:.1em; color:var(--wine);
  font-weight:700; margin-bottom:5px}
.node{display:flex; align-items:stretch; gap:8px; margin-bottom:5px}
.node .tag{flex:0 0 112px; display:flex; align-items:center; gap:5px; font-size:11.4px;
  padding:3px 6px; border:1px solid var(--line); background:#f7f2e7}
.node .tag .sn{font-family:'Space Grotesk',sans-serif; font-weight:700; color:var(--wine)}
.node .tag .lb{font-weight:700}
.node.head-node .tag{background:var(--gold-soft); border-color:var(--gold)}
.node .wr{flex:1; border-bottom:1px solid var(--line); min-height:34px}
.node.sub{padding-left:22px; position:relative}
.node.sub::before{content:""; position:absolute; left:9px; top:0; bottom:0;
  border-left:1px solid var(--line)}
.switchline{display:flex; align-items:center; gap:8px; margin:6px 0;
  font-size:10px; letter-spacing:.1em; color:var(--wine); font-weight:700}
.switchline::before,.switchline::after{content:""; flex:1; border-top:1.5px dashed var(--wine-soft)}
.switchline.blank-line{color:var(--grey)}

.answer-row{display:flex; gap:10px; align-items:center; margin-top:2mm}
.answer-row .lab{font-size:11px; color:var(--grey)}
.circle{width:23px; height:23px; border:1.2px solid var(--ink); border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-family:'Space Grotesk',sans-serif; font-size:11px; color:var(--grey)}
body.show-ans .circle
/* 본문에서 따온 영어 표현 — 학생이 지문에서 찾아볼 자리 */
.w{font-family:'Noto Serif',serif; font-weight:400; font-style:italic;
  background:#f6efdd; padding:0 3px; border-bottom:1px dotted var(--gold);
  box-decoration-break:clone; -webkit-box-decoration-break:clone}

/* ===== 교사용 채움 — .fx는 어디에 있든 기본으로 숨긴다 =====
   학생용(해설 OFF)에서는 어떤 ✓·글자도 보이면 안 된다. */
.fx{display:none !important}
body.show-ans .fx{display:inline !important; color:var(--wine); font-weight:500}
body.show-ans .filled .fx{font-weight:500}
body.show-ans .pick .fx{font-weight:700; margin-left:3px}
body.show-ans .blank.filled{border-bottom-color:var(--wine-soft); height:auto; min-height:21px; padding-top:1px}
body.show-ans .box.filled{border-color:var(--wine-soft); background:#fdf9f9}
body.show-ans .circle.filled{border-color:var(--wine); border-width:1.5px}
body.show-ans .order-row .ob.filled{border-color:var(--wine); color:var(--wine)}
.blank.filled{display:flex; align-items:flex-end; padding-bottom:1px}
.blank.filled .fx{font-size:11.5px; line-height:1.35}
.box.filled .fx{font-size:11.5px; line-height:1.5}

/* ---------- 교사용 ---------- */
body.show-ans .blank.filled{display:flex; align-items:flex-end; padding-bottom:1px}
.blank.boxtdbody.show-ans td.ans{display:none}
body.show-ans .ans{display:block}
.ans-box{border:1px solid var(--wine-soft); background:#fdf6f6;
  padding:7px 10px; font-size:11.5px; margin-top:6px}
.ans-box .k{font-weight:700; color:var(--wine); margin-right:5px}
.ans-box .tip{margin-top:4px; color:var(--wine-soft)}

/* A-2는 남는 세로를 칸이 흡수하도록 — 아래쪽 백지 방지
   (짧은 지문일수록 트리 칸과 요지 박스가 자동으로 커진다) */
@media print{
  /* ⚠️ flex 세로 흡수는 쓰지 않는다 — 마지막 STEP이 페이지 밖으로 밀려 잘린다 */
  body{background:#fff}
  .toolbar,.empty{display:none}
  .sheet{display:block; width:auto; min-height:auto; margin:0; padding:0;
         box-shadow:none; background:#fff; page-break-after:auto; overflow:visible}
  .sheet + .sheet{page-break-before:always}
  .sheet:last-child{page-break-after:avoid}
  .step-grow{display:block}
  /* 한 덩어리로 유지 */
  .step{break-inside:avoid; page-break-inside:avoid}
  .regrip{break-inside:avoid; page-break-inside:avoid}
  .step:last-of-type{break-after:avoid; page-break-after:avoid}
  .foot{break-before:avoid; page-break-before:avoid; break-inside:avoid}
  .fast-item{break-inside:avoid}
  .para{break-inside:avoid}
  .pt{break-inside:avoid}
  /* 배경·밑줄 흑백 대비 */
  .passage,.box,.tree,.exam-col,.legend,.para-b{background:#fff}
  table.csbar{background:#fff}
  table.csbar th{background:#f0f0f0}
  body.show-ans table.csbar tr.isc{background:#eee !important}
  body.show-ans table.csbar td.c2 .gl{border-left-color:#000}
  .node .tag{background:#f4f4f4 !important; border-color:#bbb}
  .node.head-node .tag{background:#dcdcdc !important; border-color:#666}
  th{background:#f0f0f0}
  .ans-box{background:#f8f8f8; border-color:#999}
  .passage u,.exam-col u,.para-b u{text-decoration-color:#000; text-decoration-thickness:1.2px}
  .w{background:#f0f0f0 !important; border-bottom-color:#999}
  .fx{display:none !important}
  body.show-ans .fx{display:inline !important; color:#000 !important}
  body.show-ans .blank.filled{border-bottom-color:#000}
  .sheet[data-fit]::after{display:none}
}


.sheet[data-fit]::after{
  content:'자동축소 ' attr(data-fit); position:absolute; top:4px; right:6px;
  font-size:9px; color:var(--grey); background:#fff; padding:1px 5px; border:1px solid var(--line)}
.sheet{position:relative}
@media print{ .sheet[data-fit]::after{display:none} }

/* 지문 + 오른쪽 코어/서포트 표 */
.pwrap{display:flex; align-items:flex-start; margin-bottom:2.5mm; gap:0}
.pwrap .passage{flex:1; margin-bottom:0; border:1px solid var(--ink); border-right:0;
  align-self:stretch}
table.csbar{flex:0 0 46mm; width:46mm; border-collapse:collapse;
  border:1px solid var(--ink); background:#fff; table-layout:fixed}
table.csbar th{background:#f2ece0; font-size:10.5px; color:var(--wine); font-weight:700;
  text-align:center; padding:4px 2px; border:1px solid var(--ink);
  white-space:nowrap; letter-spacing:0}
table.csbar td{border:1px solid var(--ink); padding:0; height:26px;
  text-align:center; vertical-align:middle; white-space:nowrap}
table.csbar td.c0{font-family:'Space Grotesk',sans-serif; font-size:11.5px;
  color:var(--wine); font-weight:700}
table.csbar td.c1{font-size:14px}
table.csbar td.c2{position:relative}
table.csbar td.c3{font-family:'Noto Serif',serif; font-size:10.5px;
  font-style:italic; color:var(--wine); padding:0 3px; white-space:normal}
body.show-ans table.csbar tr.ispv{background:#f6ece9}
body.show-ans table.csbar tr.ispv td{border-top:2px solid var(--wine-soft)}
table.csbar th.cshelp{font-size:9.5px; font-weight:500; color:var(--ink);
  background:#fbf8f2; padding:3px 4px; letter-spacing:0; white-space:normal}
body.show-ans table.csbar tr.isc{background:#faf3e2}
body.show-ans table.csbar td.c1 .fx{color:var(--wine); font-weight:700}
body.show-ans .csrow.isc{background:#faf3e2}
body.show-ans .csrow .c1 .fx{color:var(--wine); font-weight:700}
/* 그룹 세로선 (해설) */
body.show-ans table.csbar td.c2 .gl{display:block !important; position:absolute;
  left:10px; top:0; bottom:0; border-left:2px solid var(--gold)}
table.csbar td.c2 .gl{display:none}

.csgrid{display:flex; flex-wrap:wrap; gap:6px}
.cs{display:inline-flex; align-items:center; gap:5px; border:1px solid var(--line);
  background:#fff; padding:3px 8px 3px 6px}
.cs b{font-family:'Space Grotesk',sans-serif; font-size:12px; color:var(--wine)}
.cs .mk{width:22px; height:22px; border:1px solid var(--ink); display:inline-flex;
  align-items:center; justify-content:center; font-style:normal; font-size:13px}
body.show-ans .cs.isc{background:var(--gold-soft); border-color:var(--gold)}
body.show-ans .cs .mk .fx{color:var(--wine); font-weight:700}


/* 재풀이 답 비교칸 (B지·속독지 공용) */
.regrip{display:flex; gap:12px; align-items:flex-end}
.rg-cell{display:flex; flex-direction:column; gap:3px}
.rg-cell.wide{flex:1}
.rg-cell label{font-size:10.5px; color:var(--grey)}
.rg-cell .circle{width:26px; height:26px}
.sheet.merged .rg-cell .circle{width:22px; height:22px}
.sheet.merged .rg-cell label{font-size:9.8px}
.sheet-f .rg-cell .circle{width:20px; height:20px}
.sheet-f .rg-cell label{font-size:10.6px}
.sheet-f .regrip{gap:9px}

/* A-1+A-2 한 장 — 최대 압축 */
.sheet.merged{padding:10mm 12mm}
.sheet.merged .head{margin-bottom:2mm; padding-bottom:3px}
.sheet.merged .head .t2{font-size:15.5px}
.sheet.merged .namebar{margin-bottom:2.4mm; font-size:10.6px}
.sheet.merged .namebar div{padding:2px 7px}
.sheet.merged .qnum{font-size:13.2px; margin-bottom:3px}
.sheet.merged .passage{font-size:12.6px; line-height:1.68; padding:7px 10px; margin-bottom:2.2mm}
.sheet.merged .note{font-size:9.5px; margin-bottom:1.4mm}
.sheet.merged .choices{font-size:11.8px; line-height:1.65; margin-bottom:2.2mm}
.sheet.merged .step{margin-bottom:1.6mm}
.sheet.merged .step-h{margin-bottom:3px; padding-bottom:2px}
.sheet.merged .step-h .ttl{font-size:12.8px}
.sheet.merged .step-h .hint{font-size:10.3px}
.sheet.merged .field{margin-bottom:3px}
.sheet.merged .field label{font-size:10.4px; margin-bottom:2px}
.sheet.merged .blank{height:20px}
.sheet.merged .blank.tall{height:30px}
.sheet.merged .node .wr{min-height:24px}
.sheet.merged .node{margin-bottom:2px; gap:6px}
.sheet.merged .node .tag{flex:0 0 100px; font-size:10.4px; padding:2px 6px}
.sheet.merged .tree{padding:5px 8px}
.sheet.merged .trunk-label{font-size:10.2px; margin-bottom:4px}
.sheet.merged .switchline{margin:4px 0; font-size:9.5px}
.sheet.merged .box.tall{min-height:34px}
.sheet.merged th,.sheet.merged td{padding:3px 7px; font-size:10.8px}
.sheet.merged td.mine,.sheet.merged td.filled{height:22px}
.sheet.merged .note-if{font-size:10.2px; padding:3px 0 3px 7px; margin-top:4px}
.sheet.merged .legend{padding:4px 8px; font-size:10.2px; gap:10px; margin-bottom:4px}
.sheet.merged .pick{font-size:11.2px; gap:13px}
.sheet.merged .answer-row{margin-top:1.5mm}
.sheet.merged .circle{width:19px; height:19px}
.sheet.merged .foot{margin-top:2mm; font-size:9px}
.sheet.merged .ans-box{font-size:10px; padding:4px 7px; margin-top:3px}

/* STEP 7·8이 붙는 A-2 — 트리 칸을 줄여 1장 유지 */
.sheet.hasx .node .wr{min-height:24px}
.sheet.hasx .node{margin-bottom:4px}
.sheet.hasx.dense .node .wr{min-height:27px}
.sheet.hasx.dense .node{margin-bottom:3px}
.sheet.hasx .box.tall{min-height:36px}
.sheet.hasx .step{margin-bottom:3mm}

/* 긴 지문(10문장 이상) 자동 압축 — A4 1장 유지 */
.sheet.dense .passage{font-size:14.2px; line-height:1.82; padding:6px 9px; margin-bottom:2mm}
.sheet.dense .choices{font-size:13.4px; line-height:1.8; margin-bottom:2.5mm}
.sheet.dense .step{margin-bottom:2.5mm}
.sheet.dense .step-h{margin-bottom:3px}
.sheet.dense th,.sheet.dense td{padding:3px 8px; font-size:11.2px}
.sheet.dense td.mine,.sheet.dense td.filled{height:22px}
.sheet.dense .blank{height:19px}
.sheet.dense .field{margin-bottom:4px}
.sheet.dense .node{margin-bottom:2px}
.sheet.dense .node .wr{min-height:23px}
.sheet.dense .node .tag{font-size:10px; padding:2px 5px}
.sheet.dense .tree{padding:6px 9px}
.sheet.dense .box.tall{min-height:34px}
.sheet.dense .note-if{font-size:10px; padding:2px 0 2px 7px}
.sheet.dense .legend{padding:4px 8px; font-size:10px; margin-bottom:3px}
.sheet.dense .head{margin-bottom:2.5mm; padding-bottom:4px}
.sheet.dense .namebar{margin-bottom:2.5mm}
.sheet.dense .foot{margin-top:2.5mm}

/* ---------- 장문 배열 (43~45) ---------- */
.sheet-o .head{border-bottom-color:var(--steel2)}
.sheet-o .head .t1{color:var(--steel2)}
.sheet-o .step-h .n{background:var(--steel2)}
.para{display:flex; gap:8px; margin-bottom:2.4mm; break-inside:avoid}
.para-tag{flex:0 0 26px; font-family:'Space Grotesk',sans-serif; font-weight:700;
  font-size:11px; color:var(--steel2); text-align:center; padding-top:6px}
.para-b{flex:1; border:1px solid var(--line); background:#fff; padding:8px 11px;
  font-family:'Noto Serif',serif; font-size:12.8px; line-height:1.75; text-align:justify}
.para-b u{text-decoration-thickness:1.1px; text-underline-offset:3px;
  text-decoration-skip-ink:none; box-decoration-break:clone}
.order-row{display:flex; align-items:center; gap:6px; margin-bottom:2mm}
.order-row .ob{width:44px; height:26px; border:1px solid var(--line); background:#fff;
  display:flex; align-items:center; justify-content:center;
  font-family:'Space Grotesk',sans-serif; font-size:12px; font-weight:700}
.order-row .oa{color:var(--grey); font-size:12px}

/* ---------- 속독지 ---------- */
.sheet-f .head{border-bottom-color:var(--gold)}
.sheet-f .head .t1{color:var(--gold)}
.fast-item{border-top:1px solid var(--line); padding-top:2.2mm; margin-bottom:1.8mm; break-inside:avoid}
.fast-item:first-of-type{border-top:0; padding-top:0}
/* 3문항을 A4 한 장에 담기 위한 압축 — 훈련지보다 촘촘하다 */
.sheet-f{padding:10mm 12mm}
.sheet-f .passage{margin-bottom:2mm; padding:7px 10px; line-height:1.72; font-size:13.2px}
.sheet-f .qnum{font-size:13.4px; margin-bottom:3px}
.sheet-f .field{margin-bottom:2px}
.sheet-f .field label{margin-bottom:1px}
.sheet-f .blank{height:24px}
.sheet-f .answer-row{margin-top:.8mm}
.sheet-f .circle{width:19px; height:19px}
.sheet-f .legend{padding:5px 9px; margin-bottom:3mm; gap:12px; font-size:11px}
.sheet-f .namebar{margin-bottom:2.2mm; font-size:10px}
.sheet-f .foot{margin-top:2mm}
.sheet-f .head{margin-bottom:2.4mm; padding-bottom:4px}
.sheet-f .head .t2{font-size:15.5px}
/* 교사용 해설을 켠 채로 인쇄하면 3문항이 한 장을 넘어감 → 해설만 압축 */
.sheet-f .ans-box{font-size:10.5px; padding:5px 8px; margin-top:4px; break-inside:avoid}

/* ---------- B지 ---------- */
.legend{border:1px solid var(--line); background:#fff; padding:7px 11px; margin-bottom:4mm;
  display:flex; gap:16px; flex-wrap:wrap; align-items:center; font-size:11px}
.legend .lgttl{font-size:10.8px; letter-spacing:.1em; color:var(--green); font-weight:700}
.legend b{font-family:'Space Grotesk',sans-serif; font-size:13px; color:var(--ink)}
.exam-wrap{display:flex; margin-bottom:4mm}
.exam-col{flex:1; border:1px solid var(--ink); background:#fff; padding:10px 13px;
  font-family:'Noto Serif',serif; font-size:15px; line-height:1.9; text-align:justify}
.exam-col p{margin:0 0 8px; text-indent:1.2em}
.exam-col .ch{text-indent:0; font-size:13.4px; line-height:1.85; margin-top:9px}
.timer{display:inline-flex; align-items:center; gap:5px; border:1px solid var(--green);
  color:var(--green); font-size:11px; font-weight:700; padding:2px 9px}
.check-strip{display:grid; grid-template-columns:1fr 1fr 2fr; gap:0 12px}

.foot{margin-top:4mm; padding-top:4px; border-top:1px solid var(--line);
  font-size:9.5px; color:var(--grey); display:flex; justify-content:space-between;
  break-inside:avoid; break-before:avoid; page-break-before:avoid}

/* ---------- 인쇄 ---------- */
@page{size:A4; margin:11mm}
@media print{
  body{background:#fff}
  .toolbar,.empty{display:none}
  .sheet{width:auto; min-height:auto; margin:0; padding:0; box-shadow:none; background:#fff}
  .sheet + .sheet{page-break-before:always}
  .sheet{page-break-after:auto; overflow:visible}
  /* 푸터가 홀로 넘어가지 않도록: 마지막 STEP + 푸터를 붙여둔다 */
  .step:last-of-type{break-after:avoid; page-break-after:avoid}
  /* 재풀이는 반드시 앞 STEP과 같은 장에 — 잘리면 훈련이 끊긴다 */
  .regrip{break-inside:avoid; page-break-inside:avoid}
  .step{break-inside:avoid; page-break-inside:avoid}
  .foot{break-before:avoid; page-break-before:avoid; break-inside:avoid}
  /* 빈 페이지 생성 방지 */
  .sheet:last-child{page-break-after:avoid}
  .passage,.box,.tree,.exam-col,.legend{background:#fff}
  .node .tag{background:#f4f4f4 !important; border-color:#bbb}
  .node.head-node .tag{background:#dcdcdc !important; border-color:#666}
  th{background:#f0f0f0}
  .passage u,.exam-col u{text-decoration-color:#000; text-decoration-thickness:1.2px}
  body.show-ans   .w{background:#f0f0f0 !important; border-bottom-color:#999}
  .fx{display:none !important}
  body.show-ans .fx{display:inline !important; color:#000 !important}
  body.show-ans .blank.filled{border-bottom-color:#000}
    .ans-box{background:#f8f8f8; border-color:#999}
}
@media (max-width:820px){
  .sheet{width:auto; padding:16px}
  .grid2,.grid3,.check-strip{grid-template-columns:1fr}
  .exam-wrap{flex-direction:column}
  .exam-col{flex:1}
  }
</style>
</head>
<body>

<div class="toolbar">
  <span class="brand">대단한영어 · 수능 파이널 워크시트</span>

  <label for="selY">연도</label>
  <select id="selY"></select>

  <label for="selQ">문항</label>
  <select id="selQ"></select>

  <label for="selP">지문</label>
  <select id="selP"></select>

  <span id="cnt" style="font-size:11px; opacity:.8"></span>

  <label for="selO">출력</label>
  <select id="selO">
    <option value="ab" selected>훈련지 A + 재풀이 B</option>
    <option value="a">훈련지 A만</option>
    <option value="b">재풀이 B만</option>
  </select>

  <label for="selL">빈칸 단계</label>
  <select id="selL">
    <option value="0">0 · 코어/서포트만 (라벨 없음) — 입문</option>
    <option value="1">1 · 번호+라벨 제공 (8월)</option>
    <option value="2">2 · 머리 라벨만 (9월)</option>
    <option value="3">3 · 번호만, 라벨 백지 (10월 초)</option>
    <option value="4">4 · 완전 백지 + 시간 (10월 후반~11월)</option>
  </select>

  <span class="sp"></span>
  <span id="warnAns" style="display:none; font-size:11px; color:#ffe08a">
    해설 ON — 인쇄하면 장수가 늘어납니다
  </span>
  <button id="btnAns" type="button">교사용 해설 보기</button>
  <button type="button" onclick="window.print()">인쇄</button>
</div>

<div id="root"></div>

<script src="passages_final.js?v=20260828l"></script>
<script>
(function(){
  var CN = "①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮";
  var root = document.getElementById('root');
  var selP = document.getElementById('selP');
  var selL = document.getElementById('selL');
  var btn  = document.getElementById('btnAns');

  var DATA = window.PASSAGES;
  if(!DATA || !DATA.length){
    root.innerHTML = '<div class="empty"><h2>지문 데이터를 찾을 수 없습니다</h2>'
      + '<code>passages_final.js</code> 파일이 이 HTML과 <b>같은 폴더</b>에 있어야 합니다.<br>'
      + '두 파일을 함께 내려받아 한 폴더에 넣고 다시 열어주세요.</div>';
    document.querySelector('.toolbar .sp').previousElementSibling;
    return;
  }

  function esc(s){ return s == null ? '' : String(s); }
  function cn(i){ return CN.charAt(i-1) || ('('+i+')'); }

  /* ---------- 조각 ---------- */
  function head(p, part, total, extra){
    var titles = {1:['FLOW READING · 훈련지 A', '코어를 찾아 흐름을 잡는다'],
                  2:['FLOW READING · 훈련지 A', '흐름과 요지'],
                  3:['RESOLVE · 재풀이 B', '같은 지문을 다시 푼다']};
    var t = titles[part];
    return '<div class="head"><div><div class="t1">'+t[0]+'</div><div class="t2">'+t[1]+'</div></div>'
      + '<div class="meta">'+esc(p.src)+' · '+esc(p.qtype)
      + ' · 난이도 '+ new Array((p.star||1)+1).join('★') + (extra ? ' · '+extra : '')
      + '<br><span class="nm">이름 ______________ &nbsp;/&nbsp; 날짜 ________</span>'
      + (total > 1 ? '<span class="g" style="margin-left:10px">'+part+'/'+total+'</span>' : '')
      + '</div></div>';
  }
  function namebar(cols){
    return '<div class="namebar">'+cols.map(function(c){return '<div>'+c+'</div>'}).join('')+'<div></div></div>';
  }
  /* 해설 ON일 때 빈칸/박스 자리에 모범답안을 직접 넣는다.
     val이 없으면 빈칸 그대로. 인쇄 시 학생용은 해설 OFF로 뽑을 것. */
  function fill(val, cls){
    var c = cls || 'blank';
    if(!val) return '<div class="'+c+'"></div>';
    return '<div class="'+c+' filled"><span class="fx">'+val+'</span></div>';
  }
  function stepH(n, ttl, hint){
    return '<div class="step-h"><span class="n">'+n+'</span><span class="ttl">'+ttl+'</span>'
      + (hint ? '<span class="hint">'+hint+'</span>' : '')+'</div>';
  }
  function choices(p){
    if(p.vocab) return '';   // 어휘형: 선택지 = 지문 속 밑줄. 목록 중복 렌더 안 함
    return '<div class="choices">'+p.choices.map(function(c,i){
      return '<div><span class="cn">'+cn(i+1)+'</span>'+c+'</div>';
    }).join('')+'</div>';
  }

  /* ---------- A-1 ---------- */
  function sheetA1(p, lv){
    // 문장별 span (표는 오른쪽에 균등 분할로 붙는다)
    var passage = p.sents.map(function(s,i){
      return '<span class="s" data-n="'+(i+1)+'"><span class="snum">'+cn(i+1)+'</span>'+s+' </span>';
    }).join('');

    var plain = p.sents.join(' ').replace(/<[^>]+>/g,'');
    // A-1+A-2를 한 장에 담을 수 있는지 세로 길이를 추정해서 판정한다.
    // (merged 스타일 기준: 지문 11px/1.42, 트리 노드 21px, 표 행 18px)
    // 전 지문 1장. 넘치면 fitSheets가 줄인다(하한 0.95)
    p._merge = true;
    var dense = p._merge ? ' dense merged'
              : ((plain.length >= 1300 || p.sents.length >= 10) ? ' dense' : '');
    var h = '<section class="sheet sheet-a sheet-a2'+dense+'" data-id="'+p.id+'">';
    h += head(p, 1, p._merge ? 1 : 3, '단계 '+lv);
    h += '<div class="qnum">'+p.qnum+'. '+p.qtext+'</div>';
    h += '<div class="pwrap" data-id="'+p.id+'">'
      + '<div class="passage">'+passage+'</div>'
      + '<table class="csbar">'
      +   '<colgroup><col style="width:32px"><col style="width:32px"><col><col style="width:58px"></colgroup>'
      +   '<tr><th colspan="4" class="cshelp">코어 <b>●</b> · 서포트 <b>세로선</b> · 전환점에 <b>신호어</b></th></tr>'
      +   '<tr><th>문장</th><th>코어</th><th>서포트</th><th>전환</th></tr>'
      +   p.tree.map(function(nd){
            var isPv = p.pivotAt && nd.n === p.pivotAt;
            return '<tr class="csrow'+(nd.head?' isc':'')+(isPv?' ispv':'')+'">'
              + '<td class="c0">'+cn(nd.n)+'</td>'
              + '<td class="c1"><span class="fx">'+(nd.head?'●':'')+'</span></td>'
              + '<td class="c2"><span class="fx gl"></span></td>'
              + '<td class="c3"><span class="fx">'+(isPv?esc(p.pivot.sig):'')+'</span></td></tr>';
          }).join('')
      + '</table></div>';
    if(p.note) h += '<div class="note">'+p.note+'</div>';
    h += choices(p);

    /* STEP 1 */
    /* 건너뛰기·전환 해설만 (학생용에는 안 보임) */
    var nSkip = p.skip ? p.skip.filter(function(r){ return r.skip; }).length : 0;
    h += '<div class="ans"><div class="ans-box" style="margin:0 0 3mm">'
      + (nSkip ? p.skip.filter(function(r){return r.skip;}).map(function(r){
            return '<div><span class="k">'+cn(r.n)+' 건너뜀</span>'+esc(r.why)+'</div>'; }).join('')
              : '<div><span class="k">건너뛰기</span>표지가 없는 글 — 전 문장을 읽는다</div>')
      + (p.pivotSub ? '<div class="tip"><b>전환</b> '+esc(p.pivotSub)+'</div>'
                    : '<div class="tip"><b>전환</b> 없음 — 처음 방향이 끝까지 간다</div>')
      + '</div></div>';

    h += '<div class="note-if" style="margin-top:4px">'
      + '오른쪽 표에서 코어에 <b>●</b>. '
      + '<b>서포트</b> 열에는 어느 코어에 붙는지 <b>세로선</b>으로 묶어라.</div></div>';

    if(p._merge) return h;   // A-2가 같은 장에 이어붙는다
    return h + '<div class="foot"><span>대단한영어 GREATENG · 수능 파이널 흐름 독해</span><span>훈련지 A-1</span></div></section>';
  }

  /* ---------- A-2 ---------- */
  function sheetA2(p, lv){
    // STEP 7·8이 붙으면 세로가 길어지므로 트리 칸을 조금 줄인다
    var dense = (p._merge || p.tree.length >= 10 ? ' dense' : '') + (p.vocab || p.implied ? ' hasx' : '');
    var h = '';
    if(!p._merge){
      h = '<section class="sheet sheet-a sheet-a2'+dense+'" data-id="'+p.id+'">'
        + head(p, 2, 3, '단계 '+lv);
    }

    /* STEP 4 */

    /* STEP 5 */
    var heads = p.tree.filter(function(n){return n.head}).map(function(n){return cn(n.n)}).join('·');
    h += '<div class="step step-grow">'+stepH('STEP 1','요지 재구성', lv<=3 ? '머리 문장('+heads+')만 이어서 한 문장으로' : '한 문장으로')
      + fill(esc(p.gist), 'box tall')
      + '<div class="answer-row"><span class="lab">정답</span>'
      + '<span class="circle filled"><span class="fx" style="font-size:13px;font-weight:700">'
      + cn(p.ans)+'</span></span>'
      + '<span class="lab" style="margin-left:14px">근거 문장 번호</span>'
      + fill(heads+' (머리 문장)')+'</div>'
      + (Object.keys(p.wrong||{}).length || p.wrongNote
          ? '<div class="ans"><div class="ans-box">'
            + (Object.keys(p.wrong||{}).length
                ? '<div><span class="k">오답</span>'
                  + Object.keys(p.wrong).map(function(k){return cn(+k)+' '+p.wrong[k]}).join(' · ')
                  + '</div>' : '')
            + (p.wrongNote ? '<div class="tip">※ '+esc(p.wrongNote)+'</div>' : '')
            + '</div></div>' : '')
      + '</div>';

    return h + '<div class="foot"><span>대단한영어 GREATENG · 수능 파이널 흐름 독해</span>'
      + '<span>'+(p._merge ? '훈련지 A' : '훈련지 A-2')+'</span></div></section>';
  }

  /* ---------- B ---------- */
  function sheetB(p, lv){
    var flat = p.sents.join(' ');
    var h = '<section class="sheet sheet-b" data-id="'+p.id+'">';
    h += head(p, 3, 3, '');
    h += namebar(['이름','날짜','걸린 시간']);

    if(lv <= 3){
        + '<span><b>●</b> 머리 문장</span><span><b>–</b> 딸림(예시·부연)</span>'
        + '<span><b>○</b> 신호어에 동그라미</span><span><b>/</b> 전환점에 빗금</span>'
        + '<span><b>+ −</b> 속성 방향</span>'
        + '<span class="g" style="font-size:10px">트리는 머릿속으로. 종이엔 이 기호만.</span></div>';
    }

    h += '<div class="qnum" style="display:flex;align-items:center;gap:10px">'
      + '<span>'+p.qnum+'. '+p.qtext+'</span>'
      + '<span class="timer">목표 '+(p.time||60)+'초</span></div>';

    h += '<div class="exam-wrap"><div class="exam-col"><p>'+flat+'</p>'
      + (p.note ? '<p style="text-align:right;text-indent:0;font-size:11px;margin-bottom:2px">'+p.note+'</p>' : '')
      + (p.vocab ? '' : '<div class="ch">'+p.choices.map(function(c,i){
          return cn(i+1)+' '+c;
        }).join('<br>')+'</div>')+'</div></div>';

    h += '<div class="step step-grow">'+stepH('확인','푼 다음 30초 안에','A지 트리를 안 보고 채운다')
      + '<div class="check-strip">'
      + '<div class="field"><label>핵심어</label>'+fill(esc(p.key))+'</div>'
      + '<div class="field"><label>방향 (+ / −)</label>'
      + fill(p.dir==='통념' ? '통념 → 반전' : (p.dir==='긍정'?'+':'−'))+'</div>'
      + '<div class="field"><label>머리 문장은 어디였나 (첫 3단어)</label>'
      + fill(p.tree.filter(function(n){return n.head})
             .map(function(n){return cn(n.n)}).join(' · '))+'</div></div>'
      + '<div class="field"><label>요지 한 줄</label>'+fill(esc(p.gist),'blank tall')+'</div>'
      + '<div class="regrip">'
      + '<div class="rg-cell"><label>처음 답</label><div class="circle"></div></div>'
      + '<div class="rg-cell"><label>다시 고른 답</label>'
      + '<div class="circle filled"><span class="fx" style="font-size:12px;font-weight:700">'
      + cn(p.ans)+'</span></div></div>'
      + '<div class="rg-cell wide"><label>A지 때와 답이 달랐다면 이유</label>'
      + '<div class="blank"></div></div></div></div>';

    h += (p.teachNote ? '<div class="ans"><div class="ans-box">'
        + '<span class="k">점검</span>기호만 썼는가 · 신호어를 스스로 찾았는가 · '
        + '코어를 서포트와 헷갈리지 않았는가 · '+(p.time||60)+'초 안에 끝났는가'
        + '<div class="tip">'+esc(p.teachNote)+'</div></div></div>' : '');

    return h + '<div class="foot"><span>대단한영어 GREATENG · 수능 파이널 흐름 독해</span><span>실전 전이지 B</span></div></section>';
  }

  /* ---------- 장문 순서배열 (43~45형) ---------- */
  function sheetOrder(p, lv){
    var h = '<section class="sheet sheet-o">';
    h += '<div class="head"><div><div class="t1">LONG · 단락 배열</div>'
      + '<div class="t2">시간축과 지칭으로 잇는다</div></div>'
      + '<div class="meta">'+esc(p.src)+'<br><span class="timer">목표 '+(p.time||150)+'초</span></div></div>';
    h += namebar(['이름','날짜','걸린 시간']);

    h += '<div class="legend" style="border-color:var(--steel2)">'
      + '<span class="lgttl" style="color:var(--steel2)">이 유형은 흐름 트리를 그리지 않는다</span>'
      + '<span>① <b>시간 순서</b>로 잇는다</span>'
      + '<span>② 대명사가 <b>누구</b>인지 따라간다</span>'
      + '<span>③ 각 단락 <b>첫 문장</b>만 봐도 순서가 보인다</span></div>';

    p.paras.forEach(function(pa){
      h += '<div class="para"><div class="para-tag">('+pa.tag+')</div>'
        + '<div class="para-b">'+pa.text+'</div></div>';
    });
    if(p.note) h += '<div class="note">'+p.note+'</div>';

    /* 단락 첫 문장 요약 */
    h += '<div class="step">'+stepH('STEP A','단락별 한 줄','첫 문장만 보고 쓴다')
      + '<table><tr><th style="width:8%">단락</th><th style="width:46%">무슨 일이 있었나</th>'
      + '<th>그래서 앞뒤 어디에 오나</th></tr>'
      + p.paras.map(function(pa){
          return '<tr><td style="text-align:center" class="cn">('+pa.tag+')</td>'
            + '<td class="filled" style="height:24px"><span class="fx">'+esc(pa.gist)+'</span></td>'
            + '<td class="filled"><span class="fx">'+esc(pa.cue)+'</span></td></tr>';
        }).join('')
      + '</table></div>';

    h += '<div class="foot"><span>대단한영어 GREATENG · 수능 파이널 흐름 독해</span>'
      + '<span>장문 배열 1/2</span></div></section>';

    /* ===== 2장 ===== */
    h += '<section class="sheet sheet-o">';
    h += '<div class="head"><div><div class="t1">LONG · 단락 배열</div>'
      + '<div class="t2">순서와 지칭</div></div>'
      + '<div class="meta">'+esc(p.src)+'<br><span class="g">2 / 2</span></div></div>';

    /* 순서 */
    h += '<div class="step">'+stepH('STEP B','순서 세우기')
      + '<div class="order-row">'
      + '<span class="ob">(A)</span><span class="oa">→</span>'
      + p.orderAns.map(function(t,i){
          return '<span class="ob filled"><span class="fx">('+t+')</span></span>'
            + (i<p.orderAns.length-1 ? '<span class="oa">→</span>' : '');
        }).join('')
      + '</div>'
      + '<div class="answer-row"><span class="lab">43번 정답</span>'
      + '<span class="circle filled"><span class="fx" style="font-size:13px;font-weight:700">'
      + cn(p.ans43)+'</span></span>'
      + '<span class="lab" style="margin-left:14px">그렇게 본 근거</span>'
      + fill(esc(p.orderWhy))+'</div></div>';

    /* 지칭 */
    h += '<div class="step">'+stepH('STEP C','지칭 추적','44번 - 하나만 다른 사람을 가리킨다')
      + '<table><tr><th style="width:10%">밑줄</th><th style="width:24%">표현</th>'
      + '<th style="width:26%">누구를 가리키나</th><th>근거</th></tr>'
      + p.refs.map(function(r){
          return '<tr><td style="text-align:center" class="cn">('+r.tag+')</td>'
            + '<td class="eng" style="width:auto"><b>'+esc(r.word)+'</b></td>'
            + '<td class="filled" style="height:24px"><span class="fx">'
            + (r.who===p.refOdd ? '<b style="color:var(--wine)">'+esc(r.who)+' ← 정답</b>' : esc(r.who))
            + '</span></td>'
            + '<td class="filled"><span class="fx">'+esc(r.why)+'</span></td></tr>';
        }).join('')
      + '</table>'
      + '<div class="answer-row"><span class="lab">44번 정답</span>'
      + '<span class="circle filled"><span class="fx" style="font-size:13px;font-weight:700">'
      + cn(p.ans44)+'</span></span>'
      + '<span class="lab" style="margin-left:14px">45번 정답</span>'
      + '<span class="circle filled"><span class="fx" style="font-size:13px;font-weight:700">'
      + cn(p.ans45)+'</span></span>'
      + '<span class="lab" style="margin-left:14px">45번 틀린 이유</span>'
      + fill(esc(p.why45))+'</div></div>';

    /* STEP D — 다시 풀기 */
    h += '<div class="step">'+stepH('STEP D','다시 풀기','순서·지칭을 잡은 <b>뒤에</b> 다시 고른다')
      + '<table><tr><th style="width:16%">문항</th><th style="width:16%">처음 답</th>'
      + '<th style="width:16%">다시 고른 답</th><th>바뀌었다면 무엇을 놓쳤나</th></tr>'
      + [[43,p.ans43],[44,p.ans44],[45,p.ans45]].map(function(r){
          return '<tr><td style="text-align:center" class="cn">'+r[0]+'번</td>'
            + '<td style="height:26px"></td>'
            + '<td class="filled" style="text-align:center"><span class="fx" '
            + 'style="font-weight:700">'+cn(r[1])+'</span></td><td></td></tr>';
        }).join('')
      + '</table>'
      + '<div class="note-if">순서를 다시 세운 뒤 답이 바뀌었다면 <b>단락 첫 문장 읽기가 일한 것</b>이다.</div>'
      + '</div>';

    h += (p.teachNote ? '<div class="ans"><div class="ans-box">'+p.teachNote+'</div></div>' : '');
    return h + '<div class="foot"><span>대단한영어 GREATENG · 수능 파이널 흐름 독해</span><span>장문 배열 2/2</span></div></section>';
  }

  /* ---------- 속독지 (fast:true 지문 3개를 한 장에) ---------- */
  function sheetFast(list, lv){
    var h = '<section class="sheet sheet-f">';
    h += '<div class="head"><div><div class="t1">SPEED · 속독지</div>'
      + '<div class="t2">첫 문장만 보고 끝낸다</div></div>'
      + '<div class="meta">18 · 19 · 20번<br><span class="timer">3문항 합계 목표 150초</span></div></div>';
    h += namebar(['이름','날짜','걸린 시간']);

    h += '<div class="legend" style="border-color:var(--gold)">'
      + '<span class="lgttl" style="color:var(--wine)">규칙</span>'
      + '<span>트리 <b>안 그린다</b></span>'
      + '<span>도입부에서 소재·속성·방향만</span>'
      + '<span>막히면 <b>넘긴다</b> — 여기서 시간 쓰면 뒤가 무너진다</span></div>';

    list.forEach(function(p, i){
      h += '<div class="fast-item">'
        + '<div class="qnum" style="display:flex;align-items:center;gap:8px">'
        + '<span>'+p.qnum+'. '+p.qtext+'</span>'
        + '<span class="timer">'+(p.time||50)+'초</span></div>'
        + '<div class="passage">'+p.sents.join(' ')
        + (p.note ? '<div class="note" style="margin:2px 0 0">'+p.note+'</div>' : '')
        + '</div>';

      if(p.fastMode === 'mood'){
        /* 19번 심경 — 방향이 아니라 '앞→뒤 변화' */
        var mood = (p.choices[p.ans-1]||'').split('→');
        h += '<div class="grid3" style="grid-template-columns:1fr 1fr 1.4fr">'
          + '<div class="field"><label>앞부분 심경</label>'+fill((mood[0]||'').trim())+'</div>'
          + '<div class="field"><label>뒷부분 심경</label>'+fill((mood[1]||'').trim())+'</div>'
          + '<div class="field"><label>바뀐 지점 (단서 한 단어)</label>'
          + fill(esc(p.moodPivot||''))+'</div></div>';
      } else {
        h += '<div class="grid3">'
          + '<div class="field"><label>소재</label>'+fill(esc(p.key||''))+'</div>'
          + '<div class="field"><label>속성</label>'+fill(esc(p.attr||''))+'</div>'
          + '<div class="field"><label>방향</label>'
          + '<div class="pick" style="gap:11px">'
          + [['+','긍정'],['−','부정'],['통념','통념']].map(function(d){
              return '<span><i class="chk"></i>'+d[0]
                + (p.dir===d[1]?'<span class="fx">✓</span>':'')+'</span>';
            }).join('')
          + '</div></div></div>';
      }

      h += '<div class="regrip" style="margin-top:1mm">'
        + '<div class="rg-cell"><label>처음</label><div class="circle"></div></div>'
        + '<div class="rg-cell"><label>다시</label>'
        + '<div class="circle filled"><span class="fx" style="font-size:12px;font-weight:700">'
        + cn(p.ans)+'</span></div></div>'
        + '<div class="rg-cell wide"><label>고른 근거 (몇 번째 문장 · 단서)</label>'
        + '<div class="blank filled"><span class="fx">'+esc(p.fastWhy)+'</span></div></div></div>';

      h += (p.teachNote ? '<div class="ans"><div class="ans-box">'+esc(p.teachNote)+'</div></div>' : '');
      h += '</div>';
    });

    return h + '<div class="foot"><span>대단한영어 GREATENG · 수능 파이널 흐름 독해</span><span>속독지</span></div></section>';
  }

  /* ---------- 분류 ---------- */
  function srcShort(x){ return String(x).replace(/\s*[\d–\-]+번\s*$/, ''); }   // "2025수능"
  function yearOf(x){ var m = String(x).match(/(\d{4})/); return m ? m[1] : '기타'; }
  function qKey(p){                                        // 문항 묶음 키
    if(p.fast) return 'fast';
    if(p.paras) return '43';
    if(p.qlabel) return String(p.qnum);
    return String(p.qnum);
  }
  function qLabelOf(p){
    if(p.fast) return '18·19·20 속독';
    if(p.paras) return '43–45 장문 배열';
    if(p.qlabel) return p.qlabel + ' ' + p.qtype;
    return p.qnum + '번 ' + p.qtype;
  }

  var selY = document.getElementById('selY');
  var selQ = document.getElementById('selQ');
  var cnt  = document.getElementById('cnt');
  var selO = document.getElementById('selO');

  var SORTED = DATA.slice().sort(function(a,b){
    var ya = yearOf(a.src), yb = yearOf(b.src);
    if(ya !== yb) return yb.localeCompare(ya);   // 연도는 최신 먼저
    return a.qnum - b.qnum;                      // 문항은 오름차순 (18→19→20)
  });

  function opt(sel, val, txt){
    var o = document.createElement('option');
    o.value = val; o.textContent = txt; sel.appendChild(o);
  }

  /* 연도 채우기 */
  function fillYears(){
    selY.innerHTML = '';
    opt(selY, '__all__', '전체 연도');
    var years = {};
    DATA.forEach(function(p){ var y = yearOf(p.src); years[y] = (years[y] || 0) + 1; });
    Object.keys(years).sort().reverse().forEach(function(y){    // 최신 연도가 위
      opt(selY, y, y + '수능 (' + years[y] + ')');
    });
  }

  /* 선택된 연도에 맞춰 문항 채우기 */
  function fillQs(){
    var y = selY.value;
    var pool = SORTED.filter(function(p){ return y === '__all__' || yearOf(p.src) === y; });
    selQ.innerHTML = '';
    opt(selQ, '__all__', '전체 문항');
    var seen = {}, keys = [];
    pool.forEach(function(p){
      var k = qKey(p);
      if(seen[k]) return; seen[k] = qLabelOf(p); keys.push(k);
    });
    keys.sort(function(a,b){
      var na = a === 'fast' ? 18 : parseInt(a, 10);
      var nb = b === 'fast' ? 18 : parseInt(b, 10);
      return na - nb;
    });
    keys.forEach(function(k){
      var n = pool.filter(function(p){ return qKey(p) === k; }).length;
      opt(selQ, k, seen[k] + (n > 1 ? ' (' + n + ')' : ''));
    });
  }

  /* 위 두 조건에 맞는 개별 지문 채우기 */
  function fillPs(){
    var y = selY.value, q = selQ.value;
    var pool = SORTED.filter(function(p){
      return (y === '__all__' || yearOf(p.src) === y)
          && (q === '__all__' || qKey(p) === q);
    });
    selP.innerHTML = '';
    opt(selP, '__all__', '해당 전체 (' + pool.length + ')');
    var fastSeen = {};
    pool.forEach(function(p){
      if(p.fast){
        var sy = srcShort(p.src);
        if(fastSeen[sy]) return; fastSeen[sy] = 1;
        opt(selP, '__fast__' + sy, '18·19·20 속독 · ' + sy);
      } else {
        opt(selP, p.id, (p.qlabel || (p.qnum + '번')) + ' ' + p.qtype + ' · ' + srcShort(p.src));
      }
    });
  }

  function currentList(){
    var y = selY.value, q = selQ.value, pick = selP.value;
    return SORTED.filter(function(p){
      if(y !== '__all__' && yearOf(p.src) !== y) return false;
      if(q !== '__all__' && qKey(p) !== q) return false;
      if(pick === '__all__') return true;
      if(pick.indexOf('__fast__') === 0) return p.fast && srcShort(p.src) === pick.slice(8);
      return p.id === pick;
    });
  }

  /* ---------- 렌더 ---------- */
  function render(){
    var lv = +selL.value, html = '';
    var sel = currentList();

    var fast = sel.filter(function(p){ return p.fast; });
    var norm = sel.filter(function(p){ return !p.fast; });
    var byYear = {};
    fast.forEach(function(p){ (byYear[srcShort(p.src)] = byYear[srcShort(p.src)] || []).push(p); });
    Object.keys(byYear).forEach(function(y){ html += sheetFast(byYear[y], lv); });

    var mode = selO.value;
    norm.forEach(function(p){
      if(p.paras){ html += sheetOrder(p, lv); return; }
      if(mode !== 'b') html += sheetA1(p, lv) + sheetA2(p, lv);
      if(mode !== 'a') html += sheetB(p, lv);
    });

    var pages = sel.reduce(function(a, p){
      if(p.fast) return a;
      if(p.paras) return a + 2;
      var aPages = p._merge ? 1 : 2;
      return a + (mode === 'ab' ? aPages + 1 : (mode === 'a' ? aPages : 1));
    }, 0) + (fast.length ? Object.keys(byYear).length : 0);
    cnt.textContent = sel.length + '지문 · ' + pages + '장';

    root.innerHTML = html || '<div class="empty">조건에 맞는 지문이 없습니다.</div>';
    fitSheets();
  }

  /* ---------- 실측 맞춤 ----------
     추정식만으로는 브라우저 렌더 차이를 못 잡는다.
     그려진 뒤 실제 높이를 재서 A4 인쇄영역을 넘으면 zoom으로 줄인다. */
  function fitSheets(){
    var LIMIT = 273 * 96 / 25.4;              // A4 인쇄영역 세로(px)
    root.querySelectorAll('.sheet').forEach(function(sh){
      sh.style.zoom = '';                     // 초기화 후 재측정
      var inner = sh.scrollHeight
                - parseFloat(getComputedStyle(sh).paddingTop)
                - parseFloat(getComputedStyle(sh).paddingBottom);
      var pad = parseFloat(getComputedStyle(sh).paddingTop)
              + parseFloat(getComputedStyle(sh).paddingBottom);
      var need = inner + pad;
      if(need > LIMIT){
        var z = Math.min(1, (LIMIT - 4) / need);
        if(z < 0.95) z = 0.95;                  // 0.95 미만으로는 줄이지 않는다 (가독성)
        sh.style.zoom = z.toFixed(3);
        sh.dataset.fit = Math.round(z*100) + '%';
      } else {
        delete sh.dataset.fit;
      }
    });
    var shrunk = root.querySelectorAll('.sheet[data-fit]').length;
    if(shrunk) cnt.textContent += ' · ' + shrunk + '장 자동축소';
  }

  fillYears(); fillQs(); fillPs();
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(function(){ fitSheets(); });
  }
  window.addEventListener('beforeprint', fitSheets);
  selY.addEventListener('change', function(){ fillQs(); fillPs(); render(); });
  selQ.addEventListener('change', function(){ fillPs(); render(); });
  selP.addEventListener('change', render);
  selL.addEventListener('change', render);
  selO.addEventListener('change', render);

  btn.addEventListener('click', function(){
    var on = document.body.classList.toggle('show-ans');
    btn.classList.toggle('on', on);
    btn.textContent = on ? '교사용 해설 숨기기' : '교사용 해설 보기';
    document.getElementById('warnAns').style.display = on ? 'inline' : 'none';
  });

  render();
})();
</script>
</body>
</html>
